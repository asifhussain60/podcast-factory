        shipped_commit: 9da2357
        shipped_date: "2026-06-07"
        status: shipped
        notes: >
          Cross-references chapter source against knowledge.db corpus;
          surfaces gaps in coverage. For islamic_scholarly profile,
          emits a HALT requiring human review before proceeding to 0d.
          This is a manual_gate for Islamic books.

      - id: 0d
        name: Chapter design and episode contract authoring (LLM)
        inputs:
          - source/phonetic.txt
          - series-config.yaml
          - _system/gap-analysis.json
        outputs:
          - chapters/<ch-slug>/contract.yaml
          - _system/chapter-set-report.md
        prompt_file: _workspace/prompts/phase-0d-chapter-design.md
        code_files:
          - scripts/podcast/_authoring/_chapter_design.py
          - scripts/podcast/segment_book.py
          - scripts/podcast/check_chapter_set.py
          - scripts/podcast/phases/p3_1.py
          - scripts/podcast/phases/p3_2.py
          - scripts/podcast/phases/p3_3.py
          - scripts/podcast/phases/p3_4.py
          - scripts/podcast/phases/p3_5.py
          - scripts/podcast/phases/preflight_chapter.py
          - scripts/podcast/_density_profiles.py
          - scripts/podcast/chapter_density_audit.py
          - scripts/podcast/_sessions.py
        shipped_commit: e2ca3de
        shipped_date: "2026-06-09"
        status: shipped
        notes: >
          Deterministic post-write gate rejects and deletes over-dense output
          before done marker (a89b64b 2026-06-10). R-MAX-CONCEPTS enforces
          <= 3 concept sections per episode. episode_format decided per
          chapter from rhetorical shape (concession-arcs -> debate with
          host_b_concedes). Session grouping stamped at authoring time
          (9fd0be4 2026-06-10). CS7-CS11 chapter-set integrity gates run
          post-0d for density_standard:2 books.

      - id: 0e
        name: Enrichment / augmentation (LLM + knowledge.db)
        inputs:
          - chapters/<ch-slug>/contract.yaml
          - knowledge.db
          - _system/series-config.yaml
        outputs:
          - chapters/<ch-slug>/enriched.md
          - _system/episode-augment-ledger.json
        prompt_file: _workspace/prompts/phase-0e-enrich.md
        code_files:
          - scripts/podcast/augment_book.py
          - scripts/podcast/stage_knowledge_enrich.py
          - scripts/podcast/_augmentation.py
          - scripts/podcast/_augment_gemini.py
          - scripts/podcast/_augment_registry.py
          - scripts/podcast/_doctrinal.py
          - scripts/podcast/_archetypes.py
          - scripts/podcast/narrator_additions.py
          - scripts/podcast/phases/p4_1.py
          - scripts/podcast/phases/p4_2.py
          - scripts/podcast/phases/p4_3.py
          - scripts/podcast/phases/p4_4.py
          - scripts/podcast/phases/p4_7.py
          - scripts/podcast/phases/p4_8.py
        shipped_commit: e2ca3de
        shipped_date: "2026-06-09"
        status: shipped
        notes: >
          Wave L adds content-level gating (L-1/L-2) via 6-level Kashkole
          ladder (general -> advanced -> taveel -> mamsool -> mabda_maad ->
          haqaiq). Etymology weaving (L-4): <= 3 spoken root-insights/chapter.
          Anti-repetition ledger excludes atoms already used by other episodes.
          Wave W challenger category (W1-W6: genuine-gap, natural, etymology
          discipline, content-level integrity, no-fabrication,
          no-cross-chapter-repeat). CHALLENGER_VERSION 2.3 -> 2.4 at Wave L.

      - id: 0literary
        name: Literary transformation pass (Gemini)
        inputs: [chapters/<ch-slug>/enriched.md]
        outputs: [chapters/<ch-slug>/literary.md]
        prompt_file: _workspace/prompts/phase-0literary.md
        code_files:
