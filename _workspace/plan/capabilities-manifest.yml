# ---------------------------------------------------------------------------
# SURFACE 1 — PIPELINE
# ---------------------------------------------------------------------------
surfaces:
  pipeline:

    # -----------------------------------------------------------------------
    # PHASES — canonical PHASES tuple from scripts/podcast/_progress.py
    # -----------------------------------------------------------------------
    phases:

      - id: pre-flight
        name: Pre-flight gates (initial)
        inputs: [pdf_path, slug, series_config]
        outputs: [validated_environment, preflight_report.md]
        code_files:
          - scripts/podcast/phases/preflight.py
          - scripts/podcast/preflight_doctor.py
          - scripts/podcast/intake_preflight.py
        shipped_commit: e2ca3de
        shipped_date: "2026-06-09"
        status: shipped
        notes: >
          Validates Python interpreter, Azure credentials, secrets, disk space,
          git tree cleanliness, and series-config schema before any LLM spend.
          Allowlist gates added via fix(preflight) 2026-06-09 (ebfe4d3).

      - id: branch
        name: Create content branch
        inputs: [slug, content_profile]
        outputs: [git_branch_Bucket/slug]
        code_files:
          - scripts/podcast/phases/scaffold.py
          - scripts/podcast/_branching.py
        shipped_commit: e2ca3de
        shipped_date: "2026-06-09"
        status: shipped
        notes: >
          Branch naming is Bucket/slug (Islamic/kitab-al-riyad).
          Bucket resolved via _paths.resolve_bucket from content_profile,
          not legacy category tag. _branching.branch_for_work maps
          multi-volume slugs to the single work branch.

      - id: scaffold
        name: Scaffold book directory structure
        inputs: [slug, category, content_profile, pdf_path]
        outputs:
          - content/<Bucket>/<slug>/_system/orchestrator-state.json
          - content/<Bucket>/<slug>/meta.yml
          - content/<Bucket>/<slug>/_system/series-config.yaml
        code_files:
          - scripts/podcast/phases/scaffold.py
          - scripts/podcast/scaffold_book.py
          - scripts/podcast/_paths.py
          - scripts/podcast/_work_manifest.py
        shipped_commit: e2ca3de
        shipped_date: "2026-06-09"
        status: shipped
        notes: >
          standardize_book_folders.py enforces canonical folder skeleton.
          For multi-volume works, work.yml manifest is written by intake;
          volumes scaffold into vol-NN/ subdirs. No yaml dep for detection
          (vol-* glob + marker). Shipped work manifest 2026-06-09 (64d5c85).

      - id: 0a
        name: Azure OCR + Translation (ingest)
        inputs: [pdf_path or m4a_path, slug]
        outputs:
          - content/<Bucket>/<slug>/source/pages/*.txt
          - content/<Bucket>/<slug>/source/raw-ocr.txt
          - content/<Bucket>/<slug>/source/translated.txt
        prompt_file: null
        code_files:
          - scripts/podcast/phases/source_ingest.py
          - scripts/podcast/ingest_source.py
          - scripts/podcast/_azure.py
          - scripts/podcast/ocr_image_pages.py
          - scripts/podcast/transcribe_audio.py
          - scripts/podcast/translate_bundle.py
          - scripts/podcast/phases/noise_router.py
        shipped_commit: e2ca3de
        shipped_date: "2026-06-09"
        status: shipped
        notes: >
          Fully deterministic. Azure Document Intelligence OCR for PDFs;
          Azure Speech-to-Text for m4a sources; Azure Translator for
          Arabic -> English. Cost tracked via append_azure_*_cost helpers
          (shipped 2026-05-25). noise_router.py selects source-text variant
          based on content_profile (technical path bypasses OCR).

      - id: 0b
        name: English refinement (LLM tighten pass)
        inputs: [source/translated.txt, series-config.yaml]
        outputs: [source/refined.txt, source/tightened.txt]
        prompt_file: _workspace/prompts/phase-0b-refine.md
        code_files:
          - scripts/podcast/gemini_refine.py
          - scripts/podcast/tighten_source.py
          - scripts/podcast/full_book_denoise.py
          - scripts/podcast/_tighten_helpers.py
          - scripts/podcast/_chunking.py
          - scripts/podcast/phases/p1_1.py
          - scripts/podcast/phases/p1_2.py
        shipped_commit: e2ca3de
        shipped_date: "2026-06-09"
        status: shipped
        notes: >
          Gemini Flash denoising + Claude Max tightening in parallel windows
          (PHASE_0B_MAX_WORKERS=3 default). web-consumer-denoise mode added
          for technical content 2026-06-01 (9020784). Terminology guardian
          (SN-7) injects R_TERMINUS_PRESERVE protect-list from glossary.yml
          into denoise prompts (WC8). Chunked via _chunking.run_windowed;
          stable instructions block is prompt-cached.

      - id: 0c
        name: Arabic phonetic pass (LLM)
