          - scripts/podcast/build_glossary.py
          - scripts/podcast/fill_glossary_arabic.py
          - scripts/podcast/strip_inline_phonetics.py
          - scripts/podcast/apply_pronunciation_corrections.py
          - scripts/podcast/phases/p2_2.py
          - scripts/podcast/phases/p2_3.py
          - scripts/podcast/phases/p2_4.py
        shipped_commit: e2ca3de
        shipped_date: "2026-06-09"
        status: shipped
        notes: >
          ASCII-only romanization (no diacritics, locked 2026-06-08).
          _bake_glossary() auto-generates _system/glossary.yml (phonetic
          <-> Arabic-script overlay) used by the reader Arabic toggle and
          by the TTS pronunciation compiler. Parallel windows
          PHASE_0C_MAX_WORKERS=3. Probe gate added 2026-06-07 (9da2357).

      - id: 0ci
        name: Book intelligence probe + Islamic scholarly halt
