# ---------------------------------------------------------------------------
# DETERMINISTIC ISLAMIC PATH ANALYSIS
# ---------------------------------------------------------------------------
deterministic_islamic_path:
  # Walk: book PDF -> per-chapter authoring -> NotebookLM bundle -> PDF/Astro publish
  # Total steps: 29   |   Deterministic / orchestrated: 14   |   Score: 14/29 = 48%
  # 2026-06-14 update: the post-download audio processing (step 21) moved from a
  # hand-run CLI ritual to the orchestrated, self-correcting `audio-ingest` phase —
  # one fewer manual action per book. The remaining manual gates are either
  # irreducible (step 20: NotebookLM has no API) or deliberate editorial review
  # halts. Manual NotebookLM upload/download is now bulletproofed by the durable
  # worklist, not eliminated (that needs an external API or the dormant ElevenLabs
  # engine). Manual gates: 6 (1 external-dependency, 5 deliberate/automatable-later).

  end_to_end_steps:

    - step: 1-pdf-intake-and-slot-assignment
      surface: pipeline
      automation_status: deterministic
      depends_on: []
      evidence_files:
        - scripts/podcast/intake_book.py
        - plan-dashboard/src/pages/studio/new.astro

    - step: 2-branch-creation
      surface: pipeline
      automation_status: deterministic
      depends_on: [1-pdf-intake-and-slot-assignment]
      evidence_files:
        - scripts/podcast/_branching.py
        - scripts/podcast/phases/scaffold.py

    - step: 3-scaffold-directory-structure
      surface: pipeline
      automation_status: deterministic
      depends_on: [2-branch-creation]
      evidence_files:
        - scripts/podcast/scaffold_book.py
        - scripts/podcast/standardize_book_folders.py

    - step: 4-azure-ocr-and-translation
      surface: pipeline
      automation_status: deterministic
      depends_on: [3-scaffold-directory-structure]
      evidence_files:
        - scripts/podcast/ingest_source.py
        - scripts/podcast/_azure.py
        - scripts/podcast/ocr_image_pages.py
        - scripts/podcast/translate_bundle.py

    - step: 5-english-refinement-gemini-tighten
      surface: pipeline
      automation_status: deterministic
      depends_on: [4-azure-ocr-and-translation]
      evidence_files:
        - scripts/podcast/gemini_refine.py
        - scripts/podcast/tighten_source.py
        - scripts/podcast/_chunking.py
      notes: >
        Fully scripted, runs unattended. LLM outputs are not deterministic
        but the invocation is scripted with no human decision required.
        Classified deterministic for flow purposes (script drives it end-to-end).

    - step: 6-arabic-phonetic-pass
      surface: pipeline
      automation_status: deterministic
      depends_on: [5-english-refinement-gemini-tighten]
      evidence_files:
        - scripts/podcast/_translit.py
        - scripts/podcast/build_glossary.py
        - scripts/podcast/phases/p2_2.py

    - step: 7-book-intelligence-probe
      surface: pipeline
      automation_status: deterministic
      depends_on: [6-arabic-phonetic-pass]
      evidence_files:
        - scripts/podcast/phases/p2_4_wave2.py
        - scripts/podcast/source_library_queries.py
      notes: LLM cross-references source against knowledge.db. Scripted end-to-end.

    - step: 8-islamic-scholarly-human-review-halt
      surface: pipeline
      automation_status: manual_gate
      depends_on: [7-book-intelligence-probe]
      evidence_files:
        - scripts/podcast/phases/p2_4_wave2.py
      notes: >
        Orchestrator halts for human review of the book intelligence report
        before chapter design begins. No tooling assists the decision.
        Human must inspect the gap analysis and approve proceeding.

    - step: 9-chapter-design-episode-contracts
      surface: pipeline
      automation_status: deterministic
      depends_on: [8-islamic-scholarly-human-review-halt]
      evidence_files:
        - scripts/podcast/_book_compose.py
        - scripts/podcast/phases/p3_1.py
        - scripts/podcast/phases/p3_5.py
        - scripts/podcast/check_chapter_set.py
      notes: >
        Scripted LLM. Post-write density gates are deterministic checks that
        reject over-dense output. CS7-CS11 chapter-set integrity gates run
        deterministically post-LLM output.

    - step: 10-enrichment-and-augmentation
      surface: pipeline
      automation_status: deterministic
      depends_on: [9-chapter-design-episode-contracts]
      evidence_files:
        - scripts/podcast/augment_book.py
        - scripts/podcast/_augmentation.py
        - scripts/podcast/intelligence/augmenter.py
      notes: >
        Scripted LLM. Content-level gate selection and anti-repetition ledger
        are deterministic pre-LLM filtering. The LLM enrichment itself is not.

    - step: 11-source-review-gate
      surface: pipeline
      automation_status: manual_gate
      depends_on: [10-enrichment-and-augmentation]
      evidence_files:
        - scripts/podcast/phases/source_review_gate.py
      notes: >
        Human must inspect enriched chapters and approve before series plan.
        No tooling assists the decision. The Astro Site reader can surface
        chapters for review but the approval is unscripted.

    - step: 12-series-plan-write
      surface: pipeline
      automation_status: deterministic
      depends_on: [11-source-review-gate]
      evidence_files:
        - scripts/podcast/phases/series_plan.py
        - scripts/podcast/_notebooklm_table.py

    - step: 13-series-plan-human-approval-halt
      surface: pipeline
      automation_status: manual_gate
      depends_on: [12-series-plan-write]
      evidence_files:
        - scripts/podcast/phases/series_plan.py
      notes: >
        Orchestrator halts for human review of the series plan. Human reads
        series-plan.md, inspects episode list, chapter scope, session groupings,
        and explicitly resumes the orchestrator to proceed.

    - step: 14-register-series-and-dual-bundle-audit
      surface: pipeline
      automation_status: deterministic
      depends_on: [13-series-plan-human-approval-halt]
      evidence_files:
        - scripts/podcast/phases/register_series.py
        - scripts/podcast/phases/bundle_audit.py
        - scripts/podcast/audit_bundle.py
        - scripts/podcast/audit_bundle_gemini.py

    - step: 15-per-chapter-extract
      surface: pipeline
      automation_status: deterministic
      depends_on: [14-register-series-and-dual-bundle-audit]
      evidence_files:
        - scripts/podcast/extract_chapter.py
        - scripts/podcast/_extract_contract.py

    - step: 16-per-chapter-framing-authorship
      surface: pipeline
      automation_status: deterministic
      depends_on: [15-per-chapter-extract]
      evidence_files:
        - scripts/podcast/_authoring.py
        - scripts/podcast/phases/per_chapter.py
      notes: Scripted LLM. Framing cache (.framing-sig) skips re-authoring if unchanged.

    - step: 17-per-chapter-episode-build
      surface: pipeline
      automation_status: deterministic
      depends_on: [16-per-chapter-framing-authorship]
      evidence_files:
        - scripts/podcast/build_episode_txt.py
        - scripts/podcast/_validators_framing.py

    - step: 18-per-chapter-challenger-convergence
      surface: pipeline
      automation_status: deterministic
      depends_on: [17-per-chapter-episode-build]
      evidence_files:
        - scripts/podcast/_convergence.py
        - scripts/podcast/_validators.py
        - infra/claude-agents/podcast-challenger.md
      notes: >
        3 outer x 5 inner = 15 max challenger passes. Cost-capped.
        Convergence is scripted. Human surfaces SHIP-WITH-CAUTION verdicts
        (P1 findings) at finalize halt, not here.

    - step: 19-per-chapter-slide-deck-authoring
      surface: pipeline
      automation_status: deterministic
      depends_on: [18-per-chapter-challenger-convergence]
      evidence_files:
        - scripts/podcast/generate_slide_decks.py
        - scripts/podcast/_slide_convergence.py
        - scripts/podcast/phases/pw4_1.py
      notes: Scripted Gemini 2.5 Flash. Mandatory (feedback_slide_decks_required.md).

    - step: 20-notebooklm-upload-generation-download
      surface: external (NotebookLM manual)
      automation_status: manual_gate
      depends_on: [19-per-chapter-slide-deck-authoring]
      evidence_files:
        - scripts/podcast/_notebooklm_table.py
        - content/<Bucket>/<slug>/_system/notebooklm-worklist.md
      notes: >
        Irreducible manual gate (NotebookLM has no API): the human opens NotebookLM,
        uploads the chapter source, pastes the episode framing into Customize,
        Generates, waits, and downloads the .m4a. BULLETPROOFED 2026-06-14: the
        finalize halt now writes ONE durable worklist (notebooklm-worklist.md) that
        lists every upload/paste/Length/Format/drop-target in order with live
        checkboxes — the operator works one file across sessions instead of
        re-reading scrolled-off terminal cards. The hand-work remains (~10-20
        min/episode) but is one-shot and self-documenting; everything AFTER the
        download is automatic (step 21).

    - step: 21-audio-ingest-normalize-and-transcribe
      surface: pipeline
      automation_status: deterministic
      depends_on: [20-notebooklm-upload-generation-download]
      evidence_files:
        - scripts/podcast/phases/audio_ingest_driver.py
        - scripts/podcast/normalize_m4a.py
        - scripts/podcast/transcribe_notebooklm.py
        - scripts/podcast/_azure.py
      notes: >
        GAP CLOSED 2026-06-14. Previously a hand-run two-command CLI ritual
        (normalize_m4a.py --apply + transcribe_notebooklm.py); now the orchestrated,
        self-correcting `audio-ingest` phase. On --resume after the audio drop it
        fingerprint-repairs filename drift deterministically, Azure-transcribes,
        and gates on completeness (re-halts cleanly if anything is missing).
        Idempotent and engine-gated (no-op for ElevenLabs). No manual invocation.

    - step: 22-finalize-gate-check-g1-g7
      surface: pipeline
      automation_status: deterministic
      depends_on: [21-m4a-normalize-and-azure-transcribe]
      evidence_files:
        - scripts/podcast/validate_ship_ready.py
        - scripts/podcast/_contract_validation.py
        - scripts/podcast/_acceptance.py

    - step: 23-finalize-human-review-halt
      surface: pipeline + astro_site
      automation_status: manual_gate
      depends_on: [22-finalize-gate-check-g1-g7]
      evidence_files:
        - scripts/podcast/phases/dor_halts.py
        - plan-dashboard/src/pages/library/[slug].astro
      notes: >
        Orchestrator halts for human review of the finished book in the
        Podcast Factory Astro Site reader. Human reads chapters, checks
        P1 verdicts from SHIP-WITH-CAUTION chapters, and explicitly resumes
        to approve publish. Studio + reader surfaces assist the review.

    - step: 24-pdf-book-branch-design-compose-illustrate
      surface: pipeline
      automation_status: deterministic
      depends_on: [23-finalize-human-review-halt]
      evidence_files:
        - scripts/podcast/_authoring/_book_design.py
        - scripts/podcast/_book_compose.py
        - scripts/podcast/_book_illustrate.py
        - scripts/podcast/phases/book_driver.py
      notes: Scripted LLM. Three LLM phases in sequence.

    - step: 25-notebooklm-slide-deck-pdf-manual-drop
      surface: pipeline (manual_gate)
      automation_status: manual_gate
      depends_on: [24-pdf-book-branch-design-compose-illustrate]
      evidence_files:
        - scripts/podcast/_slide_import.py
      notes: >
        Human must export slide deck PDFs from NotebookLM for each episode
        and drop them into content/<Bucket>/<slug>/slide-decks/.
        Pipeline halts until all chapter PDFs are present (or .SKIP marked).
        No automation can extract PDFs from NotebookLM.

    - step: 26-book-slide-import-and-render
      surface: pipeline
      automation_status: deterministic
      depends_on: [25-notebooklm-slide-deck-pdf-manual-drop]
      evidence_files:
        - scripts/podcast/_slide_import.py
        - scripts/podcast/build_book_pdf.py

    - step: 27-book-challenger-and-pdf-quality-gate
      surface: pipeline
      automation_status: deterministic
      depends_on: [26-book-slide-import-and-render]
      evidence_files:
        - infra/claude-agents/book-challenger.md
      notes: Automated book-challenger convergence gates the PDF.

    - step: 28-publish-status-flip
      surface: pipeline
      automation_status: deterministic
      depends_on: [27-book-challenger-and-pdf-quality-gate]
      evidence_files:
        - scripts/podcast/publish_to_library.py

    - step: 29-merge-to-develop
      surface: pipeline
      automation_status: deterministic
      depends_on: [28-publish-status-flip]
      evidence_files:
        - scripts/podcast/phases/merge.py

  gaps:

    - step: 21-audio-ingest-normalize-and-transcribe
      gap_description: >
        CLOSED 2026-06-14. Was: normalize + transcribe were hand-run CLI commands
        outside the orchestrator. Now the orchestrated, self-correcting audio-ingest
        phase runs them automatically on --resume with deterministic drift repair
        and a completeness gate. Retained here as a record of the closure.
      recommended_fix: Done — scripts/podcast/phases/audio_ingest_driver.py.
      priority: closed

    - step: 20-notebooklm-upload-generation-download
      gap_description: >
        IRREDUCIBLE while NotebookLM is the engine: NotebookLM has no public API,
        so the upload/generate/download cycle is manual (~3-6 h for a 20-episode
        book). MITIGATED 2026-06-14 by the durable worklist (one checklist file,
        live checkboxes, survives sessions) and by full automation of everything
        after the download (step 21). What remains unscripted is exactly the
        in-NotebookLM-UI hand-work, which no repo-side code can perform. The only
        path to fully closing this is an external dependency (a NotebookLM API) or
        switching that book to the dormant autonomous engine (ElevenLabs).
      recommended_fix: >
        Monitor Google for a NotebookLM API. Interim already shipped: the durable
        worklist. A browser-automation script (Playwright/Chrome extension) could
        pre-fill the UI but is brittle (NotebookLM UI churns) — not recommended now.
        For a book that does NOT need NotebookLM's hosted voices, reactivating the
        quarantined ElevenLabs engine makes audio fully hands-off.
      priority: high (external dependency — not closeable in-repo)

    - step: 25-notebooklm-slide-deck-pdf-manual-drop
      gap_description: >
        After NotebookLM generates a slide deck for an episode, the user must
        manually export it as PDF, rename it correctly, and drop it into the
        slide-decks/ folder. There is no API to retrieve generated decks.
        For a 20-episode book this is 20 manual export-rename-drop operations.
      recommended_fix: >
        Same as gap for step 20: a NotebookLM API would solve this. Interim:
        a naming convention validator + drag-drop UI in the Astro Studio to
        reduce friction. The slide-decks/ folder naming is documented
        (ch<NN>-<slug>.pdf) but not enforced at drop time.
      priority: medium

    - step: 8-islamic-scholarly-human-review-halt
      gap_description: >
        The book intelligence report surfaces gaps and corpus cross-references
        but there is no in-site UI to review and approve it. The human must
        read a raw markdown file in the terminal and manually issue an
        orchestrator --resume command. The gap-analysis.json data is rich but
        unexposed in the Astro Site.
      recommended_fix: >
        Add a /studio/[slug]/intelligence-review route that renders the
        book intelligence report inline and provides a one-click approve button
        that calls api/intake/resume. This would reduce this manual gate to
        a ~2 minute review.
      priority: medium

    - step: 11-source-review-gate
      gap_description: >
        Phase 06a halts for human review of enriched chapters, but the Astro
        Site library reader (while it can display chapters) has no direct
        "approve this review gate" action. The human must switch to the
        terminal to resume. The review itself is well-supported by the reader;
        the approve action is not.
      recommended_fix: >
        Add a "Approve Source Review" action to the Studio [slug]/[step]
        route that maps to the 06a gate. Wire api/intake/resume behind it.
      priority: low

    - step: 23-finalize-human-review-halt
      gap_description: >
        The finalize halt is well-supported (Astro Site reader + Studio exist)
        but there is no unified "approve finalize + trigger publish" button.
        Human must switch to terminal to issue --resume. The review is rich
        but the approval action is terminal-only.
      recommended_fix: >
        Add an "Approve + Publish" action to the Studio book review surface
        that calls api/approve/[slug] and wires to the orchestrator resume.
        api/approve/[slug].ts already exists in the route list.
      priority: medium

  manual_gates:

    - step: 8-islamic-scholarly-human-review-halt
      why_manual: >
        Orchestrator halts after book intelligence for Islamic scholarly books.
        Requires expert judgment on the gap analysis before LLM chapter design
        begins to prevent spending on wrong boundaries.
      can_automate: false
      effort: n/a — expert judgment, not a scripting problem

    - step: 11-source-review-gate
      why_manual: >
        Human must verify that enriched chapters faithfully represent the source
        and that episode scope is correct before series plan is committed.
      can_automate: false
      effort: n/a — content fidelity judgment

    - step: 13-series-plan-human-approval-halt
      why_manual: >
        Series plan commit is the largest structural decision in the pipeline.
        Episode count, session groupings, and NotebookLM conversation style
        are all locked here. Wrong decisions are expensive to reverse.
      can_automate: true
      effort: >
        Could offer a "trust the pipeline" auto-approve mode for books where
        Phase 0d and 0f produce clean CS7-CS11 reports. Would require a
        confidence threshold (e.g. density_standard:2, P0-clean 0d report).
        Estimated effort: 1-2 days.

    - step: 20-notebooklm-upload-generation-download
      why_manual: >
        NotebookLM has no API. Upload, generation wait, and download are
        entirely browser-based. This is the single biggest automation gap.
      can_automate: true
      effort: >
        Browser automation via Playwright or Chrome extension. The pipeline
        already generates perfect upload artifacts. Automation would need to:
        (1) create a notebook, (2) upload source file, (3) set Customize prompt,
        (4) trigger generation, (5) poll for completion, (6) download .m4a.
        Estimated effort: 3-5 days (brittle — NotebookLM UI changes often).

    - step: 23-finalize-human-review-halt
      why_manual: >
        Final human quality gate before publish. Human reads all chapters +
        reviews SHIP-WITH-CAUTION P1 verdicts. This is a deliberate quality
        control point, not an automation gap.
      can_automate: false
      effort: n/a — deliberate editorial gate

    - step: 25-notebooklm-slide-deck-pdf-manual-drop
      why_manual: >
        No NotebookLM API for deck export. Human must export PDFs from the
        NotebookLM Slides interface, rename them to the canonical ch<NN>-<slug>
        pattern, and drop them into slide-decks/.
      can_automate: true
      effort: >
        Same as step 20 — blocked on NotebookLM API availability. A naming
        convention enforcer in the Astro Studio intake could reduce the friction
        from the current terminal workflow.
