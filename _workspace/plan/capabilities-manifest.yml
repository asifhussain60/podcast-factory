# Reconciled 2026-07-13 from base 2026-06-14 (develop @ d4cfbc92). Delta: +82 commits
# since the 2026-06-20 static snapshot. Added surface: translation_edition (below).
# Narrative reconciliation + risk-register deltas: docs/assessment/capability-manifest-reconciliation-2026-07-13.md.
# Sources: git log --all, framework.md, CLAUDE.md, _workspace/plan/architecture.md,
