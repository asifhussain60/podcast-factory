schema: podcast.pending-work/v2

# THE SNAG LIST -- named 2026-08-08 (Asif asked for something more memorable
# than "pending-work.yaml"; a snag list is the factory-floor term for the
# punch list of unfinished items before a build is signed off, which is
# exactly what this repo's status cards print from).
#
# The backlog the status card prints, and the general issue/work-request list
# for the repo (2026-08-08). Git-tracked on develop -- any machine that pulls
# has the current list, any machine that pushes an edit updates it for every
# other machine. Deliberately not a second system: extends the file that
# already existed rather than adding a competing tracker.
#
# NO priority field, on purpose, matching this file's own stated design (see
# _pending_work.py's docstring): "no owners, no priorities... a backlog that
# needs its own workflow stops being written to." Urgency goes in the title
# in plain English instead (several items already do this -- "HAZARD, carried
# forward").
#
# Scope is a book slug, `pipeline`, or `general` (added v2 -- anything that
# isn't book- or pipeline-specific: cross-repo conventions, tooling, process).
# `general` items are always shown on every card, pipeline-wide, alongside
# that card's own scope + `pipeline` -- see open_items() in _pending_work.py.
# Status is doing | open | done. Keep titles plain English -- this is read on
# a status card, not in a ticket system.

