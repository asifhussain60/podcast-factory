schema: podcast.pending-work/v4

# THE SNAG LIST -- named 2026-08-08 (Asif asked for something more memorable
# than "pending-work.yaml"; a snag list is the factory-floor term for the
# punch list of unfinished items before a build is signed off, which is
# exactly what this repo's status cards print from).
#
# The backlog the status card prints, and the general issue/work-request list
# for the repo (2026-08-08). Git-tracked on develop -- any machine that pulls
# has the current list, any machine that pushes an edit updates it for every
# other machine. Deliberately not a second system: extends the file that
# already existed rather than adding a competing tracker.
#
# Cleanup pass (2026-08-08): 30 items audited against the CURRENT repo state,
# not just re-read. 17 removed -- 16 already `done` (a punch list tracks what's
# OUTSTANDING; a closed item's lasting record belongs in its commit message or
# an RCA doc, not here forever) and one open item, `narrative-frame-undeclared`,
# whose premise turned out to be FALSE on inspection: both books it named now
# declare `narrative_frame` in their series-config.yaml, so the hazard it
# warned about no longer exists. Everything else that stayed was individually
# re-checked against the files/state it references, not assumed still true.
# Going forward: an item earns removal by being verified stale or resolved,
# not by simply reaching `status: done` -- `done` items ARE still deleted once
# their record has served its purpose, but that's a judgment call each time,
# not an automatic sweep.
#
# 2026-08-08 (same day, second pass): Asif called kitab-al-riyad "fine" and
# removed its 3 remaining open items (arabic inline formatting, missing
# podcast framing, articulation-reverted chapters) -- his own call on the
# book's state, not a re-verification. The Islamic/kitab-al-riyad branch was
# fast-forwarded to origin/develop's tip the same session to confirm nothing
# was left stranded on it.
#
# v4 (2026-08-08): `summary` is a short, plain-English headline (<=~70 chars),
# separate from `title`, which stays the full descriptive record. The Snag
# List view uses `summary` as the always-visible accordion header and `title`
# as the expandable body -- added because a reader scanning the list needs a
# clear one-line "what is this" before deciding whether to read the full
# paragraph. Optional, like priority/effort/order below; a missing summary
# just falls back to a truncated title in the view.
#
# v3 (2026-08-08): priority, effort and order are now first-class, per Asif's
# explicit request -- the v2 design note below ("no priority field, on
# purpose") is reversed. All three are OPTIONAL and additive; a reader that
# doesn't know them (the Python status card, an older snapshot) ignores them
# safely.
#   priority: P0 (urgent/blocking) | P1 (normal) | P2 (someday) -- three tiers,
#     matching the status-badge budget in the Snag List view.
#   effort:   S | M | L -- rough size, not hours.
#   order:    optional integer, a manual tie-breaker within one (scope,
#     priority) group for the rare case the default sort (priority, then
#     order, then noticed date) isn't right. Hand-edited in this file like
#     every other field here -- no drag-and-drop UI.
#
# Scope is a book slug, `pipeline`, or `general` (added v2 -- anything that
# isn't book- or pipeline-specific: cross-repo conventions, tooling, process).
# `general` items are always shown on every card, pipeline-wide, alongside
# that card's own scope + `pipeline` -- see open_items() in _pending_work.py.
# Status is doing | open | done. Keep titles plain English -- this is read on
# a status card, not in a ticket system.

items:
  - id: book-podcast-chapters-missing-arabic
    scope: the-master-and-the-disciple
    status: open
    priority: P1
    effort: M
    summary: Podcast chapter files are missing Arabic script
    title: "Found while re-verifying gates post-fix (unrelated to the fix itself): validate_book_ready's B3 gate reports 20/20 podcast chapter files (chapters/ch01a-*.txt etc.) carry ZERO Arabic script. This is the PODCAST deliverable's own Arabic injection (inject_chapter_arabic.py / Phase 0e), a different subsystem from the reading edition's Arabic (verified extensively earlier -- 52 passages in book.md, traced to source). Non-blocking on the podcast ship (already live), but a real gap worth a look. No prior book-validation-report.json existed for this book, so unknown whether this predates today or was always the case for this book's podcast lane. RE-VERIFIED 2026-08-08: still 0/20 files carry Arabic script."
    noticed: 2026-07-19

  - id: naming-drift-no-glossary-entry
    scope: pipeline
    status: open
    priority: P2
    effort: L
    summary: Naming drift can't catch a spelling with no glossary entry
    title: "Residual half of the naming-drift gap, deliberately NOT fixed: naming_drift() only ever compares spellings that exist as glossary entries. An ad hoc spelling a single augment note introduces, with no glossary entry of its own at all (e.g. the-master-and-the-disciple's 'Shari'ah', which had no entry before today's manual fix), stays invisible. Needs a fuzzy near-neighbor scan across raw page text -- real new infrastructure, not another fold, so it was not built under this pass. RE-VERIFIED 2026-08-08: no fuzzy/near-neighbor scan exists anywhere in scripts/podcast/."
    noticed: 2026-07-19

  - id: articulation-backfill
    scope: pipeline
    status: open
    priority: P1
    effort: L
    summary: Rewrite four Islamic books into the reference voice
    title: "Four Islamic books do not yet read like the reference editions (the-master-and-the-disciple, degrees-of-excellence). TWO PROBLEMS, two remedies. (a) mukhtasar-ul-asar-1 (99k words) and -2 (107k) are genuinely CALQUED -- Arabic masdar chains and isnad grammar carried straight into English -- which is exactly what the REQ-BA articulation pass is built to fix; run 0book-fluency or loop rearticulate_chapter.py over their chapter keys. (b) al-anwaar-al-lateefah/vol-01 and asaas-al-taveel/vol-01 are FLUENT but in the wrong voice (a lecturer addressing a congregation, a modern editor's preface 'I'). The articulation pass CANNOT fix those: REQ-BA-030 binds it to preserve meaning, so it would keep the added framing and only polish it. They need a re-compose from source, not articulation. Deferred by Asif 2026-08-02 in favour of pipeline + Arabic work."
    noticed: 2026-08-02

  - id: kashkole-urdu-to-english
    scope: pipeline
    status: open
    priority: P2
    effort: L
    summary: Translate the Kashkole Wisdom corpus into English
    title: "Asif 2026-08-06: the KASHKOLE Wisdom corpus must be rendered into articulate English so it can augment content, etymology and explanations as ONE unit with KSESSIONS -- a separate, systematic pass over the whole corpus, not a per-note translation. STATE TODAY: content/knowledge-base/mirror.db carries all 1347 topics (1055 with a substantial body_plain) and NONE of them carry English -- the source dump at content/_shared/source-library/Kashkole.sql (759 MB, gitignored) contains zero name_en occurrences, so this is Urdu at source, not a mirroring loss. That is why intelligence/ingest_kashkole.py deliberately mints no atoms from them (rule D8, never re-translate) and records them as a deferred note; the only English Kashkole material in the corpus today is the 93 doctrine atoms (tradition fatimid-ismaili) from the wisdom-binder pipeline. The new pass must target the SAME articulation standard the reading editions use (docs/standards/book-articulation.md, REQ-BA-*) so a translated topic reads like the books it will be cited beside, must be idempotent and re-runnable, and must record provenance per topic so a rendering can be traced and revised. It supersedes D8 for this corpus and D8's text must be updated in the same change rather than left contradicting it. Until it lands, the Companion student-reader lane cites Kashkole topics by binder and topic name WITHOUT rendering their Urdu, and draws its English from the 606 KSESSIONS transcripts and the 93 doctrine atoms. Re-importing needs Docker, which is NOT installed on this machine; no re-import is required for this work since the mirror already holds every topic."
    noticed: 2026-08-06

  - id: annotation-policy-vs-zero-translit
    scope: pipeline
    status: open
    priority: P2
    effort: S
    summary: Decide how a teach-term's later mentions should print
    title: "Two locked rules meet and the outcome is worth a decision. 'Zero English transliteration of Arabic terms in book.md' (2026-08-02) and 'annotate once and intelligently, never mechanically' (the four-class teach/familiar/name/silent policy) disagree about a term's SECOND mention. Today the annotation policy wins: a `teach` term gets its script once per book and every later mention prints bare romanization; a `familiar` term (halal, iman, nafs -- words the classifier judged naturalised) never gets script at all. That is why ayyuhal-walad still prints *mujahadah*, *marifah* and *zauq* with no Arabic beside them after the apparatus ran. Not a defect -- it is the policy behaving as written -- but Asif should decide whether a teach term's later mentions should also carry script."
    noticed: 2026-08-02

  - id: stale-cross-machine-response-format
    scope: general
    status: open
    priority: P1
    effort: M
    summary: Version-control the global response-format rules
    title: "The global response-format rules (~/.claude/response-template.md) live in a folder with NO git repo and NO remote, so nothing Asif approves there reaches any other machine. Worse: this repo separately carries two TRACKED copies (_workspace/plan/conventions/response-template.md, response-conventions.md) that describe the 4-part template RETIRED 2026-05-26 -- and CLAUDE.md's own text falsely claims those copies 'had not existed for some time.' Any machine pulling develop today gets confidently-stated instructions that contradict how Asif actually wants responses written. Needs: version-control the global folder with a remote so every machine pulls the same rules, delete the two stale tracked copies, and correct the false line in CLAUDE.md. RE-VERIFIED 2026-08-08: ~/.claude still has no .git, and both stale tracked copies still exist."
    noticed: 2026-08-08

  - id: pipeline-refactor-efficiency-accuracy-checkpoints
    scope: general
    status: open
    priority: P1
    effort: L
    summary: Refactor the pipeline for efficiency and per-phase accuracy checks
    title: "Asif 2026-08-08: refactor the podcast-factory pipeline for efficiency and accuracy, with short checkpoints between phases rather than long uninterrupted runs. Two named parts: (1) a full test harness covering the pipeline end to end, not just per-module unit tests; (2) each phase re-checks the ACCURACY of every phase that ran before it, not only the one immediately prior -- e.g. phase 0c should evaluate the work of 0a and 0b as well as its own, not assume an earlier phase that already passed is still correct. Scope and sequencing not yet decided -- this is the request as given, not a plan."
    noticed: 2026-08-08

  - id: orchestrator-ai-reflection-quality
    scope: general
    status: open
    priority: P1
    effort: L
    summary: Improve the orchestrator's self-checking during a run
    title: "Asif 2026-08-08: the podcast-factory pipeline orchestrator and the AI driving it need better reflection and response quality during a run -- today's session found four real, book-blocking defects (chapter-count scaling, a heading-leak bug, a gate false-positive that aborted the whole compose twice, a stale metadata path) that a stricter self-check during the run could plausibly have caught earlier than a human reviewing the output after the fact. Not yet scoped to a concrete mechanism -- logged as the request, to be designed separately."
    noticed: 2026-08-08

  - id: chapter-grouping-for-long-books
    scope: pipeline
    status: open
    priority: P2
    effort: L
    summary: Group chapters into higher-level parts for long books
    title: "Asif 2026-08-08: now that chapter count scales with source length (fixed same day -- kitab-al-riyad went from 11 to 20), evaluate grouping chapters into a higher-level structure (working name: Parts) whenever a book's design exceeds roughly 10 chapters, rather than shipping a flat 15-25-item list. A flat list that long is harder to scan than a two-level one, in the printed table of contents, the in-browser reader, and the Book Composer's own chapter dropdown -- the exact dropdown Asif was looking at when this was raised. NOT the same thing as the source's own internal divisions (Kitab al-Riyad's 'Discourses' and numbered sections, already handled by today's heading-demotion fix) -- this is a NEW top-level layer the pipeline would introduce for readability, above chapters the pipeline itself designed. Open questions, not yet answered: where the grouping decision is made (inside 0book-design's own segmentation pass, since it already reasons about the book's thematic arc, versus a separate pass after chapters are set); what a group is called, chosen to avoid colliding with a source's own terminology (a source that already uses 'Part' or 'Book' internally would need a different pipeline term); how many groups is right for a 20-chapter book; and how a group renders (a PDF section-divider page, TOC nesting, Composer dropdown grouping, or some combination). Logged as the request -- no design decided."
    noticed: 2026-08-08

  - id: front-matter-chapters-should-condense-to-one-introduction
    scope: pipeline
    status: open
    priority: P1
    effort: M
    summary: Condense front-matter chapters into one introduction
    title: "Asif 2026-08-08, from a chapter-by-chapter read of kitab-al-riyad's 20-chapter design: chapters 1-4 (The Freedom to Disagree / The Two Rivals / The Judge and His Cosmos / Why I Wrote This Book) are ALL pre-teaching front matter -- the modern editor's history of the dispute, biographies of the two disputants and the arbiter, then al-Kirmani's own preface -- and should have been ONE condensed introduction chapter, not four. Locked principle going forward: the reading edition's Chapter 1 should always land where the SOURCE's own teaching begins, irrespective of the source's language or how many pages of editorial/historical framing precede it in the scan. Everything before that point (translator's notes, editor's introduction, biographical apparatus about the author or the work's disputants, the author's own preface/doxology) is front matter and belongs in a single condensed introduction, not spread across several numbered chapters competing for the reader's attention with the actual argument. 0book-design's existing rule 1 already says to drop front-matter from chapter COVERAGE (title page, source's own TOC) but stops short of this -- it still let four separate chapters of pre-teaching material stand as numbered peers of the real content. Needs a concrete rule addition to the design prompt (or a post-design consolidation pass) that detects where a source's actual teaching/argument begins and folds everything before it into one preface, verified against multiple books (not just kitab-al-riyad) before landing, since a book with almost no front matter (e.g. the-master-and-the-disciple) must not be forced into an artificial split."
    noticed: 2026-08-08

