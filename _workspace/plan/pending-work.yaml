  - id: kashkole-urdu-to-english
    scope: pipeline
    status: doing
    priority: P2
    effort: L
    summary: Translate the Kashkole Wisdom corpus into English
    title: "Asif 2026-08-06: the KASHKOLE Wisdom corpus must be rendered into articulate English so it can augment content, etymology and explanations as ONE unit with KSESSIONS -- a separate, systematic pass over the whole corpus, not a per-note translation. STATE TODAY: content/knowledge-base/mirror.db carries all 1347 topics (1055 with a substantial body_plain) and NONE of them carry English -- the source dump at content/_shared/source-library/Kashkole.sql (759 MB, gitignored) contains zero name_en occurrences, so this is Urdu at source, not a mirroring loss. That is why intelligence/ingest_kashkole.py deliberately mints no atoms from them (rule D8, never re-translate) and records them as a deferred note; the only English Kashkole material in the corpus today is the 93 doctrine atoms (tradition fatimid-ismaili) from the wisdom-binder pipeline. The new pass must target the SAME articulation standard the reading editions use (docs/standards/book-articulation.md, REQ-BA-*) so a translated topic reads like the books it will be cited beside, must be idempotent and re-runnable, and must record provenance per topic so a rendering can be traced and revised. It supersedes D8 for this corpus and D8's text must be updated in the same change rather than left contradicting it. Until it lands, the Companion student-reader lane cites Kashkole topics by binder and topic name WITHOUT rendering their Urdu, and draws its English from the 606 KSESSIONS transcripts and the 93 doctrine atoms. Re-importing needs Docker, which is NOT installed on this machine; no re-import is required for this work since the mirror already holds every topic. IN FLIGHT 2026-08-12: the pass EXISTS and is HALF RUN. intelligence/translate_kashkole.py renders topics against REQ-BA-* with per-topic provenance in a new topic_translation table, idempotent on source_sha; the gates live in _kashkole_gates.py, split out under the DR-005 600-line limit. 76 topics rendered = 47.7% of the corpus BY WORK (4,330,116 of 9,086,511 source chars) though only 5.6% by topic count, because it takes the largest topics first and every giant is now done including the 312,374-char one. 4,345,900 characters of English; 70 clean, 6 flagged review for one Quranic verse each (5702, 5708, 5715, 5726, 5740, 5766). D8 is corrected in ingest_kashkole.py, in the docstring and at the deferral site. THE RUN THEN STOPPED: 1,271 topics failed within minutes at what looks like the subscription usage ceiling. Nothing lost - a failed topic writes no row, so a re-run picks up exactly those 1,271, and 4,756,395 source chars remain (~2.5-3 hours). THREE FAULTS TO FIX FIRST - K1 no circuit breaker, K2 no retry, K3 per-topic rather than per-window storage - are recorded in the debt ledger. Full state and resume instructions: _workspace/plan/kashkole-translation-status.md. PHASED PLAN 2026-08-12 (Stream B, queued behind Surah Al-Fateha): _workspace/plan/surah-fateha-kashkole-phased-plan.md -- confirmed by re-reading translate_kashkole.py the same day that K1/K2/K3 are all still unfixed (the runner is still the non-retrying _run_claude_p, no consecutive-failure breaker exists in the main loop, storage is still whole-topic not per-window), so the next run should fix those three before re-running the remaining 1,271 topics."
    noticed: 2026-08-06

  - id: annotation-policy-vs-zero-translit
    scope: pipeline
    status: done
    priority: P2
    effort: S
    summary: "ANSWERED — a complicated term repeats its script; a simple one does not"
    title: "Two locked rules meet and the outcome is worth a decision. 'Zero English transliteration of Arabic terms in book.md' (2026-08-02) and 'annotate once and intelligently, never mechanically' (the four-class teach/familiar/name/silent policy) disagree about a term's SECOND mention. Today the annotation policy wins: a `teach` term gets its script once per book and every later mention prints bare romanization; a `familiar` term (halal, iman, nafs -- words the classifier judged naturalised) never gets script at all. That is why ayyuhal-walad still prints *mujahadah*, *marifah* and *zauq* with no Arabic beside them after the apparatus ran. Not a defect -- it is the policy behaving as written -- but Asif should decide whether a teach term's later mentions should also carry script. ANSWERED 2026-08-11, Asif: 'repetitions can lighten up if the term is complicated.' So the once-per-book cap is a DEFAULT, not a ceiling. A term the reader is likely to have lost hold of since its introduction may carry its script again on a later mention; an easy one still gets it once. The reader's memory is the thing being served, and it does not hold a long unfamiliar word as well as a short one. WHAT REMAINS IS THE DEFINITION OF 'complicated', and it must be a property of the TERM rather than a per-book count, or the same word will be annotated differently in two editions. Candidate signals, all cheap and already available: length of the romanization, number of syllables, whether the root is in `morphology.db` (1,642 roots -- a term whose root a reader could recognise is easier than one whose root is absent), and how far apart the mentions are. NOT a model call: this is a lexical judgement made once per term and stored beside its glossary entry, so a person can overrule it and the answer stays stable across books. `familiar` terms are untouched by this -- Asif's answer is about repetitions of terms already being taught, and halal/iman/nafs are not taught. Which also settles the Sessions formulas (SubhanAllah and the rest): they are familiar, so they stay as delivered. CLOSED 2026-08-11 by Asif once the rule was recorded. Defining 'complicated' is implementation of a decided rule, not an open question, and belongs to whoever next touches the annotation pass."
    noticed: 2026-08-02

  - id: stale-cross-machine-response-format
    scope: general
    status: done
    priority: P1
    effort: M
    summary: Version-control the global response-format rules
    title: "The global response-format rules (~/.claude/response-template.md) live in a folder with NO git repo and NO remote, so nothing Asif approves there reaches any other machine. Worse: this repo separately carries two TRACKED copies (_workspace/plan/conventions/response-template.md, response-conventions.md) that describe the 4-part template RETIRED 2026-05-26 -- and CLAUDE.md's own text falsely claims those copies 'had not existed for some time.' Any machine pulling develop today gets confidently-stated instructions that contradict how Asif actually wants responses written. Needs: version-control the global folder with a remote so every machine pulls the same rules, delete the two stale tracked copies, and correct the false line in CLAUDE.md. RE-VERIFIED 2026-08-08: ~/.claude still has no .git, and both stale tracked copies still exist.TWO OF THREE DONE 2026-08-11. ~/.claude is now a git repository with a deny-by-default .gitignore -- `*` first, then four things named back in (the two rule files, the per-project memories, and the commands and skills Asif wrote), which is the only shape where a directory nobody has thought of yet is excluded by the default rather than by someone remembering a rule. 124 files, 0.6 MB of a 2.0 GB folder; every transcript, shell snapshot and command history stays on the disk. Verified before the first commit rather than asserted: no .jsonl staged, nothing outside the four roots staged, no assignment-shaped secret in any tracked file. The two stale copies are deleted and the three places that pointed at them are corrected, including the line in CLAUDE.md that claimed they were already gone. STILL OPEN: the REMOTE. It has to be private -- the memories carry account addresses, cloud project ids and billing arrangements -- and choosing where to publish 124 files of Asif's operating decisions is his call, not one to make on his behalf. One command once he names it. CLOSED 2026-08-11 by Asif. The remote is not run and is his to run when he wants it — `cd ~/.claude && git remote add origin <private-url> && git push -u origin main`. Closed rather than left open because the durable half is done: the rules have a history, the two lying copies are deleted, and nothing can silently drift back."
    noticed: 2026-08-08

  - id: pipeline-refactor-efficiency-accuracy-checkpoints
    scope: general
    status: doing
    priority: P1
    effort: L
    summary: Refactor the pipeline for efficiency and per-phase accuracy checks
    title: "Asif 2026-08-08: refactor the podcast-factory pipeline for efficiency and accuracy, with short checkpoints between phases rather than long uninterrupted runs. Two named parts: (1) a full test harness covering the pipeline end to end, not just per-module unit tests; (2) each phase re-checks the ACCURACY of every phase that ran before it, not only the one immediately prior -- e.g. phase 0c should evaluate the work of 0a and 0b as well as its own, not assume an earlier phase that already passed is still correct. LANDED 2026-08-08 (part 2, and part 1 in part): _step_ledger.py gives every step a record whether or not it spent money (the cost ledger only ever recorded paid steps, so the 25 deterministic apparatus steps left no trace at all); _phase_review.py runs named gates at every phase completion, hooked centrally in _progress.update_phase so a new phase cannot be added without one, with a RECHECK tier that later phases re-run over earlier phases' artifacts -- exactly part 2 as asked. Reviews are ADVISORY unless declared in BLOCKING_GATES (only PC3 today, which merely moves an already-blocking ship gate earlier), because a new review layer that can halt a run can strand a finished book. STILL OPEN: the e2e harness reaches the book lane (tests/e2e/test_book_lane_pipeline.py) but per-chapter, finalize, publish, trainer and merge remain uncovered -- 8 of 29 phases before this work, ~12 now; and the gate set is thin (the 5 phases with declared gates), so more phases deserve their own."
    noticed: 2026-08-08

