  - id: unverified-arabic
    scope: the-master-and-the-disciple
    status: done
    title: "CHECKED, no book edit needed. All 3 real quotations verified against quran.com (not from memory) and are accurate, correctly translated Quranic verses this book's own OCR simply doesn't happen to cover on these pages: (1) 'fa-la taghurrannakum al-hayat al-dunya' = Quran 35:5 (also echoed in 31:33), ch.6; (2) 'fa-man udturra ghayra baghin wa-la 'adin fa-la ithma 'alayhi' = Quran 2:173, ch.7; (3) 'ala fatratin min al-rusul' = Quran 5:19, ch.8. The 4th flag ('alayhim al-salam', ch.8) was never a quotation at all -- a standard honorific formula, a tool false positive, not a book problem -- fixed at the tool level (see arabic-audit-honorific-false-positive)."
    noticed: 2026-07-19

