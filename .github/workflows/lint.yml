name: lint

# R0 of the clean-code hardening plan (2026-07-18): Ruff + DR-005 gate the
# pipeline surface; ESLint + Prettier gate the site surface. mypy runs
# non-blocking (gradual opt-in per pyproject.toml) until the strict set is
# meaningful.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  pipeline:
    name: ruff + DR-005 (pipeline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # PINNED (2026-08-01). These were unpinned, so CI silently adopted every new
      # release — and ruff 0.16 began formatting Python fenced blocks inside .md,
      # taking `ruff format --check` from 584 files to 789 and failing five plan
      # and standard DOCUMENTS that had not changed. A lint gate that upgrades
      # itself fails on days nobody touched the code, which is how it stops being
      # believed. `*.md` is now excluded in pyproject.toml as well, so the gate is
      # green on both 0.15.x and 0.16.x; the pin is what keeps the NEXT such change
      # a deliberate bump rather than a surprise. Bump both deliberately, and run
      # the same versions locally. See RCA-009.
      - name: Install ruff + mypy
        run: python3 -m pip install "ruff==0.16.1" "mypy==2.3.0"
      - name: Ruff lint
        run: ruff check
      - name: Ruff format check
        run: ruff format --check
      - name: DR-005 line-count gate
        run: python3 infra/git-hooks/check-dr005.py
      # Scoped to the normative docs (agent specs, skills, root docs) — not all
      # markdown. Historical review transcripts carry stale paths that are correct
      # as history; flagging those would make the gate un-adoptable.
      - name: Dead-link gate (normative docs)
        run: python3 scripts/check_doc_links.py
      # AGENTS.md is generated from CLAUDE.md. Both load into every session, so drift
      # between them degrades every turn and is invisible to any other gate.
      - name: Agent-instructions mirror (AGENTS.md <- CLAUDE.md)
        run: python3 scripts/sync_agent_instructions.py --check
      # The project-specific audit probe. The pre-commit hook runs it too, but a hook
      # can be bypassed with --no-verify and is not installed on a fresh clone, so CI
      # is where it actually binds. Blocks on P0/P1 only; P2/P3 report without failing.
      - name: repo-surgeon probe (contract, mirrors, retired surfaces, plan)
        run: python3 scripts/repo_surgeon_probe.py
      # `continue-on-error` already makes this advisory. It used to ALSO end in
      # `|| true`, which forced a green step and hid the result entirely — a gate
      # that cannot fail teaches you to ignore it. Dropped 2026-07-26; the step
      # now reports honestly while still not blocking the job.
      - name: mypy (non-blocking, gradual opt-in)
        continue-on-error: true
        run: mypy scripts tools

  site:
    name: eslint + prettier + astro + tests + views (site)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plan-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plan-dashboard/package-lock.json
      # NOT `npm ci` — see the note above `site-runtime`'s install step. The
      # lock cannot describe the runner's ideal tree, and `npm ci` treats that
      # as fatal before running a single gate.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: ESLint (errors block, warnings advisory)
        run: npx eslint src scripts --quiet
      - name: Prettier check
        run: npm run format:check
      # The four gates below were all built and all uncalled by any workflow
      # until 2026-07-26. Each was verified green locally before being wired:
      # astro check 0 errors, 76/76 unit tests, view lint clean.
      - name: Astro type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: HTML-view quality gate (Cortex MUST rules)
        run: npm run lint:views

  site-runtime:
    name: runtime smoke (site)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plan-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plan-dashboard/package-lock.json
      # WHY NOT `npm ci` (changed 2026-08-01 after 60 consecutive red runs).
      #
      # `npm ci` refuses to install unless the lock describes the COMPLETE ideal
      # tree for the runner's platform. package-lock.json cannot satisfy that on
      # every platform at once, and the gap is not fixable by regenerating it:
      #
      #   - `@tailwindcss/oxide-wasm32-wasi` and `@img/sharp-wasm32` are the wasm
      #     FALLBACK bindings. They declare `@emnapi/core`, `@emnapi/runtime` and
      #     `@emnapi/wasi-threads` at caret ranges.
      #   - Resolving on darwin-arm64 never reaches that subtree, so npm neither
      #     writes those entries NOR keeps them: a lock generated (or merely
      #     touched by `npm install`) on macOS has them PRUNED. Verified
      #     2026-08-01 — grafting the entries back by hand and running
      #     `npm install --package-lock-only` strips all four again, and
      #     `--os=linux --cpu=x64` does not change the outcome.
      #   - ubuntu-x64 DOES reach that subtree. Once @emnapi published past the
      #     ranges, npm resolved them fresh from the registry, found no lock
      #     entry, and failed with "Missing: @emnapi/runtime@1.11.3 from lock
      #     file" before any gate ran.
      #
      # The lock was complete at ef325f2 (2026-07-21, generated on a Linux host);
      # regenerations on macOS in ca21cb8 and 5133957 took it from 10 @emnapi
      # entries to 6, and CI went red on 2026-07-27 and stayed red for five days.
      # Restoring a Linux-generated lock is NOT durable — the next local
      # `npm install` prunes it straight back.
      #
      # `npm install` has no whole-tree sync requirement, so it cannot fail this
      # way. Every version the lock DOES pin is still honoured; only the handful
      # of entries the lock structurally cannot carry are resolved fresh. For a
      # lint + smoke gate that is the right trade: these jobs publish nothing.
      # Do not "fix" this back to `npm ci` without reading docs/rca/2026-08-01-the-site-gates-were-dead-for-five-days.md.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # Playwright is already a devDependency; only the browser binary is missing
      # on a fresh runner. Its own job because it boots a dev server and drives a
      # real browser — slower than the static gates and worth isolating so a
      # runtime failure is legible at a glance.
      - name: Install chromium
        run: npx playwright install --with-deps chromium
      - name: Runtime smoke — every route, console errors, 5xx, failed requests
        run: npm run smoke
