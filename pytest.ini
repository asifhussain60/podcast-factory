[pytest]
# Repo has three test packages, two of which share the basename `tests`
# (scripts/podcast/tests/ and scripts/wisdom/tests/) plus an un-packaged root
# tests/. The default `prepend` import mode binds the first `tests` package to
# sys.modules and the second import then fails, aborting collection for the
# whole repo. `importlib` imports each test module under a unique name derived
# from rootdir, so all three trees collect together.
# Ref: https://docs.pytest.org/en/stable/explanation/goodpractices.html#choosing-an-import-mode
addopts = --import-mode=importlib
testpaths = tests scripts/podcast/tests scripts/wisdom/tests
