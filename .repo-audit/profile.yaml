# Project contract for the repo-audit skill (Phase 0.5).
#
# Machine-readable facts a probe cannot reliably infer. Every run validates this file
# against the filesystem BEFORE trusting it and reports each dead entry as a finding
# against the profile — so a stale contract surfaces instead of quietly misleading.
#
# Do NOT restate prose here. `cites:` names the authorities; the audit reads those.
# Derived and approved 2026-07-26.
schema: repo-audit/profile/v1

cites:
  - CLAUDE.md # the authority: branch policy, authorization tiers, standing operator rules
  - README.md # entry point: what this is, where things live, how to verify
  - framework.md # pipeline framework spec
  - _workspace/plan/architecture.md # architecture + decision records (DR-005, DR-009)

root:
  # EXHAUSTIVE. Anything at the root not listed here is a finding. Verified against
  # `git ls-files` on 2026-07-26, after the debris sweep — not copied from an older list.
  allow_files:
    - .env.example
    - .gitattributes
    - .gitignore
    - .mcp.json
    - .release-please-manifest.json
    - AGENTS.md # GENERATED from CLAUDE.md by scripts/sync_agent_instructions.py
    - CHANGELOG.md # GENERATED by release-please
    - CLAUDE.md
    - Makefile
    - README.md
    - framework.md
    - package.json
    - pyproject.toml
    - pytest.ini
    - release-please-config.json
    - requirements.txt
  allow_dirs:
    - .claude # per-machine runtime (gitignored except settings.json); agents/ is GENERATED
    - .codex # GENERATED Codex agent mirror (a curated subset, by design)
    - .github # workflows, prompts, GENERATED agent mirror
    - .repo-audit # this contract
    - .vscode
    - _learning # findings ledger + fixtures the quality gates learn from
    - _workspace # planning and review surface (working memory, not product)
    - content # THE DATA — see protected
    - docs
    - infra
    - listener # the Podcast Factory Listener — the audience-facing Cloudflare Workers app (2026-08-03)
    - _placeholder-site # static holding page for Podcast Factory on Safina, until the listener ships (2026-08-03)
    - plan-dashboard # the Astro site (ADMIN). Directory name is load-bearing; never rename.
    - scripts
    - skills-staging
    - tests
    - tools

protected:
  # Never move, rename, delete, or rewrite. The audit may READ these.
  - content/** # every book's source, chapters, episodes, composed book, audio
  - _learning/** # the learning corpus; fixtures encode known style violations verbatim
  - infra/git-hooks/dr005-grandfather.txt # a ratchet — shrink only, never re-add entries

verify:
  # In order. Phase 6 runs these after every group; a group that cannot be verified
  # does not ship. Sources: Makefile, pytest.ini, .github/workflows, plan-dashboard
  # package.json scripts.
  #
  - python3 scripts/repo_surgeon_probe.py # the project probe — see the note below
  - make lint # ruff check + ruff format --check + the DR-005 size gate
  - python3 -m pytest -q # all three test trees, per pytest.ini testpaths
  - python3 scripts/podcast/_boundary_check.py # never writes to the sibling journal repo
  - python3 scripts/check_doc_links.py # dead links in the normative docs
  - python3 scripts/sync_agent_instructions.py --check # AGENTS.md matches CLAUDE.md
  - bash scripts/podcast/sync-agent-wrappers.sh --check # agent mirrors, both directions
  - cd plan-dashboard && npm run lint && npm run format:check
  - cd plan-dashboard && npm run check && npm test && npm run lint:views
  - cd plan-dashboard && npm run ratchets # shrink-only lint-warning + file-size ratchets
  - cd plan-dashboard && npm run smoke # boots a dev server + headless chromium
  #
  # The Podcast Factory Library. Added 2026-08-16: this list named the pipeline and
  # the Astro site and was SILENT about a whole production app — so "what proves a
  # change safe" had no answer for the surface readers actually use, and the audit
  # could report healthy without ever having looked at it. The first three run
  # anywhere and are already in CI. The last three drive a real browser against a
  # booted dev server backed by the seeded local D1, so they are LOCAL-ONLY by
  # construction (`controls` refuses any host but localhost — it presses Delete and
  # flips open_to_all); they are recorded here because a human-run gate with no home
  # is a gate nobody is obliged to run. See the `listener` job in
  # .github/workflows/lint.yml for why CI stops at the first three.
  - cd listener && npm run typecheck && npm run lint && npm run format:check && npm run ratchets
  - cd listener && npm run test
  - cd listener && npm run build
  - cd listener && npm run security # access-control bypass probes, with controls
  - cd listener && npm run smoke # LOCAL ONLY — boots the dev server + chromium
  - cd listener && npm run controls # LOCAL ONLY — presses every control on every view
  - cd listener && npm run verify:read-aloud # LOCAL ONLY — every chapter of every published book
  # verify:read-aloud recorded here 2026-08-16. It asks the RENDERED PAGE whether
  # a chapter's read-aloud control is present, over every chapter of every
  # published book — the database can say a chapter is narrated while the page
  # shows nothing, because the control needs the narration row AND its uploaded
  # audio to survive the same join. It signs in as the administrator to reach
  # every book at once, so it is local-only for the same reason smoke and
  # controls are.
  #
  # On the probe (added to this list 2026-07-27, catalog:
  # skills-staging/repo-surgeon/SKILL.md). It validates THIS contract, root membership,
  # the retired-surface ban, agent-mirror and skill-registry parity, mirror pins, the
  # book-pipeline invariants and plan conformance. It is listed FIRST because it is the
  # cheapest (~0.6s) and because a stale contract invalidates the reasoning behind every
  # gate below it. Blocks on P0/P1 only; P2/P3 report without failing — today's baseline
  # is one P3 (the wave letters G-K are reused across `waves` and `waves_ghj`, a known
  # condition both snapshot generators already resolve by preferring the entry carrying
  # steps). Also wired into infra/git-hooks/pre-commit and the lint workflow; CI is what
  # actually binds, since a hook can be bypassed and is absent on a fresh clone.

size_gates:
  - glob: "scripts/podcast/**/*.py"
    limit: 600 # DR-005
    ratchet: infra/git-hooks/dr005-grandfather.txt
    note: >-
      Verified 2026-07-26: the gate is CORRECT and has no hole. Four files that look
      over-limit are grandfathered and two have already shrunk against their ceiling,
      which is the ratchet working. Do not "fix" this and do not add entries.
  - glob: "scripts/**/*.py"
    limit: 600
    ratchet: "infra/git-hooks/dr005-grandfather.txt"
    note: >-
      Added 2026-08-28. DR-005's gate covered scripts/podcast/ only, leaving 21
      tracked files under no ceiling — among them the three repo-surgeon modules,
      so the probe that reports a tree "outside every size gate" sat in the only
      ungated Python tree in the repo. Scope widened rather than a second gate
      added, and the limit is DR-005's own 600 rather than a new number: across
      the 21 newly-covered files the median is 238 lines and p95 is 414, so 600
      binds nothing that was not already an outlier. Two files were over it and
      are grandfathered under their own heading in the ratchet file; both
      failure modes (a new file over the limit, a grandfathered file growing)
      were verified able to fail on the day the scope changed.
  - glob: "plan-dashboard/{src,scripts,packages}/**/*.{ts,tsx,astro,mjs}"
    limit: 1000 # ENFORCED. Chosen by Asif 2026-08-11 over the 800 the audit proposed.
    ratchet: plan-dashboard/frontend-ratchets.json
    note: >-
      Added 2026-08-11, closing the gap this entry used to record as deliberate ("the
      TS/Astro side has NO size gate ... the number is the owner's call"). It was, and
      he made it: 1000, over the 800 proposed, which grandfathers 8 files instead of 12
      and leaves a legitimately large page more room. Context either way: across 324
      non-test source files the median is 123 lines and p95 is 709.
      Every file is governed by exactly ONE rule — at or under the ceiling, the ceiling
      governs; above it, its own recorded pin does, which it may fall below and never
      exceed. Scope is TRACKED files, so an unstaged scratch file is invisible; that
      matches where this runs (CI and pre-commit) and is documented in the script.
      The same file carries a per-RULE eslint WARNING budget, which also binds: warnings
      are advisory in eslint by design, which is how 93 accumulated where no gate had
      to look at them. Per rule rather than one total, so a new `any` cannot hide
      behind someone else's fixed hook warning.
  - glob: "listener/{app,scripts,workers}/**/*.{ts,tsx,mts,mjs}"
    limit: 850 # ENFORCED. Closes CQ-NO-SIZE-GATE, 2026-08-16 audit.
    ratchet: listener/frontend-ratchets.json
    note: >-
      Added 2026-08-16 alongside this app's first lint config — it had NO size gate
      and NO lint config at all before that pass (CQ-NO-LINT / CQ-NO-SIZE-GATE).
      850 chosen from this app's own distribution (107 sized files, median 148,
      p95 795), same reasoning as the plan-dashboard entry above: the top four
      files (three UI routes plus the audio player, 1162-1399 lines) sit clear of
      everything else, and the next file down sits inside a dense cluster in the
      700s-800s rather than as a fifth outlier — so 850 grandfathers only the
      genuine break in the distribution. Same every-file-governed-by-exactly-one-
      rule contract as plan-dashboard's entry; same per-RULE eslint warning budget
      in the same ratchet file. Enforced by
      listener/scripts/check-frontend-ratchets.mjs (`npm run ratchets`), its own
      copy rather than a shared one — this app imports nothing from
      plan-dashboard/ at runtime and that boundary holds for dev tooling too.

apps:
  # The web surfaces, declared so the audit can reason about them instead of
  # hardcoding two directory names in a script. Added 2026-08-16.
  #
  # Everything below is READ by scripts/repo_surgeon_checks.py — gate coverage
  # (is each `gates:` entry wired into CI or the verify list above?), route
  # integrity, lint/size-gate presence, and debug leftovers in shipped source.
  # A field that stops resolving is a finding against THIS file, same as every
  # other contract entry.
  - dir: plan-dashboard
    name: Podcast Factory Astro Site # ADMIN/authoring. Directory name is load-bearing.
    source: [src, scripts, packages]
    lint_config: eslint.config.js
    route_kind: file # src/pages/**.astro; coverage pinned by site-health-routes.test.mjs
    route_dir: src/pages
    gates: [lint, format:check, check, test, lint:views, ratchets, smoke, build]
    # `build` added 2026-08-16. This app's own production build was run by
    # nothing — not CI, not the verify list — while the Library's was built in CI
    # from the start. `astro check` type-checks and `smoke` boots a DEV server;
    # neither exercises the build, so a build-only break would have reached a
    # deploy unseen. Now a step in the `site` job of .github/workflows/lint.yml.
  - dir: listener
    name: Podcast Factory Library # AUDIENCE-facing Worker at podcast-factory.safinaverse.com
    source: [app, workers, scripts]
    lint_config: eslint.config.js # added 2026-08-16, closing CQ-NO-LINT. Same
      # pinned versions and posture as plan-dashboard's config (correctness
      # rules at error, the pre-existing React-hooks findings at warn pending
      # the same kind of review that app already had before ratcheting them),
      # adapted for this app's own stack — no Astro plugin, no packages/*
      # workspace tier. scripts/check-frontend-ratchets.mjs is this app's own
      # copy of the ratchet gate, not shared with plan-dashboard's: this app
      # imports nothing from plan-dashboard/ at runtime and that boundary
      # holds for dev tooling too. Baseline: listener/frontend-ratchets.json.
    route_kind: manifest # app/routes.ts IS the access policy — position, not pathname
    route_policy: app/routes.ts
    route_dir: app/routes
    error_boundary_owner: app/root.tsx # the ONLY module that may export one
    gates:
      [typecheck, lint, format:check, ratchets, test, build, security, smoke, controls, verify:read-aloud]
      # verify:read-aloud added 2026-08-16. It existed as an npm script for a day
      # without being named here — which is the condition GT-UNDECLARED now
      # reports, because the gate-coverage check could only ever audit gates
      # somebody had remembered to declare. Browser gate, so LOCAL ONLY like
      # smoke/controls: it signs in as the administrator to reach every book.
    migrations: migrations # numbered, applied in order; gap or duplicate = a migration nobody runs
    sql_writers:
      # Everything that issues SQL against this app's D1, declared because a probe
      # cannot tell this database's tables from the pipeline's own SQLite corpora
      # (mirror.db, morphology.db) by looking at a statement. Each entry is
      # validated on every run; a path that stops resolving is a contract finding.
      # A write to a table no migration creates fails at DEPLOY, against the live
      # database, after the content has already been prepared — which is why this
      # is checked here rather than left to the first person who notices.
      - listener/app/server
      - scripts/podcast/publish_to_listener.py
      - scripts/podcast/_production_publish.py
      - scripts/podcast/sync_listener_work_groups.py
      - scripts/podcast/upload_listener_media.py

hygiene:
  # What the cleanup pass (scripts/repo_cleanup.py) may reclaim, and what it must
  # never touch however much space it would free. Added 2026-08-16.
  protected_runtime:
    - path: listener/.wrangler/state/v3/d1
      why: >-
        The LOCAL D1. Deleting it wipes the `session` table, which signs the operator
        out of localhost — the site then shows a sign-in page and looks like nothing
        shipped. CLAUDE.md bans this by name: never destroy the local environment to
        get work done. Rebuild only when no migration path exists, say so first, and
        re-seed afterwards.
    - path: .git/objects
      why: >-
        Reachable objects are the repository. Loose-object reclamation goes through
        `git gc`, which knows what is referenced; a glob does not.
  reclaimable:
    # Regenerable by a documented command, so removal costs only the time to rebuild.
    - name: python-bytecode
      match: "**/__pycache__"
      rebuild: automatic on next import
    - name: tool-caches
      match: [.ruff_cache, .pytest_cache, .benchmarks, plan-dashboard/.visual-qa]
      rebuild: automatic on next run
    - name: build-output
      match: [plan-dashboard/dist, listener/build, "**/*.tsbuildinfo"]
      rebuild: npm run build
    - name: os-debris
      match: "**/.DS_Store"
      rebuild: n/a
    - name: local-object-store
      match: listener/.wrangler/state/v3/r2
      rebuild: >-
        Repopulates on demand. Since 3ce507ef the dev server serves local media
        straight off disk rather than mirroring it into R2, so this is the
        leftover of the previous arrangement.
      confirm: true # large and app-adjacent; never swept without an explicit yes
    - name: git-maintenance
      match: .git
      rebuild: "`git gc --prune=now` — reclaims loose objects and repacks; never a glob"
      confirm: true

generators:
  # Scripts that WRITE a committed artifact out of another file in this repo.
  # Declared 2026-08-16, because the repo grew three of these in two weeks and the
  # audit had no concept for them.
  #
  # A generated artifact is a `mirrors:` pair whose second leg happens to be
  # produced mechanically — so it drifts the same way and costs the same to get
  # wrong, but nothing was watching it. The probe does NOT take a "pinned" flag
  # from this list; it DERIVES the answer by asking whether any tracked test or
  # gate actually invokes the generator's own `--check`. A generator that offers
  # that facility and is never asked is the finding.
  - listener/scripts/sync-quote-inks.mjs
  - listener/scripts/sync-study-tracks.mjs
  - listener/scripts/sync-fonts.mjs
  # Declared 2026-08-17. `prebuild` rewrote six tracked src/generated/mermaid/*.svg
  # on every build with nothing comparing the result, so it was a generator the
  # audit could not see: a mermaid version drift (11.15.0 against the lockfile's
  # 11.16.1) silently changed every diagram and the only signal was a dirty tree.
  # It now offers --check (`npm run mermaid:check`), gated in the lint workflow's
  # site-runtime job — the one job with chromium, which the renderer needs.
  - plan-dashboard/scripts/render-mermaid.mjs

mirrors:
  # Files that MUST change together. `pinned_by` names the shared fixture proving they
  # agree. All three were pinned on 2026-07-26; six real divergences were found in the
  # process, including two resolution ladders that disagreed about precedence.
  - a: plan-dashboard/src/lib/content-paths.ts
    b: scripts/podcast/_paths.py
    pinned_by: plan-dashboard/scripts/lib/content-paths.fixtures.json
  - a: plan-dashboard/src/lib/peq-scores.ts
    b: scripts/podcast/_quality.py
    pinned_by: plan-dashboard/scripts/lib/peq-scores.fixtures.json
    note: >-
      A TRIPLE. The interest weight and patterns are owned by scripts/podcast/_rules.py;
      _quality.py imports them and the TS side re-types them. The fixture anchors to
      _rules.py, not to _quality.py.
  - a: plan-dashboard/scripts/lib/anchor-key.mjs
    b: scripts/podcast/_book_edits.py
    pinned_by: plan-dashboard/scripts/lib/anchor-key.fixtures.json
    note: A divergence here silently orphans every saved Composer edit.
  - a: plan-dashboard/scripts/lib/vowelling.mjs
    b: scripts/podcast/_vowelling.py
    pinned_by: plan-dashboard/scripts/lib/vowelling.fixtures.json
    note: >-
      The marks-only gate (`rejection_reason`). Both legs load the SAME fixture and both
      pass today — this entry exists because the probe's MI-UNPINNED / MI-PIN-GONE checks
      only audit pairs the contract names, so deleting the fixture raised nothing. A
      divergence lets the Composer's Diacritics button and the compose-time vowelling pass
      admit different Arabic into book.md. Declared 2026-08-01; the pin itself has existed
      since 2026-07-29.
  - a: plan-dashboard/src/lib/reader/companion/surah-names.ts
    b: scripts/podcast/_book_citations.py
    pinned_by: plan-dashboard/scripts/lib/surah-names.fixtures.json
    note: >-
      The 114 surah names. They labelled companion cards until 2026-08-01 and now also
      print into every citation of a composed book — `(2:24)` reaches the page as
      `(Al-Baqarah: 24)` — so a divergence has a book and the card beside it naming the
      same surah differently. Plain ASCII romanization on both legs, per the house rule.
  - a: plan-dashboard/src/lib/reader/book-fences.ts
    b: plan-dashboard/scripts/lib/book-html.mjs
    pinned_by: plan-dashboard/scripts/lib/book-html.test.mjs
    note: >-
      The pipeline's machine fence kinds — FENCE_KINDS (the contract) vs
      MACHINE_FENCE_KINDS (the print renderer's skip list). Test-pinned by a direct
      deepEqual of the two LIVE values rather than by a fixture, because both sides are
      JS-loadable and a shared artifact would be a third thing that can drift. Added
      2026-07-26 after the skip list was found missing `edition-intro`, which had been
      in the contract since 2026-07-21 and was rendering as visible text.
  - a: plan-dashboard/src/lib/reader/book-fences.ts
    b: scripts/podcast/_book_augment.py + _book_bridges.py + _self_study.py + _book_frontmatter.py
    pinned_by: scripts/podcast/tests/test_fence_kinds_cross_language.py
    note: >-
      The Python LEG of the same contract, and the one the JS pin cannot see. No Python
      module enumerates the set; each producer declares only the kind it authors, so the
      pin derives the set by scanning for marker literals and compares it to FENCE_KINDS.
      This is what catches a kind added on one side of the language boundary — comparing
      the two renderer lists to each other stays green when both are wrong together,
      which is exactly how the edition-intro bug shipped. A refactor that moves the
      producers onto a shared Python constant must keep the scan honest; the test's
      fourth case fails loudly if the scan ever matches nothing.
  - a: plan-dashboard/src/lib/reader/work-groups.ts
    b: scripts/podcast/sync_listener_work_groups.py
    pinned_by: plan-dashboard/scripts/lib/work-groups.fixtures.json
    note: >-
      What makes two books ONE WORK, answered once for the two surfaces a reader
      looks at. Declared 2026-08-17, when the Astro Site's Studio shelf began reading
      the same `content/<Bucket>/_listener-groups/*.yml` declarations the Podcast
      Factory Library reads. Before that the shelf knew only the `<work>-vol-NN` slug
      shape, so Mukhtasar's two flat, independently published volumes stacked on the
      Library and scattered on the shelf — a disagreement about what a work IS, with
      nothing anywhere saying why. That is also the failure a divergence here
      reproduces, and it is silent: both sides keep working, they just describe a
      different library. The shelf deliberately does NOT read `work.yml` — the nested
      case is already handled by the slug shape, and works for a work carrying no
      manifest at all, so reading both would put two mechanisms in competition to
      group the same slugs.

  - a: plan-dashboard/scripts/regenerate-snapshots.mjs
    b: plan-dashboard/scripts/regenerate-snapshots.py
    pinned_by: tests/test_snapshot_regenerator_parity.py
    note: >-
      Two full implementations, deliberately. The Python path lets a Tier 0 obligation be
      met from the Python-only pipeline without Node; the Node path is invoked directly by
      a launchd script. Both are load-bearing — do not propose collapsing them.

fragile:
  # Findings here are reported; changes are proposed only after asking.
  - path: pyproject.toml
    why: >-
      Deliberately has no [project]/[build-system]. Packaging is gated behind phase R4 of
      _workspace/plan/refactor/clean-code-hardening-plan.md. Documented decision.
  - path: pytest.ini
    why: >-
      --import-mode=importlib is load-bearing: two of the three test trees share the
      basename `tests`, and prepend mode aborts collection repo-wide. Merging this into
      pyproject.toml gains nothing and risks the whole suite.
  - path: scripts/podcast/
    why: >-
      440 modules, 261 of which use a sys.path.insert bootstrap before flat imports.
      Consolidating the three Python homes is R4-adjacent, not hygiene.
  - path: plan-dashboard/src/components/NarrativeScroll.tsx
    why: >-
      3,228 lines of live UI. Splitting it is a separate project with its own plan, and
      only sensible now that the runtime smoke gate actually runs in CI.
  - path: plan-dashboard/src/scripts/book-composer.ts
    why: >-
      RE-PINNED to 4,253 on 2026-08-16, on Asif's explicit ruling (question 2b of that
      day's audit). It had reached 4,369 lines against a 4,129 pin; the same pass took
      it to 4,253 by moving out the data-island types, the inert toolbar data, and a
      THIRD copy of the quote-kind label map that had been drifting against its two
      siblings — genuine reduction, not the re-pin. What remains has no safe cut: the
      file is one `boot()` closure, and every candidate block — the Arabic style group,
      the quote-kind actions, the drag targets — reads six to nine sibling closures, so
      extracting one means threading that many dependencies across a module boundary on
      the surface Asif authors every book with. That is a decomposition project with its
      own plan, exactly as recorded for NarrativeScroll.tsx above.
      THIS PIN GOVERNS CODE ORGANIZATION ONLY. book-composer.ts is the browser-side
      script for the Book Composer's editing UI (drag-and-drop visual placement,
      toolbar wiring, autosave) — it holds no book prose and runs nowhere near the
      pipeline that composes, translates, or vowels a book's text. Raising this number
      changes how many lines of UI-wiring code may accumulate before the gate complains;
      it has no path to affecting what a reader sees in a published book. The gates that
      DO guard book quality — book-challenger, book-render-challenger, the vowelling
      marks-only rule, the narrative-frame enforcement — are untouched by this ratchet
      and unaffected by this decision.
      Still shrink-only from here: the number may fall as the decomposition project
      lands, and may never rise again without another explicit ruling.
      CORRECTED 4253 -> 4254 later the same day, and this is a MEASUREMENT fix
      rather than a re-pin: the file has not changed a byte since the ruling. The
      pin was transcribed as a `wc -l` newline count while the checker measures
      `split("\n").length`, which is one greater on any file ending in a newline —
      so the gate had been failing since the moment it was re-pinned, against a
      file nobody had touched. Every other pin in that ratchet file matches the
      checker's arithmetic exactly, which is what identified this one as the
      outlier. The ceiling still denotes the same file state Asif ruled on; if he
      reads it otherwise, the fix is to cut one line, not to raise the number.
