# Project contract for the repo-audit skill (Phase 0.5).
#
# Machine-readable facts a probe cannot reliably infer. Every run validates this file
# against the filesystem BEFORE trusting it and reports each dead entry as a finding
# against the profile — so a stale contract surfaces instead of quietly misleading.
#
# Do NOT restate prose here. `cites:` names the authorities; the audit reads those.
# Derived and approved 2026-07-26.
schema: repo-audit/profile/v1

cites:
  - CLAUDE.md # the authority: branch policy, authorization tiers, standing operator rules
  - README.md # entry point: what this is, where things live, how to verify
  - framework.md # pipeline framework spec
  - _workspace/plan/architecture.md # architecture + decision records (DR-005, DR-009)

root:
  # EXHAUSTIVE. Anything at the root not listed here is a finding. Verified against
  # `git ls-files` on 2026-07-26, after the debris sweep — not copied from an older list.
  allow_files:
    - .env.example
    - .gitattributes
    - .gitignore
    - .mcp.json
    - .release-please-manifest.json
    - AGENTS.md # GENERATED from CLAUDE.md by scripts/sync_agent_instructions.py
    - CHANGELOG.md # GENERATED by release-please
    - CLAUDE.md
    - Makefile
    - README.md
    - framework.md
    - package.json
    - pyproject.toml
    - pytest.ini
    - release-please-config.json
    - requirements.txt
  allow_dirs:
    - .claude # per-machine runtime (gitignored except settings.json); agents/ is GENERATED
    - .codex # GENERATED Codex agent mirror (a curated subset, by design)
    - .github # workflows, prompts, GENERATED agent mirror
    - .repo-audit # this contract
    - .vscode
    - _learning # findings ledger + fixtures the quality gates learn from
    - _workspace # planning and review surface (working memory, not product)
    - content # THE DATA — see protected
    - docs
    - infra
    - plan-dashboard # the Astro site. Directory name is load-bearing; never rename.
    - scripts
    - skills-staging
    - tests
    - tools

protected:
  # Never move, rename, delete, or rewrite. The audit may READ these.
  - content/** # every book's source, chapters, episodes, composed book, audio
  - _learning/** # the learning corpus; fixtures encode known style violations verbatim
  - infra/git-hooks/dr005-grandfather.txt # a ratchet — shrink only, never re-add entries

verify:
  # In order. Phase 6 runs these after every group; a group that cannot be verified
  # does not ship. Sources: Makefile, pytest.ini, .github/workflows, plan-dashboard
  # package.json scripts.
  - make lint # ruff check + ruff format --check + the DR-005 size gate
  - python3 -m pytest -q # all three test trees, per pytest.ini testpaths
  - python3 scripts/podcast/_boundary_check.py # never writes to the sibling journal repo
  - python3 scripts/check_doc_links.py # dead links in the normative docs
  - python3 scripts/sync_agent_instructions.py --check # AGENTS.md matches CLAUDE.md
  - bash scripts/podcast/sync-agent-wrappers.sh --check # agent mirrors, both directions
  - cd plan-dashboard && npm run lint && npm run format:check
  - cd plan-dashboard && npm run check && npm test && npm run lint:views
  - cd plan-dashboard && npm run smoke # boots a dev server + headless chromium

size_gates:
  - glob: "scripts/podcast/**/*.py"
    limit: 600 # DR-005
    ratchet: infra/git-hooks/dr005-grandfather.txt
    note: >-
      Verified 2026-07-26: the gate is CORRECT and has no hole. Four files that look
      over-limit are grandfathered and two have already shrunk against their ceiling,
      which is the ratchet working. Do not "fix" this and do not add entries.
  # The TS/Astro side has NO size gate. Six files exceed the Python limit, the largest
  # at 3,228 lines. Deliberately not added yet: the right ceiling for JSX is not 600,
  # and the number is the owner's call, not the audit's.

mirrors:
  # Files that MUST change together. `pinned_by` names the shared fixture proving they
  # agree. All three were pinned on 2026-07-26; six real divergences were found in the
  # process, including two resolution ladders that disagreed about precedence.
  - a: plan-dashboard/src/lib/content-paths.ts
    b: scripts/podcast/_paths.py
    pinned_by: plan-dashboard/scripts/lib/content-paths.fixtures.json
  - a: plan-dashboard/src/lib/peq-scores.ts
    b: scripts/podcast/_quality.py
    pinned_by: plan-dashboard/scripts/lib/peq-scores.fixtures.json
    note: >-
      A TRIPLE. The interest weight and patterns are owned by scripts/podcast/_rules.py;
      _quality.py imports them and the TS side re-types them. The fixture anchors to
      _rules.py, not to _quality.py.
  - a: plan-dashboard/scripts/lib/anchor-key.mjs
    b: scripts/podcast/_book_edits.py
    pinned_by: plan-dashboard/scripts/lib/anchor-key.fixtures.json
    note: A divergence here silently orphans every saved Composer edit.
  - a: plan-dashboard/scripts/regenerate-snapshots.mjs
    b: plan-dashboard/scripts/regenerate-snapshots.py
    pinned_by: tests/test_snapshot_regenerator_parity.py
    note: >-
      Two full implementations, deliberately. The Python path lets a Tier 0 obligation be
      met from the Python-only pipeline without Node; the Node path is invoked directly by
      a launchd script. Both are load-bearing — do not propose collapsing them.

fragile:
  # Findings here are reported; changes are proposed only after asking.
  - path: pyproject.toml
    why: >-
      Deliberately has no [project]/[build-system]. Packaging is gated behind phase R4 of
      _workspace/plan/refactor/clean-code-hardening-plan.md. Documented decision.
  - path: pytest.ini
    why: >-
      --import-mode=importlib is load-bearing: two of the three test trees share the
      basename `tests`, and prepend mode aborts collection repo-wide. Merging this into
      pyproject.toml gains nothing and risks the whole suite.
  - path: scripts/podcast/
    why: >-
      440 modules, 261 of which use a sys.path.insert bootstrap before flat imports.
      Consolidating the three Python homes is R4-adjacent, not hygiene.
  - path: plan-dashboard/src/components/NarrativeScroll.tsx
    why: >-
      3,228 lines of live UI. Splitting it is a separate project with its own plan, and
      only sensible now that the runtime smoke gate actually runs in CI.
