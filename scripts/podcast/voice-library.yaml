# Voice library — the approved casting pools for autonomous audio rendering.
#
# Approved by Asif's ear 2026-06-12 (casting rounds M1-M9 male, F1-F8 female;
# standard test line: Quran 14:7 + dhikr/balwa/huda/taqwa in native Arabic
# script, eleven_v3, seed 424242). Selection criteria: very clear English +
# correct Arabic phonetics. v3 is multilingual — native Arabic script in the
# render text yields correct Arabic phonemes from non-Arab voices.
#
# Resolution (scripts/podcast/_voice_library.py + _audio_engines.voices_for_book):
#   1. series-config `elevenlabs_voices: {host_a: <id>, host_b: <id>}` — explicit IDs, always wins
#   2. series-config `voice_cast: {host_a: <name>, host_b: <name>}` — names resolved here
#   3. deterministic per-slug pick from these pools (stable across re-renders)
#   4. engine-card default_voices (legacy fallback)
#
# in_roster: false = shared-library voice; renders work directly by ID, but
# pinning into the account roster needs the `add_voice_from_voice_library`
# API-key permission (not currently granted).

version: 1
engine: elevenlabs

# sample: short clip served by the Astro site voice picker (public/voice-samples/).
# Render the clips with build_voice_samples.py; the file is named <name>.mp3.

