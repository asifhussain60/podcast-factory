# series-config.yaml — White Nights
# A published audiobook: someone else's book, read aloud by a narrator.

content_profile: audiobook

# A novel read aloud is still narrated in the third person by its own
# narrator. The reader is not the frame, and neither is the person holding
# the microphone.
narrative_frame: external_narrator

# The source is a recording, not a printed text. Gates that exist to catch
# a translation reading like a calque do not apply to speech.
source_medium: audio_lecture
source_language: en

# DECLARED, not inherited, though the default now agrees.
#
# `_pipeline_flags._default_knobs` returns these for any spoken-lane book
# since 2026-09-01, so omitting them would be correct. They are written out
# anyway because `purification-of-the-heart` is what happens when a spoken
# book leaves them to a default: it inherited `author_companion` and would
# have had its prose re-voiced away from the recording it is timed against.
# Two lines here mean this book's contract is legible in its own config
# rather than only in a function somewhere else.
book_voice: faithful
book_augmentation: none
book_visuals: manual_only

enable_video: false

# --- The Book in Brief ---------------------------------------------------
# The condensed edition that opens the book, above the introduction.
#
# DECLARED, not inferred, for the same reason `narrative_frame` above is: what
# kind of book this is decides what a condensation must protect, and a pipeline
# that reads it off the prose will read it differently after a rewrite. The
# profile here is `audiobook`, which says how the text was made and nothing about
# what it is — a recording can be a novella or a lecture — so the strategy has to
# be stated.
#
# `narrative` protects characters, motivation, the causal chain, the turning
# points and the ending; it treats atmosphere and description as compressible.
brief_strategy: narrative
brief_mode: standard

# The audiobook opens with a modern editorial introduction — an essay ABOUT the
# novella, written by the producer, which recounts the entire plot including the
# ending before Dostoyevsky's text begins. It is not part of the book, and
# condensing it would build the brief out of somebody else's summary: analysed as
# a chapter it produced ten "essential" points, every one a restatement of a
# chapter that had not been read yet.
brief_exclude_sections:
  - Introduction
