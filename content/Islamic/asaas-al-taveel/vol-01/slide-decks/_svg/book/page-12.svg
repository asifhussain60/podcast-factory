<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 720"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a6a58"/></marker></defs><text x="380" y="34" font-family="Lato, system-ui, sans-serif" font-size="20" fill="#8b4513" font-weight="bold" text-anchor="middle">The Rank Is Preserved Even When the Holder Is Expelled</text><text x="380" y="62" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#7a6a58" font-weight="bold" text-anchor="middle">THE RANK IS PRESERVED EVEN WHEN THE HOLDER IS EXPELLED</text><rect x="180" y="90" width="400" height="36" fill="#e8d9bf" stroke="#d9cdbd" rx="6"/><text x="380" y="113" font-family="Lato, system-ui, sans-serif" font-size="14" fill="#8b4513" font-weight="bold" text-anchor="middle">THE RANK OF THE FIRST PROOF</text><rect x="20" y="150" width="230" height="340" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="135.0" y="172" font-family="Lato, system-ui, sans-serif" font-size="14" fill="#8b4513" font-weight="bold" text-anchor="middle">ACTION 1</text><rect x="40" y="190" width="90" height="24" fill="#f0e6d2" stroke="#d9cdbd" rx="6"/><text x="85" y="207" font-family="Lato, system-ui, sans-serif" font-size="11" fill="#2b2117" font-weight="bold" text-anchor="middle">HIGH ANGEL</text><rect x="140" y="190" width="90" height="24" fill="#f0e6d2" stroke="#d9cdbd" rx="6"/><text x="185" y="207" font-family="Lato, system-ui, sans-serif" font-size="11" fill="#2b2117" font-weight="bold" text-anchor="middle">IBLIS</text><text x="30" y="240" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#2b2117"><tspan>Occupancy: Iblis positioned</tspan><tspan x="30" dy="16"> inside the node. (Noted as a</tspan><tspan x="30" dy="16"> high angel among the twelve</tspan><tspan x="30" dy="16"> designated to report to the</tspan><tspan x="30" dy="16"> people).</tspan></text><line x1="250" y1="320" x2="265" y2="320" stroke="#7a6a58" marker-end="url(#arr)"/><rect x="265" y="150" width="230" height="340" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="380.0" y="172" font-family="Lato, system-ui, sans-serif" font-size="14" fill="#8b4513" font-weight="bold" text-anchor="middle">ACTION 2</text><rect x="295" y="190" width="170" height="30" fill="#f0e6d2" stroke="#d9cdbd" rx="6"/><text x="380" y="210" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#8b4513" font-weight="bold" text-anchor="middle">EXPULSION</text><text x="275" y="240" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#2b2117"><tspan>Refused prostration, cursed,</tspan><tspan x="275" dy="16"> cut off. The rank is</tspan><tspan x="275" dy="16"> vacated.</tspan></text><rect x="335" y="350" width="90" height="24" fill="#e8c8b0" stroke="#d9cdbd" rx="6"/><text x="380" y="367" font-family="Lato, system-ui, sans-serif" font-size="11" fill="#2b2117" font-weight="bold" text-anchor="middle">IBLIS</text><line x1="495" y1="320" x2="510" y2="320" stroke="#7a6a58" marker-end="url(#arr)"/><rect x="510" y="150" width="230" height="340" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="625.0" y="172" font-family="Lato, system-ui, sans-serif" font-size="14" fill="#8b4513" font-weight="bold" text-anchor="middle">ACTION 3</text><rect x="540" y="190" width="170" height="30" fill="#f0e6d2" stroke="#d9cdbd" rx="6"/><text x="625" y="210" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#8b4513" font-weight="bold" text-anchor="middle">REPLACEMENT</text><rect x="520" y="230" width="210" height="22" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><text x="625" y="246" font-family="Lato, system-ui, sans-serif" font-size="11" fill="#7a6a58" font-weight="bold" text-anchor="middle">FROM THE RANK ITSELF</text><rect x="560" y="260" width="130" height="22" fill="#f0e6d2" stroke="#d9cdbd" rx="6"/><text x="625" y="276" font-family="Lato, system-ui, sans-serif" font-size="11" fill="#2b2117" font-weight="bold" text-anchor="middle">EVE</text><rect x="520" y="290" width="210" height="22" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><text x="625" y="306" font-family="Lato, system-ui, sans-serif" font-size="11" fill="#7a6a58" font-weight="bold" text-anchor="middle">TRUST OF THE INNER CALL</text><text x="520" y="335" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#2b2117"><tspan>Eve is inserted. Taken up</tspan><tspan x="520" dy="16"> not from a physical rib, but</tspan><tspan x="520" dy="16"> from the rank itself. She</tspan><tspan x="520" dy="16"> assumes the trust of the</tspan><tspan x="520" dy="16"> inner call.</tspan></text><rect x="20" y="510" width="720" height="60" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="30" y="532" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>The first proof became the first enemy. By supplying a replacement within the same rank,</tspan><tspan x="30" dy="16"> the architecture is flawlessly preserved.</tspan></text></svg>