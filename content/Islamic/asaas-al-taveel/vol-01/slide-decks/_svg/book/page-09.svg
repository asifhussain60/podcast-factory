<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620"><text x="380" y="34" font-family="Lato, system-ui, sans-serif" font-size="20" fill="#8b4513" font-weight="bold" text-anchor="middle">Breaking the Testimony Halves the Architecture</text><text x="380" y="64" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#7a6a58" font-weight="bold" text-anchor="middle">BREAKING THE TESTIMONY HALVES THE ARCHITECTURE</text><rect x="30" y="90" width="150" height="40" fill="#f0e6d2" stroke="#d9cdbd" rx="6"/><text x="105.0" y="115" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#8b4513" font-weight="bold" text-anchor="middle">GROUP</text><rect x="185" y="90" width="180" height="40" fill="#f0e6d2" stroke="#d9cdbd" rx="6"/><text x="275.0" y="115" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#8b4513" font-weight="bold" text-anchor="middle">WHAT THEY RECOGNIZED</text><rect x="370" y="90" width="180" height="40" fill="#f0e6d2" stroke="#d9cdbd" rx="6"/><text x="460.0" y="115" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#8b4513" font-weight="bold" text-anchor="middle">WHAT THEY DENIED</text><rect x="555" y="90" width="175" height="40" fill="#f0e6d2" stroke="#d9cdbd" rx="6"/><text x="642.5" y="115" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#8b4513" font-weight="bold" text-anchor="middle">WHAT BROKE</text><rect x="30" y="134" width="150" height="130" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><text x="38" y="154" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#2b2117"><tspan>The Philosophers</tspan></text><rect x="185" y="134" width="180" height="130" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><text x="193" y="154" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#2b2117"><tspan>The upper spiritual</tspan><tspan x="193" dy="16"> limits (renamed intellect</tspan><tspan x="193" dy="16"> and soul).</tspan></text><rect x="370" y="134" width="180" height="130" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><text x="378" y="154" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#2b2117"><tspan>The lower earthly limits</tspan><tspan x="378" dy="16"> (no messengers in their</tspan><tspan x="378" dy="16"> system).</tspan></text><rect x="555" y="134" width="175" height="130" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><text x="563" y="154" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#2b2117"><tspan>The testimony lacks its</tspan><tspan x="563" dy="16"> earthly correspondent.</tspan></text><rect x="30" y="268" width="150" height="130" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><text x="38" y="288" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#2b2117"><tspan>The People of Outward</tspan><tspan x="38" dy="16"> Islam</tspan></text><rect x="185" y="268" width="180" height="130" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><text x="193" y="288" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#2b2117"><tspan>The lower earthly limits</tspan><tspan x="193" dy="16"> (prophet and law).</tspan></text><rect x="370" y="268" width="180" height="130" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><text x="378" y="288" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#2b2117"><tspan>The inner office of the</tspan><tspan x="378" dy="16"> Silent One.</tspan></text><rect x="555" y="268" width="175" height="130" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><text x="563" y="288" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#2b2117"><tspan>The testimony lacks its</tspan><tspan x="563" dy="16"> hidden register.</tspan></text><rect x="30" y="408" width="700" height="60" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="40" y="430" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>Each affirmed some and denied others. The testimony is whole only when all four limits</tspan><tspan x="40" dy="16"> are held together.</tspan></text></svg>