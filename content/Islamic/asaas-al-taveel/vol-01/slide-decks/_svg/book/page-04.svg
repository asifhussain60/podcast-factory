<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a6a58"/></marker></defs><text x="380" y="34" font-family="Lato, system-ui, sans-serif" font-size="20" fill="#8b4513" font-weight="bold" text-anchor="middle">The Pedagogy of Disclosure Requires Binding Stages</text><text x="380" y="62" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#7a6a58" font-weight="bold" text-anchor="middle">THE PEDAGOGY OF DISCLOSURE REQUIRES BINDING STAGES</text><rect x="200" y="90" width="360" height="40" fill="#f0e6d2" stroke="#d9cdbd" rx="6"/><text x="380.0" y="115" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117" font-weight="bold" text-anchor="middle">The one newly born in faith.</text><line x1="380" y1="130" x2="380" y2="150" stroke="#7a6a58" marker-end="url(#arr)"/><rect x="200" y="155" width="360" height="90" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="210" y="177" font-family="Lato, system-ui, sans-serif" font-size="14" fill="#8b4513" font-weight="bold">1. OUTWARD REPAIR</text><text x="210" y="199" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#2b2117"><tspan>Content: Limits, allegiance, lawful/forbidden.</tspan></text><text x="210" y="227" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#2b2117"><tspan>Mode: Obligation. Likeness: Cutting the cord,</tspan><tspan x="210" dy="16"> swaddling.</tspan></text><line x1="560" y1="200" x2="580" y2="200" stroke="#7a6a58" marker-end="url(#arr)"/><rect x="585" y="155" width="150" height="90" fill="#f7e8d8" stroke="#d9cdbd" rx="6"/><text x="590" y="177" font-family="Lato, system-ui, sans-serif" font-size="11" fill="#2b2117"><tspan>Refusal to advance.</tspan><tspan x="590" dy="16"> The worshipper's</tspan><tspan x="590" dy="16"> testimony is</tspan><tspan x="590" dy="16"> honored, but the</tspan><tspan x="590" dy="16"> next room is closed.</tspan></text><line x1="380" y1="245" x2="380" y2="265" stroke="#7a6a58" marker-end="url(#arr)"/><rect x="200" y="270" width="360" height="90" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="210" y="292" font-family="Lato, system-ui, sans-serif" font-size="14" fill="#8b4513" font-weight="bold">2. SYMBOLS AND SIGNS</text><text x="210" y="314" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#2b2117"><tspan>Content: Gentle inner degree, imagination</tspan><tspan x="210" dy="16"> stirred.</tspan></text><text x="210" y="342" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#2b2117"><tspan>Mode: Preparation. Likeness: Milk for the</tspan><tspan x="210" dy="16"> newborn.</tspan></text><line x1="560" y1="315" x2="580" y2="315" stroke="#7a6a58" marker-end="url(#arr)"/><rect x="585" y="270" width="150" height="90" fill="#f7e8d8" stroke="#d9cdbd" rx="6"/><text x="590" y="300" font-family="Lato, system-ui, sans-serif" font-size="11" fill="#2b2117"><tspan>Refusal to advance.</tspan><tspan x="590" dy="16"> Locked at the</tspan><tspan x="590" dy="16"> current rung.</tspan></text><line x1="380" y1="360" x2="380" y2="380" stroke="#7a6a58" marker-end="url(#arr)"/><rect x="200" y="385" width="360" height="110" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="210" y="407" font-family="Lato, system-ui, sans-serif" font-size="14" fill="#8b4513" font-weight="bold">3. INNER INTERPRETATION PROPER</text><text x="210" y="429" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#2b2117"><tspan>Content: Ta'wil beyond symbols. Mode: Choice</tspan><tspan x="210" dy="16"> and pledge. Likeness: Solid food for a ready</tspan><tspan x="210" dy="16"> body.</tspan></text><line x1="380" y1="495" x2="380" y2="515" stroke="#7a6a58" marker-end="url(#arr)"/><rect x="200" y="520" width="360" height="50" fill="#e8d9bf" stroke="#d9cdbd" rx="6"/><text x="380.0" y="550" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#8b4513" font-weight="bold" text-anchor="middle">The responder enters the ranks of the mission.</text></svg>