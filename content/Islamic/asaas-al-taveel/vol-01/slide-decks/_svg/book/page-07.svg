<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 680"><text x="380" y="34" font-family="Lato, system-ui, sans-serif" font-size="20" fill="#8b4513" font-weight="bold" text-anchor="middle">Physical Divergence Carries a Unified Inner Obligation</text><text x="380" y="64" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#7a6a58" font-weight="bold" text-anchor="middle">PHYSICAL DIVERGENCE CARRIES A UNIFIED INNER OBLIGATION</text><rect x="30" y="90" width="350" height="36" fill="#f0e6d2" stroke="#d9cdbd" rx="6"/><rect x="390" y="90" width="340" height="36" fill="#f0e6d2" stroke="#d9cdbd" rx="6"/><text x="205" y="113" font-family="Lato, system-ui, sans-serif" font-size="14" fill="#8b4513" font-weight="bold" text-anchor="middle">THEIR OUTWARD FORMS</text><text x="560" y="113" font-family="Lato, system-ui, sans-serif" font-size="14" fill="#8b4513" font-weight="bold" text-anchor="middle">THEIR INWARD CONTENT</text><rect x="30" y="132" width="350" height="40" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><text x="40" y="157" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>The Ark ≠ The Sacred House</tspan></text><rect x="30" y="176" width="350" height="40" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><text x="40" y="201" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>The Sacred House ≠ The Staff</tspan></text><rect x="30" y="220" width="350" height="40" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><text x="40" y="245" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>The Staff ≠ The Cross</tspan></text><rect x="30" y="264" width="350" height="40" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><text x="40" y="289" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>The Cross ≠ The Testimony</tspan></text><rect x="30" y="308" width="350" height="50" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="40" y="330" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117" font-weight="bold"><tspan>Each is a different physical thing.</tspan></text><rect x="390" y="132" width="340" height="56" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><text x="400" y="154" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>Believing in the foundation is accepting</tspan><tspan x="400" dy="16"> the entire law.</tspan></text><rect x="390" y="192" width="340" height="56" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><text x="400" y="214" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>The act of pledge already gathers what</tspan><tspan x="400" dy="16"> the law requires.</tspan></text><rect x="390" y="252" width="340" height="56" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><text x="400" y="274" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>If partial, the call would be</tspan><tspan x="400" dy="16"> incomplete.</tspan></text><rect x="390" y="312" width="340" height="50" fill="#e8d9bf" stroke="#d9cdbd" rx="6"/><text x="560" y="342" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#8b4513" font-weight="bold" text-anchor="middle">The Comprehensive Container</text><rect x="30" y="382" width="700" height="90" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="40" y="404" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>The pledge of allegiance carries the totality, not the easier piece first. Where</tspan><tspan x="40" dy="16"> allegiance is concerned, the whole obligation is laid out at the moment of the call.</tspan></text></svg>