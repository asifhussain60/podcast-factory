<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 820"><text x="380" y="34" font-family="Lato, system-ui, sans-serif" font-size="20" fill="#8b4513" font-weight="bold" text-anchor="middle">Outward commentary / tafsir vs Inner interpretation / ta'wil</text><rect x="30" y="70" width="350" height="36" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><rect x="390" y="70" width="340" height="36" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="205" y="93" font-family="Lato, system-ui, sans-serif" font-size="14" fill="#8b4513" font-weight="bold" text-anchor="middle">Outward commentary / tafsir</text><text x="560" y="93" font-family="Lato, system-ui, sans-serif" font-size="14" fill="#8b4513" font-weight="bold" text-anchor="middle">Inner interpretation / ta'wil</text><rect x="30" y="116" width="350" height="92" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><rect x="390" y="116" width="340" height="92" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><text x="40" y="138" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>Question: What does this word mean in</tspan><tspan x="40" dy="16"> plain Arabic?</tspan></text><text x="400" y="138" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>Question: What truth was this verse sent</tspan><tspan x="400" dy="16"> to carry?</tspan></text><rect x="30" y="212" width="350" height="92" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><rect x="390" y="212" width="340" height="92" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><text x="40" y="234" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>Method: Dictionary, grammar, ordinary</tspan><tspan x="40" dy="16"> sense.</tspan></text><text x="400" y="234" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>Method: A chain back to the moment</tspan><tspan x="400" dy="16"> meaning was placed inside the word.</tspan></text><rect x="30" y="308" width="350" height="92" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><rect x="390" y="308" width="340" height="92" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><text x="40" y="330" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>Example ('Tree'): A plant set down small,</tspan><tspan x="40" dy="16"> growing limbs, leaves, flowers, fruit.</tspan></text><text x="400" y="330" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>Example ('Tree'): A chamber, cow, or</tspan><tspan x="400" dy="16"> rock—whatever the inner reality is,</tspan><tspan x="400" dy="16"> provided it accords with truth and</tspan><tspan x="400" dy="16"> reason.</tspan></text><rect x="30" y="404" width="350" height="92" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><rect x="390" y="404" width="340" height="92" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><text x="40" y="426" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>Authority: Any competent reader of the</tspan><tspan x="40" dy="16"> language.</tspan></text><text x="400" y="426" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>Authority: The Imam, in a chain from the</tspan><tspan x="400" dy="16"> Speaker-Prophet.</tspan></text><rect x="30" y="500" width="350" height="92" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><rect x="390" y="500" width="340" height="92" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><text x="40" y="522" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>Audience: The common public.</tspan></text><text x="400" y="522" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>Audience: The elect, by stages.</tspan></text><rect x="30" y="596" width="350" height="92" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><rect x="390" y="596" width="340" height="92" fill="#fffaf0" stroke="#d9cdbd" rx="6"/><text x="40" y="618" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>End State: The verse is intelligible at</tspan><tspan x="40" dy="16"> the surface.</tspan></text><text x="400" y="618" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>End State: The meaning hidden behind the</tspan><tspan x="400" dy="16"> word is reached.</tspan></text><rect x="30" y="698" width="700" height="80" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="40" y="720" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>Neither denies the other. The outer holds the inner the way a body holds its soul. Both</tspan><tspan x="40" dy="16"> are obligatory; benefit arises only from their meeting.</tspan></text></svg>