<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a6a58"/></marker></defs><text x="380" y="34" font-family="Lato, system-ui, sans-serif" font-size="20" fill="#8b4513" font-weight="bold" text-anchor="middle">The Descent of Address and the Density of Meaning</text><text x="380" y="64" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#7a6a58" font-weight="bold" text-anchor="middle">THE DESCENT OF ADDRESS AND THE DENSITY OF MEANING</text><text x="40" y="380" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#8b4513" font-weight="bold" transform="rotate(-90 40 380)" text-anchor="middle">DESCENT OF ADDRESS</text><text x="720" y="380" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#8b4513" font-weight="bold" transform="rotate(90 720 380)" text-anchor="middle">DENSITY OF MEANING</text><line x1="70" y1="120" x2="70" y2="620" stroke="#7a6a58" stroke-width="1.5" marker-end="url(#arr)"/><line x1="690" y1="620" x2="690" y2="120" stroke="#7a6a58" stroke-width="1.5" marker-end="url(#arr)"/><rect x="110" y="100" width="540" height="110" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="380" y="130" font-family="Lato, system-ui, sans-serif" font-size="16" fill="#8b4513" font-weight="bold" text-anchor="middle">EXPRESSION</text><text x="125" y="158" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>What the dictionary delivers. For the common people.</tspan></text><rect x="110" y="232" width="540" height="110" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="380" y="262" font-family="Lato, system-ui, sans-serif" font-size="16" fill="#8b4513" font-weight="bold" text-anchor="middle">ALLUSION</text><text x="125" y="290" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>Meaning pointed at without being said. For the elect.</tspan></text><rect x="110" y="364" width="540" height="110" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="380" y="394" font-family="Lato, system-ui, sans-serif" font-size="16" fill="#8b4513" font-weight="bold" text-anchor="middle">SUBTLE INDICATION</text><text x="125" y="422" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>Meaning shown only to one prepared to see it. For the friends</tspan><tspan x="125" dy="16"> of God.</tspan></text><rect x="110" y="496" width="540" height="110" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="380" y="526" font-family="Lato, system-ui, sans-serif" font-size="16" fill="#8b4513" font-weight="bold" text-anchor="middle">INNER REALITY</text><text x="125" y="554" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>Meaning as it lives in the bearer's own consciousness. For the</tspan><tspan x="125" dy="16"> prophets.</tspan></text></svg>