<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 820"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a6a58"/></marker></defs><text x="380" y="34" font-family="Lato, system-ui, sans-serif" font-size="20" fill="#8b4513" font-weight="bold" text-anchor="middle">Stumbling Is Not Turning Aside</text><text x="380" y="62" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#7a6a58" font-weight="bold" text-anchor="middle">STUMBLING IS NOT TURNING ASIDE</text><rect x="130" y="90" width="500" height="60" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="140" y="112" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>Adam and Eve in the Garden (ranks of supportive knowledge)</tspan></text><line x1="380" y1="150" x2="380" y2="162" stroke="#7a6a58" marker-end="url(#arr)"/><rect x="130" y="165" width="500" height="60" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="140" y="187" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>Adversary's lie (Premature disclosure dressed as</tspan><tspan x="140" dy="16"> transcendence)</tspan></text><line x1="380" y1="225" x2="380" y2="237" stroke="#7a6a58" marker-end="url(#arr)"/><rect x="130" y="240" width="500" height="60" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="140" y="262" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>Transgression (Reaching for the rank of the Riser)</tspan></text><line x1="380" y1="300" x2="380" y2="312" stroke="#7a6a58" marker-end="url(#arr)"/><rect x="130" y="315" width="500" height="60" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="140" y="337" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>Garment of piety cut off. Light of wisdom stitched to cover</tspan><tspan x="140" dy="16"> shame</tspan></text><line x1="380" y1="390" x2="380" y2="402" stroke="#7a6a58"/><line x1="180" y1="402" x2="580" y2="402" stroke="#7a6a58"/><line x1="180" y1="402" x2="180" y2="415" stroke="#7a6a58" marker-end="url(#arr)"/><line x1="580" y1="402" x2="580" y2="415" stroke="#7a6a58" marker-end="url(#arr)"/><rect x="40" y="420" width="320" height="110" fill="#f7e8d8" stroke="#d9cdbd" rx="6"/><text x="50" y="442" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>Iblis turns aside. Refuses repentance.</tspan><tspan x="50" dy="16"> Persists. Crosses over to the opposing</tspan><tspan x="50" dy="16"> party.</tspan></text><rect x="400" y="420" width="320" height="110" fill="#e8d9bf" stroke="#d9cdbd" rx="6"/><text x="410" y="442" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>Adam turns back. Asks forgiveness</tspan><tspan x="410" dy="16"> through the guardian of his time (Eve).</tspan></text><line x1="560" y1="530" x2="560" y2="550" stroke="#7a6a58" marker-end="url(#arr)"/><rect x="220" y="555" width="500" height="80" fill="#e8d9bf" stroke="#d9cdbd" rx="6"/><text x="230" y="579" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117" font-weight="bold"><tspan>Repentance accepted. Adam restored to the line of Imamate.</tspan><tspan x="230" dy="16"> The cycle continues.</tspan></text></svg>