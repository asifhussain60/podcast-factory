<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 980"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a6a58"/></marker></defs><text x="380" y="34" font-family="Lato, system-ui, sans-serif" font-size="20" fill="#8b4513" font-weight="bold" text-anchor="middle">The Trust Passes Intact Across the First Prophetic Cycle</text><text x="380" y="62" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#7a6a58" font-weight="bold" text-anchor="middle">THE TRUST PASSES INTACT ACROSS THE FIRST PROPHETIC CYCLE</text><rect x="200" y="90" width="360" height="60" fill="#e8d9bf" stroke="#d9cdbd" rx="6"/><text x="380" y="116" font-family="Lato, system-ui, sans-serif" font-size="15" fill="#8b4513" font-weight="bold" text-anchor="middle">ADAM</text><text x="380" y="137" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#2b2117" text-anchor="middle">Speaker-Prophet of Cycle One.</text><line x1="380" y1="155" x2="380" y2="167" stroke="#7a6a58" marker-end="url(#arr)"/><rect x="200" y="170" width="360" height="60" fill="#f0e6d2" stroke="#d9cdbd" rx="6"/><text x="380" y="196" font-family="Lato, system-ui, sans-serif" font-size="14" fill="#8b4513" font-weight="bold" text-anchor="middle">SETH (GIFT OF GOD)</text><text x="380" y="217" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#2b2117" text-anchor="middle">The Silent One (Foundation of Cycle One).</text><line x1="380" y1="235" x2="380" y2="245" stroke="#7a6a58" marker-end="url(#arr)"/><rect x="240" y="249" width="280" height="40" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="380" y="274" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117" font-weight="bold" text-anchor="middle">ENOSH (IMAM 1)</text><rect x="240" y="293" width="280" height="40" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="380" y="318" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117" font-weight="bold" text-anchor="middle">KENAN (IMAM 2)</text><rect x="240" y="337" width="280" height="40" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="380" y="362" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117" font-weight="bold" text-anchor="middle">MAHALALEL (IMAM 3)</text><rect x="240" y="381" width="280" height="40" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="380" y="406" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117" font-weight="bold" text-anchor="middle">JARED (IMAM 4)</text><rect x="240" y="425" width="280" height="40" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="380" y="450" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117" font-weight="bold" text-anchor="middle">ENOCH (IMAM 5)</text><rect x="240" y="469" width="280" height="40" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="380" y="494" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117" font-weight="bold" text-anchor="middle">METHUSELAH (IMAM 6)</text><rect x="240" y="513" width="280" height="40" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="380" y="538" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117" font-weight="bold" text-anchor="middle">LAMECH (IMAM 7)</text><rect x="540" y="373.0" width="200" height="60" fill="#f7e8d8" stroke="#d9cdbd" rx="6"/><text x="548" y="395.0" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#2b2117"><tspan>The unbroken bequeathals</tspan><tspan x="548" dy="16"> of the inward trust.</tspan></text><line x1="540" y1="403.0" x2="520" y2="403.0" stroke="#7a6a58"/><line x1="380" y1="557" x2="380" y2="567" stroke="#7a6a58" marker-end="url(#arr)"/><rect x="200" y="571" width="360" height="70" fill="#e8d9bf" stroke="#d9cdbd" rx="6"/><text x="380" y="597" font-family="Lato, system-ui, sans-serif" font-size="15" fill="#8b4513" font-weight="bold" text-anchor="middle">NOAH</text><text x="210" y="619" font-family="Lato, system-ui, sans-serif" font-size="12" fill="#2b2117"><tspan>Speaker-Prophet of Cycle Two (Opens a new sacred</tspan><tspan x="210" dy="16"> law).</tspan></text><rect x="30" y="651" width="700" height="70" fill="#f7f1e6" stroke="#d9cdbd" rx="6"/><text x="40" y="675" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#2b2117"><tspan>Cycle completion is handoff, not closure. The long lifetimes are an outward sign that</tspan><tspan x="40" dy="16"> the covenant held.</tspan></text></svg>