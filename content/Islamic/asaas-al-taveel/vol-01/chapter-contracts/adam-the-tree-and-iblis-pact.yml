show_notes:
  blurb: >
    Al-Nu'man opens his interpretation of the prophetic cycles at the
    origin of the lower hadd of Imamate itself — Adam, peace be upon
    him. The Qur'anic scene of the angels' objection, the formation of
    Adam from clay, the long pause before the spirit, the teaching of
    the names, Iblis's refusal to prostrate, the creation of Eve, the
    garden, the forbidden tree, the pact of respite, the fall, the
    repentance — every element is read on its inner side. The hadd
    that Iblis vacated is filled by Eve as Adam's twelve-rank hujja.
    The garden is the rank of supportive knowledge, al-ta'yid. The
    tree is not wheat, fig, or grape, but a likeness for the Master
    of the Resurrection — the disclosure entrusted to him alone,
    seized prematurely. Adam's stripping is the loss of the garment
    of piety, which is the word. His repentance restores him to the
    rank of caliph and Imam, and the Imamate begins from him as the
    architecture of the four limits requires.
