thesis_relevance: >
  This chapter advances the book's central claim — that the Qur'an and
  the prophetic cycles carry an inner interpretation whose authoritative
  transmission belongs to the line of Imam-Foundations after each
  Speaker-Prophet — by walking the four-limits architecture into the
  first prophetic cycle and showing that Adam's story, on its inner
  side, is the story of how the Imamate enters the world and is
  preserved through the breach that opens within it. The natiq-samit
  pair, the twelve-rank hujja, supportive knowledge as the garden, and
  the forbidden disclosure entrusted to the Master of the Resurrection
  are the templates the rest of the book reads every later prophet
  through.
