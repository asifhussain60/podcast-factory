thesis_relevance: >
  This chapter advances the book's central claim — that the Qur'an and the
  prophetic cycles carry an inner interpretation whose authoritative
  transmission belongs to the line of Imam-Foundations after each Speaker-
  Prophet — by establishing in al-Nu'man's own voice the three load-bearing
  premises the rest of the book stands on: that the inner must be taught by
  stages, that every created thing is outward-and-inward as spouse-and-
  partner, and that the shahada at its first utterance already contained
  the whole sacred law including walaya. Every later Speaker-Prophet chapter
  reads each cycle through these three premises without re-arguing them.
