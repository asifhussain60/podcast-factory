show_notes:
  blurb: >
    Al-Nu'man's own opening of Asas al-Ta'wil. He explains why he wrote a
    second book after his apparent-law volume Da'a'im al-Islam, why inner
    interpretation has to be taught by stages — milk before solid food,
    suckling for two years, symbols before subtleties — and why the
    testimony "There is no god but Allah," from the very first day the
    Prophet spoke it, already contained the whole sacred law, against the
    common opinion that says the easy creed came first and the heavy
    obligations later. Sets up the structural claim that the next chapter
    will unfold: that every created thing is paired, outward and inward,
    body and soul — and that the Creator is described by none of the pairs.
