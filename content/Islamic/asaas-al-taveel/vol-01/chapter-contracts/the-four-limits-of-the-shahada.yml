thesis_relevance: >
  This chapter advances the book's central claim — that the Qur'an and the
  prophetic cycles carry an inner interpretation whose authoritative
  transmission belongs to the line of Imam-Foundations after each Speaker-
  Prophet — by laying out the structural diagram itself: the shahada's
  four words name four limits (Pen and Tablet above, Speaker and Silent
  One below), the seven Speaker-Prophets across history each carry a seven-
  fold succession of Imams, and the twelve successors arrange the proofs
  of every age. Every later chapter of the book reads its subject through
  this diagram without re-arguing it.
