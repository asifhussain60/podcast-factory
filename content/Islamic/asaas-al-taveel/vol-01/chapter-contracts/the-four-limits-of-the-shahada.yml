show_notes:
  blurb: >
    Al-Nu'man opens the testimony itself and shows what is inside it. The
    shahada has four words; those four words stand for four limits, two
    above and two below. Above are the Pen and the Preserved Tablet —
    named in the prophetic hadith that says the first thing God created
    was the Pen. Below are the Speaker, the prophet who articulates the
    sacred law in his time, and the Silent One, the Imam-Foundation who
    is master of its interpretation. To recognize all four is to complete
    the shahada. The philosophers affirmed the upper two and called them
    intellect and soul, but denied the lower two and so left the testimony
    broken. The chapter then maps the seven Speaker-Prophets across history
    — Adam, Noah, Ibrahim, Moses, Jesus, Muhammad, and the awaited
    al-Qa'im — and the seven Imams in each cycle, the twelve successors
    arranged as proofs in every age, and the seven-plus-twelve nineteen
    that the Qur'an names. It closes on the second testimony to the
    Messenger as the branches of the first, and on al-Sadiq's verdict
    that faith encompasses Islam but Islam does not encompass faith.
