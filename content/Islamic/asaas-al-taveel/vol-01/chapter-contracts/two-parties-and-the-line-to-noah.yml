thesis_relevance: >
  This chapter advances the book's central claim — that the Qur'an
  and the prophetic cycles carry an inner interpretation whose
  authoritative transmission belongs to the line of Imam-Foundations
  after each Speaker-Prophet — by closing the first cycle on the
  architecture set down in the four-limits chapter. The two-parties
  doctrine becomes the operative test the book will apply at every
  later cycle, the popular literalism of the fall is refused on
  precisely the grounds the book exists to enforce, and the lineage
  from Adam to Noah demonstrates that the chain of seven Imams per
  cycle holds in practice. The seam into Noah's chapter — Noah's
  people refusing him in the same shape Iblis refused God — is the
  architecture's first test in a new cycle.
