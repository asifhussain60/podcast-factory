show_notes:
  blurb: >
    Al-Nu'man closes the first prophetic cycle. He develops the two-
    parties doctrine at length, threading together the Qur'an's own
    naming of Hizb Allah against the party of Satan. He refuses the
    popular literalism that froze the forbidden tree into wheat, fig,
    or grape and read human fingernails as its residue. He refuses,
    by name, the inherited Jewish-source tale of Adam and Eve hiding
    naked among the trees while God walked there asking "Where are
    you?" — calling out Ka'b al-Ahbar and Abdullah ibn Salam as the
    channels through which the material entered the tradition. He
    rehabilitates Adam to the rank of caliph and Imam. He gives the
    chain of five upper and five lower limits in the Prophet's own
    voice. He walks the lineage from Adam through Seth, Idris/Enoch,
    and the seven Imams of the first cycle down to Lamech, who
    completes the cycle and hands the matter to Noah. Then he opens
    the chapter on Noah, Hud, and Salih, and the listener hears
    Noah's people refuse him in the same shape Iblis had refused
    God — "you are nothing but a human being like us." The
    architecture's claim on history begins to walk.
