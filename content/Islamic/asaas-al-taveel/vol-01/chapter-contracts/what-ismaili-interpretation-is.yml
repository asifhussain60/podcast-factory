show_notes:
  blurb: >
    The editor's introduction to Asas al-Ta'wil — Arif Tamir's 1960 Beirut framing
    of why this 10th-century Fatimid treatise on inner interpretation was kept in
    private custody for a thousand years, what the Ismailis mean by ta'wil
    (as distinct from tafsir), why the Speaker bears revelation and the Imam-
    Foundation bears its inner meaning, and how al-Nu'man's two books — Da'a'im
    al-Islam and this one — together form the body and soul of the Fatimid
    intellectual project. Sets up the six Speaker-Prophet chapters that follow:
    Adam, Noah, Ibrahim, Moses, Jesus, Muhammad. The seventh chapter, on the
    Awaited Imam, is deliberately unwritten.
