thesis_relevance: >
  This chapter advances the book's central claim — that the Qur'an and the
  prophetic cycles carry an inner interpretation (ta'wil) whose authoritative
  transmission belongs to the line of Imam-Foundations after each Speaker-
  Prophet — by laying down the basic vocabulary (tafsir vs ta'wil, al-zahir
  vs al-batin, al-Natiq vs al-Asas, Da'a'im al-Islam vs Asas al-Ta'wil as body
  and soul of the Fatimid project) that the six following Speaker-Prophet
  chapters will use without further definition.
