<svg id="The_Two_Parties" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 352" role="img" aria-labelledby="The_Two_Parties_t The_Two_Parties_d">
<title id="The_Two_Parties_t">The Two Parties</title>
<desc id="The_Two_Parties_d">Two-column contrast: Party of God (Hizb Allah) vs Party of Satan (Hizb al-Shaytan) — 5 paired phenomena</desc>
<style>#The_Two_Parties{font-family:'Lato', system-ui, sans-serif;font-size:14px;fill:#1f1d18;}#The_Two_Parties text{font-family:'Lato', system-ui, sans-serif;}</style>
<text x="250" y="20.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#8b4513"><tspan x="250" dy="0">The Two Parties</tspan></text>
<text x="250" y="34.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#87827a"><tspan x="250" dy="0">The line between the parties is drawn by guardianship</tspan><tspan x="250" dy="12">(walaya).</tspan></text>
<rect x="14.0" y="62.0" width="218.0" height="48.0" fill="#8b4513" stroke="#8b4513" stroke-width="1.0" rx="4"/>
<rect x="268.0" y="62.0" width="218.0" height="48.0" fill="#efeae0" stroke="#d9d3c4" stroke-width="1.0" rx="4"/>
<text x="123.0" y="78.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#fffdf8"><tspan x="123.0" dy="0">Party of God (Hizb</tspan><tspan x="123.0" dy="15">Allah)</tspan></text>
<text x="377.0" y="78.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#1f1d18"><tspan x="377.0" dy="0">Party of Satan (Hizb</tspan><tspan x="377.0" dy="15">al-Shaytan)</tspan></text>
<rect x="14.0" y="110.0" width="218.0" height="46.0" fill="#fffdf8" stroke="#d9d3c4" stroke-width="1.0"/>
<rect x="268.0" y="110.0" width="218.0" height="46.0" fill="#fffdf8" stroke="#d9d3c4" stroke-width="1.0"/>
<text x="123.0" y="126.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#1f1d18"><tspan x="123.0" dy="0">Believe in God and the</tspan><tspan x="123.0" dy="14">Last Day</tspan></text>
<text x="377.0" y="126.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#1f1d18"><tspan x="377.0" dy="0">Ally with those who earn</tspan><tspan x="377.0" dy="14">God's wrath</tspan></text>
<line x1="249" y1="114" x2="249" y2="152" stroke="#d9d3c4" stroke-width="1"/>
<rect x="14.0" y="156.0" width="218.0" height="46.0" fill="#f7f4ee" stroke="#d9d3c4" stroke-width="1.0"/>
<rect x="268.0" y="156.0" width="218.0" height="46.0" fill="#f7f4ee" stroke="#d9d3c4" stroke-width="1.0"/>
<text x="123.0" y="172.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#1f1d18"><tspan x="123.0" dy="0">Faith written in their</tspan><tspan x="123.0" dy="14">hearts</tspan></text>
<text x="377.0" y="179.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#1f1d18"><tspan x="377.0" dy="0">Satan has overcome them</tspan></text>
<line x1="249" y1="160" x2="249" y2="198" stroke="#d9d3c4" stroke-width="1"/>
<rect x="14.0" y="202.0" width="218.0" height="46.0" fill="#fffdf8" stroke="#d9d3c4" stroke-width="1.0"/>
<rect x="268.0" y="202.0" width="218.0" height="46.0" fill="#fffdf8" stroke="#d9d3c4" stroke-width="1.0"/>
<text x="123.0" y="218.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#1f1d18"><tspan x="123.0" dy="0">Supported by a spirit</tspan><tspan x="123.0" dy="14">from Him</tspan></text>
<text x="377.0" y="218.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#1f1d18"><tspan x="377.0" dy="0">Made to forget the</tspan><tspan x="377.0" dy="14">remembrance of God</tspan></text>
<line x1="249" y1="206" x2="249" y2="244" stroke="#d9d3c4" stroke-width="1"/>
<rect x="14.0" y="248.0" width="218.0" height="46.0" fill="#f7f4ee" stroke="#d9d3c4" stroke-width="1.0"/>
<rect x="268.0" y="248.0" width="218.0" height="46.0" fill="#f7f4ee" stroke="#d9d3c4" stroke-width="1.0"/>
<text x="123.0" y="271.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#1f1d18"><tspan x="123.0" dy="0">Cling to God's guardians</tspan></text>
<text x="377.0" y="264.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#1f1d18"><tspan x="377.0" dy="0">Took God's enemies as</tspan><tspan x="377.0" dy="14">friends</tspan></text>
<line x1="249" y1="252" x2="249" y2="290" stroke="#d9d3c4" stroke-width="1"/>
<rect x="14.0" y="294.0" width="218.0" height="46.0" fill="#fffdf8" stroke="#d9d3c4" stroke-width="1.0"/>
<rect x="268.0" y="294.0" width="218.0" height="46.0" fill="#fffdf8" stroke="#d9d3c4" stroke-width="1.0"/>
<text x="123.0" y="310.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#1f1d18"><tspan x="123.0" dy="0">The successful</tspan><tspan x="123.0" dy="14">(al-muflihun)</tspan></text>
<text x="377.0" y="317.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#1f1d18"><tspan x="377.0" dy="0">The losers (al-khasirun)</tspan></text>
<line x1="249" y1="298" x2="249" y2="336" stroke="#d9d3c4" stroke-width="1"/>
</svg>