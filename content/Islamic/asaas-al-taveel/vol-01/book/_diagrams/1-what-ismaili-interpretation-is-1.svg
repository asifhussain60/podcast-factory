<rect x="268.0" y="248.0" width="218.0" height="46.0" fill="#f7f4ee" stroke="#d9d3c4" stroke-width="1.0"/>
<text x="123.0" y="264.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#1f1d18"><tspan x="123.0" dy="0">Outward sense for the</tspan><tspan x="123.0" dy="14">people at large</tspan></text>
<text x="377.0" y="264.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#1f1d18"><tspan x="377.0" dy="0">Mystical secrets</tspan><tspan x="377.0" dy="14">entrusted inwardly</tspan></text>
