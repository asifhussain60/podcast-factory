<svg id="Tanzil_and_Ta_wil__The_Two_Authorities" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 306" role="img" aria-labelledby="Tanzil_and_Ta_wil__The_Two_Authorities_t Tanzil_and_Ta_wil__The_Two_Authorities_d">
<title id="Tanzil_and_Ta_wil__The_Two_Authorities_t">Tanzil and Ta'wil: The Two Authorities</title>
<desc id="Tanzil_and_Ta_wil__The_Two_Authorities_d">Two-column contrast: Tanzil (Revelation) vs Ta'wil (Inner Interpretation) — 4 paired phenomena</desc>
<style>#Tanzil_and_Ta_wil__The_Two_Authorities{font-family:'Lato', system-ui, sans-serif;font-size:14px;fill:#1f1d18;}#Tanzil_and_Ta_wil__The_Two_Authorities text{font-family:'Lato', system-ui, sans-serif;}</style>
<text x="250" y="20.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#8b4513"><tspan x="250" dy="0">Tanzil and Ta'wil: The Two Authorities</tspan></text>
<text x="250" y="34.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#87827a"><tspan x="250" dy="0">Outward law and inward meaning are carried by paired</tspan><tspan x="250" dy="12">authorities</tspan></text>
<rect x="14.0" y="62.0" width="218.0" height="48.0" fill="#8b4513" stroke="#8b4513" stroke-width="1.0" rx="4"/>
<rect x="268.0" y="62.0" width="218.0" height="48.0" fill="#efeae0" stroke="#d9d3c4" stroke-width="1.0" rx="4"/>
<text x="123.0" y="86.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#fffdf8"><tspan x="123.0" dy="0">Tanzil (Revelation)</tspan></text>
<text x="377.0" y="78.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#1f1d18"><tspan x="377.0" dy="0">Ta'wil (Inner</tspan><tspan x="377.0" dy="15">Interpretation)</tspan></text>
