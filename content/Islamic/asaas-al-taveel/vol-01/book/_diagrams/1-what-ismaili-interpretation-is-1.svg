<rect x="268.0" y="156.0" width="218.0" height="46.0" fill="#f7f4ee" stroke="#d9d3c4" stroke-width="1.0"/>
<text x="123.0" y="172.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#1f1d18"><tspan x="123.0" dy="0">Sacred law, rulings,</tspan><tspan x="123.0" dy="14">jurisprudence</tspan></text>
<text x="377.0" y="172.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#1f1d18"><tspan x="377.0" dy="0">Truth, philosophy, the</tspan><tspan x="377.0" dy="14">inward</tspan></text>
<line x1="249" y1="160" x2="249" y2="198" stroke="#d9d3c4" stroke-width="1"/>
<rect x="14.0" y="202.0" width="218.0" height="46.0" fill="#fffdf8" stroke="#d9d3c4" stroke-width="1.0"/>
<rect x="268.0" y="202.0" width="218.0" height="46.0" fill="#fffdf8" stroke="#d9d3c4" stroke-width="1.0"/>
<text x="123.0" y="218.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#1f1d18"><tspan x="123.0" dy="0">Muhammad (bearer of the</tspan><tspan x="123.0" dy="14">Qur'an)</tspan></text>
<text x="377.0" y="218.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#1f1d18"><tspan x="377.0" dy="0">Ali (bearer of its</tspan><tspan x="377.0" dy="14">interpretation)</tspan></text>
<line x1="249" y1="206" x2="249" y2="244" stroke="#d9d3c4" stroke-width="1"/>
