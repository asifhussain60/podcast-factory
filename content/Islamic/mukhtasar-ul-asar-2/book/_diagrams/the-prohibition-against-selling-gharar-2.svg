<rect x="268.0" y="156.0" width="218.0" height="46.0" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="123.0" y="172.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="123.0" dy="0">Visible part of doors,</tspan><tspan x="123.0" dy="14">rooms, garments</tspan></text>
<text x="377.0" y="179.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="377.0" dy="0">The concealed interior</tspan></text>
<line x1="249" y1="160" x2="249" y2="198" stroke="#d0d0d0" stroke-width="1"/>
<rect x="14.0" y="202.0" width="218.0" height="46.0" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.0"/>
<rect x="268.0" y="202.0" width="218.0" height="46.0" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="123.0" y="218.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="123.0" dy="0">Living slave known to</tspan><tspan x="123.0" dy="14">both parties</tspan></text>
<text x="377.0" y="218.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="377.0" dy="0">Slave sold before his</tspan><tspan x="377.0" dy="14">existence</tspan></text>
<line x1="249" y1="206" x2="249" y2="244" stroke="#d0d0d0" stroke-width="1"/>
<rect x="14.0" y="248.0" width="218.0" height="46.0" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="1.0"/>
<rect x="268.0" y="248.0" width="218.0" height="46.0" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="123.0" y="264.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="123.0" dy="0">Fish in water with a</tspan><tspan x="123.0" dy="14">means to catch it</tspan></text>
<text x="377.0" y="264.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="377.0" dy="0">Fish in water with no</tspan><tspan x="377.0" dy="14">means to catch it</tspan></text>
<line x1="249" y1="252" x2="249" y2="290" stroke="#d0d0d0" stroke-width="1"/>
