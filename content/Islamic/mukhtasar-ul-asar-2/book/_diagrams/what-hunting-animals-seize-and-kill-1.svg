<svg id="When_the_catch_may_be_eaten" xmlns="http://www.w3.org/2000/svg" viewBox="-45 0 555 510" role="img" aria-labelledby="When_the_catch_may_be_eaten_t When_the_catch_may_be_eaten_d">
<title id="When_the_catch_may_be_eaten_t">When the catch may be eaten</title>
<desc id="When_the_catch_may_be_eaten_d">Quadrant map: Hunting animal × Prey when reached — four states</desc>
<style>#When_the_catch_may_be_eaten{font-family:'Lato', system-ui, sans-serif;font-size:14px;fill:#111111;}#When_the_catch_may_be_eaten text{font-family:'Lato', system-ui, sans-serif;}</style>
<defs><marker id="svgp_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#777777"/></marker></defs>
<text x="255.0" y="24.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#000000"><tspan x="255.0" dy="0">When the catch may be eaten</tspan></text>
<text x="253" y="502.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#444444"><tspan x="253" dy="0">Hunting animal</tspan></text>
<text x="12" y="257" text-anchor="middle" font-size="11" font-weight="600" fill="#444444" transform="rotate(-90,12,257)">Prey when reached</text>
<text x="155.5" y="65.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#777777"><tspan x="155.5" dy="0">Untrained</tspan></text>
<text x="350.5" y="65.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#777777"><tspan x="350.5" dy="0">Trained</tspan></text>
<text x="52" y="164.5" text-anchor="end" dominant-baseline="central" font-size="10" font-weight="normal" fill="#777777"><tspan x="52" dy="0">Still alive</tspan></text>
<text x="52" y="349.5" text-anchor="end" dominant-baseline="central" font-size="10" font-weight="normal" fill="#777777"><tspan x="52" dy="0">Already dead</tspan></text>
<rect x="58.0" y="72.0" width="195.0" height="185.0" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="155.5" y="154.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#111111"><tspan x="155.5" dy="0">Slaughter, then eat</tspan></text>
<text x="155.5" y="176.5" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#111111"><tspan x="155.5" dy="0">Untrained, but reached</tspan><tspan x="155.5" dy="12">alive</tspan></text>
<rect x="253.0" y="72.0" width="195.0" height="185.0" fill="#000000" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="350.5" y="154.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#ffffff"><tspan x="350.5" dy="0">Eaten</tspan></text>
<text x="350.5" y="176.5" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#ffffff"><tspan x="350.5" dy="0">Trained and reached</tspan><tspan x="350.5" dy="12">alive</tspan></text>
<rect x="58.0" y="257.0" width="195.0" height="185.0" fill="#eeeeee" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="155.5" y="339.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#111111"><tspan x="155.5" dy="0">Not eaten</tspan></text>
<text x="155.5" y="361.5" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#111111"><tspan x="155.5" dy="0">Untrained and died</tspan><tspan x="155.5" dy="12">before slaughter</tspan></text>
<rect x="253.0" y="257.0" width="195.0" height="185.0" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="350.5" y="339.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#111111"><tspan x="350.5" dy="0">Eaten</tspan></text>
<text x="350.5" y="355.5" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#111111"><tspan x="350.5" dy="0">Trained; lawful even</tspan><tspan x="350.5" dy="12">if it died or ate from</tspan><tspan x="350.5" dy="12">the catch</tspan></text>
<line x1="253" y1="72" x2="253" y2="442" stroke="#d0d0d0" stroke-width="2"/>
<line x1="58" y1="257" x2="448" y2="257" stroke="#d0d0d0" stroke-width="2"/>
