<svg id="When_Judgeship_Is_Permitted" xmlns="http://www.w3.org/2000/svg" viewBox="-53 0 563 510" role="img" aria-labelledby="When_Judgeship_Is_Permitted_t When_Judgeship_Is_Permitted_d">
<title id="When_Judgeship_Is_Permitted_t">When Judgeship Is Permitted</title>
<desc id="When_Judgeship_Is_Permitted_d">Quadrant map: Knowledge of judgment × Appointing authority — four states</desc>
<style>#When_Judgeship_Is_Permitted{font-family:'Lato', system-ui, sans-serif;font-size:14px;fill:#111111;}#When_Judgeship_Is_Permitted text{font-family:'Lato', system-ui, sans-serif;}</style>
<defs><marker id="svgp_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#777777"/></marker></defs>
<text x="255.0" y="24.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#000000"><tspan x="255.0" dy="0">When Judgeship Is Permitted</tspan></text>
<text x="253" y="502.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#444444"><tspan x="253" dy="0">Knowledge of judgment</tspan></text>
<text x="12" y="257" text-anchor="middle" font-size="11" font-weight="600" fill="#444444" transform="rotate(-90,12,257)">Appointing authority</text>
<text x="155.5" y="65.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#777777"><tspan x="155.5" dy="0">Lacks knowledge</tspan></text>
<text x="350.5" y="65.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#777777"><tspan x="350.5" dy="0">Has knowledge</tspan></text>
<text x="52" y="164.5" text-anchor="end" dominant-baseline="central" font-size="10" font-weight="normal" fill="#777777"><tspan x="52" dy="0">Just imam</tspan></text>
<text x="52" y="349.5" text-anchor="end" dominant-baseline="central" font-size="10" font-weight="normal" fill="#777777"><tspan x="52" dy="0">Tyrannical imam</tspan></text>
<rect x="58.0" y="72.0" width="195.0" height="185.0" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="155.5" y="146.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#111111"><tspan x="155.5" dy="0">Forbidden —</tspan><tspan x="155.5" dy="16">unqualified</tspan></text>
<text x="155.5" y="170.5" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#111111"><tspan x="155.5" dy="0">Judging without</tspan><tspan x="155.5" dy="12">knowledge of the</tspan><tspan x="155.5" dy="12">science</tspan></text>
<rect x="253.0" y="72.0" width="195.0" height="185.0" fill="#000000" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="350.5" y="154.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#ffffff"><tspan x="350.5" dy="0">Proper to accept</tspan></text>
<text x="350.5" y="176.5" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#ffffff"><tspan x="350.5" dy="0">Summoned by a just</tspan><tspan x="350.5" dy="12">imam and competent</tspan></text>
<rect x="58.0" y="257.0" width="195.0" height="185.0" fill="#eeeeee" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="155.5" y="331.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#111111"><tspan x="155.5" dy="0">Forbidden — doubly</tspan><tspan x="155.5" dy="16">unfit</tspan></text>
<text x="155.5" y="361.5" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#111111"><tspan x="155.5" dy="0">No just authority and</tspan><tspan x="155.5" dy="12">no knowledge</tspan></text>
<rect x="253.0" y="257.0" width="195.0" height="185.0" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="350.5" y="331.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#111111"><tspan x="350.5" dy="0">Forbidden — tyrant's</tspan><tspan x="350.5" dy="16">bench</tspan></text>
<text x="350.5" y="361.5" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#111111"><tspan x="350.5" dy="0">May not judge for a</tspan><tspan x="350.5" dy="12">tyrannical imam</tspan></text>
<line x1="253" y1="72" x2="253" y2="442" stroke="#d0d0d0" stroke-width="2"/>
<line x1="58" y1="257" x2="448" y2="257" stroke="#d0d0d0" stroke-width="2"/>
</svg>