<svg id="Selling_Water__Salt___Fire__Unowned_vs" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" role="img" aria-labelledby="Selling_Water__Salt___Fire__Unowned_vs_t Selling_Water__Salt___Fire__Unowned_vs_d">
<title id="Selling_Water__Salt___Fire__Unowned_vs_t">Selling Water, Salt &amp; Fire: Unowned vs. Owned</title>
<desc id="Selling_Water__Salt___Fire__Unowned_vs_d">Two-column contrast: Forbidden to sell (ownerless commons) vs Permitted to sell (owned or produced) — 3 paired phenomena</desc>
<style>#Selling_Water__Salt___Fire__Unowned_vs{font-family:'Lato', system-ui, sans-serif;font-size:14px;fill:#111111;}#Selling_Water__Salt___Fire__Unowned_vs text{font-family:'Lato', system-ui, sans-serif;}</style>
<text x="250" y="10.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#000000"><tspan x="250" dy="0">Selling Water, Salt &amp; Fire: Unowned vs.</tspan><tspan x="250" dy="20">Owned</tspan></text>
<text x="250" y="34.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#777777"><tspan x="250" dy="0">Ownership or labor turns a free natural element into</tspan><tspan x="250" dy="12">sellable property</tspan></text>
<rect x="14.0" y="62.0" width="218.0" height="48.0" fill="#000000" stroke="#000000" stroke-width="1.0" rx="4"/>
<rect x="268.0" y="62.0" width="218.0" height="48.0" fill="#eeeeee" stroke="#d0d0d0" stroke-width="1.0" rx="4"/>
<text x="123.0" y="78.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#ffffff"><tspan x="123.0" dy="0">Forbidden to sell</tspan><tspan x="123.0" dy="15">(ownerless commons)</tspan></text>
<text x="377.0" y="78.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#111111"><tspan x="377.0" dy="0">Permitted to sell (owned</tspan><tspan x="377.0" dy="15">or produced)</tspan></text>
<rect x="14.0" y="110.0" width="218.0" height="46.0" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.0"/>
<rect x="268.0" y="110.0" width="218.0" height="46.0" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="123.0" y="119.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="123.0" dy="0">Water in the wilderness,</tspan><tspan x="123.0" dy="14">springs, ownerless</tspan><tspan x="123.0" dy="14">waters</tspan></text>
<text x="377.0" y="119.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="377.0" dy="0">A dug well, flowing</tspan><tspan x="377.0" dy="14">spring, river, or stored</tspan><tspan x="377.0" dy="14">rainwater</tspan></text>
<line x1="249" y1="114" x2="249" y2="152" stroke="#d0d0d0" stroke-width="1"/>
<rect x="14.0" y="156.0" width="218.0" height="46.0" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="1.0"/>
<rect x="268.0" y="156.0" width="218.0" height="46.0" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="123.0" y="172.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="123.0" dy="0">Flames kindled from</tspan><tspan x="123.0" dy="14">embers</tspan></text>
<text x="377.0" y="172.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="377.0" dy="0">Firewood, charcoal,</tspan><tspan x="377.0" dy="14">anything that burns</tspan></text>
<line x1="249" y1="160" x2="249" y2="198" stroke="#d0d0d0" stroke-width="1"/>
<rect x="14.0" y="202.0" width="218.0" height="46.0" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.0"/>
<rect x="268.0" y="202.0" width="218.0" height="46.0" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="123.0" y="218.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="123.0" dy="0">Wild grass left in the</tspan><tspan x="123.0" dy="14">wilderness</tspan></text>
<text x="377.0" y="211.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="377.0" dy="0">Grass gathered,</tspan><tspan x="377.0" dy="14">uprooted, or cultivated</tspan><tspan x="377.0" dy="14">on one's land</tspan></text>
<line x1="249" y1="206" x2="249" y2="244" stroke="#d0d0d0" stroke-width="1"/>
