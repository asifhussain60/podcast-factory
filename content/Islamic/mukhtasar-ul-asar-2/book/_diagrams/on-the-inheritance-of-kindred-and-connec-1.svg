<svg id="Paternal_vs_Maternal_Line__How_Kindred_S" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" role="img" aria-labelledby="Paternal_vs_Maternal_Line__How_Kindred_S_t Paternal_vs_Maternal_Line__How_Kindred_S_d">
<title id="Paternal_vs_Maternal_Line__How_Kindred_S_t">Paternal vs Maternal Line: How Kindred Split an Inherited Share</title>
<desc id="Paternal_vs_Maternal_Line__How_Kindred_S_d">Two-column contrast: Paternal kinship (male = 2x female) vs Maternal kinship (male = female) — 3 paired phenomena</desc>
<style>#Paternal_vs_Maternal_Line__How_Kindred_S{font-family:'Lato', system-ui, sans-serif;font-size:14px;fill:#111111;}#Paternal_vs_Maternal_Line__How_Kindred_S text{font-family:'Lato', system-ui, sans-serif;}</style>
<text x="250" y="10.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#000000"><tspan x="250" dy="0">Paternal vs Maternal Line: How Kindred Split</tspan><tspan x="250" dy="20">an Inherited Share</tspan></text>
<text x="250" y="28.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#777777"><tspan x="250" dy="0">Each branch takes the share of the ancestor it connects</tspan><tspan x="250" dy="12">through; the father's side divides 2:1, the mother's</tspan><tspan x="250" dy="12">side divides equally.</tspan></text>
<rect x="14.0" y="62.0" width="218.0" height="48.0" fill="#000000" stroke="#000000" stroke-width="1.0" rx="4"/>
<rect x="268.0" y="62.0" width="218.0" height="48.0" fill="#eeeeee" stroke="#d0d0d0" stroke-width="1.0" rx="4"/>
<text x="123.0" y="78.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#ffffff"><tspan x="123.0" dy="0">Paternal kinship (male =</tspan><tspan x="123.0" dy="15">2x female)</tspan></text>
<text x="377.0" y="78.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#111111"><tspan x="377.0" dy="0">Maternal kinship (male =</tspan><tspan x="377.0" dy="15">female)</tspan></text>
<rect x="14.0" y="110.0" width="218.0" height="46.0" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.0"/>
<rect x="268.0" y="110.0" width="218.0" height="46.0" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="123.0" y="119.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="123.0" dy="0">Kin via the father -&gt;</tspan><tspan x="123.0" dy="14">male takes twice the</tspan><tspan x="123.0" dy="14">female</tspan></text>
<text x="377.0" y="126.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="377.0" dy="0">Kin via the mother -&gt;</tspan><tspan x="377.0" dy="14">male and female alike</tspan></text>
<line x1="249" y1="114" x2="249" y2="152" stroke="#d0d0d0" stroke-width="1"/>
<rect x="14.0" y="156.0" width="218.0" height="46.0" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="1.0"/>
<rect x="268.0" y="156.0" width="218.0" height="46.0" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="123.0" y="172.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="123.0" dy="0">Paternal uncle and aunt</tspan><tspan x="123.0" dy="14">-&gt; split 2:1</tspan></text>
<text x="377.0" y="172.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="377.0" dy="0">Maternal uncle and aunt</tspan><tspan x="377.0" dy="14">-&gt; split equally</tspan></text>
<line x1="249" y1="160" x2="249" y2="198" stroke="#d0d0d0" stroke-width="1"/>
<rect x="14.0" y="202.0" width="218.0" height="46.0" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.0"/>
<rect x="268.0" y="202.0" width="218.0" height="46.0" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="123.0" y="211.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="123.0" dy="0">Sons of paternal</tspan><tspan x="123.0" dy="14">uncle/aunt -&gt; two</tspan><tspan x="123.0" dy="14">thirds, split 2:1</tspan></text>
<text x="377.0" y="211.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="377.0" dy="0">Sons of maternal</tspan><tspan x="377.0" dy="14">uncle/aunt -&gt; one third,</tspan><tspan x="377.0" dy="14">split equally</tspan></text>
<line x1="249" y1="206" x2="249" y2="244" stroke="#d0d0d0" stroke-width="1"/>
</svg>