<svg id="Sunnah_Divorce_vs_Bid_ah_Divorce" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 306" role="img" aria-labelledby="Sunnah_Divorce_vs_Bid_ah_Divorce_t Sunnah_Divorce_vs_Bid_ah_Divorce_d">
<title id="Sunnah_Divorce_vs_Bid_ah_Divorce_t">Sunnah Divorce vs Bid'ah Divorce</title>
<desc id="Sunnah_Divorce_vs_Bid_ah_Divorce_d">Two-column contrast: Sunnah (Permitted) vs Bid'ah (Forbidden) — 4 paired phenomena</desc>
<style>#Sunnah_Divorce_vs_Bid_ah_Divorce{font-family:'Lato', system-ui, sans-serif;font-size:14px;fill:#111111;}#Sunnah_Divorce_vs_Bid_ah_Divorce text{font-family:'Lato', system-ui, sans-serif;}</style>
<text x="250" y="20.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#000000"><tspan x="250" dy="0">Sunnah Divorce vs Bid'ah Divorce</tspan></text>
<text x="250" y="34.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#777777"><tspan x="250" dy="0">Conformity to the Qur'an and Sunnah distinguishes a</tspan><tspan x="250" dy="12">valid divorce from a void one</tspan></text>
<rect x="14.0" y="62.0" width="218.0" height="48.0" fill="#000000" stroke="#000000" stroke-width="1.0" rx="4"/>
<rect x="268.0" y="62.0" width="218.0" height="48.0" fill="#eeeeee" stroke="#d0d0d0" stroke-width="1.0" rx="4"/>
<text x="123.0" y="86.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#ffffff"><tspan x="123.0" dy="0">Sunnah (Permitted)</tspan></text>
<text x="377.0" y="86.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#111111"><tspan x="377.0" dy="0">Bid'ah (Forbidden)</tspan></text>
<rect x="14.0" y="110.0" width="218.0" height="46.0" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.0"/>
<rect x="268.0" y="110.0" width="218.0" height="46.0" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="123.0" y="126.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="123.0" dy="0">Woman pure, untouched in</tspan><tspan x="123.0" dy="14">that purity</tspan></text>
<text x="377.0" y="126.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="377.0" dy="0">Menstruating, or pure</tspan><tspan x="377.0" dy="14">after he touched her</tspan></text>
<line x1="249" y1="114" x2="249" y2="152" stroke="#d0d0d0" stroke-width="1"/>
<rect x="14.0" y="156.0" width="218.0" height="46.0" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="1.0"/>
<rect x="268.0" y="156.0" width="218.0" height="46.0" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="123.0" y="172.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="123.0" dy="0">A single divorce</tspan><tspan x="123.0" dy="14">pronounced</tspan></text>
<text x="377.0" y="172.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="377.0" dy="0">Three or more named at</tspan><tspan x="377.0" dy="14">once</tspan></text>
<line x1="249" y1="160" x2="249" y2="198" stroke="#d0d0d0" stroke-width="1"/>
<rect x="14.0" y="202.0" width="218.0" height="46.0" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.0"/>
<rect x="268.0" y="202.0" width="218.0" height="46.0" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="123.0" y="218.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="123.0" dy="0">Just witnesses called to</tspan><tspan x="123.0" dy="14">testify</tspan></text>
<text x="377.0" y="218.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="377.0" dy="0">Pronounced without</tspan><tspan x="377.0" dy="14">witnesses</tspan></text>
<line x1="249" y1="206" x2="249" y2="244" stroke="#d0d0d0" stroke-width="1"/>
<rect x="14.0" y="248.0" width="218.0" height="46.0" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="1.0"/>
<rect x="268.0" y="248.0" width="218.0" height="46.0" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="123.0" y="264.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="123.0" dy="0">Right of return</tspan><tspan x="123.0" dy="14">preserved</tspan></text>
<text x="377.0" y="264.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="377.0" dy="0">Contrary to Allah's</tspan><tspan x="377.0" dy="14">command and the Sunnah</tspan></text>
<line x1="249" y1="252" x2="249" y2="290" stroke="#d0d0d0" stroke-width="1"/>
</svg>