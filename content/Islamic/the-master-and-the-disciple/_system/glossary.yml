  first_seen_snippet: 'Author: Sayyidina Ja''far ibn Mansur al-Yaman'
  annotation_class: silent
  annotation_reason: An honorific ('our master') prefixed to a name and rendered in
    prose; formally introducing it helps no one.
- phonetic: Ja'far ibn Mansur al-Yaman
  transliteration: Ja'far ibn Manṣūr al-Yaman
