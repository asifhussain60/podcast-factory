- phonetic: jazā'ir
  transliteration: jazā'ir
  arabic_script: الجزائر
  audio_phonetic: ja-ZAA-ir
  first_seen_snippet: the twelve islands (jazā'ir), the dwellings of the chiefs
  annotation_class: silent
  annotation_reason: Rendered in prose as 'islands'; the metaphor is explained inline,
    no apparatus needed.
- phonetic: asbāb
  transliteration: asbāb
  arabic_script: الأسباب
  audio_phonetic: as-BAAB
  first_seen_snippet: the causes (asbāb) of God I have described to you
  annotation_class: silent
  annotation_reason: Translated plainly as 'causes' in prose; the generic plural is
    not a term a reader would search.
- phonetic: al-Kabīr
  transliteration: al-Kabīr
  arabic_script: الكبير
  audio_phonetic: al-ka-BEER
  first_seen_snippet: Monday is for the bladder, in the great meaning, al-Kabīr
  annotation_class: silent
  annotation_reason: An epithet ('the Great') glossed inline; not a standalone technical
    term.
- phonetic: al-Imām al-Nāṭiq
  transliteration: al-Imām al-Nāṭiq
  arabic_script: الإمام الناطق
  audio_phonetic: al-imaam an-Naa-tiq
  first_seen_snippet: '"It is like the speaking Imam (al-Imām al-Nāṭiq), who is exalted
    above all creation"'
  annotation_class: teach
  annotation_reason: A central named concept ('the Speaking Imam') the book defines
    and returns to.
- phonetic: Imam
  transliteration: imām
  arabic_script: الإمام
  audio_phonetic: e-Maam
  first_seen_snippet: '"It is like the speaking Imam, who is exalted above all creation"'
  annotation_class: familiar
  english_equivalent: imam
  annotation_reason: A common English noun readers already recognize; recurs throughout.
- phonetic: nuqabāʾ
  transliteration: nuqabāʾ
  arabic_script: نقباء
  audio_phonetic: nu-ka-BAA
  first_seen_snippet: '"They are like the twelve chiefs (nuqabā'') — the chiefs of
    the speaking Imam"'
  annotation_class: teach
  annotation_reason: The book's rank of 'chiefs' under the Speaking Imam — doctrinal
    vocabulary to introduce.
- phonetic: duʿāt
  transliteration: duʿāt
  arabic_script: دعاتها
  audio_phonetic: dua'at
  first_seen_snippet: '"Its stars are his summoners (du''āt), who call to good with
    the permission of their Lord"'
  annotation_class: teach
  annotation_reason: The 'summoners' rank the book teaches as part of its hierarchy.
- phonetic: bāb
  transliteration: bāb
  arabic_script: باب
  audio_phonetic: /baːb/
  first_seen_snippet: '"It is like the gate (bāb) of the speaking Imam during his
    lifetime"'
