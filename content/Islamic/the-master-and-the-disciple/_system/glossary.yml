    so the romanisation and script stay.
- phonetic: Allah
  transliteration: Allāh
  arabic_script: الله
  audio_phonetic: al-LAH
  first_seen_snippet: May Allah be with His servants
  annotation_class: familiar
  english_equivalent: God
  annotation_reason: Universally recognized by English readers; prints plainly with
    no apparatus.
- phonetic: Tur
  transliteration: Ṭūr
  arabic_script: الطور
  audio_phonetic: TOOR
  first_seen_snippet: one of the scholars of [Mount] Tur
  annotation_class: name
  annotation_reason: A place-name English readers won't recognize as such from the
    romanisation; script anchors the pronunciation.
- phonetic: Bayt al-Ma'mur
  transliteration: Bayt al-Ma'mūr
  arabic_script: البيت المعمور
  audio_phonetic: bait al-ma'a-moor
  first_seen_snippet: one of the dwellers of the Bayt al-Ma'mur
  annotation_class: name
  annotation_reason: A specific cosmological place-name with no established English
    form.
- phonetic: al-Jazira
  transliteration: al-Jazīra
  arabic_script: الجزيرة
  audio_phonetic: al-ja-zee-rah
  first_seen_snippet: the far reaches of the island [al-Jazira]
  annotation_class: name
  annotation_reason: A place ('the island') with no familiar English form; romanisation
    is how the reader says it.
- phonetic: Umma
  transliteration: Umma
  arabic_script: ''
  audio_phonetic: OOM-mah
  first_seen_snippet: they are of the people of the Umma
  english: nation
  annotation_class: familiar
  english_equivalent: community
  annotation_reason: The Muslim community — an established term educated English readers
    already recognize.
- phonetic: Haram
  transliteration: Ḥaram
  arabic_script: ''
  audio_phonetic: HA-ram
  first_seen_snippet: one of the dwellers of His sanctuary [Haram]
  english: the sanctuary; the sacred precinct
  annotation_class: familiar
  english_equivalent: the Sanctuary
  annotation_reason: The sacred precinct has a recognized English rendering and is
    glossed in prose.
- phonetic: sheikh
  transliteration: shaykh
  arabic_script: شيخ
  audio_phonetic: shay-k
  first_seen_snippet: a great sheikh of the Arabs
  annotation_class: familiar
  english_equivalent: sheikh
  annotation_reason: A common English loanword for an elder/leader.
- phonetic: batin
  transliteration: bāṭin
  arabic_script: الباطن
  audio_phonetic: BAA-tin
  first_seen_snippet: the inward [batin] has been integrated as a teacher
  annotation_class: teach
  annotation_reason: Core doctrinal term (the inward/esoteric) the book itself teaches
    and repeatedly builds on.
- phonetic: zahir
  transliteration: ẓāhir
  arabic_script: الظاهر
  audio_phonetic: ZAA-hir
  first_seen_snippet: the outward [zahir] has expanded his dream
  annotation_class: teach
  annotation_reason: Core doctrinal term (the outward/exoteric), the paired counterpart
    the book teaches.
- phonetic: Hizb Allah
  transliteration: Ḥizb Allāh
  arabic_script: حزب الله
  audio_phonetic: HIZB ahl-LAH
  first_seen_snippet: he had become part of the Party of God (Hizb Allah)
  annotation_class: silent
  annotation_reason: A Quranic phrase already translated in running prose ('Party
    of God'); a formal entry adds nothing.
- phonetic: Kun
  transliteration: Kun
  arabic_script: كن
  audio_phonetic: KOON
  first_seen_snippet: from which "Kun" — two letters — is derived
  annotation_class: teach
  annotation_reason: The divine creative command the book dissects letter by letter
    — a concept the reader should be able to name.
- phonetic: fa-yakun
  transliteration: fa-yakūn
  arabic_script: فيكون
  audio_phonetic: fa-ya-KOON
  first_seen_snippet: and "fa-yakun" — five letters
  annotation_class: silent
  annotation_reason: The grammatical remainder of the Kun-phrase, translated inline;
    not a citable term on its own.
- phonetic: minhāj
  transliteration: minhāj
  arabic_script: منهاج
  audio_phonetic: min-HAAJ
  first_seen_snippet: its sign a way (minhāj) of darkness
  annotation_class: silent
  annotation_reason: A generic word ('way/method') translated in prose; too minor
    to introduce formally.
- phonetic: sunna
  transliteration: sunna
  arabic_script: السنة
  audio_phonetic: SOON-na
  first_seen_snippet: Then the sunna (custom) of creation in pairs went forth
  annotation_class: familiar
  english_equivalent: Sunna
  annotation_reason: An established term educated readers recognize; glossed as 'custom'
    where it first appears.
- phonetic: nāṭiq
  transliteration: nāṭiq
  arabic_script: الناطق
  audio_phonetic: NAA-tiq
  first_seen_snippet: some are imams and speakers (nāṭiqs)
  annotation_class: teach
  annotation_reason: Technical rank in the book's hierarchy (the Speaker/Speaking
