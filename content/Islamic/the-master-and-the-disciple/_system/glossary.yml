- phonetic: ḥujaj
  transliteration: ḥujaj
  arabic_script: الحجج
  audio_phonetic: Hu-jaj
  first_seen_snippet: some are arguments (ḥujaj) and chiefs (nuqabā')
  annotation_class: teach
  annotation_reason: A named rank (proofs/arguments) in the book's doctrinal hierarchy
    worth introducing.
- phonetic: nuqabā'
  transliteration: nuqabā'
  arabic_script: النقباء
  audio_phonetic: nu-ka-BAA
  first_seen_snippet: some are arguments (ḥujaj) and chiefs (nuqabā')
  annotation_class: teach
  annotation_reason: A specific rank ('chiefs') in the hierarchy the book teaches
    and enumerates.
- phonetic: du'āt
  transliteration: du'āt
  arabic_script: الدعاة
  audio_phonetic: dua'at
  first_seen_snippet: among them are the summoners (du'āt) to the good
  annotation_class: teach
  annotation_reason: A named rank ('summoners') central to the book's mission structure.
- phonetic: zawāhir
  transliteration: zawāhir
  arabic_script: الزواهر
  audio_phonetic: za-WAA-hir
  first_seen_snippet: Their summoners are like the manifest stars (zawāhir)
  annotation_class: silent
  annotation_reason: A descriptive term ('manifest stars') translated in prose; too
