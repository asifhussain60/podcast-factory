<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-family="Lato, system-ui, sans-serif">
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#8b4513">The Architecture of the Heavenly Mirror</text>

  <text x="200" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#8b4513">HUMAN HIERARCHY</text>
  <text x="560" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#8b4513">CELESTIAL MAPPING</text>
  <line x1="20" y1="86" x2="740" y2="86" stroke="#d9cdbd"/>

  <rect x="20" y="100" width="340" height="100" fill="#f7f1e6" stroke="#d9cdbd"/>
  <rect x="400" y="100" width="340" height="100" fill="#ffffff" stroke="#d9cdbd"/>
  <text x="40" y="128" font-size="14" font-weight="700" fill="#2b2117">The Speaker-Prophet (Natiq)</text>
  <text x="40" y="148" font-size="12" fill="#7a6a58">Direct receiver of revelation.</text>
  <text x="420" y="128" font-size="14" font-weight="700" fill="#2b2117">Zenith Point</text>
  <line x1="360" y1="150" x2="400" y2="150" stroke="#8b4513"/>

  <rect x="20" y="210" width="340" height="120" fill="#ffffff" stroke="#d9cdbd"/>
  <rect x="400" y="210" width="340" height="120" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="40" y="238" font-size="14" font-weight="700" fill="#2b2117">The Imam (Wasi)</text>
  <text x="40" y="258" font-size="12" fill="#7a6a58">Interprets and receives esoteric inspiration.</text>
  <text x="420" y="258" font-size="12" font-style="italic" fill="#2b2117">"Bright beyond bearing, veiled by its own brightness."</text>
  <line x1="360" y1="270" x2="400" y2="270" stroke="#8b4513"/>

  <rect x="20" y="340" width="340" height="140" fill="#f7f1e6" stroke="#d9cdbd"/>
  <rect x="400" y="340" width="340" height="140" fill="#ffffff" stroke="#d9cdbd"/>
  <text x="40" y="368" font-size="14" font-weight="700" fill="#2b2117">The Gateway (Bab / Hujja)</text>
  <text x="40" y="388" font-size="12" fill="#7a6a58">Condenses and distributes.</text>
  <text x="40" y="406" font-size="12" fill="#7a6a58">(Twelve to an Imam, one per region).</text>
  <text x="420" y="400" font-size="12" font-style="italic" fill="#2b2117">"Borrowed light, never out of phase with its source."</text>
  <line x1="360" y1="410" x2="400" y2="410" stroke="#8b4513"/>

  <rect x="20" y="490" width="340" height="110" fill="#ffffff" stroke="#d9cdbd"/>
  <rect x="400" y="490" width="340" height="110" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="40" y="518" font-size="14" font-weight="700" fill="#2b2117">The Summoners (Du'at)</text>
  <text x="40" y="538" font-size="12" fill="#7a6a58">(Thirty per Bab, mirroring days under months).</text>
  <text x="420" y="525" font-size="13" fill="#2b2117">Navigation by night.</text>
  <text x="420" y="548" font-size="12" font-style="italic" fill="#2b2117">"Guided by the stars."</text>
  <line x1="360" y1="545" x2="400" y2="545" stroke="#8b4513"/>
</svg>
