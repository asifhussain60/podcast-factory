<title id="The_Seven_Principles_of_Creation_t">The Seven Principles of Creation</title>
<desc id="The_Seven_Principles_of_Creation_d">Hierarchy: Air (presides, without partner) → Water, Darkness… → Smoke (from water), Condensation (from darkness)…</desc>
