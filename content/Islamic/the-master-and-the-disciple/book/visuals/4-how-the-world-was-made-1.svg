<title id="From_Light_to_Kun_fa_yakun_t">From Light to Kun fa-yakun</title>
<desc id="From_Light_to_Kun_fa_yakun_d">Cascade chain (7 stages): Light → Will → Command → Speech → Kun (2 letters) → fa-yakun (5 letters) → Seven Letters</desc>
