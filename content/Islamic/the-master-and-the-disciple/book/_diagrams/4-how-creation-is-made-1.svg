<svg id="The_Three_Words_of_Creation" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-labelledby="The_Three_Words_of_Creation_t The_Three_Words_of_Creation_d">
<title id="The_Three_Words_of_Creation_t">The Three Words of Creation</title>
<desc id="The_Three_Words_of_Creation_d">Cascade chain (4 stages): Light → Will → Command → Saying (Kun fa-yakun)</desc>
<style>#The_Three_Words_of_Creation{font-family:'Lato', system-ui, sans-serif;font-size:14px;fill:#1f1d18;}#The_Three_Words_of_Creation text{font-family:'Lato', system-ui, sans-serif;}</style>
<defs><marker id="svgp_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#87827a"/></marker></defs>
<text x="200.0" y="24.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#8b4513"><tspan x="200.0" dy="0">The Three Words of Creation</tspan></text>
<text x="200.0" y="62.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#87827a"><tspan x="200.0" dy="0">Origin</tspan></text>
<rect x="56.0" y="72.0" width="288.0" height="52.0" fill="#8b4513" stroke="#8b4513" stroke-width="1.5" rx="4"/>
<text x="200.0" y="98.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#fffdf8"><tspan x="200.0" dy="0">Light</tspan></text>
<line x1="200.0" y1="124.0" x2="200.0" y2="152.0" stroke="#87827a" stroke-width="1.5" marker-end="url(#svgp_arrow)"/>
<text x="200.0" y="172.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#87827a"><tspan x="200.0" dy="0">First word</tspan></text>
<rect x="56.0" y="182.0" width="288.0" height="52.0" fill="#ac7c57" stroke="#d9d3c4" stroke-width="1.0" rx="4"/>
<text x="200.0" y="208.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#fffdf8"><tspan x="200.0" dy="0">Will</tspan></text>
<line x1="200.0" y1="234.0" x2="200.0" y2="262.0" stroke="#87827a" stroke-width="1.5" marker-end="url(#svgp_arrow)"/>
<text x="200.0" y="282.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#87827a"><tspan x="200.0" dy="0">Branches into</tspan></text>
<rect x="56.0" y="292.0" width="288.0" height="52.0" fill="#cdb39b" stroke="#d9d3c4" stroke-width="1.0" rx="4"/>
<text x="200.0" y="318.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#1f1d18"><tspan x="200.0" dy="0">Command</tspan></text>
<line x1="200.0" y1="344.0" x2="200.0" y2="372.0" stroke="#87827a" stroke-width="1.5" marker-end="url(#svgp_arrow)"/>
<text x="200.0" y="392.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#87827a"><tspan x="200.0" dy="0">Divides into</tspan></text>
<rect x="56.0" y="402.0" width="288.0" height="52.0" fill="#efeae0" stroke="#d9d3c4" stroke-width="1.0" rx="4"/>
<text x="200.0" y="428.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#1f1d18"><tspan x="200.0" dy="0">Saying (Kun fa-yakun)</tspan></text>
</svg>