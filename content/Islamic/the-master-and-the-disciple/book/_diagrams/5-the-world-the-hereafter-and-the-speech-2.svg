<svg id="Outside_and_Inside_of_the_World" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 306" role="img" aria-labelledby="Outside_and_Inside_of_the_World_t Outside_and_Inside_of_the_World_d">
<title id="Outside_and_Inside_of_the_World_t">Outside and Inside of the World</title>
<desc id="Outside_and_Inside_of_the_World_d">Two-column contrast: Inside (soul/meaning) vs Outside (body/form) — 4 paired phenomena</desc>
<style>#Outside_and_Inside_of_the_World{font-family:'Lato', system-ui, sans-serif;font-size:14px;fill:#1f1d18;}#Outside_and_Inside_of_the_World text{font-family:'Lato', system-ui, sans-serif;}</style>
<text x="250" y="20.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#8b4513"><tspan x="250" dy="0">Outside and Inside of the World</tspan></text>
<text x="250" y="40.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#87827a"><tspan x="250" dy="0">The outside has no standing except by its inside.</tspan></text>
