<text x="123.0" y="86.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#fffdf8"><tspan x="123.0" dy="0">Origin</tspan></text>
<text x="377.0" y="86.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#1f1d18"><tspan x="377.0" dy="0">Derived Consort</tspan></text>
<rect x="14.0" y="110.0" width="218.0" height="46.0" fill="#fffdf8" stroke="#d9d3c4" stroke-width="1.0"/>
