<text x="377.0" y="133.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#1f1d18"><tspan x="377.0" dy="0">Smoke</tspan></text>
<line x1="249" y1="114" x2="249" y2="152" stroke="#d9d3c4" stroke-width="1"/>
