<svg id="The_Seven_Principles_of_Creation" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" role="img" aria-labelledby="The_Seven_Principles_of_Creation_t The_Seven_Principles_of_Creation_d">
<title id="The_Seven_Principles_of_Creation_t">The Seven Principles of Creation</title>
<desc id="The_Seven_Principles_of_Creation_d">Two-column contrast: Origin vs Derived Consort — 3 paired phenomena</desc>
<style>#The_Seven_Principles_of_Creation{font-family:'Lato', system-ui, sans-serif;font-size:14px;fill:#1f1d18;}#The_Seven_Principles_of_Creation text{font-family:'Lato', system-ui, sans-serif;}</style>
<text x="250" y="20.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#8b4513"><tspan x="250" dy="0">The Seven Principles of Creation</tspan></text>
<text x="250" y="34.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#87827a"><tspan x="250" dy="0">Each derivative becomes consort to its origin; air,</tspan><tspan x="250" dy="12">singular and without consort, encompasses all</tspan></text>
