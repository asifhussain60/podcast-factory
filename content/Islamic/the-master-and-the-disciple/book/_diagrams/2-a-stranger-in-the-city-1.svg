<text x="350.5" y="339.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#87827a"><tspan x="350.5" dy="0">Incoherent</tspan></text>
<text x="350.5" y="361.5" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#87827a"><tspan x="350.5" dy="0">appetite yet toward</tspan><tspan x="350.5" dy="12">God</tspan></text>
