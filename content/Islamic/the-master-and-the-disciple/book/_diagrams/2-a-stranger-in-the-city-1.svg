<text x="155.5" y="59.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#87827a"><tspan x="155.5" dy="0">Calls toward other</tspan><tspan x="155.5" dy="12">than guidance</tspan></text>
<text x="350.5" y="65.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#87827a"><tspan x="350.5" dy="0">Calls toward God</tspan></text>
