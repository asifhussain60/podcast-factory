<text x="52" y="349.5" text-anchor="end" dominant-baseline="central" font-size="10" font-weight="normal" fill="#87827a"><tspan x="52" dy="0">From appetite</tspan></text>
<rect x="58.0" y="72.0" width="195.0" height="185.0" fill="#efeae0" stroke="#d9d3c4" stroke-width="1.0"/>
<defs><pattern id="svgp_h0" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><line x1="0" y1="0" x2="0" y2="10" stroke="#d9d3c4" stroke-width="1.5"/></pattern></defs><rect x="58" y="72" width="195" height="185" fill="url(#svgp_h0)"/>
<text x="155.5" y="154.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#87827a"><tspan x="155.5" dy="0">Incoherent</tspan></text>
<text x="155.5" y="176.5" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#87827a"><tspan x="155.5" dy="0">from God yet</tspan><tspan x="155.5" dy="12">misdirected</tspan></text>
<rect x="253.0" y="72.0" width="195.0" height="185.0" fill="#8b4513" stroke="#d9d3c4" stroke-width="1.0"/>
<text x="350.5" y="154.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#fffdf8"><tspan x="350.5" dy="0">Praiseworthy speech</tspan></text>
<text x="350.5" y="176.5" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#fffdf8"><tspan x="350.5" dy="0">correct: from God,</tspan><tspan x="350.5" dy="12">toward God</tspan></text>
<rect x="58.0" y="257.0" width="195.0" height="185.0" fill="#efeae0" stroke="#d9d3c4" stroke-width="1.0"/>
<text x="155.5" y="339.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#1f1d18"><tspan x="155.5" dy="0">Condemnable speech</tspan></text>
<text x="155.5" y="361.5" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#1f1d18"><tspan x="155.5" dy="0">appetite calling away</tspan><tspan x="155.5" dy="12">from guidance</tspan></text>
<rect x="253.0" y="257.0" width="195.0" height="185.0" fill="#efeae0" stroke="#d9d3c4" stroke-width="1.0"/>
