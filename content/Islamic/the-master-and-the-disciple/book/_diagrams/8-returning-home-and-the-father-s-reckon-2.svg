<svg id="The_Shaykh_s_Three_Final_Charges" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" role="img" aria-labelledby="The_Shaykh_s_Three_Final_Charges_t The_Shaykh_s_Three_Final_Charges_d">
<title id="The_Shaykh_s_Three_Final_Charges_t">The Shaykh's Three Final Charges</title>
<desc id="The_Shaykh_s_Three_Final_Charges_d">Hierarchy: Charges Upon the Departing Disciple → Fear of God who created you, Preservation of the trust you struggled for…</desc>
<style>#The_Shaykh_s_Three_Final_Charges{font-family:'Lato', system-ui, sans-serif;font-size:14px;fill:#1f1d18;}#The_Shaykh_s_Three_Final_Charges text{font-family:'Lato', system-ui, sans-serif;}</style>
<defs><marker id="svgp_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#87827a"/></marker></defs>
<text x="250.0" y="24.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#8b4513"><tspan x="250.0" dy="0">The Shaykh's Three Final Charges</tspan></text>
<rect x="166.0" y="52.0" width="168.0" height="44.0" fill="#8b4513" stroke="#8b4513" stroke-width="1.0" rx="4"/>
<text x="250.0" y="66.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#fffdf8"><tspan x="250.0" dy="0">Charges Upon the</tspan><tspan x="250.0" dy="15">Departing Disciple</tspan></text>
<rect x="-12.0" y="148.0" width="168.0" height="44.0" fill="#a0522d" stroke="#d9d3c4" stroke-width="1.0" rx="4"/>
<text x="72.0" y="163.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fffdf8"><tspan x="72.0" dy="0">Fear of God who</tspan><tspan x="72.0" dy="14">created you</tspan></text>
<rect x="166.0" y="148.0" width="168.0" height="44.0" fill="#a0522d" stroke="#d9d3c4" stroke-width="1.0" rx="4"/>
<text x="250.0" y="156.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fffdf8"><tspan x="250.0" dy="0">Preservation of the</tspan><tspan x="250.0" dy="14">trust you struggled</tspan><tspan x="250.0" dy="14">for</tspan></text>
<rect x="344.0" y="148.0" width="168.0" height="44.0" fill="#a0522d" stroke="#d9d3c4" stroke-width="1.0" rx="4"/>
<text x="428.0" y="163.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#fffdf8"><tspan x="428.0" dy="0">Safeguarding of your</tspan><tspan x="428.0" dy="14">father</tspan></text>
<line x1="250.0" y1="96.0" x2="250.0" y2="122.0" stroke="#87827a" stroke-width="1.5"/>
