<svg id="The_Outward_and_Inward_of_the_Way" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 401" role="img" aria-labelledby="The_Outward_and_Inward_of_the_Way_t The_Outward_and_Inward_of_the_Way_d">
<title id="The_Outward_and_Inward_of_the_Way_t">The Outward and Inward of the Way</title>
<desc id="The_Outward_and_Inward_of_the_Way_d">Concentric diagram: 3 nested levels — Outward, Inward, Guarded Trust</desc>
<style>#The_Outward_and_Inward_of_the_Way{font-family:'Lato', system-ui, sans-serif;font-size:14px;fill:#1f1d18;}#The_Outward_and_Inward_of_the_Way text{font-family:'Lato', system-ui, sans-serif;}</style>
<defs><marker id="svgp_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#87827a"/></marker></defs>
<text x="250" y="22.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#8b4513"><tspan x="250" dy="0">The Outward and Inward of the Way</tspan></text>
<ellipse cx="250" cy="225" rx="210.0" ry="160.0" fill="#c8956c" stroke="#d9d3c4" stroke-width="1.5"/>
<ellipse cx="250" cy="225" rx="140.0" ry="106.7" fill="#a0522d" stroke="#d9d3c4" stroke-width="1.5"/>
<ellipse cx="250" cy="225" rx="70.0" ry="53.3" fill="#8b4513" stroke="#8b4513" stroke-width="1.5"/>
<text x="250" y="91.66666666666669" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#1f1d18"><tspan x="250" dy="0">Outward</tspan></text>
<text x="250" y="103.16666666666669" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#1f1d18"><tspan x="250" dy="0">reminder and sign for the guided,</tspan><tspan x="250" dy="13">in plain view</tspan></text>
<text x="250" y="145.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#fffdf8"><tspan x="250" dy="0">Inward</tspan></text>
<text x="250" y="156.5" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#fffdf8"><tspan x="250" dy="0">hidden green, a clear drink for</tspan><tspan x="250" dy="13">those who search</tspan></text>
<text x="250" y="198.33333333333334" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#fffdf8"><tspan x="250" dy="0">Guarded Trust</tspan></text>
<text x="250" y="209.83333333333334" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#fffdf8"><tspan x="250" dy="0">secrets deposited in the breasts of</tspan><tspan x="250" dy="13">the righteous keepers</tspan></text>
</svg>