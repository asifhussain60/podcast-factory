<svg id="The_Three_Thanks_and_Their_Practices" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" role="img" aria-labelledby="The_Three_Thanks_and_Their_Practices_t The_Three_Thanks_and_Their_Practices_d">
<title id="The_Three_Thanks_and_Their_Practices_t">The Three Thanks and Their Practices</title>
<desc id="The_Three_Thanks_and_Their_Practices_d">Two-column contrast: What is owed thanks vs How thanks is rendered — 3 paired phenomena</desc>
<style>#The_Three_Thanks_and_Their_Practices{font-family:'Lato', system-ui, sans-serif;font-size:14px;fill:#1f1d18;}#The_Three_Thanks_and_Their_Practices text{font-family:'Lato', system-ui, sans-serif;}</style>
<text x="250" y="20.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#8b4513"><tspan x="250" dy="0">The Three Thanks and Their Practices</tspan></text>
<text x="250" y="40.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#87827a"><tspan x="250" dy="0">Gratitude is a discipline, not a feeling</tspan></text>
<rect x="14.0" y="62.0" width="218.0" height="48.0" fill="#8b4513" stroke="#8b4513" stroke-width="1.0" rx="4"/>
<rect x="268.0" y="62.0" width="218.0" height="48.0" fill="#efeae0" stroke="#d9d3c4" stroke-width="1.0" rx="4"/>
<text x="123.0" y="86.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#fffdf8"><tspan x="123.0" dy="0">What is owed thanks</tspan></text>
<text x="377.0" y="86.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#1f1d18"><tspan x="377.0" dy="0">How thanks is rendered</tspan></text>
<rect x="14.0" y="110.0" width="218.0" height="46.0" fill="#fffdf8" stroke="#d9d3c4" stroke-width="1.0"/>
<rect x="268.0" y="110.0" width="218.0" height="46.0" fill="#fffdf8" stroke="#d9d3c4" stroke-width="1.0"/>
<text x="123.0" y="133.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#1f1d18"><tspan x="123.0" dy="0">The Master (the Call)</tspan></text>
<text x="377.0" y="133.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#1f1d18"><tspan x="377.0" dy="0">Obey Him</tspan></text>
<line x1="249" y1="114" x2="249" y2="152" stroke="#d9d3c4" stroke-width="1"/>
<rect x="14.0" y="156.0" width="218.0" height="46.0" fill="#f7f4ee" stroke="#d9d3c4" stroke-width="1.0"/>
<rect x="268.0" y="156.0" width="218.0" height="46.0" fill="#f7f4ee" stroke="#d9d3c4" stroke-width="1.0"/>
<text x="123.0" y="179.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#1f1d18"><tspan x="123.0" dy="0">The Knowledge</tspan></text>
<text x="377.0" y="172.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#1f1d18"><tspan x="377.0" dy="0">Act on it and call</tspan><tspan x="377.0" dy="14">others to it</tspan></text>
<line x1="249" y1="160" x2="249" y2="198" stroke="#d9d3c4" stroke-width="1"/>
<rect x="14.0" y="202.0" width="218.0" height="46.0" fill="#fffdf8" stroke="#d9d3c4" stroke-width="1.0"/>
<rect x="268.0" y="202.0" width="218.0" height="46.0" fill="#fffdf8" stroke="#d9d3c4" stroke-width="1.0"/>
<text x="123.0" y="225.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#1f1d18"><tspan x="123.0" dy="0">The Work</tspan></text>
<text x="377.0" y="218.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#1f1d18"><tspan x="377.0" dy="0">Be patient with it and</tspan><tspan x="377.0" dy="14">call others to it</tspan></text>
<line x1="249" y1="206" x2="249" y2="244" stroke="#d9d3c4" stroke-width="1"/>
</svg>