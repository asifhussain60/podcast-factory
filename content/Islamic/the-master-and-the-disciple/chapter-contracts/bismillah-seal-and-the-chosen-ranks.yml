show_notes:
  blurb: >
    Episode five of *The Master and the Disciple* shows how the
    architecture of creation is sealed into the Bismillah — a
    cryptographic lock whose three names and letter-counts mirror
    the three primordial words and the sevens-and-twelves of
    cosmology, point for point. Then it names who fills the
    houses of prophethood: distinguished personalities and guiding
    figures by category and function — Natiq, Imam, Bab, Hujaj,
    Nuqaba, Du'at, ulama. And it mirrors the hierarchy in the
    visible sky: the Imam is the sun, his Bab the moon, the Du'at
    the stars. A finer distinction is preserved that listeners
    often miss: the twelve regional Hujaj are proofs, but the Bab
    is the one Gateway — the Hujja al-Imam, the single moon to the
    one sun.
