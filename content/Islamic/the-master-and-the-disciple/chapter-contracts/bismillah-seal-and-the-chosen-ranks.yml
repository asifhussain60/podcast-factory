  references:
    - >
      "The Bismillah formula, opening every Quranic surah save one
      and every Muslim's pious action, is read here not as a pious
      invocation but as a cryptographic seal whose three names and
      letter-counts (3 names; 7 + 12 letters) encode the
      architecture laid in the previous episode."
thesis_relevance: >
  This episode advances the book's central claim — that the
  spiritual structure is precise, sealed, and populated by named
  intermediaries — by showing that the Bismillah locks the
  architecture cryptographically and that the apex of the design is
  occupied not by abstractions but by distinguished personalities
  arranged into houses of prophethood. Without the seal there is no
  protection of the doctrine; without the named ranks there is no
  chain through which it reaches the listener.

