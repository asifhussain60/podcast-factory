show_notes:
  blurb: >
    Episode one of *The Master and the Disciple* opens on a group of
    the truly faithful and a group of du'at al-din standing in front
    of one of their scholars with three thanks owed at once — for
    the call, for the knowledge, for the practice — and asking how
    on earth they are supposed to repay them. The Master answers
    first with a metaphysics of stages: every beginning has been
    given an end, every end a goal, every goal a limit whose full
    extent cannot be reached. He names the three-stage spiritual
    path balwa-huda-taqwa, and only then names the three deeds —
    obedience for the call, action for the knowledge, perseverance
    for the practice. The episode then enters the story of the
    Persian seeker, the man whose thirst for knowledge led him
    through mirage after mirage until he reached the place of
    nothing and met Allah there. From that meeting he came under
    the same proverb that had once been his master's: 'The most
    excellent of deeds is giving life to the dead.' His interior
    monologue runs the chain backward — did the trust really
    descend from the heavenly host through every intermediary only
    to stop with him? The answer requires action. So he sets out
    across the Arab and non-Arab lands, and the episode lands with
    him at the far edge of al-jazira, the disciple still unfound.
  related_episodes:
