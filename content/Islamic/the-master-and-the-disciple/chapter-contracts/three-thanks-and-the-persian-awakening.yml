  references:
    - >
      "Sayyidina Ja'far ibn Mansur al-Yaman, *Kitab al-Alim wa
      al-Ghulam* — the tenth-century Yamani dialogue this episode
      opens; the author is a high-ranking da'i and a master of
      ta'wil, esoteric interpretation."
    - >
      "The Prophet ﷺ — quoted in the source for the saying about
      sitting before food like a slave before its master, on the
      adab of eating."
thesis_relevance: >
  This episode advances the book's central claim that true spiritual
  knowledge reaches creation only through an unbroken chain of
  chosen intermediaries, and becomes sacred only under the covenant
  of walaya to the Imam, by walking the doctrine that *earns* the
  covenant later in the chapter: gratitude as deed, the three-stage
  path of trial-guidance-piety, and the Persian scholar's interior
  argument that the chain runs by debt — every receiver of the
  trust owes a forward transmission. Everything later in the book
  rests on this opening establishment of why transmission matters.

