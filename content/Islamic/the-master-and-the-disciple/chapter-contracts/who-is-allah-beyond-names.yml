section_index: 1
episode_number: 17
title: Who Is Allah? — Beyond Names and Adjectives
audience: >
  Listeners stepping into the climax of the debate. Salih
  refuses to let the conversation about Allah's justice
  happen at the level of names and adjectives, and he
  walks Abu Malik through a dismantling of the standard
  creed his school relies on. Names cannot cook food. The
  four letters of the divine name do not contain the
  divine reality. The analogical proof from manufactured
  things secretly forges a likeness. The eye that cannot
  bear the sun cannot weigh the Creator. Abu Malik
  confesses that his words have left him.
angle: faithful_exposition
episode_format: debate
resolution: host_b_concedes
debate:
  proposition: >
    The school's vocabulary for Allah's unity — its creed,
    the letters of the divine name, and the analogical proof
    from manufactured things — does not grasp the reality the
    words point to.
  host_a:
    role: arbiter — voices Salih
    position: >
      Names and adjectives are of no benefit without their
      essential realities. Fire-as-word cooks no food; the
      letters of the divine name are signs pointing to Allah,
      not containers of Him; the analogical proof from
      manufactured things forges a hidden likeness; and the
      formula "nothing like His image" smuggles an image back
      under the table.
    source_moves:
      - >
        The fire-and-food analogy — if nouns and adjectives
        could take the place of realities, the tongue would
        burn at the mere mention of fire.
      - >
        The pressure on the letters of "one" and of the divine
        name — which of the four letters is Allah, or are they
        signs pointing to Him?
      - >
        The name-versus-someone-named cycle, and the question
        whether the school has the reality behind tawhid or
        only a textbook definition of it.
      - >
        The correction of analogy as forged likeness —
        everything is made from a pre-existing substance,
        while Allah creates from no substance.
      - >
        The exposure of "nothing like His image" against
        "none like Him."
      - >
        The sun-eye image — eyes cannot tolerate the light of
        the sun, so how can they perceive the Creator?
  host_b:
    role: advocate — voices Abu Malik
    position: >
      The school's creed and the analogical proof from
      manufactured things give the community real access to
      Allah's unity and justice; the shared vocabulary of
      tawhid is common ground both camps can stand on.
    source_moves:
      - >
        The four-line creed of the school as Abu Malik states
        it.
      - >
        The analysis of the divine name as the school teaches
        it.
      - >
        The manufacture argument — every manufactured thing
        has a manufacturer, so the universe must have a
        Creator.
      - >
        The closing confession — my words have left me;
        intellects are bewildered; imaginations are incapable
        of thinking about Him.
  resolution: host_b_concedes
format_rationale: >
  This is a sustained named exchange between Salih and Abu
  Malik on a single proposition — that the school's
  vocabulary for Allah's unity actually grasps the reality
  the words point to. Abu Malik voices the school's creed,
  the analysis of the divine name, and the analogical
  proof of a Creator; Salih dismantles each in turn; Abu
  Malik concedes at the close. The opposition is named, the
  proposition is contested, the resolution is
  host_b_concedes.
essential: core
essential_rationale: >
  The chapter is the doorway into the book's climax — it
  establishes that the standard vocabulary of unity is not
  shared ground but the very thing in dispute, and it lays
  the bewilderment from which the next episode's
  syllogism is built.
host_dynamic: advocate + arbiter
host_dynamic_rationale: >
  Advocate voices Abu Malik's school of names-and-attributes
  theology, including the analogical proof of a Creator from
  manufactured things. Arbiter voices Salih's critique:
  names are not realities; letters are signs, not
  containers; analogy forges a hidden likeness; the
  unguarded formula 'nothing like His image' smuggles an
  image in.
length_target: default_deep_dive
key_tensions:
  - >
    Names versus realities. The school treats 'Allah is
    one' and 'Allah is just' as the shared creed both camps
    affirm. Salih refuses the words as common ground; the
    test is whether the words have access to the realities
    they name. Fire-as-word does not cook food; tawhid-as-
    word does not unite a community to the divine.
  - >
    The letters of the divine name. Salih presses the
    structure of the word until Abu Malik must admit the
    letters are signs pointing to Allah, not Allah. The
    move exposes a scholarship that has poured itself into
    the form of the word and lost the meaning the form was
    meant to point to.
  - >
    The forged likeness. The school's analogical proof —
    every manufactured thing has a manufacturer; the
    universe must have a Creator — secretly transfers the
    craftsman model onto Allah. The standard formula
    'nothing like His image' even keeps an image under the
    table. The denial of likeness has retained a likeness.
tone_constraints:
  - >
    Walk the source in its own order: Salih's opening
    statement of his call; Abu Malik's four-line creed;
    Salih's names-vs-realities correction; the fire-and-
    food analogy; the analysis of the letters of 'one' and
    of the divine name; the indictment of formal piety
    that has lost the meaning; the name-vs-someone-named
    cycle; Abu Malik's manufacture argument; Salih's
    correction of analogy as forged likeness; the sun-eye
    image; Abu Malik's confession.
  - >
    Plain transliteration only — no diacritics. Inline
    terms used: tawhid. Always prefer the English
    equivalent. Do NOT pair any leadership-title with the
    personal name of the Father of Imams.
  - >
    Quranic citation format '(chapter N, verse M)' if any
    verse is surfaced; this episode surfaces no Quran
    verses directly from the source.
  - >
    Verbatim discipline: render the fire-and-food analogy
    intact; render the letters-of-the-name pressure intact;
    render the school's slogan 'nothing like His image' and
    Salih's exposure of it intact; render Abu Malik's
    confession ('my words have left me; intellects are
    bewildered; imaginations cannot reach Him') intact.
anchor_passages:
  - >
    "Those are only names and descriptions, of no benefit
    without their essential realities. It is like saying
    'fire is hot' — true, but you cannot cook food with
    the words, nor brighten darkness without the reality
    of fire. If nouns and adjectives could take the place
    of realities, your tongue would burn at the mere
    mention of fire, and your hunger would be satiated at
    the mention of food."
  - >
    "You say Allah is one, written with four letters — two
    joined and two separate. Which is 'one'? And the word
    Allah is also written with four letters — which of
    them is 'Allah'? Are they Allah together, or are they
    signs pointing to Allah?"
  - >
    "Do you understand who Allah is, the reality behind
    His unity, or do you only have a textbook definition
    of that tawhid?"
  - >
    "You have taken us away from your original meaning.
    Your difficulty in comprehending Allah's unity forced
    you to seek Him through logical assumption, and so you
    forged a likeness for Him. Allah is unique and
    exalted beyond that, for everything is made from a
    pre-existing substance, while Allah creates from no
    substance."
  - >
    "Your saying 'there is nothing like His image' implies
    He has an image — whereas if you truly meant absolute
    unity, you would have said 'there is none like Him.'"
  - >
    "Eyes cannot tolerate the light of the sun, which is
    only one of this lower world's lights — so how can
    they perceive the Creator?"
  - >
    "My words have left me. Intellects are bewildered.
    Imaginations are incapable of thinking about Him."
