thesis_relevance: >
  This episode advances the book's central claim — that
  true spiritual knowledge of Allah reaches creation only
  through an unbroken chain of chosen intermediaries — by
  dismantling the alternative that the school assumes:
  that the words of the creed and the analogical proof of
  a Creator together give a community direct access to
  Him. With that alternative refused, the necessity of
  the intermediary becomes the only honest path forward.

