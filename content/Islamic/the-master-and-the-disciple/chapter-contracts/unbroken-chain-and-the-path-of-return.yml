show_notes:
  blurb: >
    The final episode of *The Master and the Disciple*.
    Salih refutes the very notion of an interval between
    prophets by naming the chain link by link, and
    rereads the Quranic word fatra as a period of fear in
    which the call is made in secret rather than as an
    absence of the witness from the earth. The concealment
    of the friends of Allah in the listener's own time is
    explained by the way of Moses fleeing into Midian.
    The three categories of people — relentless murderer,
    rageful enemy, sympathetic abandoner — locate the
    moral weight not on the enemies but on those who feel
    for the witnesses but abandon them. The scholars who
    legitimate the oppressors are named as worse than the
    murderers themselves. The path of return is brief and
    exact: help the friends of Allah and they will reveal
    themselves; abandon their enemies and they will not
    be victorious. Abu Malik repents. The source seals
    the book by declaring its arc a replicable model from
    individual conversion to community-building. The
    closing praise-and-blessings seal closes the work.
  related_episodes:
    - the-conspiracy-formula
    - syllogism-of-divine-justice
  references:
    - >
      "The reading of fatra (5:19) as a period of fear
      rather than absence of messengers is the source's
      own interpretation, rendered as the source gives
      it."
thesis_relevance: >
  This episode delivers the book's central claim in its
  final form: the chain of just witnesses extends
  continuously from the beginning of prophecy to the
  listener's own time, with concealment under threat as
  the familiar prophetic posture. The path of return
  shows the listener what to do with the doctrine the
  book has built — help the friends of Allah, abandon
  their enemies — closing the arc from doctrine to
  action.

