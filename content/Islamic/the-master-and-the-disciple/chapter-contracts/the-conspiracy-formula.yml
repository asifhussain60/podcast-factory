show_notes:
  blurb: >
    Episode nineteen of *The Master and the Disciple*
    delivers the book's most distinctive piece of social
    analysis — the conspiracy formula. Three actors in
    every period — a rebellious devil, a willing
    oppressor, and a hypocritical religious scholar —
    collaborate to sever the outward traces of prophecy
    from its living continuation so that the traces can
    be exploited as a commodity. The slogan that holds
    the severance in place is 'no prophet after our
    prophet,' propagated until inquiry itself becomes
    redundant. Salih traces the pattern across the
    Zoroastrian, Torah, and Gospel communities, names this
    community as the latest case, and turns the
    consensus argument back: by that very logic, the
    earlier communities hold the greater claim. The
    Creator's freedom to abrogate and confirm voids every
    closure argument anyway.
