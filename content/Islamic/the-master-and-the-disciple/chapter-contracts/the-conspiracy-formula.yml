      "The historical roll call is rendered as the source
      gives it — fire-temple, calf, priest, this
      community's misuses — without smoothing the
      community names into modern terms."
thesis_relevance: >
  This episode advances the book's central claim — that
  true spiritual knowledge of Allah reaches creation only
  through an unbroken chain of chosen intermediaries — by
  diagnosing the precise social mechanism that makes
  communities behave as if the chain had stopped. With
  the diagnosis in place, the next episode can show that
  the absence of the witness in the listener's time is
  not the silence of heaven but the concealment of a
  chain that was never broken.
