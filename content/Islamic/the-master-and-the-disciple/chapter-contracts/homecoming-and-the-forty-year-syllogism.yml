show_notes:
  blurb: >
    Episode thirteen of *The Master and the Disciple*
    sends the disciple home. The Sheikh releases him for
    three reasons — his own travel, the father's sorrow,
    the disciple's new obligation to transmit — and binds
    him with four counsels: be mindful of Allah, uphold
    the oath, safeguard the scholar at his side, keep
    his identity concealed. At the outskirts of the city
    the scholar names his residence and gives six parting
    counsels that read as a da'i's operating manual.
    Resolution entrusted to Allah; words of wisdom in
    calling; no anger at being wronged; no upset at being
    called a liar; patience with the responder; being
    the best example. The disciple thanks him for three
    things — the Imam whose argument was upheld, the
    hujja whose trust was kept, the corpse to which life
    was given — kisses his feet, and goes home to a
    father whose charge has two horns: you concealed the
    truth from me, or you destroyed yourself by deception.
    The disciple meets the syllogism with a syllogism.
    Over forty years either you were a scholar who
    withheld, or you were ignorant who should have
    preceded me. Every door closes. The father weeps and
    enters the path; through father and son a great
    number of people are revived.
