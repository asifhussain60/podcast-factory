title: Homecoming and the Forty-Year Syllogism
audience: >
  Listeners returning with the disciple from the Sheikh's
  presence into the world he came from. The Sheikh
  releases him for three reasons — his own travel; the
  father's sorrow; the disciple's new obligation to
  transmit. The scholar accompanies him; at the outskirts
  of the city he gives the disciple six parting counsels
  that read as a da'i's operating manual. The disciple
  thanks him for three things — the Imam whose argument
  was upheld, the hujja whose trust was kept, the corpse
  to which life was given. He comes home to a father who
  charges him with betrayal on two horns; offers the
  father a choice between silence and open debate; and
  presses a forty-year syllogism whose two horns close
  every escape route. The father weeps and enters the
  path; through father and son a great number of people
  are revived.
angle: faithful_exposition
episode_format: deep_dive
format_rationale: >
  The chapter's spine is the Sheikh's release with three
  reasons, the scholar's six counsels, the disciple's
  thanks, and the homecoming. The father-son exchange has
  a brief named-opposition moment — the forty-year
  syllogism — but it occupies a small share of the
  chapter and the father concedes within a single
  paragraph rather than sustaining a contest. The
  dominant rhetorical shape is teaching-then-pressing-
  then-conversion, not contested back-and-forth.
  Deep_dive.
essential: core
essential_rationale: >
  Carries the disciple's commissioning back into the world,
  the da'i's six-line operating manual that will govern
  his calling for the rest of the book, and the
  conversion of al-Bakhtari that gives the disciple his
  first witness back home. Without this episode the
  doctrine never becomes a calling and the father never
  enters the path.
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: >
  Mentor delivers the Sheikh's three reasons for release
  and four counsels, the scholar's six parting counsels,
  and reads the structure of the forty-year syllogism
  whose two horns close every door. Student receives the
  six counsels line by line, hears the disciple's three
  thanks (the Imam; the hujja; the corpse given life),
  follows the father's charge on two horns, sees the
  disciple's offer of silence-or-open-debate, and
  watches the syllogism land on the father.
length_target: default_deep_dive
key_tensions:
  - >
    Concealment and witness. The Sheikh tells the disciple
    to keep his identity concealed. Yet his obligation is
    to transmit what he has received. The episode shows
    how the two are held together: he conceals the rank
    he has been given but he does not conceal the truth
    he can press in argument. The forty-year syllogism is
    pressed without naming the Sheikh.
  - >
    The father's two-horn charge versus the son's
    two-horn syllogism. The father charges the son with
    betrayal — either by concealing the truth or by being
    destroyed by deception. The son does not refute the
    horns; he flips the same structure back. Either you
    were a scholar who withheld, or you were ignorant
    who should have preceded me. The episode's craft is
    that the son meets a syllogism with a syllogism, and
    his closes every door the father's left open.
  - >
    The six counsels as operating manual. Each line is a
    working rule for a life of calling: resolution
    entrusted to Allah; words of wisdom in calling; no
    anger at being wronged; no upset at being called a
    liar; patience with the responder; being the best
    example of what one calls others to. The disciple
    uses the first four in the conversation with his
    father within a single page.
tone_constraints:
  - >
    Walk the source in its own order: the Sheikh's
    recognition that the disciple is ready; the three
    reasons for release (the Sheikh's travel; the father's
    sorrow; the obligation to transmit); the Sheikh's
    four counsels (mindful of Allah; uphold the oath;
    safeguard the scholar; conceal identity); permission
    for the scholar to accompany; the outskirts of the
    city; the scholar naming his residence; the six
    counsels verbatim; the three thanks (Imam; hujja;
    corpse given life); the kiss to the scholar's feet;
    the homecoming and the grief that annoyed the
    neighbors; the father's two-horn charge; the
    disciple's offer of silence-or-open-debate; the
    father's refusal of silence; the forty-year
    syllogism on two horns; the father's tears; the
    closing sentence — through father and son, Allah
    gave life to a great number of people.
  - >
    Plain transliteration only — no diacritics. Inline
    terms used: ahd, da'i, hujja, Imam, Bab. Always use
    the English equivalent where one exists. Do NOT pair
    any leadership-title with the personal name of the
    Father of Imams.
  - >
    No Quranic verses surface in this section; do not
    invent references. Render the six counsels and the
    three thanks as the source gives them, in plain
    refined English.
  - >
    Verbatim discipline: render the Sheikh's four
    counsels whole; render the six counsels of the
    scholar each as its own line; render the disciple's
    three thanks in order; render the father's charge on
    two horns; render the forty-year syllogism on two
    horns; render the closing sentence about the country
    given life.
anchor_passages:
  - >
    "Then the Sheikh gave him leave to depart, for three
    reasons: the Sheikh was about to travel; the young
    man had been long separated from his father, causing
    him great sorrow; and it was now the young man's
    obligation to pass on what this divine favor required.
    The Sheikh advised him to be mindful of Allah, to
    uphold the oath, to safeguard and assist his
    spiritual father, and to keep his identity concealed."
  - >
    "Once you have resolved upon something, entrust
    yourself completely to Allah. Speak with words of
    wisdom when you call others to good. Do not become
    angry when you are wronged. Do not become upset when
    you are called a liar. Remain patient with anyone
    who responds to your call. Make sure you become the
    best example of that to which you are calling others."
  - >
    "The young man thanked him for three things: for the
    Imam whose argument you have upheld; for the hujja
    whose trust you have fulfilled; and for this corpse,
    that you have so graciously given life to."
  - >
    "Is this how sons repay their fathers? You chose
    that stranger over me and supported his cause over
    the path of your forefathers. If what you found in
    him is truth, you betrayed me by concealing it; and
    if it is false, you destroyed yourself."
  - >
    "Over the past forty years, either you were a scholar
    of truth who withheld my share of your knowledge — in
    which case you cannot criticize me for seeking it
    elsewhere — or you were ignorant of the truth I have
    now learned, in which case you are even more in need
    of that stranger than I am, for you should have
    preceded me in learning from him."
  - >
    "The old man's heart was touched, his eyes overflowed
    with tears at the truth, and he too entered the path.
    Through father and son, Allah gave life to a great
    number of people in that country."
