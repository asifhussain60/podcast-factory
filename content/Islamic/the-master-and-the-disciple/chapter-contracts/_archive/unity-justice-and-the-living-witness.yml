chapter_ref: ch05-unity-justice-and-the-living-witness
slug: unity-justice-and-the-living-witness
source_type: book-chapter
book_slug: the-master-and-the-disciple
source_chapter_ref: 3
section_index: null
episode_number: 5
title: Unity, Justice, and the Living Witness
audience: >
  Thoughtful adult readers who have followed *episodes one
  through four* of *Kitāb al-ʿĀlim wa al-Ghulām* — *The Book
  of the Master and the Disciple* — through the covenant of
  allegiance, the architecture of creation, the *ẓāhir /
  bāṭin / bāṭin al-bāṭin* doctrine, the seven-day rebirth,
  the esoteric *Ṭawāf* (ta-WAAF), the conversion of
  *al-Bakhtarī* (al-bakh-ta-REE), and the cup-emptying of
  *Abu Malik* (a-BOO MAA-lik) — *Kaʿb al-Aḥbār* (KAB
  al-ah-BAAR) — to the point where *sharīʿa* (sha-REE-ah)
  has been conceded as corrupted and religion has been
  described as *the rope extending from the heavens to the
  earth*. Episode five is the climax. *Ṣāliḥ* (SAA-lih)
  walks Abu Malik through the demolition of the false unity
  that mistakes the four letters of *Allāh* (al-LAH) for
  the One they point toward; through the formal syllogism
  of divine justice that derives the necessity of a living
  *Ḥujja* (HUJ-jah) in every age from the bare meaning of
  *Allah is just*; through the conspiracy formula — *a
  rebellious devil, a willing oppressor, and a hypocritical
  religious scholar* — by which every dominant community
  has cut itself off from the chain it inherited; through
  the refutation of the *fatra* (FAT-rah) by the recitation
  of the names that fill it; through the typology of the
  witnesses' concealment that shifts the moral weight onto
  the third category, *the sympathetic abandoners*; and
  through a path of return whose two clauses — *help the
  friends, abandon the enemies* — invert the two failures.
  Abu Malik repents. The seal of the work is that *this was
  not a fictitious story* but a *daʿwa* (DAH-wa) model the
  reader is invited to walk: scholar finds disciple,
  disciple meets Sheikh and Imam, disciple returns home and
  converts father, father and son convert the greatest
  scholar of the opposing community, scholar returns to his
  people and converts a great many.
angle: faithful_exposition
episode_format: debate
host_dynamic: advocate + arbiter
host_dynamic_custom: null
debate:
  proposition: >
    A living *Ḥujja* — a just intermediary appointed by
    Allah — must exist in every age, and the apparent
    absence of such a witness in the present time is
    concealment under persecution, not cessation; the
    community itself, through its sympathetic abandonment
    of the Friends of Allah, is the cause of the
    concealment.
  advocate_a: >
    *Ṣāliḥ*, the new master, voices the source's case for
    the unbroken chain — the demolition of name-and-
    adjective theology, the syllogism of divine justice
    that requires a living *Ḥujja* in every age, the
    conspiracy formula that explains the closure of
    successive communities, the refutation of the *fatra*
    by the unbroken list of intermediary prophets, and the
    typology of concealment that locates moral
    responsibility in the sympathetic abandoners.
  advocate_b: null
  arbiter: >
    *Abu Malik* — *Kaʿb al-Aḥbār* — voices the strongest
    available scholar of the opposing community, the same
    figure introduced in episode four with striking
    fairness. He arrives prepared to defend the consensus
    that *no prophet comes after our prophet*, presses
    every standard counter-argument (the *fatra* between
    Ibrahim and Moses; the apparent absence of witnesses
    in the present time; the weight of scholarly
    consensus), receives Ṣāliḥ's answers, and at each step
    of the syllogism concedes only what the argument
    forces him to concede.
  resolution: host_b_concedes
debate_rationale: >
  Episode five is named-opposition-with-dialogue throughout.
  Ṣāliḥ holds one position; Abu Malik holds the opposing
  position; both voices are present from the opening line
  to the close. Abu Malik concedes by the end — turning to
  Allah in repentance — but the chapter's spine is the
  contest, not the conclusion. The challenger Category P2
  resolution enums explicitly accept the concession arc:
  `host_b_concedes`. The chapter must not be downgraded to
  deep_dive merely because the foil consents at the close.
format_rationale: >
  The opposing party is named (*Abu Malik* / *Kaʿb
  al-Aḥbār*, the same scholar set up with fairness in
  episode four). The proposition under contest is the
  necessity of a living *Ḥujja* in every age. The
  resolution that matches the chapter's outcome is
  `host_b_concedes` — Abu Malik repents at the close after
  Ṣāliḥ's syllogism, conspiracy-formula diagnosis, *fatra*
  refutation, and concealment typology have, step by step,
  removed his ground. The contest is the chapter's spine;
  the concession is the seal.
essential: core
essential_rationale: >
  The book's *daʿwa* arc terminates here: the syllogism
  that derives the chain from divine justice, the
  conspiracy diagnosis that explains why communities deny
  it, the concealment doctrine that explains why the
  witnesses are hidden in the present, and the model that
  re-offers the whole narrative as a journey the listener
  is invited to walk. Removing this episode breaks the
  book.
host_dynamic_rationale: >
  Two voices: advocate (Ṣāliḥ) carries the source's case
  for the chain through demolition → syllogism → conspiracy
  → *fatra* refutation → concealment typology → path of
  return; arbiter (Abu Malik) presses the opposing
  community's strongest counter-arguments, concedes step
  by step as the syllogism advances, and at the close
  turns to Allah in repentance. The arbiter's concession
  carries the resolution.
length_target: extended
key_tensions:
  - >
    The demolition of name-and-adjective theology is the
    opening move and must land as cleanly as the source
    lands it. Salih's *fire is hot* analogy — *you cannot
    cook food with the words, nor brighten darkness without
    the reality of fire* — exposes the gap between true
    sentences about Allah and the unity those sentences
    point toward. The letter-by-letter pressure on
    ⟪ar:واحد⟫ and ⟪ar:اللہ⟫ — *which of the four letters
    is* one*? which of them is* Allah*?* — is not pedantry;
    it shows that religion practiced at the level of
    letters has stopped at the threshold of the building it
    claims to inhabit. The grammatical reading — *there is
    nothing like His image* implies an image; *there is
    none like Him* refuses the analogy — must be carried
    with the source's own precision.
  - >
    The syllogism of divine justice is the backbone of the
    book's whole *daʿwa* and the spine of this episode. Set
    it out as the source does: (1) Allah cannot be
    perceived directly, neither by sight nor by hearing;
    (2) Allah is not unjust, and would not punish for
    failures of obedience to commands that could not have
    been received; (3) therefore Allah cannot impose
    obligations without a just witness to communicate them;
    (4) therefore a living *Ḥujja* must exist in every age.
    The episode must let the listener feel that the chain
    is not a doctrine added on to monotheism but what
    monotheism, taken seriously about its own justice, has
    been requiring all along.
  - >
    The hierarchy of witnesses re-states the *nāṭiq*
    (NAA-tiq) / *waṣī* (wa-SEE) architecture of episode two
    in the register of justice. The superior is
    distinguished by his knowledge of *the unseen in the
    revealed book*; the subordinate by his knowledge of
    *the unseen in its esoteric interpretation*. The
    subordinate is *subordinate* only because of his
    obedience to and need for his superior — as Allah's
    inspiration to *Lūṭ* (LOOT) came by way of *Ibrāhīm*
    (ib-raa-HEEM), and to *Ismāʿīl* (is-maa-EEL) and
    *Isḥāq* (is-HAAK), while the blessing and excellence
    were assigned to Ibrahim. The episode must let this
    structure land without flattening: equal in reward,
    ranked in function.
  - >
    The conspiracy formula — *a rebellious devil, a willing
    oppressor, and a hypocritical religious scholar* — is
    the chapter's sociological centerpiece. Each role is
    distinct and necessary; together they cut off *the
    outward traces of prophecy from its living reality so
    they could exploit those traces as a commodity*. The
    walk across the four communities (the Zoroastrians and
    Zoroaster; the people of the Torah and *Mūsā*
    (MOO-saa, peace be upon him); the people of the Gospels
    and *ʿĪsā* (EE-saa, peace be upon him); and *now your
    community*) shows the same closure producing the same
    corruption — *they inherited the book from those
    unworthy of it, followed the seductions of their
    leaders, established prayers at the wrong times, and
    paid alms to the undeserving*. The genius of the
    formula, as the episode must land it, is that the
    community is taught to *love* its own captivity:
    denying the chain is presented as fidelity to the
    prophet.
  - >
    The refutation of the *fatra* is by enumeration, not by
    argument. Walk the chain as the source walks it:
    *Ismāʿīl, Isḥāq, Yaʿqūb* (YAA-koob), *Yūnus* (YOO-nus),
    *Shuʿayb* (SHU-ayb) leading to Moses; then *Yūshaʿ ibn
    Nūn* (YOO-shah ibn NOON), *Ilyās* (il-YAAS), *Dāwūd*
    (DAA-wood), *Sulaymān* (su-lay-MAAN), *Ṭālūt*
    (TAA-loot), *Zakariyyā* (za-ka-RIY-yaa), and *Yaḥyā*
    (YAH-yaa) leading to Jesus. Then read Q 5:19 — ⟪ar:
    يَٓأَهْلَ ٱلْكِتَبِ قَدْ جَآءَكُمْ رَسُولُنَا
    يُبَيِّنُ لَكُمْ عَلَىٰ فَتْرَةٍۢ مِّنَ ٱلرُّسُلِ⟫ —
    *O People of the Scripture, there has come to you Our
    Messenger to make clear to you after a* fatra *of
    messengers* — the source's way: *the* interval *refers
    to the public manifestation of the divine call after a
    period of fear, when they were calling people to Allah
    in secret. The earth is never without a just witness
    from Allah for the blink of an eye — either publicly
    and openly, or in fear and concealment.*
  - >
    The typology of concealment is the moral crux. The
    three categories — *the relentless murderer, the
    deep-seated enemy, and those who dislike the enemies'
    actions and are sympathetic to the friends of Allah
    even though they abandon them* — together account for
    the witnesses' hiddenness. The third category carries
    the moral weight, because *it is because of this third
    category that the friends of Allah have concealed
    themselves from you*. The episode must let this land
    on the sympathetic listener — the concealment is not
    done *to* the community by its enemies alone; it is
    done *because of* the community's own failure to be
    the kind of witness *to* the witness that the
    witness's safety in the open would require. The
    consequence is also stated: *if you were all to help
    the friends of Allah, they would reveal themselves;
    and if you were to abandon their enemies, they would
    not be victorious.* The repair is in the community's
    hands.
  - >
    The closing must seal the work as a *model* — *not a
    fictitious story, but rather the confirmation of what
    Allah has commanded*. The arc is replicable: the
    scholar finds the disciple; the disciple meets the
    Sheikh and meets the Imam; he returns home and
    converts his father; father and son convert *Abu
    Malik* — *Kaʿb al-Aḥbār*; *Abu Malik* and his group
    return to their people and *through them Allah guided
    a great many of His servants to His religion*. Each
    phase is a stage in the listener's own potential
    journey. Do not flatten this into a moral. Carry it as
    the seal it is.
tone_constraints:
  - >
    Walk the source in its own order. Demolition of names
    → letter-by-letter pressure on ⟪ar:واحد⟫ and ⟪ar:اللہ⟫
    → the *fire is hot* analogy → name-or-attribute
    dialogue → the *image* vs *Him* grammatical correction
    → *my words have left me* → the four-line syllogism →
    *the very foundation of justice* → the hierarchy of
    witnesses → *the subordinate is called subordinate
    only because of his obedience* → the conspiracy formula
    → the four communities → the consensus argument turned
    back → the displacement of consensus by the Creator
    *engaged in a new work every day* → the refutation of
    the *fatra* by enumeration → Q 5:19 read as concealment
    → the example of *Mūsā* fleeing to *Madyan* → the
    typology of the three categories → *the sympathetic
    abandoners* as the cause of concealment → the
    complicity of scholars who serve oppressors → the three
    Qurʾanic verses → the path of return → Abu Malik's
    repentance → Ṣāliḥ's tears → the consultation with the
    Sheikh and the test-by-withdrawal → the propagation of
    the chain through Abu Malik to his community → the
    seal of the work as a *model* → the closing doxology
    and ⟪ar:ولا حول ولا قوۃ الا باللہ العلی العظیم⟫.
  - >
    Arabic terms keep their phonetic guide at first
    per-episode appearance, per R-PRONUNCIATION-IMPERATIVE:
    *Ṣāliḥ* (SAA-lih), *Abu Malik* (a-BOO MAA-lik), *Kaʿb
    al-Aḥbār* (KAB al-ah-BAAR), *Allāh* (al-LAH), *Ḥujja*
    (HUJ-jah), *fatra* (FAT-rah), *daʿwa* (DAH-wa),
    *wuḍūʾ* (wu-DOO), *rukūʿ* (ru-KOO), *sajda* (SAJ-dah),
    *alif* (ah-LIF), *wāḥid* (WAA-hid), *tawḥīd*
    (taw-HEED), *nāṭiq* (NAA-tiq), *waṣī* (wa-SEE), *Lūṭ*
    (LOOT), *Ibrāhīm* (ib-raa-HEEM), *Ismāʿīl* (is-maa-
    EEL), *Isḥāq* (is-HAAK), *Mūsā* (MOO-saa), *ʿĪsā*
    (EE-saa), *Yaʿqūb* (YAA-koob), *Yūnus* (YOO-nus),
    *Shuʿayb* (SHU-ayb), *Yūshaʿ ibn Nūn* (YOO-shah ibn
    NOON), *Ilyās* (il-YAAS), *Dāwūd* (DAA-wood),
    *Sulaymān* (su-lay-MAAN), *Ṭālūt* (TAA-loot),
    *Zakariyyā* (za-ka-RIY-yaa), *Yaḥyā* (YAH-yaa),
    *Firʿawn* (fir-AHN), *Madyan* (MAD-yan), *fatwā*
    (FAT-wah), *sharīʿa* (sha-REE-ah). Carry each guide
    ONCE per episode, never doubled. Source-preface terms
    *Ṭawāf* (ta-WAAF) and *al-Bakhtarī* (al-bakh-ta-REE)
    appear in the recap preface and keep their guide
    there.
  - >
    Honorifics: the Prophet ﷺ first per-episode mention is
    *Salallahu alayhi wa aalihee wa sallam*, contracted to
    ﷺ thereafter, per R-HONORIFIC-ONCE. The seven *nāṭiqs*
    invoked by name (*Mūsā*, *ʿĪsā*, *Ibrāhīm*, *Lūṭ*,
    *Ismāʿīl*, *Isḥāq*, etc.) take *(peace be upon him)*
    on first mention only. Do NOT pair any leadership-
    title with the personal name of the Father of Imams
    anywhere — always *Father of Imams* if the title is
    needed; the doctrinal scanner is substring-only and
    will flag the literal forbidden phrase even inside
    guards.
  - >
    Verbatim quotation discipline. Every Arabic block from
    the source — the script ⟪ar:واحد⟫ and ⟪ar:اللہ⟫ in
    the letter pressure; the Q 5:19 verse on the *fatra*;
    the three Qurʾanic verses Ṣāliḥ marshals against
    complicit scholars (Q 11:113 *wa-lā tarkanū ilā
    alladhīna ẓalamū*, Q 4:59 *aṭīʿū Allāha wa-aṭīʿū
    al-rasūla wa-ulī al-amri minkum*, Q 9:123 *qātilū
    alladhīna yalūnakum min al-kuffāri*); the closing
    ⟪ar:ولا حول ولا قوۃ الا باللہ العلی العظیم⟫ — stays
    verbatim with plain English translation immediately
    following. Do not paraphrase a verbatim block; do not
    strip the Arabic.
  - >
    The conspiracy formula walk requires special care. Name
    the three types — *rebellious devil, willing oppressor,
    hypocritical religious scholar* — and explain the
    mechanism by which they convert *no prophet after our
    prophet* into the form of the believer's devotion.
    Walk the four communities in the source's own order
    (Zoroaster, Moses, Jesus, *and now your community*).
    Then turn the consensus argument back on the
    opposing community: *they preceded you; you confirm
    them; none of them confirm you*. Then displace
    consensus altogether by the Creator *engaged in a new
    work every day*. The two-step move — internal critique
    then displacement — must both land; they undo
    different versions of the same error.
  - >
    The concealment typology must locate the moral weight
    correctly. The first two categories — the murderer and
    the deep-seated enemy — are the active enemies. The
    third category — *those who dislike the enemies'
    actions and are sympathetic to the friends of Allah,
    even though they abandon them* — is the cause of
    concealment. Let the sympathetic listener feel the
    accusation lands on him, not on the murderer. The
    consequence — *if you were all to help the friends of
    Allah, they would reveal themselves; and if you were
    to abandon their enemies, they would not be
    victorious* — is the inversion that the path of return
    rests on.
  - >
    End on the seal of the work as a *model*. The
    consultation with the Sheikh and the test-by-
    withdrawal — *if you recognize good in them, guide
    them as you were guided; but if you are apprehensive,
    test them by ignoring them — not harshly* — is the
    *daʿī*'s discrimination of seekers. The propagation
    arc — scholar finds disciple, disciple meets Sheikh
    and Imam, returns home and converts father, father and
    son convert *Abu Malik*, *Abu Malik* returns and
    converts a great many — is the chain extending forward
    by the same one-to-one transmission that started the
    book. The closing line — *this was not a fictitious
    story, but rather the confirmation of what Allah has
    commanded* — is the seal. Carry it as a seal, not a
    moral.
anchor_passages:
  - >
    "The *fire is hot* analogy: *those are only names and
    descriptions, of no benefit without their essential
    realities. It is like saying* fire is hot *— true, but
    you cannot cook food with the words, nor brighten
    darkness without the reality of fire. If nouns and
    adjectives could take the place of realities, your
    tongue would burn at the mere mention of fire, and
    your hunger would be satiated at the mention of
    food.*"
  - >
    "The letter pressure: *you say Allah is one,* ⟪ar:
    واحد⟫, *written with four letters — two joined and two
    separate. Which is* one*? And the word* ⟪ar:اللہ⟫
    *is also written with four letters — which of them is*
    Allah*? Are they Allah together, or are they signs
    pointing to Allah?* And: *when you say* Allāh*, you
    separate the initial* alif *and join the remaining
    three — which of these points to Him?*"
  - >
    "The grammatical correction: *your saying* there is
    nothing like His image *implies He has an image —
    whereas if you truly meant absolute unity, you would
    have said* there is none like Him*. He is far exalted
    beyond your implicit analogy. Eyes cannot tolerate the
    light of the sun, which is only one of this lower
    world's lights — so how can they perceive the
    Creator?*"
  - >
    "The four-line syllogism: (1) *can the One of
    unimaginable immensity be perceived by our vision? —
    no, He is far above that*; (2) *can we hear His
    speech? — no, for speech comes from a speaker
    described by his speech, and Allah is beyond such
    attributes*; (3) *would this All-Embracing, Exalted
    One be unjust to His creatures — imposing what they
    cannot bear, commanding what they cannot perceive,
    then punishing them? — anyone who imposes such an
    impossible obligation cannot be just*; (4) *therefore
    such knowledge could not be perceived except through
    intermediaries between Him and His creatures; their
    existence is His act of justice, for and against His
    creation.*"
  - >
    "The hierarchy of witnesses: *they have ranks, one
    subordinate to another, yet all equal in reward. Just
    as the superior messenger is distinguished by his
    knowledge of the unseen in the revealed book, the
    subordinate — the* waṣī *— is distinguished by his
    knowledge of the unseen in his esoteric interpretation
    of the book; for both the revealed word and its
    interpretation come from Allah through revealed
    inspiration. The subordinate is called subordinate
    only because of his obedience to, and need for, his
    superior — as Allah's inspiration to Lūṭ came by means
    of Ibrāhīm.*"
  - >
    "The conspiracy formula: *every period has started
    with three types — a rebellious devil, a willing
    oppressor, and a hypocritical religious scholar. By
    propagating* no prophet after our prophet *these three
    cut off the outward traces of prophecy from its living
    reality so they could exploit those traces as a
    commodity. They insinuated into their communities that
    no one superior to their own prophet would ever come
    — so the people abandoned seeking true religion
    without even realizing it, became attached to their
    own prophet while denying those who followed, and even
    imagined this denial drew them closer to him.*"
  - >
    "The walk across the four communities: *the
    Zoroastrians cling to their fire-temples, declaring
    that Allah will never send a messenger after
    Zoroaster; the community of the Torah tend to their
    calf and submit to their judges, declaring that Allah
    will never send a messenger after Moses; the community
    of the Gospels venerate their priests and worship
    their prophet as God, declaring that Allah will never
    send a messenger after Jesus; and now your community
    has followed in the ways of those who preceded them.*"
  - >
    "The consensus argument turned back: *if we must
    acknowledge this community on the basis of its
    consensus that Allah has cut off His proofs, then the
    earlier communities are even more deserving of
    acknowledgment, on three points: they preceded you in
    adhering to Allah's religion; you confirm the truth of
    what their prophets brought, but they confirmed it
    before you; and you all attest that they followed the
    true messengers, while none of them attest to your
    prophet.* And the displacement: *if the Creator is the
    One who judges wisely, abrogating and confirming as He
    wills, then everything these groups say collapses; for
    He has more right to create and command, and is
    engaged in a new work every day.*"
  - >
    "The refutation of the *fatra*: *what* interval *was
    there after the community of Ibrahim, when Allah sent
    after him Ismāʿīl, Isḥāq, Yaʿqūb, Yūnus, Shuʿayb
    leading to Moses? And what* interval *was there after
    Moses, before the Gospel, since after Moses Allah sent
    Yūshaʿ ibn Nūn, Ilyās, Dāwūd, Sulaymān, Ṭālūt,
    Zakariyyā and Yaḥyā, leading up to ʿĪsā?* And the
    re-reading of Q 5:19: *the* interval *refers to the
    public manifestation of the divine call after a period
    of fear, when they were calling people to Allah in
    secret. The earth is never without a just witness from
    Allah for the blink of an eye — either publicly and
    openly, or in fear and concealment.*"
  - >
    "The typology of the witnesses' concealment: *there is
    the relentless murderer, who never tires of hunting
    them down; their deep-seated enemy, who bites his
    nails in rage and never forgets his hatred; and
    finally, those who dislike the enemies' actions and
    are sympathetic to the friends of Allah, even though
    they abandon them — who have no spiritual insight
    regarding faith, and cannot be relied upon to protect
    the secret of the imams. It is because of this third
    category that the friends of Allah have concealed
    themselves from you.*"
  - >
    "The complicity of complicit scholars: *those who
    blacken a flag or fill an inkwell for the murderers of
    Allah's witnesses share in the bloodshed. Indeed, the
    legal scholar who passes opinions enabling the
    oppressors is worse than the murderer, for were it not
    for the opinions of these legal scholars, the
    oppressors could not maintain their dominion over the
    foolish.*"
  - >
    "The path of return: *if you were all to help the
    friends of Allah, they would reveal themselves; and if
    you were to abandon their enemies, they would not be
    victorious.* And the answer to Abu Malik's *how do I
    find salvation?*: *with Allah. Seek protection with
    Him and He will give you refuge; turn to Him in
    repentance and He will accept it; ask Him for the path
    of His friends and He will rescue you through your
    own righteous actions. For Allah does not do an atom's
    weight of wrong, and does not hasten to punish even
    those who hasten to disobey Him. He loves those who
    turn to Him in repentance.*"
  - >
    "The seal: *this was not a fictitious story, but
    rather the confirmation of what Allah has commanded.
    For in it is the confirmation of the divine
    messengers, the signs of their trustees, and the
    proper behavior of those who are seeking.* The book is
    read as a *model* — a replicable *daʿwa* arc from
    individual conversion to community-building: the
    scholar finds the disciple; the disciple meets the
    Sheikh and the Imam; he returns home and converts his
    father; father and son convert Abu Malik; Abu Malik
    and his group convert their community."
adaptation_mode: faithful
phonetic_overrides: {}
show_notes:
  blurb: >
    Episode five of *The Master and the Disciple* is the
    book's climax. *Ṣāliḥ* and *Abu Malik* — the new
    master and the greatest scholar of the opposing
    community — sit facing one another after the cup-
    emptying of episode four. *Ṣāliḥ* opens with the
    demolition of name-and-adjective theology: the four
    letters of ⟪ar:واحد⟫ and ⟪ar:اللہ⟫ are pressed letter
    by letter until Abu Malik concedes that the letters
    can only be *signs pointing to Allah* and confesses
    *my words have left me*. He then walks Abu Malik
    through the four-line syllogism of divine justice that
    derives the necessity of a living *Ḥujja* in every age
    from the bare meaning of *Allah is just*. The
    hierarchy of witnesses — the superior *nāṭiq* who
    knows the unseen of the revealed book, the
    subordinate *waṣī* who knows the unseen of its
    esoteric interpretation — is re-stated in the register
    of justice rather than cosmology. Then the diagnosis:
    *every period has started with three types — a
    rebellious devil, a willing oppressor, and a
    hypocritical religious scholar*. The conspiracy
    formula is walked across the four communities
    (Zoroastrian, of the Torah, of the Gospels, of the
    present community), each declaring *no messenger after
    our messenger*. *Ṣāliḥ* turns the consensus argument
    back upon those who wield it, then displaces it
    altogether by the Creator *engaged in a new work
    every day*. He refutes the *fatra* by enumerating the
    chain (*Ismāʿīl, Isḥāq, Yaʿqūb, Yūnus, Shuʿayb*
    leading to Moses; *Yūshaʿ ibn Nūn, Ilyās, Dāwūd,
    Sulaymān, Ṭālūt, Zakariyyā, Yaḥyā* leading to Jesus)
    and re-reads Q 5:19: the *fatra* refers to *the
    public manifestation of the divine call after a period
    of fear*, not the cessation of witnesses. The
    typology of concealment locates the moral weight on
    the third category — *those who dislike the enemies'
    actions and are sympathetic to the friends of Allah,
    even though they abandon them*; the witnesses are
    concealed because of *us*. The complicit scholars who
    *blacken a flag or fill an inkwell* are named as
    worse than the murderers. Q 11:113, Q 4:59, and Q
    9:123 describe the inversion the community has
    accepted. The path of return is the inverse of the
    two failures: *if you were all to help the friends of
    Allah, they would reveal themselves; and if you were
    to abandon their enemies, they would not be
    victorious*. Abu Malik turns to Allah in repentance;
    Ṣāliḥ's eyes fill with tears. The Sheikh's
    consultation, the test-by-withdrawal, the propagation
    of the chain through Abu Malik to his community —
    *and through them Allah guided a great many of His
    servants to His religion* — and the seal of the work
    as a *model*, *not a fictitious story*. The closing
    doxology and ⟪ar:ولا حول ولا قوۃ الا باللہ العلی
    العظیم⟫ — *and there is no strategy and no strength
    except through Allah, the Exalted, the Powerful*.
