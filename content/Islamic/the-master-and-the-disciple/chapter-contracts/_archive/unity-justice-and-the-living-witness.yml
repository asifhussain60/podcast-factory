thesis_relevance: >
  This episode is the climactic discharge of the book's
  central claim: true spiritual knowledge reaches creation
  only through an unbroken chain of chosen intermediaries.
  The four-line syllogism of divine justice derives the
  living *Ḥujja* from the bare meaning of *Allah is just*;
  the conspiracy formula explains why every dominant
  community has cut itself off from the chain; the
  refutation of the *fatra* by enumeration of the names
  restores the chain in fact; the typology of concealment
  locates moral responsibility for the witnesses'
  hiddenness in *us*; and the seal of the work as a
  replicable *daʿwa* arc re-offers the whole book as a
  journey the listener is invited to walk — scholar finds
  disciple, disciple meets Sheikh and Imam, returns home
  and converts father, father and son convert the
  greatest scholar of the opposing community, the scholar
  returns to his people and Allah guides through him a
  great many of His servants. The chain that episode one
  began to summon is now shown, by argument from justice
  alone, to be necessary; shown by enumeration to be
  unbroken; and shown by the closing model to be
  propagating through the listener.
