key_tensions:
  - >
    The whole opening turns on a single anxiety: how do you know your
    source? The disciples confess they are *obligated* to express
    gratitude in three ways at once — for the call (*daʿwa*,
    DAH-wa), for the knowledge (*ʿilm*), and for the practice (*ʿamal*) —
    and the Master answers that the only honest gratitude for each is
    a different *deed*: obedience for the call, action for the
    knowledge, perseverance for the practice. Behind the deed-language
    is a stake the chapter never lets the listener lose: praising the
    doctor will not cure you; what cures you is doing what he
    prescribes, consistently, for the prescribed duration. *Adab*
    (AH-dab) and *shukr* (SHUKR) are not ornament — they are the force
    that opposes desire, the disposition that structures every act of
    worship as a form of self-surrender. The episode must keep the
    pressure on this point through every later move: the boy's
    *ādāb* (aa-DAAB) of asking, the Master's etiquette of teaching,
    the five conditions of secrecy, the covenant itself.
  - >
    The chapter's middle move is a doctrine of *discernment* — the
    scholar did NOT just share his knowledge with anyone. Knowledge
    that lands in the wrong heart is not merely wasted; it can have an
    adverse effect. The scholar travels across the Arab and non-Arab
    lands scrutinizing faces for spiritual aptitude, posing religious
    questions, finding no response, until he reaches the far edge of
    *al-Jazīra* and then sits *out of sight*, listening, before
    speaking a word. The episode must show why the same care is
    required of every transmitter who comes after him — the chain of
    transmission is graded by capacity to bear, not by enthusiasm to
    receive — and why the boy himself was chosen the way he was: not
    by what he said first, but by what he listened to before he spoke.
  - >
    The design-of-creation sermon names *ẓāhir* and *bāṭin* not as a
    hermeneutical layer in a text but as a deliberate cosmic design
    principle. Allah took all the spiritual realities and HID them in
    the shell of the exterior — sky, earth, sun, moon, stars, seasons,
    winds, oceans, rivers — *therefore immortalizing them*. People
    will come and go, generations and entire nations will come and
    go, but these outer and inner realities will live forever. The
    chosen ones — *the truly pious, the guardians, the protectors,
    the generous and the recorders* — are the ones to unveil these
    realities; none of us can decipher the codes without them. The
    episode must let this turn carry its weight: the *ẓāhir / bāṭin*
    distinction is the mechanism by which Allah preserves a knowledge
    He has *hidden by making it inward, protected by keeping it
    secret, veiled by His obligations, and crowned by His covenants*.
  - >
    The covenant of allegiance — the *ʿahd Allāh* — is the chapter's
    structural climax and the book's load-bearing doctrine. The Master
    states it as a key that renders religion either sacred or profane,
    *like the difference between marriage and fornication*. The same
    act under the formality of *nikāḥ* is *ḥalāl* (ha-LAAL); the same
    act without it is *ḥarām* (ha-RAAM). The same animal is *ḥalāl*
    only by the *dhabīḥa* — by blessing with Allah's name. So the same
    religious practice is sacred or stolen depending on the covenant
    that frames it. The episode must let the *walāyah*-as-covenant
    doctrine land with its full weight: accepting the Imam's *walāyah*
    is like paying the owner his due; using the knowledge without the
    *walāyah* is theft — and stolen food is *ḥarām* regardless of how
    *ḥalāl* the animal is. The fifth Imam, Jaʿfar al-Ṣādiq, is named
    here as the source of the apple-and-charity teaching that locks
    the doctrine in: a stolen apple given to charity earns sins, not
    rewards, because the *ḥarām* has been propagated to another.
  - >
    The five conditions the Master imposes on the disciple are not
    pedagogical fussiness — they are protocols of survival. The boy is
    the son of a great *shaykh*, a leader of his tribe and one of the
    most devoted supporters of a rival community that has rejected the
    Imam. Premature disclosure of the *daʿwa* could destroy the
    mission. The Master instructs him NOT to move away from his
    father — that would invite suspicion — but to stay, respect him,
    please him where possible, while protecting his innermost beliefs
    and keeping his spiritual concerns secret. *Indeed Allah will
    protect you from his, and other people's, hostility.* The
    episode must keep the political stake visible without
    sensationalizing it: this is a covenant taken in *taqiyya*
    (ta-KEE-yah) conditions, and that fact shapes everything that
    will follow in the dialogue.
tone_constraints:
  - >
    Walk the source in its own order. The three thanks open; the
    three-stage path *balwā → hudā → taqwā* answers; the story of the
    Persian scholar moves from his thirst and his mirages to his
    finding-and-being-found by a teacher; the search for a disciple
    runs through the Arab and non-Arab lands to the far edge of
    *al-Jazīra*; the test of speech (commendable vs reprehensible) is
    answered with *I have no words of my own, for I am following the
    words of another*; the design-of-creation sermon follows; the
    etiquette of seeking opens onto hearing, sight, and heart and the
    Qurʾanic verses that name those three together; the boy's request
    to be raised and educated is answered with the conditions of how
    knowledge is acquired; the five conditions are imposed; the
    covenant is taken. Do not collapse the arc into a thesis. The
    *accumulation* — comportment, then call, then discernment, then
    instrument, then covenant — is the chapter's argumentative force.
  - >
    Hearing, sight, and heart (*al-samʿ wa al-abṣār wa al-afʾida*) are
    named in four Qurʾanic verses the source quotes verbatim — *al-Mulk*
    67:23, *al-Naḥl* 16:108, *al-Baqara* 2:7, *al-Isrāʾ* 17:36. Render
    each with attribution and translation, in the order the source
    gives them. The verses are not ornament — they are the source's
    proof that the instrument by which the listener will receive THIS
    teaching is the same instrument by which Allah's argument was
    completed against those who failed to use it.
  - >
    Arabic terms keep their phonetic guide at first per-episode
    appearance, per R-PRONUNCIATION-IMPERATIVE: *shukr* (SHUKR),
    *adab* (AH-dab), *ʿabd* (ABD), *daʿwa* (DAH-wa), *balwā*
    (BAL-wah), *hudā* (hu-DAH), *taqwā* (tak-WAH), *dhikr Allāh*
    (DHIKR al-LAH), *ʿilm* (ILM), *ʿamal* (AH-mal), *ṣabr* (SABR),
    *Sīnāʾ* (SEE-nigh), *Bayt al-Maʿmūr* (bait al-ma'a-moor), *Ḥaram*
    (HA-ram), *al-Jazīra* (al-ja-zee-rah), *ḥujja* (HUDJ-ja),
    *milla* (MIL-la), *ẓāhir* (ZAA-hir), *bāṭin* (BAA-tin), *nūr*
    (NOOR), *āyāt* (aa-YAAT), *sharīʿa* (sha-REE-ah), *sunna*
    (SOON-na), *taʾwīl* (tah-WEEL), *ḥaqāʾiq* (ha-KAA-ik), *ḥalāl*
    (ha-LAAL), *ḥarām* (ha-RAAM), *nikāḥ* (ni-KAAH), *dhabīḥa*
    (dha-BEE-ha), *ʿahd Allāh* (AHD al-LAH), *ʿahd sharīf* (AHD
    sha-REEF), *walāyah* (wa-LAA-yah), *Ḥizb Allāh* (HIZB
    al-LAH), *taqiyya* (ta-KEE-yah). Carry the guide ONCE per
    episode, never doubled.
  - >
    The Prophet ﷺ honorific is spelled out on first per-episode
    mention as *Salallahu alayhi wa aalihee wa sallam* and is then
    contracted to ﷺ thereafter, per R-HONORIFIC-ONCE. The fifth
    Imam, Jaʿfar al-Ṣādiq (peace be upon him), is named once when the
    apple-and-charity teaching is introduced; the honorific (peace be
    upon him) follows on first mention only. Do NOT pair any
    leadership-title with the personal name of the Father of Imams
    anywhere in the prose; refer to him only as Father of Imams or
    Amīr al-Muʾminīn if he is named at all (the source for episode 1
    does not name him).
  - >
    Verbatim quotation discipline: every Arabic block from the
    source — the four-stage formula *fa-jaʿala li-kulli awwalin minhu
    ākhar…*; *wa awwaluhā balwā, wa awsaṭuhā hudā, wa ākhiruhā
    taqwā*; *ḥattā idhā hawā min al-malaʾ al-aʿlā…*; *thumma kharaqa
    al-ḥijāb…*; *wa anna al-ākhira amruhu fī al-ḥukmi mithl
    al-awwal*; *inna al-ṭāliba li al-shayʾi awshaka an yalqāhu*; *fa
    lā tanāluhu himam al-mutafakkirīn, wa lā tabluġuhu fikr
    al-muḥtālīn*; *al-ʿilm lā yantafiʿ bihi ḥattā yustaʿmal, wa
    al-ʿamal lā yantafiʿ bihi ḥattā yuqbal*; the Prophetic ﷺ saying
    *inna afḍala al-ḥasanāti aḥyā al-amwāt*; and *Sit before your
    food like a slave sits before its master* — stay verbatim with
    plain English translation immediately following. Do not paraphrase
    a verbatim block; do not strip the Arabic.
  - >
    End on the night of the oath, *ʿahd sharīf*, the boy's eyes
    streaming with tears, his certainty that from that moment he was a
    member of the *Ḥizb Allāh* and of the party of Allah's friends.
    Do NOT flatten the closing into a summary. The next episode
    will pick up *the architecture of creation that licenses this
    covenant* — let the closing image hold.
anchor_passages:
  - >
    "The three-thanks formulation (the disciples' opening request):
    *shukruka fīmā daʿawtanā ilayhi — our gratitude for your having
    called us to the true religion; wa shukru al-ʿilmi alladhī
    dalaltanā ʿalayhi — our gratitude for the knowledge you pointed
    us towards; wa shukru al-ʿamali alladhī amartanā bihi — our
    gratitude for the religious practices you commanded us to
    perform.*"
  - >
    "The four-stage formula (the Master's first answer): *fa-jaʿala
    li-kulli awwalin minhu ākhar, wa li-kulli ākhirin minhu ġhāya, wa
    li-kulli ġhāyatin nihāya, lā yabluġu amadahā* — *for every
    beginning He has placed an end, and for every end He designed a
    goal, and each goal has a limit whose full extent cannot be
    attained.* These are the way-stations of the people of true
    understanding; the key to success is the constant remembrance of
    Allah."
  - >
    "The three-stage path: *wa awwaluhā balwā, wa awsaṭuhā hudā, wa
    ākhiruhā taqwā* — *their initial level is trial; their middle
    state is right guidance; and their final stage is piety.*"
  - >
    "The Prophet ﷺ on food and *adab*: *Sit before your food like a
    slave sits before its master.* Honor the sustenance by covering
    the head, by using the right hand — because without that food we
    would be reduced to animals."
  - >
    "The proverb the Persian scholar carried as the rank of soul to
    his body: *inna afḍala al-ḥasanāti aḥyā al-amwāt* — *the most
    excellent of deeds is giving life to the dead*, meaning imparting
    knowledge to the ignorant, for the ignorant is like a corpse."
  - >
    "The descent of the divine trust: *ḥattā idhā hawā min al-malaʾ
    al-aʿlā ilā al-khalāʾiqi min ahli al-dunyā — until it descended
    from the heavenly host to the creatures of this lower world.
    thumma kharaqa al-ḥijāba wa tadāfaʿathu al-abwābu ilā an waṣala
    ilayya — then it ripped through the veil and passed through the
    intermediaries until it reached me. Was I to be its final goal
    and ultimate end? No — those who transmitted it before me are
    more deserving of precedence; their precedence does not relieve
    me from having to act: wa anna al-ākhira amruhu fī al-ḥukmi
    mithl al-awwal — my final duty is similar to my initial duty.*"
  - >
    "The discernment-doctrine on the seeker: *inna al-ṭāliba li
    al-shayʾi awshaka an yalqāhu — indeed the person who is already
    searching for something is much closer to finding it.*"
  - >
    "The design-of-creation sermon (excerpt): *He honored His
    knowledge by hiding it and making it inward, protected it by
    keeping it secret, veiled it with His obligations, and crowned it
    with His covenants. fa lā tanāluhu himam al-mutafakkirīn, wa lā
    tabluġuhu fikr al-muḥtālīn — it cannot be reached by the
    aspirations of those who rely on the strength of their
    intellects, nor attained by those scheming for it.*"
  - >
    "The Qurʾanic triad of hearing, sight, and heart — quoted in the
    source from four verses: *Q 67:23 (al-Mulk) — Say: it is He Who
    has created you, and endowed you with hearing, sight, and hearts.
    Very few of you are grateful for these gifts. Q 16:108 (al-Naḥl) —
    They are those upon whose hearts, hearing and sight Allah has set
    a seal; and they are the heedless. Q 2:7 (al-Baqara) — Allah has
    set a seal on their hearts and on their hearings, and on their
    eyes there is a covering; theirs will be a great torment. Q 17:36
    (al-Isrāʾ) — Indeed the hearing, the sight, and the heart — of
    each of those you will be questioned.*"
  - >
    "The two-condition doctrine on knowledge and action: *al-ʿilmu lā
    yantafiʿ bihi ḥattā yustaʿmal, wa al-ʿamalu lā yantafiʿ bihi
    ḥattā yuqbal* — *knowledge is of no benefit until it is put into
    action, and action is of no benefit until it is accepted by
    Allah.* And the only thing Allah accepts is sincerity."
  - >
    "The covenant doctrine (the Master's framing): *There is a key
    to religion which renders it either sacred or profane, like the
    difference between marriage and fornication… That key is the pact
    of Allah, ʿahd Allāh, which confirms His rights, encompasses His
    obligations and safeguards His friends. It is the rope of Allah
    upon His earth and His guarantee of security among His creation.*"
  - >
    "The apple-and-charity teaching attributed in the source to Imam
    Jaʿfar al-Ṣādiq (peace be upon him): a man stole five apples,
    gave them to charity, and calculated that fifty rewards minus five
    sins left him forty-five rewards. The Imam corrected him: *When
    you stole those apples you earned five sins; and when you gave
    them to the old lady you gained another five sins, because you
    propagated the ḥarām to another.* Total: ten sins, zero rewards.
    Stolen food is *ḥarām* regardless of how *ḥalāl* the animal is."
