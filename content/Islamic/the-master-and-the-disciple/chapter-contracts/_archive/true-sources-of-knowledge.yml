show_notes:
  blurb: >
    Episode one of *The Master and the Disciple* walks the opening
    narrative arc that establishes the book's load-bearing doctrine
    of transmission. A group of *al-muʾminīn* and a group of *duʿāt
    al-dīn* approach one of their scholars to ask, all at once, how
    to express gratitude for the call, the knowledge, and the
    practice — and the Master answers that the only honest
    gratitude is a different deed in each case: obedience for the
    call, action for the knowledge, perseverance for the practice.
    He names the three-stage path of *balwā → hudā → taqwā*, names
    the constant remembrance of Allah as the tool that carries the
    seeker through them, and then narrates the story of a Persian
    seeker who, after his thirst for knowledge led him through
    mirage after mirage, was found by a teacher and made into one
    of the great scholars of *Sīnāʾ*. That scholar, in turn,
    travels across the Arab and non-Arab lands looking for a
    worthy disciple, and at the far edge of *al-Jazīra* he finds a
    group discussing religion without guidance — and chooses the
    youngest of them, best in character, his intellect complete and
    his heart awakened by reflection. The Master's
    design-of-creation sermon follows: Allah hid the spiritual
    realities in the shell of the exterior, *therefore immortalizing
    them*, and made the chosen ones the trustees of this hidden
    knowledge. The Qurʾanic instrument is named — hearing, sight,
    and heart — and the chapter answers the boy's request to be
    raised with two formulas: *knowledge is of no benefit until it
    is put into action; action is of no benefit until it is
    accepted by Allah*. The five conditions follow — *do not
    neglect what is entrusted to you, do not take it lightly, do
    not conceal it, do not come looking for him whenever you have
    a question, do not ask about anything until he himself brings it
    up, and do not mention him to your father* — and after the
    boy's period of trial, the *ʿahd sharīf* is taken. *True
    knowledge belongs to the Imam; accepting his walāyah is like
    paying the owner his due, while using the knowledge without it
    is theft.* The episode lands where the boy's tears do, on the
    night he knew with certainty he had become a member of the
    *Ḥizb Allāh*.
