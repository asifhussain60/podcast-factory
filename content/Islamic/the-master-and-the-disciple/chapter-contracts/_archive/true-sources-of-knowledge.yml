thesis_relevance: >
  This episode advances the book's central claim — that true spiritual
  knowledge reaches creation only through an unbroken chain of chosen
  intermediaries, and becomes sacred only under the covenant of
  *walāyah* to the Imam — by walking the narrative arc that *earns*
  the covenant: the three-thanks ethic of *shukr* and *adab*, the
  Persian seeker's transmission-through-suffering, the scholar's
  doctrine of discernment, the design-of-creation sermon that names
  *ẓāhir / bāṭin* as a cosmic preservation principle, the
  hearing-sight-heart instrument by which Allah's argument is
  completed, and the five conditions that culminate in the *ʿahd
  sharīf*. Everything later in the book — cosmology, hierarchy,
  Sharīʿa, *taʾwīl* — stands on this opening establishment of why
  transmission matters and why the covenant makes the difference
  between sacred and stolen.
