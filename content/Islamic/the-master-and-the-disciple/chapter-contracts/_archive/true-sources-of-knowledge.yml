title: The True Sources of Knowledge
audience: >
  Thoughtful adult readers approaching *Kitāb al-ʿĀlim wa al-Ghulām* —
  *The Book of the Master and the Disciple* — for the first time, who
  know it as the timeless story of a seeker's quest for true knowledge
  and the process through which he gradually achieved it. The book is by
  Sayyidinā Jaʿfar ibn Manṣūr al-Yaman (sai-yi-DEE-nah Jaʿa-far ibn
  al-man-SOOR al-Ya-man), a very high-ranking *dāʿī* (daa-ee) and a
  *bāb al-abwāb* — a master of *taʾwīl* (tah-WEEL), esoteric
  interpretation — who guides the reader to the path of the friends of
  Allah (al-LAH), the chosen people who possess the spiritual knowledge
  that makes them spiritually eternal. Episode one walks the opening
  narrative arc that establishes WHY this knowledge must be transmitted
  through a chain of intermediaries at all. A nameless group of the
  faithful and a group of *duʿāt al-dīn* (dua'at ad-deen) approach one
  of their scholars to ask three things at once: how to express
  gratitude for the call, the knowledge, and the practice. The Master
  answers with the three-stage spiritual path — *balwā* (BAL-wah) →
  *hudā* (hu-DAH) → *taqwā* (tak-WAH) — and then narrates the story of
  a Persian seeker who, after his thirst for knowledge led him through
  mirage after mirage, was found by a teacher and made into one of the
  great scholars of *Sīnāʾ* (SEE-nigh); how that scholar, hearing his
  own master repeat *the most excellent of deeds is giving life to the
  dead*, set out across Arab and non-Arab lands looking for a worthy
  disciple; how at the far reaches of *al-Jazīra* (al-ja-zee-rah) he
  found a group of seekers discussing religion without guidance; how
  the youngest of them — best in character, his intellect complete and
  his heart awakened by reflection — followed him to his inn; how the
  Master delivered the great glorification of Allah, the
  design-of-creation sermon that names *ẓāhir* (ZAA-hir) and *bāṭin*
  (BAA-tin) as a cosmic preservation principle rather than a textual
  trick; how the etiquette of seeking knowledge maps onto the
  Qurʾanic triad of hearing, sight, and heart; and how, after the boy's
  period of trial, the Master imposed five conditions and took the
  *ʿahd sharīf* — the noble oath of allegiance — that turns ordinary
  religious action sacred. The episode ends where the disciple's tears
  do, on the night he knew with certainty that he had become a member
  of the *Ḥizb Allāh* (HIZB ahl-LAH), the party of Allah.
