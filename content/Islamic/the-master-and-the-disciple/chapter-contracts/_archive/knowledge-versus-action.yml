show_notes:
  blurb: >
    Episode three of *The Master and the Disciple* turns from
    cosmology to the spiritual economy of the seeker. The
    Master lays down the three-level doctrine of *ẓāhir /
    bāṭin / bāṭin al-bāṭin* — the outer aspect, the inner, and
    the innermost — and maps the three onto the three orders
    of creature: whoever knows only the outer operates at the
    level of beasts; whoever knows the inner is one of the
    true descendants of Adam; and whoever knows the innermost
    resembles the angels. From there he refuses the literal
    glosses of *lā ḥawla wa-lā quwwata illā billāh* and
    unfolds the formula as a naming of the chain: *ḥawl* is
    the *nāṭiq* or the Imam, who *transforms* the Creator's
    speech into the body and form of the words of wisdom;
    *quwwa* is the *bāb* or the *ḥujja*, to whom strength has
    been given to bear and disseminate those words. *There is
    no Imam and no ḥujja except through Allah.* Yūsuf's dream
    is read as the prophetic cabinet of *Isḥāq*; the king's
    dream as the seven heavenly intermediaries and the seven
    *nuṭaqāʾ*. The chapter's strongest practical verdict
    follows: the one who keeps the inner without the outer is
    *fāsiq*; the one who keeps the outer without the inner is
    *kāfir*; only the *muʾmin* who joins both walks the path.
    Inner faculties are equal by divine justice — *no scholar
    has three eyes* — and the differences among people come
    not from instrument but from the corruption of the root.
    Necessity is met with mercy in the case of the thirsting
    woman whom Maulā Ali (peace be upon him) declared free of
    sin. The disciple presents his own five-part purification
    of possessions — *zakāt*, *kaffāra*, *shukr*, the brothers'
    portion given by his own hand, and one offered to the
    Master — and the Master, moved to tears, refuses his own
    portion and reassigns the others as trusts pointing
    forward to the Imam. He then departs to his own *wālid
    al-akbar*, the Sheikh, and when he returns finds the
    disciple's body weak and his complexion pale — the marks
    of *ʿishq*, the lover's grief at the beloved's absence.
    The Master tells him: *start preparing for your journey,
    for I am taking you to the doorstep of your ultimate
    goal* — *and there is no power but through Allah*.
