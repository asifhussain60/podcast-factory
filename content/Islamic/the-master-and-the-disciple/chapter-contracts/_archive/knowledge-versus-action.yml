key_tensions:
  - >
    The three-level doctrine of *ẓāhir / bāṭin / bāṭin al-bāṭin*
    is the spine of the book and the spine of this episode. It is
    not a hermeneutical layering but a *creatural mapping*: those
    who know only the outer aspect of this physical world operate
    at the level of beasts; those who know the inner aspect
    operate at the level of the descendants of Adam, the *insān*
    (in-SAAN); and those who know the inner aspect of the inner
    aspect resemble the angels and become — when they remain
    embodied — prophets and *the vicegerent on earth*. The
    episode must let the listener feel the moral weight of the
    mapping: it is not flattering description, it is a verdict
    on the listener's own current rank, and the only path
    upward is the most excellent and meritorious action with the
    most sincere certainty and a pure attentive heart.
  - >
    *Ḥawl* (HAWL) and *quwwa* (KOO-wa) are not "year" and "mule"
    — they are esoteric names. The Master refuses the literal
    glosses (*ḥawl* as a year drawn from Q 2:233 on suckling, and
    *quwwa* as mules drawn from the verse on the treasures of
    Qārūn) and unfolds the doctrine: *ḥawl* names the *nāṭiq* or
    the Imam, who *transforms* (*taḥwīl*) the Creator's pure
    spiritual speech into the body and form of the words of
    wisdom; *quwwa* names the *bāb* (baab) or the *ḥujja*
    (HUDJ-ja), who has been given strength to bear those mighty
    words and disseminate them to the *duʿāt* (dua'at) in
    detailed form suited to their level. So *lā ḥawla wa-lā
    quwwata illā billāh* means *there is no Imam and no ḥujja
    except through Allah*. The episode must walk this exact
    inversion — common formula → false literal gloss → esoteric
    name for the chain — and not collapse the unfolding into a
    summary.
  - >
    The story of *Yūsuf* (peace be upon him) is told twice in
    the source, and both readings are esoteric. His dream of
    *eleven stars, the sun and the moon prostrating to me*
    (12:4) maps onto the prophetic cabinet of *Isḥāq* (peace be
    upon him) — the sun is *Isḥāq* himself, the moon is Yūsuf's
    own *bāb*, and the eleven stars are the eleven *nuqabāʾ*
    (nu-ka-BAA), the chieftains of Isḥāq's cabinet. The brothers'
    jealousy was the jealousy of cabinet members over rank, not
    a family quarrel. The king's dream of *seven fat cows eaten
    by seven lean, and seven green ears and seven dry* maps onto
    Allah's seven heavenly intermediaries between Him and the
    *nāṭiq*, the seven *nuṭaqāʾ* (nu-ta-KAA) themselves hungry
    for what comes from those intermediaries, and the same
    pattern for the *waṣī* (wa-SEE) line. The episode must let
    both readings land as readings *of the same one chain* the
    cosmology of episode two named: every recurring "seven" or
    "twelve" the scripture surfaces is a re-signaling of the
    one architecture.
  - >
    The union of inner and outer is the chapter's strongest
    practical verdict. The one who knows the inner but neglects
    the outer obligations is *fāsiq* — like fruit whose covering
    is peeled before ripening, it rots; like a body whose limbs
    are cut, the spirit cannot remain. *He has severed what
    Allah commanded to be joined.* But the one who knows and
    upholds the outer aspect while remaining ignorant of the
    inner is in the *worst* station of all — *kāfir*, the same
    root as the farmer who buries the seed. The literal Arabic
    naming of these stations is part of the doctrine; both
    failures are named by their proper esoteric names. Only the
    union — outer obligations of *sharīʿa* (sha-REE-ah) plus the
    inner spiritual dimension — produces the *muʾmin* (MOO-min),
    the person of faith. The episode must keep both verdicts
    visible without softening either.
  - >
    The five-portion division of possessions is a small
    pedagogical masterpiece and the chapter's structural close.
    The disciple has already worked out his own spiritual
    economy and presents it to the Master: one portion for
    *zakāt* (za-KAAT), purification; one for *kaffāra*
    (kaf-FAA-ra), atonement, *to be kept so I keep remembering
    my sins and avoid complacency*; one for *shukr* (SHUKR),
    gratitude for the knowledge, held in trust until spiritual
    maturity; one for the needy among his brothers, *given by
    his own hand so they recognize his generosity*; and one to
    support the scholar himself in his travels. The Master,
    moved to tears, refuses his own portion and reassigns the
    others as trusts pointing forward to the Imam — *the one
    whose right Allah has made obligatory upon every believer,
    in whose hands are the keys of the heavenly gardens, the
    guide of angels*, *muʿālim al-malakūt* (mu-AA-lim
    al-ma-la-KOOT). The episode must let the five portions land
    not as bookkeeping but as a moral architecture binding
    every kind of wealth to a different organ of the spiritual
    life — and let the closing image of the disciple's *ʿishq*,
    his lover's-grief at the Master's absence, prepare the
    listener for episode four's rebirth.
tone_constraints:
  - >
    Walk the source in its own order. The three levels of
    knowledge and the three creatural ranks → the warning that
    the angelic level cannot be reached by climbing through the
    levels below it, only by sincere certainty and pure heart
    → the disciple's exclamation that there is no power and no
    strength except through Allah → the esoteric unfolding of
    *ḥawl* and *quwwa* → the dream of Yūsuf as the cabinet of
    Isḥāq → the king's vision as the seven heavenly
    intermediaries and the seven *nuṭaqāʾ* → the warning
    against being deceived by the *life* of this physical
    world → the *fāsiq* and *kāfir* stations and the *muʾmin*
    union → why true scholars look pale and weak → the equality
    of inner instruments and the corruption of the root → the
    ranks of religion mirroring the ranks of the world →
    necessity and the *Maulā Ali* (MAU-laa A-lee) ruling on
    the thirsty woman → the disciple's instructions on purifying
    possessions → the five-portion division → the Master's
    refusal of his own portion and reassignment of the others as
    trusts → the Master's departure to his own *wālid al-akbar*
    (WAA-lid al-AK-bar), the Sheikh → the disciple's
    deterioration in his absence → *ʿishq* named → the Master's
    promise to take him to the doorstep of his ultimate goal.
    Do not collapse the cascade into a thesis. The accumulation
    *is* the doctrine.
  - >
    Arabic terms keep their phonetic guide at first per-episode
    appearance, per R-PRONUNCIATION-IMPERATIVE: *ẓāhir*
    (ZAA-hir), *bāṭin* (BAA-tin), *bāṭin al-bāṭin* (BAA-tin
    al-BAA-tin), *libās al-taqwā* (li-BAAS at-tak-WAH), *rīsh*
    (REESH), *ism* (ISM), *ṣifāt* (si-FAAT), *maʿnā*
    (MAH-na), *insān* (in-SAAN), *ʿālim rabbānī* (AA-lim
    rab-BAA-nee), *yaqīn* (ya-KEEN), *hamaj raʿāʿ* (HA-maj
    ra-AAA), *taqwā* (tak-WAH), *ʿamal al-ṣāliḥ* (AH-mal
    as-SAA-lih), *ḥujja* (HUDJ-ja), *bāb* (baab), *ḥawl*
    (HAWL), *quwwa* (KOO-wa), *taḥwīl* (tah-WEEL), *nāṭiq*
    (NAA-tiq), *al-Imām* (al-i-MAAM), *nuqabāʾ* (nu-ka-BAA),
    *bāb al-Imām* (baab al-i-MAAM), *duʿāt* (dua'at),
    *waṣī* (wa-SEE), *mujmal* (MUJ-mal), *lā ḥawla wa-lā
    quwwata illā billāh* (laa HAW-la wa-LAA KOO-wa-ta il-LAA
    bil-LAH), *Yūsuf* (YOO-suf), *Isḥāq* (is-HAAQ),
    *nuṭaqāʾ* (nu-ta-KAA), *awṣiyāʾ* (aw-si-YAA), *fāsiq*
    (FAA-sik), *fisq* (FISK), *kāfir* (KAA-fir), *muʾmin*
    (MOO-min), *al-fikr* (al-FIKR), *dhikr Allāh* (DHIKR
    al-LAH), *al-sunna* (as-SOON-na), *zakāt* (za-KAAT),
    *zakāt al-abdān* (za-KAAT al-ab-DAAN), *khalīfa*
    (kha-LEE-fah), *Maulā Ali* (MAU-laa A-lee), *khums*
    (KHOOMS), *kaffāra* (kaf-FAA-ra), *shukr* (SHUKR),
    *muʿālim al-malakūt* (mu-AA-lim al-ma-la-KOOT), *Ṭūr*
    (TOOR), *ḥasana min ḥasanātihi* (HA-sa-na min
    ha-sa-NAA-ti-hi), *wālid al-akbar* (WAA-lid al-AK-bar),
    *ʿishq* (ISHK), *sharīʿa* (sha-REE-ah). Carry the guide
    ONCE per episode, never doubled.
  - >
    Prophet honorifics: any Quranic prophet named — *Yūsuf*,
    *Isḥāq*, *Mūsā* (MOO-sa) — takes *(peace be upon him)* on
    first per-episode mention only. The fifth Imam's father,
    referred to as *Maulā Ali (peace be upon him)* in the
    ruling on the thirsty woman, takes the honorific on first
    mention only; do not pair any leadership-title with his
    personal name anywhere in the prose. The Prophet ﷺ is
    not named in this slice; if he is invoked anywhere, the
    first-mention honorific is *Salallahu alayhi wa aalihee
    wa sallam* contracted to ﷺ thereafter, per
    R-HONORIFIC-ONCE.
  - >
    Verbatim quotation discipline: every Arabic block from the
    source — the proof-text on the garment (Q 7:26, the
    *libās al-taqwā* cascade); the moon-rising syllogism on
    *ism, ṣifa, maʿnā*; *innamā al-nās rajulān: ʿālim
    rabbānī wa mutaʿallim ʿalā sabīl najāt, wa sāʾir
    al-nāsi hamaj raʿāʿ atbāʿu kulli nāʿiq…*; the wet-nurse
    verse on *ḥawlayni kāmilayni* (Q 2:233); the verse on
    Qārūn's treasures and *ulī al-quwwa*; the *yūsuf* dream
    (Q 12:4 — *raʾaytu aḥada ʿashara kawkaban…*); the
    brothers' grievance (Q 12:8); the king's vision (Q 12:43);
    *fa lā taġurrannakum al-ḥayātu al-dunyā*; *yā laytanī
    qaddamtu li-ḥayātī*; *wa yaqṭaʿūna mā amara Allāhu bihi
    an yūṣal*; *lahum qulūbun lā yafqahūna bihā…*; *fa-mani
    iḍṭurra ġhayra bāġhin wa-lā ʿādin fa-lā ithma ʿalayhi*;
    *wa-man yuṭiʿi Allāha wa-l-rasūla fa-ulāʾika maʿa
    alladhīna anʿama Allāhu ʿalayhim min al-nabiyyīna wa
    al-ṣiddīqīna wa al-shuhadāʾi wa al-ṣāliḥīn* — stays
    verbatim with plain English translation immediately
    following. Do not paraphrase a verbatim block; do not
    strip the Arabic.
  - >
    End on the disciple's collapse into *ʿishq* and the
    Master's promise. Do NOT flatten the closing into a
    "what we learned" summary. The next episode opens on the
    rebirth ritual — the seven days of waiting, the naming,
    the conjuncture with the Sheikh — and the disciple's
    grief in this episode is exactly the emptying-out that
    licenses that rebirth. Hold the closing image:
    *Hearing this, the young man sighed so heavily with joy
    and awe that his spirit almost left his body.*
anchor_passages:
  - >
    "The three-levels mapping: *creatures exist in three
    levels — the level of Angels, the level of human beings,
    and the level of the beasts. Whoever knows only the outer
    aspect of this physical world without its inner aspect
    operates at the level of such animals. Whoever knows the
    inner aspect (al-bāṭin) is one of the true descendants of
    Adam (insān) — the one who knows it has true faith and
    operates at the level of a human being. But whoever knows
    the inner aspect of that inner aspect becomes purely
    spiritual in his knowledge, resembling the angels — and
    such a one, while remaining embodied, is a prophet whom
    Allah places as His vicegerent on earth.*"
  - >
    "The two-rank verdict on humanity: *innamā al-nās rajulān*
    — *humanity is essentially two kinds*: the sanctified
    scholar (*al-ʿālim al-rabbānī*) whose spirit is connected
    to the spirit of certainty and who is sanctified through
    his actions as well as his knowledge; and all others, who
    are still seeking along the path of salvation. *The rest
    of mankind are hamaj raʿāʿ — riffraff and rabble — who
    follow every screaming voice, deluded by error yet
    believing they do good.*"
  - >
    "The angelic level cannot be climbed by ladder: *the
    angelic level is specially honored by Allah and can only
    be attained through the most excellent and meritorious
    action, with the most sincere certainty and a pure
    attentive heart. Surely their Allah is also your Allah,
    and there is no undeserved bond of nearness between Allah
    and his creation. Every creature comes close to Allah
    only by his spiritual mindfulness, taqwā, and good
    actions, ʿamal al-ṣāliḥ.*"
  - >
    "The Imam as outward aspect of the rope of Allah: *he is
    an outward aspect of that rope — your strongest support,
    reached through the intermediaries of his proofs (ḥujja)
    and his gateway (bāb).* The disciple's reply: *there is
    no power and no strength except through Allah. Whoever is
    without a true spiritual guide would drown in the floods
    of ignorance, just as anyone without a ship would drown
    in the oceans of this physical world.*"
  - >
    "The esoteric unfolding of *ḥawl* and *quwwa*: *people do
    not utter a single word of truth without its having a
    source in the inner dimension; nor is there any falsehood
    that did not once have a real meaning — only those words
    were turned away from their original meaning and so became
    absurd.* *Ḥawl* names the Imam, who transforms (*taḥwīl*)
    the Creator's speech into the body and form of words of
    wisdom; *quwwa* names the *bāb* or the *ḥujja*, to whom
    has been given the strength to bear those mighty words.
    *Lā ḥawla wa-lā quwwata illā billāh* therefore means
    *there is no Imam and no ḥujja except through Allah.*"
  - >
    "The Yūsuf dream: *innī raʾaytu aḥada ʿashara kawkaban
    wa-l-shamsa wa-l-qamara raʾaytuhum lī sājidīn* — *indeed
    I have seen eleven stars and the sun and the moon
    prostrating to me* (Q 12:4). The sun is *Isḥāq* himself,
    the prophet of the time; the moon is Yūsuf's own *bāb*;
    the eleven stars are the eleven *nuqabāʾ* who together
    with the twelfth made up Isḥāq's prophetic cabinet. The
    *brothers'* grievance — *la-yūsufu wa-akhūhu aḥabbu ilā
    abīnā minnā wa-naḥnu ʿuṣbatun* (Q 12:8), *Joseph and his
    brother are more beloved to our father than we, while we
    are a clan* — is the jealousy of cabinet members over
    rank."
  - >
    "The king's dream: *sabʿu baqarātin simānin yaʾkuluhunna
    sabʿu ʿijāfun wa-sabʿu sunbulātin khuḍrin wa-ukhara
    yābisātin* — *seven fat cows eaten by seven lean, and
    seven green ears of wheat and dry ones* (Q 12:43). The
    seven fat cows are Allah's seven heavenly intermediaries
    between Him and the *nāṭiq*; the seven lean cows are the
    seven *nuṭaqāʾ* themselves, hungry for what comes from
    Allah through those intermediaries. The seven green ears
    are the seven intermediaries between Allah and the
    *waṣī*; the seven dry ears are the *awṣiyāʾ* themselves,
    who would dry up without their sustenance."
  - >
    "The two-station verdict on faith: *the one who knows the
    inner aspect but neglects the outer obligations is fāsiq
    — the word fisq used when something rots and turns ugly —
    like fruit whose covering is peeled before ripening, it
    rots; like a body whose limbs are cut, the spirit cannot
    remain. He has severed what Allah commanded to be joined,
    wa yaqṭaʿūna mā amara Allāhu bihi an yūṣal. The one who
    upholds the outer but is ignorant of the inner is in the
    worst station — kāfir, the same root used for a farmer
    who hides the seed under the ground. Only the union of
    both — the inner spiritual dimension and the outer
    obligations of sharīʿa — produces the muʾmin, the person
    of faith.*"
  - >
    "Divine justice in the inner instruments: *no scholar has
    three eyes, no ignorant person one. The instrument of
    knowledge is one. Allah has not placed two hearts in the
    scholar's chest, nor forbidden any means of understanding
    for the ignorant.* It is by this instrument that Allah
    established His argument against them — *lahum qulūbun
    lā yafqahūna bihā wa-lahum aʿyunun lā yubṣirūna bihā
    wa-lahum ādhānun lā yasmaʿūna bihā* — *they have hearts
    but do not understand with them; eyes but do not see; ears
    but do not hear.*"
  - >
    "The ruling on necessity: *fa-mani iḍṭurra ġhayra bāġhin
    wa-lā ʿādin fa-lā ithma ʿalayhi* — *whoever is forced by
    necessity, neither desiring the forbidden nor willingly
    disobeying, there is no sin upon him*. The case of the
    woman in the time of the second *khalīfa* who, thirsting
    for three days and fearing for her children, complied
    with a man's condition for water; Maulā Ali (peace be
    upon him) declared her free of sin by this verse."
  - >
    "The five-portion spiritual economy: one portion for
    *zakāt*, purification; one for *kaffāra*, atonement, kept
    *so he keeps remembering his sins and avoids complacency*;
    one for *shukr*, gratitude for knowledge acquired, held
    as a trust until spiritual maturity; one for the needy
    among his brothers, given by his own hand *so they
    recognize his generosity*; and one to support the scholar
    in his travels — refused. *You purify your possessions
    through charity just as you purify your body through
    righteous acts.*"
  - >
    "The Imam invoked at the close: *the one whose right
    Allah has made obligatory upon every believer, in whose
    hands are the keys of the heavenly gardens, the guide of
    angels (muʿālim al-malakūt), whose palms reveal the light
    of the mountain of Sinai (Ṭūr).* The scholar: *I am his
    spiritual son, and one of his beautiful works (ḥasana
    min ḥasanātihi) — constantly seeking his satisfaction and
    fearing his wrath.*"
