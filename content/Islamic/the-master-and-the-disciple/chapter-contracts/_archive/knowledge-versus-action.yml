      second *khalīfa* exemplifies the chapter's doctrine of
      mercy under necessity."
thesis_relevance: >
  This episode advances the book's central claim — that true
  spiritual knowledge reaches creation only through an unbroken
  chain of chosen intermediaries — by *moving from the
  cosmology that grounds the chain to the doctrine of the
  seeker who walks it*. The three-level *ẓāhir / bāṭin /
  bāṭin al-bāṭin* mapping shows that knowledge of the chain is
  not optional information but a verdict on the listener's
  creatural rank; the esoteric reading of *lā ḥawla wa-lā
  quwwata illā billāh* names the *nāṭiq* and the *bāb* as the
  meaning of the formula every Muslim recites daily; the Yūsuf
  and king's-dream readings re-sign the seven-and-twelve
  architecture of episode two onto Qurʾanic narrative; the
  *fāsiq / kāfir / muʾmin* verdict turns the chain-doctrine
  into a practical rule of life; and the five-portion
  purification of possessions and the disciple's *ʿishq* at
  the Master's absence prepare the listener for the rebirth
  ritual in episode four that licenses the disciple's own
  participation in the chain.
