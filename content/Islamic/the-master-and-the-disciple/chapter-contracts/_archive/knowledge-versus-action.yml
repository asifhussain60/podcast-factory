title: Knowledge versus Action
audience: >
  Thoughtful adult readers who have followed *episodes one and two*
  of *Kitāb al-ʿĀlim wa al-Ghulām* — *The Book of the Master and
  the Disciple* — through the covenant of allegiance (*ʿahd
  sharīf*, AHD sha-REEF) and the architecture of creation that
  the covenant licensed. Episode three turns the disciple inward.
  The dialogue moves from cosmology to the *spiritual economy of
  the seeker*: the three levels of knowledge mapped onto the
  three orders of creature; the esoteric reading of the formula
  *lā ḥawla wa-lā quwwata illā billāh* (laa HAW-la wa-LAA
  KOO-wa-ta il-LAA bil-LAH), *there is no power nor strength
  except through Allah* (al-LAH); the dream of *Yūsuf* (YOO-suf)
  and the king's vision of the seven cows and the seven ears;
  the necessary union of outer (*ẓāhir*, ZAA-hir) and inner
  (*bāṭin*, BAA-tin) so neither the *fāsiq* (FAA-sik) nor the
  *kāfir* (KAA-fir) station claims him; divine justice in the
  equality of inner faculties; and the five-part purification
  of his own possessions before he parts from the Master and is
  drawn toward his rebirth. The episode lands where the disciple
  himself stops being able to bear the separation: his body weak,
  his complexion pale, his heart undone by *ʿishq* (ISHK), the
  love of a lover for the beloved — and the Master tells him,
  *start preparing for your journey, for I am taking you to the
  doorstep of your ultimate goal*.
