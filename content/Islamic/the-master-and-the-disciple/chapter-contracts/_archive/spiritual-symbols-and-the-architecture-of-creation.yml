title: Spiritual Symbols and the Architecture of Creation
audience: >
  Thoughtful adult readers who have followed *episode one* of
  *Kitāb al-ʿĀlim wa al-Ghulām* — *The Book of the Master and the
  Disciple* — through the three thanks, the Persian scholar's
  search, the design-of-creation sermon, and the *ʿahd sharīf*
  (AHD sha-REEF), the noble oath of allegiance to the Imam. Episode
  two opens where the covenant set the stage: *having taken the
  covenant, the disciple is taught the architecture of creation with
  mathematical precision*. The Master begins with the first
  principles of the manifest intermediaries (*al-asbāb al-ẓāhira*,
  al-as-BAAB az-ZAA-hi-rah). Allah is the Originator of things and
  the One who gave them existence; He created them and initiated
  them without any prior template; He is the first of every first
  and the inheritor of every existence; He initiated His creation
  from a Light. From that Light branched three words — His *irāda*
  (ee-RAA-dah), will; from the will His *amr* (AMR), command; from
  the command His *qawl* (KAWL), saying *kun fa-yakūn* (KOON
  fa-ya-KOON). The three primordial principles are the Light, the
  *nūr* (NOOR) whose word has three letters — a Spiritual
  Luminescence *superior* to physical light. From it air was
  created — the first of the seven, singular, without any pair,
  mixing with everything and encompassing everything but encompassed
  by none — and air therefore symbolically points to the One who
  has no like unto Him: *laysa ka-mithlihī shayʾ* (lay-sa ka-MITH-li-hi
  shay'). Then came water and darkness and (physical) light; then
  smoke, mud, and fire. Once creation was established on the seven,
  Allah shaped their outward forms: seven heavens, seven earths,
  signed in twelves — *kun fa-yakūn* of seven letters, *irāda amr
  bi-qawl* of twelve. The Bismillah is the cryptographic seal whose
  three-name pattern (Allāh; al-Raḥmān al-Raḥīm, ar-RAH-maan
  ar-ra-HEEM) mirrors *nūr* and whose 7-and-12 letter counts mirror
  the schema. The spiritual hierarchy mirrors the heavens: *nāṭiq*
  (NAA-tiq), Imam, *bāb* (baab) and *waṣī* (wa-SEE), *ḥujja*
  (HUDJ-ja), *duʿāt* (dua'at) — sun, moon, stars. The seven
  *nuṭaqāʾ* (nu-ta-KAA) are *Ādam, Nūḥ, Ibrāhīm, Mūsā, ʿĪsā,
  Muḥammad, Mahdī* (AA-dam, NOOH, ib-raa-HEEM, MOO-sa, EE-sa,
  mu-HAM-mad, MAH-dee). Each *nāṭiq* has twelve *nuqabāʾ*
  (nu-ka-BAA); each Imam has twelve *ḥujaj* (HU-jaj); each *ḥujja*
  has thirty *duʿāt*. Worldly entities are walked one by one as
  symbols of spiritual ranks — heaven, zodiac mansions, earth,
  islands, rivers and springs, oceans, salty vs sweet water. Air
  itself is *too exalted to be a symbol for any creation*; it is
  the loftiest symbol pointing to the Incomparable. And beyond Air
  is *al-Awān* (al-a-WAAN), the Instance of the divine will, where
  the dialogue breaks off as Moses-and-*al-Khiḍr* (al-KHIDR).
