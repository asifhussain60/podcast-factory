thesis_relevance: >
  This episode advances the book's central claim — that true
  spiritual knowledge reaches creation only through an unbroken
  chain of chosen intermediaries — by *building the cosmological
  scaffolding that licenses the covenant of episode one*. The
  seven-and-twelve mathematics of creation, sealed by the
  Bismillah, mirrors the spiritual hierarchy of *nāṭiq → Imam →
  bāb / waṣī → ḥujja → duʿāt* in the sun-moon-stars register;
  the *ẓāhir / bāṭin* distinction is named in its body-and-spirit
  form as the load-bearing doctrine for everything *taʾwīl* will
  do later in the book; and Air-as-the-loftiest-symbol culminates
  in the *al-mathal al-aʿlā* cascade that grounds the singular
  way the One who has no likeness is signed. The covenant of
  episode one becomes, in episode two, the only honest entry into
  a creation whose every detail — seal-ring, dust-mote, river,
  ocean, zodiac mansion — points to a rank in the chain.
