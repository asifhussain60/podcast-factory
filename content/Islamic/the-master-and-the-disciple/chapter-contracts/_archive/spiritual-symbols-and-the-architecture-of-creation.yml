show_notes:
  blurb: >
    Episode two of *The Master and the Disciple* unfolds the
    architecture of creation with mathematical precision. The
    Master begins with the first principles of the manifest
    intermediaries — Allah as Originator and Inheritor, His
    creation initiated from a Light from which three words branch
    in a descent from subtlety to density: *irāda* (will), *amr*
    (command), *qawl* (saying), together the *nūr* of Spiritual
    Luminescence, superior to the *nūr* of sun and lamp. From this
    Spiritual Luminescence Air is born — singular, without pair,
    encompassing all, encompassed by none — and only then come
    water, darkness, and physical light, each pairing with smoke,
    mud, and fire to form the seven principles on which creation
    stands. From smoke the seven heavens and their signs; from the
    thickness of mud the seven earths and their sustenance. *Kun
    fa-yakūn* numbers seven letters; *irāda amr bi-qawl* numbers
    twelve. The Bismillah seals the schema: three names of Allah
    (*Allāh* singular like *irāda*, *al-Raḥmān al-Raḥīm* paired like
    *amr* and *qawl*); seven letters in *bism Allāh*, twelve in
    *al-Raḥmān al-Raḥīm*. The spiritual hierarchy mirrors the
    heavens: the Imam is like the immensity of the sun; the
    *bāb* / *ḥujjat al-imām* is the illuminated moon; the *duʿāt*
    are the shining stars. The seven *nuṭaqāʾ* are *Ādam, Nūḥ,
    Ibrāhīm, Mūsā, ʿĪsā, Muḥammad ﷺ, Mahdī*; each *nāṭiq* has
    twelve *nuqabāʾ*, each Imam twelve *ḥujaj*, each *ḥujja* thirty
    *duʿāt*. The *ẓāhir / bāṭin* doctrine is named in its body-and-
    spirit form: the inner is religion; the outer is *sharīʿa* and
    its symbols; neither subsists without the other. Worldly
    entities are walked one by one as symbols: heaven as
    *nāṭiq*; zodiac mansions as *nuqabāʾ*; earth as *bāb* / *waṣī*;
    twelve islands as *ḥujaj*; rivers and springs as *duʿāt*;
    salty water as outer knowledge, sweet water as inner. Air is
    *too exalted to be a symbol for any creation* — the heaven
    in relation to the full extent of Air is *like an egg in
    relation to an immense plain*. *There is none like Air.* The
    inner meaning of Air is a sign pointing to the One who has no
    likeness. And beyond Air, when the boy presses, the Master
    names *al-Awān* — the Instance of the divine will — and the
    boy pleads to be returned to the lower world, *for I fear for
    my soul, that my intellect may have led me toward something
    whose essence I cannot grasp*. *You and I would have been like
    Moses and al-Khiḍr.*
