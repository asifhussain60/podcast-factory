key_tensions:
  - >
    The deepest move of this episode is the move from *subtlety to
    density*. *Irāda* (intention) → *amr* (command, more dense) →
    *qawl* (speech, more dense still). Each entity gives birth to
    the one that follows, like a current stepping down through
    increasing thicknesses. The three together are the *nūr* of
    Spiritual Luminescence, and the listener must hear in *nūr* a
    Light that is *not* physical light, not made of photons; physical
    light is INFERIOR to it. From this Spiritual Luminescence, Air
    is born — the first of the seven — and only then do water,
    physical light, and darkness emerge, each pairing with smoke,
    fire, and mud. The episode must hold the ranks in order and not
    let the listener collapse *nūr* into the *nūr* of sun and lamp.
    The whole cosmological architecture stands on this single
    distinction.
  - >
    The seven-and-twelve schema is not numerology — it is a
    cryptographic correspondence between the structure of the divine
    command and the structure of creation. *Kun fa-yakūn* comprises
    seven letters; *irāda amr bi-qawl* comprises twelve. Therefore
    *everything* that came into existence is divided into sevens and
    twelves: seven heavens, seven continents, seven oceans, seven
    days; twelve zodiac mansions, twelve islands, twelve hours of
    day, twelve hours of night. And the same seal locks the
    Bismillah: *bism Allāh* numbers seven letters, *al-Raḥmān
    al-Raḥīm* number twelve; three names of Allah (Allāh as the
    singular noun, *al-Raḥmān* and *al-Raḥīm* as the paired
    attributes) mirror the singular *irāda* and the paired *amr*
    and *qawl*. We recite Bismillah at the beginning of every
    action because Allah sealed His OWN first action with that
    structure — and that seal locks the realities inaccessible to
    the unworthy. The episode must let the math land as a *seal*,
    not as a coincidence, because the doctrine of inaccessibility
    is what the seal exists to enforce.
  - >
    The hierarchy — *nāṭiq → Imam → bāb / waṣī → ḥujja → duʿāt* —
    is mirrored in the heavens, and the distinction between *bāb*
    (the Gateway) and *ḥujja* (the Proof) must be preserved without
    blurring: each Imam has twelve *ḥujaj*, one per region, while
    the *bāb* is the SINGLE gateway to the Imam, the Imam's
    greatest proof, his *ḥujjat al-imām*. The sun is the symbol of
    the Imam (an immensity of light veiled by its own brightness);
    the illuminated moon is the symbol of the *bāb*; the shining
    stars are the symbols of the *duʿāt*. The episode must hold
    this five-rank ladder steady because everything later in the
    book about the *daʿwa* — its structure, its discipline, its
    political stake — rests on it.
  - >
    Allah refers to Himself as *male* in the Qurʾan not because of
    physical gender but because *He holds ultimate influence and
    nothing can influence Him*. The Master's *pairs* doctrine is
    not about masculine-and-feminine genders; it is about ranks of
    *influencing* and *being-influenced*. Water influences smoke; a
    teacher influences students — regardless of physical gender. The
    same distinction lets *air* be paired with *nothing* — because
    there is nothing that influences air, just as there is nothing
    that influences the One air points toward. The episode must
    hold this clarification at the moment the pairs doctrine is
    introduced, because the listener's instinct will be to map pairs
    onto male-female and miss the structural point.
  - >
    The Air-to-the-Incomparable move is the episode's argumentative
    climax, and it ends not in triumph but in vertigo. Air is *too
    exalted to be a symbol for any creation*. The earth in relation
    to Air is like a *seal-ring in a great plain*; the atmosphere
    in relation to the heavens is like a seal-ring in a vast desert;
    the heaven in comparison to the full extent of Air is like *an
    egg in relation to an immense plain*. Air's inner meaning is
    *a sign pointing to the One who has no likeness — neither in
    the outward aspects nor the inner*. The careful point: the
    Master is NOT saying air is *like* Allah. He is saying *nothing
    in creation is like air* — but then nothing, INCLUDING air, is
    like Allah. The comparison demonstrates incomparability through
    scale. And when the boy asks what is between Air and Allah,
    the Master answers *al-Awān* — the Instance of His divine will,
    through which He created what He willed and commanded what He
    wished — and the boy pleads to be brought back to the lower
    world, *for I fear for my soul, that my intellect may have led
    me toward something whose essence I cannot grasp*. The episode
    must let this vertigo land: *you and I would have been like Moses
    and al-Khiḍr*. That is the closing image.
tone_constraints:
  - >
    Walk the source in its own order. The root principles
    (*mubdiʿ al-ashyāʾ wa makawwinahā*; *bal huwa awwalu kulli
    awwalin wa wārithu kulli kāʾin*) → the three primordial words
    (*irāda → amr → qawl*) → *nūr* of three letters as the Light →
    Air from the Light, alone of the seven, encompassing all →
    water, darkness, physical *nūr* derived from the three words →
    smoke, mud, fire derived from those three → the seven heavens
    and the seven earths and their twelves → the Bismillah seal
    (three names; seven and twelve) → the spiritual hierarchy
    (sun, moon, stars; *nāṭiq, ḥujja-bāb, duʿāt*) → the seven
    *nuṭaqāʾ* by name → the twelve *nuqabāʾ* per *nāṭiq*, twelve
    *ḥujaj* per Imam, thirty *duʿāt* per *ḥujja* → the *ẓāhir /
    bāṭin* doctrine of body-and-soul of the *sharīʿa* → the
    worldly-symbols catalog (heaven, zodiac, earth, islands,
    rivers and springs, oceans, salty vs sweet water) → Air as
    the loftiest symbol → the Qurʾanic verses on symbol-making →
    *al-Awān* → the Moses-and-al-Khiḍr close. Do not collapse the
    cascade into a thesis. The cascade *is* the doctrine.
  - >
    The seven *nuṭaqāʾ* are named in the order the source gives
    them: *Ādam, Nūḥ, Ibrāhīm, Mūsā, ʿĪsā, Muḥammad, Mahdī*. The
    Prophet Muḥammad ﷺ honorific is *Salallahu alayhi wa aalihee
    wa sallam* on first per-episode mention and ﷺ thereafter, per
    R-HONORIFIC-ONCE; the other speaker-prophets and *al-Mahdī*
    take *(peace be upon him)* on first mention only. The Imam
    titles — *nāṭiq*, *bāb*, *waṣī*, *ḥujja*, *duʿāt*,
    *nuqabāʾ*, *al-Imām* — are named without paying any
    leadership-title to the Father of Imams (the source for
    episode 2 does not name him; do not introduce his personal
    name anywhere).
  - >
    Arabic terms keep their phonetic guide at first per-episode
    appearance, per R-PRONUNCIATION-IMPERATIVE: *al-asbāb
    al-ẓāhira* (al-as-BAAB az-ZAA-hi-rah), *irāda* (ee-RAA-dah),
    *amr* (AMR), *qawl* (KAWL), *kun fa-yakūn* (KOON fa-ya-KOON),
    *nūr* (NOOR), *bism Allāh al-Raḥmān al-Raḥīm* (BISM al-LAH
    ar-RAH-maan ar-ra-HEEM), *al-Raḥmān* (ar-RAH-maan),
    *al-Raḥīm* (ar-ra-HEEM), *nāṭiq* (NAA-tiq), *al-Imām al-Nāṭiq*
    (al-i-MAAM an-NAA-tiq), *bāb* (baab), *waṣī* (wa-SEE),
    *ḥujja* (HUDJ-ja), *ḥujjat al-imām* (HUDJ-jat al-i-MAAM),
    *duʿāt* (dua'at), *nuqabāʾ* (nu-ka-BAA), *nuṭaqāʾ* (nu-ta-KAA),
    *jazāʾir* (ja-ZAA-ir), *al-jazīra* (al-ja-zee-rah), *burūj*
    (bu-ROOJ), *amthāl* (am-THAAL), *sunna* (SOON-na), *ẓāhir*
    (ZAA-hir), *bāṭin* (BAA-tin), *al-bāṭin* (al-BAA-tin),
    *bāṭin al-bāṭin* (BAA-tin al-BAA-tin), *taʾwīl* (tah-WEEL),
    *al-mathal al-aʿlā* (al-MA-thal al-AH-la), *laysa ka-mithlihī
    shayʾ* (lay-sa ka-MITH-li-hi shay'), *al-Awān* (al-a-WAAN),
    *al-Khiḍr* (al-KHIDR). Carry the guide ONCE per episode,
    never doubled.
  - >
    Verbatim quotation discipline: every Arabic block from the
    source — *anna Allāha mubdiʿ al-ashyāʾi wa makawwinahā*;
    *khalaqahā wa fa-ibtadaʾahā*; *bal huwa awwalu kulli awwalin
    wa wārithu kulli kāʾin*; *fa-kāna awwalu al-khalqi irādatu
    amrin bi-qawl*; *thumma khalaqa min tilka al-thalāthi
    al-kalimāti al-māʾa wa al-ẓulmata wa al-nūr*; *thumma khalaqa
    min al-māʾi dukhānan…*; *fa-rajaʿnā fī al-qawli ilā al-kalimāti
    al-thalāth…*; *fa-dalla bi-al-ashyāʾi ʿalā munshiʾihā; wa dalla
    bi-al-bariyyati ʿalā bāriʾihā*; *thumma akramahu bi-al-sharāʾiʿi
    wa al-kutubi…*; *thumma naṣaba lahu min khiyāri khalqihi…*;
    *fa-jaʿalahum buyūta nubuwwatihi…*; *wa istakhlafahum fī arḍihi
    adillatan ʿalā sabīli al-najāti fīmā ẓahara wa baṭan*;
    *fa-minhum al-aʾimmatu wa al-nuṭaqāʾ wa minhum al-ḥujaju wa
    al-nuqabāʾ wa minhum al-duʿātu ilā al-khayri wa al-ʿulamāʾ*;
    *fa-hum fī manāzilihim ka-nujūmi al-samāʾi…*; *fa-imāmuhum ka
    al-shamsi al-ʿaẓīma…*; *wa ḥujjatuhum wa bābu imāmihim ka
    al-qamari al-munīri…*; *wa duʿātuhum ka al-nujūmi al-zawāhiri…*;
    *fa-huwa min khilāli hāʾulāʾ*; *fa-man ʿarafa al-rūḥa ṭāba
    lahu al-jism* and its complement; *fa-inna al-dunyā wa jamīʿa
    amthālihā ẓāhirun lil-ākhirati…*; *fa-man saʿā fī al-dunyā li
    al-dunyā…*; *wa man saʿā fī al-dunyā lil-ākhirati…*; the
    six-sides-and-the-mote doctrine (the *dharra* bound by six
    sides, the seventh being the mote itself); and the *al-mathal
    al-aʿlā* cascade — *innā li-kulli shayʾin maʿnā…*; *fa-nahā
    tabāraka wa taʿālā…*; *fa-ṣārat amthāluhum dalāʾila ʿalayhim wa
    ʿalā tafāḍulihim*; *wa lakin tuʾkhadhu al-amthālu ʿalā
    maʿānīhā…*; *fa-li-dhālika qāla wa lillāhi al-mathalu al-aʿlā*;
    *wa huwa al-hawāʾu…*; *fa-huwa al-mathalu al-aʿlā wa huwa
    al-dalīlu ʿalā man laysa ka-mithlihī shayʾ*; *wa lam yaqul
    laysa mithluhū shayʾ…*; *wa laysa ka-dalīlihī dalīlun…*;
    *fa-tabāraka Allāh rabbu al-ʿarshi al-ʿaẓīm* — stays verbatim
    with plain-English translation immediately following.
  - >
    The Qurʾanic verses surfaced are: *wa ʿallama Ādama al-asmāʾa
    kullahā* (Q 2:31, paraphrased in the source); *fa lā taḍribū
    lillāhi al-amthāla, inna Allāha yaʿlamu wa antum lā taʿlamūn*
    (Q 16:74); *wa lahu al-mathalu al-aʿlā* (Q 16:60). Render each
    with attribution and translation in the order the source gives
    them. The two *mathal* verses are the load-bearing pair for the
    Air-to-the-Incomparable move; do not separate them.
  - >
    End on *al-Awān* and the boy's plea, then on the Master's
    closing: *therein you lost your vision and your intellect was
    perplexed; so what state would you have been in if I started
    unveiling the inner meanings of these inner aspects (bāṭin
    al-bāṭin) for you? You and I would have been like Moses and
    al-Khiḍr.* Do NOT flatten the closing into a "what we learned"
    summary. The next episode opens on the three-level *ẓāhir /
    bāṭin / bāṭin al-bāṭin* doctrine — the closing image is its
    bridge.
anchor_passages:
  - >
    "The root-principles of the manifest intermediaries (*al-asbāb
    al-ẓāhira*): *anna Allāha mubdiʿ al-ashyāʾi wa makawwinahā* —
    *Allah is the Originator of things and the One who gave them
    existence*; *khalaqahā wa fa-ibtadaʾahā* — *He created them and
    then initiated them without a template, such that no prior
    entity served as a model for the later*; *bal huwa awwalu kulli
    awwalin wa wārithu kulli kāʾin* — *He is the first of every
    first and the inheritor of all existence.*"
  - >
    "The three primordial words: *fa-kāna awwalu al-khalqi irādatu
    amrin bi-qawl* — *the beginning of all creation was by Allah's
    will of a command, executed through His speech.* From the Light
    branched will → command → saying *kun fa-yakūn*. The three
    together are the *nūr*, the Spiritual Luminescence whose word
    has three letters."
  - >
    "From the Light, *air* — the first of the seven, singular,
    without any pair, mixing with everything and encompassing
    everything, but encompassed by none. *Then water and darkness
    and (physical) light*; from water came smoke, from darkness the
    thickness of mud, from light fire. Once creation was established
    on the seven, He shaped their outward forms: *from smoke, the
    seven heavens and their signs; from the thickness of mud, the
    seven earths and their sustenance.*"
  - >
    "The seven-and-twelve seal: *kun fa-yakūn* of seven letters
    (seven heavens, seven continents, seven oceans, seven days);
    *irāda amr bi-qawl* of twelve letters (twelve zodiac mansions,
    twelve islands, twelve hours of day and twelve of night). The
    twelves are the signs in the heaven (the *burūj*) and on the
    earth (the *jazāʾir*); the sevens are the witnesses (seven
    rulers in the heavens, seven oceans on the earth)."
  - >
    "The Bismillah seal: three names of Allah — *Allāh* (the noun,
    unique like *irāda*) and *al-Raḥmān al-Raḥīm* (the pair of
    attributes, like *amr* and *qawl*). *Bism Allāh* numbers seven;
    *al-Raḥmān al-Raḥīm* number twelve. We recite Bismillah at the
    beginning of every action because Allah sealed His OWN first
    action with that structure."
  - >
    "The chosen ranks (*thumma naṣaba lahu min khiyāri khalqihi
    aʿlāman wa dalāʾila wa ḥukkāman*): *He raised distinguished
    personalities, guiding figures, and wise judges; He placed them
    in the houses of His prophethood, the treasures of His
    knowledge and wisdom, and made them the inspired translators of
    His revelation; He made them His representatives on earth, a
    means of deliverance through the path of salvation, in both the
    outer and the inner.* Among them are the Imams and the
    *nuṭaqāʾ*; the *ḥujaj* (proofs) and *nuqabāʾ* (chieftains); the
    *duʿāt* who summon people to good; and the scholars (*ʿulamāʾ*)."
  - >
    "The sun-moon-star mapping: *fa-imāmuhum ka al-shamsi al-ʿaẓīma*
    — *their Imam is like the immensity of the sun among the
    heavenly lights*; *wa ḥujjatuhum wa bābu imāmihim ka al-qamari
    al-munīri* — *his Gateway, who is his greatest proof, is like
    the illuminated moon*; *wa duʿātuhum ka al-nujūmi al-zawāhiri*
    — *the shining stars are the symbols representing the duʿāt.*
    Each Imam has twelve *ḥujaj* — one per region — while the *bāb*
    is the single gateway to the Imam."
  - >
    "The seven *nuṭaqāʾ*: *Ādam, Nūḥ, Ibrāhīm, Mūsā, ʿĪsā,
    Muḥammad, Mahdī* — the seven *nuṭaqāʾ* symbolized by the seven
    heavens of Saturn, Jupiter, Mars, Sun, Venus, Mercury, and
    Moon. Each *nāṭiq* has twelve *nuqabāʾ* symbolized by the twelve
    *burūj*; each Imam has twelve *ḥujaj* symbolized by the twelve
    *jazāʾir*; and each *ḥujja* has thirty *duʿāt*, mirroring the
    thirty days of a month under the twelve months."
  - >
    "The *ẓāhir / bāṭin* doctrine in its body-and-spirit form:
    *the inner aspect (al-bāṭin) is the true religion of Allah,
    while the outer aspect (al-ẓāhir) is the revealed paths
    (sharīʿa) and its symbols. Religion is the soul and living
    spirit of those revealed paths, and the ordinances of sharīʿa
    are the body. The body subsists only through the spirit, and
    the spirit subsists only through the body, which is its
    covering and a sign pointing to it.*"
  - >
    "The doctrine on this lower world (*ẓāhir al-bāṭin*): *fa-man
    ʿarafa al-rūḥa ṭāba lahu al-jism* — *whoever recognizes the
    spirit finds the body pleasing*; *wa man lam yaʿrif al-rūḥa
    wa iʿtarafa bi al-jismi kāna al-jismu ʿalayhi maytatan wa
    al-maytatu ḥarām* — *but whoever is ignorant of the spirit and
    recognizes only the body, for him the body is dead and
    decaying flesh, which is forbidden.* Scholars *forbade* this
    world only in the sense that Allah forbade eating the dead
    unless approached through sacrifice."
  - >
    "Air as the loftiest symbol: *the Air is too exalted to be a
    symbol for any creation*. The earth in relation to the Air is
    like a seal-ring in a great plain; the atmosphere in relation
    to the heavens is like a seal-ring in a vast desert; the
    heaven in comparison to the full extent of the Air is like an
    egg in relation to an immense plain. What, then, could
    symbolize Air? *There is none like Air.* Its inner meaning is
    a sign pointing to the One who has no likeness — neither in the
    outward aspects nor the inner."
  - >
    "The two Qurʾanic verses on symbol-making: Q 16:74 — *fa lā
    taḍribū lillāhi al-amthāla, inna Allāha yaʿlamu wa antum lā
    taʿlamūn* — *do not make any likenesses for Allah, for He knows
    and you do not*; Q 16:60 — *wa lillāhi al-mathalu al-aʿlā* —
    *and Allah is the loftiest symbol*. The first forbids the
    comparison; the second names the singular sign. The cascade
    *innā li-kulli shayʾin maʿnā… wa lakin tuʾkhadhu al-amthālu
    ʿalā maʿānīhā… fa-ṣārat amthāluhum dalāʾila ʿalayhim wa ʿalā
    tafāḍulihim… wa li-dhālika qāla wa lillāhi al-mathalu al-aʿlā*
    reconciles the two."
  - >
    "The closing image — *al-Awān* (the Instance): *yes, the Instance
    of His divine will, through which He created what He willed and
    commanded what He wished*. The boy pleads to be returned to the
    lower world, *for I fear for my soul*. The Master answers:
    *you climbed high in your questioning, and my answers climbed
    with you to the very peak of these inner aspects. So what state
    would you have been in if I started unveiling the inner meanings
    of these inner aspects (bāṭin al-bāṭin) for you? You and I would
    have been like Moses and al-Khiḍr.*"
