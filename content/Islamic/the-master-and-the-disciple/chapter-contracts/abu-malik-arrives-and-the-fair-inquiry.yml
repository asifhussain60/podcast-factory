show_notes:
  blurb: >
    Episode fourteen of *The Master and the Disciple*
    brings the champion of the opposing community on
    stage. The former co-religionists of al-Bakhtari, who
    are afraid of losing his favors and afraid of being
    on the wrong side of his conversion, send for the
    Yemeni scholar Abu Malik — Kab al-Ahbar of his age,
    the glory of the yearned. He responds with striking
    fairness. He refuses to condemn the two converts
    without hearing them and refuses to assume their
    guidance without testing it; both, he says, would be
    injustice. He warns his own companions against the
    satisfaction of past communities who said no
    messenger would come after theirs and did not see
    the way of proceeding beyond what they had attained.
    He gives the conversion three possible readings —
    decorative addition; real increase of knowledge as
    the believer's lost camel; or true prophetic
    guidance — under each of which the right move is to
    go and meet. He names the inversion of signs by
    which falsehood wears conformity and truth wears
    trial, and defines the sound heart as the one that
    does not deny what enters it. He insists on humility
    before the truth, not after. And he refuses delay:
    today, not in three days, not in two. The greatest
    scholar of the opposing camp has just set the terms
    of his own debate by the standard of justice.
