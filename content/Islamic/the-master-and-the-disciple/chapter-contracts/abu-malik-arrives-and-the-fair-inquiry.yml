      the source gives it, without smoothing the title
      into modern terms."
thesis_relevance: >
  This episode advances the book's central claim — that
  true spiritual knowledge reaches creation only through
  an unbroken chain of chosen intermediaries — by raising
  the opposing camp's strongest voice to the height the
  debate needs, by letting Abu Malik define the standard
  by which any inquiry into Salih's path must be
  conducted, and by establishing the inversion of signs
  and the sound heart as the criteria under which the
  next two episodes' debate will be tried.
