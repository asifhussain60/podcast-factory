title: Abu Malik Arrives and the Fair Inquiry
audience: >
  Listeners meeting the most formidable scholar the
  opposing community can field. The former
  co-religionists of al-Bakhtari send for Abu Malik —
  Kab al-Ahbar of his age, a seventh-century Yemeni
  famous for piety, understanding, and the ability to
  defeat people in debates. He responds with striking
  fairness: he refuses to condemn without hearing, and
  refuses to assume guidance without testing; he warns
  his own companions against the satisfaction of past
  communities who said no messenger would come after
  theirs; he gives the change of belief three possible
  readings under each of which the right move is to go
  and meet; he names the inversion of signs by which
  falsehood wears conformity and truth wears trial; and
  he insists they go together, today, not in three days.
angle: faithful_exposition
episode_format: deep_dive
format_rationale: >
  No sustained named opposition runs through this
  section. Abu Malik addresses his own companions in
  extended monologue and the only on-stage exchanges are
  with men who agree with him. The proposition under
  scrutiny — what to make of Salih's conversion — is
  examined by Abu Malik alone; Salih is not yet on
  stage. One unfolding analysis from a single named
  voice; deep_dive is the honest read.
essential: core
essential_rationale: >
  Carries the introduction of Abu Malik, names the three
  possible readings of conversion he uses to dissolve
  his companions' false dilemma, and gives the inversion
  of signs and the working definition of the sound heart
  that will govern the entire debate to come. Without
  this episode Salih's debate has no foil at the height
  the source built for him.
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: >
  Mentor delivers the standing Abu Malik has in his
  community as Kab al-Ahbar; the three fears his clients
  bring with them; his refusal of both cheap moves
  (condemn without hearing; assume guidance without
  testing); the warning against the satisfaction of past
  communities; the three possible readings of conversion;
  the inversion of signs — falsehood as conformity, truth
  as trial; the working definition of the sound heart;
  the humility before the truth as the posture of
  search; and the refusal of delay. Student tracks each
  move and stays inside Abu Malik's argument.
length_target: default_deep_dive
key_tensions:
  - >
    Abu Malik's refusal of both cheap moves. His clients
    have brought a problem with two cheap solutions —
    condemn the converts to keep grievance, or pronounce
    them guided to escape the audit. He refuses both
    and reframes both as forms of injustice. The
    challenge is set by the standard of justice from
    inside the opposing camp itself.
  - >
    The three readings of conversion. Either the change
    is decorative (tradition, poetry), in which case
    nothing fundamental is at stake; or it is an
    addition of real knowledge, in which case knowledge
    is the lost camel of the believer; or it is true
    prophetic guidance, in which case there is clear
    guidance to follow. Under each the right move is the
    same — go and find out.
  - >
    The inversion of signs. Falsehood appears attractive
    and easy because it is polished by conformity. Truth
    appears harsh and demanding because it is wrought by
    tests and afflictions and the opposition of passions.
    Only the sound heart can renounce passions and
    persevere through tests. The majority follows the
    easier-appearing path; truth is in the costume the
    majority will not buy.
  - >
    Humility before the truth, not after. True
    understanding of the search means knowing one is in
    need of what one seeks and approaching with the
    humility that comes from that need. The humility
    cannot be a reward at the end of the search; it must
    be the posture in which the search is made.
tone_constraints:
  - >
    Walk the source in its own order: the visible
    standing of Salih and al-Bakhtari; the three fears of
    the former co-religionists; the summons of Abu Malik
    by name (Abd al-Jabbar ibn Abu Malik) with his
    honorific (Kab al-Ahbar) and his standing as a
    seventh-century Yemeni scholar; the three reasons
    his clients have avoided the two converts; Abu
    Malik's refusal to condemn without hearing; his
    refusal to assume guidance without testing; the
    warning against the satisfaction of past communities;
    the three readings of conversion; the inversion of
    signs; the working definition of the sound heart;
    humility before the truth; the softening of the
    companions; the refusal of delay; the same-day
    departure.
  - >
    Plain transliteration only — no diacritics. Inline
    terms used: qalb salim, Imam, da'i, Sharia, hadith.
    Always use the English equivalent where one exists.
    Do NOT pair any leadership-title with the personal
    name of the Father of Imams.
  - >
    Quranic citation format '(chapter N, verse M)' if any
    verse is surfaced; this episode surfaces no Quran
    verses directly from the source. Do not invent
    references.
  - >
    Verbatim discipline: render Abu Malik's two refusals
    intact; render the three reasons his clients
    avoided; render the warning against the satisfaction
    of past communities word-for-word; render the three
    readings of conversion as the source gives them;
    render the inversion-of-signs passage on falsehood's
    appearances and truth's tests; render the definition
    of sound heart whole; render the refusal of delay
    ("I will do something good tomorrow is a satanic
    thought; the only time to do something is today and
    now").
anchor_passages:
  - >
    "Abd al-Jabbar ibn Abu Malik — known among them as
    Kab al-Ahbar, the glory of the yearned — was a
    seventh-century Yemeni scholar famous for his
    knowledge and his ability to defeat people in
    debates. The title signified the highest scholarly
    reputation in the community."
  - >
    "He refused to condemn al-Bakhtari and his son
    without first hearing them, for that would be
    injustice; nor would he blindly assume they were
    rightly guided, for that too would be injustice."
  - >
    "He warned against following the passions of the
    false idols of previous religious communities, who
    were pleased by their own sound intellect and
    rejoiced in the knowledge they possessed, assuming
    they had encompassed everything from Allah's command
    — for they said Allah will never send a messenger
    after their messenger, and did not realize there was
    a way of proceeding beyond the knowledge they had
    attained."
  - >
    "Their choice of a new belief could only be for one
    of three reasons: they were still on the old religion
    with an added element of tradition or poetry; or the
    stranger had brought them something pleasing in
    addition to their religion, in which case knowledge
    is the lost camel of the believer and an increase in
    knowledge is better than a lack of it; or their
    guidance came from a true source of prophethood, in
    which case they followed clear guidance."
  - >
    "Pride in one's own opinion is blindness, and
    neglecting to seek Allah is a sin. But there is no
    fault for those who continue searching. The
    distinctive signs of falsehood manifest themselves
    in hypocritical appearances and in conformity to
    accepted opinions. But the clear signs of truth only
    manifest themselves through tests and afflictions,
    and through the opposition of passions. Only those
    with a sound heart can renounce their passions and
    persevere through the onset of tests."
  - >
    "A sound heart is one that does not insist on
    denying what occurs to it, until the truth reveals
    its superiority and falsehood unveils its defects.
    True understanding of the search means knowing that
    you are in need of what you seek, and approaching it
    with the humility that comes from that need — a
    humility that must come before the truth becomes
    clear, for only through it can one witness the
    manifestation of truth."
  - >
    "I will do something good tomorrow is a satanic
    thought; the only time to do something is today and
    now. They repented of their sins, repaid their
    debts, purified themselves, and set out the same
    day, saying, There is no power except through Allah."
