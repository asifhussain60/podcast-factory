      "The seven Natiqs lineage — Adam, Noah, Abraham, Moses,
      Jesus, Muhammad, Mahdi — is the Ismaili prophetic series of
      the ulu al-azm, the possessors of determination, named here
      as the inner aspects of the seven planetary heavens."
thesis_relevance: >
  This episode advances the book's central claim — that true
  spiritual knowledge reaches creation only through an unbroken
  chain of chosen intermediaries — by naming the seven Natiqs at
  the apex of that chain and by framing zahir and batin as the
  body and the spirit of religion in mutual subsistence. Without
  the named Natiqs the chain has no lineage; without the
  body-spirit framing the chain has no living theology.
