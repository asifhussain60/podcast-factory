show_notes:
  blurb: >
    Episode six of *The Master and the Disciple* names the seven
    speaking prophets — Adam, Noah, Abraham, Moses, Jesus,
    Muhammad, Mahdi — and shows how the calendar of cosmology
    (sevens, twelves, thirties) is the calendar of spiritual
    transmission. Then it gives the deepest framing of the whole
    architecture: zahir and batin are not two textual layers but
    the body and the spirit of religion, each subsisting only
    through the other. Religion is the soul of the revealed paths;
    the ordinances of shari'a are the body. Each lives through the
    other; neither lives without the other. Finally the scholar
    answers the disciple's question about the world by walking the
    visible cosmos as a catalogue of symbols: the heaven points to
    the Natiq; the zodiac to the Nuqaba; the earth to the Bab and
    Wasi; the islands to the Hujaj; the rivers and springs to the
    Du'at. And the salty sea encodes outward knowledge while the
    sweet spring encodes inner knowledge — both are water, both
    are life, but only one feeds the field.
