thesis_relevance: >
  This episode advances the book's central claim — that true
  spiritual knowledge reaches creation only through an unbroken
  chain of chosen intermediaries — by giving the disciple the
  architecture that licenses the chain. The three primordial
  words descending into the seven elemental principles establish
  the descent-pattern on which the ranked hierarchy of
  natiq/wasi/bab/hujja/da'i is itself patterned; the Bismillah
  seal encrypts the cosmology so the unworthy cannot crack it;
  the symbol-system decodes the world into the trustees who
  govern it; and the supreme symbol of Air points beyond every
  rank to the One the whole chain is reaching toward. Without
  this architecture, every later doctrine in the book — the
  preferment of the trustees, the inner reading of the shari'a,
  the ranked du'at as the rivers of the inner knowledge — sits
  on top of an unbuilt floor. Episode two is the floor.
