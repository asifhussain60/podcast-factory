show_notes:
  blurb: >
    Episode two of *The Master and the Disciple* opens inside
    the covenant the disciple bound himself to at the close of
    episode one. The scholar — free now to teach what only the
    licensed may hear — lays out the architecture of creation
    with the precision of a mathematician working from first
    principles. He begins with the three primordial words —
    will, command, speech — branching from a spiritual
    luminescence that is not the physical light made of
    photons but the pre-physical medium in which the words
    subsist. He moves through the seven elemental principles:
    air the singular seventh, paired with no other; then
    water, darkness, light, each given its derivative pair —
    smoke, mud, fire. From smoke He shaped the seven heavens.
    From mud, the seven earths. And the letters of those
    three primordial words come to twelve, matching the
    twelve zodiacs, the twelve regions, the twelve hours; the
    letters of the command itself come to seven, matching the
    seven heavens, the seven continents, the seven days. Then
    he names the seal: the Bismillah, three names of Allah
    mirroring the three primordial words, the opening at
    seven letters and the two paired attributes at twelve.
    Then the hierarchy of the chosen ones — the speaking
    prophet, the trustee, the gateway, the proofs, the
    summoners — patterned on the sun, the moon, and the
    stars, with the seven nataqa named (Adam, Noah, Abraham,
    Moses, Jesus, Muhammad, and the Mahdi) as the inner
    aspect of the seven heavens. He moves outward through the
    world's symbols, decoding Heaven, Zodiac, Earth, islands,
    rivers, oceans, and the salty-vs-sweet water distinction
    that separates outer knowledge from inner. And he lands
    on Air — too exalted to symbolize any creation, greater
    than heaven and earth as a great plain is greater than a
    seal-ring, the loftiest sign pointing to the One who has
    no likeness. The disciple raises a Quranic objection about
    likenesses; the scholar answers from the Quran itself. And
    when the disciple asks what came before Air, the scholar
    names the Instance, al-awan — the instance of the divine
    will — and stops there, telling the disciple that further
    unveiling would carry them to where Moses had to part
    from the Khidr.
