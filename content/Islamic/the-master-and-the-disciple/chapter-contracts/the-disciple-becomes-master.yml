thesis_relevance: >
  This episode advances the book's central claim — that true
  spiritual knowledge reaches creation only through an
  unbroken chain of chosen intermediaries — by *enacting the
  disciple's own induction into that chain*. The seven-day
  rebirth ritual, the *kun fa-yakūn* warrant for naming
  after seven, the esoteric *Ṭawāf* as gravitational binding
  to the Imam, and the *maʿrifa* of the Imam at the climax
  of the pilgrimage *complete the transmission begun in
  episode one*; the six parting counsels and the
  conversion of *al-Bakhtarī* show the chain extending
  forward through the new master; and the cup-emptying of
  Abu Malik — *kasra* by the *makāsir*, *ʿilm versus
  maʿrifa*, the restoration of *follow the moon* to *follow
  Maulā Ali (peace be upon him)*, the description of
  religion as *the rope extending from the heavens to the
  earth* — shows the chain defending itself against the
  strongest scholar the opposing community can field. The
  way to episode five's final unveiling is opened here.
