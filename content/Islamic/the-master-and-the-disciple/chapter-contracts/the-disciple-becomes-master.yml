show_notes:
  blurb: >
    Episode four of *The Master and the Disciple* is the
    book's transformational arc. The disciple is brought to
    his *wālid al-akbar*, the Sheikh, who praises Allah with
    *fa-iʿtadala al-amru bayn al-amrayn fa-summiya ʿadlan*
    — *He harmoniously balanced His command between the two
    and named it Justice* — and then asks the disciple his
    name. *ʿAbd Allāh ibn ʿAbd Allāh* is a description, not
    a name; the disciple has no name yet, because *one
    cannot name something until it is complete*, and
    completion requires the seven days that honor a new-
    born infant. The cosmological reason is named: the
    universe received its life through *kun fa-yakūn*,
    whose seventh letter began life, and the embryonic
    verses (Q 23:12–14) lay out the seven-stage creation of
    a human being. After the seven days the disciple
    performs a complete ablution, dresses in his finest,
    and the Sheikh speaks to him *of realities that pens
    would fail to write*. He performs the esoteric *Ṭawāf*
    — *the seven circuits around the house of Allah
    simulate the motion of the planets orbiting the sun;
    the sun is the Imam, and the love of the Imam is the
    gravity that pulls every planet into its orbit* — and
    finally meets the Imam, the object of his desire. He
    returns home under the Sheikh's instructions and the
    scholar's six parting counsels. He converts his own
    father al-Bakhtarī with a single forty-years syllogism:
    *either you were a scholar of truth who withheld my
    share, or you were ignorant and need that stranger more
    than I do*. The community sends its greatest scholar,
    Abu Malik — *Kaʿb al-Aḥbār*, the title signifying the
    highest scholarly reputation — who arrives with
    striking fairness: he refuses to condemn the converts
    without hearing them, names the three reasons their
    conversion could have happened, and gives the
    chapter's strongest diagnostic of *why truth is hard to
    recognize* (*falsehood appears attractive and easy;
    truth appears harsh and demanding*). Ṣāliḥ — the new
    master — receives him with perfect *ādāb* and applies
    *kasra*, the cup-emptying that the *makāsir* is
    formally tasked with. He draws the line between *ʿilm*
    as report and *maʿrifa* as vision; he names the
    *ḥadīth* of moon-sighting as the *ḥadīth of moon-
    fighting* and restores *follow the moon* to its
    esoteric meaning, *follow Maulā Ali (peace be upon
    him)*; he marshals *ayyāman maʿdūdātin* and *al-shamsu
    wa-l-qamaru biḥusbān* as the Qurʾanic counter-evidence;
    and he gives religion its description as *the rope
    extending from the heavens to the earth, continuous
    and without breakage*. Abu Malik concedes — *but what
    about the reality of what you have described?* — and
    the way is opened for the final part of the debate.
