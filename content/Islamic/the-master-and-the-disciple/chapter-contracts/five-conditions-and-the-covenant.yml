  references:
    - >
      "Imam Ja'far al-Sadiq (peace be upon him) — the fifth Imam of
      the lineage, surfaced in the covenant section as the source of
      the apple-and-charity teaching that locks the stolen-knowledge
      doctrine in: a stolen apple given to charity is still haram,
      and the giving of it propagates the haram rather than
      cancelling it."
thesis_relevance: >
  This episode advances the book's central claim — that true
  spiritual knowledge reaches creation only through an unbroken
  chain of chosen intermediaries, and becomes sacred only under the
  covenant of walaya to the Imam — by carrying the 'ahd Allah
  doctrine itself: the key that renders religion either sacred or
  profane the way marriage and fornication are the same act under
  two different formalities, and the way halal and haram are the
  same animal under two different blessings. The five conditions
  show that the covenant is taken under taqiyya conditions; the
  apple-and-charity teaching shows that piety performed without
  walaya is propagated theft. Every later move in the book
  presupposes this covenant.

