show_notes:
  blurb: >
    Episode three of *The Master and the Disciple* delivers the
    structural climax of the opening narrative arc. The young man
    has begged to be raised; the scholar answers with the infant
    analogy and the graduated ladder of spiritual learning. Before
    he agrees to teach a single doctrine, he sets the precondition:
    knowledge is of no benefit until it has been put into action,
    and action is of no benefit until it is accepted, and the only
    thing Allah accepts is sincerity. He then imposes five
    conditions — and the fifth reveals the political stake: the
    boy's father is a known leader of a rival community that has
    rejected the Imam, and premature disclosure of the da'wa could
    destroy the mission. The conditions are protocols of taqiyya,
    not pedagogy. After a period of trial, the meeting is arranged.
    The scholar names the key of religion — the 'ahd Allah — and
    delivers the analogy: marriage and fornication are the same
    act, distinguished by the nikah; halal and haram are the same
    animal, distinguished by the dhabiha; sacred and stolen are the
    same religious practice, distinguished by walaya. Imam Ja'far
    al-Sadiq's apple-and-charity teaching locks the doctrine: a
    stolen apple given to charity propagates the haram and earns
    ten sins, not forty-five rewards. The episode lands on the
    title-teaches move — disciple from discipline, discipline from
    shari'a — and on the night of the oath, the boy's tears, his
    certainty of belonging to the Hizb Allah.
