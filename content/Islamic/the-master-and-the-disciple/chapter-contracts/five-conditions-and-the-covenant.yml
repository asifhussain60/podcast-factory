title: Five Conditions and the Covenant
audience: >
  Listeners reaching the structural climax of the opening narrative
  arc of *Kitab al-Alim wa al-Ghulam*. The young disciple has begged
  to become the scholar's servant; the instrument of seeking has
  been named. Before the scholar agrees to teach a single doctrine,
  he sets a precondition — knowledge is of no benefit until it has
  been put into action, and action is of no benefit until it is
  accepted, and the only thing Allah accepts is sincerity — and then
  imposes five conditions of secrecy that read, on first hearing, as
  pedagogical fussiness. They are protocols of survival. The
  disciple's father is a known leader of a rival community that has
  rejected the Imam. Premature disclosure of the da'wa could
  destroy the mission. The scholar trains the boy through a period
  of trial; when his merit and perseverance become clear, the
  covenant is taken — the 'ahd Allah, the key that renders religion
  either sacred or profane, like marriage and fornication, like
  halal and haram. The episode lands on the night of the oath, the
  boy's tears, his certainty that he has become a member of the
  Hizb Allah, the party of Allah.
angle: faithful_exposition
episode_format: deep_dive
format_rationale: >
  No sustained named opposition runs through this section. The boy
  speaks briefly to request raising and to accept; the scholar
  delivers the doctrine of conditions, the doctrine of trial, the
  doctrine of the key, and the doctrine of walaya as covenant. The
  Imam Ja'far al-Sadiq apple-and-charity teaching is reported, not
  contested. One position, layer by layer — deep_dive.
essential: core
essential_rationale: >
  Carries the 'ahd Allah doctrine — the book's load-bearing covenant
  — and the discipline-disciple etymology that turns the book's
  title into its doctrine.
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: >
  Mentor lays out the five conditions, the period of trial, the key
  of religion analogy, and the walaya-as-covenant doctrine; Student
  presses on why the five conditions function as taqiyya rather than
  pedagogy and why stolen-piety is still haram.
length_target: default_deep_dive
key_tensions:
  - >
    Conditions read as pedagogy vs conditions read as survival. The
    five conditions seem at first like teaching rules; the fifth —
    do not mention me to your father — reveals the political stake
    and reframes the entire set as protocols of taqiyya.
  - >
    Action that compounds vs action that nullifies. The
    apple-and-charity teaching attributed to Imam Ja'far al-Sadiq
    (peace be upon him): stolen apples given to charity earn ten
    sins, not forty-five rewards, because the haram has been
    propagated to another. The same logic frames religious practice
    without walaya.
  - >
    The graduated ladder of frequencies. Tahara and salat five
    times daily, sawm one month yearly, zakat once yearly, hajj once
    a lifetime, walaya every breath. The covenant sits at the apex
    because it is the only one that runs continuously, and the
    continuous one is the one that makes the punctual ones count.
  - >
    The title as doctrine. Disciple comes from discipline, and
    discipline from shari'a. The book's name is the doctrine the
    book teaches — what the seeker becomes is what the discipline
    makes him.
tone_constraints:
  - >
    Walk the source in its own order: the infant analogy and the
    sunna of graduated learning open; the boy asks to be raised; the
    scholar imposes the precondition of knowledge-action-acceptance;
    the five conditions follow; the heaviness of the fifth — the
    father; the period of trial; the meeting arranged; the
    prostration corrected; the key-to-religion analogy; the
    marriage-fornication comparison; the halal-haram comparison; the
    'ahd Allah named; the oath taken; the apple-and-charity
    teaching of Imam Ja'far al-Sadiq; the title-teaches-discipline
    move; the recitation; the tears; the certainty of belonging to
    Hizb Allah.
  - >
    Plain transliteration only — no diacritics. Inline terms used:
    sunna, biryani, shari'a, ta'wil, haqa'iq, tasrif, taqiyya,
    nikah, halal, haram, dhabiha, 'ahd Allah, 'ahd sharif, walaya,
    tahara, salat, sawm, zakat, hajj, Hizb Allah. Use 'Father of
    Imams' or no name when the apex of the lineage is referenced;
    Imam Ja'far al-Sadiq (peace be upon him) is the fifth and
    explicitly named in the source.
  - >
    Quranic citation format: '(chapter N, verse M)' — never '(Q
    N:M)' or '(N:M)'. No Quranic verses are surfaced in the source
    for this episode.
  - >
    Prophet honorific (Salallahu alayhi wa aalihee wa sallam) on
    first per-episode mention if used; contracted to ﷺ thereafter.
    Do NOT pair any leadership-title with the personal name of the
    Father of Imams.
  - >
    Verbatim discipline: the five conditions are listed in the
    source's order and rendered one by one. The
    marriage-fornication analogy, the halal-haram-by-dhabiha
    comparison, and the apple-and-charity teaching are rendered
    with the source's framing intact.
  - >
    End on the night of the oath — the boy's tears, the certainty
    of belonging to the Hizb Allah. Do not flatten the closing into
    a summary; the opening narrative arc lands here, and the next
    section of the book opens on the doctrines this covenant
    licenses.
anchor_passages:
  - >
    "The infant analogy on graduated learning: 'Surely Allah did not
    create his creatures as fully grown adults or scholars. He
    created them as infants — small and ignorant — so that they
    grow big after having been small, and come to know after having
    been ignorant. Their smallness is a precondition for their
    greatness, and their ignorance is a sign pointing toward
    knowledge.'"
  - >
    "The two-condition doctrine on knowledge and action: 'Knowledge
    is of no benefit until it has been put into action, and action
    is of no benefit until it is accepted by Allah. And the only
    thing Allah accepts is sincerity.'"
  - >
    "The five conditions: do not neglect anything entrusted to you,
    nor take anything given to you lightly; do not conceal anything
    when questioned; do not come looking for him whenever you have
    a question; do not ask about anything until he himself brings
    it up; and do not mention him to your father."
  - >
    "The key-to-religion framing: 'There is a key to religion which
    renders it either sacred or profane, like the difference
    between marriage and fornication.'"
  - >
    "The covenant doctrine: 'That key is the pact of Allah, the
    'ahd Allah, which confirms His rights, encompasses His
    obligations and safeguards His friends. It is the rope of Allah
    upon His earth and His guarantee of security among His
    creation.'"
  - >
    "The apple-and-charity teaching of Imam Ja'far al-Sadiq (peace
    be upon him): 'When you stole those apples you earned five
    sins; and when you gave them to the old lady you gained
    another five sins' — because the haram has been propagated to
    another. Total: ten sins, zero rewards."
  - >
    "The graduated ladder of frequencies: 'Tahara and salat five
    times daily, sawm one month yearly, zakat once yearly, hajj
    once a lifetime, and walaya every breath.'"
