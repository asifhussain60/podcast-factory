show_notes:
  blurb: >
    Episode eighteen of *The Master and the Disciple*
    delivers the syllogism the whole book has been
    building toward. Allah cannot be sensed. Allah cannot
    be unjust. Therefore a chain of just witnesses must
    extend Allah's command to creatures who could not
    receive it otherwise. Their existence is Allah's act
    of justice. The chain has rank-order in function but
    equality in reward. The trustee carries the esoteric
    interpretation as a second channel of the same divine
    knowledge that placed the outer book. The chain
    cannot be cut without converting Allah's blessing into
    the withdrawal of the means of worship — which divine
    justice forbids. Abu Malik affirms it as the very
    foundation of justice.
  related_episodes:
    - who-is-allah-beyond-names
    - the-conspiracy-formula
  references:
    - >
      "The Lot–Ishmael–Isaac–through–Abraham example is
      rendered as the source gives it; the chain
      illustrates the rank-order without smoothing it into
      a general theory of prophetic succession."
thesis_relevance: >
  This episode is the central derivation of the book's
  thesis. The claim that true spiritual knowledge reaches
  creation only through an unbroken chain of chosen
  intermediaries is here shown to follow from premises
  the opposing camp itself accepts — that Allah cannot be
  directly sensed and cannot be unjust. Every later
  episode of the book draws on the syllogism this episode
  establishes.
