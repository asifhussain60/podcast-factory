section_index: 1
episode_number: 12
title: Rebirth of the Disciple and the Seven-Day Tawaf
audience: >
  Listeners crossing the threshold from Part Three's
  scholar-disciple dialogue into Part Four's meeting with
  the Sheikh. The episode opens with a sustained sermon
  of praise from the Sheikh — naming Allah's justice as
  the balance between command and prohibition, naming the
  honor of intellect as its use in the search, naming the
  duties of truth as obligatory. Then the Sheikh exposes
  the disciple's self-description, refuses every answer
  that is not a name, and announces the seven-day wait by
  which the new-born is named. On the seventh day the
  disciple is drawn close, taught the realities pens
  cannot write, and brought into a tawaf the source reads
  as the planets orbiting their sun — gravity as love,
  the Imam as the centre. The disciple finally attains
  the object of his desire.
angle: faithful_exposition
episode_format: deep_dive
format_rationale: >
  No opposing named voice runs through this section. The
  Sheikh teaches and the disciple receives; the disciple's
  three short tries at a name are not a contest of
  positions but an exposure that prepares the seven-day
  ritual. One unfolding sequence — sermon, naming, seven
  days, tawaf — without any contested proposition.
  Deep_dive.
essential: core
essential_rationale: >
  Carries the disciple's spiritual rebirth, the seven-day
  rule of naming-after-completion, and the esoteric reading
  of the tawaf as marifa — the recognition of the Imam.
  Without this episode the disciple never meets the Sheikh
  and the doctrine of recognition never receives its image.
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: >
  Mentor delivers the Sheikh's praise of Allah, the
  refusal of each premature name, the seven-day rule of
  honor for the new-born, the cosmology of the seventh
  letter and the seven-stage embryo, the principle that
  the name owns its bearer, and the esoteric tawaf as
  planets orbiting their sun. Student receives the praise,
  offers each premature name (slave-of-Allah; freed-man),
  asks the Sheikh to give him a name, asks whether he
  will own it, and reaches the recognition that completes
  the seven days.
length_target: default_deep_dive
sermon:
  present: true
  section_title: "The Sheikh's opening praise"
key_tensions:
  - >
    The Sheikh's refusal of every premature name. The
    disciple offers what he has — the formula every Muslim
    shares (slave of Allah, son of the slave of Allah);
    then a claim of freedom granted by his teacher. The
    Sheikh exposes the first as a description, not a name,
    and exposes the second as a freedom the teacher has
    no right to give. The exposure is not insult; it is
    the bottom of the cup, after which the seven-day
    ritual begins.
  - >
    Seven as the number of life. The number is not
    arbitrary in the dialogue. The seventh letter of the
    divine fiat kun fa-yakun begins life; the seven-stage
    embryo from the Quran is the model; one cannot name
    something until it is complete. The seven days the
    disciple waits are the same seven days a new-born
    infant is given before naming.
  - >
    The tawaf as gravity. The source reads the seven
    circuits of the House as the planets orbiting their
    sun. The sun symbolizes the Imam or the Kaaba; the
    pilgrims symbolize the planets pulled in by love;
    gravity is the image of marifa, the recognition that
    binds the disciple to the centre.
  - >
    The name owns its bearer. The disciple asks whether
    he will own his new name. The Sheikh refuses: if you
    owned it you would become the one worshiped. The
    name is the owner; you are owned by it; you cannot
    rise beyond your own spiritual rank. The rank defines
    the limit.
tone_constraints:
  - >
    Walk the source in its own order: the Sheikh's full
    praise of Allah as a single recited sermon; the
    naming exchange in three short tries; the announcement
    of the seven-day wait; the cosmology of the seventh
    letter and the seven-stage embryo; the principle that
    the name owns the bearer; the seventh-day ablution
    and finest garment; the closeness and the realities
    pens cannot write; the unbreakable connection; the
    tawaf as the planets orbiting their sun; the
    attainment of the object of desire.
  - >
    Plain transliteration only — no diacritics. Inline
    terms used: tawaf, marifa, Imam, Kaaba, Bab, hurr,
    walid al-akbar. Use the English equivalent where one
    exists. Do NOT pair any leadership-title with the
    personal name of the Father of Imams.
  - >
    Quranic citation format '(chapter N, verse M)' on
    every verse rendered: 41:53 and 23:12-14. Use the
    refined English translation only — never as an
    italic Arabic transliteration run paired with its
    translation.
  - >
    Render the Sheikh's opening praise WHOLE as a
    sustained recital — the listener should hear it as
    the formal sermon it is in the source, not as
    summary. Do not break it into discussion. The
    discussion comes AFTER.
  - >
    Render the naming exchange line by line. The three
    refusals (description not a name; freedom your
    teacher has no right to give; the bowed head with
    no answer) are the movement that earns the seven-day
    wait.
anchor_passages:
  - >
    "Praise be to Allah, who split the dark obscurity of
    hearts with His light, who out of His justice imposed
    upon His creatures only what they could bear. He
    harmoniously balanced His command between the two —
    doing what He commanded and refraining from what He
    forbade — and named it Justice. The honor of people's
    intellect is its use in searching for Allah; among
    the rewards of seeking Him is finding Him; and a sign
    of having found Him is experiencing the sweetness of
    His presence. His distinctive sign is the truth, and
    the duties flowing from that truth are obligatory: We
    will show them Our Signs in the universe and in their
    own selves, until it becomes manifest to them that
    this is the truth (chapter 41, verse 53)."
  - >
    "What is your name? — Slave of Allah, son of the slave
    of Allah. — That is your description, not your name.
    — Then I am the freed man, son of the servant of
    Allah. — Who set you free? — He pointed to the
    scholar. — But if your teacher is owned by another and
    does not own you, has he any right to free you?
    — No. He hung his head, unable to answer. — How can
    we recognize something that has no name, even if it
    has been born? — I have been born to you, so give me
    a name. — That can only happen after the completion
    of seven days, in honor of the new-born infant."
  - >
    "We created the human being from a quintessence of
    clay. Then We made him into a sperm-drop in a secure
    place. Then We made the drop into a clinging clot, and
    We made the clot into a lump, and We made the lump
    into bones, and We clothed the bones with flesh; then
    We brought him forth as another creation. So blessed
    is Allah, the best of creators (chapter 23, verses 12
    to 14)."
  - >
    "Will I own this name? — If you owned it you would
    become the one worshiped. The name is your owner, and
    you are owned by it; for you cannot rise beyond your
    own spiritual rank."
  - >
    "He came to know his master; he held on firmly to the
    unbreakable connection; he circled the House of
    Allah; he completed his pilgrimage through Allah's
    greatest sign. The tawaf simulates the motion of the
    planets orbiting the sun. The sun symbolizes the
    Imam, or the Kaaba; we symbolize the planets, pulled
    in by the gravitational field of the sun — pulled in
    by the love of the Imam, by the love of Allah. Love
    is symbolized by gravity. Thus the young man finally
    attained the object of his desire."
