show_notes:
  blurb: >
    Episode twelve of *The Master and the Disciple* opens
    Part Four. The disciple and the scholar reach the
    Sheikh. The Sheikh begins with a sustained praise of
    Allah — justice as the balance between command and
    prohibition, the honor of intellect as its use in
    the search, the duties of truth as obligatory, the
    signs to be shown in the cosmos and in the self.
    Then he turns to the disciple and refuses every name
    offered until the disciple has no answer left. A name,
    he says, can only be given after seven days, in honor
    of the new-born infant; the universe itself received
    its life from the seventh letter, and the embryo
    passes through seven stages before another creation
    is brought forth. On the seventh day, after ablution
    and a fresh garment, the disciple is drawn close,
    taught the realities pens cannot write, and brought
    into a tawaf the source reads as the planets orbiting
    their sun — the Imam as the centre, gravity as love,
    marifa as the orbit in which the planet's life is
    held.
