      "The Father of Imams' ruling on the thirsting woman is
      cited from the time of the second caliph; the verse
      invoked is the verse of necessity, which the source
      names by phrase rather than by chapter-and-verse, so
      the episode renders it without an invented reference."
thesis_relevance: >
  This episode advances the book's central claim — that true
  spiritual knowledge reaches creation only through an
  unbroken chain of chosen intermediaries — by establishing
  the union of inner and outer as the only living form of the
  doctrine the chain transmits, and by grounding the
  acceptance of the unequal seeker in the doctrine of divine
  justice on an identical instrument. Without the union, the
  chain becomes a chain of secrets; without divine justice in
  acceptance, the chain becomes the property of an elite few.

