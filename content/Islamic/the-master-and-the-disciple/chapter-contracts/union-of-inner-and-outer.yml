show_notes:
  blurb: >
    Episode ten of *The Master and the Disciple* answers the
    question every reader of esoteric doctrine must ask. If
    the inner is everything, what becomes of the outer — of
    prayer, of fasting, of the daily obligations of shari'a?
    The scholar answers in three movements. First the union
    of inner and outer as a single living religion: the
    seeker who keeps only the inner is fruit rotting before
    ripening; the one who keeps only the outer is a body
    without spirit, numbered among the dead; only their
    union is faith, and for the believer this world becomes
    licit. Second the pale faces of the true scholars: not a
    refusal of the world but the body's record of vigilant
    attention to the next, distracted from luxury by
    reflection and engrossed in the sweetness of Allah's
    remembrance. And third the doctrine of divine justice
    in acceptance: the instrument of knowledge is identical
    in every chest; the difference is in what each seeker
    does with it. The episode closes with mercy under
    necessity, told through the thirsting woman in the time
    of the second caliph and the Father of Imams' ruling
    that the verse of necessity left her free of sin.
