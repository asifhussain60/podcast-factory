title: Purifying Possessions and Parting from the Master
audience: >
  Listeners reaching the closing movement of Part Three of
  *Kitab al-Alim wa al-Ghulam*. The doctrine has been laid
  down; the question now is the most concrete the disciple
  can ask — what do I do with what I own? The scholar gives
  a rule of lawful acquisition, zakat from the whole, and
  khums from the finest portion. The disciple surprises him
  by having already divided his possessions into five
  portions, each with its own pedagogical weight. The scholar
  refuses his own portion and redirects the purification
  portion to the Imam as a trust. He travels to consult his
  own master, the Sheikh, who instructs him to bring the
  disciple back at once. And when he returns he finds the
  disciple pale and weak — the source giving the cause its
  name, ishq, the extreme love a lover suffers in separation
  from the beloved. The dialogue ends with the journey
  beginning.
angle: faithful_exposition
episode_format: deep_dive
format_rationale: >
  No opposing named voice runs through this section. The
  disciple proposes a five-portion economy and the scholar
  refines and redirects it; the scholar then narrates his
  travel to the Sheikh and his return. One unfolding sequence
  of teaching-then-redirection-then-departure-then-return,
  with no contested proposition. Deep_dive.
essential: core
essential_rationale: >
  Carries the dialogue's closing arc — the five-portion
  economy, the scholar's refusal of his own portion, the
  redirection of the purification portion as a trust for the
  Imam, the Sheikh's authorization of the disciple's
  trajectory, and the naming of the disciple's pallor as
  ishq. Without this episode the dialogue between scholar
  and disciple has no ending and no handoff to the journey
  that follows.
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: >
  Mentor delivers the rule of possessions (lawful
  acquisition; zakat; khums; spending the rest); receives
  the disciple's five-portion economy; refuses his own
  portion; redirects each portion (brothers by hand;
  atonement as remembrance; gratitude as trust;
  purification as trust for the Imam); narrates his travel
  to the Sheikh; returns; names the disciple's pallor as
  ishq and announces the journey; Student offers the
  five-portion economy, asks who the Imam is, confesses the
  cause of his pallor in separation, and sighs almost to
  the loss of his spirit at the announcement of the
  journey.
length_target: default_deep_dive
key_tensions:
  - >
    The scholar's refusal. The disciple has set aside a
    portion for the man in front of him; the scholar weeps
    and refuses it, having fled the conflicts and
    temptations of wealth. The closing move is not the
    scholar receiving but the scholar redirecting.
  - >
    The five-portion economy versus the three-line rule.
    The scholar gives a clean three-line rule; the disciple
    has already worked out a five-portion economy with
    distinct pedagogical roles for each portion. The scholar
    accepts the disciple's elaboration and refines it
    rather than overriding it — a small lesson on how
    received teaching is met by lived discipline.
  - >
    Pallor as ishq. The previous episode named pallor as
    the body's record of vigil over the next world; this
    episode names a different pallor whose cause is
    separation from the channel through which the inner has
    reached the disciple. The source gives this cause its
    name and the dialogue treats it as the doorway to the
    journey, not as illness.
tone_constraints:
  - >
    Walk the source in its own order: the disciple's
    question on possessions; the scholar's rule (lawful
    acquisition; zakat from the whole; khums from the
    finest portion you love most; remainder to family and
    surplus to the needy); the disciple's five portions
    (zakat; kafara as remembrance of sin; shukr as trust
    until maturity; brothers by hand; the scholar's
    travels); the scholar's tears; the refusal of his own
    portion with the I-have-fled-wealth line; the
    redirection of each portion; the redirection of the
    purification portion as a trust for the Imam; the
    naming of the Imam (rightful judge, keys of the gardens,
    guide of angels — ma'alim al-malakut — palms revealing
    the light of the mountain of Sinai); the scholar as the
    Imam's spiritual son and one of his beautiful works
    (hasana min hasanatihi); the scholar's departure to the
    Sheikh — walid al-akbar; the Sheikh's reading of the
    disciple's qualities; the Sheikh's instruction (gateway
    of loving kindness in his own time); the return; the
    disciple pale and weak; the cause as ishq; the
    scholar's reassurance; the announcement of the journey;
    the disciple's heavy sigh of joy and awe.
  - >
    Plain transliteration only — no diacritics. Inline
    terms used: zakat, khums, kafara, shukr, ishq, ma'alim
    al-malakut, tur, hasana min hasanatihi, walid al-akbar,
    Imam, Bab. Do NOT pair any leadership-title with the
    personal name of the Father of Imams.
  - >
    Quranic citation format '(chapter N, verse M)' if any
    verse is surfaced; this episode surfaces none from the
    source.
  - >
    Verbatim discipline: render the disciple's five
    portions intact, each with its named pedagogical role;
    render the scholar's tears and refusal whole; render
    the redirection of each portion; render the Imam-as-
    rightful-judge naming; render the Sheikh's instruction
    word-for-word; render the disciple's confession of his
    pallor and the source's naming of ishq; render the
    closing sigh.
anchor_passages:
  - >
    "The rule of possessions: take only what was lawfully
    acquired, in which no one was wronged; take out zakat
    from the whole; then purify it by taking one-fifth from
    its finest portion that you love most and spending it
    on those most deserving. 'You purify your possessions
    through charity just as you purify your body through
    righteous acts. Righteous acts are a protection; charity
    is a purification.'"
  - >
    "The disciple's five portions: one for purification
    (zakat); one for atonement (kafara) for harm done to his
    soul, kept so he keeps remembering his sins and avoids
    complacency; one in gratitude (shukr) for knowledge
    acquired, held as a trust until spiritual maturity; one
    for the needy among his brothers, given by his own hand
    so they recognize his generosity; and one to support the
    scholar in his travels."
  - >
    "The scholar's refusal: 'I have no need of it; I have
    left behind worldly possessions and fled from the
    conflicts and temptations of wealth.'"
  - >
    "The redirection: keep the purification portion entrusted
    to him by its rightful master — until you meet him; for
    he is the most rightful judge, for you and against you.
    Asked who that noble person was, the scholar spoke of
    the Imam — the one whose right Allah has made
    obligatory upon every believer, in whose hands are the
    keys of the heavenly gardens, the guide of angels
    (ma'alim al-malakut), whose palms reveal the light of
    the mountain of Sinai."
  - >
    "The scholar's filiation: 'I am his spiritual son, and
    one of his beautiful works — hasana min hasanatihi —
    constantly seeking his satisfaction and fearing his
    wrath.'"
  - >
    "The Sheikh's instruction: 'Hurry back with this young
    man, for I desire for him to become a gateway of loving
    kindness that Allah may open for the people of his
    time.'"
  - >
    "The disciple's pallor named: 'That is from the
    desolation and grief that overcame me after you left.
    Your separation made me lonely; and the fear of not
    being able to meet you again made me sick.' These
    descriptions are descriptions of extreme love — this is
    ishq, what love does to a lover parted from his
    beloved."
  - >
    "The scholar's reassurance and the journey announced:
    'Allah knew what was in your heart, so He made your
    trial easy and placed a special loving mercy in the
    heart of His friend for you. Start preparing for your
    journey, for I am taking you to the doorstep of your
    ultimate goal — and there is no power but through Allah.'"
