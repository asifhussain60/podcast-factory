show_notes:
  blurb: >
    Episode eleven of *The Master and the Disciple* closes
    the dialogue between scholar and disciple. The
    disciple's question is the most concrete he has asked:
    what do I do with what I own? The scholar gives a
    rule — lawful acquisition; zakat from the whole; khums
    from the finest portion you love most; the rest for
    family with the surplus to the needy. The disciple
    surprises him by having already divided his possessions
    into five portions with pedagogical weights — zakat;
    atonement kept as remembrance of sins; gratitude held
    as a trust until maturity; brothers' portion given by
    his own hand; and a portion to support the scholar.
    The scholar weeps and refuses his own portion,
    redirecting each of the others and turning the
    purification portion into a trust for the Imam — named
    here as the rightful judge whose hands hold the keys of
    the gardens and whose palms reveal the light of Sinai.
    Then the scholar travels to consult the Sheikh, his own
    spiritual father, who instructs him to hurry back
    because the young man is to become a gateway of loving
    kindness in his own time. And when the scholar returns
    he finds the disciple pale and weak with longing —
    ishq, the source names it, extreme love at separation
    from the beloved. The scholar announces the journey,
    and the disciple sighs so deeply with joy and awe that
    his spirit almost leaves his body.
  related_episodes:
    - union-of-inner-and-outer-and-divine-justice
    - three-levels-of-knowledge
  references:
    - >
      "The naming of the disciple's pallor as ishq is the
      source's own classical vocabulary for the
      lover-in-separation, distinct from clinical illness;
      the episode renders the source's reading without
      transposing it into modern terms."
thesis_relevance: >
  This episode advances the book's central claim — that true
  spiritual knowledge reaches creation only through an
  unbroken chain of chosen intermediaries — by closing the
  scholar-disciple dialogue with the redirection of the
  disciple's purification portion to the Imam as the
  rightful master, by the Sheikh's authorization of the
  disciple's trajectory as a future Bab, and by the
  disciple's longing-as-ishq becoming the doorway to the
  journey toward the doorstep of his ultimate goal. Without
  this episode the chain has no human handoff between the
  doctrine taught and the journey to be taken.

