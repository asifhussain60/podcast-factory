show_notes:
  blurb: >
    Episode nine of *The Master and the Disciple* takes
    apart the line every Muslim recites in difficulty: there
    is no power and no strength except through Allah. The
    disciple offers the common readings — hawl as "a year,"
    quwwa as "mules" — and the scholar walks them into
    absurdity before opening the inner meaning. Hawl is the
    Imam who converts the Creator's speech into the words of
    wisdom that human beings can hear; quwwa is the Bab who
    bears the divine speech in its condensed, all-inclusive
    form and distributes it to the Du'at in the form each
    can carry. The formula is the confession of an entire
    chain that is itself dependent at every link. Then the
    same architecture is read out of two of the great dreams
    of Surat Yusuf — Joseph's eleven stars and the sun and
    the moon (chapter 12, verse 4) and the king's seven fat
    cows and seven green ears — and the cosmology of Part
    Two is heard inside Part Three's formulae and dreams.
