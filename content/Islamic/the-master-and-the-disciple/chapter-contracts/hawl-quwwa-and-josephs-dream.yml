      "The two Quranic verses from Surat Yusuf surfaced here
      are Joseph's dream (chapter 12, verse 4) and the
      brothers' clan line (chapter 12, verse 8). Both are
      read as the chain of chosen ranks rather than a family
      drama."
thesis_relevance: >
  This episode advances the book's central claim — that true
  spiritual knowledge reaches creation only through an
  unbroken chain of chosen intermediaries — by reading the
  daily formula la hawla wa la quwwata illa billah as the
  confession of the entire chain (Imam as hawl, Bab as
  quwwa), and by re-reading Joseph's dream and the king's
  dream as the same architecture in narrative register.
  Without this episode the chain has no scriptural-formula
  signature in everyday recitation.
