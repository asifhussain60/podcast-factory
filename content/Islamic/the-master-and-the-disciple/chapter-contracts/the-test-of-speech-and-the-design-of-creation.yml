      all the names,' quoted in the sermon as the establishment of
      the chosen ones as custodians of the knowledge."
thesis_relevance: >
  This episode advances the book's central claim that true spiritual
  knowledge reaches creation only through an unbroken chain of
  chosen intermediaries, and becomes sacred only under the covenant
  of walaya to the Imam, by carrying the design-of-creation sermon —
  the cosmological statement that licenses the entire doctrine — and
  by naming the hearing-sight-heart instrument by which the chain
  is actually used. The zahir-batin distinction as preservation
  principle is the load-bearing cosmology behind the covenant the
  next episode takes.

