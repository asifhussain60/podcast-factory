show_notes:
  blurb: >
    Episode two of *The Master and the Disciple* picks up the
    Persian scholar at the far edge of al-jazira. He enters a city
    where nobody knows him, sits out of sight to listen to a group
    of townspeople debate religion without a guide, and picks them
    — for three precise reasons — as deserving of life: the hujja
    has reached them; they belong to the milla; and they are already
    inquiring. They test his speech, and he passes the test by
    refusing authorship: 'I have no words of my own, for I am
    following the words of another.' Recognized as a gateway, he
    rises and delivers the great design-of-creation sermon, the
    book's central cosmology, in which the outer and the inner are
    named as a deliberate mechanism of preservation rather than a
    textual layer. The episode then turns to the instrument by which
    the listener uses the chain — hearing, sight, and the heart,
    named together in four Quranic verses as gift, as sealed, as
    covered, and as the very things by which Allah will hold the
    listener to account. The episode lands on the youngest of the
    group following the scholar to his inn — the disciple chosen.
