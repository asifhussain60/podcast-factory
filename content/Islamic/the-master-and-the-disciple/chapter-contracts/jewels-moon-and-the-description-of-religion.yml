title: Jewels, the Moon, and the Description of Religion
audience: >
  Listeners following the closing movement of Part Four's
  great debate. Abu Malik invites Salih to state his
  arguments — words of wisdom are like jewels — and
  Salih accepts the image with one condition: it works
  only where there is no confusion between real jewel
  and forged glass. He tells the story of how his own
  former faith was exposed as forged glass by the
  jewelers — those who receive divine knowledge from the
  heavens — and refuses the standing of any religion
  grounded only in transmitted reports. The example is
  moon-sighting, whose hadith has turned into the hadith
  of moon-fighting. Salih recovers the true meaning of
  "follow the moon" as the designation of the wasi the
  Messenger was leaving behind, cites the Quran on the
  fixed paths of sun and moon, and brings Abu Malik to
  the confession that sharia has been corrupted. Then
  Salih gives his description of religion — veil, rope,
  handhold, ark, ship, light, protected knowledge,
  jewels with their signs — which Abu Malik accepts as
  the essential meaning the religion of his world has
  lost.
angle: faithful_exposition
episode_format: debate
format_rationale: >
  Two named voices remain on stage — Salih and Abu
  Malik — in sustained back-and-forth on a discernible
  proposition: what counts as religion and where its
  signs are read. Abu Malik concedes the corruption of
  sharia in his own voice, accepts the description of
  religion as its essential meaning, and asks for the
  reality of which the description is the picture. The
  resolution enum is host_b_concedes.
essential: core
essential_rationale: >
  Carries the source's recovery of "follow the moon" as
  the designation of the wasi and the source's
  description of religion as veil, rope, handhold, ark,
  ship, light, and protected knowledge — the seven-image
  description that everything in the closing part of
  the book will rest on. Without this episode the moon
  argument is missing and the description of religion
  has no statement.
host_dynamic: advocate + arbiter
host_dynamic_rationale: >
  Advocate voices Salih — the condition under which the
  jewels-and-sunlight image holds; the story of the
  jewelers' verdict on his former faith; the principle
  that spiritual knowledge must be presented to those
  who receive it from the heavens; the refusal of
  religion grounded only in transmitted reports; the
  moon-sighting confusion and the recovery of "follow
  the moon" as the designation of the wasi; the Quran's
  fixed paths for sun and moon; the divorce case study;
  the dissolution of Abu Malik's religion=sharia
  equivalence; the seven-image description of religion.
  Arbiter voices Abu Malik — the opening jewels image,
  the question about who can be the people of divine
  knowledge after the prophets, the confession that
  sharia has been corrupted, the acceptance of the
  description as the essential meaning religion would
  have to have, and the request for the reality of
  which the description is the picture.
resolution: host_b_concedes
length_target: longer
key_tensions:
  - >
    Jewels and forged glass. Abu Malik's opening image
    is graceful — wisdom is what does not lose worth in
    the dark. Salih accepts it on one condition: it
    works only where there is no confusion between real
    jewel and forged glass. The episode is the
    application of that condition to the religion of
    Abu Malik's community.
  - >
    Transmitted reports versus the unity of religion.
    Religion is one and purely upholds what is due to
    Allah without difference; transmitted reports all
    differ and deny one another. A religion built only
    on differing reports cannot be religion. The
    moon-sighting controversy is the working case.
  - >
    Follow the moon. The Messenger's instruction "follow
    the moon" was a designation of the wasi — the moon
    as the established symbol, the wasi who follows the
    sun's path. The community collapsed the symbol into
    the disc out of hatred and jealousy for the
    Father of Imams, and produced the calendar chaos
    that follows. The Quran's own description of sun
    and moon on fixed calculated paths witnesses
    against the chaos.
  - >
    Religion is not the same as sharia. Abu Malik
    placed religion and sharia at the same level —
    commands, prohibitions, prophetic traditions — and
    so the corruption of sharia he has just admitted is
    the corruption of religion itself. Salih dissolves
    the equivalence and gives his own seven-image
    description.
tone_constraints:
  - >
    Walk the source in its own order: Abu Malik's
    jewels-and-sunlight image; Salih's condition (no
    confusion between real jewel and forged glass); the
    story of the jewelers' verdict on the former faith;
    the principle of presentation to those who receive
    divine knowledge from the heavens; Abu Malik's
    question (who can these people be after the
    prophets?); Salih's reframing (religion cannot be
    grounded only in transmitted reports); the moon-
    sighting example with the hadith-of-moon-fighting
    line; the recovery of "follow the moon" as
    designation of the wasi, with the wasi/natiq
    symbolism (moon for wasi, sun for natiq) and the
    Messenger's generic formula ("in all matters of
    your life, follow Ali"); the collapse of the
    symbol out of hatred and jealousy for the Father
    of Imams; the Quran's "a fixed number of days"
    (chapter 2, verses 183-184) and "the sun and the
    moon follow precisely calculated paths" (with the
    husban/hisab gloss); the divorce case study; Abu
    Malik's concession that sharia has been corrupted;
    Salih's drawing-out of Abu Malik's religion=sharia
    equivalence and the dissolution of his ground;
    Salih's description of religion (veil; rope from
    heavens to earth; firm handhold; ark of divine
    presence; ship of salvation; light of life;
    well-protected knowledge; jewels with distinctive
    signs); Abu Malik's acceptance and request for the
    reality.
  - >
    Plain transliteration only — no diacritics. Inline
    terms used: hadith, Ramadan, Eid, wasi, natiq,
    sharia, urwa wuthqa, sakina, safina, husban, hisab,
    haram. Always use the English equivalent where one
    exists. Do NOT pair any leadership-title with the
    personal name of the Father of Imams; always say
    "Father of Imams" rather than the forbidden phrase.
  - >
    Quranic citation format '(chapter N, verse M)' on
    every verse rendered — 2:183-184 (a fixed number of
    days) and the verse on the calculated paths of the
    sun and moon. Use plain refined English; do NOT
    pair an italic Arabic transliteration with its
    translation.
  - >
    Verbatim discipline: render the jewels-and-sunlight
    image; render the principle of presentation to the
    receivers of divine knowledge; render the line on
    religion being one while reports differ; render
    "follow the moon" as designation of the wasi; render
    the husban gloss; render the divorce case study;
    render Abu Malik's "by my life" concession; render
    Salih's seven-image description of religion whole;
    render Abu Malik's closing line about essential
    meaning and the reality.
anchor_passages:
  - >
    "Words of wisdom are like jewels — observed in the
    sunlight they sparkle; left alone, they do not lose
    value. — Yes, but only where there is no confusion
    between a real jewel and forged glass."
  - >
    "Spiritual knowledge cannot be accepted as genuine
    until it has been presented to those who receive
    divine knowledge from the heavens; only if they
    accept it can it be deemed genuine."
  - >
    "Every religion in which worship is based solely on
    transmitted reports should not be named religion at
    all. For religion is one, purely upholding what is
    due to Allah without difference; while transmitted
    reports all differ from and deny one another."
  - >
    "When the Messenger of Allah was asked, before
    Ramadan, who do we follow when you are gone, he
    answered: follow the moon — meaning follow the wasi,
    since the moon is the established symbol of the
    wasi, just as the sun symbolizes the natiq. He used
    the moon as a generic formula — in all matters of
    your life, follow Ali — not limiting it to Ramadan,
    because the moon consistently follows the same path
    across the sky as the sun. The ancient Arabs were
    capable of understanding this symbolism, but out of
    hatred and jealousy for the Father of Imams they
    reduced it to the literal physical moon, producing
    the present chaos."
  - >
    "The Quran calls the days of fasting a fixed number
    of days (chapter 2, verses 183-184) and declares,
    The sun and the moon follow precisely calculated
    paths. Husban is the superlative of hisab —
    calculation: they never deviate, which is exactly
    what makes a fixed lunar calendar possible."
  - >
    "By my life, sharia has been corrupted and rendered
    ineffectual, and we are only clinging to the name
    of religion. So what is the state of religion in
    your opinion?"
  - >
    "Religion is the veil Allah has strengthened against
    those who sow corruption, its gates opened to those
    seeking truth. It is a rope extending from the
    heavens to the earth, continuous and without
    breakage; the firm handhold of those who adhere to
    Allah; the ark of the divine presence; the ship of
    salvation; the light of life. Its knowledge is
    well-protected, and its jewels have their
    distinctive signs."
  - >
    "If Allah has a religion by which He is worshiped,
    and a day for His rewards and punishments, then
    indeed this would be its essential meaning. But
    what about the reality of what you have described?"
