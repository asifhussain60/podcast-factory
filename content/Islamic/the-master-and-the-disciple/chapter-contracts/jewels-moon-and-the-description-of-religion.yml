show_notes:
  blurb: >
    Episode sixteen of *The Master and the Disciple*
    closes the great debate of Part Four. Abu Malik
    invites Salih to state his arguments under the
    image of wisdom as jewels in the sunlight; Salih
    accepts the image with one condition — it holds
    only where there is no confusion between real
    jewel and forged glass. The story of the
    jewelers' verdict on his former faith leads to
    the principle that spiritual knowledge must be
    presented to those who receive it from the
    heavens before it can be deemed genuine. Abu
    Malik asks who, after the prophets, such people
    can be; Salih answers by refusing the standing of
    any religion grounded only in transmitted reports.
    The example is moon-sighting. The hadith of moon-
    sighting has turned, Salih says, into the hadith
    of moon-fighting. The Messenger's instruction
    "follow the moon" was the designation of the
    wasi the community was to follow — the moon as
    the established symbol, the wasi who follows the
    sun's path — and the community collapsed the
    symbol into the disc. The Quran's own description
    of the sun and moon on fixed calculated paths
    witnesses against the chaos. A divorce case
    study — a man left not knowing whether he is
    married or divorced — brings Abu Malik to the
    confession that sharia has been corrupted. Salih
    dissolves the religion=sharia equivalence by
    which Abu Malik had been holding what was left
    and gives his own description of religion: the
    veil, the rope from the heavens, the firm
    handhold, the ark of the divine presence, the
    ship of salvation, the light of life, the well-
    protected knowledge, the jewels with their
    distinctive signs. Abu Malik accepts the
    description as the essential meaning religion
    would have to have and asks for the reality of
    which the description is the picture. The way is
    opened for the final part of the debate.
  related_episodes:
    - emptying-the-cup
    - abu-malik-arrives-and-the-fair-inquiry
  references:
    - >
      "The recovery of 'follow the moon' as the
      designation of the wasi is the source's own
      esoteric reading; the episode renders the
      reading as given, including the symbolism of
      moon-for-wasi and sun-for-natiq, without
      transposing the symbolism into modern
      categories."
thesis_relevance: >
  This episode advances the book's central claim — that
  true spiritual knowledge reaches creation only through
  an unbroken chain of chosen intermediaries — by
  refusing the standing of any religion grounded only in
  transmitted reports, by recovering the moon-saying as
  the designation of the wasi at the head of the chain,
  and by giving the source's own seven-image description
  of religion as the veil, rope, handhold, ark, ship,
  light, and protected knowledge through which the
  chain extends from the heavens to the earth.

