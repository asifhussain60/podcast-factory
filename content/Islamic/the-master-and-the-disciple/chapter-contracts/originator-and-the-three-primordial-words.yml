show_notes:
  blurb: >
    Episode four of *The Master and the Disciple* begins the
    doctrinal core of the book with the architecture of creation
    laid down with mathematical precision. The scholar starts with
    what kind of First Allah is — Originator without template,
    first of every first, inheritor of all existence. He names the
    three primordial words that fall from the first Light: will,
    command, speech — densifying as they descend. From those three
    words come seven principles: air the unpaired first and king,
    then water, darkness, and physical light, then their denser
    pairs of smoke, mud, and fire. From smoke come the seven
    heavens; from mud the seven earths. And the letters give the
    numerical signature: seven in the command kun fa-yakun, twelve
    in the three primordial words — stamped into the cosmos as
    seven heavens, seven oceans, seven days; twelve zodiacs, twelve
    regions, twelve hours of day and twelve of night. The signature
    of cosmology turns out to be the letter-count of its own
    genesis.
