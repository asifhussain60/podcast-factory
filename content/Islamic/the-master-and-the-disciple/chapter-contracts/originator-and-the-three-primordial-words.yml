      "Sayyidina Ja'far ibn Mansur al-Yaman — the tenth-century
      Ismaili author of *Kitab al-Alim wa al-Ghulam*, who frames the
      cosmology of Part Two as a derivation from letter-counts and
      densification rather than as a description of natural processes."
thesis_relevance: >
  This episode advances the book's central claim — that the spiritual
  structure by which Allah reaches creation is a precise architecture
  rather than a vague mysticism — by laying its foundations: the
  Originator without precedent, the three primordial words densifying
  into seven principles, and the mathematical signature of sevens and
  twelves stamped into the cosmos. Every later move — the Bismillah
  seal, the chosen ranks, the seven Natiqs, the Air, the Instance —
  reads this foundation as its load-bearing slab.

