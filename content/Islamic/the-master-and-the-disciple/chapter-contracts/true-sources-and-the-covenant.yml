thesis_relevance: >
  This chapter advances the book's central claim that true spiritual
  knowledge reaches creation only through an unbroken chain of chosen
  intermediaries received under allegiance, by installing the entire
  scaffolding the rest of the book operates on: the three-stage path
  carried by remembrance, the two-layer cosmic design that preserves
  the inner meaning behind the outer form, the Quranic triad of
  faculties through which a person becomes accountable, and the
  covenant of allegiance to the Father of Imams that renders religious
  action sacred rather than structurally stolen.
