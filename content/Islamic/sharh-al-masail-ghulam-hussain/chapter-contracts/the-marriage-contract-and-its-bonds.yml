  references:
    - The counsel that no marriage be made until the discerning of their age have chosen, with the ages matched at around eighteen.
    - The suspension of that rule where the state cannot keep order and households are looted.
    - The author's own argument for marrying inside the community, and his programme for educating girls as the first school their children have.
    - The instruction that the women of the believers draw their outer garments close about them, and the defence of the veil as a general ruling of the Quran.
    - Abu Ja'far al-Salih on the man with no lawful choice but his own kin, and on the dissolute woman.
    - The prophetic permission to look at the woman one intends to marry, and the Father of Imams on the first look, the second and the third.
    - The narration on seeking permission before entering upon one's own family.
    - The etiquette of the proposal, with Sakina bint Handhala and with Umm Salamah, the daughter of Abu Umayyah ibn al-Mughirah.
    - The four guardians, the appointment of an agent with two witnesses, and the judge's power where a guardian refuses without cause.
    - Mawlana Ja'far al-Sadiq on conditions that violate the Quran or contradict the Sunnah.
    - The verse on nushuz, read for the clause that ends the sequence.
    - The verse permitting a settlement where a woman fears ill-treatment or desertion.
    - The prophetic sayings against exaggerated bride-prices, and the ring given as a marriage gift.
    - The rulings that the mahr is not a pillar of the contract, that a judge sets its amount, and that gifts divide by their timing.
    - The verse that they are a garment for one another, and the address on fearing Allah regarding women.
    - The verse on mates, tranquillity, affection and mercy, and the prayer for comfort to the eyes from spouses and offspring.
    - The two lists of rights — the husband's four, and the wife's single clause of dignity and honour.
    - The categories of nasab and musahara, and the rulings against combining two sisters, and aunt with niece.
    - The hadith that breastfeeding creates the same prohibitions as birth, the two-year limit, and the definition of complete nursing as three days or ten sucklings.
thesis_relevance: 'This chapter advances the book''s central claim that the whole of ordinary life is governed by knowable rulings, so that daily conduct is itself the field of religious obedience, by taking the most intimate decision a person makes and showing it to be almost entirely a matter of law rather than of preference — the age, the choosing, the guardian, the witnesses, the stipulations, the payment and the mutual rights all settled in advance, and a body of prohibitions that binds whether or not anyone intended it.

  '
