title: The Marriage Contract and Its Bonds
audience: 'Thoughtful adult listeners who have heard the treatise argue that a person ought to marry and now meet the machinery that decision runs through — an age and a choosing that belong to the discerning people of the household rather than to the couple, a contract that is void unless the right person concludes it, a payment deliberately kept small and kept the wife''s, and a body of prohibitions that cannot be complied with, only discovered.

  '
angle: faithful_exposition
angle_note: 'The source is a rulings treatise and the episode exposes what it teaches, articulating compressed and damaged passages into clear modern English without adding doctrine, outside authorities, or reasoning the text does not supply. Two stretches are the author speaking about his own period and community — the argument for marrying inside the community, and the complaint that critics of the veil dress their criticism in belief — and both are presented as his reckoning rather than adjudicated. Where transmission has broken down the recoverable teaching is rendered and nothing is reconstructed around it.

  '
episode_format: deep_dive
format_rationale: 'One doctrine unfolds layer by layer across the whole slice: that a marriage is constituted and bounded from outside the couple — by the discerning of their age, by the guardian and the witnesses, by the Book that voids a contrary stipulation, by the judge who sets the payment, and finally by kinship the parties did not create and cannot waive. No named opposing voice runs through the slice. The moments that could be mistaken for dispute are not contests: the questions put to Abu Ja''far al-Salih and the question about combining two sisters are cases brought for judgement and answered in a sentence, and the critics of the veil are unnamed and receive no reply of their own.

  '
essential: core
essential_rationale: 'It carries the entire law of how a marriage is formed — capacity, guardianship, witnesses, stipulations, payment, mutual rights, and the forbidden degrees including milk-kinship — on which the next chapter''s material on maintenance and dissolution depends entirely.

  '
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: 'Mentor and student: the scholar_companion carries the rulings on age and guardianship, the conditions and the mahr, and the long body of nursing prohibitions, while the curious_mind presses the questions a listener actually has — why the choosing is taken away from the two people marrying, why a single glance is lawful and a second is counted against him, and how one swallow of milk can make two people permanently unmarriageable.

  '
length_target: 5500-6000
key_tensions:
  - 'The choosing is removed from the two people most affected by it. Because a bad match ruins a life, the text stipulates that no marriage happen until the wise and discerning of their age have made the choice — and then fixes the meeting point of their ages at around eighteen. The rule is protective in intent and paternal in form, and the treatise does not soften either side of that.

    '
  - 'The rule against early marriage is suspended by the very reasoning that produced it. Where the state cannot keep order and households are looted, marrying a girl young becomes a necessity; where a government governs, there is no cause to rush. The same protective logic yields opposite rulings in different conditions, and the text says so openly.

    '
  - 'The argument for marrying inside the community is made on the ground that a known upbringing is worth more than an unknown face, and its conclusion is a programme for educating girls — because a wife will be the first school her children have. The same passage turns harsh against marriage outside, and the author reckons with his own community rather than with outsiders. Present it as his argument from his own period; do not adjudicate it.

    '
  - 'The husband''s authority is granted and bounded in the same breath. Four powers are named and every one of them is qualified by fairness and kindness; the judge is denied the power to impose a ransom divorce or remove a husband from the home, and the husband is denied any striking not legally obligatory. The verse on discord is quoted as the boundary of what he may do, with its closing clause read as the operative one.

    '
  - 'The marriage payment is deliberately small and deliberately the wife''s. A ring will serve, inflating it is named a cause of enmity, the amount is set by a judge rather than by the man paying it, and everyone who might intercept it is told it is not theirs. That the payment is not one of the pillars of the contract is what settles what it is.

    '
  - 'The forbidden degrees run on a different principle from every other ruling in the chapter. A marriage with two witnesses present is impossible because of who the woman is; the husband''s intention is declared irrelevant; and a nursing arranged by adults binds children who never consented to it. One swallow inside two years is enough to create the bond, and three consecutive days or ten sucklings is what it takes to prove.

    '
  - 'The two lists of rights at the close are asymmetric — four specific restraints named as the husband''s greatest rights, and a single clause of dignity and honour as the wife''s. The text does not comment on the asymmetry. Name it and do not resolve it.

    '
tone_constraints:
  - 'The opening hook (how much milk it takes to make two people permanently unmarriageable) is rhetorical and must land before any exposition. Do not open with stage-setting description.

    '
  - 'Walk the material in three movements: the choosing and the look; the contract, its conditions, its payment and its mutual rights; then the forbidden degrees, ending on milk-kinship.

    '
  - 'Do not re-teach the call to marry, the counsel on choosing a wife, the dignity of lawful earning, the manners of the table, the boundary of the lawful, the three pillars of sale, riba and the two loans, hire and partnership and the trust, the pledge and the written record, or the shared wall and divided land — all established in the three previous episodes. A one-line callback is the most that is permitted; the written-record doctrine and the purposes of marriage each get exactly one.

    '
  - 'The Father of Imams is named "Father of Imams". Abu Ja''far al-Salih, Mawlana Ja''far al-Sadiq, Mawlana Ja''far ibn Muhammad, Salih, Sakina bint Handhala, Abu Ja''dh Muhammad ibn Ali and Umm Salamah are named as the source names them, damaged forms included, with no reconstruction.

    '
  - 'Arabic terms appear in plain transliteration without diacritics — nasab, musahara, nushuz, raj''ah, mahr, uqiyyas, ihram, hijab. Verses and prophetic sayings are rendered in faithful English only, never as a transliteration run paired with its translation.

    '
  - 'The source names no chapter-and-verse reference for any verse it quotes. Quote them without a numeric reference and do not supply one.

    '
  - 'This slice is badly damaged in transmission. Render what is recoverable, name the damage plainly once in the opening frame, and never bridge a gap with invented material — in particular the enumeration of the protected women, the four guardians, the nine defects, the four divorced women, and the number inside the broken divorce-directive sentence.

    '
  - 'The rulings on slaves, slave girls and wet-nurses are in the source and are rendered as the source gives them, without modernising commentary.

    '
  - 'The verse on discord and the rulings on striking are handled exactly as the treatise handles them — as the boundary of what is permitted, with the return to concord ending the sequence. Neither soften nor sharpen the text.

    '
anchor_passages:
  - 'Marriage is not merely a contract between a man and a woman in the legal sense; it is meant to keep the lineage alive through what is right and just on every side.

    '
  - 'It is sight that falls into the trap of hearing.

    '
  - 'A man and a woman should not marry until the wise and discerning of their age have made the choice, so that each may live well with the other — the meeting point between his age and hers, around eighteen years.

    '
  - 'Tell your wives and daughters and the women of the believers that they should draw their outer garments close about them.

    '
  - 'Look once, and that is for you; the second is against you; and the third is an arrow from the arrows of Satan. Whoever abandons it for the sake of God, God will grant him in its place faith whose taste he will find in his heart.

    '
  - 'Ask permission before entering upon your own family — I fear that if you enter upon her suddenly it may startle her and diminish some of her good deeds toward you.

    '
  - 'If a woman marries through someone other than these four guardians, the marriage is invalid.

    '
  - 'Do not say what your tongues describe — that this is lawful and this is forbidden — inventing lies against Allah.

    '
  - 'Any condition stipulated by the people is neither valid nor enforceable if it violates the Quran or contradicts the Sunnah.

    '
  - 'As for those women from whom you fear nushuz, admonish them, then forsake them in bed, and then strike them — but if they return to obedience, seek no further means against them.

    '
  - 'If a woman fears ill-treatment or desertion from her husband, there is no blame on either of them if they come to a settlement.

    '
  - 'Make peace, and do not exaggerate in the matter of bride-prices, lest enmity result.

    '
  - 'I have nothing to offer as a marriage gift. — This ring is your gift.

    '
  - 'The mahr is not one of the essential pillars of the marriage contract.

    '
  - 'They are a garment for you and you are a garment for them.

    '
  - 'Heed my words: prayer, and right conduct toward those whom your right hand possesses — do not neglect them. Fear Allah regarding women, for they are in your care like captives. You took them in trust by the word of Allah, and it is impermissible to use them as fuel for the Fire.

    '
  - 'He created for you from yourselves mates that you may find tranquillity in them, and He placed between you affection and mercy.

    '
  - 'The best among men is the one who is best to his family.

    '
  - 'Asked about the greatest of the wife''s rights over her husband: that he treat her with dignity and honour.

    '
  - 'O Prophet, We have made lawful for you your wives.

    '
  - 'Breastfeeding creates the same prohibitions as birth.

    '
  - 'If you wish to have your children breastfed, there is no blame on you, provided you pay what you have promised in a fair manner.

    '
  - 'However the milk-kinship arises, the one who has nursed you is forbidden to you.

    '
  - 'Complete nursing is three consecutive days, or ten separate sucklings.

    '
