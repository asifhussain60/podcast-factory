title: Sale, Debt, and the Trust
audience: 'Thoughtful adult listeners continuing a practical explanatory treatise — now meeting its commercial law, where the validity of an agreement turns on whether anything in it was left indeterminate, and where the whole doctrine of lending is decided by what the lender intended rather than by what he charged.

  '
angle: faithful_exposition
angle_note: 'The source is a rulings treatise and the episode exposes what it teaches in the order it teaches it, articulating compressed and damaged passages into clear modern English without adding doctrine, outside authorities, or reasoning the text does not supply. Where transmission has broken down — which is frequent in the second half of this slice — the recoverable teaching is rendered and nothing is reconstructed around it, and the episode says so in its own voice rather than papering over the gaps.

  '
episode_format: deep_dive
format_rationale: 'One doctrine of the transaction unfolds layer by layer: what makes an agreement exist (specification), what makes it righteous (the stronger party taking less), and what happens when the thing held is not owned but entrusted. No named opposing voice runs through the slice. The two moments that could be mistaken for dispute — the creditor offered half against a doubled later share, and the two depositors before ''Umar — are cases brought for judgement, not a contest between parties holding the floor; the text''s one adversarial remark, that most jurists have confused the riba question, is an aside with no named opponent and no reply.

  '
essential: core
essential_rationale: 'This is the treatise''s commercial law — the sale, the loan and the trust — and every later chapter on pledge, marriage and household obligation assumes its account of how an agreement binds.

  '
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: 'Mentor and student: the scholar_companion carries the pillars, conditions and narrations, while the curious_mind presses the questions a listener actually has — why an uncaught fish cannot be sold, and how a religion that forbids taking any increase at all still calls the worldly loan lawful.

  '
length_target: 5500-6000
key_tensions:
  - 'The invalidating flaw in a sale is indeterminacy, not dishonesty. Air, fish in the water, a fetus in the womb, grass in a field, one animal from a herd — all fail for the same reason, that the thing cannot be separated from what is not being sold. Keep this distinct from the fraud rulings; a scrupulously honest sale of an unnamed garment is still void.

    '
  - 'Lending is divided by intention alone, and the two halves are treated oppositely. The loan made for God''s sake is an act of devotion from which no benefit whatever may be drawn; the loan made for worldly benefit is lawful and regulated, and every right the text lists on the lender''s side is a right to take less than he is owed.

    '
  - 'The treatise reads the scriptural declaration of war on usury as pointing toward remission of the debt, not merely regulation of the rate — and concedes outright that most jurists have read the passage otherwise. Do not soften that admission; the text makes it about itself.

    '
  - 'The prohibition is described as arriving when the community was finally strong enough to live by it — after the conquest of Mecca, once Muslims could put their own capital into the market. Guidance waits on capacity.

    '
  - 'In the last third the governing category stops being ownership and becomes trust, and the instinct runs consistently toward the weaker party: the tenant''s word without evidence, no rent for a house never handed over, the working partner shielded from a loss he did not cause, the trustee free of liability for what perished in his honest keeping.

    '
tone_constraints:
  - 'The opening hook (why a book of religion cares whether the fish was still in the water) is rhetorical and must land before any exposition. Do not open with stage-setting description.

    '
  - 'Walk the material in the source''s own order: sale, then loans and riba, then the tail — bankruptcy, hire, partnership, pre-emption, the loan for use, and the deposit.

    '
  - 'Do not re-teach the dignity of lawful earning, the manners of the table, or the boundary of the lawful; these are out of scope here. A one-line callback is the most that is permitted.

    '
  - 'The Commander of the Believers is named by that title standing alone, never paired with a personal name. The Father of Imams is named "Father of Imams".

    '
  - 'Arabic terms appear in plain transliteration without diacritics (riba, zakah, ''ariya). Verses and prophetic sayings are rendered in faithful English only — never as a transliteration run paired with its translation.

    '
  - 'The source names no chapter-and-verse reference for any of the four verses it quotes. Quote them without a reference; do not supply one.

    '
  - 'The second half of the slice is badly damaged in transmission. Render what is recoverable, name the damage plainly once, and never bridge a gap with invented material or invented names.

    '
anchor_passages:
  - 'Do not consume one another''s wealth wrongfully, unless it be through trade conducted with mutual consent.

    '
  - 'The five conditions on the object of sale, and the reason binding them: a thing that cannot be clearly separated from what is not being sold remains indeterminate.

    '
  - 'The forbidden sales — air, fish still in the water, a fetus in the womb, grass still in a field, a figure depicted on an animal''s back.

    '
  - 'The corrupt offer: take one animal from this herd, or ten cubits from this land, or any garment you like from among these.

    '
  - 'The Messenger of God''s prohibition of outbidding — inflating a price by feigning interest with no intention to buy while another wishes to purchase.

    '
  - 'Whatever you give as riba so that it may increase through other people''s wealth does not increase with God; but whatever you give in zakah, seeking God''s face, it is they who will receive manifold reward.

    '
  - 'Riba means increase, but not every increase is forbidden — only the increase accruing on a loan where the lender''s intention is worldly benefit and the principal returns to him with it.

    '
  - 'Eighteen-fold for the bond of brotherhood and twenty-four-fold for the bond of kinship — and no benefit from the principal, small or great, because God has designated such a loan an act of devotion.

    '
  - 'O you who believe, fear God and give up whatever riba remains outstanding. If you do not, be warned of war from God and His Messenger. If the debtor is in hardship, grant him time until he is at ease; and if you remit it as charity, that is better for you, if only you knew.

    '
  - 'The remission of principal in hardship, with ''Abbas ibn ''Abd al-Muttalib and ''Uthman ibn ''Affan named as precedent.

    '
  - 'Gold for gold, silver for silver, barley for barley, date for date, measure for measure — and whoever increases or takes more sins in the taking and the giving alike.

    '
  - 'The public declaration of bankruptcy by the ruler, so that no one loses money lending to a man whose debts have consumed his wealth.

    '
  - 'No rent is owed for however long the tenant was kept out of a house the owner promised and failed to hand over.

    '
  - 'The order of precedence in lending a thing for use: one''s own children, then the closest believers, then the brothers in religion, then the needy and the destitute.

    '
  - 'The hundred dinars and the two depositors: you deposited on the terms that all of you would come together for it — go, bring your companion, and take what is yours.

    '
