  references:
    - The verse permitting the movement of wealth only through trade by mutual consent.
    - The verse contrasting what is given as riba with what is given in zakah.
    - The verse commanding believers to give up what remains of riba and to grant the debtor in hardship time.
    - The verse of the ninth year on the polytheists and the Sacred Mosque.
    - Prophetic prohibitions of the sale of pebbles, of deceptive and uncertain sales, and of outbidding.
    - The renaming of loans by intention, with the eighteen-fold and twenty-four-fold rewards.
    - Mawlana Ja'far al-Sadiq on commerce with a protected non-Muslim.
    - The narration from Mawla Ja'far ibn Muhammad, from his forefathers, permitting partnership in profit.
    - Jabir on the right of pre-emption.
    - The adjudication of the two depositors and the hundred dinars.
thesis_relevance: 'This chapter advances the book''s central claim that the whole of ordinary life is governed by knowable rulings, so that daily conduct is itself the field of religious obedience, by carrying that claim into the commercial arena — showing that the validity of an agreement, the lawfulness of a loan and the liability of a man holding another''s property are each settled by rulings a working person is expected to know before he enters the market.

  '
