title: Maintenance, Dissolution, and Inheritance
audience: 'Thoughtful adult listeners who have followed the treatise from lawful earning through the making of a marriage, and who now meet the obligations that outlive the contract — a household''s daily claim that a husband''s disappearance does not suspend, the several instruments by which a marriage is taken apart under a judge rather than in private, and the law of what leaves a person''s hands by gift, by endowment, by will, and finally by fixed fractions nobody chose.

  '
angle: faithful_exposition
angle_note: 'The source is a rulings treatise and the episode exposes what it teaches, articulating compressed and damaged passages into clear modern English without adding doctrine, outside authorities, or reasoning the text does not supply. Two stretches are the author reasoning in his own voice — the defence of divorce as an institution recognized in earlier revealed laws, and the refusal to accept a staged intervening marriage after the third divorce — and both are presented as his argument rather than adjudicated. The final movement of the slice, the inheritance grid, has broken down in transmission; the recoverable principles are rendered and nothing is reconstructed around them.

  '
episode_format: deep_dive
format_rationale: 'One doctrine unfolds layer by layer across the whole slice: that an obligation created by a contract does not depend on the obligated person being present, willing, or alive — maintenance survives his disappearance, dissolution is carried out by a judge over his head when he will not act, and his wealth is distributed after his death by rules he could shape only within a third. No named opposing voice runs through the slice. The moments that could be mistaken for dispute are not contests: the question put to the judge about divorce, the questions to the scholars about charity given to a recipient who dies before accepting, and the appointment of two family arbitrators are cases brought for judgement and answered in a sentence, with no party holding the floor against another.

  '
essential: core
essential_rationale: 'It carries the whole law of what a marriage obliges after it is made and how it is lawfully ended, together with the treatise''s complete treatment of charity, gift, endowment, will and inheritance — the material the previous chapter''s law of formation exists to lead into.

  '
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: 'Mentor and student: the scholar_companion carries the rulings on the missing husband and the standard of provision, the five forms of dissolution and the counted waiting periods, and the law of gift, waqf, will and prescribed shares, while the curious_mind presses the questions a listener actually has — why a vanished man still owes his wife money, why a written divorce does not count when a written loan does, why the third divorce cannot be undone by an arrangement, and why only a third of an estate is a person''s to direct.

  '
length_target: 5500-6000
key_tensions:
  - 'An obligation is deliberately made independent of the person who owes it. The missing husband is counted among those present for the purpose of his wife''s maintenance, from the day he disappeared; the judge feeds her from his property before he begins looking for him. Absence is not a defence, and poverty is not one either — it is a condition she may consent to live under or refuse.

    '
  - 'Maintenance is drawn broadly enough to cover a woman who does not pray, and narrowly enough to lapse when she withdraws from the marriage. The treatise states both without softening either: piety is not a condition of being fed, and nushuz suspends the claim until she returns.

    '
  - 'The written record, which the treatise made central to debt, is expressly refused as a substitute here. A divorce must be spoken explicitly; the writing and the two witnesses are required as well, and a wink or a gesture is nothing. The same author who insisted a loan be documented insists a marriage cannot be ended by implication.

    '
  - 'Divorce is defended and limited in the same passage. It is recognized in earlier revealed laws, accords with the law of nature, and is the sanction the government of justice imposes on a broken covenant — and it is not a final cure for everything, patience in hardship is better than separation, and the bitterness of parting after intimacy is likened to nakedness after being clothed.

    '
  - 'The third divorce is made irreversible and the obvious workaround is closed by name. The husband has no right to her except through a second marriage that is consummated and then genuinely ends, and the treatise says plainly that going through the motions of remarriage does not qualify. Present the refusal as the author states it.

    '
  - 'A person''s own wealth turns out to be only a third his to direct. Two-thirds belong to the heirs before anything is written; the shroud and the debts come off before that; and what the will does not govern is settled by fixed fractions in a strict order of proximity. The one instrument that escapes the arithmetic is the endowment, which severs the bond of return during the founder''s life.

    '
  - 'The saying that a man goes on receiving wages after his death, so long as good works continue in his name, is what makes the third movement one teaching rather than a change of subject. Name it where the source places it, in the cluster of sayings on charity, and let it carry the endowment and the will.

    '
  - 'The inheritance material is announced in full and delivered in fragments. The verses survive and the grid does not. Report the damage plainly, state the principles that are recoverable, and enumerate nothing the text no longer supports.

    '
tone_constraints:
  - 'The opening hook (what a woman does when her husband simply stops existing) is rhetorical and must land before any exposition. Do not open with stage-setting description.

    '
  - 'Walk the material in three movements: what a household is owed; dissolution and the waiting period; then wealth that leaves a person''s hands, ending on the prescribed shares and the damage.

    '
  - 'Do not re-teach the dignity of lawful earning, the manners of the table, the boundary of the lawful, the three pillars of sale, riba and the two loans, hire and partnership and the trust, the pledge and the written record, the shared wall and divided land, the call to marry, the choosing and the look, the contract and its terms, or the forbidden degrees; these are out of scope here. A one-line callback is the most that is permitted; the written-record doctrine and the mutual obligations of the spouses each get exactly one.

    '
  - 'The Father of Imams is named "Father of Imams", including where the source calls him the son of Talib and where his own testament refers to his sons. Abu Ja''far Muhammad ibn ''Ali al-Salim, Ja''far al-Sadiq, Imam Ja''far al-Sadiq, Imam Abu Ja''far, our master al-Nu''man, our master the judge, al-Hasan ibn Ali, al-Husayn ibn Ali and the sons of Fatima are named as the source names them, damaged forms included, with no reconstruction.

    '
  - 'Arabic terms appear in plain transliteration without diacritics — nafaqa is not used, but nushuz, khul''a, ''iddah, ila'', zihar, li''an, waqf, khums, Shari''ah, Sharia, Banu Hashim and Banu Abd al-Muttalib appear as the source gives them. Verses and prophetic sayings are rendered in faithful English only, never as a transliteration run paired with its translation.

    '
  - 'The source names no chapter-and-verse reference for any verse it quotes, including the two long inheritance verses. Quote them without a numeric reference and do not supply one.

    '
  - 'This slice is damaged in transmission and worst at the end. Render what is recoverable, name the damage plainly in the opening frame and again where the inheritance grid breaks down, and never bridge a gap with invented material — in particular the explanations of ila'', zihar and li''an, the numbered configurations of the eighth class, and the divisions among uncles and aunts.

    '
  - 'The rulings on slaves and freed servants are in the source and are rendered as the source gives them, without modernising commentary.

    '
  - 'The two long inheritance verses are quoted at length because the source quotes them at length; they are the only place the fractional shares survive intact. Do not compress them into a summary of fractions.

    '
anchor_passages:
  - 'A man whose whereabouts are known is not treated as missing but as absent.

    '
  - 'With respect to his wife''s maintenance, the missing man is treated as being among those who are present, from the day he went missing.

    '
  - 'The median standard of living is one that is neither wasteful nor miserly.

    '
  - 'Nothing spent in obedience to God is to be considered wasteful.

    '
  - 'A mother should not be harmed on account of her child, nor a father on account of his child.

    '
  - 'O Prophet, when you divorce women, divorce them at the beginning of their waiting periods — provide for them, and let their matter be dealt with honorably, so that their provision is known and witnessed, and that it is just.

    '
  - 'The bitterness of separation after intimacy is like the parable of nakedness after being clothed.

    '
  - 'Patience in the face of hardship is better than separation.

    '
  - 'The writing is not a substitute for verbal pronunciation; a wink or a gesture does not constitute divorce.

    '
  - 'It is not permissible for you to take back anything of what you have given them — unless both parties fear that they cannot maintain the limits of God.

    '
  - 'If they seek reconciliation, God will bring them together.

    '
  - 'Those of you who die and leave behind wives — they shall wait four months and ten days.

    '
  - 'After the third divorce the husband has no right to her except by her marrying another husband who consummates the marriage and then divorces her or dies — and not through a sham arrangement.

    '
  - 'The example of those who spend their wealth in the way of Allah is like a grain that sprouts seven ears, each ear containing a hundred grains. And Allah multiplies for whom He wills, and Allah is Vast and Knowing.

    '
  - 'A man continues to receive wages after his death, so long as good works continue in his name.

    '
  - 'Whoever gives a gift in perpetuity, seeking the face of Allah and the abode of the Hereafter, has severed the bond of return between himself and that gift.

    '
  - 'The one who gives charity is like one who is delivered and set free.

    '
  - 'He dedicated his wealth for the sake of Allah, allowing no one a path against it — charity binding even after his death, for the near and the distant relatives from Banu Hashim and Banu Abd al-Muttalib.

    '
  - 'The will is a right upon every Muslim.

    '
  - 'What God commands you regarding your children — for the male is the equivalent of two females.

    '
  - 'And if a man or a woman leaves neither parents nor children but has a brother or a sister, then for each of the two is one-sixth.

    '
