  references:
    - The distinction between the missing person and the absent person, and the judge's order of steps when a wife complains of no maintenance.
    - The ruling that the missing husband is counted among the present for his wife's maintenance from the day he disappeared.
    - The median standard of provision, and the household's entitlement to religious knowledge and upbringing.
    - Abu Ja'far Muhammad ibn 'Ali al-Salim on the words of God Almighty, that nothing spent in obedience to God is wasteful.
    - The wife's option where the husband has nothing, and the suspension of maintenance in the case of nushuz.
    - The maintenance of the divorced woman, her entitlement while nursing, and the verse that neither parent be harmed on account of the child.
    - The address on divorcing at the beginning of the waiting periods, with provision known, witnessed and just.
    - The judge's investigation of harm, his power to divorce on the husband's behalf, and the return with renewed kindness.
    - The defence of divorce as recognized in earlier revealed laws, and its limitation by the sayings on patience and on nakedness after being clothed.
    - The five forms of dissolution named by the jurists, with the divorce of the rebellious wife alongside them.
    - The three conditions of 'iddah divorce, the written record with two witnesses, and the requirement of explicit utterance.
    - The sequence of divorces across an intervening marriage, and the count that is not reset.
    - The verse on taking back what was given, the two family arbitrators, and the mechanics of khul'a with the judge's document.
    - The waiting periods — four months and ten days, three cycles, three months, and until birth.
    - The third divorce, the requirement of a genuine intervening marriage, and the refusal of a sham arrangement.
    - The verse of the grain with seven ears, and the two disqualifiers of reminder and harm.
    - Ja'far al-Sadiq on the good neighbor, and on the wages a man receives after death while good works continue in his name.
    - The division of wealth into gift and endowment, with Imam Ja'far al-Sadiq on the severed bond of return.
    - The Messenger of Allah's waqf drawn upon for hospitality, the lifelong grant, and the completion of a charity by receipt.
    - The administration of a waqf — written conditions, administrator, trustee, and the division of benefit.
    - The testament of the Father of Imams, with al-Hasan ibn Ali, al-Husayn ibn Ali, the sons of Fatima, and Banu Hashim and Banu Abd al-Muttalib.
    - Imam Abu Ja'far on the will as a right upon every Muslim, and our master the judge on the bequest of one-third.
    - The order of deductions — shroud, preparation of the body, debt, the third — and the exclusionary layers of heirs.
    - The two long verses of the prescribed shares, and the recoverable principles from the damaged inheritance grid.
thesis_relevance: 'This chapter advances the book''s central claim that the whole of ordinary life is governed by knowable rulings, so that daily conduct is itself the field of religious obedience, by extending that governance past the point where a person''s own will operates — a maintenance obligation that survives his disappearance, a dissolution a judge can complete without him, and a distribution of his wealth in which only a third was ever his to direct.

  '
