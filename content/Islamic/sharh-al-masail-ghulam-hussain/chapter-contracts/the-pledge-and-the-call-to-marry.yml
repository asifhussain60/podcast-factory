  references:
    - The narration of the Messenger of God pledging with a Jewish man of the town for flour.
    - Judge al-Nu'man on the received pledge, and on plurality requiring both means and the power of justice.
    - Mawlana Ja'far al-Sadiq on what may lawfully be pledged and on the owner's retained title.
    - The saying on harm and harm, and the rulings on the fallen wall, the shared doorway, and the roof between two storeys.
    - Mawlana Ja'far al-Sadiq on the three divisions of jointly held land.
    - The verse on spouses, tranquility, affection and mercy.
    - The prophetic sayings that marriage is of the Sunnah and that there is no monasticism in Islam.
    - The exchange with 'Uthman ibn Maz'un on renouncing the world.
    - Mawlana Ja'far al-Sadiq on the man who abandoned women and good food out of fear of God.
    - The verse of Surah al-Nisa' on taking two, three or four, and the condition of equity that reduces it to one.
    - The address to Adam and his wife in the garden, read as mutual protectiveness.
    - The prophetic instruction to choose for one's seed, and the saying on the five things that bring happiness.
thesis_relevance: 'This chapter advances the book''s central claim that the whole of ordinary life is governed by knowable rulings, so that daily conduct is itself the field of religious obedience, by carrying that claim across the boundary from things to persons — settling how a debt is secured and what neighbours owe one another, and then arguing that even the decision to marry, which a pious reader might think a matter of private temperament, is answered by the law and answered against abstention.

  '
