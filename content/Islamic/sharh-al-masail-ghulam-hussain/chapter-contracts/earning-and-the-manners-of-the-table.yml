  references:
    - The verse commanding travel through the earth in search of God's bounty.
    - The verse on feeding the poor, the orphan and the captive for God's sake alone.
    - The verse listing the homes in which one may eat without blame.
    - The verse naming carrion, blood, swine and what was slaughtered for other than God.
    - Sayings of the Messenger of God on trade, begging, provision for dependants and hospitality.
    - Al-Dahhak on making buying, selling, judgement and the satisfying of needs easy.
    - Imam Ja'far ibn Muhammad on seeking sustenance, the manners of drinking, the guest's fast, and the categories of food.
    - Imam Muhammad al-Baqir on feeding a believer.
    - Sufyan al-Thawri's report of Imam Ja'far al-Sadiq on fine clothing.
thesis_relevance: 'This chapter advances the book''s central claim that the whole of ordinary life is governed by knowable rulings, so that daily conduct is itself the field of religious obedience, by establishing the claim on the two most ordinary acts a person performs — acquiring a living and consuming it — and then carrying the same logic through to slaughter, hunting and dress.

  '
