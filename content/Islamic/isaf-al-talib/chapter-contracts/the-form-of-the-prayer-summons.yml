    - adhan-and-iqama
    - prayer-virtue-and-sacred-times
    - ranks-loyalty-and-communal-affection
  references:
    - The continuation and close of the formal message On the Discussion.
    - Quranic proofs from the Moses-Aaron pattern, the verse of guardianship, the best of creation, chosen families, and the choosing of the Children of Israel.
    - The hadith 'You are to me as Aaron was to Moses, except that there is no prophet after me.'
    - 'The Ghadir declaration: ''Whoever I was his master, this Ali is his master.'''
    - The rebuttal concerning Omar ibn al-Khattab, 'prayer is better than sleep,' and the alleged equivalence of addition and omission.
    - The transmission claim through Qadi al-Nu'man from Ja'far al-Sadiq.
    - The closing note of Diaa Ali ibn Ibrahim al-Haydar Abadi dated 22 Jumada al-Awwal 1306 AH in Baruda.
thesis_relevance: 'This chapter advances the book''s central claim that the pillars and rulings of Islam must be understood through faithful knowledge, action, and the authoritative guidance of the Ahl al-Bayt by showing how even the wording of the prayer summons depends on proof, transmission, rightful authority, and public testimony to wilaya.

  '
