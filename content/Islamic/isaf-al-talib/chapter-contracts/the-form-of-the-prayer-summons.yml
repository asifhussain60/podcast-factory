show_notes:
  blurb: 'This chapter completes the formal defense of the adhan phrase naming Muhammad, Ali, and the ''atrah, then answers critics who compare that witness with omissions and additions attributed to Omar ibn al-Khattab. It asks how Quranic proof, prophetic analogy, hadith transmission, and the origin of testimony to wilaya shape what a community is allowed to hear in the summons to prayer.

    '
