  references:
    - Ali ibn Abi Talib's four hundred precepts of good conduct on night vigil, laziness, distraction, and prayer.
    - The book of legitimate legal questions on intoxication, invalid leadership, and prayer while floating in water.
    - The Book of Purity and the Book of Pillars on missed prayers, Sunnah prayers, and make-up order.
    - Mukhtasar al-Musannaf on combining Dhuhr and 'Asr, certainty under clouds, and making up missed prayers.
    - Questions and answers attributed to Hassan bin 'Abd al-Malik and Badr al-Din Hassan bin Idris on voluntary prayer and midnight prayer.
    - Letters of Muhammad bin al-Fahd bin Salah and Hibatullah ibn Ibrahim on make-up obligations, incapacity, and substitution.
    - Qadi al-Nu'man on Dhuhr, 'Asr, hidden prayer times, prayer boundaries, and obligatory elements.
    - The book of hidden inner matters on Witr, shaf' al-fu'd, Fajr, and the middle prayer.
thesis_relevance: 'This chapter advances the book''s central claim that the pillars and rulings of Islam must be understood through faithful knowledge, action, and the authoritative guidance of the Ahl al-Bayt by showing how prayer requires disciplined attention, valid order, repentance for missed duties, and exact knowledge of sacred time.

  '
