angle_note: 'The episode renders the source''s collected sayings, question-and-answer rulings, and timing doctrine in coherent modern English while preserving its distinctions around prayer, Sunnah, nawafil, qada'', Witr, Fajr, and the boundaries of valid performance.

  '
episode_format: deep_dive
format_rationale: 'One doctrinal-legal teaching unfolds layer by layer: attentive prayer before Allah, the repair of missed obligations, and the sacred architecture of prayer-times. There is no sustained named opposition running through the chapter; named authorities and questioners supply transmitted rulings rather than an extended debate.

  '
essential: core
essential_rationale: 'It opens the book''s prayer sequence by making prayer the pillar through which attention, repentance, time, and lawful worship are tested.

  '
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: 'The curious_mind voices the listener''s questions about why timing, attention, and make-up order matter so much, while the scholar_companion explains how the source makes prayer the daily proof of disciplined faith.

  '
length_target: 5500-6000
key_tensions:
  - 'Prayer is obligatory and beloved, yet it may be rejected when the servant stands lazily, drowsily, intoxicated, distracted, or under invalid leadership.

    '
  - 'Missed obligations must be repaired in proper order, but repentance remains open even after long abandonment when the servant returns sincerely.

    '
  - 'Voluntary devotion is praised, yet it cannot outrank obligatory prayer, missed prayer, Maghrib''s immediacy, or the forbidden and disliked times.

    '
  - 'Prayer-times are outwardly measured by sun, shadow, dawn, and twilight, yet the source calls them hidden times known by proof and tied to inward wisdom.

    '
tone_constraints:
  - 'Open with a curiosity hook around prayer failing through distraction, intoxication, missed debts, or sacred time, not neutral stage-setting.

    '
  - 'Use only brief callbacks for doctrines already taught in earlier chapters: the levels of faith, guardianship and knowledge, peace and belonging, sacred ranks, disciplined loyalty, affection as law, bodily purity, purity under conditions, inner water, major washing, material purity, tayammum paths, food and contact, grooming boundaries, Ja''far''s admonition, hair, skin, and bone, menstruation and nifas, and disavowal and waiting.

    '
  - 'Preserve Arabic and Islamic technical terms supplied by the source, including muhajir, al-fa''itat, qada'', rak''ah, Sunnah, nawafil, Maghrib, Dhuhr, ''Asr, ''Isha'', Fajr, makruh, adhan, iqamah, ihram, tawaf, Witr, qunut, du''a'' al-qunut, shaf'' al-fu''d, Surah al-Hamd, Surah al-A''la, Surah al-Kafirun, Surah al-Ikhlas, Surah al-Falaq, Surah al-Nas, Shari''ah, and shahadatayn.

    '
  - 'Do not use the forbidden leadership-title phrase for Ali ibn Abi Talib. Refer to him as Ali ibn Abi Talib, Father of Imams, or by source titles such as Amir al-Mu''minin.

    '
  - 'Present source-era legal formulations on intoxication, disbelief, hypocrisy, abandonment of prayer, jizyah, killing, captivity, ritual impurity, and the rule of Islam as the source''s own rulings without modern expansion or apology.

    '
  - 'Quranic quotations must use plain-English references when supplied by the source or confidently verified from the source wording; never use shorthand citation forms or bare numeric citations.

    '
anchor_passages:
  - '"I am better for you than that toward which you have turned."

    '
  - '"Prayer is an offering for every pious person."

    '
  - '"There is no deed more beloved to God than prayer, so let not the affairs of this world distract you from it or cause you to be heedless of its times."

    '
  - '"Such a man is one who has consumed alcohol until he lost his reason; prayer is therefore not permissible for him on account of his drinking, yet he is not excused for abandoning it."

    '
  - '"Such is the case of a person floating in water who is unable to reach dry land; such a person need not bow or prostrate."

    '
  - '"Prayer is the pillar of religion; it is the first thing God examines from what the son of Adam has done."

    '
  - '"Whoever returns to Allah, Allah accepts his return, and whoever reverts, Allah will hold him to account."

    '
  - '"Praying at the end of the time with certainty is better than praying at the beginning of the time with doubt."

    '
  - '"There are five concealed prayer times known only through proof."

    '
  - '"The angels of the night and the angels of the day are both present."

    '
