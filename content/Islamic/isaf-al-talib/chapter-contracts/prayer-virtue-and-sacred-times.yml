show_notes:
  blurb: 'This chapter opens the Book of Prayer by moving from attention in the act of standing before Allah, through missed prayers and repentance, into the sacred structure of the daily prayer-times. It asks how prayer remains the pillar of religion when the worshipper is lazy, drowsy, intoxicated, indebted by missed prayers, uncertain of the time, weak from age, or standing at the boundary between night and day.

    '
