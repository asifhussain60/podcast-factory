thesis_relevance: 'This chapter advances the book''s central claim that the pillars and rulings of Islam must be understood through faithful knowledge, action, and the authoritative guidance of the Ahl al-Bayt by showing how Friday, Eid, and prayer correction require public authority, inward meaning, valid action, and certainty disciplined by transmitted rule.

  '
