format_rationale: 'One doctrinal-legal teaching unfolds layer by layer: public Friday order, Eid''s festive and inward disclosure, then the disciplined repair of omission and doubt in prayer. There is no sustained named opposition running through the chapter; the named authorities, questioners, and cited books supply cumulative exposition rather than an extended contest between voices.

  '
essential: core
essential_rationale: 'It completes a major prayer sequence by showing how public worship and individual correction remain valid through authority, timing, certainty, and measured repair.

  '
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: 'The curious_mind voices the listener''s questions about public prayer, festival prayer, and anxious mistakes, while the scholar_companion explains how the source distinguishes valid gathering, inward meaning, real omission, and mere doubt.

  '
length_target: 5500-6000
key_tensions:
  - 'Friday prayer must gather the community in a visible public center, yet unjust leadership and taqiyya complicate what it means to pray behind a preacher.

    '
  - 'The khutbah is a sermon in public speech, yet the source treats it as replacing two rak''ahs and carrying inward meaning through silence, attention, and the two lights.

    '
  - 'Eid prayer is festive and radiant, yet its takbirs, ghusl, congregation, and timing remain tightly measured by law.

    '
  - 'Prayer mistakes require repair, but the source refuses to turn every doubt or unsettled feeling into an omission.

    '
tone_constraints:
  - 'Open with a curiosity hook around public prayer becoming a test of distance, authority, silence, memory, and certainty, not neutral stage-setting.

    '
  - 'Use only brief callbacks for doctrines already taught in earlier chapters: the levels of faith, guardianship and knowledge, peace and belonging, sacred ranks, disciplined loyalty, affection as law, bodily purity, purity under conditions, inner water, major washing, material purity, tayammum paths, food and contact, grooming boundaries, Ja''far''s admonition, hair, skin, and bone, menstruation and nifas, disavowal and waiting, attentive prayer, missed obligations, sacred times, the summons, the adhan''s witness, the discussion letter, the remaining proofs, unequal errors, the first testimony, public dedication, entering the mosque, guarded direction, standing behind, ranked leadership, following without fracture, shared boundaries, the admonition, prayer''s shape, the answerable plea, speech and motion, and garment and ground.

    '
  - 'Preserve Arabic and Islamic technical terms supplied by the source, including Friday prayer, khutbah, adhan, taqiyya, Nasibi, Haruri, Ahl al-Bayt, Shari''ah, Sunnah, da''i, Tashriq, takbir, ''Arafah, hudud, Zakat al-Fitr, ghusl, qunut, Eid al-Fitr, Eid al-Adha, fitr, iqama, rak''ah, sujud al-sahw, tashahhud, salaam, Dhuhr, Fajr, Maghrib, ''Asr, and Mukhtasar al-Musannaf.

    '
  - 'Do not use the forbidden leadership-title phrase for Ali ibn Abi Talib. Refer to him as Ali ibn Abi Talib, Father of Imams, or by source titles such as Amir al-Mu''minin.

    '
  - 'Present source-era legal formulations on unjust preachers, taqiyya, Nasibi, Haruri, city obligation, gendered attendance and covering, and prayer invalidation as the source''s own claims without modern expansion or apology.

    '
  - 'Quranic quotations must use plain-English references when supplied by the source or confidently verified from the source wording; never use shorthand citation forms or bare numeric citations.

    '
anchor_passages:
  - '"The Friday prayer should not be held in both if the distance between them is less than three miles, whether they are in one city or two."

    '
  - '"It is not permissible to pray behind the people of injustice except out of taqiyya."

    '
  - '"O righteous people, investigate and do not become doubtful after certainty, for you have taken refuge in the strong fortress of God."

    '
  - '"The Friday prayer behind the Imam of the Muslims is better than praying behind his deputies."

    '
  - '"When the preacher on Friday mounts the elevated pulpit and greets the people, silence becomes obligatory."

    '
  - '"Friday prayer was made two rak''ahs, with the sermon replacing the other two rak''ahs."

    '
  - '"If someone forgets some of the takbirs should complete them before bowing; if he has passed the point of bowing and is certain he has omitted them, he performs the two prostrations of omission."

    '
  - '"Thus fitr signifies the appearance of interior realities and hidden knowledge."

    '
  - '"If it is established that he has indeed committed an omission, he prostrates for it; otherwise he does not."

    '
  - '"The intention resides in the heart, and what is said with the tongue is merely a verbal expression of it."

    '
  - '"The one who commits an omission is certain of what he has omitted, while the doubter is not certain of what he doubts."

    '
  - '"Whoever is upon certainty and is then visited by doubt should proceed upon his certainty, for doubt does not displace certainty nor diminish it."

    '
