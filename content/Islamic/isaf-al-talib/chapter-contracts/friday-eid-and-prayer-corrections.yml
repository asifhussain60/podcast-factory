show_notes:
  blurb: 'This chapter gathers Friday prayer, the two Eid prayers, and the prostration of omission into one sustained lesson on worship under pressure. It asks how a community preserves public prayer through distance, pulpit, sermon, silence, and leadership; how Eid reveals what fasting had concealed; and how a worshipper repairs real omission without surrendering certainty to doubt.

    '
