title: The Traveller's Prayer
audience: 'Thoughtful adult listeners continuing a faithful translation-edition series on Is''af al-Talib, ready for a chapter of working legal correspondence between India and Yemen on when a journey shortens the prayer, when kinship cancels the concession, and what a worshipper owes when the road, the weather, or the deck of a ship will not let him pray in the ordinary way.

  '
angle: faithful_exposition
angle_note: 'The episode renders the source''s question-and-answer exchanges, transmitted rulings, and cited books in coherent modern English while preserving its distinctions around blameless travel, the six occupations that never shorten, the mahram whose presence completes the prayer, the ten-day intention, the worshipper''s own doorstep as the end of a journey, Makkah as the place that refuses the concession, and the dispensations granted for hardship.

  '
episode_format: interview
format_rationale: 'The chapter is literally built as questions and answers: merchants and sheikhs of al-Hind submit written questions and named Yemeni authorities answer them, with the exchanges — not an argument — supplying the chapter''s spine. Ali ibn Sulayman Qas questions Ja''far ibn Sulayman, al-Hasan ibn Nuh questions Idris ibn Hassan, Shamun ibn Muhammad Ghuri al-Hindi is answered by Badr al-Din Hasan ibn Idris, and Muhammad ibn Fahd answers his seventeenth question. No opposing party contests a proposition anywhere in the slice, so debate is wrong, and the Q&A structure is too dominant for deep_dive to describe it honestly.

  '
essential: core
essential_rationale: 'It supplies the whole law of prayer outside the worshipper''s own city — what shortens, what does not, and where a journey legally begins and ends — which no other chapter in the series covers.

  '
host_dynamic: interviewer + subject
host_dynamic_rationale: 'The interviewer puts the travelling merchant''s and travelling preacher''s real questions exactly as the sheikhs of al-Hind wrote them, and the subject answers in the voice of the Yemeni respondents, quoting the books each ruling comes from before drawing out what the ruling assumes.

  '
length_target: 5500-6000
key_tensions:
  - 'Distance is measured with great care and then repeatedly overruled, so that a man who has walked all day may owe the full prayer and a man who has gone one mile may not.

    '
  - 'The presence of a close blood relative cancels the concession anywhere on earth, which makes kinship rather than geography the thing that decides whether a man is at home.

    '
  - 'The circle of relatives is taken from the marriage prohibitions but not taken whole: the in-law and the milk relation bar marriage yet do not complete the prayer.

    '
  - 'Residency is fixed by an intention held in the heart, so a man whose departure is certain is still a resident until he has resolved on it.

    '
  - 'The outbound journey begins at the city gate while the return ends only at the worshipper''s own front door, and neither threshold is allowed to do the other''s work.

    '
  - 'Makkah withdraws the concession from everyone for any length of stay, ignoring every measure the rest of the chapter applies.

    '
  - 'The shortened prayer cannot be declined: a traveller who prays in full has prayed the wrong prayer and must repeat it.

    '
tone_constraints:
  - 'Open with a curiosity hook about what distance buys and why meeting a relative on the road takes it back, not neutral stage-setting.

    '
  - 'Use only brief callbacks for doctrines already taught in earlier chapters: the levels of faith, guardianship and knowledge, peace and belonging, sacred ranks, disciplined loyalty, affection as law, bodily purity, purity under conditions, inner water, major washing, material purity, tayammum paths, food and contact, grooming boundaries, Ja''far''s admonition, hair, skin, and bone, menstruation and nifas, disavowal and waiting, attentive prayer, missed obligations, sacred times, the summons, the adhan''s witness, the discussion letter, the remaining proofs, unequal errors, the first testimony, public dedication, entering the mosque, guarded direction, standing behind, ranked leadership, following without fracture, shared boundaries, the admonition, prayer''s shape, the answerable plea, speech and motion, garment and ground, Friday''s gathered order, Eid''s revealed interior, certainty and omission, prayer that does not break, the latecomer''s entry, and the forming of children.

    '
  - 'Preserve Arabic and Islamic technical terms supplied by the source, including qasr by its described sense, rak''ah, takbir, qibla, mahram, nafl, tayammum, mutamim, mail, farsakh and mil, and the place names Ahmadabad, Nahrwala, Kanpur, Sarnak Pur, Sofa, Aden, Makkah, Medina and Haraz.

    '
  - 'Preserve the transmitted names as the source gives them: Ali ibn Sulayman Qas, Ja''far ibn Sulayman, Idris ibn Hassan, Badr al-Din Hasan ibn Idris, Shamun ibn Muhammad Ghuri al-Hindi, al-Hasan ibn Nuh, Muhammad ibn Fahd, Ja''far ibn Mansur al-Yaman, Abdullah ibn Nuh, al-Nu''man, and Isma''il ibn Sayyidina Hiba.

    '
  - 'Do not use the forbidden leadership-title phrase for Ali ibn Abi Talib. Refer to him as the Commander of the Believers, as the source does here, or as the Father of Imams.

    '
  - 'Present the source-era rulings on slaves authorized to trade, divorced women travelling in company, non-Muslim travelling companions, minors, and people of the higher ranks as the source''s own claims, without modern expansion or apology.

    '
  - 'Quranic quotation is limited to the single verse the source itself names, and its reference is given in plain English; no other verse is introduced.

    '
anchor_passages:
  - '"A mail is four leagues; a farsakh is three miles; and a mil is three thousand cubits — one thousand moderate paces measured by one leg, from where the right foot is raised to where it is placed down."

    '
  - '"The traveller breaks his fast and shortens the prayer from the moment he leaves his house and begins to travel, until he returns and enters his house — if his travel is blameless."

    '
  - '"If a man owns a great deal of land and enjoys walking through it for pleasure, that does not justify shortening the prayer."

    '
  - '"There are six categories of people who do not shorten their prayers or fasting: the collectors, the merchant who travels in his trade from one market to another, the prince within his emirate, the man in pursuit of hunting, the shepherd who seeks pastures, and the warrior who cuts off the road."

    '
  - '"His case is like that of a prince who goes out to govern his emirate — he is not required to shorten the prayer or break the fast."

    '
  - '"If he stays five prayer times with his wife or with his mahram relatives, he should complete his prayer and fast."

    '
  - '"Forbidden to you are your mothers, your daughters, your sisters, your paternal aunts, your maternal aunts, your brother''s daughters, and your sister''s daughters."

    '
  - '"The relatives, both male and female, who complete the prayer and fasting are those connected through the womb. The mothers of wives and those related through the male line do not."

    '
  - '"Whoever enters Makkah should pray in full and not shorten, regardless of whether he stops for an hour or a day."

    '
  - '"The stay referred to independently is ten days, neither less nor more."

    '
  - '"A traveller returning home may not pray in full until he enters his own house."

    '
  - '"He should pray facing four directions, one in each direction for each obligatory prayer. Allah Almighty excuses His servant when He afflicts him with hardship."

    '
  - '"He should establish the direction of prayer at the moment he enters into it. If the ship turns on its own, there is nothing upon him."

    '
  - '"One should leave what is permissible in order to be safe from falling into what is not."

    '
