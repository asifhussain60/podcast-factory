  references:
    - The first question-and-answer book arranged according to the chapters of the Pillars of Islam, on the man with houses in Ahmadabad and Nahrwala, the mahram relatives, the divorced women of India, and the districts of Ahmadabad.
    - The Book of Purity, on the leisurely outing that does not justify shortening.
    - The concise book on the works of our master al-Nu'man, on shortening from the leaving of the house until the return to it.
    - Mukhtasar al-Musannaf, on repeating a prayer wrongly prayed in full, on prostration performed riding or on the ground, and on the Sacred Mosque.
    - Mukhtasar al-Athar, on the mail, the farsakh and the mil, on the Sunnah and nafl prayers deferred to the night, and on praying while on the road.
    - The commentary on the Pillars, on the Messenger of Allah praying on his way to Medina with his head inclined for prostration.
    - The Book of Sub-Nursing of Ja'far ibn Mansur al-Yaman, on the Sunnah of shortening and the three prayers reduced from four rak'ahs to two.
    - Anas al-Munibeh, reporting the Commander of the Believers on the six categories who do not shorten their prayers or fasting.
    - The treatise of Muhammad ibn Fahd, The Love of the Path of Guidance for Those Who Have Converted, question seventeen, on the ten-day stay and the traveller praying among residents.
    - The eleventh issue of Sheikh al-Hasan ibn Nuh answered by Idris ibn Hassan, on travelling with the son's wife or the wife's mother and on leaving the permissible for safety.
    - The book of the question of Sheikh Shamun ibn Muhammad Ghuri al-Hindi with the answer of Badr al-Din Hasan ibn Idris, on the close relative whose presence establishes the five prayers.
    - The questions addressed to the sheikhs of the borders of al-Hind with replies from the preachers of the peninsula of Yemen, on the thirty-fifth issue, the imam aboard a ship, the carrying of the Qur'an, and the resident and traveller leading one another.
thesis_relevance: 'This chapter advances the book''s central claim that the pillars and rulings of Islam must be understood through faithful knowledge, action, and the authoritative guidance of the Ahl al-Bayt by showing that even the most practical question a believer can ask — how many rak''ahs do I owe on this road — is settled by transmitted authority answering a named questioner, and that the answer turns on kinship, intention and threshold rather than on the traveller''s own estimate of how far he has come.

  '
