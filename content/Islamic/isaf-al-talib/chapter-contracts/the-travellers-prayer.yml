show_notes:
  blurb: 'A chapter of working correspondence: merchants and travelling preachers in India write to the preachers of Yemen asking when the road shortens the prayer, and the answers keep refusing to be about distance. A man walking his own land is not travelling. A prince inside his emirate is not travelling. And a traveller who meets a blood relative in the relative''s own city stops being a traveller on the spot. The chapter ends where it begins — at a man''s own front door, which opens the journey and is the only thing that closes it.

    '
