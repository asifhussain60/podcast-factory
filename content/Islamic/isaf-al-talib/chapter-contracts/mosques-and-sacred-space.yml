show_notes:
  blurb: 'This chapter turns from the prayer summons to the sacred spaces where that summons gathers worshippers. It asks how a mosque is dedicated, when a private prayer place becomes public, what the neighbor who hears the adhan owes, how the greeting of the mosque is prioritized, and why qiblah, barriers, weapons, graves, precincts, and ranked sanctuaries all shape the discipline of prayer.

    '
