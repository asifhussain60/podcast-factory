    - The question-and-answer book arranged according to The Pillars of Islam on mosques, graves, ownership, and mosque greetings.
    - The Book of Purity on the neighbor of the mosque and the merit of prayer in the mosque.
    - The book summarizing the work on qiblah direction, disliked orientations, and correction during prayer.
    - Ta'eefil al-Da'a'im on weapons in mosques.
    - The councils of clarification on twelve disliked places of prayer and the disliked closed mosque inside a house.
    - Muhammad ibn al-Fahd's noble epistle The Lover of the Path of Guidance for Converts and the Revealer of Their Hearts in Matters of Jurisprudence on graves and the mosque greeting.
    - The interpretation of the Shari'ah on ḥudūd punishments, singing astray in mosques, and sheep pens.
    - The eighth assembly of al-Mustansiriyya on the seven ranked levels of prayer.
    - Amīr al-Mu'minīn Ali ibn Abi Talib's four hundred precepts of conduct on sitting in the mosque, the qiblah, swords, and approaching the mosque.
thesis_relevance: 'This chapter advances the book''s central claim that the pillars and rulings of Islam must be understood through faithful knowledge, action, and the authoritative guidance of the Ahl al-Bayt by showing how prayer''s sacred space is created through lawful dedication, communal access, ranked merit, and disciplined bodily conduct.

  '
