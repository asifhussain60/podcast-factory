  references:
    - The first-mentioned question-and-answer book arranged according to The Pillars of Islam on congregation, mahram placement, taqiyya, late joining, rows, and screens.
    - Mukhtasar al-Musannaf on good opinion of the imam, lining up between columns, and related congregational cases.
    - The book of clarification on combining prayers without travel, illness, or fear.
    - Questions from the island of India and the answer of Mawlānā Hibat Allāh on women praying behind a curtain and seeing before ihraam.
    - The interpretation of the Shari'ah on praying alone behind the row, the duties of prayer, bodily stillness, prostration, and animal-like motions.
    - Mawlānā Ja'far ibn Sulayman's noble letter admonishing those who claim loyalty while abandoning prayer.
    - The hidden message of Da'i Zayd ibn Muhammad ibn al-Fadl on prayer's seven duties, four limits, daily rak'ahs, and obligatory and Sunnah kinds.
    - The Mustansiriyyah councils on obligatory prayers, Sunnah prayers, the seven duties within each prayer, and the twelve sunnahs.
    - The Four Hundred Etiquettes of Amīr al-Mu'minīn Ali ibn Abi Talib on posture, attention, injury, settling the limbs, and not preceding the imam.
    - The answer of Mawlānā Hibat Allāh to Muhammad Ali ibn Salih al-Badri on reciting Sūrat al-Falaq, Sūrat al-Nās, and Sūrat al-Ikhlāṣ in obligatory prayer.
thesis_relevance: 'This chapter advances the book''s central claim that the pillars and rulings of Islam must be understood through faithful knowledge, action, and the authoritative guidance of the Ahl al-Bayt by showing how shared prayer turns loyalty into ordered bodily worship through congregational boundaries, admonition, and transmitted duties and sunnahs.

  '
