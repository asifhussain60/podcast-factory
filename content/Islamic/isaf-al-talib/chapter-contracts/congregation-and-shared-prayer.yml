show_notes:
  blurb: 'This chapter turns from who leads prayer to how shared prayer is actually assembled and preserved. It asks where women stand, how screened congregations work, how a latecomer catches the congregation, why rows must be continuous, why prayer cannot be abandoned by those claiming loyalty, and how the duties and sunnahs of prayer give worship its inherited bodily form.

    '
