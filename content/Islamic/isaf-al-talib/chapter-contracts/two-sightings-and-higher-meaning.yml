show_notes:
  blurb: 'The moment that obliges the noon prayer is a moment nobody has ever watched happen. Near the top of its arc the sun''s motion stops producing any shadow change an eye can register, the senses fall silent, and a person who does not know might think the sun has halted — and this chapter argues that the obligation attaches to the crossing at the exact midpoint of the arc, not to the later moment when a lengthening shadow finally announces what already occurred. One line is a definition; the other is a delay whose size depends on how good your eyes are. Then the strongest objection in the whole dispute, and it is not philosophy but a hadith: if the sky is obscured, count thirty days. The answer does not deny the saying — it ranks it. Both visions are real foundations for discharging a duty, one is superior, and the junior rule exists for people who cannot tell the two apart, in the way that the later of two prayer times is valid and still the lesser. Behind that sits the claim that everything has a hidden side and an apparent side, and that both sides bind: the learned must act on what they learned, and everyone else on what they have come to know. Then the literal reading is taken apart from the inside. It makes a divine command depend on the weather; it can order a fast on a day that would otherwise be forbidden; it begins Ramadan in Kirman and not in Shiraz, which the daily prayer would never tolerate; and it tells you to count from a first day it has no way of giving you, in places where the air is never clear. No soul is charged beyond its capacity — so either the report is unsound, or it means something that leaves nobody in doubt. And then the turn nobody is braced for: if the duty is entrusted, who holds the trust? Every pillar — prayer, fasting, zakat, Hajj, jihad — is deposited with the community under the leader standing in the Prophet''s place. Alms paid to the wrong office are not paid. A pilgrimage performed alone, rite by perfect rite, is not a pilgrimage. And in the prayer, the man who bows early has done every act correctly and has still deviated, because what he owed was the bowing with. Which is why the eye could never have been the instrument: not because it is weak, but because it is yours alone, and the duty is not.

    '
