    - 'The two lines: the crossing at the halfway point of the daily arc, perceived by the soul, which makes the prayer obligatory, against the later point perceived by natural vision which corresponds to more than half the arc — with the parallel argument from the sun''s rays and the shadow that must then exist.'
    - The objection from the Prophet's instruction to count thirty days when the sky is obscured, and the reply that both modes of vision are foundational in performing obligatory duties with one superior to the other.
    - 'The two ranks: the select who are advanced in knowledge and first to understand, the general public who follow the people of knowledge and cannot distinguish the two visions, the comparison to two prayer times, the hidden and apparent dimensions of all things, and the obligation that binds both ranks to act.'
    - The astronomer who knows dawn has arrived, and the duty of the one ignorant of dawn's timing to follow his guidance.
    - 'The dismantling of the literal reading: fasting by sight hostage to clearing weather, a month that may fall to twenty-nine, a command that would impose a forbidden fast, sincerity that stands apart from doubt (chapter 98, verse 5), the complete count that neither increases nor decreases, and the completion of the number (chapter 2, verse 185).'
    - 'The regional argument: Kirman''s overcast sky against Shiraz''s clear one, fasting obligatory for some on one day and others on the next, the prayer time the whole community is obliged to establish together, and the same binding of those who fast and those who break.'
    - 'The counting argument: error falling in naked-eye sighting but not in the sighting of the soul, the need for a counter and a known first day, the turbid air of Tabaristan, the mountains, the coasts and the sea islands, the soul not burdened beyond its capacity (chapter 2, verse 286), and the fork between an unsound report and a sound sense.'
    - 'The pillar generalization: every pillar entrusted to the community safeguarded from error, the prayer''s acts and the fault of introducing or delaying, zakat collected by the standing Imam and repeated if given to another authority, the Hajj that is invalid performed individually, and the ordering of the fighting community — closing on the damaged phrase for the man who fights outside the order.'
thesis_relevance: 'This chapter advances the book''s central claim that the pillars and rulings of Islam must be understood through faithful knowledge, action, and the authoritative guidance of the Ahl al-Bayt by completing the proof that an obligation begins at a moment knowledge reaches before eyesight does, and then naming the reason: every pillar is entrusted to the community under the leader standing in the Prophet''s place, so a duty held in common cannot be timed by an instrument that answers each holder differently.

  '
