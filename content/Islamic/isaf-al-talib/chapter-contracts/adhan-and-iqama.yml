thesis_relevance: 'This chapter advances the book''s central claim that the pillars and rulings of Islam must be understood through faithful knowledge, action, and the authoritative guidance of the Ahl al-Bayt by showing how the prayer summons itself requires lawful authority, ritual order, inward testimony, and public recognition of the Prophet''s household.

  '
