    - The clarification on the crescents — that the transmitted sighting material, in this chapter and the two before it, addresses those distant from the Imam who do not know the determination of the crescents by our master and Mawlana.
    - 'Our master Ja''far ibn Sayyidina Sulayman — may God bless him — in his noble epistle the Sharpest Sword in Nullifying Innovations: the waking of the sleepers among the people of Yemen, and the rebuke over honouring the month with the word scripture placed before its name.'
    - Our master al-Qadi al-Nu'man ibn Muhammad, may God sanctify him, in Mukhtasar al-Athar al-Sharifa, reporting our master the Imam al-Baqir Abu Ja'far Muhammad ibn Ali, peace be upon him — do not say 'Ramadan,' but say as Allah said, 'the month of Ramadan'; and the censure verses under which the Imam placed its neglect (chapter 61, verses 2 and 3).
    - The fourteenth majlis of the Mustansiriyya councils, may God's peace be upon its author — the division of fasting into seven obligatory sections and twelve recommended, with the fast of Dawud rated the most rigorous, the Friday restriction, the day of Arafah for non-pilgrims, the boy at seven, and the hunting and head-shaving expiations.
    - 'Our master Zayd ibn Muhammad — may God sanctify his soul — in the hidden message: fasting as the obligation after prayer and zakat, one month out of the twelve, and the month of Ramadan as thirty days.'
    - 'Mawlana Amir al-Mu''minin Ali ibn Abi Talib — may Allah''s peace be upon him — in his four hundred manners: three days of each month with the fast of Sha''ban dispel the obsessions of the chest and bring tranquility to the heart.'
thesis_relevance: 'This chapter advances the book''s central claim that the pillars and rulings of Islam must be understood through faithful knowledge, action, and the authoritative guidance of the Ahl al-Bayt by opening the fast as an act that cannot be performed correctly from its outward form alone — it is measured across every sense, voided by a seam between the inward and the outward, dated by a determination that rests with the Imam, and enumerated in full only by a transmitted council, so that a believer who merely abstains has not yet learned what he was commanded to do.

  '
