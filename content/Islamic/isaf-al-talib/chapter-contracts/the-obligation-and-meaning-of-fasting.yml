title: The Shield, the Name, the Count
audience: 'Thoughtful adult listeners continuing a faithful translation-edition series on Is''af al-Talib, arriving at the opening of the Book of Fasting — where the fast is defined as a restraint laid across every sense rather than an abstention from food, where a community is rebuked not for breaking the fast but for what it calls the month, and where the whole of fasting is counted out as seven obligations and twelve devotions.

  '
angle: faithful_exposition
angle_note: 'The episode renders the slice''s two headings, its cited books and its single enumerated council into coherent modern English while preserving the distinctions the teaching turns on: between abstaining from food and restraining a sense, between a fast diminished in proportion and a fast that does not count at all, between a crescent that is sighted and a crescent that is determined, between a month named bare and a month named as scripture names it, between an obligation that falls on a person and a discipline he takes up, and between a fast owed as expiation and a fast a person binds on himself by vow. Passages the manuscript has damaged — the book''s own heading, the third recommended fast, the clause about manumission and resurrection, the lead-in that goes nowhere — are rendered as they stand and named as damaged rather than repaired from the standard forms available in other books.

  '
episode_format: deep_dive
format_rationale: 'One position unfolds layer by layer across both headings — that fasting is a shield laid across the whole person, so that its worth varies with how much of the person it covers and its occasions are enumerable — and each movement supplies the next layer: the definition and its proportional accounting, then the honouring of the month in its timing and in its name, then the complete division into seven obligatory and twelve recommended fasts. No named party contests any proposition anywhere in the slice. The epistle of Ja''far ibn Sayyidina Sulayman rebukes the people of Yemen, but they are addressees rather than a voice: they never answer, no proposition is put to contest, and the passage occupies well under a tenth of the slice, so debate is wrong. No events are narrated, so narrative is wrong; there is no question-and-answer material anywhere in this slice, which is the clean contrast with chapters 19 and 21 where that consideration was live.

  '
essential: core
essential_rationale: 'It opens the Book of Fasting and carries the only definition of the fast in the series, the only statement of who owes it and whose fast is void, the ruling that scopes crescent-sighting to those distant from the Imam, the naming ruling with its Quranic censure, and the complete enumeration of the seven obligatory and twelve recommended fasts — none of which appears anywhere else.

  '
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: 'The curious mind presses the questions the definition raises and the source leaves standing — how a fast can be diminished rather than broken, why the exemptions the earlier chapters were so careful about are simply absent here, why a word as plain as "month" should carry an entire rebuke, why the heaviest fast in the catalogue is one nobody is obliged to keep — while the scholar companion supplies the source''s own settlements in the voice of its named authorities: the book Mukhtasar al-Musannaf, our master Ja''far ibn Sayyidina Sulayman, our master al-Qadi al-Nu''man ibn Muhammad reporting our master the Imam al-Baqir Abu Ja''far Muhammad ibn Ali, the fourteenth council of al-Mustansiriyya, our master Zayd ibn Muhammad, and Mawlana Amir al-Mu''minin Ali ibn Abi Talib.

  '
length_target: 5500-6000
key_tensions:
  - 'A fast is defined first as a shield of the tongue, the ears and the eyes, and only afterwards as abstention from food and drink — which is named as insufficient on its own.

    '
  - 'Reward accrues sense by sense and virtue diminishes in proportion to whatever was released, so the fast thins by degrees where a prayer would simply break.

    '
  - 'Beneath the proportional scale there is a floor: there is no fasting at all for the hypocrite and the disobedient, however flawless the visible performance.

    '
  - 'The fast is the one obligation with no outward form whatsoever — nobody can watch a man not eat — and it is the obligation singled out for the warning about hypocrisy.

    '
  - 'The scope of the obligation is stated in a single clause naming only adulthood, soundness, Islam and both sexes; the traveller, the sick and the pregnant, whom the earlier chapters treated at length, are absent from this slice entirely.

    '
  - 'The transmitted reports about beginning the fast at the sighting of the crescent are scoped to those distant from the Imam who do not know the determination — and the scoping is extended backward over the two preceding chapters as well.

    '
  - 'A whole community is rebuked not for breaking the fast but for calling the month by its bare name, and the fault is placed under the verses censuring those who say what they do not do.

    '
  - 'The word whose omission draws a rebuke is not a title of praise but the plainest noun available; its authority is that scripture used it.

    '
  - 'Five of the seven obligatory fasts are the fallback of a person who cannot pay, cannot manumit, cannot clothe or cannot sacrifice — which makes the body the currency of last resort and prices one deliberate day at sixty.

    '
  - 'The seventh obligatory fast answers no fault at all: a vow is the only obligation a person manufactures for himself.

    '
  - 'The most rigorous fast in the catalogue — one day on, one day off — sits among the recommended, so severity and obligation run on separate axes.

    '
  - 'Friday may be fasted only when joined to the day before or after, so the recommendation exists to stop the fast becoming a second marker on a day that already carries a gathering.

    '
  - 'The day of Arafah is fasted by everyone except the pilgrims standing on the plain that names it.

    '
  - 'The heading promises a Shari''ah ruling that the fast becomes obligatory for a boy once he can distinguish right from left, and the list it introduces places the boy among the recommended fasts at the age of seven.

    '
  - 'The last two recommended fasts are expiations, though expiation was the defining feature of the obligatory list — the two categories overlap at their edges.

    '
  - 'A month whose beginning waits on a crescent cannot have its length announced in advance, yet the hidden message states flatly that the month of Ramadan is thirty days.

    '
tone_constraints:
  - 'Open with a curiosity hook on whether a man who abstains all day while destroying a neighbour''s reputation has fasted — not neutral stage-setting.

    '
  - 'Use only brief callbacks for doctrines already taught in earlier chapters: the levels of faith, guardianship and knowledge, peace and belonging, sacred ranks, disciplined loyalty, affection as law, bodily purity, purity under conditions, inner water, major washing, material purity, tayammum paths, food and contact, grooming boundaries, Ja''far''s admonition, hair, skin, and bone, menstruation and nifas, disavowal and waiting, attentive prayer, missed obligations, sacred times, the summons, the adhan''s witness, the discussion letter, the remaining proofs, unequal errors, the first testimony, public dedication, entering the mosque, guarded direction, standing behind, ranked leadership, following without fracture, shared boundaries, the admonition, prayer''s shape, the answerable plea, speech and motion, garment and ground, Friday''s gathered order, Eid''s revealed interior, certainty and omission, prayer that does not break, the latecomer''s entry, the forming of children, the journey and its licence, kinship that completes the prayer, intention, return, and dispensation, sickness, eclipse, fear, and drought, Witr, qunut, and the dawn, voluntary devotion and its limits, the visit and its restraint, the measure of a lifespan, remembering death, the wailing admonition, washing and shrouding the dead, procession, prayer, and grave, khums above tithe, the twelfth council''s reckoning, concealment and misdirection, coin, debt, and the threshold, grazing herds and watered ground, and the charity of the head.

    '
  - 'Four callbacks in particular are spent in a clause each and never re-argued: the locus of knowledge established in the opening chapter, which is what the crescent clarification presupposes; the prayer-correction chapter''s binary of void-or-standing, invoked only as the contrast that makes proportional diminishment visible; the forming of children, where a child enters the prayer by stages; and Friday''s gathered order, which the eighth recommended fast protects.

    '
  - 'Preserve the Arabic and Islamic technical terms and titles supplied by the source, including Ramadan, Sha''ban, Shari''ah, zihar, i''tikaf, tamattu'' hajj, Arafah, khums, zakat, al-Fitr, Mukhtasar al-Musannaf, Mukhtasar al-Athar al-Sharifa, the Sharpest Sword in Nullifying Innovations, the councils of al-Mustansiriyya, the hidden message, the four hundred manners, and the names Ja''far ibn Sayyidina Sulayman, al-Qadi al-Nu''man ibn Muhammad, the Imam al-Baqir Abu Ja''far Muhammad ibn Ali, Zayd ibn Muhammad, Dawud, and Mawlana Amir al-Mu''minin Ali ibn Abi Talib.

    '
  - 'Present the source-era rulings on the definition of the fast, on the scope of the obligation, on the determination of the crescents, on the naming of the month, and on the seven obligatory and twelve recommended fasts as the source''s own claims, without modern devotional, legal or apologetic expansion, and without supplying the exemptions this slice does not contain.

    '
  - 'Name the damaged passages rather than repairing them: the book''s own heading, which arrives as the Book of Lent; the third recommended fast, "every Thursday on the first day of each month", which cannot be read as it stands and whose neighbours imply a monthly triad; the compressed clause "and likewise in expiation, until resurrection"; the lead-in "as for what has been stated" followed only by a Quranic tag; and the obscure parenthetical "and His permission is in that saying". The standard forms of the monthly triad exist in other books and are deliberately not imported.

    '
  - 'Record two discrepancies the source leaves open rather than smoothing them: the heading promising a ruling on discernment against a list placing the boy at seven among the recommended, and the eleventh and twelfth recommended fasts being expiations, which was the mark of the obligatory category. Note also the transmission variance between "recommended or delegated" at the promise and "recommended and mourning" at the delivery.

    '
  - 'The four hundred manners arrives here in another of its damaged title forms; the series has already carried it as four hundred counsels and four hundred points of conduct. Reproduce each form and note that it is the same work.

    '
  - 'Two Quranic quotations carry plain-English references because each is unique to its place: the censure verses (chapter 61, verses 2 and 3) and the phrase "the month of Ramadan" (chapter 2, verse 185). Assign no reference to anything the source leaves uncertain.

    '
anchor_passages:
  - 'Fasting is a shield from the Fire — a shield of the tongue, the ears, the eyes, and all other senses.

    '
  - 'It is not simply a matter of abstaining from food and drink; for every sense that is restrained, there is a reward, and whoever upholds that is truly fasting.

    '
  - 'Whoever abandons any of it diminishes the virtue of his fast proportionally to what he has left.

    '
  - 'Fasting the month of Ramadan is obligatory upon every adult and sound Muslim, male and female.

    '
  - 'There is no fasting for one who is a hypocrite and disobeys.

    '
  - 'What has been transmitted concerning fasting upon sighting the crescent moon, and what is mentioned in this chapter and in the two chapters before it, pertains to those who are distant from the Imam and do not know the determination of the crescents by our master and Mawlana.

    '
  - 'This too is something that most of you have heard and known: that the holy month of Ramadan is not honoured with the full honour that God Almighty and His Messenger, peace be upon him, have prescribed for it, because it is the month of the great and generous God.

    '
  - 'The proper reverence is to precede the word "month" as Allah Almighty said: "The month of Ramadan" — yet you address it by calling it "Ramadan" alone, which is not appropriate at all and does not lead to what is right.

    '
  - 'A person does not address one he holds dear except with a word of honour placed before his name, as is well known among you — who know his glory and how to draw near.

    '
  - 'Do not say "Ramadan," but say as Allah Almighty said: "the month of Ramadan."

    '
  - '"O you who believe, why do you say what you do not do?" (chapter 61, verse 2)

    '
  - '"Greatly hateful in the sight of Allah is that you say what you do not do." (chapter 61, verse 3)

    '
  - 'Let us recite for you what pertains to the meaning of fasting and its division into categories. It divides into sections, seven of which are obligatory, twelve of which are recommended or delegated.

    '
  - 'The fast of Dawud, peace be upon him, which is fasting one day and breaking the fast the next — and this is the most rigorous fast.

    '
  - 'Fasting on Friday, making it continuous with Thursday or Saturday, without singling out Friday for fasting alone.

    '
  - 'After prayer and zakat, it is obligatory upon worshippers to fast the month of Ramadan — one month out of the twelve — and the month of Ramadan is thirty days.

    '
  - 'Fasting three days of each month, along with the fast of Sha''ban, dispels the obsessions of the chest and brings tranquility to the heart.

    '
