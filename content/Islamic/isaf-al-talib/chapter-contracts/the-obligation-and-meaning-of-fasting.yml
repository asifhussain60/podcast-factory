show_notes:
  blurb: 'A man abstains from dawn to dusk and spends the whole day destroying a neighbour''s reputation. Has he fasted? The Book of Fasting opens by refusing the definition most people carry: a fast is a shield from the Fire, and the shield is of the tongue first, then the ears, then the eyes, then every other sense — with food and drink arriving late and named as insufficient on their own. Reward accrues sense by sense, virtue thins in proportion to whatever was let go, and beneath the whole scale is a floor where hypocrisy closes the account entirely. Then the month itself is honoured in two registers. In its timing: the reports about starting the fast when the crescent is sighted are scoped to those far from the Imam who do not know the determination — a scoping the source extends backward over the preceding chapters too. In its name: an epistle titled as a sword takes the people of Yemen to task, not for breaking the fast, but for saying "Ramadan" where scripture said "the month of Ramadan", and the Imam al-Baqir places that omission under the verses censuring those who say what they do not do. The chapter closes by counting fasting out in full from the fourteenth council of al-Mustansiriyya: seven obligatory, of which five are the fallback of a person who cannot pay, manumit, clothe or sacrifice, and one is a vow nobody imposed; and twelve recommended, running from seclusion and Sha''ban through a monthly rhythm whose first point is damaged, the alternating fast rated the most rigorous of all, a Friday that may never be fasted alone, a day of Arafah kept by everyone but the pilgrims, and a boy at seven where the heading had promised a ruling about discernment. The last word belongs to a sentence about what a fast does to the one who keeps it: it dispels the obsessions of the chest.

    '
