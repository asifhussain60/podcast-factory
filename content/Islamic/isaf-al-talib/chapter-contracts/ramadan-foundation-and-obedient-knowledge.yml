show_notes:
  blurb: 'What if the moon''s monthly performance was never mainly a way of keeping time, but a portrait — the biography of one man, drawn in the sky before he was born, which the community rehearses twelve times a year? This chapter gets there, and it gets there through law. It opens with the sharpest objection in the whole crescent dispute: if everyone must begin the fast on one day, then somebody is being made to fast a day that still belongs to Sha''ban, a day carrying no obligation at all — which is exactly the counterfeiting the letter has been accusing the other side of. The answer is architecture nobody has seen yet in this series. Every obligation stands on two causes, not one: a general preceding cause it shares with other duties, and a specific second cause that is its own. The day, then the sun past its zenith. Wealth, then a full year. Ability, then the greatest day in Mecca. Discord, then a leader who leads the community into battle. And for fasting: the conjunction, then dawn. The conjunction was never what obliged anyone. Dawn was, and dawn is local and available to everybody. Then the register changes completely. The call to Allah has two dimensions — bodily practice, and interpretation, which is knowledge — and the second exists to hold the first up, not to replace it. So the letter reads the sky. The sun is the Prophet in four exact respects. The moon is the foundation in four more, and the choice of body is the argument: the moon has no light of its own. Then the phases become a history. Conjunction is a minister receiving what the king has signed. The concealment beneath the sun''s rays is an authority visible only to those with virtue and discernment. A full moon at noon is not absent from the sky, only outshone — which is what the letter says that authority was while the Prophet still lived. The thin first crescent only sharp eyes catch is the divergence at the outset; the fourteenth night nobody can doubt is the end of the cycle. And then the hinge: the doubtful day at the month''s edge, where the learned fast and the common people wait for their eyes, is the same failure as not recognising an authority nobody has yet announced from a pulpit. Ramadan itself becomes the sign of the rank that gathered all the Prophet''s knowledge — and the argument for it is arithmetic, because the Quran came down over twenty-three years, so the verse cannot be reporting a single night. The command to fast when you witness the month becomes a command to sit silent in a teaching council, with the questioner and the teacher exempted. Then the letter comes down out of the sky and shows its work: Ramadan of the year four hundred, the Monday conjunction, six degrees above the horizon at sunset, the Wednesday that would have become a forbidden Eid, and the slaughter in the Haram that fell where knowledge said it would with the eye''s count a day behind. Which brings the last objection in the correspondence, and it concedes every number: the Prophet forbade taking the stars as a guide, so the whole method is a prohibited science. The reply points out that the direction of prayer and the times of prayer are settled the same way, re-reads the prohibition as a rule about what you study first, and then does not stop at permission — it makes the study a duty, because the phases were determined so that the reckoning might be known. And then the treatise signs off with a blessing on the pure Imams, the moons amid the darkness, which turns out to have been the whole argument in miniature all along.

    '
