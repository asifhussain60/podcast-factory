  references:
    - The opening application of the pillar principle to the fast, and the charge that individual ijtihad treats the non-obligatory as obligatory, abandons the obligatory, and calls a violation of Allah's command a Sunnah.
    - 'The objection from concurrence: that a single shared day of entry makes some believers fast days belonging to Sha''ban in a manner the Prophet did not command — carrying the damaged word that reaches us meaning irony.'
    - The two-cause doctrine of obligation, worked through prayer (the day, then the sun past its zenith), zakat (wealth, then a full year), Hajj (ability, then the greatest day in Mecca), jihad (discord, then a leader who leads the community), and fasting (the conjunction, then dawn) — then recapitulated from the other side.
    - The great outward testimony as a balance between the revealed Law and the created order among the horizons and within souls, with the signs verse (chapter 41, verse 53), and the damaged phrase naming a barn where Jerusalem's sanctuary is required.
    - 'The two dimensions of the call to the way of the Lord with wisdom (chapter 16, verse 125): outward bodily worship through the obligatory duties and Sunnahs, and interpretation as the hidden worship of the soul that supports it.'
    - 'The four sun-to-Prophet correspondences: noblest of bodies, source of light, cause of births, cause linked to all the causes of the world.'
    - 'The four moon-to-foundation correspondences: pre-eminence in receiving light, reception exceeding all others, illumination of the night''s darkness as the sealed symbols and multiplied parables, and intermediacy in the birth of spiritual children.'
    - 'The seven lunar states read as the history of the foundation''s authority: conjunction and the minister before the king with the city-and-gate saying; concealment beneath the sun''s rays; the crescent seen by old and young; the absence of light while the sun is up; the weak first crescent and the divergence over the Imamate; the increase of light over the days; and the fourteenth night''s completion at the end of the cycle.'
    - 'The pairing of the doubtful day with the unrecognised authority: the people of knowledge affirming the hidden day, the common people breaking their fast until their own eyes catch the crescent, and their treating the foundation''s obedience as no different from anyone else''s.'
    - Ramadan as the sign of the foundation, the revelation verse (chapter 2, verse 185), and the twenty-three-year argument that forces the verse to point at signs, the criterion, and the distinction rather than a single night.
    - 'The commands read as the figure: not raising voices above the Prophet''s voice (chapter 49, verse 2); witnessing the month as attending the council in silence (chapter 2, verse 185); the prohibition-implies-prior-licence inference with the marriage-guardian saying; and the sick-or-travelling exemption (chapter 2, verse 185) as the exemption of the questioner and the teacher.'
    - 'The year-four-hundred calculation: the Monday conjunction, the crescent unseen on Tuesday night, six degrees and some minutes above the horizon at sunset beneath the sun''s blocking ray, the Shawwal conjunction on Wednesday night and the forbidden Eid it would have produced, and the rule that neither Sha''ban nor Ramadan is deficient.'
    - 'The certification from the rites: the compressed saying about fasting on the day of your fasting, and the slaughter in the Haram on Monday the tenth of Dhu al-Hijjah by knowledge, the ninth by the eye.'
    - 'The astronomy objection and its two-limbed answer: the consistency argument from the qibla and the prayer times settled by the lunar mansions and the sun''s altitude, with the scriptural fragment that breaks off mid-sentence; and the re-reading of the prohibition as a rule about the order of study, evidenced by the followers of Ptolemy.'
    - 'The scriptural cascade on the sky: the greater creation (chapter 40, verse 57), the signs on the horizons (chapter 41, verse 53), the constellations and the lamp (chapter 25, verse 61), the positions of the stars (chapter 56, verses 75 and 76), the receding planets (chapter 81, verses 15 and 16), the zodiac (chapter 85, verse 1), the sun''s radiance (chapter 91, verse 1), and the phases determined for the reckoning (chapter 10, verse 5).'
    - The conversion of licence into duty, the planetary aspects pointing to the ranks of Allah's guardians, and the closing chain of questions on darkness and light, the blind and the seeing, the knowing and the ignorant — given without a reference because it is woven from more than one verse.
    - The closing result on the two kinds of sighting and the Prophet's use of the letter lam, the direct address to the reader, and the treatise's valediction naming the pure Imams as the moons amid the darkness.
thesis_relevance: 'This chapter advances the book''s central claim that the pillars and rulings of Islam must be understood through faithful knowledge, action, and the authoritative guidance of the Ahl al-Bayt by showing that the fast''s outward timing and its inner meaning are two dimensions of one call — so that the same calendar which obliges the body by dawn also figures, in the moon''s own states, the authority the community is bound to recognise and obey.

  '
