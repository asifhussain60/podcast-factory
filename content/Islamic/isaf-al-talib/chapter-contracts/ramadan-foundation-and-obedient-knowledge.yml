title: The Figure in the Calendar
audience: 'Thoughtful adult listeners reaching the end of a faithful translation-edition series on Is''af al-Talib, at the point where the crescent letter finishes its legal argument, turns the whole apparatus of the fast into a figure of the Imam''s authority, and then closes by showing its astronomical working for a named year and defending the right to do the arithmetic at all.

  '
angle: faithful_exposition
angle_note: 'The slice is expounded in its own order across three registers. First the law: the objection that a shared first day forces some believers to fast a day of Sha''ban, answered by the doctrine that every obligation stands on a general preceding cause plus a specific second cause, demonstrated through prayer, zakat, Hajj, jihad, and fasting, then recapitulated from the other side and turned back on the opponent''s fallback position. Second the interpretation: the call divided into outward bodily practice and hidden knowledge, the sun as the figure of the Prophet in four correspondences, the moon as the figure of the foundation in four more, the seven lunar states read as the history of that authority, and then Ramadan, the revelation verse, the command to witness the month, the marriage-guardian parallel, and the exemption of the sick and the traveller all read as the same figure extended. Third the licence: the worked calculation for the year four hundred with its degrees, nights, and forbidden Eid, the certification from the rites in Mecca, and the objection that the Prophet forbade taking the stars as a guide, answered by a consistency argument from the qibla and prayer times and by re-reading the prohibition as a rule about the order of study. Four damaged passages are named rather than repaired: the word meaning irony where the sense requires the entry into the fast, the phrase naming a barn where Jerusalem''s sanctuary is required, the compressed clause about those whose days were devoted sincerely, and the broken scriptural fragment that stops mid-sentence in the astronomy defence. The closing valediction of the treatise is rendered whole.

  '
episode_format: deep_dive
format_rationale: 'The one unfolding doctrine is that the fast''s outward timing and its inner meaning are two dimensions of a single call, so that the calendar of Ramadan is at once a legal instrument and a figure of the foundation''s authority — developed first through the two-cause analysis of obligation, then through the celestial correspondence and the lunar states, and finally through the worked calculation and its defence. No sustained named opposition runs through the slice: two objectors appear, neither is named, and each is granted a single quoted challenge answered at length with no reply of his own, far below any threshold of voiced back-and-forth. Debate was rejected because no party is named and nothing is contested in dialogue; narrative was rejected because the only narrated material is one dated astronomical case used as evidence.

  '
essential: core
essential_rationale: 'It supplies the two-cause doctrine of obligation, the sun-and-moon correspondence with the Prophet and the foundation, the reading of the lunar phases as the history of the Imamate, and the book''s only worked astronomical calculation with its licensing argument — none of which appears anywhere else in the series, and all of which the whole crescent dispute was built to reach.

  '
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: 'The curious_mind presses the questions a first-time listener would ask — how a single shared first day can avoid making somebody fast a day that carries no duty, whether reading the moon''s phases as one man''s biography is argument or decoration, why a verse about the Quran''s revelation needs interpreting at all, and how a treatise that has just spent pages on symbolism can turn round and quote degrees above the horizon — while the scholar_companion carries the argument in the source''s own order, keeps the two dimensions of the call distinct, names the damaged passages rather than repairing them, and holds the closing conclusion to the careful thing the letter actually says about the eye-rule.

  '
length_target: 5500-6000
key_tensions:
  - 'Private judgement about the month does not merely mistime a duty; it invents obligations on days that carry none and dissolves them on days that do.

    '
  - 'If the whole community must begin on one day, somebody is being made to fast a day that by his own reckoning still belongs to Sha''ban.

    '
  - 'Every obligation turns out to stand on two causes, and almost every dispute about when a duty begins is a confusion between them.

    '
  - 'The conjunction was never what obliged anyone to fast; dawn was, and dawn is local, ordinary, and available to everybody.

    '
  - 'The opponent''s fallback — fast only the Ramadan portion — cannot be carried out without first finding the month''s edge by knowledge.

    '
  - 'The revealed Law and the created order are set up to answer each other, which makes the sky admissible evidence in a legal argument.

    '
  - 'The rank of the foundation is figured by the one body in the sky that has no light of its own.

    '
  - 'The moon in daylight is not absent from the sky, only outshone — which is what the letter says the foundation''s authority was during the Prophet''s lifetime.

    '
  - 'The day of doubt at the month''s edge and the failure to recognise an unproclaimed authority are described as one failure occurring twice.

    '
  - 'The revelation verse cannot mean a single night''s delivery, because the Quran came down over twenty-three years — so the verse must be pointing at something else.

    '
  - 'A command to fast when you witness the month is read as a command to sit silent in a teaching council, and the outward duty is left untouched by that reading.

    '
  - 'A prohibition is treated as proof that people had been doing the thing freely beforehand, in the fast and in marriage alike.

    '
  - 'Breaking the fast on a day the eye could not have read does not shorten a month by one day; it puts a festival on a day when eating was forbidden.

    '
  - 'The rites in Mecca that year fell on the day knowledge named, with the eye''s count running a day behind.

    '
  - 'The last objection concedes every number and attacks the licence: a correct answer from a forbidden instrument.

    '
  - 'Nobody objects to a prayer direction found by computation, and that is a pillar too.

    '
  - 'The prohibition on the stars is re-read as a rule about the order of study, with the followers of Ptolemy as the evidence.

    '
  - 'If the moon''s phases were determined so that the reckoning might be known, then studying them is not merely permitted but owed.

    '
tone_constraints:
  - 'Open with a curiosity hook on the claim that the moon''s monthly performance is a portrait of one man''s life rather than a timekeeping device — not neutral stage-setting.

    '
  - 'Use only brief callbacks for doctrines already taught in earlier chapters: the levels of faith, guardianship and knowledge, peace and belonging, sacred ranks, disciplined loyalty, affection as law, bodily purity, purity under conditions, inner water, major washing, material purity, tayammum paths, food and contact, grooming boundaries, Ja''far''s admonition, hair, skin, and bone, menstruation and nifas, disavowal and waiting, attentive prayer, missed obligations, sacred times, the summons, the adhan''s witness, the discussion letter, the remaining proofs, unequal errors, the first testimony, public dedication, entering the mosque, guarded direction, standing behind, ranked leadership, following without fracture, shared boundaries, the admonition, prayer''s shape, the answerable plea, speech and motion, garment and ground, Friday''s gathered order, Eid''s revealed interior, certainty and omission, prayer that does not break, the latecomer''s entry, the forming of children, the journey and its licence, kinship that completes the prayer, intention, return, and dispensation, sickness, eclipse, fear, and drought, Witr, qunut, and the dawn, voluntary devotion and its limits, the visit and its restraint, the measure of a lifespan, remembering death, the wailing admonition, washing and shrouding the dead, procession, prayer, and grave, khums above tithe, the twelfth council''s reckoning, concealment and misdirection, coin, debt, and the threshold, grazing herds and watered ground, the charity of the head, the shield of every sense, the crescent and the name, seven obligations, twelve devotions, absence and the moon''s arithmetic, a prophet who need not look, a number of days, the moon''s own timetable, the necessary message on fasting, nothing created without its pair, two kinds of sight, what blocks the eye, what seeking the crescent seeks, the decline no eye catches, obscured skies and two ranks, and the pillars held in trust.

    '
  - 'Six callbacks in particular are spent in a clause each and never re-argued: the previous chapter''s generalization that every pillar is entrusted to the community under its leader, which opens this chapter as a settled premise; the zakat rules, which appear only so that zakat''s two-cause anatomy can be given; the blocking of the eye by the sun''s light, used as an established physical fact inside the year-four-hundred calculation; the rule that neither Sha''ban nor Ramadan is deficient, quoted once as the constraint the counterfactual violates; the division of sight into two kinds, invoked only in the closing result; and the making up of missed days by the sick and the traveller, named once to confirm the outward ruling is untouched.

    '
  - 'Preserve the Arabic and Islamic technical terms, names, and titles supplied by the source, including Ramadan, Sha''ban, Shawwal, Dhu al-Hijjah, ijtihad, zakat, Hajj, jihad, Sunnah, the Haram, Mecca, Jerusalem, Ptolemy, the Imam, the foundation, the letter lam, Muhammad al-Mustafa, and Ali al-Murtada.

    '
  - 'Present the two-cause doctrine, the celestial correspondence, the reading of the lunar states, and the astronomy licence as the source''s own claims, without modern astronomical, legal, or apologetic expansion, and without importing any computation the source does not supply.

    '
  - 'Keep the relation between the two dimensions of the call the way the source states it: interpretation supports outward bodily worship and never replaces it, and the outward rulings on fasting are left standing wherever the interpretive reading is offered.

    '
  - 'Name the damaged passages rather than repairing them: the word meaning irony where the sense requires the entry into the fast; the phrase naming a barn in Jerusalem where the city''s sanctuary is required; the compressed clause about those whose days were devoted sincerely; the compressed saying rendered as fasting on the day of your fasting; and the scriptural fragment in the astronomy defence that breaks off mid-sentence.

    '
  - 'Give each of the two objectors his challenge in his own voice and let it land as a genuine difficulty before any answer is offered.

    '
  - 'Render the treatise''s closing valediction whole, in refined English, and let the phrase describing the Imams as the moons amid the darkness land as the arrival of the chapter''s own image.

    '
  - 'Quranic quotations carry plain-English references where the verse is unambiguous; the closing chain of rhetorical questions is woven from more than one verse and is deliberately given without a reference.

    '
  - 'Drop the book-catalogue heading that follows the valediction in the source as book-object apparatus.

    '
anchor_passages:
  - 'Did that interruption lead them to enter the fast through their own ijtihad, which causes them to treat what is not obligatory as obligatory and what is obligatory as abandoned, or to count as a Sunnah what is in fact a violation of Allah''s command and a departure from the infallibility of His authority? We seek refuge in Allah from that.

    '
  - 'According to your principle — which is that the beginning of fasting requires concurrence, and that the entry must fall on a single day — the concurrence implies that some of those days are from Sha''ban and some are from Ramadan, and it becomes obligatory for some to fast in a manner the Prophet did not command.

    '
  - 'The Prophet and his family imposed the obligatory duties by Allah''s command and established for each obligation a preceding cause that is general — in the sense that it is a cause for that particular obligation and for other obligations as well — and a second cause that is specific and particular to that obligation alone, distinguishing it from the others.

    '
  - 'In the same way, fasting is not obligatory merely because the moon exists at dawn.

    '
  - 'We will show them Our signs on the horizons and within themselves until it becomes clear to them that it is the truth.

    '
  - 'This call is divided into two dimensions: outward practice, which is the natural bodily worship performed through obligatory duties and the Sunnahs the Prophet brought; and interpretation, which is knowledge — the great hidden, psychic worship peculiar to particular souls.

    '
  - 'Just as the sun is the source of light for the other planets, so the Prophet is the source for human souls in the divine sciences that lead to monotheism.

    '
  - 'Just as the moon illuminates the darkness of night, so the foundation illuminates what the Prophet conveyed of the sealed symbols, the simplified law, and the multiplied parables.

    '
  - 'This is like a minister meeting the king: the king commands him, and he in turn commands the kingdom to carry out whatever the king signs.

    '
  - 'I am the city of knowledge and he is its gate; whoever wishes to enter the city, let him come through the gate.

    '
  - 'Another condition is that the moon has no light during the day when the sun is above the horizon — it has no presence until after the sun''s setting — and this is like the foundation having no authority during the life of the Prophet until after the Prophet''s departure from this world.

    '
  - 'The ignorant and the common people, by contrast, doubt that day — unsure whether it should be fasted from the prior month or not — due to their limited knowledge, and so they break their fast until they see the crescent with their own eyes.

    '
  - 'For we know that the Quran was revealed over twenty-three years, not all at once in the month of Ramadan; rather, it came down day by day, month by month, and year by year.

    '
  - 'So whoever among you witnesses the month, let him fast — and this is a signal from the spokesman to the nation to follow the foundation and heed what he says.

    '
  - 'There is no marriage without a guardian and two witnesses.

    '
  - 'At sunset it was at six degrees and some minutes above the horizon, and at such a distance — half of its mass — the sight cannot catch it because it falls beneath the blocking ray of the sun.

    '
  - 'The conjunction of the sun and moon for Shawwal fell on the night of Wednesday at two hours and some minutes — making Wednesday the day of the forbidden Eid.

    '
  - 'What I have mentioned of the hadith of the sun and the moon, and the degrees, the distances, and the hours — making all of this your guide — is something the Prophet forbade, namely taking the stars as one''s guide and acting on them.

    '
  - 'The Prophet prohibited that pursuit only because of the risk that a student might chase astronomical knowledge without first grounding himself in the divine sciences — a danger that afflicted the followers of Ptolemy and those who attributed divinity to the celestial bodies.

    '
  - 'It is He who made the sun a light and the moon a light and determined its phases, so that you might know the number of years and the reckoning.

    '
  - 'Are darkness and light equal? Are the blind and the seeing equal? Are those who know and those who do not know equal? Only those of understanding take heed.

    '
  - 'Prayers upon the pure Imams — the moons amid the darkness — and upon the Imam of the age, our master, our guide, and the guardian of our blessings.

    '
