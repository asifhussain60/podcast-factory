thesis_relevance: 'This chapter advances the book''s central claim that the pillars and rulings of Islam must be understood through faithful knowledge, action, and the authoritative guidance of the Ahl al-Bayt by supplying the argument''s epistemology: that the faculty by which an obligation is timed is knowledge rather than eyesight, that the law never attached the fast to what a person happens to catch sight of, and that a community acting on established signs is taking the instrument that does not err.

  '
