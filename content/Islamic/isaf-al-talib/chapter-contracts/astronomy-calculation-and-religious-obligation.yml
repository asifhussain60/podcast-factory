show_notes:
  blurb: 'Of your two eyes, the more reliable one is not in your head. That is the claim this chapter makes and then spends itself proving, and it is the counterpart the previous chapter left unnamed: seeing, like everything else God made, comes in two — natural vision, which belongs to the eye and is sovereign over colors and forms, and intellectual vision, which belongs to the heart and reaches the causes behind what is shown. The proof is a date: a verse asks the Prophet "have you not seen" about an event from before his birth, so the Qur''an uses seeing for something other than looking. The image is a pool: take one drop out and the eye reports no change, and the eye is simply wrong. From there the obligation follows — a man who knows the prayer''s hour is bound though no call reached him, a man who knows dawn has broken is bound though he cannot see the sky, and a community that knows the crescent has emerged is bound though cloud or glare stands in the way. Then the most technical passage in the book: the month defined as a circuit from conjunction to conjunction on a definition taken openly from astronomers, the mechanics of how the crescent''s light appears and grows, and a list of what stops the eye — cloud, dust, a wall, a mountain, and the sun, which is the strange one, since it both makes the crescent''s light and drowns it, exactly as it drowns the planets standing unseen overhead at noon. Then the opponent, pressed three times, ending in a fork with no exit: a fast broken on the thirtieth day with no crescent sighted is either valid, and he has just certified an unseen moon by knowledge, or invalid, and he must claim the soul knows nothing the senses have not handed it. The deepest move is the quietest — what is a sighting actually for? Not the moon''s color, which is known; not its shape, which cannot change; not its thickness, which no law has specified. It is to settle whether the moon now stands west of the sun, and that is a position, which no eye has ever been able to report even on a perfect night. And then the grammar: the lam in "upon seeing it" is the lam of preparation — ready the room before the guest arrives, work for the Hereafter, where no work is done. The opponent answers with the verse commanding prayer at the sun''s decline, where nobody prays early, and the letter accepts the case and reads it its own way: the decline is a crossing point in geometry no one has ever witnessed. The proof of that was a diagram, and the diagram is lost — a thousand-year-old argument about the limits of eyesight closing by asking us to look at something we cannot see.

    '
