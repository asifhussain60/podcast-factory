show_notes:
  blurb: 'The opening chapter of Is''af al-Talib compresses the author''s preface and begins the real teaching with faith. Faith is not a label for inherited identity or copied worship: it requires knowledge, action, and walaya. The chapter names seven duties, beginning with guardianship, and twelve social obligations that carry faith into parents, kin, neighbors, households, feeding, brotherhood, and visiting the sick. It then turns to the walaya of Ali ibn Abi Talib and the Ahl al-Bayt through reports in which questions expose who truly carries knowledge. Finally it teaches salām as both daily etiquette and religious submission: peace comes from God and the angels, is exchanged by believers, and must be returned with excellence, equality, or justice.

    '
