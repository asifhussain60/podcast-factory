    - The noble books on the eight levels of faith.
    - The fourth Quran council of the Mustansiriyya Councils on seven duties and twelve obligations.
    - The Four Hundred Counsels attributed to Ali ibn Abi Talib on sectarian division and returning greetings.
    - Ja'far ibn Mansur al-Yaman, Book of the Foster-Suckling, on the righteous servants and the Imams.
    - al-Mu'izz li-Din Allah's Friday sermon on the pen, tablet, and ranked guidance.
    - Uns al-Afidah al-Muniba on the reports of Ali ibn Abi Talib's answers and rulings.
    - The twenty-third and twenty-fourth Mustansiriyya councils on the revelation and return of salam.
thesis_relevance: 'This chapter advances the book''s central claim that the pillars and rulings of Islam must be understood through faithful knowledge, action, and the authoritative guidance of the Ahl al-Bayt by establishing walaya as the first duty of religion, proving guidance through inherited knowledge, and showing how even social obligations and greetings become acts of faith.

  '
