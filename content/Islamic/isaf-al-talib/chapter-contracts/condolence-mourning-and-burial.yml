  references:
    - al-Mukhtasar al-Musannaf, on not shaving the hair or cutting the nails of the deceased.
    - The book of questions and answers arranged according to the order of the chapters of Arkan al-Islam, on weapons placed on the deceased, on the washing dispensations, on the shroud's precedence over debt and bequest, on the funeral procession, on the funeral prayer, and on burial and graves.
    - The noble epistle of Ja'far ibn Sayyidina Sulayman, The Sharpest Sword in Nullifying Innovations — the passage on wailing and its innovations, taught here; the epistle itself was taught in full earlier in the series.
    - Arkan al-Islam, on the dying instruction of Ja'far ibn Muhammad that no one wail for him and no garment be torn.
    - The letter of Ali ibn Abi Talib to Rifa'ah ibn Shaddad, his judge over al-Ahwaz, forbidding wailing throughout the province.
    - The narration of ʿAbdullah and the angel with the iron club, with the Messenger of Allah's confirmation and warning.
    - The replies Ja'far ibn Sayyidina Sulayman sent from the island of Yemen to the island of Hind, on the zar method, the sarah, the covering from navel to knees, the three-garment shroud, and the meaning of 'ajar in Qadi al-Nu'man ibn Muhammad's book on purity.
    - The book of questions from scholars of India answered by preachers of the Yemeni peninsula, on conjoined twins when one of them dies.
    - The summary of the classification, the summary of the effects, the summary of the monuments, the summary of antiquities, the book of purity, the interpretation of the Pillars, the Book of Reports, and the councils of the statement — on washing, embalming, incense, the procession, and the funeral prayer.
    - The Four Hundred Counsels attributed to Ali ibn Abi Talib, on ghusl after touching the cooled body, on camphor and the state of ihram, and on attending the graves one needs.
thesis_relevance: 'This chapter advances the book''s central claim that the pillars and rulings of Islam must be understood through faithful knowledge, action, and the authoritative guidance of the Ahl al-Bayt by settling the entire funeral rite from transmitted reply rather than from custom — so that a community''s inherited mourning is named an innovation, a washing method other communities insist upon is displaced by what the Pillars actually describe, and every handover of a body, from the family to the washer to the imam to the ground, is decided by a named authority answering a written question.

  '
