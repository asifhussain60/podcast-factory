show_notes:
  blurb: 'A man lies unconscious while the women of his house cry out over him, and when he wakes he reports an angel with an iron club that rose every time they named him as the thing they had lost. That narration is the hinge of a chapter that forbids wailing because it reaches the dead — and then defends weeping with the Messenger of Allah''s own tears, drawing the line through what is said rather than what is felt. From there the body is handed along: washed by whoever is nearest, even a man in major impurity, because presence outranks purity; wrapped in a shroud that is taken out of the estate before any creditor is paid; treated throughout as a pilgrim in ihram, permitted no fragrance but camphor. Then the street, where women who will not pray or carry are sent home with sin and no reward; the prayer, which may be said anywhere and is led by public authority before family; and the grave, where a trespassed landowner is paid for his plots and the dead stay in them. It ends by sending the reader back to the graveyard — the dead visit their graves too, and are glad of the company.

    '
