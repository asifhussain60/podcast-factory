show_notes:
  blurb: 'Two believers stand a night''s ride apart; one sees the new moon and the other does not. Have they begun different months? The previous chapter settled the crescent in a single clause — that the reports about watching for it address those who cannot reach a determination — and this chapter spends itself defending that clause against the party who ties the fast to the sighting and holds that Ramadan is sometimes thirty days and sometimes twenty-nine. The method is the same throughout: the report they rest on is granted, never called weak, and re-read until it says something narrower. It is given back its occasion — companions facing the Prophet''s departure, asking what to do without the man whose fast they had always matched — which makes it a provision for absence rather than a definition of the month. It is set beside an astronomy in which the moon separates from the sun and catches it again at a computable interval, so astronomers count the month instead of watching for it. It is set against a Prophet who had the news of the heavens twice a day and said he knew its pathways as his listeners knew their own roads, and from whom the gradations of sighting — mountain peaks sooner, low ground later — could not have been hidden, which makes it untenable that the same day should be Sha''ban for one man and Ramadan for another because of a ridge or a cloud. The same case is then argued aloud in the court of King Abu Kalijar al-Daylami in Shiraz, against a champion who counts the month out on his fingers and is answered with the picture of a shepherd counting cattle; he leaves the room stumbling in his clothes. Then the arithmetic: a fast prescribed on the pattern of people who calculate, days called a number because a number is already known, an alternating calendar in which Sha''ban is short and Ramadan complete, a middle night that proves twenty-nine and cannot be found in thirty, and an expiation fixed at sixty that has been assuming a thirty-day month all along. The chapter breaks off unfinished, with a formal question put to the scholars of all Islam and none of its answers yet given, and with one last suggestion: that the verb everyone has read as seeing may mean receiving.

    '
