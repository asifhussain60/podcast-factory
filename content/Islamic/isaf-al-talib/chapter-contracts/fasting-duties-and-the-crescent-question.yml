    - 'Our master the long-serving preacher who supports the religion of God — may He be exalted above all — in the forty-second council of the first hundred of his honoured supporting councils, bearing the tag of wisdom in response to those who base fasting on the sighting of the crescent: the occasion of the sighting report, the three counts against the claim that the Prophet sighted, the argument from ''a number of days'', the alternating calendar with the middle-night proof, and the expiation of sixty.'
