thesis_relevance: 'This chapter advances the book''s central claim that the pillars and rulings of Islam must be understood through faithful knowledge, action, and the authoritative guidance of the Ahl al-Bayt by taking the one pillar whose starting date is publicly contested and showing that the contest is really about where knowledge sits — arguing that the month has a determinable course, that the Prophet never needed to look for it, and that the instruction to watch the sky was a provision for people out of reach of the one who knows, so that the believer''s fast begins by following rather than by squinting at a horizon.

  '
