show_notes:
  blurb: 'This chapter moves purity into the ordinary scenes of food, market goods, wet contact, grooming, circumcision, hair, henna, and communal modesty. It asks how impurity is transmitted through process and moisture, when food may still be eaten after small traces are removed, how non-Muslim market goods are judged, and why bodily customs cannot become rival law. The episode culminates in Ja''far ibn Sulayman''s formal admonition against innovations in women''s hair, the timing and publicizing of circumcision, and men adopting adornments assigned to women.

    '
