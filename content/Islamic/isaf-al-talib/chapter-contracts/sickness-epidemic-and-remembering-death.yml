show_notes:
  blurb: 'A town is under plague and a believer asks whether he may leave. The answer permits the journey and removes the reason for it in the same breath, and that double movement sets the temper of a chapter that opens the Book of Funerals from the doorway rather than the grave. Seventy thousand angels accompany a visitor from the hour he sets out — and the plate of food he is offered when he arrives can turn the whole day against him, for reasons the tradition states plainly in terms of a strained household. Then the arithmetic behind the sickbed: a term that is fixed while the division inside it moves, a man caught alive by the Hour and worse off for it, and a mother who may not be buried until her child''s death is confirmed rather than assumed. It closes on four sayings that reread fever as a herald, loss as burrs pulled from an animal''s coat, and an ordinary death in bed as martyrdom.

    '
