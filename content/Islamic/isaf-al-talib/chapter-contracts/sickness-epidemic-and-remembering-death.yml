  references:
    - Tafsir al-Arkan, on the definition of the dying state as the presence of death and the imminence of transition to the hereafter.
    - The book of questions and answers compiled by Sheikh Yusuf ibn Isma'il al-Samati al-Hindi with the responses of Idris ibn Hasan, on flight from epidemic and plague.
    - The same book of questions and answers, arranged according to the order of the chapters of Arkan al-Islam, on the fixity of lifespans and on the wretched man overtaken by the Hour while still alive.
    - The noble epistle of Ja'far ibn Sayyidina Sulayman, The Sharpest Sword in Nullifying Innovations, written to warn the heedless among the people of the island of Yemen — named here, taught in full earlier in the series.
    - Arkan al-Islam, on the established reward for visiting the sick, narrated from the Commander of the Faithful.
    - The narration of the Messenger of Allah forbidding the visitor to eat the food of the sick man in his home, with its second narration and its stated reason.
    - The questions of Sheikh Hasan ibn Nuh to Husayn ibn Idris with his answers, Issue Ten, on a woman who dies pregnant with a living, fully formed child.
    - The four hundred points of conduct attributed to the Commander of the Faithful, on sleeping postures, on attendance at what one loves, on remembering death, on fever as the herald of death, and on the calamity that purges the sins of the Shia.
thesis_relevance: 'This chapter advances the book''s central claim that the pillars and rulings of Islam must be understood through faithful knowledge, action, and the authoritative guidance of the Ahl al-Bayt by settling what a believer owes at a sickbed and at a death entirely from transmitted reply — so that flight is permitted without granting the escape it hopes for, a courtesy is forbidden because the rule sees a cost the visitor cannot, and no one at a graveside may presume a moment that belongs to God alone.

  '
