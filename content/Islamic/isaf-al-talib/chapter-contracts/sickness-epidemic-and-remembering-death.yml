title: Visiting the Sick, Remembering Death
audience: 'Thoughtful adult listeners continuing a faithful translation-edition series on Is''af al-Talib, arriving at the opening of the Book of Funerals — where the rulings stop addressing the sick person and start addressing everyone standing around him, and where the length of a life, the moment of a death, and the command to remember both are settled by transmitted reply rather than by instinct.

  '
angle: faithful_exposition
angle_note: 'The episode renders the slice''s cited books, named question-and-answer exchanges, and quoted sayings in coherent modern English while preserving its distinctions between permitting an action and endorsing the belief behind it, between a fixed term and the division inside it, between sensory animal life and the spiritual life death moves a person into, and between confirming a death and presuming one.

  '
episode_format: deep_dive
format_rationale: 'One doctrine unfolds layer by layer across the whole slice — that what a person owes at a sickbed and at a death is fixed by transmitted rule and by God''s jurisdiction rather than by his own instinct to flee, to be hospitable, or to grieve — and each pass deepens it: the visit, the arithmetic of a lifespan, then the command to remember death. NO named opposing voice runs through the chapter; nobody contests a proposition anywhere in it. The four explicit question-and-answer exchanges account for well under half the slice''s words, with the remainder transmitted narration and the Commander of the Faithful''s counsels, so this is a single exposition that quotes replies rather than a Q&A-structured interview.

  '
essential: core
essential_rationale: 'It opens the Book of Funerals and settles the duties owed to and around a dying person — the permission to leave an epidemic, the reward of the visit, the forbidden meal, the obligation to publish the ruling — then fixes the doctrine of the appointed term and the ruling on a living child inside a dead mother, none of which is taught anywhere else in the series.

  '
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: 'The curious mind carries the frightened household''s questions — may we leave, why must I refuse the food I was offered, can a life be lengthened, why is a burial delayed — while the scholar companion answers in the voice of the cited books and the named respondents, Idris ibn Hasan and Husayn ibn Idris, and closes with the counsels of the Commander of the Faithful on remembering death.

  '
length_target: 5500-6000
key_tensions:
  - 'Flight from a plague is permitted without conditions and the reason for fleeing is withdrawn in the same sentence, so the answer grants the action while denying what the fleeing party believes about it.

    '
  - 'A whole day''s reward earned by seventy thousand angels is nullified, and in one narration turned against the visitor, by the most ordinary courtesy there is — accepting the food he was offered.

    '
  - 'Lifespans are said to be deferred and unchangeable and also said in respected books to increase and decrease, and the answer keeps both by moving the increase inside the term rather than to it.

    '
  - 'Being alive when the Hour arrives is presented as worse than being already dead, which inverts the ordinary intuition that death is the misfortune.

    '
  - 'A burial that the tradition treats as urgent is overruled by a requirement of knowledge, since the child''s death must be confirmed rather than reasonably assumed.

    '
  - 'Fever, bereavement, and the loss of wealth are named as a purge that clears the way to a meeting, so the chapter''s hardest events are counted as cleaning rather than punishment.

    '
tone_constraints:
  - 'Open with a curiosity hook on whether a believer may run from a plague and whether running escapes anything, not neutral stage-setting.

    '
  - 'Use only brief callbacks for doctrines already taught in earlier chapters: the levels of faith, guardianship and knowledge, peace and belonging, sacred ranks, disciplined loyalty, affection as law, bodily purity, purity under conditions, inner water, major washing, material purity, tayammum paths, food and contact, grooming boundaries, Ja''far''s admonition, hair, skin, and bone, menstruation and nifas, disavowal and waiting, attentive prayer, missed obligations, sacred times, the summons, the adhan''s witness, the discussion letter, the remaining proofs, unequal errors, the first testimony, public dedication, entering the mosque, guarded direction, standing behind, ranked leadership, following without fracture, shared boundaries, the admonition, prayer''s shape, the answerable plea, speech and motion, garment and ground, Friday''s gathered order, Eid''s revealed interior, certainty and omission, prayer that does not break, the latecomer''s entry, the forming of children, the journey and its licence, kinship that completes the prayer, intention, return, and dispensation, sickness, eclipse, fear, and drought, Witr, qunut, and the dawn, and voluntary devotion and its limits.

    '
  - 'Preserve the Arabic and Islamic technical terms and titles supplied by the source, including Tafsir al-Arkan, Arkan al-Islam, The Sharpest Sword in Nullifying Innovations, and the transmitted names Yusuf ibn Isma''il al-Samati al-Hindi, Idris ibn Hasan, Ja''far ibn Sayyidina Sulayman, Hasan ibn Nuh, and Husayn ibn Idris.

    '
  - 'Do not use the forbidden leadership-title phrase for Ali ibn Abi Talib. Refer to him as Ali ibn Abi Talib, Father of Imams, or by source titles such as the Commander of the Faithful.

    '
  - 'Present the source-era rulings on flight from epidemic, the visitor''s forbidden meal, the sleeping postures, the deferred term, the Hour overtaking the animal state, and the extraction of a living fetus as the source''s own claims, without modern medical expansion, apology, or procedural detail the source does not give.

    '
  - 'Quranic quotations must use plain-English references when supplied by the source; this slice names no verse, so no Quranic quotation is introduced and no reference is invented.

    '
anchor_passages:
  - '"The dying state is the presence of death and the imminence of transition from this world to the hereafter."

    '
  - '"They may go wherever they wish, for the matter is in the hands of Allah Almighty."

    '
  - '"No Muslim slave visits the sick without seventy thousand angels praying over him from the hour he sets out — if it is daytime, until the sun sets; if it is at night, until dawn."

    '
  - 'The Messenger of Allah "forbade eating the food of the sick man in his home, for Allah will thereby nullify his reward" — and, in another narration, "will nullify his reward and even set it against him."

    '
  - '"Whoever is knowledgeable of this must make it known to those who are not, for not everyone is a scholar — yet among the scholars is the one who warns about it. The one who has been warned is excused."

    '
  - '"Let none of you sleep on his back or face down. If you see someone sleeping face down, wake him. And a woman should not sleep lying on her back."

    '
  - '"I ask Allah for well-being from the severity of calamity, for the severity of calamity is a trial for one''s religion."

    '
  - '"There are deferred lifespans that neither increase nor decrease. But the meaning of increase and decrease is sound in the sense that what decreases from the past portion increases in what remains of the future."

    '
  - '"If the Hour comes upon him while he is still in the animal state, that is the case."

    '
  - '"If a woman is available to extract it, it is obligatory to do so if it is possible, or if the fetus is six months or older and shows signs of life. The mother should not be buried until the child''s death is confirmed."

    '
  - '"Let none of you be present at something he loves unless the Messenger of Allah, may Allah''s peace and blessings be upon him, would also attend it — otherwise it holds no good. Stay, and good news will come to you."

    '
  - '"Remember death often on the day you emerge from your graves and on the day of your resurrection before Allah — this will make your calamities easier to bear."

    '
  - '"Fever is the herald of death. Allah imprisons in the earth whomever He wills among His servants, and it wipes away sins as thistles are removed from camel fur."

    '
  - '"None of our Shia will leave behind something we have forbidden, and then die, without being struck by a calamity that purges his sins — whether in his wealth, his child, or even in his own person — so that he meets our love with none of his sins remaining upon him."

    '
  - '"The dead among our Shia is a martyr — one who believed in our cause, loved us, and allied with us."

    '
