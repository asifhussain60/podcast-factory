  references:
    - The Book of Question and Answer arranged according to the pillars of Islam and their doors.
    - Mukhtasar al-Musannaf on invalidators of wudhu', interruption, water, and vessels.
    - The commentary on the pillars on continuing interrupted ablution.
    - The fifth Mustansiriyya council on the seven obligations and twelve Sunnahs of purity.
    - The Four Hundred Etiquettes attributed to Ali ibn Abi Talib on bodily purification, invocation, modesty, and wudhu'.
    - Ta'wil al-Da'a'im and Ta'wil al-Shari'ah on etiquette, vessels, and the meaning of purification.
    - Majlis al-Bayan on the obligations and Sunnahs of wudhu' and ghusl.
    - Zayd ibn Muhammad ibn al-Fadl's hidden message on outward and inward purity.
thesis_relevance: 'This chapter advances the book''s central claim that the pillars and rulings of Islam must be understood through faithful knowledge, action, and the authoritative guidance of the Ahl al-Bayt by showing that the law of purification trains both the body for prayer and the soul for knowledge.

  '
