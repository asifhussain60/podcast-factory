show_notes:
  blurb: 'This chapter begins the book''s treatment of purity. It teaches wudhu'' as seven obligations surrounded by twelve Sunnahs, ghusl as greater purity, and bodily etiquette around relieving oneself, concealment, invocation, direction, clothing, vessels, and prayer. It then tests the law under real conditions: forgotten Sunnahs, wounds, disability, dried limbs, used water, contaminated water, uncertain vessels, tayammum, disliked prayer places, and the difference between obligation, preference, and validity. The chapter culminates in ta''wil: outward water cleans visible filth, while inner water, knowledge, cleans doubt and ignorance.

    '
