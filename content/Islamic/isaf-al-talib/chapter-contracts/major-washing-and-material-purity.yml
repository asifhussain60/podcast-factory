show_notes:
  blurb: 'This chapter completes the book''s major purity movement by turning from wudhu'' to ghusl, janabah, material impurity, garments, land, furnishings, vessels, siwak, and tayammum. It asks what purity requires when water is harmful, scarce, or inaccessible; when impurity has dried from land; when rugs and mattresses cannot be wrung out; when garments are made, worn, or splashed under uncertain conditions; and when only hidden dust or limited water remains. The chapter lands on purity as disciplined judgment: remove real impurity, do not invent impurity without evidence, and never let an outward act replace intention.

    '
