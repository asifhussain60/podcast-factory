title: Zakat as Obligation and Intention
audience: 'Thoughtful adult listeners continuing a faithful translation-edition series on Is''af al-Talib, now past the Book of Funerals and standing at the opening of the Book of Zakat — where the obligation is defined before any of it is counted, one household is barred from receiving what everyone else may receive, and a payment that visibly left a man''s hands can still be ruled unpaid.

  '
angle: faithful_exposition
angle_note: 'The episode renders the slice''s cited books, its one formal council address, and its named question-and-answer exchanges in coherent modern English while preserving the distinctions it turns on: between a fifth that contains a tenth and a tenth that does not contain a fifth, between charity aimed at people and zakat aimed at the giver''s own wealth, between wealth that increases and wealth that is merely used, between withholding and the concealment that a partial payment performs, and between a sum surrendered and a delivery completed.

  '
episode_format: deep_dive
format_rationale: 'The slice unfolds one position — that zakat is a delivery to a named authority rather than a quantity surrendered — layer by layer, from the exclusion of the Prophet''s household through the containment of the tithe by the khums, the twelfth council''s enumeration of what it is taken from and disbursed among, and finally the rulings on partial payment, on misdirected payment, and on the believer who spends nothing. No named party contests any proposition anywhere in the slice: the four questioners in the second heading ask for clarification and accept the answers without reply, and the one place a questioner presses a reading — the covenant for Hanaf ibn Salim, which he reads as a licence being abused — is corrected in a single sentence rather than argued. There is nothing approaching sustained named opposition, so debate is wrong; the Q&A runs only through the second of two headings and never supplies the chapter''s spine, so interview is wrong; and no events are narrated, so narrative is wrong.

  '
essential: core
essential_rationale: 'It opens the Book of Zakat and carries the whole definition of the obligation — who may not receive, what the khums and the tithe do to each other, what zakat falls upon, where it must be delivered, who it is disbursed among, and what withholding costs — none of which is taught anywhere else in the series and all of which the next chapter''s arithmetic presupposes.

  '
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: 'The curious mind presses the questions the slice itself raises and never answers outright — how a payment handed over openly can be called concealed, why a family at the summit of sanctity is the one family barred from charity, why an unpaid charity should be able to void a completed prayer — while the scholar companion supplies the source''s own settlements in the voice of its named authorities: Ja''far ibn Mansur al-Yaman, Zayd ibn Muhammad, the Four Hundred Manners of Ali ibn Abi Talib, the twelfth council of the owner of the councils of al-Mustansiriyya recited whole before it is discussed, and the book of questions and answers arranged according to the chapters of The Pillars of Islam.

  '
length_target: 5500-6000
key_tensions:
  - 'The one household the community holds highest is the one household categorically forbidden to draw on the fund that relieves need, so a giver looking for the worthiest recipient is told at the outset he may not have him.

    '
  - 'The khums encompasses the tithe and the tithe does not encompass the khums, so two obligations that look parallel turn out to be nested — and paying the smaller one faithfully leaves the larger one wholly outstanding.

    '
  - 'A failure that happens nowhere near the prayer mat is said to remove the prayer entirely — not to diminish it, but to empty the category — which makes the two pillars inseparable rather than separately scorable.

    '
  - 'Charity is prescribed as medicine for people and zakat as fortification for the giver''s own wealth, so the portion handed over is named as the defence of the portion kept rather than as a loss repaid later.

    '
  - 'The hidden message counts ten things and the twelfth council counts seven, and the difference is a taxonomy rather than a disagreement — except at the mine, which only the council admits.

    '
  - 'Zakat below the threshold is still owed and owed on a different clock: the day of the harvest rather than the completion of a year, so the floor that exempts everywhere else does not exempt here.

    '
  - 'Nearly every rule in the sunnahs list restrains the collector rather than the payer — middling cattle only, no padding or splitting a herd, and the stud animal untouchable — which keeps an assessment from consuming the thing it assesses.

    '
  - 'Concealment is performed by the part that was handed over: a man who pays most of his zakat produces the receipt that hides the remainder, and what he is said to have abandoned is the whole obligation rather than the fraction.

    '
  - 'A payment delivered to the wrong party has not been made at all, and may be reclaimed by any means — so parting with the correct sum is the one thing that cannot discharge this duty.

    '
  - 'The man with outward prayer and inward conviction who spends nothing is granted both his belief and his practice and still described as a defaulter — he has bought himself and not paid the instalments.

    '
tone_constraints:
  - 'Open with a curiosity hook on what it would mean to be told one''s prayer does not exist, grounded in the hadith the slice quotes at both its opening and its close, not neutral stage-setting.

    '
  - 'Use only brief callbacks for doctrines already taught in earlier chapters: the levels of faith, guardianship and knowledge, peace and belonging, sacred ranks, disciplined loyalty, affection as law, bodily purity, purity under conditions, inner water, major washing, material purity, tayammum paths, food and contact, grooming boundaries, Ja''far''s admonition, hair, skin, and bone, menstruation and nifas, disavowal and waiting, attentive prayer, missed obligations, sacred times, the summons, the adhan''s witness, the discussion letter, the remaining proofs, unequal errors, the first testimony, public dedication, entering the mosque, guarded direction, standing behind, ranked leadership, following without fracture, shared boundaries, the admonition, prayer''s shape, the answerable plea, speech and motion, garment and ground, Friday''s gathered order, Eid''s revealed interior, certainty and omission, prayer that does not break, the latecomer''s entry, the forming of children, the journey and its licence, kinship that completes the prayer, intention, return, and dispensation, sickness, eclipse, fear, and drought, Witr, qunut, and the dawn, voluntary devotion and its limits, the visit and its restraint, the measure of a lifespan, remembering death, the wailing admonition, washing and shrouding the dead, and procession, prayer, and grave.

    '
  - 'The councils of al-Mustansiriyya already supplied this series with the seven levels of prayer by place, the tenth council on imamate, the sixth council matching purity to the chapters of the witnessing, and the map of the seven places of omission. Name that method in one line when the twelfth council repeats it for zakat; do not re-teach the earlier councils.

    '
  - 'Preserve the Arabic and Islamic technical terms and titles supplied by the source, including zakat, khums, nisab, awsaq, dinars, dirhams, jihad, Shari''ah, Ahl al-Bayt, The Pillars of Islam, the councils of al-Mustansiriyya, the four hundred manners, and the names Ja''far ibn Mansur al-Yaman, Zayd ibn Muhammad, Fatimah, Hanaf ibn Salim and al-Muhanaf ibn Sulaym.

    '
  - 'Do not use the forbidden leadership-title phrase for Ali ibn Abi Talib. Refer to him as Ali ibn Abi Talib, Father of Imams, or by source titles such as the Commander of the Faithful or the Commander of the Believers.

    '
  - 'Present the source-era rulings on the exclusion of the Prophet''s household, the khums and the tithe, the nisabs, the eight disbursement names, the collector''s restraints, the exemption of those seized by the enemy, and the reclamation of misdirected zakat as the source''s own claims, without modern economic, legal or apologetic expansion.

    '
  - 'Three passages survive unevenly in the manuscript — the title the source gives as the book of sub-nursing, the question about charity and the sling, and the covenant''s recipient, whose name appears in two forms. Render what is there and say so; do not repair a title, resolve the sling question beyond the two readings the answer supplies, or choose between Hanaf ibn Salim and al-Muhanaf ibn Sulaym.

    '
  - 'The council''s list of sunnahs is introduced as two, runs to eleven items, and skips the seventh. Reproduce the enumeration and the irregularity, and do not renumber it into consistency.

    '
  - 'Quranic quotations carry plain-English references only where the reference is certain. The harvest verse is unique to its place and is cited; the verse on spending from what has been provided recurs in several places and the source names none, so it is quoted without a reference rather than assigned one.

    '
anchor_passages:
  - '"No charity is permissible for me, nor for my family."

    '
  - 'Whoever fulfils the khums is spared from paying the tithe, except for voluntary giving; but whoever pays the tithe alone is not spared from paying the fifth that he must fulfil, because the tithe does not encompass the khums as the khums encompasses the tithe.

    '
  - '"There is no prayer for one who does not pay zakat."

    '
  - '"Cure your people through charity, and fortify your wealth with zakat."

    '
  - 'You have heard what was recited to you above in jurisprudence concerning guardianship, purity, and prayer — what constitutes the sincerity of testimony, which is the foundation of religion and worship and the first cause of mercy and happiness. Now hear what we recite to you: the mention of zakat, which is one of its rights as established above.

    '
  - 'Zakat must be brought to the Imam and taken from seven things: gold, silver, camels, cows, sheep, crops, minerals.

    '
  - 'Disbursements fall under eight names divided into seven categories.

    '
  - 'Zakat is taken from cattle of middling quality — neither the finest nor the lowest; a joint must not be added to it, nor must the community be divided; the stud animal must not be taken from them.

    '
  - '"and give its due on the day of its harvest" (chapter 6, verse 141).

    '
  - 'There is no zakat on houses, jewelry, and whatever is for use; and each of these words carries many meanings and effects of wisdom.

    '
  - 'This hadith refers to one who pays some of the zakat while withholding the rest — he has abandoned an obligatory duty.

    '
  - '"We are the people of the House — no charity is permissible for us."

    '
  - 'Zakat is not required from those who are not Shi''ites who have been seized by the enemy.

    '
  - 'The one who handed over zakat to one whom Allah did not command him to hand it to — it is permissible for him to reclaim it by any means until he hands it over to the guardian or to whoever receives it by his command.

    '
  - 'The one who performs the outward prayer while holding inward conviction, yet does not spend of what Allah has provided for him as he has been obligated, has bought himself, yet failed to pay off the debt he owed.

    '
  - '"The one who withholds zakat is in the Fire."

    '
