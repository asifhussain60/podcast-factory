  section_title: The Twelfth Council's Reckoning
show_notes:
  blurb: 'A man who has never missed a prayer is told his prayer does not exist — not that it is deficient, that the category is empty for him — and the reason has nothing to do with how he prayed. This chapter opens the Book of Zakat before any of the counting begins, and it opens by closing a door: the Prophet''s own household may not receive charity at all, which turns out to be a rule about where the payment goes rather than about who deserves it. From there the fifth is shown to contain the tenth while the tenth cannot contain the fifth; charity is prescribed as medicine for people and zakat as a wall around the giver''s own wealth; and the twelfth council of al-Mustansiriyya delivers the whole structure in sevens — seven kinds it is taken from, eight names in seven categories it is paid out among, and a set of rules that mostly restrain the collector rather than the payer, including one that forbids taking the animal without which the herd has no future. Then the failures, and every one of them turns on delivery rather than amount. A man who pays most of his zakat has not paid less; the part he handed over is what conceals the part he kept. A man held by an enemy who cannot reach the authority owes nothing. A man who paid the wrong recipient has not paid at all and may take the money back by any means. And a man whose belief is sound and whose hands are closed has bought his own freedom on credit and stopped paying the instalments.

    '
