  references:
    - Ja'far ibn Mansur al-Yaman, in the book the manuscript names as the book of sub-nursing — on the charity forbidden to the Prophet's family, on providing for the household from obligatory rights and voluntary acts, and on the khums encompassing the tithe.
    - The saying of the Messenger of Allah, 'No charity is permissible for me, nor for my family,' and 'There is no prayer for one who does not pay zakat,' and 'The one who withholds zakat is in the Fire.'
    - Zayd ibn Muhammad, in the hidden message — the ten things upon which zakat is obligatory.
    - The Four Hundred Manners attributed to Ali ibn Abi Talib — 'Cure your people through charity, and fortify your wealth with zakat.'
    - The twelfth council of the owner of the councils of al-Mustansiriyya — the sincerity of zakat, its seven obligations, the seven things it is taken from, the eight names in seven categories of disbursement, the nisabs and the collector's restraints, the due on the day of the harvest, and the exemption of houses, jewelry and whatever is for use.
    - The book of questions and answers arranged according to the order of the chapters of the book The Pillars of Islam — on concealing zakat from the imam, on whether the charity prohibition covers the Imams or all descendants through Fatimah, on charity and the sling, and on the covenant written by the Commander of the Faithful for Hanaf ibn Salim, also given as al-Muhanaf ibn Sulaym.
    - The successive transmissions from the Ahl al-Bayt recorded in the book of Pillars — on reclaiming zakat handed to a recipient one was not commanded to hand it to.
    - The councils of al-Mustansiriyya — on the man of outward prayer and inward conviction who has bought himself and not paid the debt.
thesis_relevance: 'This chapter advances the book''s central claim that the pillars and rulings of Islam must be understood through faithful knowledge, action, and the authoritative guidance of the Ahl al-Bayt by defining zakat as a delivery to the Imam rather than a quantity surrendered — so that the obligation''s boundaries must be known before sincerity is possible, a partial payment is ruled a concealment rather than a shortfall, and money reaching the wrong recipient is held to have never been paid at all.

  '
