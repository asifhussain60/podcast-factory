thesis_relevance: 'This chapter advances the book''s central claim that the pillars and rulings of Islam must be understood through faithful knowledge, action, and the authoritative guidance of the Ahl al-Bayt by showing that when circumstance removes the ordinary conditions of worship, what the worshipper owes is settled by transmitted rule rather than by his own devotion — so an emergency reduces the prayer without cancelling it, and a voluntary act may not be given an occasion the guides never gave it.

  '
