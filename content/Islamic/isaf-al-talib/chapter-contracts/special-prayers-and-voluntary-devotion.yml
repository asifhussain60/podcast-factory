show_notes:
  blurb: 'A sun goes dark on a day the astronomers said it could not, and the answer that comes back corrects the astronomy without discarding it — then refuses to let any calculation start the prayer, which waits on sight alone. That is the temper of a chapter about prayers the calendar does not schedule: the sick who nod with their hearts, the congregation under threat that shortens even its takbirs, the drought that is answered with four hundred utterances in four directions. The second half turns to what nobody is obliged to offer — Witr and its supplication, the vigil, the prayers of praise and sufficiency, the prostration a reader owes a verse — and finds the tradition generous about the hour and immovable about the occasion.

    '
