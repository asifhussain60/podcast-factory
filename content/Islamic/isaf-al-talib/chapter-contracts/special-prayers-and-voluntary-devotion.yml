title: Occasional Prayers and Free Devotion
audience: 'Thoughtful adult listeners continuing a faithful translation-edition series on Is''af al-Talib, ready for a chapter on the prayers that answer an event rather than an hour — illness, eclipse, danger, drought — and on the wide country of voluntary worship that opens once nothing is strictly owed.

  '
angle: faithful_exposition
angle_note: 'The episode renders the source''s transmitted question-and-answer exchanges, cited books, and quoted sayings in coherent modern English while preserving its distinctions between an obligatory and a voluntary debt, between a forgotten and a deliberately omitted qunut, between the false dawn and the true one, between a seen eclipse and a calculated one, and between a prayer offered at a permitted hour and a prayer given an occasion it was never given.

  '
episode_format: interview
format_rationale: 'The slice is built almost entirely of written questions and named replies: the first book of questions and answers arranged according to the chapters of the Pillars of Islam supplies the bulk, and the remaining exchanges are correspondence — Muhammad ibn Fahd''s twenty-second question, Sheikh Hasan ibn al-Mawla Adam al-Hindi answered by the masters of Yemen, Ja''far ibn Sayyidina Sulayman writing to the compiler of this book on Umm Dawud, and Salih ibn Ahmad writing from Yemen to al-Hind in 1135. No opposing party contests a proposition anywhere in the chapter, so this is Q&A structure rather than either an unfolding single exposition or a debate.

  '
essential: core
essential_rationale: 'It settles what the prayer becomes when the conditions the rest of the book assumed are gone — a body that cannot stand, a darkened sun, an enemy, a drought — and then fixes the standing of voluntary worship, including the rule that a missed Sunnah prayer becomes a debt.

  '
host_dynamic: interviewer + subject
host_dynamic_rationale: 'The interviewer puts the chapter''s own questions in the questioners'' voices — the sick man''s family, the believers confused by the eclipse of eight hundred and thirty-seven, the imam whose guard has thinned, the worshipper who forgot the qunut, the prisoners reaching for Umm Dawud — while the subject answers in the voice of the Yemeni respondents and the books they cite.

  '
length_target: 5500-6000
key_tensions:
  - 'The tradition corrects the astronomers'' rule about when a solar eclipse may fall, yet refuses to let any calculation start the eclipse prayer, which waits on sight alone and lapses behind cloud.

    '
  - 'A forgotten qunut leaves the prayer standing while a deliberately omitted one destroys it, so the verdict turns on the worshipper''s will rather than on what is missing.

    '
  - 'Witr is called obligatory, called a Sunnah, and called an appendage of the obligatory prayers in a single sentence, and the section''s difficulties all descend from that unsettled standing.

    '
  - 'Precaution permits the believers to stand in a prayer that is not theirs, and the same answer requires them to make up afterwards whatever the concealment cost.

    '
  - 'A voluntary fast abandoned leaves no debt while a voluntary prayer missed must be made up, so freely offered worship does not remain optional.

    '
  - 'Men in prison are told that a little done consistently is better than a great deal of innovation, which permits the hour freely and withholds the occasion entirely.

    '
tone_constraints:
  - 'Open with a curiosity hook about the sun going dark on a day the astronomers said it could not, not neutral stage-setting.

    '
  - 'Use only brief callbacks for doctrines already taught in earlier chapters: the levels of faith, guardianship and knowledge, peace and belonging, sacred ranks, disciplined loyalty, affection as law, bodily purity, purity under conditions, inner water, major washing, material purity, tayammum paths, food and contact, grooming boundaries, Ja''far''s admonition, hair, skin, and bone, menstruation and nifas, disavowal and waiting, attentive prayer, missed obligations, sacred times, the summons, the adhan''s witness, the discussion letter, the remaining proofs, unequal errors, the first testimony, public dedication, entering the mosque, guarded direction, standing behind, ranked leadership, following without fracture, shared boundaries, the admonition, prayer''s shape, the answerable plea, speech and motion, garment and ground, Friday''s gathered order, Eid''s revealed interior, certainty and omission, prayer that does not break, the latecomer''s entry, the forming of children, the journey and its licence, kinship that completes the prayer, and intention, return, and dispensation.

    '
  - 'Preserve Arabic and Islamic technical terms supplied by the source, including qunut, Witr, shafa''ah, Tahajjud, Tarawih, taqiyyah, nafl, takbir, rak''ah, khutbah, ihram, tasbih, istisqa, al-kadhib, and the transmitted names Muhammad ibn Fahd, Sharaf al-Din Ja''far ibn Sayyidina Sulayman, Dawud ibn Ajab, Sulayman ibn Hasan, Hasan ibn al-Mawla Adam al-Hindi, Salih ibn Ahmad, Qasim ibn Feer, and Mawlay Badr al-Din.

    '
  - 'Do not use the forbidden leadership-title phrase for Ali ibn Abi Talib. Refer to him as Ali ibn Abi Talib, Father of Imams, or by source titles such as the Commander of the Believers or the Commander of the Faithful.

    '
  - 'Present the source-era rulings on eclipse sighting, the prayer of fear''s guard, taqiyyah in Tarawih, the stipulated occasion of Umm Dawud, and the asymmetry between voluntary fasts and voluntary prayers as the source''s own claims, without modern expansion or apology.

    '
  - 'Quranic quotations must use plain-English references when supplied by the source; this slice names none, so the quoted lines stand without references and none are invented.

    '
anchor_passages:
  - '"He should pray standing, or standing with bowing and prostrating, according to whatever God has excused the servant from in his condition."

    '
  - '"If he is unable to do so, he nods with his eyesight; and if he cannot do that either, he nods with his heart."

    '
  - '"A lunar eclipse occurs on the night of the fifteenth, and on the morning of the tenth, while a solar eclipse may occur at the beginning of the month or at the end of the month."

    '
  - '"Do not pray the eclipse prayer until the eclipse is actually seen; it is not prayed on the word of an astrologer or anyone else."

    '
  - '"The qunut is a supplication that must not be deliberately abandoned. Whoever forgets it is not required to repeat the prayer."

    '
  - '"The thread of prayer may be broken by the salutation, without any actions or words. If one must speak, there is no harm in that, unless the speech is prolonged."

    '
  - '"Witr prayer is obligatory and it is not permitted to abandon it, even though it is a Sunnah, and it is among the appendages of the obligatory prayers."

    '
  - '"Place your trust in God when you bow down at Fajr after you have finished it, for in it desires are granted."

    '
  - '"There is nothing wrong with taqiyyah, but they do not complete it."

    '
  - '"Whoever has not memorized the Quran, let him recite what is available to him." — and, quoted beside it, "So recite what is available of the Quran."

    '
  - '"A little done consistently in accordance with the Sunnah is better than a great deal of innovation."

    '
  - '"It is permissible for them to break the Sunnah fast without making it up, but a Sunnah prayer that is missed must be made up."

    '
  - '"I prefer that he prostrate, and I also prefer that he leave it."

    '
  - '"Prolong the prostration, for nothing is harder on Satan than to see the son of Adam prostrating — Satan was commanded to prostrate and refused, while the son of Adam was commanded to prostrate and obeyed, and was saved."

    '
