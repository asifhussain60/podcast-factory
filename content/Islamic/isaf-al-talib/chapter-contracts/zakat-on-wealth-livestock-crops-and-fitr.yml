title: Coin, Herd, Harvest, and Head
audience: 'Thoughtful adult listeners continuing a faithful translation-edition series on Is''af al-Talib, now inside the Book of Zakat and past its definition — where the obligation is finally priced, a dead man''s estate is opened and its claims ranked before his heirs may touch it, an animal that feeds itself is taxed and one that is fed is not, and the last payment of all is counted by head rather than by wealth.

  '
angle: faithful_exposition
angle_note: 'The episode renders the slice''s four headings, its many named books and its question-and-answer exchanges in coherent modern English while preserving the distinctions the arithmetic turns on: between liability that follows possession and liability that would follow activity, between capital already levied and profit still in hand, between an animal that grazes and one that is fed, between water that arrives on its own and water a man carries, between a harvest''s gross yield and its profit, between the status of ground and the faith of whoever owns it, and between a payment calculated from property and one counted by head. Passages the manuscript has damaged are rendered as they stand and named as damaged rather than repaired from other books.

  '
episode_format: deep_dive
format_rationale: 'One position unfolds layer by layer across all four headings — that zakat is charged against wealth capable of increase, at the moment and in the manner of its increase — and each heading supplies the next layer of it: possession across a full year for coin, free grazing for herds, rain or river rather than channel and bucket for fields, and finally the deliberate exception of zakat al-fitr, which is calculated from nothing anyone owns. No named party contests any proposition anywhere in the slice, so debate is wrong; no events are narrated, so narrative is wrong. Interview was considered seriously and rejected: question-and-answer material is substantial in the first, third and fourth headings but is wholly absent from the livestock heading and supplies neither the chapter''s spine nor its definitions, which come from cited books — Mukhtasar al-Musannaf, al-Akhbar, the landmarks of religion, the chosen view, the summary of effects, the hidden message, and the thirteenth council. That is the contrast with chapter 19, which is Q&A at all six of its headings and was contracted as interview.

  '
essential: core
essential_rationale: 'It carries the entire quantitative content of the Book of Zakat — the thresholds and their weights, the full-year rule, the order in which an estate''s claims are discharged, the khums on profit, the camel, cow and sheep scales, the tithe on crops and the halved rate for lifted water, the tithe and kharaj land distinction, and every rule of zakat al-fitr — none of which appears anywhere else in the series.

  '
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: 'The curious mind presses the questions the arithmetic raises and the source leaves standing — how three different figures can define one threshold, why a fed animal escapes a levy a grazing one attracts, why a debt cancels the duty on coin but not on grain, why a newborn owes a measure of food — while the scholar companion supplies the source''s own settlements in the voice of its named authorities: our master Idris, our master Sulayman ibn Hasan and our master Dawud ibn Ajab, our master Qadi al-Nu''man ibn Muhammad, Imam al-Mu''izz li-Din Allah, Ja''far ibn Mansur al-Yaman, Zayd ibn Muhammad, and the thirteenth council of the holder of the councils of al-Mustansiriyya.

  '
length_target: 5500-6000
key_tensions:
  - 'A dead man''s unpaid zakat is a live claim on property that has already changed hands, and the claims are discharged in a fixed order that can leave the heirs with nothing at all.

    '
  - 'Liability follows possession rather than activity, so money left idle at home and money working in the market are taxed identically, and a fall in a held commodity''s price releases nobody.

    '
  - 'Three different figures define the line between a man of means and everyone else — one hundred and nineteen dirhams, one hundred and ninety-five dirhams or twenty dinars, and one hundred and nineteen mithqals of gold — and the source records all three without reconciling them.

    '
  - 'The gold and silver thresholds are supposed to describe one condition, but their exchange rate keeps moving, so the assessment is taken against whichever currency is cheaper — resolving the drift toward more liability, not less.

    '
  - 'The same figure that obliges a man to pay also forbids him to receive, so the threshold is a single line with nobody standing on both sides of it.

    '
  - 'An animal that feeds itself is liable and an animal that is fed is not, and the same logic halves the rate on a field whose water a man lifted himself.

    '
  - 'A debt equal to a man''s holding cancels his liability on coin entirely, yet a debt does not excuse a harvest, because the grain came up out of the ground whatever its owner''s balance sheet said.

    '
  - 'Land carries its status as tithe or kharaj ground through every sale, in both directions, because what is owed is determined by what the earth yields rather than by who holds the deed.

    '
  - 'The tithe is named as the visible obligation on visible wealth, and the test is a bare fraction of what a man keeps: holding more than nine-tenths is not underpayment but a refusal to obey.

    '
  - 'Zakat al-fitr is calculated from nothing anyone owns — it is a measure of the food the payer himself ate, counted by head, owed for a child born that morning and on one reading for one not yet born.

    '
  - 'The household forbidden to receive charity is not excused from paying it, so the prohibition is confirmed as a rule about where a payment goes rather than about who is exempt from making one.

    '
  - 'The same food given to the same recipient changes category by the clock: paid before the line it discharges an obligation, paid after it is a voluntary gift and the obligation stands unperformed.

    '
tone_constraints:
  - 'Open with a curiosity hook on whether a dead man can still owe zakat when all he left was a house, its furniture and the people in it — not neutral stage-setting.

    '
  - 'Use only brief callbacks for doctrines already taught in earlier chapters: the levels of faith, guardianship and knowledge, peace and belonging, sacred ranks, disciplined loyalty, affection as law, bodily purity, purity under conditions, inner water, major washing, material purity, tayammum paths, food and contact, grooming boundaries, Ja''far''s admonition, hair, skin, and bone, menstruation and nifas, disavowal and waiting, attentive prayer, missed obligations, sacred times, the summons, the adhan''s witness, the discussion letter, the remaining proofs, unequal errors, the first testimony, public dedication, entering the mosque, guarded direction, standing behind, ranked leadership, following without fracture, shared boundaries, the admonition, prayer''s shape, the answerable plea, speech and motion, garment and ground, Friday''s gathered order, Eid''s revealed interior, certainty and omission, prayer that does not break, the latecomer''s entry, the forming of children, the journey and its licence, kinship that completes the prayer, intention, return, and dispensation, sickness, eclipse, fear, and drought, Witr, qunut, and the dawn, voluntary devotion and its limits, the visit and its restraint, the measure of a lifespan, remembering death, the wailing admonition, washing and shrouding the dead, procession, prayer, and grave, khums above tithe, the twelfth council''s reckoning, and concealment and misdirection.

    '
  - 'The previous chapter already taught that the khums encompasses the tithe, that zakat must be brought to the Imam, that a partial payment performs a concealment, and that the collector may not take the best animal or the stud. Call each back in a single clause where the arithmetic presupposes it; do not re-teach any of them.

    '
  - 'Preserve the Arabic and Islamic technical terms and titles supplied by the source, including zakat, khums, nisab as the source''s threshold, hawl as its year, awsaq, wasq, sa'', mithqal, dinar, dirham, carat, kharaj, dhimmi, Shari''ah, Ramadan, zakat al-fitr, The Pillars of Islam, Mukhtasar al-Musannaf, al-Masa''il al-Sharwa'', al-Akhbar, the Book of Himma, the Keys of Grace, the Book of Interpretation of Sharia, the hidden message, the councils of al-Mustansiriyya, and the names Idris, Sulayman ibn Hasan, Dawud ibn Ajab, Qadi al-Nu''man ibn Muhammad, al-Mu''izz li-Din Allah, Ja''far ibn Mansur al-Yaman, Zayd ibn Muhammad, and Ja''far ibn Muhammad al-Sadiq.

    '
  - 'Present the source-era rulings on estates and their ranked claims, on thresholds and weights, on the camel, cow and sheep scales, on tithe and kharaj land, on the dhimmi buyer and seller, and on zakat al-fitr as the source''s own claims, without modern economic, legal or apologetic expansion.

    '
  - 'This is the most damaged slice in the book. Render what is there and say so: the collector-and-fardah question whose arithmetic no longer connects; the ounce-figures that trail phrases with no nouns ("a quarter of a debt and a quarter", "sixteen portions of a religious debt and a half"); the currency unit that survives only as "tanks"; the camel vocabulary of the daughter of labour, the daughter of Labun, the right of the stallion and the trunk; the cow that "is sold" at thirty and the "three annals" at sixty; and the clause in al-Akhbar about a sow. Do not repair any of them from the standard scales in other books.

    '
  - 'Three figures for the threshold and three systems of weight for the sa'' are recorded side by side and reconciled nowhere; the thirteenth council promises twelve recommended elements and supplies a handful. Reproduce the discrepancies and the irregular count rather than smoothing them.

    '
  - 'The title of Ja''far ibn Mansur al-Yaman''s book arrives here in a third damaged form (Breastfeeding the Subconscious, the Book of Sub-Suckling, the book on breastfeeding, the book on supplementary nursing topics). Reproduce each form as the source gives it and note that it is the same work.

    '
  - 'The khums verse is quoted twice, in a short form and a long one, and is unique to its place in the Quran, so it carries the plain-English reference (chapter 8, verse 41). Assign no reference to anything the source does not make certain.

    '
anchor_passages:
  - 'Zakat is a debt that must be settled first, then Hajj — and if the saints are not settled, then nothing else clears his obligation, whether secretly or publicly.

    '
  - 'He begins with zakat, because that is a debt owed from his wealth; then Hajj, then khums, then expiation, then al-Sharwa.

    '
  - 'The Hajj obligation takes precedence over inheritance, because it is a debt, and debt comes before inheritance — and the other obligatory duties are likewise obligatory if something remains in the estate, even if nothing is left for the heirs.

    '
  - 'Zakat remains obligatory on what is liable as long as it remains in the owner''s possession — whether he trades with it or holds it — until what he owns falls below the threshold.

    '
  - 'The threshold for the people of means is either one hundred and ninety-five dirhams of silver or twenty gold dinars; and when the two prices diverge, the believer may be assessed against whichever of the two currencies is the less costly.

    '
  - 'If he has already paid the fifth on the capital, it is not due on the profit except on what remains in his hands; if he pays it on everything, that is a virtue and not an obligation.

    '
  - 'Zakat is obligatory when wealth reaches the threshold on which it is due, is free of encumbrances, and a full year has passed over it.

    '
  - '"Know that whatever you take as booty, a fifth of it belongs to Allah" (chapter 8, verse 41).

    '
  - 'Zakat consists of five dirhams, and the poor are of five types, each category receiving a dirham, for zakat is a consolation; all people and all creation are like one soul, and when one limb of the body suffers, all the other limbs attend to it in order to relieve its pain.

    '
  - 'The five prayers are known at five times, and zakat likewise has five forms.

    '
  - 'There is no zakat on livestock until they have grazed freely.

    '
  - 'Nothing is taken in charity that causes shame, and no male sheep is taken in charity unless the believer wishes it.

    '
  - 'What is obligatory is determined by what the earth yields, not by who owns it.

    '
  - 'The tenth is obligatory on that which the heavens water and the rivers water; as for what is irrigated by channels and buckets, half the tenth is due.

    '
  - 'Whoever exploits his gain and retains more than nine-tenths has not rightly fulfilled the tithe he was commanded and ordered to pay, and has not chosen to obey his authority in accordance with the truth.

    '
  - 'The guiding principle is that it should be from the best food one eats and the best food one stores.

    '
  - 'If it is given before the prayer it is zakat al-fitr; if it is given after the prayer it is merely voluntary charity.

    '
  - 'Sadaqat al-fitr is obligatory upon the Messenger of Allah, peace be upon him and his family, and upon all others.

    '
