  references:
    - The book of questions and answers arranged according to the order of the chapters of the book The Pillars of Islam — on the guardian who pays an estate's dues secretly, the order in which zakat, Hajj, khums, expiation and al-Sharwa are discharged, the khums taken from an entire estate, eating in a withholder's house, payment two years in advance, liability across a full year, the weights of the dinar and the dirham, the threshold for grains, the Indian practice of taking a monetary value for fitr, and early payment of zakat al-fitr.
    - 'Our master Idris — may God sanctify his soul — on the fifth owed on profit, and his summary of the classification: the three conditions, the altered deposit, the undivided estate, wealth a man is prevented from reaching, the year that carries over from one trade good to the next, the apostate, and the orphan.'
    - al-Masa'il al-Sharwa', and the report from some of the guardians of God — peace be upon them — on who counts as a person of means.
    - Our master Sulayman ibn Hasan and our master Dawud ibn Ajab — may God sanctify their souls — on the fifth owed upon sown seed, with the verse of the khums (chapter 8, verse 41) and the category of 'thing' as our master Qadi al-Nu'man ibn Muhammad explained it in the Book of Himma.
    - Imam al-Mu'izz li-Din Allah, peace be upon him, in the Book of Interpretation of Sharia — zakat as five dirhams among five kinds of poor, as a consolation, and creation as one body whose limbs attend to an injured limb.
    - Our master the late preacher Ja'far ibn our master Mansur al-Yaman — the five forms of zakat, and the livestock zakat of one head in forty.
    - Our master Zayd ibn Muhammad, in the hidden message — the rates on gold and silver, the bar on receiving above two hundred dirhams, the camel, cow and sheep scales with their restraints, the five crop categories, and the tenth halved for lifted water.
    - The book Mukhtasar al-Musannaf — free grazing as the condition of livestock zakat, and the dawn of the day of al-Fitr as the boundary for zakat al-fitr.
    - The Book of Akhbar, the landmarks of religion, the chosen view, and the summary of effects — tithe land and kharaj land, the five awsaq, irrigation by majority source, and the tithe owed from the forming of the kernel.
    - The thirteenth council of the holder of the councils of al-Mustansiriyya — may God's peace rest upon its author — on the seven obligatory elements of zakat al-fitr, its recommended measures, and its four provisions.
    - The book of the Keys of Grace, attributed to our master Judge al-Nu'man ibn Muhammad, may God sanctify him — sunrise as the line between zakat al-fitr and ordinary charity.
    - Ja'far ibn Muhammad al-Sadiq, may Allah's prayers be upon him — the Messenger of Allah taking his share of the spoils and dividing the remainder among the relatives, orphans, the poor and the wayfarer.
thesis_relevance: 'This chapter advances the book''s central claim that the pillars and rulings of Islam must be understood through faithful knowledge, action, and the authoritative guidance of the Ahl al-Bayt by supplying the measures the previous chapter deliberately withheld — showing that the obligation is charged against wealth capable of increase, at the moment and in the manner of its increase, so that a believer cannot discharge it by goodwill or estimate but only by knowing what the transmitted authorities actually fixed.

  '
