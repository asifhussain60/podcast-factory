show_notes:
  blurb: 'A man dies leaving a house, its furniture and the people who lived in it, and the first thing that happens is that his estate is opened and his unpaid zakat taken out of it — ahead of his heirs, in a fixed order of five claims that can leave them nothing. This chapter does the counting the last one refused to do. On money, liability follows possession rather than activity: a year must pass, and after that it makes no difference whether the coin worked or sat, while swapping one asset for another does not restart the clock. The threshold is set at one hundred and ninety-five dirhams or twenty dinars, assessed against whichever metal is cheaper when their prices diverge — and the book records two further figures for the same line without reconciling any of them. On herds and fields one principle governs both: the levy falls on increase that arrived on its own. An animal that grazes is taxed and an animal that is fed is not; a field watered by sky or river pays a tenth and a field watered by bucket pays half of that; grain becomes liable the moment it forms a kernel, and its owner may deduct nothing he spent. Land keeps its status through every sale, in both directions, because what is owed is decided by what the ground yields and not by who holds the deed. And then the last levy, which is calculated from nothing anybody owns: at the end of the fast every person owes a measure of the food he himself ate, counted by head — including a child born that morning, and on one reading one not yet born. The household forbidden to receive that charity is not excused from paying it. This is also the most damaged stretch of the manuscript in the series, and the chapter says so each time rather than quietly repairing the numbers.

    '
