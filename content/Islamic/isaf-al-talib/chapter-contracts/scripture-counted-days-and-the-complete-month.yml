show_notes:
  blurb: 'In the year four hundred, a whole community sat down to its first pre-dawn meal two days before anyone in the city had seen a moon — and the neighbours did not let it go. This chapter is the seam where one correspondence signs off and the letter written to answer that scandal begins. The old reply ends on mortality, on a line of poetry and a verse about the Day of Reckoning, and then on a single grammatical claim: that the Prophet and his family fasted at the sighting of the moon meaning at its emergence, and that the community is told to fast at the sighting of it meaning so that it may be seen — the moon''s coming out is the event, and seeing is only how the event is registered. The other side is left two questions: produce the varying month from the Book, and explain why the Messenger did not simply say "after seeing it," which was shorter and clearer and was not used. Attached to that closing is a message on the eclipse prayer''s hidden interpretation, and it is not a digression: the moon''s covering is decreed for the fourteenth night, occasionally the thirteenth, and the moon''s absence runs a fixed span — the sky''s most alarming event turns out to keep an appointment. Then the new epistle opens, addressed to the summoner of the age, and it opens with the embarrassment rather than with a principle. Before it argues anything it diagnoses: people disagree permanently unless mercy exempts them, the organ that goes blind is the heart and not the eye, and the failure at issue is a refusal to obey the one whom obedience is owed to — because a referred dispute is one the competent can resolve. Then the law: the fast is commanded in plain text, God specifies the measures of His obligations rather than leaving them to be guessed, and the sighting report is granted in the strongest terms available, accepted across the sects and named as the pillar of the opposing case. And the reply to it begins not with astronomy but with creation — everything made is made in pairs, because solitary oneness belongs to God alone, and the law reproduces that structure on purpose, from prayer with zakat down to the two testimonies inside one sentence of belief. The chapter stops one step short of its own conclusion, with the sighting report placed in a world where nothing stands alone and its counterpart still unnamed.

    '
