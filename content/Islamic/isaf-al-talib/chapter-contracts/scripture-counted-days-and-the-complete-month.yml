  references:
    - The close of the preceding reply — lines of poetry on the house built for death, the verse of the Day of Reckoning (chapter 38, verse 53), the emergence reading of the sighting report, the two questions put back to the opposing party, the request for a sound and healing answer, and the valedictory blessing on those who are clear vessels of the meanings of the Qur'an.
    - 'Our master Zayd ibn Muhammad, in his message attached to the hidden interpretation of the eclipse prayer: the first age as a proof for the people of the last age, the moon''s covering decreed for the fourteenth night, and the arithmetic of its absence and return, transmitted here in damaged form.'
    - 'The necessary message on fasting the month of Ramadan, addressed to our master and Mawlana, the summoner of the age, Ahmad Hamid al-Din ibn Abdallah al-Kirmani — may his intercession avail us — who is the proof of our master al-Hakim bi-Amr Allah, the Commander of the Believers: its opening praise, the occasion of the fast of the year four hundred, the letter''s self-naming, and its claim to argue on ground binding all Muslims.'
    - The admonition under the heading 'Chapter:' — the people of opposition diagnosed through the permanence of disagreement (chapter 11, verses 118 to 119), the blindness of hearts rather than eyes (chapter 22, verse 46), the dead who do not perceive (chapter 16, verse 21), the prohibition on dispersing and disagreeing (chapter 3, verse 105), and the referral to those in authority (chapter 4, verse 83).
    - 'The obligation texts: the prescription of fasting (chapter 2, verse 183); the saying of the Prophet — peace and blessings of Allah be upon him — and his family that Sha''ban is a month and Ramadan is the month of Allah; and the Imams'' ruling — peace be upon them — that fasting the month of Ramadan is obligatory upon every Muslim.'
    - 'The doctrine of pairs: ''Glory be to Him who created all the pairs'' (chapter 36, verse 36) and ''And of all things We have created pairs, that you may remember'' (chapter 51, verse 49), with the survey of created pairs and the seven paired institutions of the law.'
thesis_relevance: 'This chapter advances the book''s central claim that the pillars and rulings of Islam must be understood through faithful knowledge, action, and the authoritative guidance of the Ahl al-Bayt by showing what that claim costs and what it rests on: a community that begins the fast on commands received rather than on a horizon, a diagnosis that locates disagreement in hearts that will not refer their disputes, and the opening of a proof that the law itself is built in pairs so that nothing in it — including a report about sighting — may be taken as standing alone.

  '
