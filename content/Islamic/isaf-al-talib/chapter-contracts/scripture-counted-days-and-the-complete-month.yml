title: A Fast Begun Two Days Early
audience: 'Thoughtful adult listeners continuing a faithful translation-edition series on Is''af al-Talib, arriving at the seam where one correspondence signs off and a new epistle opens — an epistle written because a whole community began the fast of the year four hundred two days before anyone saw the crescent, and was ridiculed for it in public.

  '
angle: faithful_exposition
angle_note: 'The slice is expounded as it stands, in its own order: the last page of the preceding reply, a short attached message on the eclipse prayer''s hidden interpretation, and the opening of a new letter addressed to the summoner of the age. The episode keeps the distinctions the material turns on: between the moon''s emergence and a person''s sight of it, between evidence and the fact it is evidence of, between a decreed periodicity and an accident, between a disagreement diagnosed as a failure of the heart and one diagnosed as a failure of the eye, and between a dispute with nowhere to go and a dispute with a known address. Passages the manuscript has damaged — the clause about the reckoning bearing the blame, the reference to the Book of the House, the attribution fragment introducing Zayd ibn Muhammad, the broken clause about the first to believe, the twenty-eight-night figure that contradicts its own sentence, the phrase "or been divided from it", the compressed sentence about what the healing answer does, and the muddled antecedent in the sentence about who was not left blind to the fast''s time — are rendered as they stand and named as damaged rather than repaired.

  '
episode_format: deep_dive
format_rationale: 'The one unfolding doctrine is that the fast''s timing was never handed to eyesight — developed first through a reading of the sighting report''s preposition, then through the moon''s decreed periodicity, then through the claim that God specifies the measures of His obligations, and finally through the doctrine that creation and the law alike are built in pairs. No sustained named opposition runs through the slice: the opposing party is an unnamed collective ("the people of division and disagreement", "the people of opposition", "the people of the outward") whose only voiced content is the one-line charge that this community began fasting before the general public; they are diagnosed and answered, never quoted at length or given a turn. Debate was rejected for exactly that reason — there is no named party in extended back-and-forth and no proposition contested in dialogue; narrative was rejected because nothing here is narrated as events.

  '
essential: core
essential_rationale: 'It carries the dated occasion the whole remaining epistle exists to justify — the fast of the year four hundred entered two days before the crescent was sighted — together with the emergence reading of the sighting report, the eclipse message''s decreed timetable, and the pairs doctrine on which the letter''s entire reply is about to be built; none of it appears anywhere else in the series.

  '
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: 'The curious_mind presses the questions a first-time listener would ask — why a preposition should decide a month, how an eclipse can have a date, what possessed a community to fast two days early in front of its neighbours, and what pairs have to do with any of it — while the scholar_companion carries the three documents in order, states each claim in the source''s own terms, names the damaged passages rather than repairing them, and stops where the slice stops, with the pairs premise built and its conclusion still unwritten.

  '
length_target: 5500-6000
key_tensions:
  - 'The disputed report''s wording is not contested by anyone; what is contested is what its phrase attaches to — the moon''s emergence, or a person''s eye.

    '
  - 'If the instruction had really meant "wait until you have caught sight of it", there was a shorter and clearer way to say so, and the Prophet did not use it.

    '
  - 'A party that holds the month sometimes complete and sometimes short is asked to produce the varying month from the Book, and this slice carries no answer.

    '
  - 'An eclipse is the sky''s most alarming irregularity and is said here to keep a decreed appointment on the fourteenth night, which makes it evidence rather than a portent.

    '
  - 'The eclipse message''s own arithmetic contradicts itself — twenty-eight nights of absence in a sentence that then gives the absence as forty-eight hours — and the figure is left standing.

    '
  - 'A community began the fast two days before the crescent was seen with their own eyes, in a year that can be named, and their neighbours did not let it go.

    '
  - 'The letter claims to argue on ground binding all Muslims rather than claiming an exemption for its own community.

    '
  - 'Disagreement is presented as the permanent condition of people, with agreement an exemption granted by mercy rather than achieved by argument.

    '
  - 'In a dispute conducted entirely about eyes, the verse chosen says that the organ which goes blind is the heart.

    '
  - 'The opposition is described as past the reach of evidence, in a letter written to convince them.

    '
  - 'The named failure is not a miscalculation but a refusal to obey the one whom obedience has been made obligatory to.

    '
  - 'Referral is presented not as deference but as the procedure by which an answer becomes available at all.

    '
  - 'God specifies the number and times of prayers and the amounts of zakat, so an obligation whose time was left to be guessed at would be unlike every other.

    '
  - 'The sighting report is conceded in the strongest terms available — accepted across the sects, named as the pillar of the opposing case — before any reply to it begins.

    '
  - 'Solitary oneness is said to belong to God alone, so nothing created is permitted to stand without a counterpart.

    '
  - 'The revealed law is said to reproduce that structure deliberately, which turns a cosmological claim into a legal premise.

    '
  - 'The slice stops one step short of its own conclusion: the sighting report has been placed in a world of pairs and its counterpart is never named.

    '
tone_constraints:
  - 'Open with a curiosity hook on a community sitting down to its first pre-dawn meal two days before anyone in the city had seen a moon — not neutral stage-setting.

    '
  - 'Use only brief callbacks for doctrines already taught in earlier chapters: the levels of faith, guardianship and knowledge, peace and belonging, sacred ranks, disciplined loyalty, affection as law, bodily purity, purity under conditions, inner water, major washing, material purity, tayammum paths, food and contact, grooming boundaries, Ja''far''s admonition, hair, skin, and bone, menstruation and nifas, disavowal and waiting, attentive prayer, missed obligations, sacred times, the summons, the adhan''s witness, the discussion letter, the remaining proofs, unequal errors, the first testimony, public dedication, entering the mosque, guarded direction, standing behind, ranked leadership, following without fracture, shared boundaries, the admonition, prayer''s shape, the answerable plea, speech and motion, garment and ground, Friday''s gathered order, Eid''s revealed interior, certainty and omission, prayer that does not break, the latecomer''s entry, the forming of children, the journey and its licence, kinship that completes the prayer, intention, return, and dispensation, sickness, eclipse, fear, and drought, Witr, qunut, and the dawn, voluntary devotion and its limits, the visit and its restraint, the measure of a lifespan, remembering death, the wailing admonition, washing and shrouding the dead, procession, prayer, and grave, khums above tithe, the twelfth council''s reckoning, concealment and misdirection, coin, debt, and the threshold, grazing herds and watered ground, the charity of the head, the shield of every sense, the crescent and the name, seven obligations, twelve devotions, absence and the moon''s arithmetic, a prophet who need not look, and a number of days.

    '
  - 'Five callbacks in particular are spent in a clause each and never re-argued: the previous chapter''s astronomy of the month and its occasion-of-utterance reading of the sighting report, which are assumed rather than repeated; the prescription of fasting, already taught, which returns here only as this letter''s opening proof; the eclipse prayer, taught earlier among the prayers of dread, which returns only as the subject of an attached message; the catalogues of what zakat is owed on, reused as evidence that the religion specifies its measures; and the call to prayer with its iqama, which appears only as one item in the list of paired institutions.

    '
  - 'Preserve the Arabic and Islamic technical terms, titles and names supplied by the source, including Ramadan, Sha''ban, zakat, iqama, Hajj, Umrah, al-Safa, al-Marwa, the Sunnah prayer, Mawlana, the summoner of the age, and the names Zayd ibn Muhammad, Ahmad Hamid al-Din ibn Abdallah al-Kirmani, and al-Hakim bi-Amr Allah, the Commander of the Believers.

    '
  - 'Render the letter openings and the valedictory whole in refined English — the bismillah, the praise, the blessing on the Messenger, the "and thereafter", the letter''s self-naming, and the closing blessing on those who carry the meanings of the Qur''an unchanged — rather than compressing them to a note that a letter began.

    '
  - 'Render the admonition under the heading "Chapter:" in full and in order, from "Know — may Allah protect you from ignorance" through the closing petition, without condensing its verses or its images; it is an exhortation embedded in a running epistle rather than a delivered address, so it is carried whole inside its concept section rather than flagged as a sermon.

    '
  - 'Present the reading of the sighting report, the eclipse periodicity, and the pairs doctrine as the source''s own claims, without modern astronomical, legal, or apologetic expansion, and without importing the conclusion the pairs argument is heading toward, which this slice does not contain.

    '
  - 'Name the damaged passages rather than repairing them: the clause about the reckoning making the consequence bear the blame; the Book of the House, which cannot be securely identified; the attribution fragment reading "His soul" before Zayd ibn Muhammad''s message; the broken clause about the first to believe; the twenty-eight-night figure that contradicts the forty-eight hours in its own sentence; the phrase "or been divided from it"; the compressed sentence on what the healing answer does; and the shifting antecedent in the sentence about who was not left blind to the fast''s time.

    '
  - 'Close on the unfinished state of the slice: the premise of pairs fully built, the sighting report placed inside it, and the conclusion still on the following page.

    '
  - 'Quranic quotations carry plain-English references only where the verse is unambiguous: the promise for the Day of Reckoning (chapter 38, verse 53), the permanence of disagreement (chapter 11, verses 118 to 119), the blindness of hearts rather than eyes (chapter 22, verse 46), the dead who do not perceive (chapter 16, verse 21), the prohibition on dispersing and disagreeing (chapter 3, verse 105), the referral to those in authority (chapter 4, verse 83), the prescription of fasting (chapter 2, verse 183), the glory of Him who created all the pairs (chapter 36, verse 36), and the pairs created of all things (chapter 51, verse 49). The quotation "Whatever you dispute about, refer it to Allah and the Messenger" is left without a reference, because the wording as the source transmits it cannot be securely assigned to one verse.

    '
anchor_passages:
  - 'The correct view is that the Prophet (peace and blessings of Allah be upon him) and his family fasted at the sighting of it — meaning at its emergence — and that you fast and break your fast at the sighting of it, meaning so that it may be seen.

    '
  - 'If you hold otherwise, then bring proof from the Qur''an for the completion of the month as mentioned therein, and explain why the Messenger of Allah did not say: "Fast after seeing it and break the fast after seeing it," so that the matter would be clearer to his community.

    '
  - 'So grant us a sound and healing answer, for we do not travel the road of arrogance and dismissiveness.

    '
  - 'Praise be to Allah, Most High, Almighty, Most Exalted, and may the blessings of Allah be upon His Messenger to all humankind and jinn, and upon his family and companions, who are clear vessels of the meanings of the Qur''an, unchanged through the passage of ages — peace, mercy, and generosity be upon them. Allah is our Protector.

    '
  - 'He made the eclipse of the moon a covering for it and decreed that its covering falls on the fourteenth night of the month, though it may sometimes fall on the thirteenth night.

    '
  - 'Evidence lies in the fact that the moon is absent and hidden from the world for twenty-eight nights of every month, and it is absent and concealed for two days and two nights, which is forty-eight hours, and then it reappears after those forty-eight hours.

    '
  - 'This blessed message on the matter of the month of Ramadan is attached to the obligation of fasting the month of Ramadan, and it is addressed to our master and Mawlana, the summoner of the age, Ahmad Hamid al-Din ibn Abdallah al-Kirmani — may his intercession avail us — who is the proof of our master al-Hakim bi-Amr Allah, the Commander of the Believers.

    '
  - 'Praise be to Allah, by whose grace good deeds are accomplished, and through obedience to His guardians, blessings prevail.

    '
  - 'Brother, you wrote to recall that the people of division and disagreement — in the habits they have adopted — have driven a wedge against the people of truth and the coalition, and have said much in challenging them regarding the community, opposing them in that they began fasting before the general public.

    '
  - 'The fast of the year four hundred, which was obligated by commands received from the Immaculate Prophet — entering it two days before the crescent moon was sighted with our own eyes.

    '
  - 'I label it: the necessary message on fasting the month of Ramadan. For it contains arguments that bind all Muslims, and no one loyal to the principle of reason and sense can turn away from them.

    '
  - 'Know — may Allah protect you from ignorance and guard you from the way of misguidance — that the people of opposition, had they possessed discernment and insight, the devil''s machinations against them would have been repelled.

    '
  - '"Have they not traveled through the earth so that they may have hearts with which to reason, or ears with which to hear? For it is not the eyes that go blind, but it is the hearts within the breasts that go blind." (chapter 22, verse 46)

    '
  - '"And if they had referred it to the Messenger and to those in authority among them, those who can draw conclusions from it would have known it." (chapter 4, verse 83)

    '
  - 'We seek refuge in Allah from division after unity, from tyranny after faith, and from disobedience to His guardians after submission and belief.

    '
  - '"Sha''ban is a month and Ramadan is the month of Allah, and fasting is obligatory."

    '
  - 'When Allah Almighty imposed the fast of the month of Ramadan upon His servants, He did not leave them blind to the knowledge of its time, just as He did not leave them in ignorance of how to fulfill other obligatory duties, such as the number and times of prayers.

    '
  - 'On this narration there is scarcely any disagreement among the sects of Muslims, and it is the pillar upon which the people of the outward rely in their argument.

    '
  - 'Allah Almighty created all things in pairs, so that nothing in creation is left in solitary oneness. Nothing shares with Him in His oneness.

    '
  - 'The Prophet established the foundation of his law and its governing principle by pairing commands and obligatory duties with their counterparts — as with prayer, which he paired with zakat; the call to prayer, which he paired with the iqama; Hajj, which he paired with Umrah; al-Safa, which he paired with al-Marwa; the obligatory prayer, which he paired with the Sunnah prayer; bowing, which he paired with prostration; and the testimony that there is no god but Allah, which he paired with the testimony that Muhammad is the Prophet of Allah.

    '
