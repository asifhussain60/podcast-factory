  references:
    - The first question-and-answer book arranged according to The Pillars of Islam on supplication after 'Asr, wiping after Fajr and 'Asr, gestures, infant carrying, hair, objects, images, clothing, covering, adornment, and impurity.
    - The interpretation of the Sharīʿa on silent and audible recitation, recitation before bowing, not raising the voice over the imam, speaking only after salutation, valid prostration surfaces, and the Fatiha.
    - The Mustanṣiriyya Councils on supplication as the culmination of prayer and the twelve foundations of answered du'a'.
    - The Four Hundred Etiquettes of Amīr al-Mu'minīn Ali ibn Abi Talib on supplication before calamity, the opened gates of heaven, distress in prayer, images, adornment, and prostration on food.
    - Ja'far ibn Manṣūr al-Yaman on the fourteen doors of prayer and on garments or objects that do not prevent prayer's required motions.
    - Mukhtasar al-Musannaf on eating and drinking in prayer, images on rugs, exposed covering, impure garments, repeated prayer under uncertainty, and plaster purified by fire.
    - The answers of Idris ibn al-Hasan and the Yemeni-Indian correspondence on stone and plaster, thick covering, net garments, and small amounts of milk, fat, and eggs.
thesis_relevance: 'This chapter advances the book''s central claim that the pillars and rulings of Islam must be understood through faithful knowledge, action, and the authoritative guidance of the Ahl al-Bayt by showing how prayer''s completion, conduct, dress, and prostration surfaces are governed by transmitted discipline rather than private improvisation.

  '
