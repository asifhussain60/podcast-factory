show_notes:
  blurb: 'This chapter follows prayer to its living edges: the disciplined du''a'' after prayer, the speech and motion that may preserve or break the act, and the garments, images, impurities, ornaments, and prostration surfaces that surround the worshipper. It asks how a prayer remains dignified when the body carries discomfort, objects, clothing, travel burdens, images, and material uncertainty into the space of worship.

    '
