show_notes:
  blurb: 'This chapter asks what it actually takes to destroy a prayer already under way, and answers with a surprisingly short list. Soiled garments, nosebleeds, vomiting, passing animals, and passing strangers are absorbed; lost direction and an unmarked change of act are not. It then admits the latecomer who caught only the final sitting, and the child of eight who cannot yet understand what he is doing, on the same principle that governs the rest: the entrance is guarded so that the interior does not have to be.

    '
