  references:
    - The first book of questions and answers arranged according to the chapters of the Pillars of Islam, on impurity reaching the garment and on the latecomer joining at the final tashahhud.
    - The book of purity on nosebleed and vomiting during prayer and the retention of the qibla.
    - The book on the interpretation of prayer, carrying the report of the dog, the donkey, and the woman passing before the Prophet.
    - The four hundred manners attributed to Amir al-Mu'minin on smiling and laughter, and on teaching and accompanying children in prayer.
    - The book of questions of Sheikh Shimun ibn Muhammad Ghuri al-Hindi with the answer of Badr al-Din Hasan ibn Idris on the man who bows with the imam without a new opening takbir.
    - The summary of the classification on joining the imam during bowing and the takbir that serves for both.
    - 'The honorable epistle of Muhammad ibn Fahd, From Him: With Love for the Path of Guidance for the Converted, on the latecomer who cannot utter the intention.'
    - Ibrahim ibn Husayn al-Hamidi, The Phrase of Good News, on the seven-year stages of a boy's formation.
thesis_relevance: 'This chapter advances the book''s central claim that the pillars and rulings of Islam must be understood through faithful knowledge, action, and the authoritative guidance of the Ahl al-Bayt by showing that the validity of an act of worship is settled by transmitted rule rather than by the worshipper''s own sense of failure — so a disturbed prayer, a late arrival, and an unfinished child are each admitted or corrected on authority, not on feeling.

  '
