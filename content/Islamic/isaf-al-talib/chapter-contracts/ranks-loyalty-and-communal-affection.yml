show_notes:
  blurb: 'This chapter turns the opening foundation of faith into communal practice. It begins with the ranked houses of the Imams, their proofs, preachers, hudud, and emissaries, then warns love away from exaggeration by insisting that the Ahl al-Bayt be praised as elevated servants. It teaches loyalty as work, restraint, remembrance, patience, and measured speech; brotherhood as care for the weak, gentle correction, protected honor, and ordinary sharing; and affection as law toward parents, children, kin, neighbors, books, teachers, and seekers. The chapter closes by making knowledge both obligatory and guarded: da''wa books belong to the call, religion is not measured by private analogy, difficult sayings are returned to their people, and secrets are concealed.

    '
