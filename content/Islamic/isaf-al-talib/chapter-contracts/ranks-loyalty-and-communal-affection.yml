host_dynamic_rationale: 'The curious_mind voices the listener''s questions about why love needs rank, secrecy, permissions, and social etiquette, while the scholar_companion explains how the source''s supplications, maxims, and rulings form one ordered ethic.

  '
length_target: 5500-6000
key_tensions:
  - 'Reverence for the Imams and their hudud must be intense, but the chapter forbids exaggeration by insisting that the Ahl al-Bayt be praised as elevated servants rather than exaggerated beyond servanthood.

    '
  - 'Loyalty requires visible work and inward truth, yet hostile conditions require concealment, humility before worldly authority, and restraint from public display before enemies.

    '
  - 'Affection is not merely emotional warmth; it becomes concrete rights toward weak believers, parents, children, kin, neighbors, books, and companions in gatherings of wisdom.

    '
  - 'Knowledge is obligatory, but it is not ownerless: books of the da''wa, hidden sayings, difficult teachings, and religious interpretation must be handled through permission, return, and secrecy.

    '
tone_constraints:
  - 'Open with a curiosity hook around the central tension between intense love for sacred rank and disciplined refusal of exaggeration.

    '
  - 'Use only brief callbacks for doctrines already taught in chapter 1: levels of faith, guardianship and knowledge, and peace and belonging.

    '
  - 'Do not use the forbidden leadership-title phrase for Ali ibn Abi Talib. Refer to him as Ali ibn Abi Talib, Father of Imams, or by source titles such as Amir al-Mu''minin.

    '
  - 'Preserve Arabic or Islamic technical terms that the source supplies by transliteration, including hudud, da''wa, Shi''a, salām, Qur''an, ''awrah, mahrams, dhimmi, and Sunnah.

    '
  - 'Quranic quotations whose chapter-and-verse numbers are not supplied by the source should be quoted without invented references. Never use shorthand citation forms or bare numeric citations.

    '
  - 'Present source-era legal formulations on gendered recitation, dhimmi neighbor-rights, da''wa books, and guarded knowledge as the source''s own rulings without modern expansion or apology.

    '
anchor_passages:
  - '"I beseech You, O God, by their doors, their proofs, their preachers, their authorized ones, the respondents of their roles, those who incline toward them, those who take refuge in their refuge, those who come to them, and all their followers."

    '
  - '"Whoever wishes to know what his standing is with God Almighty, let him see how God stands in his own sight."

    '
  - '"The believer wearies himself while the people find rest through him."

    '
  - '"Say that we are elevated servants, and say of our bounty what you wish."

    '
  - '"Whoever loves us, let him do our work and seek the help of the pious, for that is the best provision in this world and the next."

    '
  - '"Beware of disputation, for it breeds doubt."

    '
  - '"A Muslim is the mirror of his Muslim brother. If you see a fault in your brother, do not treat him as a fool — guide him, advise him, be gentle with him, make the guidance pleasant, and show him favor, kindness, and mercy."

    '
  - '"This is fine, for the sake of affection and brotherhood."

    '
  - '"And you, O Ali, are the father of this community."

    '
  - '"Do not swear an oath in the severance of the womb."

    '
  - '"If the books are among the books of the da''wa, he has no right to use them for that purpose, because they belong to the call and are not inherited."

    '
  - '"Do not measure the religion by analogy, for it cannot be measured."

    '
  - '"If you hear from our discourse something you do not recognize, return it to us, stand by it, and receive it with trust."

    '
  - '"Whoever broadcasts our secret — Allah will give him a taste of the iron."

    '
