format_rationale: 'The chapter unfolds one expository position through ranked supplications, counsels, and legal responses: love for the Imams and their community must be ordered by rank, restraint, rights, learning, and secrecy. There is no sustained named opposition running through the chapter; questioners from India appear as occasions for rulings rather than as opposing voices in an extended debate.

  '
