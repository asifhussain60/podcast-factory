    - Qadi al-Nu'man, Keys of Grace, on returning the sciences to their authorized people.
thesis_relevance: 'This chapter advances the book''s central claim that the pillars and rulings of Islam must be understood through faithful knowledge, action, and the authoritative guidance of the Ahl al-Bayt by showing how that guidance forms a disciplined community: ranked without exaggeration, loving without recklessness, socially obligated, and careful with guarded knowledge.

  '
