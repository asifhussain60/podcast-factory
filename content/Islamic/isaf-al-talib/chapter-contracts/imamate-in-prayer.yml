  references:
    - The question-and-answer book arranged according to The Pillars of Islam on imamate in prayer, travel, taqiyya, ships, pronunciation, replacement, and impurity.
    - Mukhtasar al-Muṣannaf on beginning alone, joining an imam, standing in front of the imam, rows around the Kaaba, non-adults, distorted recitation, and late joiners.
    - The interpretation of the Shari'ah by al-Mu'izz on the Prophet leading while seated and the principle that the imam is followed.
    - The footnotes, national collection, and Qāḍī al-Nu'mān ibn Muhammad's epistle on the imamate of a blind person and salary.
    - Mukhtasar al-Athar on categories disapproved for imamate and the permissibility of each leading those in a similar situation.
    - The Essential Councils on preceding the imam in movement.
    - The Book of Councils al-Mustansiriyya on ranked priority for leadership in prayer.
    - Questions from Sheikh Shimon ibn Muhammad Ghori al-Hindi and answers from Badr al-Din Hassan ibn Idris ibn al-Hasan on mosque priority and ship prayer.
    - Questions from learned figures of India and loyal preachers of Yemen on mahram placement, faulty recitation, and uncertainty in prayer.
thesis_relevance: 'This chapter advances the book''s central claim that the pillars and rulings of Islam must be understood through faithful knowledge, action, and the authoritative guidance of the Ahl al-Bayt by showing how congregational prayer depends on rightly ordered leadership, disciplined following, and transmitted criteria for who may stand at the front.

  '
