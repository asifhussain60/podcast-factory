show_notes:
  blurb: 'This chapter turns from sacred space to the person who leads prayer inside it. It asks how an imam''s placement, travel status, rank, recitation, bodily condition, salary, purity, and emergency departure affect those behind him, and how followers preserve the unity of congregational prayer through ordered position, listening, timing, and repair.

    '
