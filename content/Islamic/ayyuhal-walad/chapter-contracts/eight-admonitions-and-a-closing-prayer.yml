  references:
    - >
      "Imam al-Ghazali, *Ayyuha al-Walad* — the closing chapter of
      the letter: the eight admonitions (four refrainings + four
      takings-up), the long aside on the four categories of
      patients, the *Ya Ibna Maryama* address on self-admonition,
      the *Al-Hazr! Al-Hazr!* flood image, the *Fa InnAllaha
      Yaghdib* hadith on praising the unjust, the household-servant
      analogy, the *Fala Yakmalu Eemanu 'Abdi* sacred hadith on
      loving for others what one loves for oneself, the one-week-
      to-live and king-is-visiting images on the focused study of
      what saves, the *Allahumma Aj'al Quta Aale Muhammadin
      Kafafun* household-provision prayer, and the long closing
      supplication"
    - >
      "*Ihya' 'Ulum ad-Din* — *Revival of the Knowledge of the
      Path to God* — Ghazali's magnum opus, referred to twice in
      this chapter (once for the fuller treatment of the
      calamities of accepting rulers' gifts; once as the
      recommended companion-work for acquiring the knowledge of
      the matters of the heart, which Ghazali classifies as
      *Fard al-'ayn* upon every Muslim)"
    - >
      "The Prophetic frame on the inner life: *InnAllaha La
      Yunzuru Ila Suwarikum Wa La Ila 'Aamalikum Wa Lakin
      Yunzuru Ila Qulubikum Wa Niyyatikum* — 'Allah does not look
      at your faces or your outward actions, but at your hearts
      and your intentions' — the saying that grounds the third
      *do* and converts the king-is-visiting image into the
      audit of the heart"
    - >
      "The *Sahah Sitta* — the six most authenticated collections
      of Prophetic *Ahadith* (al-Bukhari, Muslim, Abu Dawud,
      al-Tirmidhi, al-Nasa'i, Ibn Majah) — to which Ghazali
      points the disciple for the supplications he should
      memorize, along with those transmitted through the *Ahl
      al-Bayt* (the family of the Prophet ﷺ)"
    - >
      "The Prophet ﷺ's calibrated practice on household
      provisions: one year's supply for those among the Azwaj
      al-Mutahharat whose Tawakkul was weaker; no provision
      whatsoever set aside for those whose Tawakkul was perfect,
      including 'Aisha Siddiqa, may Allah be pleased with her —
      the calibration that prevents the *do not stockpile* rule
      from flattening into a uniform"
