  references:
    - >
      "Imam al-Ghazali, *Ayyuha al-Walad* — the disciple's letter
      and Ghazali's reply, opening movement: framing of the
      question, three Prophetic warnings, Junaid's dream, the two
      parables, the Quranic verses on the atom's weight, the
      definition of faith, the careful clarification on Mercy, the
      worshipper-and-the-angel story, and the Prophetic hinge of
      self-accounting"
    - >
      "Ghazali's larger works the disciple has already read —
      *Ihya al-Ulum ad-Din* (Revival of the Knowledge of the Path
      to God), *Kimiya as-Sa'ada* (Alchemy of Ultimate Success and
      Happiness), *Jawahir ul-Quran* (Priceless Gems of the Holy
      Quran), *Arba'een* (Forty Steps), *Minhaj ul-'Abideen*
      (The Best Way for the Worshippers) — named in the opening
      framing to mark that the disciple does NOT need another book"
    - >
      "The dream-genre of saintly biography (*manaqib*) — the
      anecdote of Shaykh Junaid Baghdadi is presented in the
      standard form of a post-mortem dream-encounter in which the
      saint is asked of his state and reports what counted; the
      genre is widely attested in Sufi hagiography and Ghazali
      uses it here to deliver a doctrinal verdict in a single line"
    - >
      "The verses of the atom's weight (Quran 99:7–8), the verse
      of hoping to meet one's Lord (Quran 18:110), the verse of
      Firdaws (Quran 18:107–108), and the verse of the threefold
      condition (Quran 25:70) — Ghazali stacks four Quranic
      verses to seal the parables' work and to neutralize the
      scholarly objection that the verse of striving (Quran 53:39)
      has been abrogated"
