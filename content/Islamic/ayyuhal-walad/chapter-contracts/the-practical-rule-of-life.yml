title: "The Practical Rule of Life"
audience: >
  Thoughtful adult readers who have heard the opening chapter of Imam
  al-Ghazali's (Rahmatullahi Alayhe — rah-ma-tul-LAH-hi a-LAY-hi — may
  Allah shower His mercy upon him) letter *Ayyuhal Walad* (AY-yu-hal
  WA-lad — "O Beloved Son") and are ready to receive the regimen the
  opening chapter held in reserve. The first chapter named the disease
  — *knowledge without action is madness, and action without knowledge
  is worthless* — and closed at the threshold of Shaykh Shafeeq
  al-Balkhi (sha-FEEQ al-BAL-khee) putting his question to his disciple
  Hatim Ism (HAA-tim ISM): *what eight benefits did you distil from
  thirty-three years of my company?* This chapter receives the answer.
  Listeners walk Hatim's eight benefits one by one — each a precise
  observation of how the people of the world live, a Quranic verdict
  that overturns the observation, and a decision of the will that
  follows from the verdict. The first benefit takes the deeds as the
  only beloved that descends into the grave; the second wars against
  the *Nafs* (NAFS — the lower self that incites to evil) until the
  *Nafs* itself finds peace in the worship of Allah; the third spends
  wealth into the next world as a deposit with Allah; the fourth
  replaces tribe, wealth, violence, and waste with *Taqwa* (TAQ-wa —
  pious reverence) as the sole coordinate of honor; the fifth recognizes
  that Allah has already made the distribution of livelihoods and rests
  in contentment; the sixth withdraws enmity from human beings and
  attaches it to *Shaytan* alone; the seventh recognizes that
  sustenance is the responsibility of Allah; the eighth places complete
  *Tawakkul* (ta-WAK-kul — reliance) upon Allah in every matter.
  Shaykh Shafeeq al-Balkhi (RA) closes the dialogue with the verdict
  that the four heavenly Books — the *Tawrat* (taw-RAAT — Torah), the
  *Injil* (in-JEEL — Gospel of Prophet Isa, peace of Allah be upon
  him), the *Zabur* (za-BOOR — Psalms of Prophet Dawud, peace of Allah
  be upon him), and the Holy Quran — all teach these eight; whoever
  acts on these eight has, in effect, acted on every Book. The Imam
  then resumes the seven conditions of the seeker — the fifth (a
  perfected spiritual guide, a *Shaykh al-Kamil* — SHAYKH al-KAA-mil),
  the sixth (guarding the *Nafs* and abandoning the company of the
  ill-charactered), the seventh (humility and contentment) — walks the
  qualities of the true guide and the outward and inward etiquettes of
  the disciple toward him, and delivers the doctrinal definitions the
  disciple had asked for: *Tasawwuf* (ta-SAW-wuf — the inner science of
  purification, joining obedience to the *Shari'ah* with selfless
  service to creation); servitude in its three parts (obedience to the
  *Shari'ah*, contentment with the decree, abandonment of one's own
  claims); *Tawakkul* (firm certitude in Allah's promise); and *Ikhlas*
  (ikh-LAAS — sincerity, the dissolution of *Riya* — ri-YAA — by
  regarding all creation as powerless pebbles and stones). The Imam
  closes the letter with eight admonitions in two registers — four
  restraints (do not engage in religious debate except with the patient
  who can be healed; do not preach for performance or applause; do not
  greet, look at, or keep the company of the affluent and rulers; do
  not accept gifts from rulers even if from lawful sources) and four
  actions (conduct every matter with Allah by the inverted-servant test;
  conduct every matter with the slaves of Allah by the loved-for-self
  test; study only what you would study if you had a week to live; do
  not stockpile more than one year's provision). The chapter closes
  with the long supplication the Imam writes for the disciple to
  recite after every *Salat* (sa-LAAT — obligatory prayer), which
  closes the letter and the book.
