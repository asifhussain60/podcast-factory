  thesis_relevance: >
    This chapter advances the book's central claim that *knowledge
    without action is madness, and action without knowledge is
    worthless* — and that the disciple needs not a list of sciences but
    a *practical rule of life* — by delivering that rule in eight
    benefits, seven conditions, four doctrinal definitions, eight
    admonitions, and one daily supplication. Where the opening chapter
    diagnosed the disease, this chapter administers the cure. Without
    this chapter, the book has stated the problem but withheld the
    solution; with it, the disciple leaves the letter with the complete
    architecture of a life.
