key_tensions:
  - >
    The eight benefits of Hatim Ism (RA) are a single literary form
    repeated eight times — observation of the world, Quranic anchor (or
    its functional equivalent), decision of the will, ratification by
    the master. The hosts must let the *form repeat* so that the
    accumulation becomes the argument. Resist the temptation to
    paraphrase the form on the later benefits or to compress them by
    summary. The fifth, sixth, seventh, and eighth land their force
    precisely because they arrive in the same shape as the first.
  - >
    The second benefit's last clause — *the Nafs began to find peace
    and satisfaction in the worship of Allah* — is doctrinally pivotal.
    The discipline of the *Nafs* does not end in permanent conflict; it
    ends in the *Nafs* itself becoming pleased with the worship of
    Allah. The hosts must hold the *terminus* of the discipline and not
    collapse the second benefit into a generic call to mortification.
    The end-state is *peace*, not *war*. The war is the means.
  - >
    The doctrinal definition of *Tasawwuf* — *obedience to the Shari'ah
    plus compassion toward all creation, which is impossible without
    first purifying the soul* — is the chapter's most architecturally
    important line on the inner sciences. The hosts must hold both
    halves equally. Half-Tasawwuf — *Shari'ah without compassion*, or
    *compassion without Shari'ah* — is not Tasawwuf at all. The Imam's
    clause *this is the correct application of the term, as opposed to
    the distorted usages so widespread today* must be allowed to do its
    work as a *correction*, not as a polemic.
  - >
    The four categories of patient in the first admonition (jealousy,
    foolishness, impatience-with-self-interpretation, sincere
    seeker-of-truth) is a triage rule, not a theory of types. The
    payload is that three of the four are *not to be answered*. The
    hosts must let the severity of that verdict land. The disciple is
    not commanded to refuse all conversation; he is commanded to
    *recognize* the patient he is sitting with and spend his time only
    on the one who can be healed. Spending time on the other three is
    not generosity; it is failure of triage.
  - >
    The sermon-as-warning parable — *the householder shouts Al-Hazr!
    Al-Hazr! when the flood reaches the door* — is the most piercing
    image in the second admonition. The hosts must let the parable
    define the form of right preaching. The sermon is a *cry of urgent
    warning* about the punishments and stations of the Hereafter; it is
    not a literary performance. The Imam's verdict that the
    performance-preacher is *a Shaytan* and that authorities should
    remove such preachers from the *Minbar* must not be softened — the
    Imam's verdict is the verdict; the hosts walk it.
  - >
    The two rules at the start of the four actions — *your relation
    with Allah measured by the inverted servant test* and *your relation
    with the slaves of Allah measured by the loved-for-self test* — are
    the architectural spine of the four actions. The hosts must let the
    pairing land as the complete two-relation account of the servant's
    life: vertical with the Lord, horizontal with the Lord's creation.
    Each rule is calibrated against a hadith (the Lord's asymmetry; the
    completion of *Iman*).
  - >
    The third action — *study only what you would study if you had a
    week to live* — is the chapter's most economical answer to the
    disciple's original question. The hosts must let the *single test*
    do its work. The disciple's anxiety about which of the many sciences
    he should pursue is not resolved by a list of sciences; it is
    resolved by a *test* that the disciple applies to each science he
    considers. The test eliminates by exclusion — *what you would NOT
    study in the final week is not worth your study now*. Resist the
    pull to enumerate sciences.
  - >
    The fourth action's calibration — one year as the *maximum* of
    stockpiled provision for the household whose *Tawakkul* is not yet
    perfect; not a single day as the *minimum* for the household whose
    *Tawakkul* is perfect — is the chapter's most demanding rule of
    daily life. The hosts must hold *both ends* of the calibration. The
    rule is not anti-prudence; it is anti-*hoarding*. The Mothers of
    the Believers (Ummahatil Mu'mineen) include both kinds of
    household, and the Prophet ﷺ calibrated differently for each. The
    disciple's task is to find his honest position on that calibration.
  - >
    The closing supplication is the third request the disciple put to
    the Imam in his original letter — a supplication to recite at all
    times. The hosts must let the supplication land as *the daily
    companion* the Imam intends it to be — not as a recitation
    flourish. The supplication has three movements (fullness of gift,
    protection from harm, the Divine names) and rests on the names
    *Aziz*, *Ghaffar*, *Kareem*, *Sattar*, *Haleem*, *Jabbar*, *Azeem*,
    *Qahhar*, *Rahman*, *Raheem*, *Arhamu ar-Rahimeen*. The closing
    *This book comes to an end with the help of Al-Malik, the Absolute
    Sovereign, and Al-Wahhab, the Giver of all* seals both the chapter
    and the book.
tone_constraints:
  - >
    Walk the chapter in its source-order. Hatim's eight benefits in
    order → the four-heavenly-Books verdict → the fifth condition
    (perfected guide) → qualities of the true *Shaykh* → outward and
    inward etiquettes of the disciple → the sixth and seventh conditions
    → the four doctrinal definitions (*Tasawwuf*, servitude, *Tawakkul*,
    *Ikhlas*) → the *Khidr*-counsel transition (patience, pacing,
    practice over inquiry) → the eight admonitions, with the four
    restraints first (debate; preaching; the affluent and rulers;
    accepting gifts from rulers) and the four actions second (the two
    inverted-test rules; study-as-if-a-week-to-live; not stockpiling
    more than a year) → the closing supplication → the closing seal.
    Do not re-order; the accumulation IS the argument.
  - >
    The Prophet ﷺ honorific is spelled out on first per-chapter mention
    (*peace and blessings of Allah be upon him*) and contracted to ﷺ
    thereafter, per R-HONORIFIC-ONCE. Imam al-Ghazali takes the
    parenthetical *(Rahmatullahi Alayhe — RA — may Allah shower His
    mercy upon him)* on first per-chapter mention and is then referred
    to as *the Imam* or *Imam Ghazali (RA)*. Shaykh Shafeeq al-Balkhi
    (RA), Hatim Ism (RA), Shaykh Zun Noon Misri (RA), Prophet Isa,
    Prophet Musa, Prophet Dawud, and Khidr take *peace of Allah be upon
    him* or *RA* on first chapter mention, as appropriate. 'Aisha
    Siddiqa takes *may Allah be pleased with her*. The Mothers of the
    Believers are *Ummahatil Mu'mineen* (um-ma-HAA-til mu-mi-NEEN) and
    the Pure Wives are *Azwaj al-Mutahharat* (az-WAAJ al-mu-TAH-ha-raat).
  - >
    All Arabic terms take their phonetic guide on first chapter
    appearance per R-PRONUNCIATION-IMPERATIVE — *Ayyuhal Walad*
    (AY-yu-hal WA-lad), *Nafs* (NAFS), *Taqwa* (TAQ-wa), *Halal*
    (ha-LAAL), *Haram* (ha-RAAM), *Deen* (DEEN), *Shari'ah* (sha-REE-ah),
    *Shaykh al-Kamil* (SHAYKH al-KAA-mil), *Murshid al-Kamil* (mur-SHID
    al-KAA-mil), *Bay'a* (bay-AH), *Riazat* (ri-YAA-zat), *Mujahada*
    (mu-JAA-ha-dah), *Mureed* (mu-REED), *Jinn* (JINN), *Tasawwuf*
    (ta-SAW-wuf), *Sufi* (SOO-fee), *Tawakkul* (ta-WAK-kul), *Ikhlas*
    (ikh-LAAS), *Riya* (ri-YAA), *Iman* (ee-MAAN), *Tawfeeq* (taw-FEEQ),
    *Khidr* (KHI-dr), *Wajib* (WAA-jib), *Salat* (sa-LAAT), *Sahah
    Sitta* (si-HAAH sit-TA), *Ahl al-Bayt* (AHL al-BAYT), *Malik
    ul-Maut* (MAA-lik ul-MAUT), *Munkar and Nakir* (MUN-kar wa
    na-KEER), *Hashr* (HASHR), *Mizan* (mi-ZAAN), *Sirat* (si-RAAT),
    *Sirat al-Mustaqeem* (si-RAAT al-mus-ta-QEEM), *Fasiq* (FAA-siq),
    *Zalim* (ZAA-lim), *Fasad* (fa-SAAD), *Minbar* (MIN-bar), *'Amr bil
    Ma'roof Wa Nahi 'Anil Munkar* (amr bil ma-ROOF wa NAH-yi a-nil
    MUN-kar), *Fard al-'ayn* (FARD al-AYN), *Fard Kifaya* (FARD
    ki-FAA-yah), *Ihya al-Uloom ad-Deen* (ih-YAH al-oo-LOOM ad-DEEN),
    *Tawrat* (taw-RAAT), *Injil* (in-JEEL), *Zabur* (za-BOOR), *Ahkamul
    Hakimeen* (ah-KA-mul ha-ki-MEEN), *Du'a* (du-AA), *Ummahatil
    Mu'mineen* (um-ma-HAA-til mu-mi-NEEN), *Azwaj al-Mutahharat*
    (az-WAAJ al-mu-TAH-ha-raat). The Divine names take their phonetic
    on first per-chapter mention: *Ya Aziz* (ya a-ZEEZ), *Ya Ghaffar*
    (ya ghaf-FAAR), *Ya Kareem* (ya ka-REEM), *Ya Sattar* (ya sat-TAAR),
    *Ya Haleem* (ya ha-LEEM), *Ya Jabbar* (ya jab-BAAR), *Ya Azeem*
    (ya a-ZEEM), *Ya Qahhar* (ya qah-HAAR), *Ya Rahman* (ya rah-MAAN),
    *Ya Raheem* (ya ra-HEEM), *Ya Arhamu ar-Rahimeen* (ya AR-ha-mu
    ar-ra-hi-MEEN), *Al-Malik* (al-MA-lik), *Al-Wahhab* (al-wah-HAAB),
    *Rabb ul-'Alameen* (RABB ul-aa-la-MEEN).
  - >
    The Quranic verses anchoring Hatim's eight benefits — *Wa Amma Mun
    Khafa Maqama Rabbihi Wa Nahun Nafsa 'Anil Hawa* (Q 79:40-41), *Ma
    'Indakum Yanfadu Wa Ma 'IndAllahi Baaqin* (Q 16:96), *Inna
    Akramakum 'IndAllahi Atqakum* (Q 49:13), *Nahnu Qasumna Baeynahum
    Ma'eeshatahum Fil Hayatid Dunya* (Q 43:32), *Innash Shaytana Lakum
    'Aduwwun Fettakhizuhu 'Aduwwa* (Q 35:6), *Alam A'had Ilaeykum Ya
    Bani Aadama* (Q 36:60-class), *Wa Ma Min Daabbatin Fil Arde Illa
    'AlalAllahi Rizquha* (Q 11:6), *Wa Maey Yatawakkal 'AlalAllahi
    Fahuwa Hasbuhu* (Q 65:3), *Wa Huwa Husbi Wa Nai'mal Wakeel* — stay
    verbatim with attribution. The *Khidr*-transition verses *Wa Lau
    Annahum Sabaru* (Q 49:5), *Fala Tas-alni 'Un Shaeyin* (Q 18:70),
    *Sa Urikum Ayate*, and *Awalum Yaseeru Fil Ardi* stay verbatim. The
    Ahadith — *Ya Ibna Maryama A'azee Nafsaka*, *Fa InnAllaha Yaghdib
    Iza Mudihal Faasiqu Waz Zalimu*, *Allahumma Aj'al Quta Aale
    Muhammadin Kafafun*, *Fala Yakmalu Eemanu 'Abdi Hatta Yuhibba
    Lisaa-irin Nasi*, *Nahnu Ma'aashirul Anbiyaee Umirna Un
    Natakallamun Nasa 'Ala Qadre 'Uuqulihim*, *InnAllaha La Yunzuru Ila
    Suwarikum Wa La Ila 'Aamalikum* — stay verbatim with attribution.
    The poet's *Kullul 'Adawati Qad Turja Izalatuha* couplet, the *Fa
    'AaRid 'Um Mun Tawalla* verse, and the saying of Shaykh Zun Noon
    Misri (RA) — *In Qadarta 'Ala Bazlir Ruhi Fata'ala* — stay verbatim.
  - >
    The Imam's address-formulae — *My dear beloved son!*, *Beware!
    Beware!* — should be preserved in the narration as the natural
    breath-points of the letter. The intimacy is doctrinal; the second
    chapter retains the second-person form throughout. The hosts should
    not collapse the second-person into a third-person summary at any
    point.
  - >
    End on the closing seal — *This book comes to an end with the help
    of Al-Malik, the Absolute Sovereign, and Al-Wahhab, the Giver of
    all* — and a brief naming of what the disciple now has: eight
    benefits to live by, seven conditions satisfied, four doctrinal
    definitions held, eight admonitions disciplining the days, one
    supplication to recite after every prayer until the grave receives
    him. The letter is closed and the book is closed.
anchor_passages:
  - >
    "Hatim Ism (RA)'s first benefit on the only beloved who descends into
    the grave: *I made my righteous deeds my beloved, so that they will
    accompany me into my grave when I die, will offer me their company
    there, will become an illuminated candle within my grave, will be
    my partner through every stage of the life hereafter, and will
    never separate from me.*"
  - >
    "The Quranic anchor of the second benefit (Q 79:40-41): *Wa Amma
    Mun Khafa Maqama Rabbihi Wa Nahun Nafsa 'Anil Hawa Fa Innal Jannata
    Heyal Mawa. — But as for the one who has stood in awe of his
    Sustainer's Presence and restrained his inner self from base and
    evil desires, Paradise will be the place of rest.*"
  - >
    "Hatim Ism (RA) on the terminus of the discipline of the Nafs: *I
    disciplined it to such a degree that I refused to fulfil any of its
    desires, until at last it began to find peace and satisfaction in
    the worship of Allah, the Exalted.*"
  - >
    "The Quranic anchor of the third benefit (Q 16:96): *Ma 'Indakum
    Yanfadu Wa Ma 'IndAllahi Baaqin. — All that is with you is bound to
    come to an end, whereas all that which is with Allah is everlasting.*"
  - >
    "The Quranic anchor of the fourth benefit (Q 49:13): *Inna Akramakum
    'IndAllahi Atqakum. — Verily, the noblest of you in the sight of
    Allah is the one who is most deeply conscious of Him.*"
  - >
    "The Quranic anchor of the fifth benefit (Q 43:32): *Nahnu Qasumna
    Baeynahum Ma'eeshatahum Fil Hayatid Dunya. — It is We who distribute
    their means of livelihood among them in the life of this world.*"
  - >
    "The Quranic anchor of the sixth benefit (Q 35:6) and the path that
    opens after: *Innash Shaytana Lakum 'Aduwwun Fettakhizuhu 'Aduwwa.
    — Verily, Shaytan is your enemy, so treat him as your enemy.* And:
    *Alam A'had Ilaeykum Ya Bani Aadama Al La Ta'budush Shaytana
    Innahu Lakum 'Aduwwum Mubeen Wa Ane'buduni Haza Siratum Mustaqeem.
    — Did I not make this covenant with you, O Children of Adam — that
    you should never obey Shaytan, for he is your avowed and open
    enemy — and that you should worship Me alone? This is the straight
    path.*"
  - >
    "The Quranic anchor of the seventh benefit (Q 11:6): *Wa Ma Min
    Daabbatin Fil Arde Illa 'AlalAllahi Rizquha. — And there is no
    living creature on earth whose sustenance is not the responsibility
    of Allah.*"
  - >
    "The Quranic anchors of the eighth benefit (Q 65:3 and the
    servant's response): *Wa Maey Yatawakkal 'AlalAllahi Fahuwa Hasbuhu.
    — And for everyone who places his trust in Allah, He alone is
    sufficient.* And: *Wa Huwa Husbi Wa Nai'mal Wakeel. — And He is
    sufficient for me, and He is the best of Helpers.*"
  - >
    "Shaykh Shafeeq al-Balkhi (RA)'s closing verdict on the four
    heavenly Books: *I have seen in the Tawrat, the Injil, the Zabur,
    and in the praiseworthy differentiator between right and wrong —
    the Holy Quran — that all four of these Books of God speak of these
    very eight benefits. Whoever acts upon these eight principles is as
    one who has acted upon all four holy Books.*"
  - >
    "Imam Ghazali (RA) on the farmer-and-the-crop image for the work of
    the perfected guide: *The example of this spiritual training is
    like that of a farmer tending a crop: when he sees unnecessary
    weeds that have sprung up among the grain, he pulls them out and
    throws them away. Then he waters the crop and nourishes it so that
    it grows well and develops good quality.*"
  - >
    "Imam Ghazali (RA) on the doctrinal definition of Tasawwuf: *Tasawwuf
    is defined by two qualities. The first is that the servant should
    be obedient to Allah — that is, acting in accordance with the
    Shari'ah. The second is that the seeker should be compassionate and
    a doer of good toward all of Allah's creation, which is not
    possible without first purifying one's soul of all evil qualities
    and then adorning it with all noble ones.*"
  - >
    "The Hadith Qudsi-register address to Prophet Isa (peace of Allah
    be upon him) on the prerequisite for preaching: *Ya Ibna Maryama
    A'azee Nafsaka Fa In At-ta'azta Fa Izin Nasa Fustahyee Minni. — O
    Son of Mary! First admonish your own soul; then, if it accepts your
    counsel, admonish others — otherwise have shame before Me.*"
  - >
    "Imam Ghazali (RA)'s flood-parable for the sermon: *Consider the
    example of a person whose house is struck by a flood — water
    reaching the very door, threatening within seconds to engulf the
    house and drown everyone inside. In that moment, the owner of the
    house will cry out urgently: Al-Hazr! Al-Hazr! — Beware! Beware! At
    such a moment of imminent catastrophe, no one would describe the
    flood in ornate sentences. A sermon should be precisely like this.*"
  - >
    "The hadith against praising the transgressor: *Fa InnAllaha
    Yaghdib Iza Mudihal Faasiqu Waz Zalimu Wa Iza Madaha Wa Mun Da'aa
    Li Zalimin Bitoolil Baqaaii Faqad Ahabba Aye Ya'siyAllahu Fil Arde.
    — Verily, Allah is angered when any transgressor (Fasiq) or
    oppressor (Zalim) is praised; and whoever prays for a long life for
    an oppressor has, in effect, expressed a desire that sin be
    perpetuated upon the earth.*"
  - >
    "The Hadith Qudsi on the completion of Iman through love-for-others:
    *Fala Yakmalu Eemanu 'Abdi Hatta Yuhibba Lisaa-irin Nasi Ma Yuhibba
    Li Nafsihi. — My slave's faith is never complete until he loves for
    all human beings what he loves for himself.*"
  - >
    "The Imam's third-action rule: *If you knew with certainty that
    your life would last no more than a week, you would never spend
    those final days studying books on religious debate and argumentation,
    lexicography, linguistics and grammar, poetry, poetic collections,
    or the art of composition. You would recognize that such knowledge
    could offer you no benefit.*"
  - >
    "The Prophet ﷺ on the gaze of Allah: *InnAllaha La Yunzuru Ila
    Suwarikum Wa La Ila 'Aamalikum Wa Lakin Yunzuru Ila Qulubikum Wa
    Niyyatikum. — Verily, Allah does not look at your faces or your
    outward actions, but He looks at your hearts and your intentions.*"
  - >
    "The Prophet ﷺ's calibrating supplication for the stockpile-rule:
    *Allahumma Aj'al Quta Aale Muhammadin Kafafun. — O my Allah! Make
    this provision sufficient for the family of Muhammad ﷺ.*"
  - >
    "The closing seal of the book: *This book comes to an end with the
    help of Al-Malik, the Absolute Sovereign, and Al-Wahhab, the Giver
    of all.*"
