show_notes:
  blurb: >
    The second and closing chapter of *Ayyuhal Walad* (AY-yu-hal WA-lad
    — "O Beloved Son") receives the practical regimen the opening
    chapter held in reserve. The chapter opens at the threshold the
    first chapter held open — Shaykh Shafeeq al-Balkhi (RA — sha-FEEQ
    al-BAL-khee) putting his question to his disciple Hatim Ism (RA —
    HAA-tim ISM): *what eight benefits did you distil from thirty-three
    years of my company?* The eight are walked one by one — observation
    of the world, Quranic anchor, decision of the will, ratification by
    the master. The disciple's eight observations recover the doctrinal
    spine of the *Deen* (DEEN — the path to God): righteous deeds as
    the only beloved who descends into the grave; war against the *Nafs*
    (NAFS) until it finds peace in the worship of Allah; wealth as a
    deposit with Allah; *Taqwa* (TAQ-wa — pious reverence) as the sole
    coordinate of honor in Allah's sight; contentment with Allah's
    distribution of livelihoods; *Shaytan* as the sole enemy and
    *Sirat al-Mustaqeem* (si-RAAT al-mus-ta-QEEM — the straight path)
    as what opens once the enmity is correctly targeted; sustenance as
    the responsibility of Allah; complete *Tawakkul* (ta-WAK-kul —
    reliance) on Allah in every matter. Shaykh Shafeeq al-Balkhi (RA)
    verdicts that these eight are what the *Tawrat* (taw-RAAT — Torah),
    *Injil* (in-JEEL — Gospel of Prophet Isa, peace of Allah be upon
    him), *Zabur* (za-BOOR — Psalms of Prophet Dawud, peace of Allah be
    upon him), and Holy Quran all teach. The Imam then resumes the
    seven conditions of the seeker — the fifth (a *Shaykh al-Kamil* —
    SHAYKH al-KAA-mil, with the qualities and chain back to the
    Messenger of Allah ﷺ, plus the outward and inward etiquettes of the
    disciple toward him), the sixth (guarding the *Nafs* by abandoning
    the company of the ill-charactered), and the seventh (humility and
    contentment) — and gives the doctrinal definitions of *Tasawwuf*
    (ta-SAW-wuf — obedience to the *Shari'ah* joined with selfless
    service to creation), servitude (obedience, contentment with the
    decree, abandonment of one's claims), *Tawakkul*, and *Ikhlas*
    (ikh-LAAS — the dissolution of *Riya* — ri-YAA — by regarding all
    creation as powerless pebbles and stones). With the counsel of
    Khidr (KHI-dr) and the saying of Shaykh Zun Noon Misri (RA —
    zun-NOON mis-REE), the Imam pivots to the eight closing admonitions
    — four restraints (do not debate except with the patient who can be
    healed; do not preach for performance or applause; do not greet,
    look at, or keep the company of the affluent and rulers; do not
    accept gifts from rulers) and four actions (the inverted-servant
    test for the relation with Allah; the loved-for-self test for the
    relation with the slaves of Allah; study only what you would study
    in the week before death; do not stockpile more than one year's
    provision). The chapter and the book close with the long supplication
    the Imam writes for the disciple to recite after every *Salat*
    (sa-LAAT — obligatory prayer), and with the closing seal: *This
    book comes to an end with the help of Al-Malik, the Absolute
    Sovereign, and Al-Wahhab, the Giver of all.*
