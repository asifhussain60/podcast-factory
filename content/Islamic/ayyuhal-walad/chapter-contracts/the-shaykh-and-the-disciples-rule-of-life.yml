  references:
    - >
      "Imam al-Ghazali, *Ayyuha al-Walad* — the closing-middle of the
      letter: Hatim ibn Ism's eight benefits, the fifth/sixth/seventh
      inward conditions of the seeker (Shaykh al-Kamil; vigilance
