      "Hatim ibn Ism al-Asamm (d. 237 AH / 851 CE) — the great
      Khurasanian ascetic disciple of Shaykh Shafeeq al-Balkhi (d.
      194 AH / 810 CE); the 'eight benefits' speech is one of the
      most widely transmitted set-pieces in classical Sufi
      literature, attested in al-Qushayri's *Risala* and in
      Ghazali's own *Ihya al-Ulum ad-Din* as well as here"
