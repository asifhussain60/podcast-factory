      "The Quranic verses anchoring Hatim's eight benefits: 79:40–41
      (restraining the Nafs); 16:96 (the everlasting versus the
      perishable); 49:13 (Taqwa as nobility); 43:32 (Allah's
      distribution of sustenance); 35:6 (Shaytan as the appointed
      enemy); 11:6 (sustenance as Allah's responsibility); 65:3
