      "The closing Quranic citations on not hastening: 49:5 (those
      who clamored outside the Prophet's house); 18:70 (Khidr's
      counsel to Moses, peace be upon them both); the verse *Sa
      Urikum Ayate Fala Tusta'jiloon*; and the verse of travel
      *Awalum Yaseeru Fil Ardi Fayanzuru*"
    - >
