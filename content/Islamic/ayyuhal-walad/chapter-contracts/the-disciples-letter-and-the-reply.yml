title: "The Disciple's Letter and the Reply"
audience: >
  Thoughtful adult readers approaching Imam al-Ghazali (Rahmatullahi
  Alayhe — rah-ma-tul-LAH-hi a-LAY-hi — may Allah shower His mercy upon
  him) at the late, distilled end of his writing life. *Ayyuhal Walad*
  (AY-yu-hal WA-lad — "O Beloved Son") is the short letter the Imam
  wrote in answer to one of his own long-time disciples, who — after
  years of study under the Imam in theology, jurisprudence, and the
  sciences of the heart — had found a question weighing on his heart
  that none of the books resolved: *of all that he had learned, which
  branches would actually benefit him on the Day of Judgment, illuminate
  his grave, and stand as a witness for him before Allah?* Listeners
  meet the Imam at the opening of his reply — the frame narrative of
  the disciple's letter, then the Imam's opening salutation, then the
  long opening movement of the letter itself in which the Imam works
  the diagnosis at the heart of the whole book: *knowledge without
  action is madness, and action without knowledge is worthless*. They
  walk the Prophet ﷺ's two warnings (preoccupation with the useless;
  the forty-year threshold), the verdict on the scholar most severely
  punished, the vignette of Shaykh Junaid Baghdadi (ju-NAYD bagh-DAA-dee)
  seen in a dream confessing that only the *Rak'at* (RAK-at — cycles)
  of *Tahajjud* (ta-HAJ-jud — the last-third night vigil) he had actually
  performed availed him after death, the two parables of the warrior
  with the swords and the sick man with the medicine, the Quranic anchor
  of *Wa Anna Laysa Lil Insani Illa Ma Sa'a* (Q 53:39) and its
  supplementary verses (Q 99:7–8, 18:110), the architecture of Islam
  and *Iman* (ee-MAAN), the Imam's correction against the misreading
  that Paradise is earned by deeds rather than received by Mercy, the
  story of the Israelite worshipper and the testing angel, the chorus
  of saints (the Father of Imams may Allah honor his countenance; Shaykh
  Hasan al-Basri RA; one of the intimate friends of Allah; the Prophet
  ﷺ on the *Kayyis* and the *Ahmaq*), the hinge between *Fawaylun Laka*
  and *Fatuba Laka* (woe and blessing) at the level of intention, the
  forty questions at the casket from the *Injil* (in-JEEL — the Gospel
  of Prophet Isa, peace of Allah be upon him), the daily address of
  Allah to the heart, the cry of *Ferje'yna Na'mal Saaliha* (*Send us
  back, O our Lord*) answered by *that is precisely where you have come
  from*, the formula of Abu Bakr al-Siddiq (may Allah be pleased with
  him) on bodies as cages of birds or stables of animals, Hasan al-Basri
  (RA) collapsing over a cold drink at the memory of the inhabitants
  of the Fire begging for water, the dawn call *Hul Min Ta ibin*, the
  four announcements at the four watches of the night, the Quranic
  commandment of *Tahajjud* upon the Prophet ﷺ, Luqman's (LUQ-maan)
  testament that the rooster must not prove more intelligent than his
  son, the dove's poem on the lover who sleeps while the doves weep,
  the doctrinal definition of worship-as-obedience to the *Shari'ah*
  (sha-REE-ah) of Prophet Muhammad ﷺ, the discipline of *mujahadah*
  (mu-JAA-ha-dah — intense inner spiritual struggle), the Imam's
  warning against the false Sufis whose tongues speak wisdom while
  their hearts remain enslaved, the matter of *Ishq* (ISHQ) and *Zauq*
  (ZAWQ) that cannot be written, the four conditions of the seeker
  (*Taqwa* — TAQ-wa; *Taubatun Nasuh* — taw-BA-tun na-SOOH; settling
  the rights of creatures; sufficient knowledge of the *Shari'ah*),
  Shibli's (SHIB-lee) confession that of four thousand Ahadith he had
  heard from four hundred masters he had adopted only one — the saying
  that calibrates work for the world to its length, work for the
  Hereafter to its length, work for Allah to one's need of Him, and
  work to escape the Fire to what one can bear of its pain — and the
  Imam's lemma that knowledge beyond personal obligation is *Fard
  Kifayah* (FARD ki-FAA-yah). The chapter holds at the threshold of
  Shaykh Shafeeq al-Balkhi's (sha-FEEQ al-BAL-khee) question to his
  disciple Hatim Ism (HAA-tim ISM) — *what eight benefits did you
  distil from thirty-three years of my company?* — whose answer is the
  whole work of the next chapter.
