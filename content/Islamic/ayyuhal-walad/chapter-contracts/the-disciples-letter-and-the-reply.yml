  thesis_relevance: >
    This chapter advances the book's central claim that *knowledge
    without action is madness, and action without knowledge is
    worthless* — and that the disciple's anxiety about *which*
    branches of knowledge will benefit him on the Day of Judgment is
    misdiagnosed at the level of the question itself — by stating
    the diagnosis directly, working it through the Prophet's ﷺ
    warnings, the saints' confessions, the Quranic verdicts, and the
    night-architecture, and by ending at the threshold of the
    practical regimen (Shibli's lemma of sufficiency; Hatim Ism's
    eight benefits held for the next chapter). Without this chapter
    the book's whole frame is missing.
