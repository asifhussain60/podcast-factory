show_notes:
  blurb: >
    The opening of *Ayyuhal Walad* (AY-yu-hal WA-lad — "O Beloved Son")
    — the short letter Imam al-Ghazali (Rahmatullahi Alayhe — rah-ma-
    tul-LAH-hi a-LAY-hi) wrote to one of his long-time disciples who
    had asked, after years of study, *which* of all the branches of
    knowledge he had been taught would actually benefit him on the Day
    of Judgment. The Imam's opening counter-question reframes the
    request: *if the Prophet's ﷺ counsels have not already saved you,
    what would mine save you with?* From that pivot the long opening
    movement runs — the Prophet's ﷺ two warnings (preoccupation with
    the useless; the forty-year threshold), the verdict on the scholar
    most severely punished, Shaykh Junaid Baghdadi (RA) seen in a dream
    after death confessing that only the *Tahajjud* he had actually
    performed availed him, the parables of the warrior with the swords
    and the sick man with the medicine, the Quranic anchor *Wa Anna
    Laysa Lil Insani Illa Ma Sa'a* and the supplementary verses that
    the abrogation objection cannot reach, the architecture of Islam
    and *Iman*, the Imam's correction that Paradise is entered by
    Mercy with deeds as qualification, the Israelite worshipper's
    reply to the testing angel, the chorus of saints (the Father of
    Imams may Allah honor his countenance; Shaykh Hasan al-Basri RA;
    the Prophet ﷺ on the *Kayyis* and the *Ahmaq*), the hinge between
    *Fawaylun Laka* and *Fatuba Laka* at the level of intention, the
    forty casket-questions from the *Injil*, the daily address of
    Allah to the heart, the cry *Ferje'yna Na'mal Saaliha* and its
    answer *that is precisely where you have come from*, Abu Bakr's
    formula on bodies as cages of birds or stables of animals, Hasan
    al-Basri (RA) collapsing over a cold drink at the memory of the
    inhabitants of the Fire begging for water, the dawn call *Hul Min
    Ta ibin*, the architecture of the four announcements of the night,
    the Quranic commandment of *Tahajjud* upon the Prophet ﷺ, Luqman's
    testament on the rooster, the dove's poem on the lover who sleeps
    while the doves weep, the doctrinal definition of worship-as-
    obedience to the *Shari'ah*, the discipline of *mujahadah* and the
    Imam's warning against the false Sufis, the matter of *Ishq* and
    *Zauq* that cannot be written, the four conditions of the seeker
    (*Taqwa*, *Taubatun Nasuh*, settling the rights of creatures,
    sufficient knowledge of the Shari'ah), Shibli's (RA) confession
    that of four thousand Ahadith he had adopted only one — the saying
    that calibrates work for the world, the Hereafter, Allah, and the
    Fire — and the lemma that knowledge beyond personal obligation is
    *Fard Kifayah*. The chapter holds at Shaykh Shafeeq al-Balkhi's
    (RA) question to Hatim Ism (RA): *what eight benefits did you
    distil from thirty-three years of my company?*
