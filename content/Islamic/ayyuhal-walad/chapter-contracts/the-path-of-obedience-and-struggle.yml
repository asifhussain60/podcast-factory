  references:
    - >
      "Imam al-Ghazali, *Ayyuha al-Walad* — the disciple's letter
      and Ghazali's reply, second movement: the dawn watch
      (Hasan al-Basri's sigh, the four angels, Luqman's
      testament), the principle of worship-as-obedience with its
      four edge-cases, the doctrine of *mujahadah* with the
      polemic against simulated Sufism, the four conditions of
      the sincere seeker, and Shibli's hadith of the four
      proportions"
    - >
      "The *Tahajjud* / pre-dawn vigil cluster — Quran (the
      Prophet's nightly supererogatory prayer; the verses on
      those who seek forgiveness at the hour of *sahr*) plus the
      Prophetic hadith on the three sounds that please Allah; the
      backbone of the night-worship genre in Sunni piety"
    - >
      "Luqman the Wise — the proverbial sage of Surah Luqman
      (Quran 31); his testament to his son is one of the great
      father-to-son counsel registers of the religion, and
      Ghazali borrows the genre as the frame of the whole letter
      *Ayyuha al-Walad*"
    - >
      "The doctrine of *mujahadah* as inner spiritual struggle —
      central to Ghazali's *Ihya al-Ulum ad-Din* (Revival of the
      Knowledge of the Path to God), particularly the quarter on
      *Muhlikat* (destroyers) and *Munjiyat* (saviors); the
      *Ayyuha al-Walad* presentation is the distilled rule"
    - >
      "Shibli (al-Shibli, d. 334 AH / 946 CE) — Baghdad-school
      mystic and student of Junaid Baghdadi; the saying *I served
      400 spiritual masters and adopted only one out of 4,000
      hadith* is a standard hagiographic vignette used in Sufi
      pedagogical literature to teach the discipline of
      acting-upon over accumulating"
    - >
      "Hatim ibn Ism al-Asamm (HAA-tim ibn IS-m al-A-samm,
      d. 237 AH / 851 CE) and his master Shaykh Shafeeq al-Balkhi
      (sha-FEEQ al-BAL-khee, d. 194 AH / 810 CE) — named in the
      chapter's closing turn as the setup for the next episode,
      where Hatim's eight benefits drawn over thirty-three years
      in his master's company are unfolded as the disciple's
      practical rule of life"
