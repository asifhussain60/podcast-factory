  # Build the reading edition. This book has had a finished book/book.md and a
  # fluency report since 2026-08-01, but without this flag `_book_branch_enabled`
  # returns false and all five 0book-* phases are stamped `skipped` — so any
  # re-run reported success over an untouched folder. Same omission that cost
  # degrees-of-excellence a run on 2026-07-31.
