# tradition_affinity: 'fatimid-ismaili' — all 628 doctrine atoms carry this label, including
# the ethically-universal passages (sincerity, patience, soul, asceticism) that are safe for
# Ghazali's register. The tag filter below is the cross-tradition guard: tags like 'imamate',
# 'cosmology', and 'esoteric interpretation' are excluded; only broadly-Islamic spiritual tags
# are listed.
tradition_affinity: fatimid-ismaili
