<svg id="Death__Appearance_Against_Reality" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 214" role="img" aria-labelledby="Death__Appearance_Against_Reality_t Death__Appearance_Against_Reality_d">
<title id="Death__Appearance_Against_Reality_t">Death: Appearance Against Reality</title>
<desc id="Death__Appearance_Against_Reality_d">Two-column contrast: The Believer vs The Disbeliever — 2 paired phenomena</desc>
<style>#Death__Appearance_Against_Reality{font-family:'Lato', system-ui, sans-serif;font-size:14px;fill:#111111;}#Death__Appearance_Against_Reality text{font-family:'Lato', system-ui, sans-serif;}</style>
<text x="250" y="20.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#000000"><tspan x="250" dy="0">Death: Appearance Against Reality</tspan></text>
<text x="250" y="34.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#777777"><tspan x="250" dy="0">What onlookers see at death is the inverse of its true</tspan><tspan x="250" dy="12">reality</tspan></text>
<rect x="14.0" y="62.0" width="218.0" height="48.0" fill="#000000" stroke="#000000" stroke-width="1.0" rx="4"/>
<rect x="268.0" y="62.0" width="218.0" height="48.0" fill="#eeeeee" stroke="#d0d0d0" stroke-width="1.0" rx="4"/>
<text x="123.0" y="86.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#ffffff"><tspan x="123.0" dy="0">The Believer</tspan></text>
<text x="377.0" y="86.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#111111"><tspan x="377.0" dy="0">The Disbeliever</tspan></text>
<rect x="14.0" y="110.0" width="218.0" height="46.0" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.0"/>
<rect x="268.0" y="110.0" width="218.0" height="46.0" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="123.0" y="133.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="123.0" dy="0">Death is made hard</tspan></text>
<text x="377.0" y="133.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="377.0" dy="0">Death is made easy</tspan></text>
<line x1="249" y1="114" x2="249" y2="152" stroke="#d0d0d0" stroke-width="1"/>
<rect x="14.0" y="156.0" width="218.0" height="46.0" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="1.0"/>
<rect x="268.0" y="156.0" width="218.0" height="46.0" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="123.0" y="172.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="123.0" dy="0">In truth a lightening</tspan><tspan x="123.0" dy="14">and mercy</tspan></text>
<text x="377.0" y="172.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="377.0" dy="0">In truth a great</tspan><tspan x="377.0" dy="14">punishment</tspan></text>
<line x1="249" y1="160" x2="249" y2="198" stroke="#d0d0d0" stroke-width="1"/>
