<line x1="250.0" y1="192.0" x2="250.0" y2="218.0" stroke="#777777" stroke-width="1.5"/>
<line x1="250.0" y1="218.0" x2="250.0" y2="238.0" stroke="#777777" stroke-width="1.5" marker-end="url(#svgp_arrow)"/>
<line x1="250.0" y1="288.0" x2="250.0" y2="314.0" stroke="#777777" stroke-width="1.5"/>
