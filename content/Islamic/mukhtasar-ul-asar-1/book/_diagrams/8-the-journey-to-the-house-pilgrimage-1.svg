<svg id="The_Three_Kinds_of_Pilgrim" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 452" role="img" aria-labelledby="The_Three_Kinds_of_Pilgrim_t The_Three_Kinds_of_Pilgrim_d">
<title id="The_Three_Kinds_of_Pilgrim_t">The Three Kinds of Pilgrim</title>
<desc id="The_Three_Kinds_of_Pilgrim_d">Hierarchy: Pilgrims (ranked by portion) → Best: forgiven past and future sins → Middle: past sins forgiven, begins works afresh → Least: merely safeguarded family and wealth</desc>
<style>#The_Three_Kinds_of_Pilgrim{font-family:'Lato', system-ui, sans-serif;font-size:14px;fill:#111111;}#The_Three_Kinds_of_Pilgrim text{font-family:'Lato', system-ui, sans-serif;}</style>
<defs><marker id="svgp_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#777777"/></marker></defs>
<text x="250.0" y="24.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#000000"><tspan x="250.0" dy="0">The Three Kinds of Pilgrim</tspan></text>
<rect x="166.0" y="52.0" width="168.0" height="44.0" fill="#000000" stroke="#000000" stroke-width="1.0" rx="4"/>
<text x="250.0" y="66.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#ffffff"><tspan x="250.0" dy="0">Pilgrims (ranked by</tspan><tspan x="250.0" dy="15">portion)</tspan></text>
<rect x="166.0" y="148.0" width="168.0" height="44.0" fill="#555555" stroke="#d0d0d0" stroke-width="1.0" rx="4"/>
<text x="250.0" y="163.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#ffffff"><tspan x="250.0" dy="0">Best: forgiven past</tspan><tspan x="250.0" dy="14">and future sins</tspan></text>
<rect x="166.0" y="244.0" width="168.0" height="44.0" fill="#d9d9d9" stroke="#d0d0d0" stroke-width="1.0" rx="4"/>
<text x="250.0" y="252.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#111111"><tspan x="250.0" dy="0">Middle: past sins</tspan><tspan x="250.0" dy="14">forgiven, begins works</tspan><tspan x="250.0" dy="14">afresh</tspan></text>
<rect x="166.0" y="340.0" width="168.0" height="44.0" fill="#eeeeee" stroke="#d0d0d0" stroke-width="1.0" rx="4"/>
<text x="250.0" y="348.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#111111"><tspan x="250.0" dy="0">Least: merely</tspan><tspan x="250.0" dy="14">safeguarded family and</tspan><tspan x="250.0" dy="14">wealth</tspan></text>
<line x1="250.0" y1="96.0" x2="250.0" y2="122.0" stroke="#777777" stroke-width="1.5"/>
