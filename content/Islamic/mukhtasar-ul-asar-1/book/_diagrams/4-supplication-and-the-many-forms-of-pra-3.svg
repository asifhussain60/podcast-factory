<svg id="The_Four_Intercessors_and_Their_Response" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 306" role="img" aria-labelledby="The_Four_Intercessors_and_Their_Response_t The_Four_Intercessors_and_Their_Response_d">
<title id="The_Four_Intercessors_and_Their_Response_t">The Four Intercessors and Their Responses</title>
<desc id="The_Four_Intercessors_and_Their_Response_d">Two-column contrast: Servant's plea vs Intercessor's response — 4 paired phenomena</desc>
<style>#The_Four_Intercessors_and_Their_Response{font-family:'Lato', system-ui, sans-serif;font-size:14px;fill:#111111;}#The_Four_Intercessors_and_Their_Response text{font-family:'Lato', system-ui, sans-serif;}</style>
<text x="250" y="20.0" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#000000"><tspan x="250" dy="0">The Four Intercessors and Their Responses</tspan></text>
<text x="250" y="34.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="normal" fill="#777777"><tspan x="250" dy="0">Each request is echoed back to Allah by the very thing</tspan><tspan x="250" dy="12">sought</tspan></text>
<rect x="14.0" y="62.0" width="218.0" height="48.0" fill="#000000" stroke="#000000" stroke-width="1.0" rx="4"/>
<rect x="268.0" y="62.0" width="218.0" height="48.0" fill="#eeeeee" stroke="#d0d0d0" stroke-width="1.0" rx="4"/>
<text x="123.0" y="86.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#ffffff"><tspan x="123.0" dy="0">Servant's plea</tspan></text>
<text x="377.0" y="86.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#111111"><tspan x="377.0" dy="0">Intercessor's response</tspan></text>
<rect x="14.0" y="110.0" width="218.0" height="46.0" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.0"/>
<rect x="268.0" y="110.0" width="218.0" height="46.0" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="123.0" y="133.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="123.0" dy="0">Asks Allah for Paradise</tspan></text>
<text x="377.0" y="126.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="377.0" dy="0">Paradise: make him my</tspan><tspan x="377.0" dy="14">dweller</tspan></text>
<line x1="249" y1="114" x2="249" y2="152" stroke="#d0d0d0" stroke-width="1"/>
<rect x="14.0" y="156.0" width="218.0" height="46.0" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="1.0"/>
<rect x="268.0" y="156.0" width="218.0" height="46.0" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="123.0" y="172.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="123.0" dy="0">Asks deliverance from</tspan><tspan x="123.0" dy="14">the Fire</tspan></text>
<text x="377.0" y="172.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="377.0" dy="0">Fire: deliver him from</tspan><tspan x="377.0" dy="14">me</tspan></text>
<line x1="249" y1="160" x2="249" y2="198" stroke="#d0d0d0" stroke-width="1"/>
<rect x="14.0" y="202.0" width="218.0" height="46.0" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.0"/>
<rect x="268.0" y="202.0" width="218.0" height="46.0" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="123.0" y="218.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="123.0" dy="0">Asks to wed the</tspan><tspan x="123.0" dy="14">pure-eyed maidens</tspan></text>
<text x="377.0" y="225.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="377.0" dy="0">Maidens: wed him to us</tspan></text>
<line x1="249" y1="206" x2="249" y2="244" stroke="#d0d0d0" stroke-width="1"/>
<rect x="14.0" y="248.0" width="218.0" height="46.0" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="1.0"/>
<rect x="268.0" y="248.0" width="218.0" height="46.0" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="1.0"/>
<text x="123.0" y="264.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="123.0" dy="0">Sends prayers upon</tspan><tspan x="123.0" dy="14">Muhammad</tspan></text>
<text x="377.0" y="264.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#111111"><tspan x="377.0" dy="0">Angel reports it; Allah</tspan><tspan x="377.0" dy="14">returns the prayer</tspan></text>
<line x1="249" y1="252" x2="249" y2="290" stroke="#d0d0d0" stroke-width="1"/>
</svg>