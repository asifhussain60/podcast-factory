  thesis_relevance: This chapter advances the book's central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents' record, by establishing that this work is the only surviving comprehensive Ismaili-authored history of the Imams and by naming the custodial chain that allowed it to reach us.
