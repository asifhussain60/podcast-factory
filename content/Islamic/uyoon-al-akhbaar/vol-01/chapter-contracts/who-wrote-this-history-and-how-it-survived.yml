show_notes:
  blurb: 'For most of a thousand years, what the world knew about the Ismailis came from the people who wanted them gone — and a good deal of that evidence had been manufactured. This opening episode explains how that changed, and why the seven-volume history we are about to read is the only comprehensive account of the Ismaili Imams written by an Ismaili. It traces the twin reasons the archive was so thin: a community that survived by concealment could not safely write its own chronicles, and the two periods when it did ended with the Fatimid libraries of Cairo destroyed in 1171 and the records of Alamut burned by the Mongols in 1256. Then it follows the one chain that held — Ismaili books carried out of Cairo to Yemen before the burning, kept for three centuries by the mission there, and inherited in 1428 by Idris Imad al-Din, the nineteenth absolute da''i, who read sources that survive nowhere else. It closes with the book itself: seven parts the author calls sevens, the lost histories and Fatimid archives behind them, the students at Surat required to copy the whole manuscript by hand, and the frank verdict of the work''s own scholarly admirers that its partisanship must be read with open eyes.'
