show_notes:
  blurb: 'A man is told three times in his sleep to dig, and the directions he is given are not places but events: between the stomach contents and the blood, where the crow lands, above the anthill. So he sits down in the Sacred Mosque and waits for a cow to bolt. This episode follows ''Abd al-Muttalib from the recovery of Zamzam — Ishmael''s buried well, dug out of the floor of somebody else''s sanctuary over the objections of the whole tribe — through the property dispute that followed it, which ended when the men who had refused him water in the desert drank from a spring that came up under his camel. Then it turns to the vow he had made years earlier: that if a tenth son were born to him, he would sacrifice him. The tenth son was ''Abd Allah, and he was taken by the hand and led out. What saved him was not a repudiation but a substitution — stand by your vow and find another way — and a hundred camels bought at ten a time, with an arrow that had to fall three times before his father would believe it. That son carried a light between his eyes that a scripture-reading priestess recognised on sight and lost by a single evening, and he died before his own son was old enough to remember him. The episode ends with the boy: named in a dream before birth, born in the Year of the Elephant, nursed in the desert, opened and weighed by two men in white, orphaned twice before he was six, and raised by a grandfather who lifted him onto a mattress no one else in the family was permitted to sit on.'
