  thesis_relevance: This chapter advances the book's central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents' record, by bringing that line to the Prophet's own birth — showing the generation immediately before him marked out by true visions, delivered from a vow by a ransom that repeats Abraham's, and carrying a light that passes from father to son under the author's own eyes.
