title: Al-Raji', Ma'unah, Banu al-Nadir
audience: 'Listeners who have followed this community through a victory and a defeat and now watch it spend a whole year without a battle. No prior knowledge is needed beyond the outcome of Uhud. What this episode asks of them is to follow a chain of consequence rather than a campaign: two teaching missions destroyed under guarantees of safe conduct, a blood debt those deaths create, and the siege and expulsion that the errand to pay it sets off.'
angle: faithful_narrative
episode_format: narrative
format_rationale: 'The slice is a run of narrated notices with elegy attached: a delegation, a betrayal on the road, a sale in Mecca, a massacre at a well, a plot at a wall, a six-night siege, four marches that end without fighting, and a funeral. The only extended exchanges are Abu Bara''s negotiation with the Prophet and Ghurth''s taunt with the sword — short altercations inside events, not a sustained contest over a proposition — and the one doctrinal passage, the Prayer of Fear, is a described procedure rather than an unfolded argument, so this is neither debate nor deep_dive.'
host_dynamic: narrator + companion
host_dynamic_rationale: The narrator carries the six teachers and their betrayal at al-Raji', the bees and the flood over 'Asim's body, the crucifixions in Mecca, the well of Ma'unah and the protection that held against everyone it could bind, then the blood debt, the rock on the wall, the siege and the tribe that left playing tambourines, then the four marches that produced no battle and the death of Fatima bint Asad; the companion presses on how every catastrophe here arrives wrapped in a guarantee, and on why a year with no fighting in it ends on the three questions asked in a grave.
debate: null
host_dynamic_custom: null
length_target: extended
essential: core
essential_rationale: It carries the two lost missions of the fourth year, the expulsion of the Banu al-Nadir with its poetry, the transmitted description of the Prayer of Fear, and the death of Fatima bint Asad with the interrogation at her grave — the passage in which the third question put to the dead is named as the question of the Imam.
key_tensions:
  - A covenant sworn by God that guarantees delivery rather than life. The assailants at al-Raji' swear the six will not be killed because they are worth more alive in Mecca; three refuse the covenant and die on the spot, three accept it and are stoned or crucified at the other end.
  - Two vows over one body, and only one is kept. A woman has sworn to drink wine from 'Asim's skull; 'Asim has sworn that no polytheist will ever touch him. A swarm of bees and then a flash flood keep his vow, and to keep it completely his body is carried away from his own side as well.
  - A protection that works exactly as promised and still fails. The Banu 'Amir refuse twice to break Abu Bara's safe conduct over the party at the well, so 'Amir ibn al-Tufayl simply hires the Banu Sulaym instead.
  - A blood debt the Prophet accepts as his own. 'Amr ibn Umayya kills two travellers he does not know are under treaty, and the answer is 'I have killed two men whose blood I must answer for' — followed by the observation that this is the work of the man whose offer he had accepted against his own judgment.
  - A case built on an intention. The plot against the Prophet at the wall of the Banu al-Nadir is defeated before the rock is thrown, and is on the record only because it was reported from heaven.
  - Two specific promises to a besieged tribe, both events, neither honoured. The hypocrites pledge to fight alongside the Banu al-Nadir if attacked and to go into exile with them if expelled.
  - An expulsion staged by the expelled. A tribe that has lost a six-night siege and watched its orchards burn leaves Medina with tambourines, music and trumpets — a spectacle the source says people had rarely seen.
  - 'A year of four marches and no battle, and what it produced instead: a prayer formation for men under threat, a verse about hands restrained, a nickname that made Quraysh ridiculous, and one grave.'
  - Three questions at the grave, not two. Fatima bint Asad answers the question of her Lord and the question of her prophet unaided, hesitates at the question of her Imam, names the wrong son, and has to be corrected.
tone_constraints:
  - Third-person narrative report throughout, matching how the source narrates. Quoted speech appears only where the source supplies it; no dialogue, scene, or motive may be invented around it.
  - The poetry of this chapter is damaged in transmission. Every poem is carried at the level of its surviving sense, with the damage named rather than patched. Do not reconstruct a line and do not repair a garbled proper name.
  - Where the source gives two readings it keeps both. The party at the well is forty men, with al-Bukhari's seventy named beside it; Abu Sufyan halts at Dhahran, with 'Asfan named as the alternative. Neither may be resolved.
  - Chains of transmission are compressed to plain attribution. The Prayer of Fear is attributed to Ja'far ibn Muhammad, from his father, from his forebears, because the transmission of a legal description is part of the teaching; the manuscript sigla, folio marks and footnote locators are dropped.
  - Where the source's referent is the tribe, the tribe is named. The plot at the wall is attributed to the Banu al-Nadir and to the man assigned the task, not generalised beyond what the account states.
  - Honorific formulae are not read aloud after every name. The source's repeated blessing formulae are carried by the narration itself, as in the previous episodes of this series.
  - The killing of Ka'b ibn al-Ashraf, the withdrawal of 'Abd Allah ibn Ubayy on the road to Uhud, and the birth of the Father of Imams inside the Ka'bah were all taught earlier in this history. Each appears here only as a one-line callback in fresh words — never a second telling.
  - Never pair the leadership title with the personal name of the Father of Imams. He is named as Ali ibn Abi Talib, or as the Father of Imams, throughout — including where the source's own phrasing pairs them.
anchor_passages:
  - 'The delegation''s request: ''send with us some of your companions who will instruct us in religion, teach us the Quran, and acquaint us with the rulings of Islam.'''
  - 'The covenant offered at al-Raji'': ''we do not intend to kill you. We only wish to obtain something by delivering you to the people of Mecca'' — and the answer, ''we will accept no covenant made with polytheists.'''
  - 'Khubayb before his execution: ''They offered me disbelief, and I chose death over it... I hope that if I die a Muslim, I need not fear, for to God is my return.'''
  - 'The Prophet''s objection to the mission to Najd, stated in advance: ''I fear for them the people of Najd'' — and Abu Bara''s answer, ''I am their neighbour.'''
  - 'The Banu ''Amir, twice: ''We will not break the protection of Abu Bara''.'''
  - 'The blood debt accepted: ''I have killed two men whose blood I must answer for'' — ''This is the work of Abu Bara'' — that is why I despised it.'''
  - 'The Banu al-Nadir in private: ''You will never find a man like him in such a position again.'''
  - 'The hypocrites'' pledge: ''We will not abandon you. If you are attacked, we will fight alongside you; and if you are expelled, we will go out with you.'''
  - The description of the Prayer of Fear, reported from Ja'far ibn Muhammad, in full — two groups, one facing the enemy, the imam holding his position while each half completes a cycle alone.
  - 'Ghurth with the sword in his hand: ''Are you not afraid of me, with your sword in my hand?'' — ''No. God protects me from you'' — followed by chapter 5, verse 11.'
  - 'The grave of Fatima bint Asad: ''They said to her, who is your Imam? She hesitated, and I said to her, your son, your son.'''
