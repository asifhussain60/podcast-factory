show_notes:
  blurb: 'What do you do when the request that gets your best men killed is a polite request to come and teach? Twice in four months a delegation arrives in Medina asking for instructors, and twice the men sent are surrounded and killed — and in the first case three of them are not killed at all but sold, as merchandise, to Quraysh. Every disaster here arrives wrapped in a guarantee: an oath sworn by God that turns out to protect a price rather than a life; a chieftain''s safe conduct that binds everyone it can bind, so the man who wants the party dead hires a different tribe; a pledge of armed help to a besieged neighbour from people who then do not move. Then follow the chain: a survivor kills two sleeping travellers he does not know are under treaty, the Prophet accepts the blood debt as his own, goes to ask a neighbouring tribe to help pay it, and is nearly killed with a rock while standing at their wall. Six nights of siege later that tribe leaves Medina playing tambourines. And then the strangest stretch in the volume — four marches in a year and not one battle, producing instead a prayer for men under threat, a verse about hands restrained, a nickname that made Quraysh ridiculous, and one grave, in which three questions are asked and the third is about the Imam.'
