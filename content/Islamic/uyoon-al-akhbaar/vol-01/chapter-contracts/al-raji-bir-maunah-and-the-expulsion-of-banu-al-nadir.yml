thesis_relevance: This chapter advances the book's central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents' record, by closing a year that produced no battle on the interrogation in Fatima bint Asad's grave, where the questioning of the dead is given as three questions and the third is the question of the Imam — asked of the mother of the Father of Imams, who could not answer it without prompting.
