    - The Quran, chapter 49 verse 4, chapter 9 verse 31, chapter 5 verse 1 and chapter 11 verse 18 — the passages the source attaches to this stretch
thesis_relevance: 'This chapter advances the book''s central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents'' record, by showing the household holding the pen and then holding the law: Ali writes the reply to the kings of Himyar, the men dispatched to Yemen are described as the righteous of the Prophet''s family and the repositories of its knowledge, and where Ibn Hisham''s transmission of the alms and poll-tax rules conflicts with the narration running through the Ahl al-Bayt the source rules for the household on the warrant of the two weighty things that do not separate.'
