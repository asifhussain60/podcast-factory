title: The Year of Delegations
audience: 'Listeners who have followed this history through eight years of marches and sieges and have just watched the longest expedition of them all return without a battle. No prior knowledge is needed beyond that: the fighting is over and the peninsula is arriving on its own feet. What this episode asks of them is patience with a roll-call — dozens of tribal embassies entered a sentence at a time — and then attention to two very different things the roll-call is carrying: one long first-person account of a man deciding whether the claim is true, and two written documents that legislate a province, followed by an argument about which transmission of those documents may be relied on.'
angle: faithful_narrative
episode_format: narrative
format_rationale: 'The slice is overwhelmingly narrated event and reported speech: arrivals, conversions, a siege, a martyrdom, one conversion narrative told by the convert himself, and three dispatched documents quoted in full. The one argumentative passage — the source setting Ibn Hisham''s version of the alms and poll-tax figures against the version narrated through the Ahl al-Bayt — is the author reasoning in his own voice; Ibn Hisham is named but never answers, and the passage is a small fraction of the slice rather than its spine. There is no sustained named opposition in dialogue, so this is narrative rather than debate.'
host_dynamic: narrator + companion
host_dynamic_rationale: The narrator carries the roll of delegations from Banu Tamim's shout through the wall to the Hamadan riders in striped cloth, the whole of 'Adi ibn Hatim's account in his own voice — the camels kept saddled, the sister left behind, her counsel, the old woman in the street, the leather cushion, the three futures and the exchange about rabbis and monks — and then the letters to Himyar and to Zur'ah Dhu Yazan, Mu'adh's charge, and the covenant for Najran read whole; the companion presses on why a delegation that was entirely in the right had its manners recorded in scripture, on what 'Adi is actually testing when he watches where a man sits, and on why a disagreement about camel-counts is the place this history chooses to state whose narration binds.
