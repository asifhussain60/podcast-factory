show_notes:
  blurb: 'What does a war look like when it stops being fought and starts arriving at your door on its own feet? The ninth year is the one the Arabs themselves named the Year of Delegations, and this episode opens with the roll of them: a delegation that shouted through a wall and had its manners entered in the Quran, a chief who promised to fill the country with cavalry and died of a swelling in his throat under a stranger''s roof, a delegation that carried inside it the man who would offer himself as a partner in prophecy, and a siege in Yemen narrated in Medina on the day it was fought. Then the one arrival told at length and in the man''s own voice: a Christian chief of Tayy who kept his camels saddled for months so he could outrun this religion, ran so fast he left his sister in the camp, and came back to test the claim by watching an old woman hold up the head of state in the street and a host give away his only cushion. And then the paperwork that carried more of the settlement than any battle in this volume — a reply to the kings of Himyar written by Ali, a second letter naming the men sent to Yemen as the righteous of the Prophet''s family, and a covenant for Najran that fixes the hours of prayer by the height of the sun and abolishes the tribal war-cry in a single clause — followed by the question this history most wants asked of them: when two transmissions of the same law disagree about camels and dinars, whose do you take?'
