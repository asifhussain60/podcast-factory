  section_title: The covenant carried into Yemen
key_tensions:
  - A year defined not by what was fought but by who arrived, and by the fact that most of the arrivals are worth only one sentence each.
  - A delegation that submits sincerely and is corrected anyway — for how it knocked, not for what it believed.
  - A boast about filling a country with cavalry answered in four words, and ending in a swelling on the throat under a stranger's roof.
  - A delegation that carried inside it a man offering himself as a partner in prophecy rather than a rival to it.
  - A chief commended for exceeding everything said about him, dead of fever at a well before he reached home.
  - A siege in Yemen described in Medina on the day it was fought, turning on whether a mountain's name means Syria or thanks.
  - A man who kept his camels saddled for months so he could outrun this religion, and left a member of his own household behind when he finally ran.
  - A captive's request refused twice — not for mercy but for want of anyone to answer for her on the road — and granted the moment her own tribe arrives.
  - Advice to join early that works whether the claim is true or false, given by the person with most reason to resent the people giving it.
  - A question settled not by doctrine but by watching who is kept waiting in the street and who ends up sitting on the floor.
  - Three objections named for a man before he can raise them, each answered with a future rather than an argument.
  - A denial of worship that collapses when worship is redefined as obedience in matters of what is permitted and forbidden.
  - A province taken by letter rather than by army — alms rates, prayer times, the length of a garment — with the tribal war-cry abolished in a single clause.
  - Two transmissions of the same letter that disagree about camels and dinars, and a rule for choosing between them that rests on identity rather than on counting narrators.
tone_constraints:
  - Third-person narrative report throughout, matching how the source narrates, except where the source itself gives a first-person account — 'Adi ibn Hatim's conversion — which stays in his voice.
  - The letter to the kings of Himyar, the letter to Zur'ah Dhu Yazan and the covenant to 'Amr ibn Hazm are rendered whole and unbroken, invocation to closing blessing, with their livestock and tax schedules intact. They are never summarised, abridged or split.
  - Arabic technical terms in the documents are preserved as the source supplies them — zakat, jizyah, shirk, dhimmi, 'umrah, 'awrah, and the livestock grades bint labun, ibn labun, bint makhad, hiqqah and tabi' — with the source's own brief glosses kept where it supplies them.
  - The verse of Zayd al-Khayl, Farwah ibn Masik, the Hamadan poets and Farwah ibn 'Amr al-Judhami is damaged in this manuscript. It is carried at the level of surviving sense with the damage named — no line reconstructed, no garbled name repaired.
  - Footnote apparatus, manuscript sigla, folio marks, chains of transmission and edition locators are dropped per the denoise contract; the attributions are preserved in the show-notes references instead.
  - Honorific formulae are not read aloud after every name. The source's repeated blessing formulae are carried by the narration itself, as in earlier episodes.
  - The truce of al-Hudaybiyah, the conquest of Khaybar and the return from Tabuk were all taught earlier in this history and appear here only as one-line datings in fresh words, never re-expounded.
  - Never pair the leadership title with the personal name of the Father of Imams. He is named as Ali ibn Abi Talib, as the Father of Imams, or — where the source itself does so — as the Commander of the Faithful.
anchor_passages:
  - 'The verse on the delegation that shouted through the wall: ''Those who call to you from behind the rooms — most of them do not understand'' (chapter 49, verse 4).'
  - 'The boast and its answer: ''By God, I will fill this land with horses and men'' — ''God is sufficient for you.'''
  - 'The correction that decided a battle''s outcome before the news arrived: ''It is not Sham — it is Thanks. There, the army of God is engaged with your companions at this very hour.'''
  - 'The sister''s counsel: ''If this man is a prophet, then whoever preceded him to his side will have a distinction; and if his authority is that of a king, you will not be diminished in the glory of Yemen.'''
  - 'The two silent tests: ''By God, this is no king'' — and ''By God, this is the humility of prophethood, and not the manner of kings.'''
  - 'The three futures: wealth poured out with no one left to receive it, a woman travelling alone from the village without fear, and the white palaces of Babylon opening.'
  - 'The redefinition of worship: ''Did they not make lawful things forbidden for you, so you forbade them; and make forbidden things lawful for you, so you permitted them? That is your worship of them.'''
  - 'The clause in the covenant that ends the old order: whoever does not call upon God but instead calls upon tribes and clans is to be put to the sword, so that their call is directed to God alone.'
  - 'The description of the men sent to Yemen: ''I have sent you from the righteous of my family — guardians of their religion and repositories of their knowledge.'''
  - 'The charge to Mu''adh: ''Be easy and do not be harsh; give glad tidings and do not drive people away.'''
  - 'The warrant for preferring one transmission over another: ''I am leaving behind two weighty things. If you hold fast to them, you will not go astray: the Book of God and my household. They will not part from each other until they return to me at the Pond.'''
