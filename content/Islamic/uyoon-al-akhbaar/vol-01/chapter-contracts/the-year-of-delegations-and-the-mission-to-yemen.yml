essential_rationale: It carries the covenant to 'Amr ibn Hazm whole — the fullest statement of practice in the volume — together with the letter to Himyar written by Ali, the description of the men sent to Yemen as the righteous of the Prophet's family, and the source's own ruling that where transmissions of the law conflict the narration of the Ahl al-Bayt is the one that binds, warranted by the saying about the two weighty things.
