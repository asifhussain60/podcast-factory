    - Al-Sira al-Nabawiyyah / Sirat Ibn Hisham — the underlying narrative the source follows for the delegations, the letters to Himyar and Zur'ah Dhu Yazan, the covenant to 'Amr ibn Hazm, and the death of Farwah ibn 'Amr al-Judhami
