thesis_relevance: This chapter advances the book's central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents' record, by keeping in the account the report that the Banu Qurayza surrendered only when Ali ibn Abi Talib brought the standard to their walls and swore he would not turn back until the fortress opened or he met the death of Hamza — the act on which the whole arbitration that follows depends.
