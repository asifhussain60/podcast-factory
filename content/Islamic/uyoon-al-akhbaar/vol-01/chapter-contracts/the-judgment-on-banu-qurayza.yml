show_notes:
  blurb: 'What does an army do when it is told, at midday, with its armour already off, that the war it just finished is not finished? The confederates have ridden home in a windstorm; a few hours later the order goes out that nobody is to pray the afternoon prayer anywhere but at the fortresses of the tribe that tore up its treaty during the siege. Twenty-five nights later comes the strangest council in this volume, in which the holder of the tribe''s compact tells his own people that he knows the man outside is a prophet described in their scripture — and is refused three times, on three separate principles, without anyone disputing the claim. Then the surrender, and a judgment delivered not by the Prophet but by an arbiter the condemned themselves accepted: a man carried into the assembly on a donkey because he is dying of an arrow taken at the trench, who binds his own tribe by oath before he speaks and is told, when he has spoken, that he has judged by the judgment of God from above seven heavens. The episode closes six months later on two expeditions that find almost nothing, and on a woman who came home riding a stolen camel she had promised to slaughter.'
