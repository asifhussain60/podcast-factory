title: The Judgment on Banu Qurayza
audience: 'Listeners who have just watched a coalition of ten thousand dissolve outside Medina and now follow what the same army does a few hours later, with its weapons already stacked. No prior knowledge is needed beyond the breaking of the Banu Qurayza''s covenant during the siege. What this episode asks of them is to follow a question of jurisdiction rather than a battle: who is asked to judge, who swears in advance to be bound, and what happens to a ruling once a whole tribe has undertaken to accept whatever it turns out to be.'
angle: faithful_narrative
episode_format: narrative
format_rationale: 'The slice is narrated event: a command delivered at midday, a march, a twenty-five-night siege, a council inside the fortress, a surrender, an arbitration, an execution, a funeral, and two expeditions six months later. The one sustained exchange — Ka''b ibn Asad''s three proposals and his people''s three refusals — is a council inside one party rather than a contest between two named opponents, and it occupies a small share of the chapter, so this is neither debate nor deep_dive.'
host_dynamic: narrator + companion
host_dynamic_rationale: The narrator carries Gabriel's message at midday, the muezzin's call fixing the afternoon prayer at the fortresses, Ali sent ahead with the standard, the twenty-five nights, Ka'b ibn Asad's three options and their refusal, the surrender, Sa'd ibn Mu'adh carried in on a donkey and the ruling he gives, the execution in the market, the death of Sa'd and the trembling of the Throne, and then the marches against the Banu Lahyan and at Dhu Qarad; the companion presses on how the jurisdiction was assembled before the verdict was spoken, and on why the record preserves the losing side's reasoning where it is most creditable to them.
debate: null
host_dynamic_custom: null
length_target: extended
essential: core
essential_rationale: It carries the whole affair of the Banu Qurayza — the command to march, the siege, the three proposals refused inside the fortress, the arbitration of Sa'd ibn Mu'adh and its endorsement as the judgment of God from above seven heavens, and Sa'd's death — together with the ruling on vows given at the close of Dhu Qarad.
key_tensions:
  - A campaign declared over by one side and not by the other. The weapons are stacked and the answer is that the angels have not laid theirs down, because the army has returned only from the direction of the people who sought it out.
  - An order that fixes a place instead of an objective. No one is told the target or the plan; they are told where they will be standing at the afternoon prayer, and everything else follows from that.
  - The standard-bearer wants his commander spared the insult, and is overruled. The Prophet goes forward specifically to hear what was said and answers it himself.
  - A leader who tells his own people he knows the man outside is a prophet described in their scripture — and is refused without anyone disputing the claim.
  - 'Three refusals on three principles that cannot all be kept: fidelity to the Torah''s ruling, love of their own children, and observance of the Sabbath. The smallest concession is the one refused most indignantly.'
  - Intercession converted into arbitration. The condemned ask to be treated as the Banu Qaynuqa' were, and instead of an advocate they are given a judge — drawn from the tribe that had been their own confederates.
  - An oath taken before the verdict. Sa'd binds the Ansar by God and His pledge to accept whatever he says, and only then says it.
  - A ruling lifted out of human authority. It is not called just or sound but the judgment of God from above seven heavens — spoken over a dying man on a borrowed donkey.
  - The judge dies of the wound taken in the siege the broken covenant helped cause. The gates of heaven open, the Throne trembles, and the angels crowd the grave so thickly that the Prophet has to watch his step.
  - 'An expedition that loses its surprise and buys a different result: a column of two hundred walks to within sight of Mecca, sends two riders further, and turns around.'
  - A vow that binds nobody. A woman who escaped captivity on a stolen camel promises to slaughter it in thanks, and is told that a vow made in disobedience is not binding and that no one can pledge what is not theirs.
tone_constraints:
  - Third-person narrative report throughout, matching how the source narrates. Quoted speech appears only where the source supplies it; no dialogue, scene or motive may be invented around it.
  - The poetry of this chapter is among the most damaged in the volume. Every poem is carried at the level of its surviving sense, with the damage named rather than patched. Do not reconstruct a line and do not repair a garbled proper name.
  - Where the source gives two readings it keeps both. The number of those executed is six or seven hundred, with eight to nine hundred named beside it, and neither figure may be resolved or averaged.
  - The reasoning of the besieged is preserved intact, including where it is creditable to them. Ka'b ibn Asad's statement about their own scripture and the three grounds of refusal are reported as the source reports them, without editorial softening in either direction.
  - Footnote apparatus, manuscript sigla, folio marks and edition locators are dropped per the denoise contract; the attributions are preserved in the show-notes references instead. Ibn Hisham's own framing of the report about Ali and the standard is kept, because the report is offered as a variant explanation rather than as the main account.
  - Honorific formulae are not read aloud after every name. The source's repeated blessing formulae are carried by the narration itself, as in the previous episodes of this series.
  - The killing of Ka'b ibn al-Ashraf, the death of Hamza at Uhud, and the loss of the teaching party sent out under safe conduct were all taught earlier in this history. Each appears here only as a one-line callback in fresh words.
  - Never pair the leadership title with the personal name of the Father of Imams. He is named as Ali ibn Abi Talib, or as the Father of Imams, throughout.
anchor_passages:
  - 'Gabriel at midday: ''Have you laid down your weapons, O Muhammad?... The angels have not yet laid down their weapons... I am heading toward them now, and I will shake their strongholds.'''
  - 'The muezzin''s call: ''Hear and obey — no one shall pray the afternoon prayer except at Banu Qurayza.'''
  - 'Ka''b ibn Asad''s first proposal: ''Follow this man and his command, for by God you know that he is a prophet sent to you — he is the one you find described in your scripture'' — and the answer, ''We will never abandon the ruling of the Torah.'''
  - 'Ka''b ibn Asad''s verdict on his own council: ''Not one man among you has had a night''s firm resolve since the day his mother bore him.'''
  - 'The construction of the jurisdiction: ''O community of the Aws — do you agree that a man from among you should rule over them?'' — ''Then let it be Sa''d ibn Mu''adh'' — ''Rise for your master.'''
  - 'Sa''d''s oath and his ruling: ''Do you covenant by God and His pledge to accept my judgment?... I decree that the men be killed, the women and children taken captive, and the property divided.'''
  - 'The endorsement: ''You have judged among them by the judgment of God from above seven heavens.'''
  - 'Ali at the fortresses in Ibn Hisham''s report: ''O battalion of faith, advance — by God, I will not turn back until God opens this for His Messenger, or until I taste what my uncle Hamza tasted.'''
  - 'Huyayy ibn Akhtab before his execution: ''I do not blame myself for having opposed you — but whoever forsakes God shall himself be forsaken.'''
  - 'The death of Sa''d: ''The gates of heaven were opened for Sa''d, and the Throne trembled for him'' — and ''The angels had crowded around him so thickly that I feared being jostled.'''
  - 'The supplication on returning from the Banu Lahyan: ''We are returning, repentant, if God wills... I seek refuge in God from the hardships of travel, from distressing sights along the way, and from finding family and wealth in a bad state.'''
  - 'The ruling on the vow: ''A vow made in disobedience to God is not binding, and you have no right over what is not yours. It is a camel of mine, so return home in the blessing of God.'''
