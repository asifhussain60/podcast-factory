title: Arafah, Mina and the Designation
audience: 'Listeners who arrived with the previous episode at the seventh circuit of the House and were told that a verse had been quoted and then deliberately held back. No prior knowledge is needed beyond that. What this episode asks of them is attention to three very different registers in sequence: a long formal address delivered from a camel''s back and recited here whole, a stretch of procedural instruction about stones and hair and where you sleep, and then a sustained argument about why the last thing proclaimed on the road home had to be proclaimed at all.'
angle: faithful_exposition
episode_format: deep_dive
format_rationale: 'The spine of this slice is one doctrine unfolded layer by layer: that guardianship was sent down in the same summary form as prayer, alms, fasting and the pilgrimage, and therefore had to be demonstrated as those four were demonstrated. The narrative and the rites are the ground the argument is built on, and the final third is the source reasoning in its own voice through al-Baqir''s exposition, Zayd ibn Arqam''s account, al-Sadiq''s version and the author''s closing statement. Al-Hasan al-Basri is named as having suppressed the content of the message, but he never answers — there is no named opposition in dialogue anywhere in the slice — so this is deep_dive rather than debate.'
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: The scholar companion recites the sermon at Arafah whole before any discussion of it, then carries the rites from the departure at sunset to the last night at Mina, and then the designation argument in its own order — the four obligations filled in by demonstration, the verse of conveyance, the shelter at Ghadir Khumm, the raised hand, and the author's closing case; the curious mind presses on why a farewell address spends most of its length cancelling debts, on why a ruling keeps naming a preferred form and then removing the penalty for missing it, and on why a proclamation is extracted as a consequence of a question rather than simply asserted.
