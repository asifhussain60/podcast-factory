thesis_relevance: 'This chapter advances the book''s central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents'' record, by carrying the designation at Ghadir Khumm together with the reasoning the book rests on it: that guardianship was the last obligation sent down, that it arrived in the same summary form as prayer, alms, fasting and pilgrimage and therefore required the same demonstration, and that with its proclamation the religion was declared complete.'
