  section_title: The sermon at Arafah
key_tensions:
  - A farewell address that spends most of its length cancelling claims, and strikes out the speaker's own uncle's lending and his own clan's blood debt first.
  - An adversary who has given up on being worshipped outright and will settle for obedience in whatever you think too small to count.
  - A calendar snapped back to its created shape because a sliding month can make a forbidden thing lawful without anyone breaking a rule.
  - The sermon's sharpest curse falling on a man who claims a father or a guardian that is not his — inside the address that names what the community is to hold onto after him.
  - 'A disclaimer nobody asked for: that this is not family business, and that a messenger''s only duty is to convey.'
  - A tribe's inherited shortcut at the sanctuary abolished by a verse that sends everyone out from the same place.
  - Rites fixed to a whole plain rather than to the spot where one man stood, so that the ground cannot become a scarcity.
  - A preferred form stated with its reason and then the penalty lifted from whoever could not manage it.
  - A prophet described as afraid to deliver the thing he was sent with, and a verse that answers the fear by making non-delivery equivalent to having delivered nothing.
  - A duty imposed in summary form that nobody could identify, argued to require the same demonstration that prayer, alms, fasting and pilgrimage received.
  - A witness who transmits the whole account and admits inside it that when he was later asked in public to stand and confirm it, he stayed seated.
tone_constraints:
  - The Farewell Sermon at Arafah is rendered whole and unbroken, from the opening address to the closing curse and the gloss on obligatory and voluntary acts. It is never summarised, abridged or split, and the discussion of it follows it rather than interrupting it.
  - Third-person narrative report throughout, matching how the source narrates, except where the source itself gives a first-person account — Zayd ibn Arqam at Ghadir Khumm and again at al-Rahbah — which stays in his voice.
  - Arabic technical terms and place names are preserved as the source supplies them — Arafah, Muzdalifah, Mina, al-Abtah, al-Batha', Ghadir Khumm, al-Qaswa, Jamrat al-Aqabah, talbiyah, Ka'bah — with the source's own brief glosses kept where it supplies them.
  - The verses attributed to Hassan ibn Thabit on the day of Ghadir are damaged in this manuscript. They are carried at the level of surviving sense with the damage named — no line reconstructed, no garbled name repaired.
  - Footnote apparatus, manuscript sigla, folio marks, chains of transmission and edition locators are dropped per the denoise contract; the attributions are preserved in the show-notes references instead.
  - Honorific formulae are not read aloud after every name. The source's repeated blessing formulae are carried by the narration itself, as in earlier episodes.
  - The lesser pilgrimage made under the truce, and the martyrdom of Ja'far al-Tayyar, were both taught earlier in this history and appear here only as one-line datings in fresh words, never re-expounded.
  - Never pair the leadership title with the personal name of the Father of Imams. He is named as Ali ibn Abi Talib, as the Father of Imams, or — where the source itself does so — as the Commander of the Faithful.
anchor_passages:
  - 'The opening of the sermon: ''O people, listen to me, for I do not know — I may never meet you again after this year in this place.'''
  - 'What is left behind: ''I have left among you something by which, if you hold fast to it, you will never go astray after me: the Book of God and my family. They will not part from one another until they return to the Basin.'''
  - 'The cancellation applied to the speaker''s own house first: ''God has decreed that there is no usury, and the usury of ''Abbas ibn ''Abd al-Muttalib is all annulled.'''
  - 'The warning about scale: ''Satan despairs of ever being worshipped in this land of yours again, but if he is obeyed in anything less than that, he will be satisfied with what you regard as trifling among your deeds.'''
  - 'The curse on false attachment: ''Whoever claims a father other than his own, or claims a guardian other than his rightful one, the curse of God, of the angels, and of all mankind is upon him.'''
  - 'The disclaimer at Arafah: ''I harbour no fear of my people, nor do I seek refuge in my kinship with them. I am only the Messenger of God — and the Messenger has no duty but to convey clearly'' (chapter 24, verse 54).'
  - 'The instruction on the descent: ''O people, tranquility, tranquility.'''
  - 'The rite fixed to the whole ground: ''All of Arafah is a standing place, all of Muzdalifah is a standing place, and all of Mina is a place of sacrifice.'''
  - 'The share settled by a bowl: ''Whoever has eaten of the broth has eaten of the meat.'''
  - 'The reason a summary duty needed a demonstration: ''God imposed the guardianship upon them, and they did not know what it entailed, so God commanded His Prophet to explain to them what the guardianship is, just as he had explained to them prayer, alms, fasting, pilgrimage and struggle in His way.'''
  - 'The verse of conveyance: ''O Messenger, convey what has been revealed to you from your Lord; and if you do not, then you will not have conveyed His message. And God will protect you from the people'' (chapter 5, verse 67).'
  - 'The question and the transfer at Ghadir Khumm: ''Who has greater claim over you than your own selves?'' — ''Whoever I am his master, Ali is his master. O God, be the guardian of whoever is his guardian, and be the adversary of whoever is his adversary.'''
  - 'The verse of completion: ''Today I have perfected your religion for you and completed My favour upon you, and I have approved Islam as your religion'' (chapter 5, verse 3).'
  - 'The witness against himself: ''As for me, I was among those who suppressed it, and my sight was then gone.'''
