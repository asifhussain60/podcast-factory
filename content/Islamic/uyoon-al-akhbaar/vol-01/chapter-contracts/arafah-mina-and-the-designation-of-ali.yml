show_notes:
  blurb: 'A man tells a crowd of tens of thousands that he does not expect to see them again, and then spends the rest of the hour cancelling debts. What is he actually doing? This episode carries the Farewell Sermon whole — blood and wealth declared as inviolable as the day everyone is standing in, trusts returned, interest wiped out while principal is protected, the vendettas of the old order annulled, and both cancellations applied to the speaker''s own family first. It fixes the calendar back to its created shape, states the rights of wives and husbands in the same sentence, puts inheritance shares beyond the reach of any will, and saves its sharpest curse for a man who claims a father or a guardian not his own. Then the ground between Arafah and Mecca, in the same instructional detail as the rites of consecration: the shortcut of the tribe that owned the sanctuary abolished by a verse, the descent made at a measured pace with a single word repeated to the crowd, the prayers combined at Muzdalifah, the permission given to the weak to leave early, the stoning, the slaughter, the shaving, and the share of the man who brought no animal settled with a taste of broth. And then the thing the whole journey had been carrying. Prayer arrived in outline and was filled in by demonstration; so did alms, fasting and the pilgrimage. Guardianship arrived in exactly that form — so, this history argues, it had to be filled in the same way. It was, in the heat at a watering place eight days after the sacrifice, under a shelter with thorns swept beneath it, with a question the crowd could not answer wrongly and a hand raised high enough that seventy thousand people could see whose it was.'
