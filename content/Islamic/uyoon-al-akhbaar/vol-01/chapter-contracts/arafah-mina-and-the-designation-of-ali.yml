essential_rationale: It carries the Farewell Sermon whole and the account of the designation at Ghadir Khumm with the reasoning the book builds on it — the argument from the four demonstrated obligations, the verse of conveyance, the verse of completion, and the author's own closing statement that this is the clearest evidence for the Imamate.
