show_notes:
  blurb: 'Quraysh spent an evening in its council chamber solving a legal problem rather than a military one: how to kill a man so that no family could ever be charged for it. The answer was one swordsman from every clan. This episode carries what happened that night — the young man who lay down in the marked bed, the handful of dust thrown in the doorway, the men who burst in and stopped because the same arithmetic that made the plot possible made this killing unaffordable, and the two angels who were asked the identical question and hesitated. Then the cave, and the author''s long argument that being there proves nothing, run off a pronoun and off a verse in which the word for companion describes a disbeliever. Then the founding of a town: a camel nobody was allowed to steer, a plot of ground bought from two orphans, a mosque built by hand, two sermons recited here whole that mention neither Mecca nor the migration, a pact with the Jews, the abolition of the blood feud, a register of manufactured brothers ending in a designation, a Persian who converted by testing a prophet with a meal, and a class of people the Prophet governed by their public words while everyone else learned to identify them by a single antipathy.'
