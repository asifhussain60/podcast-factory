  section_title: The first sermons and the brotherhood
essential: core
essential_rationale: It carries the migration itself, the night Ali took the Prophet's place in his bed, the author's argument about what the cave does and does not prove, and the founding acts of the community in Medina — the pacts, the brotherhood, and the designation attached to it — without which nothing in the rest of this volume has a setting.
key_tensions:
  - A killing designed to be uncollectable. The council's whole ingenuity goes not into overcoming his defenders but into spreading the blood-guilt across every clan so that no family could be charged — and the plan is abandoned in the doorway when the same arithmetic, run again on the man they actually find, comes out the other way.
  - A man left behind to return the property of the people trying to kill him. The instruction to Ali is not only to lie in the marked bed but to stay on in a hostile city afterwards and discharge the trusts and debts left with the Prophet for safekeeping — which is why he arrives at Quba' three days late, and why the Prophet waits there rather than going on.
  - The most-cited proof of another man's standing, conceded fact by fact and then denied. The author does not dispute that Abu Bakr was in the cave or that the fear was human; he argues from a singular pronoun and from a verse in which the same word for companion describes a disbeliever, and concludes that the true distinction belongs to the man who slept in the bed.
  - A distinction whose whole value is that it was not earned. Asked for his greatest virtue, Ali chooses the one he had no hand in making — the door left open in the mosque wall — and the Prophet's answer to those who objected is not that Ali deserved it but that he himself did not decide it.
  - A town assembled out of covenants by a man who had just been the target of one clan's evasion of them. A pact with the Jews, peace between the Aws and the Khazraj, the abolition of the pre-Islamic blood feud, and a register of manufactured brothers — and two first sermons that mention neither Mecca nor the migration and price the first act of obedience at half a date.
tone_constraints:
  - Third-person narrative report throughout, matching how the source narrates. Quoted speech appears only where the source supplies it; no dialogue, scene, or motive may be invented around it. Nothing about the night in the bed or the cave beyond what the source states.
  - Both Medinan sermons are recited ALOUD AND WHOLE, word for word as they stand in the chapter, before any discussion of either. They are the episode's set piece and must not be summarized, split, or paraphrased.
  - Honorific formulae are not read aloud after every name. The source's repeated blessing formulae are carried by the narration itself, as in the previous episodes of this series.
  - The verses of Sarmah ibn Abi Anas survive in damaged transmission and are carried at the level of their surviving sense. Do not reconstruct a line and do not repair a garbled name into the one it probably was.
  - The argument about the cave is the author's own and is delivered as argument, not as an aside. It concedes every fact about Abu Bakr's presence; the hosts must not soften it into vagueness, and must not sharpen it into abuse.
  - The two pledges of al-Aqaba, the seasons of presenting the call, and the deaths of Abu Talib and Khadijah were taught in full in earlier episodes. Where they surface here they are callbacks, never a second teaching.
  - Never pair the leadership title with the personal name of the Father of Imams. He is named as Ali ibn Abi Talib throughout.
anchor_passages:
  - 'The council''s method, in the words of the shaykh of Najd: ''Take one man from each clan and arm each with a sword. Let them strike him together as one, so that his blood falls on every branch of Quraysh alike.'''
  - 'What was said to the two angels: ''Neither of you shows the same selfless devotion to his companion that Ali has shown to Muhammad. Go, therefore, and guard him from every harm of My enemy until dawn.'''
  - 'The verse the author turns against the reading of the cave: ''His companion said to him, while he was speaking with him, "Do you disbelieve in the One who created you from dust...?"'' (chapter 18, verses 37 and 38).'
  - The first sermon in Medina, recited whole, from 'O people, send forth provision for yourselves' through 'a good deed is rewarded ten times over — up to seven hundred times over.'
  - The second sermon, recited whole, from 'Praise be to God — we praise Him, seek His help' through 'God is angered when His covenant is broken.'
  - 'The last pairing of the brotherhood: ''This is my brother, my guardian and the fulfilment of my pledge, and my successor after me.'''
  - 'The answer about the doors: ''By God, I did not do this of my own accord — God did it. God revealed to Moses to take a house of purification in which none would dwell except him, Aaron, and his sons.'''
