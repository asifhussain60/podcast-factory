title: The Hijra and Ali's Vigil
audience: 'Listeners who have followed the Meccan years to the point where a town in the north agreed to defend a man it had barely met, and now want to see how he got there and what he built when he arrived. No prior knowledge is assumed beyond the pledges that closed the previous episode. What this episode asks of them is patience with an argument: the author interrupts the narrative twice to reason from the wording of Quranic verses about who deserved what, and the reasoning is worth following closely rather than skipping to the story.'
angle: faithful_narrative
episode_format: narrative
format_rationale: 'The slice is historical exposition organised around events: a council in Mecca, a night of escape, three days in a cave, an arrival, the purchase of a plot and the building of a mosque, two sermons, a set of pacts, and the arrival of Salman al-Farsi. The one stretch of sustained argument — the author''s answer to those who read the cave as proof of Abu Bakr''s standing — is a single voice reasoning against an unnamed party who is never given words of his own, so it is not a contest between named voices and does not qualify as debate; and since the chapter is not one doctrine unfolded layer by layer but a sequence of distinct events, it is not deep_dive either.'
host_dynamic: narrator + companion
host_dynamic_rationale: The narrator carries the council at Dar al-Nadwa, the night of the swords, the journey, the founding of the town, and recites both Medinan sermons whole at the point they fall; the companion presses on the accounting that runs under the whole episode — a murder plan designed so nobody could be charged for it, abandoned in a doorway by the same calculation, and then the vendetta system itself abolished by decree a few weeks later in another town.
