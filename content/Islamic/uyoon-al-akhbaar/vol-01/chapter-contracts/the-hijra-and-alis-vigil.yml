thesis_relevance: This chapter advances the book's central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents' record, by placing Ali's night in the bed at the centre of the migration, arguing directly against the standard reading of the cave, and closing the founding of Medina with the door left open in the mosque wall and the words spoken over the last pairing of the brotherhood.
