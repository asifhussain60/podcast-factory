title: Ta'if and the Pledges of al-Aqaba
audience: 'Listeners who have just watched the Prophet''s protection in Mecca disappear within a single year and now want to see what a man does when the town he was born in is no longer survivable. No prior knowledge is assumed beyond the deaths that closed the previous episode. What this episode asks of them is attention to why the refusals happen: nobody in it says the message is false, and the reasons given for declining it are worth hearing exactly as they were put.'
angle: faithful_narrative
episode_format: narrative
format_rationale: 'The slice is historical exposition organised around events: a failed journey to Ta''if, an encounter at a garden wall, two seasons of presenting the call to Arab tribes, a first meeting with six men of the Khazraj, and the two pledges at al-Aqaba with the appointment of the twelve chieftains. The long exchanges in the middle — Abu Bakr and Daghfal, then the three Shayban delegates — are extended dialogue but not a contest over a proposition: Daghfal disputes standing rather than doctrine, and Mafruq, Hani'' and al-Muthanna each accept the message and decline on grounds of cost, consultation and an existing treaty. No named party argues the opposing side of a discernible claim, so narrative, not debate; and no single doctrine is unfolded layer by layer, so not deep_dive.'
host_dynamic: narrator + companion
host_dynamic_rationale: The narrator carries the journey to Thaqif, recites the supplication at the garden wall whole at the point it falls, and carries the Addas exchange, the two tribal gatherings and both pledges; the companion presses on why every well-reasoned refusal in the episode fails and the one accidental encounter succeeds — a town at war with itself that was looking for an arbiter before it knew it was looking for a prophet.
