  section_title: The wall at Ta'if
essential: core
essential_rationale: It carries the lowest point of the Meccan period and the supplication that came out of it, the whole record of presenting the call to the Arab tribes, and the two pledges of al-Aqaba that make the migration possible — without which the next volume of this history has no city to begin in.
key_tensions:
  - A refusal that would not even grant silence. Asked to support him, Thaqif answered painfully; asked merely to keep the mission quiet so his own people could not use the rejection against him, they refused that too, and set the town's foolish and its slaves on him rather than acting themselves.
  - A supplication that asks for nothing to be fixed. It names weakness, resourcelessness and humiliation, puts the two bad options as a real question, reduces the entire disaster to whether God is angry — and then qualifies even that indifference, admits a preference, and closes by asking for forgiveness rather than rescue.
  - Eloquence achieving nothing and an accident achieving everything. The most knowledgeable genealogist available audits a gathering's standing and is audited back by a man who unknowingly recites the lineage and sacred offices of the person standing silently behind him; the strongest tribe approached praises the message and declines it with a map of the region; and then six men from a town four hundred miles north accept, partly to get ahead of their Jewish neighbours.
  - An offer that is a job rather than a shelter. The Khazraj do not offer refuge; they describe a people among whom the enmity is worse than anywhere and ask that God unite them through him — and a teacher is sent ahead who converts two clan chiefs and their whole household before the man they pledged to has ever entered the town.
tone_constraints:
  - Third-person narrative report throughout, matching how the source narrates. Quoted speech appears only where the source supplies it; no dialogue, scene, or motive may be invented around it. In particular, nothing about the Prophet's physical condition at the garden wall beyond what the source states.
  - The supplication at the wall of the garden is recited ALOUD AND WHOLE, word for word as it stands in the chapter, before any discussion of it. It is the episode's set piece and must not be summarized, split, or paraphrased.
  - Honorific formulae are not read aloud after every name. The source's repeated blessing formulae are carried by the narration itself, as in the previous episodes of this series.
  - Ka'b ibn Malik's poem on the chieftains survives in damaged transmission and is carried at the level of its surviving sense. Do not reconstruct a line and do not repair a garbled name into the one it probably was.
  - The long genealogical chains attached to the six Khazrajis, the twelve of the first pledge and the twelve chieftains are compressed to name and clan. Every named man in the source is named here; the ancestor chains behind each name are not read aloud.
  - Qusay the Gatherer, Hashim feeding the pilgrims and the offices of the sanctuary were taught in full in earlier episodes. In Daghfal's interrogation they are a callback and a piece of dramatic irony, never a second teaching.
  - Never pair the leadership title with the personal name of the Father of Imams. He is named as Ali ibn Abi Talib throughout.
anchor_passages:
  - The supplication at the garden wall, recited whole, from 'O God, to You I complain of my weakness' through 'There is no power except in You.'
  - 'The recognition at Nineveh: ''From the village of the righteous man Yunus ibn Matta?'' — ''And what do you know of Yunus ibn Matta?'' — ''He is my brother — he was a prophet, and I am a prophet.'''
  - 'Hani'' ibn Qabisah''s refusal: ''For us to abandon our religion and embrace yours in a single sitting — a sitting in which you have not fully set out your case — and without seeing what the outcome of what you invite us to will bring, would be a slip of judgment, a hasty conclusion, and a misfortune for those behind us.'''
  - 'Al-Muthanna''s two streams, and the conditional aid he offers after them: ''We went down there under a covenant we made with Khusraw: we cause no disturbance and we take no independent action.'''
  - 'The Khazraj asking for an arbiter: ''We have left behind a people among whom there is no greater evil and enmity than that which exists between them. May God unite them through you.'''
  - 'The terms of the second pledge and al-Bara''s enlargement of them: ''I take your pledge on the condition that you protect me from what you protect your women and children.'' — ''We will protect you from all that we protect ourselves from.'''
