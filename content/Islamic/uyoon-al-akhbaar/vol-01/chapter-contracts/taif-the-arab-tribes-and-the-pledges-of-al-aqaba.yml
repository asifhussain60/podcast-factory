show_notes:
  blurb: 'The week after the two people who made his life survivable were buried, the Prophet left Mecca to look for a replacement — and came home worse off than he set out, with a mob at his back and exactly one adherent, a Christian slave who was told by his owners to stay where he was. This episode carries the journey to Ta''if, the refusal of even the small request that the mission be kept quiet, and the supplication he made against a stranger''s garden wall, recited here whole: a prayer that asks for no punishment, no rescue and no easier road, and reduces the entire disaster to a single question. Then the seasons of presenting the call to the Arab tribes — a genealogist''s audit turned around by a man who unknowingly recites the ancestry of the person he has not been introduced to, and a delegation of Shayban that praises the message as the noblest of character and then explains, with a map, exactly which half of its territory is free to risk. And finally al-Aqaba, where six men from a town tearing itself apart accepted him partly to get ahead of their neighbours, asked him to unite a people at war with itself, and set in motion the two pledges and the twelve named guarantors that gave him somewhere to go.'
