thesis_relevance: This chapter advances the book's central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents' record, by transmitting the whole account of the tribal seasons on the authority of Ali ibn Abi Talib, who was ordered to accompany the Prophet and who reports what was said to him privately at the end of it — and by placing him and the Prophet's two uncles at the pledge that secured the community a city.
