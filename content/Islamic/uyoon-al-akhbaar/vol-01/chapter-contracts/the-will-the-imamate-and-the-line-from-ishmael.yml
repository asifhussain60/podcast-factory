  thesis_relevance: 'This chapter advances the book''s central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents'' record, by supplying the two arguments the rest of the work assumes: that guidance descends only by designation, and that the lineage it descended through was prepared and kept rather than incidental.'
