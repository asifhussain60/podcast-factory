show_notes:
  blurb: 'The author of this seven-part history speaks for himself for the first time, and he does not begin with the Prophet''s birth. He begins with two arguments. The first is that God has never sent a prophet without also appointing the one who carries what he brought, and that sealing prophethood ended the sending rather than the need — so the leadership of the community was never the community''s to arrange. His sharpest proof is the smallest rule he could have chosen: a Prophet who forbade any believer to let two nights pass without a written will did not leave the community itself without one. The second argument answers a charge laid against the Prophet''s forefathers, that they were idolaters. Working only from premises his opponents accept — that the Prophet called his ancestry noble, that he defined nobility as piety, that the Qur''an calls idolaters impure — the author concludes that the line he came through was not idolatrous, while granting that idolaters lived among it and that some of the faithful kept their belief unspoken, as a believer in Pharaoh''s household did. The episode closes by walking the descent itself: Abraham''s division of his household, Ishmael settled at the Sacred House, Jacob recognising the light of prophethood in a young cousin''s face, Adnan in the age of Moses, and the northern Arab branches narrowing to the tribe of Quraysh — with a philosopher''s verdict, quoted at length, that Quraysh spoke the clearest Arabic any of the tribes had.'
