title: The Final Moments and the Elegies
audience: 'Listeners who arrived with the previous episode at a room where writing materials were called for and never brought. No prior knowledge is needed beyond that. What this episode asks of them is a tolerance for three very different textures in sequence: a crowded sickroom of small physical arrangements, a stretch of procedure recorded with the flatness of a manual because it is establishing the law of every Muslim funeral, and then poetry that reaches this manuscript in pieces and is carried at the level of surviving sense.'
angle: faithful_narrative
episode_format: narrative
format_rationale: 'The slice is narrated event and reported speech from the first line to the last: the grandchildren carried in, an address delivered from the pulpit, a companion displaced at the bedside, a question about guardians answered, the death itself, then the washing, the shrouding, the funeral prayer and the grave, and finally an address at the graveside and four elegies. The one passage that reasons rather than narrates — the objection that the gathering at the hall of the Bani Sa''idah was held in the wrong place, at the wrong hour and without the family — is a single unopposed statement that the history expressly defers to its next volume. No named party answers back anywhere in the slice, so this is narrative rather than debate.'
host_dynamic: narrator + companion
host_dynamic_rationale: The narrator carries the sequence in the order the source gives it — the last conversations and the death, then the washing, the shrouding, the contested choice of grave and the burial, then the address at the graveside recited whole and the four damaged elegies; the companion presses on why a dying man tells his own aunt and daughter in public that he can spare them nothing, on why the washing and the shroud are recorded with the precision of a manual rather than as a scene, and on why a volume that has just spent an episode assembling proofs chooses to end on broken poetry about a mosque quarter and a damp grave.
