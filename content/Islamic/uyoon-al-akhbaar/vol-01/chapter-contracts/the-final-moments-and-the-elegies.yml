essential: core
essential_rationale: It carries the death itself with the charge given at it, the washing, shrouding and burial as the source narrates them and as the law it derives from them, the history's objection to the gathering at the hall of the Bani Sa'idah, and the address at the graveside in which the guardian states his claims in his own words.
sermon:
  present: true
  section_title: What was said over him
key_tensions:
  - A dying man who tells his own aunt and his own daughter, by name and in public, that he cannot spare them anything before God.
  - An authority narrowed to nothing by its holder — permitting only what the Book permits, forbidding only what it forbids — in the same address.
  - A companion holding the Prophet up who is told to make room, in the language of a better claim, over the use of a chest to lean on.
  - A teaching about how to seal a life, dictated by a man sealing his own, whose five routes are all deliberately small enough to reach.
  - A question that assumes every prophet has a guardian and asks only for the name.
  - A last instruction that is not a doctrine or a title but a responsibility for a people, repeated three times.
  - A succession settled in a meeting hall while the people with the strongest claim to attend were washing the body.
  - A funeral recorded twice over — as the account of one burial and as the specification for every burial after it.
  - A washer permitted to look and touch, and a second man required for the work and present with his eyes covered under a warning.
  - A proposal that would have made the funeral itself a demonstration of who was in charge, answered with a precedent about prophets rather than a rival claim.
  - 'An arrangement that dissolves the office it was asked to fill: ten mourners at a time, a doorway, and nobody at the front.'
  - A graveside address that states its claims in ascending order of controversy and then asks for nothing at all.
  - Four elegies that survive only in fragments, and whose surviving subject is not doctrine but places, furniture and a manner of leading people.
tone_constraints:
  - The address delivered at the graveside, reported by Abu Rafi', is this episode's formal address under R-SERMON-VERBATIM. It is rendered whole and unbroken, from the praise of God and the blessing on the Prophet to the closing instruction to fear God, and the discussion of it follows it rather than interrupting it.
  - Third-person narrative report throughout, matching how the source narrates, except where the source itself gives a first-person account — Abu Dharr at the bedside, Salman al-Farsi's question, the two reports of the death from Ali, and the washer's own account of the washing — which stay in their own voices.
  - Arabic technical terms, titles and place names are preserved as the source supplies them — Baqi' al-Gharqad, Bani Sa'idah, al-Baqi', Banu al-Najjar — with the source's own glosses kept where it supplies them, including its explanation of the niche cut into the side of the grave.
  - The four elegies of Hassan ibn Thabit are damaged in this manuscript. They are carried at the level of surviving sense with the damage named — no line reconstructed, no garbled name repaired — the same discipline used for the poetry of Badr, Uhud, Mu'tah and the day of the designation earlier in this volume.
  - The copyist's colophons that close the manuscript — the dates of completion, the scribe's name and his dedication — are book-object provenance and are dropped per the denoise contract; the episode notes only that the volume ends with the poetry.
  - Footnote apparatus, manuscript sigla, folio marks, chains of transmission and edition locators are dropped per the denoise contract; the attributions are preserved in the show-notes references instead.
  - Honorific formulae are not read aloud after every name. The source's repeated blessing formulae are carried by the narration itself, as in earlier episodes.
  - Quranic quotations are given as English translation with the reference in plain English, following the practice of every earlier episode in this volume; no Arabic script or transliterated formula is carried in the chapter text.
  - Never pair the leadership title with the personal name of the Father of Imams. He is named as Ali ibn Abi Talib, as the Father of Imams, or — where the source itself does so — as the Commander of the Faithful.
anchor_passages:
  - 'The word spoken after the faint: ''Let them take pleasure in me and I in them — though my passing will weigh heavily on them.'''
  - 'The withdrawal of privilege from the pulpit: ''O people, do not cling to me. I make lawful only what God has made lawful in the Quran, and I forbid only what the Quran has forbidden.'''
  - 'The limit set on kinship, by name: ''O Safiyyah bint ''Abd al-Muttalib, aunt of the Messenger of God; O Fatimah bint Muhammad — work for what is with God, for I cannot spare you anything from God.'''
  - 'The displacement at the bedside: ''Rise, O Abu Dharr — Ali has more right to this than you.'''
  - 'The contract on final moments: ''whoever seals his final moments with the testimony that there is no god but God will enter Paradise'' — through to struggle in the way of God ''even if it amounts to no more than a brief moment.'''
  - 'Salman''s question and its answer: ''every prophet has had a guardian — who is yours?'' — ''My guardian, my confidant, and my successor over my family... is Ali ibn Abi Talib.'''
  - 'The last charge, given three times: ''O Ali, I commend the Arabs to your good care'' — ''and then he breathed his last in my arms.'''
  - 'The consolation heard from an unseen speaker: ''In God there is consolation for every calamity, and a successor to every perishing thing'' (chapter 3, verse 185).'
  - 'The instruction about the washing: ''Gabriel will be with you to wash him'' — and ''tell him to cover his eyes, for no one who looks upon my nakedness except you will retain his sight.'''
  - 'The voice heard during the washing: ''Do not remove his shirt'' — and later, ''Do not tire yourself.'''
  - 'The precedent that settled the grave: ''the Messenger of God was a living and present Imam, and no prophet has ever been taken except that he was buried in the very place where he died.'''
  - 'The opening of the graveside address: ''I am the cousin of the Messenger of God — no one can say this truthfully but me.'''
  - 'Its close: ''We are the People of the House of Mercy, through whom God guided you out of error and gave sight to your blindness. So fear God, that He may preserve His grace upon you.'''
  - 'The surviving close of the first elegy: that this is a catastrophe, and that Ahmad has departed.'
  - 'The direct address that survives in the third elegy: ''O best of those who ever trod on pebbles, do not depart.'''
