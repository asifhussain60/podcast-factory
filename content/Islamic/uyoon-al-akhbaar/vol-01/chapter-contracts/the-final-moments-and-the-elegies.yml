thesis_relevance: 'This chapter advances the book''s central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents'' record, by closing the volume on the succession as the household itself narrates it: the last charge given and the death received in the guardian''s arms, the funeral performed by him while the caliphate was being settled elsewhere, and the claims he stated in his own words over the grave.'
