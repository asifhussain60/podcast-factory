show_notes:
  blurb: 'While the succession was being settled in a meeting hall on the other side of the city, where was his cousin? Washing the body. This history reports the two events inside a single sentence, and much of this episode depends on taking that sentence literally. It carries the last hours as a series of small physical arrangements, each of which is doing something: two grandchildren carried in and lifted away again when he loses consciousness; an address from the pulpit that narrows his own authority to nothing and then, in the same breath, tells his aunt and his daughter by name that he can spare them nothing before God; a companion propping him up who is told to make room in the language of a better claim; a list of five reachable ways to finish a life, dictated by a man finishing his own; a question that assumes every prophet has a guardian and asks only for the name; and a responsibility for a whole people commended three times before he dies against the man he commends it to. Then the procedural middle, recorded with the flatness of a manual because it is establishing the law of every Muslim funeral: three washings in a fixed order with named preparations, in a shirt that a voice forbade removing, by one man permitted to look and another present with his eyes covered; three garments for the shroud; a proposal to bury him in the public cemetery with one man leading the prayer over him, answered with a precedent about prophets rather than a rival claim, and an arrangement that dissolves the office the proposal would have created — ten mourners at a time, a doorway, and nobody at the front; a recess cut on the side facing the direction of prayer, palm fronds laid because the ground was damp, and a quarter of the grave filled. And then speech: an address at the graveside that states its claims in ascending order of controversy and closes by asking for nothing, and four elegies by the poet who had defended him in verse for twenty years — all of which reach us in pieces, and which turn out to be about the quarter of the mosque, the pulpit, the worn chambers, the damp grave, an eye that will not close, and a way of leading people that consisted mainly of not making things hard for them.'
