thesis_relevance: This chapter advances the book's central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents' record, by defending Abu Talib — the protector on whom the entire mission depended — against the charge that he died outside the faith, and by placing the community's own witness to the Prophet's signs in the mouth of the Father of Imams rather than in the reports of those who opposed him.
