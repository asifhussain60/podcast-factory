title: The Open Call and Its Cost
audience: Listeners who have followed a religion of three people praying in the ravines outside Mecca and now want to know what happened the day it was announced in public. No prior knowledge is assumed beyond the household and the designation established in the previous episode. What this episode asks of them is attention to a single recurring situation — a person is given evidence, and then has to decide what to do with it — as it plays out with an uncle who will not convert, a chief who cannot find an honest accusation, and a crowd watching a tree move.
angle: faithful_narrative
episode_format: narrative
format_rationale: 'The slice is historical exposition organised around events: a command to proclaim openly, three successive Quraysh delegations to Abu Talib, a pre-pilgrimage strategy meeting run by al-Walid ibn al-Mughirah, several poems, a narrated sign, and an assault that failed. The one exchange that looks like a contest — al-Walid''s four-round elimination of soothsayer, madman, poet and sorcerer — is a single meeting inside a much longer narrative and voices no sustained named opposition arguing a proposition across the chapter; the Quraysh delegations put demands rather than arguments. So narrative, not debate, and not deep_dive: no single doctrine is unfolded layer by layer here, and the one doctrinal passage (Abu Talib''s concealed faith) is the author''s own commentary landing an event sequence.'
host_dynamic: narrator + companion
host_dynamic_rationale: The narrator carries the escalation through the three delegations and recites the sermon of the Commander of the Faithful whole at the point it falls; the companion presses on what each party does after it has already seen enough — an uncle who calls the new religion the finest of religions and still refuses it, a chief who demolishes every available accusation and then assembles one anyway, and a crowd that calls a moving tree sorcery while it is still moving.
