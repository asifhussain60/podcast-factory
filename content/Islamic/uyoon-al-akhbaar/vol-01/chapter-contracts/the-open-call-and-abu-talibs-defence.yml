show_notes:
  blurb: 'The leaders of Mecca once held a meeting to agree on a single word for what Muhammad was doing — and their own chairman threw out every word the language gave them. He had seen soothsayers, and it was not that. He had seen madness, and it was not that. He knew every metre of poetry, and it was not poetry. He knew sorcerers, and it was not sorcery. Then he built a charge anyway, out of the one thing he could not deny: that this was splitting families apart. This episode covers the day the call went public and everything Mecca tried in response. Three delegations went to Abu Talib — one with a complaint, one threatening war until one side was destroyed, and one offering him the finest young man in Quraysh as a replacement son if he would hand his nephew over. He refused all three, wrote poems that spread across Arabia reminding the tribes what the sanctuary was for, and went on saying in public that he did not follow the religion — which the author argues was precisely what kept it alive. The episode closes with a sermon of the Commander of the Faithful, recited whole, describing a tree that was called and came, a crowd that had agreed the terms in advance, and what they said when it happened.'
