  section_title: The tree and the sealed hearts
essential: core
essential_rationale: It carries the transition from private religion to public proclamation, the full escalation of Quraysh pressure on the Prophet's protector, and the author's central doctrinal argument about Abu Talib — that the concealment of his faith was the condition on which the religion survived.
key_tensions:
  - 'A protector who does not share the religion. Abu Talib refuses to convert in public, testifies in verse that the religion is the finest of religions and that only fear of reproach keeps him from following it, and pays for the protection out of his own standing. The author argues this was not weakness but the only arrangement in which the mission survived: a convert could be persecuted like any other convert, while a chief of Hashim who had not converted could forbid the whole of Quraysh.'
  - An accusation that its own author knows to be false. Al-Walid ibn al-Mughirah convenes Quraysh to agree one story before the pilgrimage season, rejects soothsayer, madman, poet and sorcerer on the grounds that they are experienced men who know what each of those looks like, concedes that the speech is sweet — and then builds a usable charge out of the one fact he cannot deny. The Qur'an answers by describing the deliberation step by step.
  - Evidence that changes nothing. The sign is requested on stated terms, with both verdicts named and consent given in advance; it is granted with the outcome announced beforehand; the crowd calls it sorcery before it stops moving, runs it twice more on their own terms, and then attacks the single witness rather than the testimony. The same failure recurs with the scholars of the older scriptures and with the man who dropped the stone.
tone_constraints:
  - Third-person narrative report throughout, matching how the source narrates. Quoted speech appears only where the source supplies it; no dialogue, scene, or motive may be invented around it.
  - The sermon of the Commander of the Faithful is recited ALOUD AND WHOLE, word for word as it stands in the chapter, before any discussion of it. It is the episode's set piece and must not be summarized, split, or paraphrased.
  - Never pair the leadership title with the personal name of the Father of Imams. In the sermon section he is named only as the Commander of the Faithful; elsewhere in the series he is Ali ibn Abi Talib. The two forms are never placed together.
  - Honorific formulae are not read aloud after every name. The source's repeated blessing formulae are carried by the narration itself, as in the previous episodes of this series.
  - Abu Talib's poems in this slice — the rebuke of Banu 'Abd Manaf, the rally to Hashim, the open declaration, the praise poem, the long sanctuary poem, the warning about Thamud and 'Ad — survive in damaged transmission and are carried at the level of their surviving sense. Do not reconstruct a line and do not repair a garbled name into the one it probably was. The same applies to the poem of Abu Qays ibn al-Aslat.
  - Quranic quotations carry their reference in plain English as (chapter N, verse M); the passage revealed concerning al-Walid ibn al-Mughirah is given in English translation only, with its range stated in words. The source supplies that passage in Arabic script alone with no translation, so the accurate English rendering stands in the chapter and no transliteration run is paired with it.
anchor_passages:
  - 'The answer to the threat of war: ''O uncle, if you wish, do not be overwhelmed. But I, by God — even if they placed the sun on my right hand and the moon on my left — I would not abandon this matter until God caused it to prevail or I perished in its pursuit.'''
  - 'Al-Walid ibn al-Mughirah''s settlement after rejecting every accusation: ''By God, his speech is sweet — and none of what you have said fits it. The closest thing you can say is this: he is a sorcerer who has come with a magic that divides a man from his father, from his wife, and from his brother and his clan.'''
  - The sermon of the Commander of the Faithful, recited whole, from 'I was with him when the Quraysh came to him' through the closing description of the righteous whose hearts are tender and whose bodies are at work.
  - 'Abu Talib''s refusal of the exchange offered for his nephew: ''By God, what a terrible bargain you offer me — that you give me your son to clothe and feed, while I hand over my son to be killed! That, by God, will never happen.'''
