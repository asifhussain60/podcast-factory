title: The Year of the Elephant
audience: 'Listeners who have followed the descent down to a single Meccan household and now want the household itself — four men across roughly a century and a half, ending in the year the Prophet was born. No prior knowledge of pre-Islamic Mecca is assumed. What the episode asks of them is attention to an office rather than a doctrine: who held the keys of the Sacred House, how they got them, what they were obliged to do with them, and what happened when an army arrived to demolish the building they were charged with.'
angle: faithful_narrative
episode_format: narrative
format_rationale: 'The slice is pure historical and biographical exposition: a childhood exile and return, a purchase, a war, an administrative settlement, a clan standoff, an annual address, a trade compact, a naming accident, an invasion, and a deliverance. Nobody argues a proposition against anybody. The one doctrinal element — the tradition of the creation divided into parts, which the author places under Hashim as his warrant for that lineage — is asserted, not contested, and no named party replies to it. There is no opposing voice and nothing to adjudicate, so this is narrative rather than debate or deep_dive.'
host_dynamic: narrator + companion
host_dynamic_rationale: The narrator carries the chronology of the four lives in order — Qusay, 'Abd Manaf, Hashim, 'Abd al-Muttalib — reciting Hashim's annual address whole at the point it falls; the companion stops the narration where the record is stranger than it looks (a key sold for a wineskin and then presented as a clean restoration, a grandfather permanently named for being mistaken as a slave, a custodian who asks for his camels and not for the House) and draws out what the author is claiming through each of them.
