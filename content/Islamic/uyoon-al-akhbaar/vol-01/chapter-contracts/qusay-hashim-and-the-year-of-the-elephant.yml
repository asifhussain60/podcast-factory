  thesis_relevance: This chapter advances the book's central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents' record, by showing the four generations immediately before the Prophet holding the custody of the Sacred House as an inherited charge kept in Abraham's terms — and by ending in the year that custody was vindicated and the Prophet was born.
