show_notes:
  blurb: 'The custody of the holiest building in Arabia changed hands for a skin of wine, and this episode follows what the family that acquired it did with the office over four generations. Qusay was carried out of Mecca as a small child and named for the distance; he came back with a pilgrim caravan, bought the key of the Ka''bah from its custodian, fought a war to keep it when his own tribe hesitated, and then built the institution — doorkeeping, watering, provisioning, a council house with its door facing the shrine, and a town divided into quarters. His grandson Hashim, remembered under a nickname meaning ''the breaker'' because he was the first to crumble bread into broth for the pilgrims, stood once a year with his back to the Ka''bah and told the Quraysh that their honour was a function of their nearness to something not their own — then refused, in advance, any contribution that came from an unjust taking. He also rode to the Levant, talked a Byzantine emperor into a letter of safe passage, and turned every tribe on the road home from a predator into an investor. The episode closes with his son ''Abd al-Muttalib: named for an uncle''s evasive answer at the edge of town, blind in old age, and the one man who would not leave Mecca when an Abyssinian army arrived to demolish the House. Asked why he was petitioning for his camels rather than for the building, he drew a line between what was his and what was not — and that same year, the Year of the Elephant, the Prophet was born.'
