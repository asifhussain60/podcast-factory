  section_title: Hashim's charge to Quraysh
essential: core
essential_rationale: It delivers the custodial office, the clan map, and the Year of the Elephant — the three things the Prophet's birth narrative in the next episodes lands directly on top of.
key_tensions:
  - A holy trust acquired by a squalid transaction. The key of the Ka'bah was bought for a skin of wine, contested by a woman who said it had been pledged and not sold, and settled by a war fought largely by a northern tribe rather than by Quraysh — and the author presents the outcome as an inheritance cleanly restored to the line it belonged to. The hosts should hold both descriptions at once rather than choosing one.
  - Generosity with a gate on it. Hashim raises money to feed pilgrims and, in the same address, refuses in advance any contribution that came from a severed kinship tie or an unjust taking — including his own. It would have raised more to ask fewer questions, and the conditions are the point.
  - A custodian who declines to defend what he guards. Asked why he petitions for camels while the House is about to be demolished, 'Abd al-Muttalib answers that the camels are his and the House has a Lord. It sounds like indifference and is a claim about the limits of his own office; the hosts should let it sound wrong first.
tone_constraints:
  - Third-person narrative report throughout, matching how the source narrates. Quoted speech appears only where the source supplies it, and no dialogue, motive, or scene may be invented around it.
  - Hashim's address to the Quraysh is recited ALOUD AND WHOLE, both paragraphs, word for word as it stands in the chapter, before any discussion of it. It is the episode's set piece and must not be summarized, split, or paraphrased.
  - Much of the verse in this slice survives only in fragmentary form. It is paraphrased in the chapter rather than quoted, and it must stay that way — do not reconstruct a line, and do not repair a garbled name into the one it probably was.
  - Never pair the leadership title with the personal name of the Father of Imams. In the tradition of the four sleeping men, the angel's designation is given as the master of the guardians, exactly as the source has it.
  - Quranic quotations carry their reference in plain English as (chapter N, verse M). Arabic terms stay in the transliterated forms used here; this slice supplies no Arabic script for any term, so none is to be added. Established English names are used for Abraham, Ishmael, Gabriel, and Mecca; every other name stays as transliterated.
anchor_passages:
  - 'Qusay presenting the purchased key to his people: ''This is the key of your father Ishmael, which Allah has returned to you without injustice or treachery.'''
  - Hashim's annual address, recited whole, from 'O gathering of Quraysh, you are the masters of the Arabs' through the condition on every gift — that nothing unjustly taken and no severed kinship tie may be mixed into it.
  - '''Abd al-Muttalib refusing to leave the emptied city: ''By Allah, I shall not abandon the Haram. I seek no glory elsewhere.'''
  - 'The exchange in Abraha''s tent: ''Those camels are mine, and I am their owner. As for the House, it has a Lord who will protect it from you if He wills.'''
