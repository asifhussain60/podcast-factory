title: Khaybar and the Day of Ali
audience: Listeners who have followed this community from a truce that conceded almost everything to an army marching north two months later against the strongest fortress complex in the Hijaz. No prior knowledge is needed beyond al- Hudaybiyah. What this episode asks of them is to weigh a conquest whose commander was announced the night before by four properties and not by his name, and then to weigh the address spoken over him afterwards — an address that opens by naming a word deliberately not said.
angle: faithful_narrative
episode_format: narrative
format_rationale: 'The slice is narrated event throughout: a march with its halting places, a rajaz-chanter''s death and the doubt about it, three banners issued, a single combat, a gate torn out, the taking of the fortresses, a poisoned meal, a contract over the produce of the land, a licensed deception carried out in Mecca, a pilgrimage performed at a trot, and the dispatch and destruction of an army at Mu''tah. The one sustained monologue — the address to Ali at the gate — is a formal address delivered without a reply, not a contest over a proposition, so this is neither debate nor deep_dive.'
host_dynamic: narrator + companion
host_dynamic_rationale: The narrator carries the march from Medina, 'Amir ibn al-Akwa's death and the ruling that settled it, the supplication said over every settlement, the two banners returned without victory and the third given with a promise, Marhab and the door used as a shield, Ali's own first-person account, the address at the gate and the prostration that answered it, the prohibitions and the sermon, the poisoned foreleg, al-Hajjaj ibn 'Ilat's ruse in Mecca, the Umrah of the fulfilment, and then the three commanders at Mu'tah; the companion presses on why the naming was withheld a night, on why a word was refused rather than spoken, and on what it means to appoint three commanders in sequence before an army has left.
