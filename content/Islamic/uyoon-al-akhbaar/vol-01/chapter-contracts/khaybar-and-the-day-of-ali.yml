    - Al-Sira al-Nabawiyyah / Sirat Ibn Hisham — the underlying narrative the source follows for the march, the halting places, Marhab, the poisoned sheep, the affair of al-Hajjaj ibn 'Ilat, the Umrah of the fulfilment and the battle of Mu'tah
    - Sharh al-Akhbar of al-Qadi al-Nu'man, Manaqib Amir al-Mu'minin, and Manaqib Ali of Ibn al-Maghazali — cited by the source for Ali's own account of Khaybar and for the address delivered to him at the gate
    - Mu'jam al-Buldan — cited by the source for the halting places on the road to Khaybar
    - The Quran, chapter 48 verse 27 — the verse the source attaches to the Umrah of the fulfilment, identifying the near victory as Khaybar
thesis_relevance: This chapter advances the book's central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents' record, by carrying whole the address delivered at the gate of Khaybar — the Aaron-and-Moses standing, the place at the basin held as successor, the four clauses equating the man addressed with the man speaking, and the closing statement that without him the believers would not have recognised the Messenger after him.
