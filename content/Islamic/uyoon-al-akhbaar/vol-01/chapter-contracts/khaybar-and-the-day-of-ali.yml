show_notes:
  blurb: 'What does it mean that the man who opened Khaybar was the third man sent to open it? Two months after a truce that conceded almost everything, an army marches north against the strongest fortress complex in the Hijaz — and the banner is issued twice and returned twice before it is issued a third time, the night before, to a man described by four properties whose name is withheld. What follows is a challenge answered in two lines, a fortress gate torn out and used as a shield, eight men who cannot afterwards lift it, and then an address spoken over the man holding it that begins by naming a word deliberately not said, because a party of the community would misuse it. Then the reckoning: five prohibitions preached over a camp that has just become rich, a contract for half the produce of Fadak, a roasted foreleg that carried poison and a woman who explains her own experiment to the man she poisoned, a Muslim who lies to Quraysh with permission and walks out with their money, and a verse revealed a year later that looks back and calls all of it a near victory. And then Mu''tah, where the chain of command was announced as a chain of deaths before the army left Medina, and ran to the end of its length exactly as announced.'
