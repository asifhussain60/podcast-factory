  section_title: Abu Talib's marriage address
essential: core
essential_rationale: It carries the outside recognitions of the prophethood before it was claimed, the marriage that produced the Prophet's household, and the designation of Ali ibn Abi Talib as brother, guardian, minister and heir — the event the entire volume has been building toward.
key_tensions:
  - Recognition that arrives as a warning. Bahira breaks a years-long practice of ignoring the Meccan caravans, identifies the boy in one look, and then tells Abu Talib to take him home because others can read the same signs. Every person in this episode who works out what the boy is tries to get hold of him, protect him, marry him, or kill him; nobody stays neutral.
  - A proposal that runs one way and a ceremony that runs the other. Khadijah identifies him, sends word, and offers herself in marriage; the contract is then conducted by his uncle before the notables of Quraysh as a public declaration of his worth, with an open admission that he has no money and the dowry is coming, deferred, out of the uncle's estate. The author records both directions without treating either as a concession.
  - An uncle who will not convert and will not let his sons stay out. Abu Talib declines the religion in one sentence, guarantees unlimited protection in the next, instructs Ali to follow and never forsake him, and later sends Ja'far to join the prayer — building the first congregational row out of his own children while standing outside it himself.
tone_constraints:
  - Third-person narrative report throughout, matching how the source narrates. Quoted speech appears only where the source supplies it; no dialogue, scene, or motive may be invented around it.
  - Abu Talib's marriage address is recited ALOUD AND WHOLE, both paragraphs, word for word as it stands in the chapter, before any discussion of it. It is the episode's set piece and must not be summarized, split, or paraphrased.
  - Honorific formulae are not read aloud after every name. The source's repeated blessing formulae are carried by the narration itself, as in the previous episodes of this series.
  - The verse in this slice — Abu Talib's three poems on the journey to Busra and Waraqah's lines — survives in fragments and is paraphrased at the level of its surviving sense. Do not reconstruct a line and do not repair a garbled name into the one it probably was.
  - Never pair the leadership title with the personal name of the Father of Imams. He is named as Ali ibn Abi Talib, or as Ali, exactly as the source has it, and the designation he receives is given in the source's own four terms — brother, guardian, minister, heir.
  - Quranic quotations carry their reference in plain English as (chapter N, verse M). The verse on those who bear the Throne is quoted without a reference, because the surah name reaches the refined English in a corrupted form and no reference is to be invented. This slice supplies no Arabic script for any term, so none is to be added; transliterated forms stay as they are.
anchor_passages:
  - 'Bahira, privately, to Abu Talib: ''This is the affair of your nephew — he will be a prophet, and this is his time. His sign is clear and his proof established. Beware of the Jews on his account, and return — out of love for him — to your land, for I fear for him from them.'''
  - Abu Talib's marriage address, recited whole, from 'Praise be to Allah, who made us the descendants of Abraham' through the closing prediction that after this he shall have great standing and momentous affairs.
  - 'Abu Talib''s answer to the invitation: ''As for abandoning what I follow, I find no way to do that. But as for supporting you — by Allah, no one shall harm you with something you hate, as long as I remain.'''
  - 'The proposition put to Banu ''Abd al-Muttalib and the answer to it: ''So which of you will be my brother, my guardian, my minister, and my heir?'' — ''Yes, I am, O Messenger of Allah.'' — ''Yes, you are my brother, my guardian, my minister, and my heir. Listen to him and obey him.'''
