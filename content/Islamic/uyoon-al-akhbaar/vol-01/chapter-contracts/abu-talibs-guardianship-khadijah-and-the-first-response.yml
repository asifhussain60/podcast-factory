  thesis_relevance: This chapter advances the book's central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents' record, by carrying the narrative to the designation itself — the Prophet naming Ali ibn Abi Talib his brother, guardian, minister and heir before forty men of his own clan — and by defending, on the Qur'an's own terms, the early faith that the objectors of a later age tried to disqualify.
