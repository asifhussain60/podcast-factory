show_notes:
  blurb: 'A monk on the Syrian road had let Meccan caravans pass his hermitage for years without once coming down to speak to them. Then he came down for one boy travelling with his uncle, took the uncle aside, told him the child would be a prophet, and warned him to go home before anyone else worked it out. This episode follows the guardianship Abu Talib inherited from his dying father: the journey to Busra, the three men who came intending to kill the boy and were argued out of it from their own scripture, and the reputation that built in Mecca afterwards — two clans deadlocked over who would set the Black Stone, agreeing to accept the judgment of the next man through the door, and relieved when it was him. Then the marriage. Khadijah bint Khuwaylid had her own evidence, by way of a slave who had travelled the trade routes and seen the cloud, and she sent word and offered herself; Abu Talib stood before the notables of Quraysh, traced the family to Abraham and Ishmael, conceded that his nephew had no money at all, and closed by predicting great affairs. Her cousin Waraqah heard everything she witnessed, said flatly that this was the awaited Prophet, promised to follow him — and died before the call came. The episode ends where the whole volume has been heading: seven or eight years of a religion with three people in it, praying in the ravines outside Mecca, and then a haunch of mutton, forty silent men, and the youngest in the room standing up.'
