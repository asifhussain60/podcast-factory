title: Bahira, Khadijah, and the First Believers
audience: Listeners who have reached the Prophet's childhood and now want the forty-odd years between an orphan's guardianship and the first three people on earth to accept his message. No prior knowledge is assumed beyond the household established in the previous episode. What this episode asks of them is attention to a sequence of recognitions — a monk, a slave on a trade route, a woman of Quraysh, a poet who dies too early, an aunt who ranks a nephew above her sons — and then to a single argument the author breaks off his narration to make and refuses to soften.
angle: faithful_narrative
episode_format: narrative
format_rationale: 'The slice is historical and biographical exposition across roughly forty-five years: a guardianship, a caravan journey and the monk at Busra, the rebuilding of the Ka''bah and the judgment over the Black Stone, the War of the Ungodly, a marriage and its formal address, a birth inside the Ka''bah, and the first acceptances of Islam. The one genuinely contested proposition — whether a boy below the age of legal accountability can be counted a believer — is stated by the author in a single sentence on his opponents'' behalf and then answered; no named party voices it, nothing like the sustained named-opposition-with-dialogue threshold is met, and the chapter''s spine is events rather than the contest. So narrative, not debate, and not deep_dive: there is no single doctrine being unfolded layer by layer here.'
host_dynamic: narrator + companion
host_dynamic_rationale: The narrator carries the chronology and recites Abu Talib's marriage address whole at the point it falls; the companion presses on the recognitions and what each witness does with what they have seen — a monk who breaks a years-long habit and then tells the uncle to go home, a woman who has private evidence and argues the public case on character alone, a poet entirely convinced who dies before the call, and an uncle who refuses the religion in one sentence and guarantees its protection in the next.
