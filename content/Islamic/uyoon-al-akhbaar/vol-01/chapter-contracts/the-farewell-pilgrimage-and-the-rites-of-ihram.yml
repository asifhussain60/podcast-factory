show_notes:
  blurb: 'What do you do when the man you have been ordered to obey builds a fire and orders you to walk into it? This episode opens on the limits of a command — an angry officer, a fire on the road, and a ruling that says obedience is due only in what is good — and then on a group of guests who were sheltered, treated and restored at public expense and repaid it by murdering the men who tended the herd. From there it follows the commander who was sent after them: Najran, then Yemen twice, and the three complaints that came back. A written objection carried by a reluctant courier, answered without a word about what it alleged. A soldier who admits in his own telling that the grievance was only resentment. An army annoyed at having to hand back new clothes before a parade. And then, without comment, the officer who wrote the first complaint hanging in palm fronds in a valley of Tihama, writing to the man he had complained about. The second half changes register completely. In the tenth year the pilgrimage was announced in advance so that people could come and learn the rites by watching them performed — and what follows is that curriculum, step by step: where you consecrate yourself and in what words, why a distant pilgrim may take two rites out of one journey, why a consecration made in another man''s terms had to be settled by sharing a hundred animals between two hands, which corners are touched on every circuit, and why a verse that removes blame from those who walk between two hills is read as proof that the walk is required.'
