key_tensions:
  - A lawful commander issuing an unlawful order, and men who refuse on the ground that the fire in front of them and the Fire they converted to escape are the same thing.
  - Guests treated at public expense from a charitable herd who repay it by killing the men who tended them.
  - A written complaint from one commander about another, answered without any reference to what the complaint alleged.
  - A grievance whose owner admits, in his own telling, that it had no content — only resentment carried home and repeated to whoever would sit with him.
  - The officer who wrote the complaint from Yemen ending up bound in palm fronds and writing to the man he complained about.
  - A pilgrimage announced in advance so that a community could come and watch a practice being performed, rather than be told about it.
  - A dispensation that looks like a relaxation of the law and is argued to be a correction for distance.
  - A consecration made in a formula that copies another man's state, and therefore cannot be dissolved on its own terms.
  - Five stations named after five peoples, and then immediately detached from those peoples so that the road decides, not the birthplace.
  - A verse that removes blame from those who perform a rite, read as proof that the rite is obligatory rather than optional.
tone_constraints:
  - Third-person narrative report throughout, matching how the source narrates, except where the source itself gives a first-person account — Abu Sa'id al-Khudri at the fire, Buraydah with the letter, 'Amr ibn Shas in the mosque — which stay in those voices.
  - The formulae of consecration, the talbiyah, the rewards of the pilgrimage and the rulings on the sanctuary are rendered as the source gives them, not paraphrased into summary.
  - Arabic technical terms are preserved as the source supplies them — ihram, tamattu', qiran, miqat, talbiyah, hajj, 'umrah — with the source's own brief glosses kept where it supplies them.
  - The verses in Khalid ibn al-Walid's letter from captivity are damaged in this manuscript. They are carried at the level of surviving sense with the damage named — no line reconstructed, no garbled name repaired.
  - Footnote apparatus, manuscript sigla, folio marks, chains of transmission and edition locators are dropped per the denoise contract; the attributions are preserved in the show-notes references instead.
  - Honorific formulae are not read aloud after every name. The source's repeated blessing formulae are carried by the narration itself, as in earlier episodes.
  - The lesser pilgrimage made under the truce, and the detachment roll of the closing years, were both taught earlier in this history and appear here only as one-line datings in fresh words, never re-expounded.
  - Never pair the leadership title with the personal name of the Father of Imams. He is named as Ali ibn Abi Talib, as the Father of Imams, or — where the source itself does so — as the Commander of the Faithful.
anchor_passages:
  - 'The limit on a command: ''Had you entered it, you would never have come out of it until the Day of Judgement. Obedience is due only in what is good.'''
  - 'The general form of the same rule: ''There is no obedience to a creature in disobedience to the Creator.'''
  - 'The answer given to the courier from Yemen: ''Do not speak against Ali — for Ali is from me and I am from him, and he is your guardian after me.'''
  - 'The question that decided the complaint of ''Amr ibn Shas: ''Did you find any injustice in his judgements, or any unfairness in his conduct?'' — ''No.'''
  - 'The chain drawn from it: ''Whoever claims to love me yet hates Ali has hated me, and whoever hates me has hated God.'''
  - 'Its most physical statement: ''Whoever harms Ali has wounded my very ear.'''
  - 'The defence made after the garments were taken back: ''Do not reproach Ali, for he is among the most rigorous in the way of God to ever be complained against.'''
  - 'The verse that gives the pilgrimage its second name: ''O Messenger, convey what has been revealed to you from your Lord; if you do not, you will not have conveyed His message'' (chapter 5, verse 67).'
  - 'The revelation that created the combined rite: ''Had I known in advance what has now been shown to me, I would not have brought a sacrificial animal. So whoever has no sacrificial animal, let him dissolve his ihram.'''
  - 'The consecration that could not be dissolved alone: ''O God, I enter ihram with what Your Prophet, Your servant and Your Messenger Muhammad has entered ihram with.'''
  - 'The reward stated at the pace of a walk: ''For every sandal they lift, a good deed is recorded for them, and for every sandal they set down, another good deed is written.'''
  - 'The talbiyah at al-Bayda'': ''O God, here I am. Here I am. You have no partner. Praise is Yours, and grace is Yours, and the dominion is Yours.'''
  - 'The argument from the wording: ''Had there been a dispensation to abandon the walk between them, He would have said: There is no blame on one who does not walk between them.'''
