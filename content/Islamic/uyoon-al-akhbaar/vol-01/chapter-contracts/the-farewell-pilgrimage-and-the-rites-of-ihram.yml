title: The Farewell Pilgrimage
audience: 'Listeners who have followed nine years of marches, sieges and dispatched detachments and are now watching the fighting stop. No prior knowledge is needed beyond that. What this episode asks of them is a shift of expectation: the first half is still command and complaint — an officer who ordered his men into a fire, and three separate objections raised against the same commander after three separate missions — but the second half has no enemy in it at all, and turns into a step-by-step record of a set of actions performed in front of a crowd that had been summoned specifically to learn them.'
angle: faithful_narrative
episode_format: narrative
format_rationale: 'The slice is narrated event and reported speech throughout: an army halted at a fire, a punitive pursuit to the edge of Yemen, two campaigns into Yemen and one into Najran, three complaints answered by the Messenger of God, a rescue in a valley of Tihama, and then the ordered performance of the pilgrimage rites as reported by the household. The one passage that reasons rather than narrates — al-Baqir''s reading of the wording of the verse on al-Safa and al-Marwah — is a single unopposed exposition, not a contest. No named party answers back anywhere in the slice, so this is narrative rather than debate.'
host_dynamic: narrator + companion
host_dynamic_rationale: The narrator carries the fire on the road and the ruling that followed it, the pursuit of Banu Dha, the Najran and Yemen commands with Buraydah's letter and the two accounts of 'Amr ibn Shas, Khalid bound in palm fronds and cut down, and then the whole sequence of the rites from the announcement in Medina to the seventh circuit; the companion presses on why every complaint in this episode is answered without being investigated, on what a consecration made in another man's terms actually commits you to, and on how a permission in a verse can be read as proof of an obligation.
