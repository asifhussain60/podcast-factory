essential: core
essential_rationale: It carries the sayings issued each time a complaint came back from Yemen — including that Ali is of the Prophet and the Prophet of him and that he is guardian after him — and then the pilgrimage rites themselves as the household narrates them, including the sharing of the Prophet's own offering that ties the two men into a single sacrifice.
