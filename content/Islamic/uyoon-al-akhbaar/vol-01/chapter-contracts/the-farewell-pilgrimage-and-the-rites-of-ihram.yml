thesis_relevance: This chapter advances the book's central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents' record, by showing that every complaint brought against Ali ibn Abi Talib on the Yemen and Najran commands was answered not by adjudicating the complaint but by restating who he is — from me and I am from him, and your guardian after me — and then by having the Prophet resolve his consecration by taking him into his own offering.
