thesis_relevance: This chapter advances the book's central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents' record, by naming Ali as the scout, the banner-holder, the youngest of the three called out to single combat and the killer of a named list of Quraysh's leaders — and by carrying the prophecy of his own death, spoken on a dust-heap years before, inside the account of a battle he helped win.
