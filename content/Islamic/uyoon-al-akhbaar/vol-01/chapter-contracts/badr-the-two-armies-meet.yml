show_notes:
  blurb: 'Nobody who left Medina that Ramadan expected a battle. They went out after a caravan, on seventy camels ridden in shifts, with the man in command taking his turn on foot — and they met an army of somewhere between nine hundred and a thousand, a number worked out by asking two captured water-slaves how many camels the other side slaughtered for dinner. This episode carries the year that led there: the first banner ever raised in Islam and the thirty riders who faced three hundred without a blow struck, four expeditions that ended with everyone home, and one patrol at a palm grove that killed a man in a forbidden month and handed Quraysh the grievance it went to war on. Then Mecca — a woman''s dream three days ahead of the messenger, dismissed because a woman had it, and a rock in it that broke into fragments reaching every house in the city. Then Badr itself: a man who swore an oath about a water basin and crawled to keep it, three duels of which two ended instantly, a handful of pebbles thrown into the faces of an advancing line, and afterwards the count — every man killed with the man who killed him, both totals where the sources disagree, fourteen martyrs by name, and a dying man at al-Safra'' arguing about somebody else''s faith.'
