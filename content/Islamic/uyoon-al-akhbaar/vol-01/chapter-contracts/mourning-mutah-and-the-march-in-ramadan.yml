    - The Quran, chapter 60 verses 1 to 4, chapter 4 verse 101, and chapter 2 verse 158 — the three passages the source attaches to this stretch
thesis_relevance: This chapter advances the book's central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents' record, by preserving the household at the centre of the mourning — Ja'far named as sharing one branch of a single tree, the elegies closing on the family of Hashim as those upon whom the Book came down — and by carrying the legal rulings on fasting and prayer as they were transmitted through Ja'far al-Sadiq, Muhammad al-Baqir and Ali ibn Abi Talib rather than through any other chain.
