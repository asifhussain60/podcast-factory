host_dynamic_custom: null
length_target: extended
essential: core
essential_rationale: It carries the Prophet's report of the three deaths at Mu'tah with the couch of 'Abd Allah ibn Rawahah set apart, the mourning of Ja'far and the saying about the single tree, the naming of the twelve martyrs, the breach of the truce that made the conquest of Mecca lawful, and the transmitted rulings from al-Sadiq, al-Baqir and Ali on breaking the fast and shortening the prayer while travelling.
