title: Mourning Mu'tah, Marching in Ramadan
audience: Listeners who have just watched three commanders fall in sequence in the Levant and now hear how the news reached Medina, who mourned it, and what it set in motion. No prior knowledge is needed beyond the truce agreed at al- Hudaybiyah and the dispatch to Mu'tah. What this episode asks of them is to follow a ten-year treaty coming apart at a watering place, an embassy that fails four times in one day, and a campaign that stops on the road to settle a question about the length of a prayer.
angle: faithful_narrative
episode_format: narrative
format_rationale: 'The slice is narrated event and reported speech throughout: an announcement of deaths, a visit to a widow, a run of elegies, a night raid at a watering place, an embassy conducted through five separate refusals, an intercepted letter, and a march. The one stretch of genuine dispute — al-Baqir''s exchange with an objector over whether shortening the prayer is obligatory — is a single question-and-answer inside a legal digression, not a proposition contested across the chapter by named parties, so this is narrative rather than debate.'
host_dynamic: narrator + companion
host_dynamic_rationale: The narrator carries the announcement of the three deaths with the silence that frightened the Ansar and the couch set apart, the visit to Asma' bint 'Umays and the instruction to feed Ja'far's household, the elegies of Asma', Hassan and Ka'b and the returning soldier, the roll of the twelve, then the attack on Khuza'ah at al-Watir, 'Amr ibn Salim's appeal in verse, Abu Sufyan's day of refusals in Medina, the letter drawn from a woman's braids, the pardon of Hatib with chapter 60 verses 1 to 4, and the rulings on fasting and on shortening the prayer; the companion presses on why a hesitation is recorded at all if it carries no penalty, on why advice known to be worthless is given anyway, and on why a verse this severe leaves the man it was revealed about unpunished.
