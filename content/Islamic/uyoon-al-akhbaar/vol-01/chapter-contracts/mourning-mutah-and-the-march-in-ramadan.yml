key_tensions:
  - A battle report that arrives before any survivor does, in an order that does not match the order the fighting was narrated in — and the book leaves both standing.
  - A silence read as a verdict. The Ansar hear the pause after the third name and fear their man did something blameworthy; what is finally reported is a hesitation that costs him nothing but a couch set apart.
  - News delivered by being asked for. He sends for the children first, and it is the sight of them that produces the tears that produce her question.
  - 'A kinship claimed that descent alone cannot supply: one tree, one branch, and the thing shared is nature and character rather than blood.'
  - Elegies that begin as laments for three men and end as statements about which household the revelation belongs in.
  - A roll of twelve that only reaches twelve if an alternative pair is counted alongside the brothers rather than instead of them — and the discrepancy is left standing.
  - A sanctuary invoked and dismissed. The objection that they are inside the Haram is not denied; it is answered by attacking the objector's standing to raise a boundary he already crosses.
  - 'An accusation placed at the end of a poem for maximum weight: they killed us while we were kneeling and prostrating.'
  - A daughter who folds a bed away from beneath her own father and names the reason as ritual purity.
  - 'An offer to buy in the wrong currency. Abu Sufyan proposes that a small child grant protection to Quraysh and names the price: mastery of the Arabs until the end of time.'
  - Advice whose worthlessness is declared in the same breath it is given, and performed in public anyway, because the alternative was nothing at all.
  - A search that has already come up empty and continues on a claim about where the information came from rather than on anything found.
  - A pardon granted on a fact from a different year. Hatib's motive is entirely worldly and is not weighed; what answers 'Umar is that the man was at Badr.
  - A revelation of that severity recorded on the same page as the pardon, with the tension between them left unresolved.
  - Men who fasted being called the disobedient — because a command declined is a command disobeyed, whatever it was declined in favour of.
  - An argument that turns on the objector's own premise. If 'there is no blame on you' did not stop the walk between al-Safa and al-Marwah being obligatory, it cannot by itself stop the shortening being obligatory either.
tone_constraints:
  - Third-person narrative report throughout, matching how the source narrates. Quoted speech appears only where the source supplies it; no dialogue, scene or motive may be invented around it.
  - The transmitted rulings on breaking the fast and shortening the prayer are carried in the source's own order and wording, including al-Baqir's argument from al-Safa and al-Marwah and the author's one-sentence reason for including the digression at all.
  - Where the source contradicts itself it keeps both readings. The order of the three commanders in the Prophet's report differs from the order in the battle narrative, and the roll of the twelve does not agree with its own count; neither is resolved.
  - The elegies of Asma' bint 'Umays, Hassan ibn Thabit and Ka'b ibn Malik, the verses of Qutbah ibn Qatadah and of the anonymous returning soldier, 'Amr ibn Salim's appeal, Hassan's incitement poem and Abu Sufyan ibn al-Harith's recantation have all come down badly damaged. They are carried at the level of their surviving sense with the damage named — no line reconstructed, no garbled name repaired into the one it probably was, and speaker attributions that have slipped in transmission flagged rather than silently corrected.
  - Footnote apparatus, manuscript sigla, folio marks and edition locators are dropped per the denoise contract; the attributions are preserved in the show-notes references instead.
  - Honorific formulae are not read aloud after every name. The source's repeated blessing formulae are carried by the narration itself, as in the previous episodes of this series.
  - Umm Habiba's emigration to Abyssinia and the truce of al-Hudaybiyah were both taught earlier in this history. Each appears here only as a one-line callback in fresh words.
  - Never pair the leadership title with the personal name of the Father of Imams. He is named as Ali ibn Abi Talib, as the Father of Imams, or — where the source itself does so — as the Commander of the Faithful, never as a title joined to the personal name.
anchor_passages:
  - 'The report of the three deaths, and what followed the silence: ''They were raised up, and I beheld them reclining on couches of gold. I saw the bed of ''Abd Allah ibn Rawahah set apart from the beds of his two companions... ''Abd Allah had hesitated for a moment, and then went forward.'''
  - 'The exchange with Asma'' bint ''Umays: ''What makes you weep? Have you received news of Ja''far and his companions?'' — ''Yes. They were struck down today.'''
  - 'The instruction to his household: ''Do not neglect the family of Ja''far. Make food for them, for they are occupied with a grief that has overwhelmed them.'''
  - 'The two forms of the saying about the tree: ''People were created from different trees, but Ja''far and I were created from a single tree'' — and ''We, the family of ''Abd al-Muttalib, are from one tree. Ja''far and I are from one of its branches — his nature is like my nature, and his character is my character.'''
  - 'Hassan ibn Thabit''s surviving line: ''I saw the finest of the Muslims brought low by a death that gave Ja''far two wings.'''
  - 'The answer inside the Haram: ''There is no god for Him today, O Banu Bakr. Take your revenge. For by my life, do you not steal even within the Haram?'''
  - '''Amr ibn Salim''s charge and the reply to it: ''they have killed us while we were kneeling and prostrating'' — ''O ''Amr ibn Salim, you have been answered.'''
  - 'Umm Habiba and the bed: ''It is the bed of the Messenger of God, and you are a polytheist and impure.'''
  - 'Fatima''s refusal: ''By God, my son has not yet reached the point of extending protection over the people, and no one can intercede against the decision of the Messenger of God.'''
  - 'The honest counsel and its own disclaimer: ''Do you think this will avail me anything?'' — ''No, by God, I do not think so. But I can find nothing else for you.'''
  - 'The letter drawn from the braids: ''By God, I have not lied and I have not been misled. Bring out this letter, or we will strip your clothing.'''
  - 'The pardon of Hatib: ''And what do you know, O ''Umar? Perhaps God has already looked upon the people of Badr and said: do as you wish, for I have forgiven you.'''
  - The revelation concerning Hatib, from 'O you who believe, do not take My enemy and your enemy as allies' through 'until you believe in God alone' (chapter 60, verses 1 to 4).
  - 'The naming of the disobedient: ''Some people refused to break their fast, and so they were called the disobedient — because God had commanded them through His Prophet, and they did not obey his command.'''
  - 'The gift and its rejection: ''Breaking the fast and shortening the prayer while travelling. Whoever does not do so has rejected God''s gift.'''
  - 'Al-Baqir''s argument from the rites: ''Did not God say, indeed, al-Safa and al-Marwah are among the rituals of God... there is no blame on him if he goes back and forth between them (chapter 2, verse 158)? Do you not see that walking between them is obligatory?'''
