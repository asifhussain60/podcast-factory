show_notes:
  blurb: 'How does a battle report reach a city before any survivor of the battle does? This episode opens in Medina with the Messenger of God naming the three men who fell at Mu''tah and the order in which the banner passed between them — and then falling silent, long enough that a whole section of the community reads the pause as a verdict withheld. What follows is the mourning: a widow who learns the news by asking for it, an instruction about who should be cooking for that household, elegies from three named poets and one anonymous returning soldier, and a roll of twelve dead that does not quite add up to twelve. Then a ten-year truce comes apart at a watering place outside Mecca, in a night raid armed by the very men who guaranteed it — and the most powerful man in Quraysh rides to Medina to repair it and is refused five times in a single day, finally receiving one piece of advice that is declared worthless in the same breath it is given, performing it in public, and going home to be told he was made a fool of. Then the road to Mecca in Ramadan: a letter hidden in a woman''s braids, a companion who confesses to writing it and is pardoned on the strength of where he stood at Badr, ten thousand men on the march — and a campaign that halts to argue whether shortening a prayer on a journey is permitted or required.'
