    - Idris Imad al-Din, Uyun al-Akhbar wa Funun al-Athar — the source of this episode, from the report of the deaths at Mu'tah through the march on Mecca in Ramadan of the eighth year
    - Al-Sira al-Nabawiyyah / Sirat Ibn Hisham — the underlying narrative the source follows for the mourning of Ja'far, the attack on Khuza'ah at al-Watir, Abu Sufyan's embassy to Medina, and the affair of Hatib ibn Abi Balta'ah
    - Tabaqat Ibn Sa'd, Maghazi al-Waqidi, Sharh al-Akhbar and Muqatil al-Talibin — cited by the source for the sayings on Ja'far and for the roll of those martyred at Mu'tah
