thesis_relevance: This chapter advances the book's central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents' record, by giving the deliverance of Medina from ten thousand men two causes and no others — the blessing of the Messenger and the struggle of Ali ibn Abi Talib — and then defending that claim twice over, once through a recitation that names him inside chapter 33, verse 25, and once through a companion answering a room that called it exaggeration.
