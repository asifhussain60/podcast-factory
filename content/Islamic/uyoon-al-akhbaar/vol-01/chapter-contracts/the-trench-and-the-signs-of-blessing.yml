title: The Trench and the Signs
audience: 'Listeners who have followed this community through Badr, Uhud and a year of marches that produced no fighting, and who now watch it besieged in its own city by the largest coalition the peninsula had assembled. No prior knowledge is needed beyond the expulsion of the Banu al-Nadir. What this episode asks of them is to follow a siege in which almost nothing is thrown: the decisive acts are a ditch, a phrase carried into a fortress, a few minutes of single combat, and one man telling two frightened parties the truth about each other.'
angle: faithful_narrative
episode_format: narrative
format_rationale: 'The slice is a chronicle of a campaign: a delegation to Mecca, the mustering of Quraysh and Ghatafan, the digging, four wonders reported by named witnesses, a breach of covenant, twenty-five days of archery, a duel, a stratagem and a withdrawal. The only extended exchanges are the challenge and answer before the single combat and Hudhayfah''s reply to Rabi''ah al-Sa''di — short altercations inside events rather than a sustained contest over a proposition — so this is neither debate nor deep_dive.'
host_dynamic: narrator + companion
host_dynamic_rationale: The narrator carries the embassy to Quraysh and Ghatafan, the digging of the trench with the rock, the dates and Jabir's sheep, Salman's three flashes, the breaking of the Banu Qurayza's covenant, the fear in the camp, Safiyyah at the fortress of Fara', the crossing of 'Amr ibn 'Abd Wudd and his death, Na'im ibn Mas'ud's double errand, the wind and the withdrawal; the companion presses on why every wonder at the trench concerns food or stone rather than weapons, and on how a siege of ten thousand men was decided by things said rather than things thrown.
