show_notes:
  blurb: 'How do you lose a war you are never allowed to fight? Ten thousand men came for Medina in the fifth year after the emigration and went home without a battle — stopped by a ditch the Arabs said had never been dug before, then by a rumour, then by a wind. Almost everything decisive in this episode happens off the battlefield. A rock crumbles like a dune, a handful of dates feeds an army and spills over the edges of the garment, and a pickaxe strikes three flashes of light that promise Yemen, Syria and Persia to men who cannot be sure of reaching the latrine. Behind the defenders, a single phrase carried into a fortress turns an ally into an enemy without a threat being spoken. And in the salt flat beyond the ditch, one champion crosses and one man is sent out to meet him under a sentence spoken before the fight: all of faith has gone forth to meet all of disbelief. What follows — a stratagem that dissolves a coalition of ten thousand without another casualty, a windstorm, and a companion cross-examined about whether the claim made for that duel is exaggeration — is the rest of this episode.'
