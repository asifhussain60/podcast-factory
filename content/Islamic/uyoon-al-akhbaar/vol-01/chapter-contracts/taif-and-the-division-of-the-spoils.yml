essential_rationale: It carries the only campaign of the Prophet's life abandoned before its objective and the reason given for it, the first homicide adjudicated in Islam, the prolonged private counsel at Ta'if with 'It was not I who chose him — it was God who chose him', the verse of private counsel that this history says only one man obeyed, the return of six thousand captives, the stated policy behind the hundred-camel gifts, and the prophecy of the arrow that passes clean through its target.
