thesis_relevance: This chapter advances the book's central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents' record, by making the long private counsel at Ta'if the hinge of the whole source chapter — answered with 'it was God who chose him', grounded in a Quranic commandment this history says only Ali ibn Abi Talib obeyed, and traced forward to the party that first objected to a distribution here and was killed at Nahrawan by the man kept in that counsel.
