show_notes:
  blurb: 'Which is the harder sentence for an army to hear at the foot of a wall it has been battering for three weeks — that the wall will not fall, or that permission to bring it down was never given? This episode follows the march up from Hunayn to Ta''if, along a road where the first homicide in Islam is brought before a judge instead of settled between clans, to a siege that builds a catapult, cracks the wall, walks a covered ram up to the breach, and is met with a burning iron beam. Twenty nights later the order to withdraw is given, and what the siege leaves behind is a prayer for the guidance of the people who shut the gate and a handful of enslaved men who walked out and were freed. Inside those nights a conversation runs on too long in front of a watching army, and the book stops narrating to argue: a verse that priced access to the Prophet in single coins, obeyed here by one man until his ten coins ran out; a claim of a thousand doors opened at the ear; and a caliph overruled from the floor by a woman quoting a verse he had missed. Then al-Ji''ranah, where six thousand captives go home for nothing and hundreds of camels go out in blocks of a hundred to men who commanded the other side a month before — until someone asks why a man who fought well got nothing, and the answer inverts the whole ledger. And a complaint about the fairness of it all draws the image of an arrow that passes clean through its target and comes out with nothing on it.'
