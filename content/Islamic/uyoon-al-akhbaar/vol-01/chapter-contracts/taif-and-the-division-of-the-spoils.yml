title: Ta'if and the Division of Spoils
audience: 'Listeners who have followed the community from the conquest of Mecca through the rout and recovery at Hunayn, and who now watch the same army fail at a wall. No prior knowledge is needed beyond the captives and herds left under guard at al-Ji''ranah at the close of the previous episode. What this episode asks of them is to hold two uncomfortable things at once: a siege abandoned on grounds that are not military, and a distribution of wealth in which the largest gifts go to the men most recently on the other side, with the reason stated aloud.'
angle: faithful_narrative
episode_format: narrative
format_rationale: 'The slice is narrated event and reported speech throughout: a march with its halts named, a siege with its engineering described, a withdrawal, a private consultation, a delegation, and a distribution counted out by name. The one passage that argues rather than narrates — the book''s own case for the distinction of Ali ibn Abi Talib, built from the verse of private counsel and two counter-exhibits — is the author speaking in his own voice with no named interlocutor answering him, so there is no sustained named opposition and this is narrative rather than debate. Dhu al-Khuwaysirah''s objection is a single challenge answered in one sentence, not a contest.'
host_dynamic: narrator + companion
host_dynamic_rationale: The narrator carries the march along the Palm of Yemen and the mosque built at Layyah, the first blood case adjudicated in Islam, the catapult and the covered ram met by a burning iron beam, the twenty nights and the vineyards, 'Permission has not been granted to conquer Ta'if', 'Uyaynah's stated reason for joining the siege, the enslaved who came down and were freed, the prolonged private counsel with the answer that God chose him, the verse of private counsel with the dinar broken into ten dirhams (chapter 58, verse 12), the thousand doors, the woman who corrected 'Umar with chapter 4 verse 20, the Hawazin delegation and the six thousand captives returned, Malik ibn 'Awf's hundred camels, the robe pulled off and the tuft of camel hair, 'Aqil's needle, the roll of hundred-camel gifts, Ja'il ibn Suraqah entrusted to his Islam, and the arrow that passes clean through its target; the companion presses on why a cracked wall is left standing, on what it means that the only lasting gain of a siege is a handful of freed people, and on how a complaint about fairness at a distribution becomes the seed named at Nahrawan.
