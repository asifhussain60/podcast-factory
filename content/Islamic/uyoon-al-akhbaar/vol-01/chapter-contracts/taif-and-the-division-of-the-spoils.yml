key_tensions:
  - A siege abandoned with the wall already cracked, on the stated ground that permission was not granted — the one withdrawal in this volume that carries no reproach and no military explanation.
  - A homicide between two clans brought to a judge on the march instead of settled between the clans, and marked by the book as a first.
  - 'A prayer over the enemy at the moment of failure: guide Thaqif and bring them to us, asked for in place of the curse that was requested.'
  - A man who joined the siege hoping it would succeed so he could take a woman of good stock out of the wreckage, and who says so when challenged on his loyalty.
  - The only lasting gain of twenty nights is the people who walked out of the besieged city on their own feet and were freed at the gate of the camp besieging it.
  - A conversation whose length, not its content, is the provocation — and a reply that refuses the complaint's premise rather than answering it.
  - A commandment that priced access to the Prophet in single coins, obeyed on this account by one man until his ten coins ran out, and then lifted.
  - A ruling announced from the pulpit and overturned from the floor by a woman quoting a verse, reported by the man she corrected.
  - Six thousand captives returned for nothing on a request the Prophet scripted for the petitioners and had them make in public after the noon prayer.
  - Three commanders refusing in identical words, and one of them overruled on the spot by his own tribe.
  - A woman held not as a captive but as an expected ransom, released only when someone itemised in four clauses why the ransom would never come.
  - A single hair from a camel's hump held up between two fingers as the smallest unit at which the rule on spoils has to hold.
  - Hundreds of camels going in blocks of a hundred to men who commanded the other side a month earlier, while the man given nothing is named better than the earth's fill of two who received the most.
  - A poet's grievance answered by instruction — silence his tongue with gifts — which is the policy rather than an accusation against it.
  - A complaint about the fairness of a distribution, answered with an image of an arrow passing clean through its target and leaving nothing on it, and traced forward to Nahrawan.
tone_constraints:
  - Third-person narrative report throughout, matching how the source narrates. Quoted speech appears only where the source supplies it; no dialogue, scene or motive may be invented around it.
  - The verse of Malik ibn 'Awf, the Hawazin poets, Ka'b ibn Malik, Shaddad ibn 'Arid al-Jashmi, Bujayr ibn Zuhayr, Abu Muhajin al-Thaqafi and 'Abbas ibn Mardas has come down in this stretch as badly damaged as anything in the volume. It is carried at the level of surviving sense with the damage named — no line reconstructed, no garbled name repaired.
  - 'Where the source carries a variant it is preserved rather than resolved: twenty nights or seventeen, al-Ji''ranah or Mecca as the place of Malik''s submission, and the uncertain identity of the man of Banu ''Abd al-Dar.'
  - Footnote apparatus, manuscript sigla, folio marks, edition locators and the editor's note on a clause he elected to omit are dropped per the denoise contract; the attributions are preserved in the show-notes references instead.
  - Honorific formulae are not read aloud after every name. The source's repeated blessing formulae are carried by the narration itself, as in earlier episodes.
  - The Prophet's earlier rejection at Ta'if before the emigration, the day of Hunayn and its captives, the loan of shields from Safwan ibn Umayyah, and the conquest of Mecca were all taught earlier in this history. Each appears here only as a one-line callback in fresh words.
  - Never pair the leadership title with the personal name of the Father of Imams. He is named as Ali ibn Abi Talib, as the Father of Imams, or — where the source itself does so — as the Commander of the Faithful.
anchor_passages:
  - 'The withdrawal: ''Permission has not been granted to conquer Ta''if'' — and the answer of the Muslims, ''O Messenger of God, then give the order to withdraw.'''
  - '''Uyaynah''s stated reason: ''I did not come to fight Thaqif alongside you. What I wanted was for Muhammad to open Ta''if, so that Thaqif might give up a slave girl whom I could take.'''
  - 'The prayer asked for and the prayer given: ''Pray against Thaqif, O Messenger of God'' — ''O God, guide Thaqif and bring them to us.'''
  - 'The answer on the private counsel: ''It was not I who chose him — it was God who chose him.'''
  - 'The verse of private counsel and the dinar: ''O you who believe, when you consult the Messenger in private, offer charity before your consultation'' (chapter 58, verse 12) — ''No one fulfilled the verse of private counsel other than me.'''
  - '''The Messenger of God placed his mouth to my ear and opened to me a thousand doors of knowledge, and from each of those doors a thousand more doors were opened to me.'''
  - '''Umar corrected from the floor: ''You hear such a thing from me and do not object — until a woman who knows little corrects me?'' (the verse cited against him is chapter 4, verse 20).'
  - 'The choice put to Hawazin: ''Which is dearer to you — your wealth, or your women and children?'''
  - 'Zuhayr ibn Surad on the old woman: ''Give her up — by God, her breast gives no milk, her belly bears no child, her husband is gone, and her youth is spent.'''
  - 'The robe and the three denials: ''if you had as many camels as the trees of Tihamah, I would divide them all among you, and you would not find me miserly, cowardly, or a liar.'''
  - 'The tuft of hair: ''I have nothing of your spoils — not even this thread — that is not returned to you. So hand over even the needle and thread.'''
  - 'The policy stated in full: ''Ja''il ibn Suraqah is better than the whole earth filled with the likes of ''Uyaynah ibn Husn and al-Aqra'' ibn Habis. But I gave to those two in order to draw them toward surrender, while I entrusted Ja''il ibn Suraqah to his Islam.'''
  - 'The objection and the answer: ''O Muhammad, you have not been just in what you have divided'' — ''Woe to you — if I am not just, then who is?'''
  - 'The arrow: ''a group who immerse themselves so deeply in religion that they pass right through it, just as an arrow passes clean through its target — nothing remains on the arrowhead, nothing on the shaft, nothing on the fletching.'''
