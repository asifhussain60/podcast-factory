thesis_relevance: 'This chapter advances the book''s central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents'' record, by showing the heavens themselves adjudicating the day: an angel who asks to be counted a Hashimite for what Ali did, a voice naming his sword and his person, and a written record in the seven heavens of who Hamza was. The casualty roll then attributes nine of the twenty-two enemy dead to two men of that one house.'
