show_notes:
  blurb: 'A woman on the losing side of Badr cut the liver out of the Prophet''s uncle, chewed it, and could not get it down — and the verse that came down afterwards was addressed not to her but to the men who wanted to do the same thing back. This is the second half of Uhud, and there is almost no tactics in it. An angel watching Ali defend the wounded Prophet asks to be counted as a Hashimite. A man pulls two helmet rings out of the Prophet''s cheek with his teeth and loses two of his own. A challenger who was told years earlier in Mecca that he would be killed dies of a wound his own people cannot find. The Prophet swears to mutilate seventy in return for Hamza and is answered inside the same paragraph; he prays over his uncle seventy-two times because the bodies kept being brought to where he lay; he notices that nobody is weeping for Hamza, lets the weeping be organised, weeps, and then closes the mosque door and forbids it. Then the ledger: seventy dead on one side, twenty-two on the other, kept by killer — and in the middle of it a man who had been named as one of the people of the Fire before the battle, outfought everyone on the field, and explained himself out of his own reward in one sentence.'
