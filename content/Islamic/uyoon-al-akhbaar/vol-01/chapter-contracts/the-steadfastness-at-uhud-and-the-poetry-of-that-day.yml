title: Hamza's Death and Uhud's Elegies
audience: 'Listeners who have just heard the battle turn and now want to know what the community did with the loss. No prior knowledge is needed beyond the fact that Uhud was lost and that the Prophet''s uncle Hamza was killed there. What this episode asks of them is patience with bodies and with broken verse: the second half of Uhud in this history is a burial, a casualty ledger and six poems, four of which have come down damaged.'
angle: faithful_narrative
episode_format: narrative
format_rationale: 'The slice is narration and elegy end to end: a defence of the Prophet on the field, a duel with Ubayy ibn Khalaf, a mutilation, a funeral procedure, a pursuit to Hamra'' al-Asad, a roll of the dead kept by killer, and then a long run of memorial poetry. The only extended exchanges are Ma''bad''s report to Abu Sufyan and al-Zubayr''s message to Safiyyah — short altercations inside events, not a sustained contest over a proposition — and no doctrine is unfolded layer by layer, so this is neither debate nor deep_dive.'
host_dynamic: narrator + companion
host_dynamic_rationale: The narrator carries the steadfastness beside the wounded Prophet, the death of Ubayy ibn Khalaf, the sitting prayer, the mutilation of Hamza and the two verses that answered it, the seven takbirs and the burial, the pursuit and the roll of the dead, then the poets, at the pace the source sets them down; the companion presses on the verdicts announced before the deed — the sentence spoken to Ubayy in Mecca, the naming of Qarman as one of the people of the Fire before he outfought everyone on the field — and on why a vow of revenge and an organised mourning were both cancelled within a paragraph of being made.
debate: null
host_dynamic_custom: null
length_target: extended
essential: core
essential_rationale: It carries the second half of Uhud entire — Gabriel's naming of Ali's defence and the voice from heaven about Dhu al-Fiqar, the killing of Ubayy ibn Khalaf, the mutilation of Hamza with the two Quranic answers that follow it, the funeral and burial rules, the casualty ledger of both sides, and the whole memorial poetry of the battle.
key_tensions:
  - An honorific that runs upward. Gabriel witnesses Ali's defence and says this is true loyalty; the Prophet answers that Ali is of him and he of Ali; and Gabriel asks to be counted with them both — which is why the angels were called Hashimite.
  - A vow of revenge cancelled inside the same paragraph. The Prophet swears over Hamza's mutilated body to mutilate seventy in return, and revelation answers with a ceiling on retaliation and a preference for patience.
  - The book's own verdict on the defeat, printed in the text. The community takes comfort in the enemy's casualties and is answered with arithmetic and a diagnosis — it is from yourselves — glossed by the source as the march out of the city and the abandonment of the archers' posts.
  - A permission and a prohibition in five sentences. He notes that nobody weeps for Hamza, allows the weeping to be organised, weeps himself, then closes the mosque door and forbids lamentation — at the one moment when forbidding it costs him personally.
  - The only refusal of a prophetic order in the episode that is granted. Safiyyah is told to turn back from her brother's body and answers on doctrinal grounds that the mutilation was in the cause of God and she is content with it.
  - Two verdicts announced before the deed. Ubayy ibn Khalaf was told in Mecca that he would be killed and dies of a wound his own people cannot find; Qarman is named as one of the people of the Fire before the battle, kills more men than anyone else on the roll, and tells his well-wishers he fought only for his tribe before killing himself.
  - Two women named Hind on opposite sides of the same argument. The Qurayshi Hind versifies the mutilation as a vow fulfilled and a wound healed; a Hashimite Hind replies by turning the word vow into the charge against her.
tone_constraints:
  - Third-person narrative report throughout, matching how the source narrates. Quoted speech appears only where the source supplies it; no dialogue, scene, or motive may be invented around it, and no detail of the fighting beyond what the source states.
  - The poetry of this chapter is severely damaged in transmission. Every poem is carried at the level of its surviving sense, with the damage named rather than patched. Do not reconstruct a line, do not repair a garbled proper name, and do not present a fragment as a complete verse.
  - Hassan ibn Thabit's invective against Hind opens with an obscenity about her body. Its content is reported plainly — the curse, the taunt about a dancing girl at Badr, the jeer at the young men of Mecca — without reproducing the obscene line. The source's coarseness is named, not performed.
  - Chains of transmission are not narrated. Reports are attributed simply to their narrators; the isnad apparatus, folio marks, manuscript sigla and the source's footnote locators are book-object provenance and are dropped.
  - Where the source gives two readings it keeps both. The execution of Mu'awiya ibn al-Mughirah carries the alternative account with 'Uthman's attempted protection and closes with the source's own unsettling formula; the number of men Qarman killed is left as eight or seven.
  - Honorific formulae are not read aloud after every name. The source's repeated blessing formulae are carried by the narration itself, as in the previous episodes of this series.
  - The killing of Hamza by Wahshi, the challenge of Talha ibn Abi Talha, and the abandonment of the archers' posts were all narrated in full in the previous episode. They appear here only as callbacks in fresh words — never a second telling.
  - Never pair the leadership title with the personal name of the Father of Imams. He is named as Ali ibn Abi Talib, or as the Father of Imams, throughout.
anchor_passages:
  - 'Gabriel over Ali''s defence: ''O Muhammad, this is true loyalty'' — ''He is of me, O Gabriel, and I am of him'' — ''And I am of you both, O Muhammad.'''
  - 'The voice from heaven: ''There is no sword but Dhu al-Fiqar, and there is no young man but Ali.'''
  - 'The promise to Malik ibn Sinan after he sucked the blood from the wound: ''Whoever''s blood mingles with mine, the Fire shall not touch him.'''
  - 'Ubayy ibn Khalaf, dying of a wound his companions cannot find: ''He told me in Mecca that he would kill me. Had he but spat upon me, it would have killed me.'''
  - 'The vow over Hamza and its answer: ''If God grants me victory over them, I will mutilate seventy of them in return'' — followed by chapter 16, verse 126.'
  - 'The diagnosis of the defeat: ''It is from yourselves'' (chapter 3, verse 165), with the source''s own gloss naming the march out of Medina and the abandoned archers'' posts.'
  - 'Gabriel on Hamza: ''It is written among the people of the seven heavens that Hamza is the lion of God and the lion of His Messenger.'''
  - 'Safiyyah''s refusal: ''I have been told that my brother was mutilated, and that this was in the cause of God. I am content with it, and I shall be patient, God willing.'''
  - 'The witness over the martyrs: ''Every Muslim who is wounded in the path of God — his wound shall come on the Day of Resurrection as it was: its colour the colour of blood, its scent the scent of musk.'''
  - 'The sword handed to Fatima: ''Wash the blood from this, O my daughter — it has served me faithfully today.'''
  - 'Qarman answering his well-wishers: ''What should I rejoice about? I fought only for the sake of my people, and for no other reason.'''
