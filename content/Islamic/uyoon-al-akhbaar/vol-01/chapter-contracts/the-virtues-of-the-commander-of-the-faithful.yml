show_notes:
  blurb: 'Ask a man to name the greatest thing about him and you expect a list of things he did. This history records a man being asked exactly that, in public, and answering with a list of things done to him while he stood there. The narrative stops here and the volume turns into a file. First, what other people heard: the same threat issued in three towns, promising to send a man like the speaker and completed each time by taking hold of a particular hand; a companion who asks who is meant and is told the question does not concern him; a household servant told four titles before the door opened, who quietly hoped they belonged to somebody else; a face wiped with a hand and a task assigned in three parts, the last of which is to settle after his death the questions the community would divide over; and two small boys held up while eight relationships were named over them. Then the answer given when a delegation asked directly — four occasions on which he was the object rather than the actor: doors closed by an order he neither gave nor defended, a hand taken and led out to face a delegation that calculated the odds and withdrew, a mission removed from one man on the road with the reason stated aloud so it could not be read as a rebuke, and two boasts about the keys and the well answered by a verse rather than by him. And then the narrative resumes, and the orders start failing: an army ordered to Palestine that travelled a league and came home, a fever that began at a graveyard before dawn with its owner congratulating the dead on what they had missed, an old poisoning surfacing to finish what it started, a prayer taken over and then taken back, and a request for writing materials that was buried under an argument.'
