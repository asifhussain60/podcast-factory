thesis_relevance: This chapter advances the book's central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents' record, by gathering the designations into a single argued file — reports the history insists were transmitted by intimates and by the wider community alike — and then showing the first attempts to set that designation aside while its author was still alive.
