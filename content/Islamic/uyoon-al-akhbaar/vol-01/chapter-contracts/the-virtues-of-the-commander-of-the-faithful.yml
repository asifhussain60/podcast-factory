key_tensions:
  - A threat issued to three different towns that promises to send a man like the speaker, in a chapter that has just declared prophecy sealed and unrepeatable.
  - A companion who asks who is meant and is told, in the Prophet's hearing, that the question does not concern him.
  - A servant who hears four titles announced before the door opens and privately hopes they belong to his own people.
  - A man asked for his greatest virtues who disqualifies, by rule, everything he had any part in.
  - A complaint about the closed doors raised by the Prophet's own uncles, and recorded in their words rather than suppressed.
  - An offer of mutual imprecation declined by opponents on a purely practical calculation rather than on the merits.
  - A mission taken back from one man on the road and the reason stated aloud so that it could not be read as a rebuke.
  - A conspiracy that agreed prophecy and guardianship should not both rest in one clan, and that planned to bequeath its betrayal if it could not act itself.
  - An accusation admitted rather than denied, with an unwitnessed pardon offered against a curse that had witnesses.
  - An informant told to his face that the sworn denials of the accused would have outweighed him without a sign from heaven.
  - An army ordered out of the city with three named men in it, which travelled a league and came home.
  - A prayer begun on an instruction issued from inside the household while the Prophet lay unconscious, and ended as soon as he could stand.
  - Writing materials called for so that a community would never go astray, and a room that produced an argument instead.
tone_constraints:
  - Third-person narrative report throughout, matching how the source narrates, except where the source itself gives a first-person account — Ali's answers to the delegation, Anas in the household, Abu Dharr, and Ibn Abbas on the unwritten document — which stay in their own voices.
  - Arabic technical terms, titles and place names are preserved as the source supplies them — zakat, Sunnah, Baqi' al-Gharqad, Bani Hashim, Banu Wali'ah, Dhat al-Salasil, Balqa, Darum — with the source's own brief glosses kept where it supplies them.
  - The position of Aaron, the establishment of brotherhood among the companions, the closing of the doors at the mosque of Madinah and the proclamation at Ghadir Khumm were all taught earlier in this volume. Each appears here only as a short callback in fresh words, placed to show where the item now sits in the guardian's own list — never re-expounded.
  - Footnote apparatus, manuscript sigla, folio marks, chains of transmission and edition locators are dropped per the denoise contract; the attributions are preserved in the show-notes references instead.
  - Honorific formulae are not read aloud after every name. The source's repeated blessing formulae are carried by the narration itself, as in earlier episodes.
  - Quranic quotations are given as English translation with the reference in plain English, following the practice of every earlier episode in this volume; no Arabic script or transliterated formula is carried in the chapter text.
  - Never pair the leadership title with the personal name of the Father of Imams. He is named as Ali ibn Abi Talib, as the Father of Imams, or — where the source itself does so — as the Commander of the Faithful.
anchor_passages:
  - 'The saying transmitted through Hubayrah ibn Yarim: ''O Ali, you are my brother, my guardian, and my successor after me, and the father of my progeny.'''
  - 'The threat repeated to Yemen, to Ta''if and against Banu Wali''ah: ''or I will send to you a man like myself'' — completed each time by taking hold of a hand.'
  - 'Abu Dharr''s refusal to name him: ''It does not concern you, O ''Umar, nor your companion. He means the owner of the sandal.'''
  - 'The announcement made to a servant before the door opened: ''there will enter upon you now the Commander of the Faithful, the Master of the Muslims, the Best of the Guardians, and the First of all people to believe.'''
  - 'The task assigned at the door: ''so that you may hear my voice, relieve me of my burden, and make clear to the people the matters over which they will differ after me'' (chapter 16, verse 64).'
  - 'The criterion that governs the whole second section: ''My greatest virtues are those in which I played no part myself.'''
  - 'The refusal of authorship over the doors: ''By God, I did not do this — God did it.'''
  - 'The opponents'' calculation at the mutual invocation: ''if he is a prophet, we are destroyed; and if he is not a prophet, his own people will suffice against us.'''
  - 'The restriction on who could convey the declaration of acquittal: ''none may convey this on your behalf except Ali'' — and the answer to Abu Bakr, ''No, but it was revealed to him that only a man of his household should convey it.'''
  - 'The verse that answered the boast in the Sacred Mosque: ''Do you consider the watering of the pilgrim and the upkeep of the Sacred Mosque equal to those who believe in God and the Last Day and strive in the cause of God?'' (chapter 9, verses 19 to 22).'
  - 'The witness''s refusal of an unwitnessed pardon: ''I witnessed the curse. I did not witness the forgiveness.'''
  - 'The Prophet''s word to the informant: ''were it not that a sign from heaven has come down to me confirming the truth of your words, I would not have believed you over them'' (chapter 9, verse 74).'
  - 'The greeting at the graves before dawn: ''May you be congratulated for the state you have entered, compared with what the people now face — trials advancing like the dark waves of the night, each one worse than the last.'''
  - 'The choice announced at al-Baqi'': ''So I chose the meeting of my Lord and Paradise.'''
  - 'The last order and the reply to it: ''Bring me writing materials, and I will write you a document so that you will never go astray after me'' — ''We have the Book of God — it is sufficient for us.'''
  - 'Ibn Abbas''s verdict: ''The calamity — all of it, every bit of it — was what came between us and the writing of the Messenger of God'' (chapter 49, verse 2).'
