title: Abyssinia, the Negus, and the Parchment
audience: Listeners who have watched Mecca run out of arguments and now want to see what it did once abuse stopped working. No prior knowledge is assumed beyond the open call and the protector established in the previous episode. What this episode asks of them is attention to a single pattern — every escalation the opposition attempts recruits someone to the other side — and to one long speech delivered in a foreign court by a man who had to describe a religion to people who had never heard of it.
angle: faithful_narrative
episode_format: narrative
format_rationale: 'The slice is historical exposition organised around events: a persecution driving a migration, a letter to a foreign king, an embassy carrying gifts, two royal hearings, a rebellion, two conversions in Mecca, and a boycott document. There is a contested proposition in the middle of it — what the Muslims say about ''Isa ibn Maryam — but it is put and settled inside a single audience by a ruler''s judgment rather than argued back and forth by named parties across the chapter, and ''Amr ibn al-''As voices nothing like the sustained named-opposition-with-dialogue threshold. So narrative, not debate, and not deep_dive: no single doctrine is unfolded layer by layer here.'
host_dynamic: narrator + companion
host_dynamic_rationale: The narrator carries the crossing, the two hearings before the Negus and the drafting of the boycott, and recites Ja'far ibn Abi Talib's address to the king whole at the point it falls; the companion presses on how each Quraysh escalation produced its own answer — torture producing a migration, the migration producing a foreign protector, public abuse producing Hamza, a murder attempt producing a convert, and a boycott producing two clans in one valley behind one old man who still had not converted.
