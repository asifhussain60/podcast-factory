  section_title: Ja'far before the Negus
essential: core
essential_rationale: It carries the first migration of the Muslim community, the first full public statement of what Islam was — delivered to an outsider — and the boycott of Banu Hashim and Banu al-Muttalib, which sets the conditions for everything the next volume of this history narrates.
key_tensions:
  - Shelter sought from a faith that is not the same faith. Abu Talib writes to a Christian king arguing from the king's own scripture that Muhammad belongs in the series the king already accepts; the king weeps at the account of the mother of Jesus and says the two came from the same lamp. Then the Meccan envoy finds the exact place where the two do not agree and puts it to the throne.
  - An answer that cannot be softened without being false. Asked what they say about 'Isa ibn Maryam, the refugees huddle and ask each other what to say — and then lead with the hardest term available in that court, slave of God, before Messenger, Spirit and Word. The king measures the remaining distance with a stick picked up off the floor and rules it too small to hand anyone over.
  - Every escalation recruiting for the other side. Torture inside the clans produces the migration; the migration produces a foreign protector and a court's gifts sent back; public abuse produces Hamza, who declares the religion mid-assault; a prayer naming two enemies is answered when one of them arrives with a sword and leaves a Muslim; and the harshest measure Quraysh ever devised puts two whole clans into one valley together.
tone_constraints:
  - Third-person narrative report throughout, matching how the source narrates. Quoted speech appears only where the source supplies it; no dialogue, scene, or motive may be invented around it.
  - Ja'far ibn Abi Talib's address to the Negus is recited ALOUD AND WHOLE, both paragraphs, word for word as it stands in the chapter, before any discussion of it. It is the episode's set piece and must not be summarized, split, or paraphrased.
  - The passage recited to the Negus is identified only as a passage from the chapter of Maryam, as the source has it. No verse numbers are supplied and no text is reconstructed for it, because the source names none.
  - Honorific formulae are not read aloud after every name. The source's repeated blessing formulae are carried by the narration itself, as in the previous episodes of this series.
  - Abu Talib's verse in this slice — the letter to the Negus, the lines praising him, and the two poems on the boycott document — survives in damaged transmission and is carried at the level of its surviving sense. Do not reconstruct a line and do not repair a garbled name into the one it probably was. The same applies to Hamza's verse against Abu Jahl.
  - Never pair the leadership title with the personal name of the Father of Imams. Ja'far is named as Ja'far ibn Abi Talib, and his brother, where he is named at all, as Ali ibn Abi Talib.
anchor_passages:
  - Ja'far ibn Abi Talib's address to the Negus, recited whole, from 'O king, we were a people of ignorance' through 'we hoped that we would suffer no injustice in your presence, O king.'
  - 'The Negus refusing the Meccan embassy before hearing anyone: ''I will not hand over to them a people who have come near me and chosen me over all others, until I invite them and hear what they have to say.'''
  - 'The answer on ''Isa ibn Maryam and the king''s ruling on it: ''We say that he is what our Prophet brought to us — a slave of God, His Messenger, His Spirit, and His Word, which He conveyed to the Virgin Mary.'' — ''What separates ''Isa ibn Maryam from what you have just said is no more than this stick.'''
  - 'The gifts returned: ''What need do I have of them? God did not take a bribe from me when He restored my kingdom to me, so I will not take a bribe from Him.'''
