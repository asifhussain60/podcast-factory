thesis_relevance: This chapter advances the book's central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents' record, by showing the household of Abu Talib carrying the mission beyond Arabia — a father writing to a foreign king that Muhammad is the counterpart of Moses and the Messiah, and a son of that house speaking for the whole community before a throne — while the clans that would later contest the succession are the ones drafting the boycott.
