show_notes:
  blurb: 'When Mecca finally made life unlivable, eighty-three men and their families crossed the sea to a Christian king — and the argument that saved them there was an argument about Jesus. Quraysh sent two envoys after them with enough wealth to buy the entire royal court, and bought it; the court advised the king to hand the refugees back unheard. He refused, on the grounds that these people had chosen him, and called them in with his bishops'' scriptures spread open on the floor. This episode covers what was said in that hall: a speech by Ja''far ibn Abi Talib, recited whole, that answered the charge of abandoning his people by itemizing what the religion of his people had actually consisted of; a recitation from the chapter of Maryam that left a court in tears; and then the second hearing, when the Meccan envoy came back having found the one question on which the Muslims could not shade the truth. It closes back in Mecca, with two conversions that changed the town''s arithmetic — an uncle who announced the religion in the middle of hitting a man with a bow, and a man who set out with a sword to commit a murder — and with the document Quraysh wrote when nothing else had worked, hung inside the hollow of the Ka''bah.'
