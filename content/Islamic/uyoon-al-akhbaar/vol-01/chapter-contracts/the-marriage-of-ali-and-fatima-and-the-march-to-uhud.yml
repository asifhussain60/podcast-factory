title: Fatima's Marriage, Then Uhud
audience: Listeners who have followed this community from a single household in Mecca to a victory in the field and now watch it lose. No prior knowledge is needed beyond the outcome of Badr and the names of the Prophet's household. What this episode asks of them is to hold a wedding and a defeat in the same frame, because the source places them side by side and the dowry it records is the link between them.
angle: faithful_narrative
episode_format: narrative
format_rationale: 'The slice is narration end to end: a marriage negotiated by three companions and ratified from above, a wedding feast, then a war council, a dream, a disputed decision, a defection, an array of forces, and a battle told through named men and single encounters. The only extended exchanges are the cross-field shouts at Uhud and the challenge of Talha ibn Abi Talha — short altercations inside events, not a sustained contest over a proposition — and no single doctrine is unfolded layer by layer, so this is neither debate nor deep_dive.'
host_dynamic: narrator + companion
host_dynamic_rationale: The narrator carries the proposal, Gabriel's announcement, the dowry conversation, the feast and the procession, then the council, the march, the array with the fifty archers, and the fighting through Hamza's death to the three battalions, at the pace the source sets it down; the companion presses on how much of the defeat was foretold before anyone marched — the dream that named a household death, the order written to cover the exact moment it was disobeyed, and the plan the community overruled and then tried to hand back too late.
debate: null
host_dynamic_custom: null
length_target: extended
essential: core
essential_rationale: It carries the marriage that founds the household this whole history is written around, including the claim that it was contracted at the hour Adam and Eve were joined, and then the entire Uhud narrative — the vision, the overruled counsel, the defection of a third of the army, the archers, the killing of Hamza, and Ali alone beside the wounded Prophet.
key_tensions:
  - A marriage proposed by three companions and answered as something already contracted. 'Ammar, al-Zubayr and Sa'd raise it because Ali has no wife and no child and cannot bring himself to ask; the answer that comes back dates the marriage to the hour Eve was married to Adam and says it had already been made known in what is better than creation.
  - A dowry cut down to the metal. Four items are offered and three are sent back — keep the horse, for it is for riding and raiding, keep the slaves, surrender none of your weapons, bring only the gold and silver. Thirteen months later those weapons are what is left standing beside the Prophet.
  - The Prophet's military judgment overruled by his own community, and the reversal refused. He advises staying inside the city; the argument against him is that the women would watch the fighting; when they see his anger and offer him the decision back, he answers that a prophet who has taken up his weapon does not turn back until he has fought.
  - A defection justified by having been right. 'Abd Allah ibn Ubayy agrees with the Prophet's plan, is overruled with him, and then withdraws a third of the force on the grounds that his advice was ignored.
  - A battle lost over a bookkeeping grievance from the previous one. The fifty archers are ordered to hold whether the day goes for them or against them, and they leave for the spoils saying they missed the plunder at Badr.
  - Quraysh's standard ends in the hands of the two categories their honour code excluded. A woman raises it after the bearer is killed, then a slave carries it until he dies asking whether he has been excused — and the poet of Medina attacks them for it rather than crediting either.
  - The killing of the Prophet's uncle arranged as a private transaction. Wahshi is promised his freedom by one man and a reward by one woman, and throws from behind a tree; the army's commander is not party to either offer.
tone_constraints:
  - Third-person narrative report throughout, matching how the source narrates. Quoted speech appears only where the source supplies it; no dialogue, scene, or motive may be invented around it, and no detail of the fighting beyond what the source states.
  - Where the source gives two readings it keeps both. The battle is dated to a Saturday in Shawwal and the day of fighting is twice called a Sunday; the marriage is placed after Badr with the alternative view named and the majority identified. Neither may be resolved.
  - Chains of transmission are not narrated. The reports from Ibn 'Abbas, from Asma' bint Umays and from Anas ibn Malik are attributed simply to their narrators; the isnad apparatus and the source's footnote locators are book-object provenance and are dropped.
  - Hassan ibn Thabit's verses on the standard-bearer and on 'Umra bint 'Alqama survive in damaged transmission and are carried at the level of their surviving sense. Do not reconstruct a line and do not repair a garbled name.
  - Honorific formulae are not read aloud after every name. The source's repeated blessing formulae are carried by the narration itself, as in the previous episodes of this series.
  - Badr was narrated in full two episodes ago and the death of Khadijah in the year of sorrow before that. Both appear here only as callbacks — never a second telling.
  - Never pair the leadership title with the personal name of the Father of Imams. He is named as Ali ibn Abi Talib, or as the Father of Imams, throughout.
anchor_passages:
  - 'Gabriel''s announcement: ''I have married Fatima to Ali in the same hour that Eve was married to Adam, and this was in My judgment, and I had already made it known in what is better than My creation.'''
  - 'The dowry instruction: ''do not let the horse go from your hand, for it is for riding and raiding... Do not give up your horse, and do not surrender any of your weapons. But bring whatever gold and silver you have.'''
  - 'Asma'' and the tambourine: ''I feared she might say to herself, my mother has died and there is no one left to delight me'' — and the correction, ''say the like of that, and do not say farewell.'''
  - 'The prayer over the house: ''O God, protect the people of this house, bless them, and bestow Your blessings upon them wherever they may be.'''
  - 'The vision: ''I saw a cow, I saw something in the flat of my sword, and I saw that I put my hand into a fortified coat of mail'' — with the cow read as companions killed and the sword as a man of his household.'
  - 'The refusal to turn back: ''Once a prophet has armed himself for his community and taken up his weapon, he does not turn back until he has fought.'''
  - 'The order to the archers: ''keep the horses away from us — let them not come at us from behind, whether the battle goes in our favour or against us. Do not leave your positions.'''
  - Talha ibn Abi Talha's challenge and its answer, ending with 'when he invoked God and pleaded for mercy, I was too ashamed to kill him, so I left him knowing he would not survive.'
  - 'Abu Sufyan''s cry and the reply: ''Hanzala for Hanzala'' — ''God is most high and most mighty. Are our slain in Paradise while your slain are in the Fire?'''
  - 'Ali beside the wounded Prophet: ''Where shall I go, O Messenger of God? I will not turn back a disbeliever after having become a Muslim.'''
