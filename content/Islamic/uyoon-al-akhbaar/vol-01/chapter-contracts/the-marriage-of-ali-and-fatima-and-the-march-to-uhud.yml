show_notes:
  blurb: 'Between the battle they won and the battle they lost, this history stops to count the dishes at a wedding — one ram, some flour, some dates, and sixteen hundred people fed and counted. Three companions raise the marriage because the bridegroom has no wife, no child and cannot bring himself to ask; the answer that comes back is that it was contracted at the hour Adam and Eve were joined. Then the dowry is edited: keep the horse, keep the weapons, hand over the gold. Thirteen months later you find out why. Quraysh spend the caravan money on an army and bring their women along on purpose so the men cannot run. The Prophet describes a dream that names the cost — many companions dead, and one man of his own household — advises staying inside the city, and is outvoted; when the community loses its nerve and offers him the decision back, it is already too late. A third of the army goes home on the road. The sword goes to the man who asked what a sword''s right was rather than to the man who asked for the sword. And then fifty archers, ordered to hold whether the day went for them or against them, walk off the hill after the plunder because they felt short-changed at Badr — and everything that follows comes through that gap.'
