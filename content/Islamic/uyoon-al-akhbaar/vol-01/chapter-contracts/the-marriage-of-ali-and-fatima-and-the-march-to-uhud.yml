thesis_relevance: 'This chapter advances the book''s central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents'' record, by founding that line as an event: a marriage refused to two of the Prophet''s closest companions, granted to Ali by an announcement dating it to the hour of the first marriage in creation, and blessed over the people of that house wherever they may be. The Uhud narrative then puts the same man alone beside the wounded Prophet, refusing to read an order to advance as leave to withdraw.'
