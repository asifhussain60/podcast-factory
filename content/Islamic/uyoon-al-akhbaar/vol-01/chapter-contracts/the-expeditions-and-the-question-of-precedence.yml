key_tensions:
  - A scout who must let two arrows go into him without moving, saved by the archer's own ordinary reasoning about what a living thing would do.
  - A raid that lands on people who had already accepted Islam, corrected not by punishment but by a second party sent to hand every item back.
  - A man who kills to order and is paid in an object with no earthly value, and who has it buried with him.
  - A mission to assassinate the chief of Mecca that fails completely and is recorded in full anyway.
  - A man killed in the field a moment after saying the sentence that admits him, answered by a rule that takes the judgement out of the raider's hands.
  - A greeting of peace on a road answered with a killing over a grudge from before Islam, and a verse that names the motive as the goods of this world.
  - An ordinary settlement in blood money, and on top of it a prayer against the killer that this history says was staged as an example rather than earned as a verdict.
  - A commander told plainly that there is no money for his dowry, and paid from the spoils of an operation sent out for something else entirely.
  - Five warnings about how a community rots from inside, followed immediately by four prohibitions given to a man about to leave with an army.
  - A captive released before he believes anything, who converts, then uses his new position to starve Mecca of grain and is overruled by the man he thought he was serving.
  - Two of the three most senior men in Islam praying for weeks behind a young commander, in a report nobody disputes.
  - 'An argument that concedes all the facts and simply applies the other side''s own rule: if leading the prayer designates a successor, the successor is ''Amr ibn al-''As.'
  - A man advised never to take charge of two Muslims, standing years later before the same man who now has charge of all of them.
  - A fear of division named as the reason, and answered with the claim that the fear produced the thing it feared.
tone_constraints:
  - Third-person narrative report throughout, matching how the source narrates, except where the source itself supplies a first-person field report — Jundub ibn Mukayth, 'Abd Allah ibn Anis, 'Ubadah ibn al-Samit, 'Amr ibn Umayyah, Ibn Abi Hadrad and Rafi' ibn Abi Rafi' — which stays in the speaker's voice.
  - 'The source''s own filing distinction is kept: these are detachments dispatched under other commanders, set apart from the campaigns already narrated. The list order is the source''s own except where noted in the rationale.'
  - The verse attached to the raids of 'Abd Allah ibn Rawahah and 'Abd Allah ibn Anis, to the captives of Banu al-'Anbar, and to the killings of Abu 'Afak and Asma' bint Marwan is severely damaged in this manuscript. It is carried at the level of surviving sense with the damage named — no line reconstructed, no garbled name repaired.
  - Killings ordered against named individuals are reported exactly as the source reports them, without embellishment, invented motive, or added justification, and without dwelling beyond what the source supplies.
  - Footnote apparatus, manuscript sigla, folio marks, chains of transmission and edition locators are dropped per the denoise contract; the attributions are preserved in the show-notes references instead.
  - Honorific formulae are not read aloud after every name. The source's repeated blessing formulae are carried by the narration itself, as in earlier episodes.
  - The saying that Ali stands to the Prophet as Aaron stood to Moses, the martyrdom of Zayd ibn Haritha at Mu'tah, and the day of Dhu Qarad were all taught earlier in this history. Each appears here only as a one-line callback in fresh words and is never re-expounded; the argument built on the first of them in this episode is new.
  - Never pair the leadership title with the personal name of the Father of Imams. He is named as Ali ibn Abi Talib, as the Father of Imams, or — where the source itself does so — as the Commander of the Faithful.
anchor_passages:
  - 'The archer''s reasoning that saved the scout: ''If it were a living thing it would have moved — my arrows have found it.'''
  - 'The reward that cannot be spent: ''This will be a sign between me and you on the Day of Resurrection.'''
  - 'The ruling that came after the killing of Mirdas ibn Nuhayk: those who say there is no god but God are not to be fought.'
  - 'The verse on the greeting: ''And do not say to one who greets you with peace, You are not a believer, seeking the goods of this worldly life'' (chapter 4, verse 94).'
  - 'The correction of the obvious inference: ''By God, the earth accepts those far more wicked than him, but God wished to make an example for you in the sanctity of what I have forbidden you.'''
  - 'The four prohibitions tied on with the turban: ''Fight those who disbelieve in God. Do not be treacherous. Do not mutilate. Do not kill children. This is the covenant of God and the way of His Prophet with you.'''
  - 'The complaint that ended the embargo: ''You command the bonds of kinship, and yet you have severed ours.'''
  - 'The argument from the expedition of Chains: ''''Amr ibn al-''As has a stronger claim to the leadership than Abu Bakr by that reasoning, for the Messenger of God appointed ''Amr to lead them in prayer.'''
  - 'The second half of that argument: the Messenger of God never appointed anyone over Ali ibn Abi Talib, and no one led prayer over him save the Messenger of God himself.'
  - 'The counsel and the question it produced years later: ''I advise you never to take command over two Muslim men'' — ''Abu Bakr, did you not release me from commanding two Muslim men?'''
  - 'The answer given and the answer returned: ''I find no justification for it, but I feared division for the community of Muhammad'' — ''by my life, he brought about the very division he feared.'''
  - 'The pattern named in advance: ''You will follow the ways of the nations before you, span by span and cubit by cubit and rung by rung — even if they had entered the burrow of a lizard, you would have entered it.'''
