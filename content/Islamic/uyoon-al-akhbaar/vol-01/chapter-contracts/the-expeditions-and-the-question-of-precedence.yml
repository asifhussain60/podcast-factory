title: The Expeditions and Precedence
audience: 'Listeners who have just watched the ninth year conducted by letter and covenant and now meet the other half of the same period. No prior knowledge is needed beyond the shape of the community by this point: a settled Medina sending out small parties under other men''s command. What this episode asks of them is to follow a list rather than a story — a dozen short operations, several told by the men who went — and then to see the whole list turned into an argument by a single administrative detail about who led the prayer on one of them.'
angle: faithful_narrative
episode_format: narrative
format_rationale: 'Roughly two thirds of the slice is a bare catalogue of dispatched detachments, several of them first-person field reports, with no doctrinal dispute in sight. The closing section does carry a contested proposition — whether leading the prayer designates the leader of the community — and names the parties, but the opposing side never speaks: its claim is reported in a clause and answered by the author, and the only dialogue is Rafi'' ibn Abi Rafi''s exchange with Abu Bakr, which the source quotes as evidence rather than as a contest. The spine of the slice is the expedition list, so this is narrative rather than debate.'
host_dynamic: narrator + companion
host_dynamic_rationale: The narrator carries Jundub's account of lying still under two arrows and the torrent at Qadid, the raid on Fadak and the land given to Fatimah as ransom, the recovery expedition that returned the plunder taken from Muslims, the staff given to 'Abd Allah ibn Anis and buried with him, the sea creature and the rib a rider passed under, 'Amr ibn Umayyah's failed mission into Mecca, the killing of Mirdas after the declaration, the case of 'Amir ibn al-Adbat and Muhallim ibn Jathamah, the five warnings and the four prohibitions tied on with a turban, Thumamah's release and his embargo, and then the prayer at al-Silsil with Abu Bakr's own two reports; the companion presses on why so many of these rules arrive only after the harm, on what a staff is worth to a man who is given nothing else, and on how one detail about who stood in front at prayer becomes the chapter's argument about the succession.
