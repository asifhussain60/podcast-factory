show_notes:
  blurb: 'If a man raiding your camp says, in the second before your blow lands, the one sentence that makes him one of you — what then? This episode gathers the small detachments of the closing years, the parties sent out under other men''s command and kept separate from the campaigns the Prophet led himself. Several are told by the men who went, and they are the plainest narration in the volume: a scout who takes two arrows and cannot move, a valley that floods with no cloud in the sky, a raid that lands on people who were already Muslims and is repaired item by item, a killer paid in a staff whose only value is a promise about the Day of Resurrection, a company that lives twenty nights on a creature the sea gave them, and two men who fail entirely to assassinate the chief of Mecca and have the failure written down in full. Then the cases where a rule came out of the damage — a man killed after declaring the faith, a greeting of peace answered with an old grudge, a commander sent out with four prohibitions tied on with his turban, a captive fed before he believed and overruled after he did. And finally one administrative detail that stops the chapter: on one expedition a young commander led the prayer for weeks with Abu Bakr, ''Umar and Abu ''Ubaydah in the rows behind him. If leading the prayer names the next leader, this history asks, then whose name does it name — and what do you do with the man''s own admission, years later, that he could find no justification but feared the community would split?'
