thesis_relevance: 'This chapter advances the book''s central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents'' record, by turning the opponents'' own strongest argument against itself: if leading the prayer in the Prophet''s lifetime designates the leader of the community, then the expedition of Chains designates ''Amr ibn al-''As — while the man this history follows was never placed under another''s command and never had anyone but the Prophet lead a prayer before him, and the division that was offered as the reason for setting his appointment aside is the division that followed.'
