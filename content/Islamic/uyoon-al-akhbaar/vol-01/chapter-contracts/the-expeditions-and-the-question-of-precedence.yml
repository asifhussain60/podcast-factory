essential: core
essential_rationale: It carries the ruling that those who declare there is no god but God are not to be fought, the four prohibitions given to a commander as standing law, and the chapter's central argument — that if leading the prayer designates a successor it designates 'Amr ibn al-'As, that the man this history follows was never placed under anyone's command, and that the division Abu Bakr said he feared is the one his choice produced.
