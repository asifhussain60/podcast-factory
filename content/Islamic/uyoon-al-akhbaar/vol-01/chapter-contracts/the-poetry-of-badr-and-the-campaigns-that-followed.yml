thesis_relevance: 'This chapter advances the book''s central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents'' record, by showing the tradition preserving its own inconvenient evidence: an uncle recorded both as a Badr captive professing faith and as a secret believer beforehand, and a cousin of the Prophet given full space to grieve the enemy dead. It is also where Ali is named urging entry against Banu Qaynuqa'' during the settlement of accounts that fills the year before Uhud.'
