show_notes:
  blurb: 'The battle is over; this is the week after, and it opens in the city that lost. A slave carving cups by the well hears a defeated commander explain the defeat by white horsemen nobody could fight, says out loud that they were angels, and gets a beating for it — ended by the lady of the house with a tent-pole. The Prophet''s uncle is argued into belief not by doctrine but by having his own instructions to his wife about his estate quoted back to him. Then the history stops narrating altogether and prints the poetry of Badr: nine poems and fragments, most of them damaged in transmission, including a love-prelude that turns into a reproach of a named survivor, an elegy that praises a dead fighter entirely for his cooking pot, and one poem by the Prophet''s own cousin that praises him and mourns the enemy dead in the same breath and begs the clans to stop. Then the year in between: four expeditions, three of which meet nobody, one named after the flour the raiders dropped while running away; an enemy commander briefed on the state of Medina over a cup of water inside the city''s own confederacy; a market insult that becomes a fifteen-night siege and ends with a hypocrite''s plea granted; and a poet killed at night by his milk-brother, who spent an hour teaching him to be comfortable with a hand in his hair.'
