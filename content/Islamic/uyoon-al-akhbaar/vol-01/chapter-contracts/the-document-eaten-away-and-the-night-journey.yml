thesis_relevance: This chapter advances the book's central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents' record, by carrying the household's own corrections into the narrative — al-Husayn refusing the account that the call to prayer began in another man's dream, the angel made in the likeness of Ali ibn Abi Talib, and the report that when the last protector was buried there was nobody left to shelter the Prophet except the successor this history has been naming from its opening pages.
