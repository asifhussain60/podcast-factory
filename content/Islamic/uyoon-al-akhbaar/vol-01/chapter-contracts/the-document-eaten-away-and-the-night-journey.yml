length_target: extended
essential: core
essential_rationale: It carries the end of the boycott, the night journey and the origin of the five daily prayers, and the deaths of Abu Talib and Khadijah — the losses that make the search for a new refuge, and ultimately the migration, unavoidable.
key_tensions:
  - A pact that could only be enforced as a performance. The blockade held for three years on paper while food came through by night from a man too well protected to touch; its enforcer took a beating over a smuggled load and his own side suppressed the story; and when five men from five clans agreed on an order of speaking, it fell in a single morning to nothing but consecutive refusals.
  - Two accounts of the same event that never meet. The document is repudiated by a conspiracy that had been assembled for weeks, and independently reported eaten of every name of God — the injustice, the severance and the falsehood left legible — with the whole dispute staked in public on that being true before anyone unrolled it.
  - A vindication that cost followers. He led the prophets in prayer at Jerusalem and ascended by a ladder every dying person looks toward; the daily prayers were settled at five because Moses kept sending him back on the evidence of what he had watched his own people do; and when he described the journey at home some accepted, some called him a liar, and some left the religion — after which the revelation called the whole thing a trial rather than a proof.
  - A word withheld for the same reason it was worth having. Abu Talib declines the testimony on his deathbed not because he disputes it but because of the reading that would be put on its timing — and the record then keeps two incompatible testimonies side by side, a brother who says he heard it and a nephew who says he did not, without adjudicating between them.
tone_constraints:
  - Third-person narrative report throughout, matching how the source narrates. Quoted speech appears only where the source supplies it; no dialogue, scene, or motive may be invented around it.
  - Honorific formulae are not read aloud after every name. The source's repeated blessing formulae are carried by the narration itself, as in the previous episodes of this series.
  - The verse in this slice — Abu Talib's appeals to Abu Lahab, his two poems on the torn document, Ali ibn Abi Talib's lament and Hamza's lament — survives in damaged transmission and is carried at the level of its surviving sense. Do not reconstruct a line and do not repair a garbled name into the one it probably was.
  - The question of whether Abu Talib accepted Islam at the end is reported as the source reports it — as a claim, with both testimonies preserved and neither endorsed. The hosts must not settle it.
  - Never pair the leadership title with the personal name of the Father of Imams. He is named as Ali ibn Abi Talib throughout.
  - The drafting of the boycott parchment and the conversions of Hamza and 'Umar were covered in full in the previous episode. Refer back to them in a sentence where the account requires it; do not re-narrate them.
anchor_passages:
  - 'Abu al-Bakhtari re-describing the smuggled cargo: ''This is food belonging to his aunt that she had left with him — he is sending it to her. Are you going to prevent a man from bringing food to his aunt? Get out of this man''s way.'''
  - 'The Prophet''s announcement to his uncle: ''O uncle, my Lord has sent a small creature against the document of the Quraysh, and it has eaten away every name of God that was in it, leaving only the injustice, the severance of ties, and the falsehood in it.'''
  - 'Moses sending him back: ''Return to your Lord and ask Him to lighten the burden upon your community, for I have seen what the Children of Israel were like — even when the commandments were revealed to them, they rejected them.'''
  - 'Abu Talib''s refusal of the word: ''O son of my brother, were it not that it would be said I spoke out of fear as death approached, I would have said it.'''
  - 'The measure of what was lost: ''The Quraysh had never visited upon me anything I found hateful — until Abu Talib died.'''
