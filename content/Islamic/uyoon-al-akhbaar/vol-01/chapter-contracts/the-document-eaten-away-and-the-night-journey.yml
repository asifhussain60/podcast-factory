title: The Document and the Night Journey
audience: 'Listeners who watched two clans walk into a valley behind a man who never converted, and now want to know how they got out and what it cost. No prior knowledge is assumed beyond the boycott established in the previous episode. What this episode asks of them is patience with a deliberate double vision: every turn in it is explained twice, once by what men arranged among themselves and once by something the men in the account could not reach, and the author never collapses the two into one.'
angle: faithful_narrative
episode_format: narrative
format_rationale: 'The slice is historical exposition organised around events: three years of blockade, a smuggling operation, a street assault, a mockery campaign, a five-man conspiracy that unmakes the boycott in one morning, the night journey and the fixing of the daily prayers, and two deaths a few days apart. Named disagreement does surface — al-Husayn''s correction on the origin of the call to prayer, and the divided testimony over whether Abu Talib spoke the word at the end — but each is settled or left standing inside a few lines rather than argued back and forth, so nothing approaches sustained named-opposition-with-dialogue. Not deep_dive either: no single doctrine is unfolded layer by layer; the spine is the sequence of events.'
host_dynamic: narrator + companion
host_dynamic_rationale: The narrator carries the blockade, the night the document was repudiated, the Isra' and Mi'raj reports, and the deathbed scene, and delivers the Prophet's announcement about the parchment and the reduction of the fifty prayers as the set pieces they are; the companion presses on the double causation running through the whole episode — a boycott beaten by a conspiracy and by a creature, an obligation fixed in heaven and then argued down by an earlier prophet, and a protection removed by nothing more remarkable than two ordinary deaths.
