show_notes:
  blurb: 'A boycott that lasted three years in a valley that grew nothing was beaten twice over, and the two victories never touch each other. Five men from five different clans met at night at the head of a pilgrim track, agreed on an order of speaking, and dismantled the pact the next morning by refusing it out loud one after another until its author had nobody left to answer. And separately, the parchment hanging inside the Ka''bah was reported eaten of every name of God, with the injustice and the severed kinship left legible — a claim staked in public and checked on the spot. This episode also carries the night journey to Jerusalem and the ascent beyond it, the account of how fifty daily prayers became five at the insistence of an earlier prophet arguing from his own community''s failure, and the year that took both of the people who had made Mecca survivable: an uncle who refused the testimony to the end for the sake of what refusing it had bought, and a wife who died three days after him.'
