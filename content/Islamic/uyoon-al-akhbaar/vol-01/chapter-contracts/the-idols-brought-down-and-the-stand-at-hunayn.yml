key_tensions:
  - 'A refusal answered not by rank but by capacity: the whole population of the earth could not do what one man is being asked to do, and what he is asked to do is stand still.'
  - A landing explained as a second ascent — the man went up on the shoulders of the Messenger and came down on the shoulders of the one who brings the revelation.
  - A shrine's last custodian who neither fights nor removes the object, but hangs his own sword on the goddess and asks her to defend herself.
  - An argument won by the man in the litter and lost anyway, because the men would rather agree with a commander who threatens suicide than let an old man have influence.
  - 'A polytheist arming the army that took Mecca from his own people, on the strength of one stated term: a guaranteed loan, to be returned in full.'
  - Days after the idols shattered, a request for a tree of their own — answered with a people brought through the sea who asked for a god because other people had gods.
  - 'A rout recorded with no coward named: the book''s own verdict is that under those conditions no one could be blamed.'
  - The only battle in this volume where the community's own strength is charged against it — your great numbers pleased you but availed you nothing.
  - 'A recovery achieved by voice rather than manoeuvre: five vocatives ending in the names of an oath, answered from every direction, with men throwing themselves off mounts they cannot turn.'
  - A proposal from inside the army to kill those fleeing as well as those fighting, refused in four words that do not argue with it.
  - 'A dying counsellor teaching his own killer how to strike, and a debt surfacing in the mouth of that killer''s mother: he freed three of your mothers.'
  - The clearest rulings of the campaign issued over a body on the ground, not over a victory — no child, no woman, no hired labourer.
  - A foster sister proved by a bite mark, offered a place in the household, and given instead exactly what she asked for.
tone_constraints:
  - Third-person narrative report throughout, matching how the source narrates. Quoted speech appears only where the source supplies it; no dialogue, scene or motive may be invented around it.
  - Where the source's arithmetic or enumeration does not resolve it is left standing. The march-out figures (ten thousand, plus two thousand of Mecca, plus ten thousand companions) and the list of five who stood — which does not add cleanly to five and carries a variant reading — are both preserved unresolved.
  - The poetry of Duraid ibn al-Sammah, 'Abbas ibn Mirdas al-Sulami, Malik ibn 'Awf, Bujayr ibn Zuhayr and the guardian of al-'Uzza has come down in the worst condition of anything in this volume. It is carried at the level of surviving sense with the damage named — no line reconstructed, no garbled name repaired.
  - Footnote apparatus, manuscript sigla, folio marks and edition locators are dropped per the denoise contract; the attributions are preserved in the show-notes references instead.
  - Honorific formulae are not read aloud after every name. The source's repeated blessing formulae are carried by the narration itself, as in earlier episodes.
  - The pledge of al-Ridwan and the tree it was sworn under, the death of Shayba's father at Uhud, Khalid's massacre at Bani Judhimah, and the audience refused to Abu Sufyan ibn al-Harith on the road to Mecca were all taught earlier in this history. Each appears here only as a one-line callback in fresh words.
  - Never pair the leadership title with the personal name of the Father of Imams. He is named as Ali ibn Abi Talib, as the Father of Imams, or — where the source itself does so — as the Commander of the Faithful.
anchor_passages:
  - 'The lift and the answer to the refusal: ''O Ali, even if all the people of the earth were gathered and tried to carry me for as long as they could, they could not do what I command you to do.'''
  - 'The landing: ''I did not expect to land so well from such a height'' — ''You stood upon the shoulder of Muhammad, and I descended upon the shoulder of Jibril.'''
  - 'Duraid''s reading of the camp by ear: ''What is this I do not hear? No lowing of camels, no braying of donkeys, no crying of children, no wailing of women?'''
  - 'His verdict on the plan: ''By God, you think like a shepherd of sheep. Does a routed man ever save anything? In the end, nothing helps a man but his own sword and spear.'''
  - 'The loan from Safwan: ''O Muhammad, is this by compulsion?'' — ''It is a guaranteed loan, to be returned to you in full.'' — ''In that case, there is no objection.'''
  - 'The rebuke at Dhat Anwat: ''you have said what the people of Moses said to Moses: Make for us a god as they have gods. He said: You are a people who are ignorant'' (chapter 7, verse 138).'
  - 'The call in the rout: ''Come to me. Where are you going? I am the Messenger of God. I am Muhammad ibn ''Abdullah.'''
  - 'The verse on the day of Hunayn: ''when your great numbers pleased you but availed you nothing, and the earth, vast as it is, seemed to close in upon you'' (chapter 9, verses 25 to 26).'
  - 'Al-''Abbas''s summons: ''O people of the Tree. O people of the Pledge of al-Ridwan — come to your Prophet'' — answered from every direction with ''Labbaik. Labbaik.'''
  - 'Umm Sulaym on the field and the answer to her: ''kill those who flee from you, as you kill those who fight you, for they deserve it'' — ''O mother, God is sufficient.'''
  - 'Duraid instructing his killer: ''Your mother has given you a poor weapon. Take that sword from behind the litter... for that is how I used to strike men'' — and the mother''s answer, ''By God, he freed three of your mothers.'''
  - 'The prohibition issued over the killed woman: ''The Messenger of God forbids the killing of a child, a woman, or a hired labourer.'''
  - 'Al-Shayma''s proof and her choice: ''A bite you gave me on my back when I was carrying you'' — ''Rather, provide for me and return me to my people.'''
  - 'The closing line of the chapter: ''When the uncle of your Prophet and his guardian stood and called: O battalion of faith, where are those who answered their God on the day of al-Ara''id and al-Ridwan?'''
