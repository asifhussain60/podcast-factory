show_notes:
  blurb: How long does it take a community that has just watched the idols of Mecca shatter to ask for a sacred tree of its own? This episode opens the morning after the conquest, with the Ka'bah still ringed by the objects the sermon had made unthinkable and a man being lifted onto prophetic shoulders to clear the roof — and coming down with an explanation for his own landing that relocates the whole scene. Then the pull the other way, twice over. A confederation musters to defend the shrines, its wisest voice carried in a litter and overruled by a commander who threatens to fall on his own sword; and on the road, men who watched the idols break ask for a tree they can hang their weapons on, and are answered with a people brought through the sea who asked for a god because other people had gods. At Hunayn the largest army this community has ever fielded is ambushed in the dark and breaks as one man, and the verse revealed about it names the cause as the pleasure the army took in its own numbers. What stands is a single household; what turns the battle is a voice calling men back by the names of oaths they had already sworn. And the clearest rulings of the whole campaign come afterwards, out of the wreckage — over a woman's body on the ground, in the mouth of a killer's mother, and in a bite mark on the back of a foster sister nobody believed.
