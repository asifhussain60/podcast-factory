essential_rationale: It carries the clearing of the Ka'bah with the saying about the shoulder of Muhammad and the shoulder of Jibril, the rebuke at Dhat Anwat, the day of Hunayn with the verse revealed about the rout, the five of Banu 'Abd al-Muttalib who stood and Ali's felling of the enemy standard, al-'Abbas's call that turned the battle, and the rulings forbidding the killing of children, women and hired labourers.
