title: Breaking the Idols, Holding at Hunayn
audience: 'Listeners who have just watched Mecca change hands without a battle and now follow what came next: the clearing of the sanctuary, and the confederation that marched to answer it. No prior knowledge is needed beyond the conquest itself and the pledge sworn under the tree at al-Hudaybiyah. What this episode asks of them is to sit with a rout — the only one in this volume where the community''s own strength is named as the cause — and with the rulings that come out of the aftermath rather than out of the victory.'
angle: faithful_narrative
episode_format: narrative
format_rationale: 'The slice is narrated event and reported speech throughout: the clearing of the Ka''bah roof, the demolition of a shrine, an enemy war council, a loan of arms, a night ambush, a rout and its reversal, a pursuit, and a roll of the fallen. The one sustained disagreement — Duraid ibn al-Sammah against Malik ibn ''Awf over whether the families should march with the army — is a single council scene well under a tenth of the chapter, and it is settled by a threat and a preference rather than adjudicated, so this is narrative rather than debate.'
host_dynamic: narrator + companion
host_dynamic_rationale: The narrator carries Ali on the Prophet's shoulders and the saying about the shoulder of Jibril, the demolition of al-'Uzza and its guardian's verses, the Hawazin muster with Duraid's refused counsel, Safwan's guaranteed loan, the request for a tree at Dhat Anwat answered with chapter 7 verse 138, the ambush and the rout with chapter 9 verses 25 to 26, the five who stood and al-'Abbas's call, Ali striking the standard-bearer, Umm Sulaym and her dagger, the killing of Duraid, the prohibition on killing the vulnerable, and al-Shayma' recognised by a bite mark; the companion presses on why the verse charges the army's own numbers against it, on why the book refuses to blame anyone for the flight, and on why a chapter about twelve thousand men ends by naming two.
