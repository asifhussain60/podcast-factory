thesis_relevance: This chapter advances the book's central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents' record, by making Ali ibn Abi Talib the one who clears the idols from the roof of the Ka'bah on the Prophet's own shoulders, the one whose sword is out at the centre when twelve thousand men break at Hunayn, and the one who fells the enemy standard that ends the enemy's stand — and by closing the source chapter on the two men named only by title, the Prophet's uncle and his guardian.
