thesis_relevance: This chapter advances the book's central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents' record, by placing Ali ibn Abi Talib at every hinge of the conquest — bearing the banner into the city after it was taken from Sa'd ibn 'Ubadah, executing the one sentence nobody else would carry out, receiving and returning the key of the Ka'bah, and being sent to undo Khalid's massacre with a restitution paid down to the value of a dog's bowl — and by carrying the verse that ranks belief and striving above the two hereditary offices of the sanctuary.
