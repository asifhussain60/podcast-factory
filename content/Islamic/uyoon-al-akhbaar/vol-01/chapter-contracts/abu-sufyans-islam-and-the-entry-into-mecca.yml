key_tensions:
  - 'A rescue and an arrest performed by the same act: a man is carried to safety into the camp of the army about to take his city, on a pledge nobody has yet given.'
  - A profession of faith recorded together with its condition — faith or the sword — with neither half softened nor annulled.
  - Kingship corrected to prophethood in a single noun, and conceded not by argument but because the other word could no longer be held.
  - A grant made to flatter one man that functions as an evacuation plan for a whole city, and works because he was proud enough to announce it first.
  - Two lines of verse that cost a commander his wing at the gate, not for boasting but for announcing the wrong rule about the sanctuary.
  - 'A rule and its own undoing on the same page: fight nobody who does not fight you, except a named few — and then the exception handed to whoever finds them.'
  - A silence that was the standing order, read as hesitation; and a refusal to supply the wordless signal that would have resolved the doubt.
  - A sword wrested from a brother's hand in a doorway, and the protection upheld with a compliment paid to both of them at once.
  - A commander sent to preach who kills men on no list at all over a blood-claim from before Islam — answered with total restitution, a surplus nobody was owed, and a disavowal larger after the payment than before it.
  - Two ancient offices lifted clear of an abolition that spares nothing else, and then publicly outranked by belief and striving in the verse that follows.
  - A sanctuary declared inviolable from the creation of the world to the resurrection and made lawful for exactly one hour, with the argument against citing that hour supplied in the same address.
  - A compliment about lineage offered back to the man who had just struck lineage out, and left uncorrected.
tone_constraints:
  - Third-person narrative report throughout, matching how the source narrates. Quoted speech appears only where the source supplies it; no dialogue, scene or motive may be invented around it.
  - The two addresses at the Ka'bah are rendered whole in refined English, in the source's own order and wording, and are never summarised or fragmented. The sermon section is the one place they appear.
  - Where the source stumbles it keeps the stumble. The doubled question and answer at Abu Sufyan's profession are carried as they stand, and the obscure clause in the answer about the keys ('what you seek, not what you desire') is flagged rather than smoothed into a sentence that reads easily.
  - The conquest poetry of Hassan ibn Thabit, Buhayr ibn Zuhayr, al-'Abbas ibn Mardas, the verses of Ibn al-Zuba'ari and Sa'd ibn 'Ubadah's rajaz have come down badly damaged. They are carried at the level of their surviving sense with the damage named — no line reconstructed, no garbled name repaired.
  - Footnote apparatus, manuscript sigla, folio marks and edition locators are dropped per the denoise contract; the attributions are preserved in the show-notes references instead.
  - Honorific formulae are not read aloud after every name. The source's repeated blessing formulae are carried by the narration itself, as in earlier episodes.
  - The breach of the truce, Abu Sufyan's failed embassy to Medina, the office of watering the pilgrims and the settlement of Mecca under Qusay, and Hind's conduct after Uhud were all taught earlier in this history. Each appears here only as a one-line callback in fresh words.
  - Never pair the leadership title with the personal name of the Father of Imams. He is named as Ali ibn Abi Talib, as the Father of Imams, or — where the source itself does so — as the Commander of the Faithful.
anchor_passages:
  - 'Al-''Abbas''s calculation at Marr al-Zahran: ''Woe to the Quraysh. By God, if the Messenger of God enters Mecca by force before they come out to him and seek his pledge of security, it will be the destruction of the Quraysh for all time.'''
  - 'The morning exchange: ''Woe to you, O Abu Sufyan — do you not yet know that there is no god but God?'' — ''how I honour you, revere you, and follow your guidance — yet I confess, by God, that something still lingers in my soul regarding this.'''
  - 'The three clauses of safety: ''Whoever enters the house of Abu Sufyan is safe, whoever closes his door is safe, and whoever enters the mosque is safe.'''
  - 'The correction at the defile: ''your nephew''s kingship has grown mighty today'' — ''It is prophethood, O Abu Sufyan'' — ''Yes — then it is prophethood.'''
  - 'The banner at the gate, after Sa''d ibn ''Ubadah''s rajaz: ''Go and take the banner from him, and be the one who enters with it'' — and in this way Ali was the bearer of the Prophet''s banner in war and the standard of his peace.'
  - 'The refusal of the signal: ''I stayed silent for so long so that one of you might rise and strike his neck, as I had commanded — yet none of you did'' — ''A prophet does not kill by signal.'''
  - 'Umm Hani'' and the sword: ''Umm Hani'' has prevailed over you'' — ''If Abu Talib had filled the world with his children, they would all have been courageous and strong.'''
  - 'The disavowal of Khalid, spoken twice: ''O God, I am innocent before You of what Khalid ibn al-Walid has done.'''
  - 'The commission to Ali at Bani Judhimah: ''go out to these people, assess their situation, and put the ways of the pre-Islamic era under your feet'' — ''Compensate those who were killed... and pay for everything that was taken from them and more.'''
  - 'The verse revealed on the boasting in the Sacred Mosque: ''Do you consider the providing of water to the pilgrim and the maintenance of the Sacred Mosque equal to the deeds of one who believes in God and the Last Day and strives in the cause of God?'' (chapter 9, verses 19 to 22).'
  - 'The sermon''s abolition clause: ''Every claim of blood, wealth, or feudal privilege is hereby placed under my feet — except the custodianship of the Ka''bah and the watering of the pilgrims.'''
  - 'The sermon''s answer to descent: ''All people descend from Adam, and Adam was created from dust'' — with chapter 49, verse 13 — and the closing ''Go, for you are free.'''
  - 'The address on the sanctity of Mecca: ''It was made lawful to me only for this hour... And if anyone claims that the Messenger of God fought here, say to him: God made it lawful to His Messenger and did not make it lawful to you.'''
