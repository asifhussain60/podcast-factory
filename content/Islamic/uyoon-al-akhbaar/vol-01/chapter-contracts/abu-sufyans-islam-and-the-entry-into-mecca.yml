essential: core
essential_rationale: It carries the conquest of Mecca itself — the safe-conduct that emptied the city into three sanctuaries, the banner transferred to Ali at the gate, the rule on who might be killed and its dissolution, Khalid's massacre at Bani Judhimah with Ali's restitution and the twice-spoken disavowal, the verse ranking belief and striving above the two offices of the sanctuary, and the sermon at the door of the Ka'bah abolishing the pre-Islamic law of blood and rank.
