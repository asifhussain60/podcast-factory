title: Abu Sufyan's Islam, Mecca Opened
audience: Listeners who have followed a ten-year truce come apart at a watering place and a ten-thousand-strong army march south in Ramadan, and who now want to know how a city that size changed hands without a battle. No prior knowledge is needed beyond the breach of the truce and the march. What this episode asks of them is to follow a safe-conduct drafted around one man's vanity, a list of condemned men that dissolves in the hands of whoever finds them, and an address at the door of the Ka'bah that cancels the inherited law of blood in a single clause.
angle: faithful_narrative
episode_format: narrative
format_rationale: 'The slice is narrated event and reported speech from end to end: a night ride, a capture, a profession of faith, a parade at a defile, an entry in two wings, three cases of condemned men, a massacre and its restitution, and two formal addresses. The exchanges that come closest to dispute — ''Umar asking to strike Abu Sufyan''s neck, Umm Hani'' wresting the sword from her brother — are single challenges settled on the spot, not a proposition contested across the chapter by named parties on both sides, so this is narrative rather than debate.'
host_dynamic: narrator + companion
host_dynamic_rationale: The narrator carries al-'Abbas's night ride and the meeting at the Arak trees, Abu Sufyan's profession and the three clauses of safety, the parade at the bend of the pass and the correction of kingship to prophethood, the warning shouted in Mecca and Hind seizing his moustache, the entry and the banner taken from Sa'd ibn 'Ubadah, the cases of 'Abdullah ibn Sa'd, al-Huwayrith and Umm Hani', Khalid at Bani Judhimah and Ali's restitution, the keys returned to 'Uthman ibn Talha with chapter 9 verses 19 to 22, and the two addresses at the Ka'bah; the companion presses on why a list of forfeited lives is handed back to whoever finds them, on why a prophet will not kill by signal, and on why two ancient offices are lifted clear of an abolition that spares nothing else.
