show_notes:
  blurb: 'What is the smallest thing you could give a proud man to make him carry your safe-conduct through a city that is about to fall? On the last night of the march to Mecca, the Prophet''s uncle rides out alone hoping to find a woodcutter who can warn the city in time — and runs instead into the head of Quraysh, arguing in the dark about the fires he cannot account for. What follows is a rescue that is also an arrest, a profession of faith recorded together with the sword that was its alternative, and a parade staged at a chokepoint for an audience of exactly one man, ending in a single word: not kingship, but prophethood. Then the city opens, and the harder question arrives. A short list of names is issued whose blood is forfeit even beneath the curtains of the Ka''bah — and almost every one of them survives, because the command over each life is handed back to whoever finds him. Meanwhile a commander sent out to preach disarms a tribe with the true news that the war is over, and executes them over a grievance from before Islam. And at the door of the Ka''bah, an address cancels the entire inherited law of blood, wealth and rank in one clause, keeps exactly two things out of the wreckage, declares the city sacred from the creation of the world to the resurrection and lawful for one hour, and sends the assembled Quraysh home free.'
