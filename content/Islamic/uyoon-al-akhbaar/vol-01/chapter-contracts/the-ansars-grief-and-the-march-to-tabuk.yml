title: The Ansar's Portion and Tabuk
audience: Listeners who have just watched the spoils of Hunayn counted out at al-Ji'ranah and heard the reason given for who received the most. No prior knowledge is needed beyond that distribution and the community's two halves — the Emigrants who came from Mecca and the Ansar who took them in. What this episode asks of them is to sit through an address given to one section of the community alone, and then to follow a months-long expedition that fought nobody and is therefore measured entirely by who stayed behind, who was left in charge, and what was said about both.
angle: faithful_narrative
episode_format: narrative
format_rationale: 'The slice is narrated event, reported speech and one formal address: a grievance brought by a named intermediary, an assembly, a sermon, a poet''s repentance, a march with its halts and incidents, treaties, a demolition, and a delegation. The book''s exposition of the saying about Aaron and Moses and its weighing of the call across the desert against the report of ''Umar and Sariyah are the author arguing in his own voice with no named party answering him in dialogue, so there is no sustained named opposition; this is narrative rather than debate.'
host_dynamic: narrator + companion
host_dynamic_rationale: The narrator carries Hassan ibn Thabit's reproach, Sa'd ibn 'Ubadah's report and the question put back to him, the address to the Ansar recited whole, the weeping and the answer that they are content with the Messenger of God as their lot, the lesser pilgrimage and the deputies left at Mecca, Ka'b ibn Zuhayr's letter and ode and the line redirecting praise to the Ansar, the seven men who wept for lack of mounts, the lost camel and the hypocrite's taunt, Abu Dharr walking alone, the treaties at Ayla and Jarba' and Adhruh, Ukaydir taken while hunting, the water at Wadi al-Mashqaq, the demolished mosque with chapter 9 verse 107, the three who offered no excuse with chapter 9 verse 118, the saying about Aaron and Moses with chapter 7 verse 142, the raised hand before the delegation of Thaqif, and the chapter of Immunity taken back on the road with chapter 9 verses 1 to 2; the companion presses on why the address argues the Ansar's own case better than they did, on what an expedition that fought nobody actually achieved, and on how the book defends its hardest report by pricing it against one its opponents already accept.
