thesis_relevance: 'This chapter advances the book''s central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents'' record, by gathering the campaign''s three designations into one place: the deputyship over Medina defended with the saying that Ali stands to the Prophet as Aaron stood to Moses and expounded through the verse commanding Aaron to succeed among his people, the hand raised before the delegation of Thaqif and the bystander who told him to turn it aside, and the chapter of Immunity recalled from Abu Bakr on the road because none could deliver it but a man of the Prophet''s own house.'
