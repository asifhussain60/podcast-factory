  section_title: The Ansar's portion
key_tensions:
  - 'A grievance that is not about property at all: not that the division was unlawful, but that he has found his own people again.'
  - An intermediary who comes reporting other men's feelings and is asked, before anything is conceded, where he himself stands.
  - An address that extracts agreement with three questions and then argues the other side's case for them, better than they had made it, and says they would be believed if they made it.
  - 'The principle from the distribution restated as a compliment: those men were bound with a portion of the world, and you were entrusted to your Islam.'
  - A community left off a list twice in weeks — once a list of camels, once a poem — and answered the second time by a single line from the man being praised.
  - Seven men named with their clans for a campaign they did not join, recorded with more care than most who marched.
  - A taunt about a lost camel answered by conceding the whole of it — I know nothing except what God has taught me — and then applying the concession.
  - A description of a man walking alone on a road that runs forward past the end of his life, and a history that closes the loop by naming the exile and the man who ordered it.
  - The longest expedition of the Prophet's life meets no army and returns with three written settlements and one captive king.
  - An order that forbade not drinking but drinking first, broken by men who arrived ahead of the column, and answered with water rather than a rebuke.
  - A building raised by men with excuses pulled to the ground, set against three men who offered no excuse at all and had a verse of relenting sent down for them.
  - A comparison spoken once before at a gate of Khaybar, said here to send a man back rather than to praise him, and expounded for the first time as an office.
  - The hardest report in the episode defended not by proof but by weighing it against a miracle the other side already accepts.
  - A hand taken and raised in front of a delegation, and a bystander telling him to turn it aside — the interruption recorded rather than any reply.
  - A chapter of the Quran taken back off its first bearer on the road, and the argument the Shi'a build from that recall.
tone_constraints:
  - Third-person narrative report throughout, matching how the source narrates. Quoted speech appears only where the source supplies it; no dialogue, scene or motive may be invented around it.
  - The address to the Ansar is rendered whole and unbroken — invocation, the three questions, the four clauses the Prophet speaks on their behalf, the statement about the emigration and the path, and the closing prayer over three generations. It is never summarised or split.
  - The verse of Hassan ibn Thabit, of Ka'b ibn Zuhayr in both his poems, of Bujayr ibn Zuhayr and of Bajir ibn Bajrah al-Ta'i is damaged in this manuscript. It is carried at the level of surviving sense with the damage named — no line reconstructed, no garbled name repaired.
  - 'Where the source carries a variant it is preserved rather than resolved: the uncertain identity of one of the seven who wept, and the two datings offered for the affair of the chapter of Immunity.'
  - Footnote apparatus, manuscript sigla, folio marks, chains of transmission and edition locators are dropped per the denoise contract; the attributions are preserved in the show-notes references instead.
  - Honorific formulae are not read aloud after every name. The source's repeated blessing formulae are carried by the narration itself, as in earlier episodes.
  - The distribution at al-Ji'ranah, the failed siege of Ta'if, the day of Hunayn, the emigration from Mecca, and the saying about Aaron and Moses first spoken at Khaybar were all taught earlier in this history. Each appears here only as a one-line callback in fresh words, and the Khaybar occurrence is named as a callback rather than re-expounded.
  - Never pair the leadership title with the personal name of the Father of Imams. He is named as Ali ibn Abi Talib, as the Father of Imams, or — where the source itself does so — as the Commander of the Faithful.
anchor_passages:
  - 'The injury in the Ansar''s own words: ''The Messenger of God has found his own people.'''
  - 'The question to the intermediary: ''And where do you stand in all of this, Sa''d?'' — ''O Messenger of God, I am only a man of my people.'''
  - 'The opening of the address: ''Did I not find you astray and God guided you? Were you not poor and God enriched you? Were you not enemies to one another and God made your hearts one?'''
  - 'The case argued on their behalf: ''You came to us rejected, and we believed in you; you came to us abandoned, and we supported you; you came to us driven out, and we sheltered you; you came to us destitute, and we brought you comfort.'''
  - 'The principle applied to them: ''You have felt it over a portion of the world by which I bound certain men so that they might submit, while I entrusted you to your Islam. Are you not content that the people should depart with sheep and camels while you return with the Messenger of God?'''
  - 'The closing of the address: ''If the people took one path and the Ansar took another, I would follow the path of the Ansar. O God, have mercy on the Ansar, the sons of the Ansar, and the sons of the sons of the Ansar.'''
  - 'The line on the poet''s omission: ''Had he not mentioned the Ansar well, they would have been worthy of it.'''
  - 'The answer to the taunt about the camel: ''I know nothing except what God has taught me, and God has now shown me where the camel is.'''
  - 'The saying over Abu Dharr: ''May God have mercy on Abu Dharr — he walks alone, dies alone, and will be resurrected alone.'''
  - 'The promise over the valley: ''it will be one of the most fertile valleys in the land, and all that lies before it and behind it.'''
  - 'The verse on the three: ''until the earth, vast as it is, closed in upon them, and their own souls became too narrow for them'' (chapter 9, verse 118).'
  - 'The saying at the encampment: ''They have lied. I left you behind as my deputy. Return, for you are my successor among my family. Are you not content to stand to me as Aaron stood to Moses — except that there is no prophet after me?'''
  - 'The delegation of Thaqif: ''establish the prayer and pay the alms — otherwise I will send upon you a man who is as I am'' — and ''Umar''s ''Deflect, deflect.'''
  - 'The recall on the road: ''None shall deliver this but a man of your own people'' — and the report''s closing line, ''not one of them gave me any trouble.'''
