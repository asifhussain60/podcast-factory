show_notes:
  blurb: 'What do you say to the men who gave you their city when nobody else would, and who have just watched a hundred camels apiece go to the men who spent twenty years trying to kill you? This episode opens with the Ansar working out what their empty hands mean, and with the only assembly in the volume where one section of the community is gathered alone behind a fence and answered — an address that puts their own case better than they had put it, then names the reason they were given nothing as the highest compliment available. Weeks later a pardoned poet recites the most famous ode of the era in the Prophet''s presence and leaves them out again, and the correction comes in a single line. Then the march north to Tabuk, the longest expedition of the Prophet''s life and the one with no battle in it, made instead of what happens on a road: seven men who wept because there was nothing to carry them, a lost camel and the hypocrite who mocked it, a man walking alone under his own baggage and told what his death would look like, a Christian king caught out hunting, a rock made to give water to a whole column, a mosque pulled down, and three men who offered no excuse at all. And the thread the book most wants followed is gathered at the close: a man riding out to answer a slander and told he stands as Aaron stood to Moses, a report of a voice heard across a desert defended by weighing it against one the other side already believes, and a chapter of the Quran taken back off its first bearer on the road and carried into a city where every man had sworn against the one who carried it.'
