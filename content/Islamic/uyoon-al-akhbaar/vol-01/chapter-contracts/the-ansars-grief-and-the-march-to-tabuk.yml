essential_rationale: It carries the address to the Ansar whole — the only time in this volume one section of the community is assembled alone and answered — together with the saying that Ali stands to the Prophet as Aaron stood to Moses and the book's exposition of it, the three men whose repentance brought down a verse, the destruction of the mosque of dissension, and the chapter of Immunity taken from Abu Bakr on the road and delivered by Ali.
