length_target: extended
essential: core
essential_rationale: It carries the campaign against the Banu al-Mustaliq with Juwayriyah's emancipation and its consequence, the verse of verification revealed over a false report, the hadith likening Ali to the Messiah with chapter 43 verses 57-58 revealed over the sneer at it, and the entire truce of al-Hudaybiyah including the Pledge of al-Ridwan and the erasure Ali was told he would one day be asked to repeat.
key_tensions:
  - A hundred households freed without an order, a ransom or a decree. Juwayriyah settles her own emancipation contract, marries the Prophet, and the captors release her people because holding in-laws has become unthinkable.
  - The order of her two acts. She does not come as a captive asking for release; she first enters a written contract of emancipation and then asks for help with the payment, so she arrives as a party to an agreement.
  - Two words at a water trough. Neither man shouts his own name; each reaches past himself to the largest available category, and a shoving match over a horse becomes a rift between the emigrants and their hosts.
  - A quarrel answered physically rather than judicially. Nobody is adjudged right; the people are marched until argument is impossible and then allowed to sleep.
  - A crown that was being strung. Usayd ibn Hudayr supplies the motive behind the long record of unkept promises — and having supplied it, counsels gentleness rather than punishment.
  - A settlement treated as a payment on account. Muqees ibn Sababa takes the blood money for his brother in public and then kills his brother's killer anyway.
  - A welcoming party reported as an ambush. Al-Walid ibn 'Uqbah turns his horse around and nearly launches an expedition against new Muslims, and the verse that follows legislates verification rather than merely condemning him.
  - A prophecy staged before it is fulfilled, and answered with a sneer. The Prophet sits at the mosque door and announces what the next man through will be; the objection that follows is identified in the Quran as argument for its own sake.
  - A policy announced before the negotiation begins. At the kneeling of the she-camel he says he will refuse no proposal Quraysh makes in the name of kinship — and every concession that follows was conceded there.
  - An intelligence report that comes back inverted. 'Urwah ibn Mas'ud is sent to weigh a threat and returns weighing an attachment, measured against Khosrow, Caesar and the Negus.
  - Two erasures granted and a prophecy set inside the second. The scribe who cannot strike out 'the Messenger of God' is told he will one day be called to do something similar.
  - A one-way return clause honoured against every visible interest, with Abu Jandal dragged away in shackles in front of fourteen hundred witnesses — and then emptied by seventy men on the Syrian road, until Quraysh themselves ask for it to be lifted.
tone_constraints:
  - Third-person narrative report throughout, matching how the source narrates. Quoted speech appears only where the source supplies it; no dialogue, scene or motive may be invented around it.
  - The text of the treaty is carried whole, in the order the source gives it, with no clause paraphrased away and no clause added. The one-way return provision is stated as plainly as the source states it.
  - The slander raised on the return march is reported only as the source reports it — that she fell behind, that what was said was said, and that a verse came down declaring her innocence. The accusation itself is not reconstructed or elaborated.
  - Where the source gives two readings it keeps both. The Pledge of al-Ridwan is carried with the report that it was a pledge unto death and Jabir ibn 'Abd Allah's correction that it was a pledge not to flee, and neither is resolved.
  - The source's manuscript is disordered in this stretch, repeating the Abu Basir material and placing the verse on the emigrant women out of sequence. The events are carried in a coherent order without inventing connective material, and nothing is told twice.
  - Footnote apparatus, manuscript sigla, folio marks and edition locators are dropped per the denoise contract; the attributions are preserved in the show-notes references instead.
  - Honorific formulae are not read aloud after every name. The source's repeated blessing formulae are carried by the narration itself, as in the previous episodes of this series.
  - The year of the Elephant, the persecution of the weak in Mecca and 'Abd Allah ibn Ubayy's earlier broken promises were all taught earlier in this history. Each appears here only as a one-line callback in fresh words.
  - Never pair the leadership title with the personal name of the Father of Imams. He is named as Ali ibn Abi Talib, as the Father of Imams, or — where the source itself does so — as the Commander of the Faithful, never as a title joined to the personal name.
anchor_passages:
  - 'The freeing of the captives: ''She is now the in-law of the Messenger of God'' — and ''A hundred people from the households of the Banu al-Mustaliq were freed because of her. She was thus the most blessed of women for her own people.'''
  - 'The two shouts at the water: ''O people of the Ansar'' — ''O people of the Muhajirun.'''
  - 'Usayd ibn Hudayr''s counsel: ''Deal gently with him, for God has brought him to you. His own people had been preparing beads to crown him as their king, and he now sees that you have supplanted him in that.'''
  - 'The verse of verification: ''O you who believe, if a wicked person comes to you with news, verify it, lest you harm a people out of ignorance and then regret what you have done'' (chapter 49, verse 6).'
  - 'The comparison at the mosque door, reported by Salman al-Farisi: ''There will emerge a man who resembles the Messiah in his standing among people. He is the best of people after me on the Day of Resurrection, and the first to enter Paradise'' — followed by chapter 43, verses 57-58.'
  - 'The answer to Bishr ibn Sufyan: ''I will never cease striving for what God has sent me to accomplish until He causes it to prevail — or until this neck is severed.'''
  - 'The kneeling of the she-camel: ''What has restrained her is the same force that restrained the Elephant from Mecca. Today I will not refuse any plan by which Quraysh asks me to honour the ties of kinship.'''
  - '''Urwah ibn Mas''ud''s report to Quraysh: ''I have seen Khosrow in his kingdom, and Caesar in his kingdom, and the Negus in his kingdom — and by God, I have never seen any king among his people as Muhammad is among his companions.'''
  - 'Jabir''s correction on the Pledge of al-Ridwan: ''He did not take our pledge unto death; he took our pledge that we would not flee.'''
  - '''Umar''s protest and the answer to it: ''Then why should we concede anything of our religion?'' — ''I am the servant of God and His Messenger. I will not disobey His command, and He will not forsake me.'''
  - 'The erasure and the prophecy: ''O Messenger of God, I cannot erase your name'' — ''Write it. You will one day be called to do something similar.'''
  - The text of the treaty, from 'In the name of God' through the clause admitting any tribe to either covenant — carried whole.
  - 'Abu Jandal in shackles and the answer given to him: ''We have made peace with these people and have given them the covenant of God. We cannot act in bad faith toward them.'''
