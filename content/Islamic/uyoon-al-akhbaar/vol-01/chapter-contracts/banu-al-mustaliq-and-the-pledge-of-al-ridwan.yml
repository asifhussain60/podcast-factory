show_notes:
  blurb: 'How does a document that concedes nearly everything come to be called an opening? This episode ends with fourteen hundred pilgrims turning back within a day''s march of Mecca, having agreed in writing to return anyone who escapes to them while getting nobody back, and having watched a young man in shackles dragged from the negotiating table by his own father — and then, on the road home, the chapter of the Opening is revealed about it. Before that comes a campaign at a watering place near the coast and the captive who settles her own emancipation contract, marries the Prophet, and frees a hundred households of her people in an afternoon without an order being given. Then the march home, which is nothing but speech: a shout at a water trough that nearly splits the community in two, a boast about who will drive out whom, a messenger who reports a welcoming party as an ambush and is answered by a verse commanding verification, and a comparison drawn at the mosque door that the hypocrites turn into a sneer. Then al-Hudaybiyah — a she-camel that will not move, water drawn up with an arrow, an envoy who measures a man against Khosrow and Caesar and the Negus, a pledge under threat, two erasures granted, and a prophecy set inside the second one about the man holding the pen.'
