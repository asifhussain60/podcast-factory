thesis_relevance: This chapter advances the book's central claim that the line of the Imams, beginning with the Prophet and his designated legatee, is the spine of sacred history and can be told from inside the tradition rather than from its opponents' record, by preserving two passages the opposing record does not carry this way — the Prophet waiting at the mosque door to announce that the next man through would be the one who resembles the Messiah and is first into Paradise, and the moment at al-Hudaybiyah when the scribe who could not erase his master's title was told he would one day be called to do the same for his own.
