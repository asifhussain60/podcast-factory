title: Banu al-Mustaliq and al-Hudaybiyah
audience: Listeners who have followed this community through a siege and a judgment and now watch it march out twice more — once against a tribe gathering for war, and once toward Mecca carrying sacrificial animals instead of weapons. No prior knowledge is needed beyond the truce-breaking of the previous year. What this episode asks of them is to weigh a written agreement that concedes almost everything, and to see why the chapter of the Opening was revealed about it on the road home.
angle: faithful_narrative
episode_format: narrative
format_rationale: 'The slice is narrated event throughout: a campaign at a watering place, a captive''s emancipation contract and marriage, a quarrel on the march home, a false dispatch, a journey to the Sacred House, an exchange of envoys, a pledge, and the drafting of a treaty. The two sustained exchanges — ''Umar''s questions before the drafting and Suhayl''s objections during it — are short protests inside a negotiation rather than a contest over a proposition carried across the chapter, so this is neither debate nor deep_dive.'
host_dynamic: narrator + companion
host_dynamic_rationale: The narrator carries the march to al-Muraysi', Juwayriyah's emancipation contract and the hundred households freed by her marriage, the shout at the water and the forced march that answered it, Muqees ibn Sababa's revenge, al- Walid ibn 'Uqbah's false report and the verse of verification, the comparison drawn at the door of the mosque, and then the whole of al-Hudaybiyah from the seventy garlanded animals to the revelation of the chapter of the Opening; the companion presses on how a change of kinship freed a hundred households without an order being given, and on why a treaty that concedes everything is answered with the word opening.
