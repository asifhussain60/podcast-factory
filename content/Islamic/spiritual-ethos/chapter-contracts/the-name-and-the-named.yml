show_notes:
  blurb: When you invoke the Name of God, are you only uttering a word — or already touching the reality? We follow the bold maxim that the Name is the Named, the Imams who seem to deny it, and the resolution that holds both; then the astonishing claim that the friends of God, effaced in Him, become the most beautiful Names — landing on the death of Ali (as) with the invocation on his tongue, where the whole teaching of the book is gathered into a single act.
