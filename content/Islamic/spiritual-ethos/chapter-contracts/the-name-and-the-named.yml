title: The Name and the Named
audience: Thoughtful adult listeners drawn to the metaphysics of the divine Names and the mystery of sainthood, who want a faithful walk through the culmination of Shah-Kazemi's reading of remembrance in the sayings of Ali (as).
angle: faithful_exposition
angle_note: Faithful exposition of the doctrine of the Name and the Named, the divesting of attributes, and the friends of God as the most beautiful Names, closing on the death of Ali (as) with the invocation on his tongue, developed from the source's own argument.
episode_format: deep_dive
format_rationale: One doctrine is resolved and then crowned — the identity and non-identity of the Name with the Named, carried from the divine attributes to the effaced saint. The Sufi maxim and Imam Ja'far's denial are reconciled by distinguishing two senses of 'Name'; this is a resolution of an apparent tension within one tradition, not a debate between contending parties.
essential: core
essential_rationale: It closes the whole meditation on remembrance — resolving how invocation touches the reality it names, and landing the book on the effaced friend of God who becomes the Name — and cannot be cut without leaving the arc unfinished.
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: The curious_mind hears the saints' self-exalting sayings as near-blasphemy; the scholar_companion unfolds the two senses of the Name, the divesting of attributes, and how the effaced saint reflects the divine Names precisely because no self remains to obstruct them.
length_target: extended
word_count: 5486
key_tensions:
  - The Sufi maxim that the Name is the Named versus Imam Ja'far's insistence that the Name of God is other than Him
  - The saints' apparent self-deification versus their effacement as the deepest confession of God's oneness
  - The divine attributes affirmed as not-other-than the Essence versus negated as separate, super-added realities
tone_constraints:
  - Reverent and culminating; let the shocking sayings resolve into the deepest tawhid rather than scandal
  - Render every Qur'anic verse, hadith, and ecstatic utterance in English only, with plain-English verse references
  - Keep the honorific after Ali (as); keep short inline Arabic terms without diacritics and never pair a transliteration run with a translation
anchor_passages:
  - I ask Thee by every Name with which Thou hast named Thyself
  - The perfection of sincerity is to divest Him of all attributes
  - I am the gnosis of the mysteries ... I am the Face of God, I am the mirror of God
  - That you die while your tongue is moist with the invocation of God
adaptation_mode: faithful
