      '
thesis_relevance: 'This chapter advances the book''s central claim — that the spiritual ethos of Ali (ع), lived out as intellect, remembrance, and justice, is a universal spirituality transcending the divisions of Islam — by grounding the invocatory discipline in a metaphysics of the Name that the Imam''s hints seed and the later mystics elaborate, and by reconciling that metaphysics with the Shi''i Imams'' own teaching on the Names.

  '
