show_notes:
  blurb: 'The practice of invocation is turned inside out. This episode follows the Imam''s startling claim that the invocation issues first from the One who is invoked and only second from the one who invokes — that God''s remembrance of man precedes man''s remembrance of God, ontologically and not merely in time. It unfolds the cosmogony the later mystics built on the Imam''s hints: creation itself as a kind of divine remembrance, the world called from nothing by God''s utterance of its name, each thing resting on a divine Name as on its foundation. And it reaches the cardinal tenet of the whole invocatory discipline — that the Name is the Named — resolving its apparent clash with the Imams'' insistence that the Name of God is other than God.

    '
