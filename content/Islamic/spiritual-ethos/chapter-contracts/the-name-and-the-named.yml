title: The Name and the Named
audience: 'Thoughtful adult readers ready to have the picture of invocation turned inside out. No prior metaphysics is assumed, though the episode reaches the most speculative material in the book. It follows the Imam''s claim that the invocation issues first from the One who is invoked and only second from the one who invokes — that God''s remembrance of man precedes man''s remembrance of God, ontologically and not merely in time — and unfolds the cosmogony the later mystics built on it: creation as a kind of divine remembrance, the world called from nothing by God''s utterance of its name. It closes on the cardinal tenet that the Name is the Named, resolving its apparent clash with the Imams'' insistence that the Name of God is other than God. The listener should come away seeing why a spoken Name can carry a soul toward the Absolute.

  '
angle: faithful_exposition
angle_note: 'A faithful exposition of the metaphysics of the Name — the reciprocity of remembrance, creation as existentiation, and the identity-in-distinction of Name and Named — drawing Ibn al-''Arabi and his commentators as the elaboration of the Imam''s hints. Al-Sadiq''s saying that the Name is other than God is engaged not as an opposing voice but as an apparent tension the episode resolves by distinguishing the senses of "Name."

  '
episode_format: deep_dive
format_rationale: 'The section unfolds one doctrine — that the true agent of the invocation is God, that creation is a divine remembrance, and that the Name is the Named — layer by layer. The seeming clash with al-Sadiq''s saying is not a sustained debate between named parties but a single apparent tension resolved within one continuous exposition by distinguishing the verbal form from the attribute; so deep_dive rather than debate.

  '
essential: core
essential_rationale: 'It supplies the metaphysical ground of the whole invocatory discipline — why one invokes a Name at all — and reverses the picture of the human invoker in a way the final episode''s teaching on effacement presupposes.

  '
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: 'The scholar_companion carries the exposition of the reciprocity, the cosmogony of the creative Word, and the resolution of the Name-and-Named problem; the curious_mind voices the natural resistance — surely it is the person who invokes? and how can a Name be its bearer? — and keeps the speculative material anchored to the practice it explains.

  '
length_target: extended
key_tensions:
  - 'The invocation is God''s before it is man''s. The Imam says it comes first from the Invoked and second from the invoker; God''s remembrance of man is the creative act that gives man his very being. The hosts must present the reciprocity of "Remember Me, I will remember you" not as a bargain between equals but as an echo awakened by a prior divine call.

    '
  - 'To be remembered by God is to exist. God''s remembrance of a creature is that creature''s being; creation is a kind of divine remembrance, the world called from nothing by the utterance of its name, sustained by a creative Word that never ceases. The hosts should keep this concrete: our present existence is the present tense of God''s remembrance.

    '
  - 'The Name is the Named — and is other than the Named. The Sufi tenet and al-Sadiq''s denial are reconciled by distinguishing the verbal form and the distinguishing relation (which are other than God) from the attribute and the being (which are not). The hosts must hold both, and show why both are needed: identity alone breeds many gods, distinction alone empties the practice.

    '
tone_constraints:
  - 'Walk the episode in its given order: the reciprocity of remembrance (the human act answered by divine blessing; the invocation issuing first from the Invoked; God''s remembrance prior) → called forth from nothing (to be remembered is to be; al-Badi'' the Originator; the creative Word that never ceases; the soul as locus of a divine Name) → Name and Named (the revealed Names unlike the idols''; the Name is the Named; the resolution of al-Sadiq''s saying).

    '
  - 'The phrase pairing the leadership-title with the personal name is FORBIDDEN (P0). Refer to Ali (ع) as "Ali (ع)", "the Imam", "Amir al-Mu''minin", or "the Father of Imams"; keep the "(ع)" marker. Imam Ja''far al-Sadiq and Imam Muhammad al-Baqir keep their names as given.

    '
  - 'The Prophet Muhammad takes "(peace and blessings be upon him)" on first mention and "the Prophet" or ﷺ thereafter.

    '
  - 'Quranic verses are quoted in English with the reference in plain words when named — never a bare numeric pair — and stay in English translation only, never paired with an Arabic transliteration run.

    '
anchor_passages:
  - '"The Imam turns the picture inside out: ''The invocation ... comes forth firstly from the Invoked, and secondly from the invoker.''"

    '
  - '"The reciprocity: ''Remember Me, I will remember you'' (chapter 2, verse 152) — read as an echo awakened by God''s prior remembrance."

    '
  - '"To be is to be remembered: ''Hath there come upon man any moment in time when he was not a thing remembered?'' (chapter 76, verse 1) — ''a thing has being in the remembrance of the one who remembers it.''"

    '
  - '"The revealed Name unlike the idols'': ''They are but names that ye have named, ye and your fathers, for which God hath revealed no authority'' (chapter 53, verse 23)."

    '
  - '"The tension and its resolution: the Sufi tenet that the Name is the Named set against al-Sadiq''s ''The Name of Allah is other than Him'' — reconciled by the two senses of ''Name.''"

    '
