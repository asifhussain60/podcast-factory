thesis_relevance: 'This chapter advances the book''s central claim — that Ali (ع)''s spirituality is the interiorization of revelation, realized as intellect, worship, and justice — by turning the theology of the intellect into a practical discipline of the soul: the greater jihad, sincerity, and detachment through which knowledge is integrated into being, and by which the vision of justice in the chapters ahead becomes possible.

  '
