show_notes:
  blurb: 'The culmination of the opening chapter, where the theology of the intellect becomes a discipline of the whole soul. The episode unfolds the greater jihad (al-jihad al-akbar) — the war against one''s own self that the Prophet ranked above every outward battle — reading the vices not only as moral failings but as rust that blinds the heart to the Real. It walks the Imam''s metaphor of the inner war (the intellect commanding the forces of the Compassionate, whim commanding the forces of the devil, the soul drawn between them), the teaching that the soul is to be won over rather than destroyed, and the unmasking of egoistic desire as a hidden idolatry. It then turns to sincerity (ikhlas) as being purely for God and its surprising fruits — the joy of certainty, the perception of beauty (ihsan as "making beautiful"), and the prophetic virtues — before closing on detachment from the world (zuhd), the befriending of hardship, the intimacy of death and self-effacement, and the teaching that goodness already participates in its own reward, so that deliverance is tasted here and now.

    '
