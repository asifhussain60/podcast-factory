show_notes:
  blurb: 'Having established the vision remembrance yields, the book turns to the labor that yields it — the actual practice of invoking God. This episode gathers the Qur''anic commands to invoke God''s Name morning and evening, in humility and in secret, and above all in abundance — a measure set by the night vigils of the first Muslims — and sets beside them the Imam''s insistence that the Name is a remedy that must be taken, not merely contemplated. It traces the living circle of invocation, love, and reflection in which each deepens the others, and closes on the Imam''s boldest claim: that remembrance is greater than the formal prayer, not because prayer is dispensable, but because remembrance is the living substance prayer exists to carry, until a person becomes perpetually at prayer.

    '
