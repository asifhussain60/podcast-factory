      '
    - '"The Imam''s Du''a'' Kumayl on the tongue devoted to invocation; al-Sadiq on the practice that has no limit; the Prophet on the tongue kept moist with remembrance."

      '
thesis_relevance: 'This chapter advances the book''s central claim — that the spiritual ethos of Ali (ع), lived out as intellect, remembrance, and justice, is a universal spirituality transcending the divisions of Islam — by grounding the whole doctrine of remembrance in a concrete, universal discipline of invocation, open to everyone and closed to pride, that carries the vision of God into the ordinary texture of a life.

  '
