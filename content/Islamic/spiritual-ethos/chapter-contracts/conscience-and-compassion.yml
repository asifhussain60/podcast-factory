show_notes:
  blurb: The real tyrant is the one who first silences the voice inside himself. We hear conscience named as a divine infusion and the echo of the primordial covenant, watch the Imam live like the poorest of his people, and see a mercy that is not softness but fidelity to the merciful nature of the Real — impartial even toward the Prophet's own grandsons, generous even to a blind Christian beggar.
