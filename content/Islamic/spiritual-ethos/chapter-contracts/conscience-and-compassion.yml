thesis_relevance: This chapter advances the book's central claim that Ali (as) embodies the universal spiritual ethos at the heart of Islam by locating justice first in the soul's obedience to conscience and self-reform, and by grounding compassion in the merciful nature of the Real, so that mercy and rigorous justice are one act rather than opposites.
