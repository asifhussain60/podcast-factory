title: The First Sermon of Nahj al-Balagha
audience: Thoughtful adult listeners, Muslim and non-Muslim, drawn to the primary sources behind the book's exposition, who want to hear one of Ali (ع)'s own sermons whole — his proclamation of divine oneness, the making of the cosmos, and the succession of prophets — rather than in fragments.
angle: faithful_exposition
angle_note: Faithful exposition and whole recitation of the opening sermon of Nahj al-Balagha — why the collection begins on negation, the sermon rendered entire in refined English, and the single arc from the unbounded Essence down through creation and up through the prophets to the Book — developed from the source's own words.
episode_format: deep_dive
format_rationale: One doctrine unfolds from a single voice — the oneness of God divested of every attribute, poured out into a cosmos and a sacred history. Ali (ع) is the sole speaker; there is no named opposing party and no proposition under contest, only an apophatic proclamation developed layer by layer, so there is nothing to adjudicate.
essential: core
essential_rationale: It presents the primary sermon that stands first in the collection of Ali (ع)'s words — the fountainhead the earlier exposition mined in fragments — and grounds the book's whole ethos in the knowledge of God, without which the arc has no source.
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: The curious_mind is puzzled that the great book of counsel opens not on law but on negation; the scholar_companion unfolds the apophatic ladder, the sermon's rhetoric of negation-that-affirms, and how a doctrine of oneness becomes a cosmology and a history of prophets that returns creation to the knowledge of the One.
length_target: extended
word_count: 5571
key_tensions:
  - Opening the greatest book of counsel on the negation of every attribute rather than on law or governance
  - Speech used to declare that speech can deliver nothing of God — praise by confessing that praise fails
  - A God bound by nothing versus a cosmos and a history that pour out of Him as sheer gift and return to His knowledge
tone_constraints:
  - Reverent and grand; let the sermon's own cadence carry, and let the exposition serve it rather than crowd it
  - Render every Qur'anic verse in English only, with its plain-English reference; keep the sermon whole and never summarized
  - Keep the honorific after Ali (ع); keep short inline Arabic terms without diacritics and never pair a transliteration run with a translation
