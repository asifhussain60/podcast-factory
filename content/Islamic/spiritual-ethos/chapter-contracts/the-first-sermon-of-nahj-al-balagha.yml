show_notes:
  blurb: 'At its close the book turns from its own voice to a single primary document and lets it stand whole: the opening sermon of Nahj al-Balagha, the great oration on the oneness of God and the origin of all things. The episode frames the sermon''s method — an eloquence that turns the office of speech against itself to show that no word can reach God — then recites the sermon entire, and walks back through its descent from the God beyond every attribute to the Book left in human hands: the cosmos raised from water and wind and held up by nothing but command, the tireless ranks of the angels, the clay kneaded and given the intellect''s power to tell true from false, the pride of Iblis, the covenant lodged in the very act of being created, and the unbroken succession of prophecy sealed in Muhammad (peace and blessings be upon him). Transcendence bending all the way down into guidance, and never once ceasing to be transcendence.

    '
