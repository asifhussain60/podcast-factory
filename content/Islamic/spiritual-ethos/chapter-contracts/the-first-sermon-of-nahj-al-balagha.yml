anchor_passages:
  - Praise be to God, whose laudation those who speak cannot deliver
  - The perfection of sincerity toward Him is to divest Him of all attributes
  - He is Being, but not through any coming-to-be; existent, but not out of former nothingness
  - Then He breathed into it of His spirit, and it rose up a human being
