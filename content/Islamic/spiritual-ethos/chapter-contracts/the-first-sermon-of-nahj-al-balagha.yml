key_tensions:
  - 'Praise offered by one who insists no praise can reach God. The office of speech is turned against itself to show that of this one subject language delivers nothing — yet the praise is real. The hosts must present the negation as the deepest affirmation, not as a defeat of speech, and let the eloquence itself be felt as a threshold rather than a wall.

    '
  - 'Transcendence and creative nearness as one act. The God beyond every attribute is the same God who calls water out of nothing, ranks the angels, and kneads the clay. The hosts must hold both at once — farther than imagination, nearer than the jugular vein — and hear the sermon''s whole descent as a single motion that never lets go of the height it starts from.

    '
  - 'The covenant is signed in the act of being created. Prophecy does not impose a new bond but presses for the keeping of the pledge lodged in a creature''s very making, and it unearths the buried treasures of an intellect that already held the knowledge of God. The hosts must keep guidance as recovery, not implantation.

    '
tone_constraints:
  - 'Walk the episode in its given order: the framing of the sermon''s eloquence and method of paradox (the peak of eloquence; negation as affirmation; transcendence turning toward creation) -> the verbatim recitation of the whole sermon -> the exposition of its descent (the cosmogony held up by command alone; the ranks of the angels who never reduce their Lord; Adam kneaded and given discernment; the pride of Iblis; the covenant of creation and the signs; the succession of prophecy and the Book left behind).

    '
  - 'R-SERMON-VERBATIM: the section titled "The First Sermon" is the sermon itself, rendered whole in refined English. Instruct the hosts to recite it aloud, word for word, before discussing it; it is not to be summarized or fragmented.

    '
  - 'The phrase pairing the leadership-title with the personal name of the Father of Imams is FORBIDDEN (P0). Refer to him as "Ali (ع)", "the Imam", "Amir al-Mu''minin", or "the Father of Imams"; keep the "(ع)" marker.

    '
  - 'The Prophet Muhammad takes "(peace and blessings be upon him)" on first mention and "the Prophet" or ﷺ thereafter. Adam, Iblis, and Muhammad are named as given.

    '
  - 'Any Quranic quotation is given in English with its reference in plain words when named — never a bare numeric pair — and stays in English translation only, never paired with an Arabic transliteration run. Verbatim formulae in the sermon are rendered as English translation only.

    '
anchor_passages:
  - '"The paradox of praise: ''Praise be to God, whose laudation those who speak cannot deliver, whose graces those who count cannot number, and whose rightful due those who strive cannot render.''"

    '
  - '"Being without becoming: ''with every thing, but not by nearness of place; other than every thing, but not by distance of place; seeing, even when there was nothing of His creation to be seen.''"

    '
  - '"The cosmos held up by command alone: the seven heavens raised from a foam churned out of water by a barren wind, ''without a pillar to hold them up or a nail to bind them fast.''"

    '
  - '"The angels who never reduce their Lord: ''they do not shape their Lord in imagination, nor lay upon Him the attributes of the made, nor confine Him within places, nor point to Him by likenesses.''"

    '
  - '"The covenant of creation and the buried treasures: the prophets sent ''to ask of them the keeping of the covenant of their own creation... and to unearth for them the buried treasures of their intellects.''"

    '
