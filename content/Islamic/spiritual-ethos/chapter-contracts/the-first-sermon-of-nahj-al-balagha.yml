thesis_relevance: This chapter advances the book's central claim that Ali (ع) embodies the universal spiritual ethos at the heart of Islam by letting his own foundational sermon speak whole — grounding the entire ethos in the knowledge of a God cleared of every finite likeness, and showing that oneness, creation, and prophecy are one motion returning the creature to that knowledge.
