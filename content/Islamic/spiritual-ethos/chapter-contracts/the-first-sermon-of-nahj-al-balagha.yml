thesis_relevance: 'This chapter advances the book''s central claim — that the spiritual ethos of Ali (ع) is the quintessential spirituality of Islam, a universal vision transcending the divisions of the tradition — by letting the Imam speak that ethos in his own celebrated words, so that the transcendence, creation, intellect, and continuous guidance the book taught in its own voice are heard whole in his, sealing the argument at the gate through which the book began.

  '
