show_notes:
  blurb: 'The book turns to make remembrance — dhikru''Llah — its whole subject. This episode establishes what remembrance means, why the tradition sets it above every other act of worship, and why the Sufi orders of every land, Sunni and Shi''i alike, gather around Ali (ع) as the first pole of the mystical path. It then unfolds the Imam''s image of remembrance as a polish for the hearts, by which they hear after deafness and see after blindness — not the acquisition of something new but the clearing of a mirror already made to reflect the Real — and examines the spiritual heart as an organ of vision that, once cleared, sees God by a light that is finally God''s own.

    '
