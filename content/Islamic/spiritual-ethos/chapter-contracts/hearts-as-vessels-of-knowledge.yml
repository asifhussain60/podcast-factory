show_notes:
  blurb: 'The centrepiece of the opening chapter: the discourse the Imam gave to his disciple Kumayl ibn Ziyad, led by the hand to a graveyard outside Kufa. The episode recites the discourse whole and then unfolds it — the heart as a vessel worth what it can hold; the three kinds of people (the lordly knower, the seeker of deliverance, and the rabble swaying with every wind); why knowledge outranks wealth on every count (it guards you, grows when spent, and judges rather than being judged); the Imam''s lament, hand on his breast, that he cannot find a trustworthy bearer for the abundant knowledge there; and the assurance that the earth is never empty of the few who establish God''s proof — smallest in number, greatest in rank. The commentary then presses the pivotal line, "through them, knowledge penetrates the reality of insight," reading "penetrate" as a military charge on the heart of the army: knowledge that must storm past the outer wall of words to seize the heart of meaning, and be interiorized as being rather than banked as information.

    '
