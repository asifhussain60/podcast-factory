thesis_relevance: 'This chapter advances the book''s central claim — that Ali (ع)''s spirituality is the interiorization of revelation lived as knowledge, worship, and justice — by showing what interiorization means at the level of knowledge itself: truth that has stormed past words to take the heart and become being. It is the hinge between the theology of the intellect and the discipline of the soul that follows.

  '
