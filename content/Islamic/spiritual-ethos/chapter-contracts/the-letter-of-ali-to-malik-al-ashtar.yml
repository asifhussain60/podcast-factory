thesis_relevance: This chapter advances the book's central claim that Ali (ع) embodies the universal spiritual ethos at the heart of Islam by showing that his politics is that same ethos worn as a working garment, whole and entire — the government of a province begins in the government of the ruler's own soul, every instrument of the state is set on a spiritual footing rather than a merely technical one, and the same interior conviction descends all the way to the soil, the destitute, and the pledge kept with an enemy, coming to rest, as the book itself does, on a soul that acts from the remembrance of its own return to God.
