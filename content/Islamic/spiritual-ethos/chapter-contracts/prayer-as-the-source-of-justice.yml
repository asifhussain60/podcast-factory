thesis_relevance: This chapter advances the book's central claim that Ali (ع) embodies the universal spiritual ethos at the heart of Islam by showing that justice is finally assimilated not through rules but through prayer and remembrance — the drawing-near in which the soul is polished until it acts through the divine — so that justice is at once the cause and the consequence of worship.
