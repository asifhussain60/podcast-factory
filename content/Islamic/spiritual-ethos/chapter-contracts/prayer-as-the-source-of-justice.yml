show_notes:
  blurb: The whole architecture of just governance rests, in the end, on something done alone in the dead of night. We follow prayer as drawing near, the hadith in which God becomes the servant's very hearing and sight, remembrance as the polish of the heart — and set the Imam beside Plato's gazing on the Good to see how he supplies the devotional method the philosopher only pointed to.
