thesis_relevance: This chapter advances the book's central claim that Ali (ع) embodies the universal spiritual ethos at the heart of Islam by diagnosing pride as the spiritual root of all injustice — an implicit denial of God's sole reality, finally waged against the ruler's own conscience — and by showing that its cure is not mere restraint but self-reform and a compassion grounded in the merciful nature of the Real, so that mercy and rigorous justice are revealed as one act rather than opposites.
