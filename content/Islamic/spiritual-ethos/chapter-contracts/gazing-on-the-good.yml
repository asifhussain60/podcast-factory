show_notes:
  blurb: 'The close of the essay on justice returns the whole argument to its source. Sacred justice descends from the nature of God, orders the ruler''s soul, and reaches into the machinery of the state — but the disposition that makes all of it possible is drawn, in the end, from prayer and its living essence, remembrance. This episode follows the letter''s instruction to give God the best of one''s vital energy, unfolds the hadith of drawing near in which God becomes the very faculties of the one He loves, and shows how remembrance — the polish of hearts — makes a person able not only to be just but to teach justice. It ends on the essay''s boldest stroke: the comparison with Plato, who brings his guardians to the threshold of gazing upon the Good and falls silent, where the Imam supplies the devotional method the philosopher left unspoken — the heart seeing God through the verities of faith. And it hands off to the book''s next subject, remembrance itself.

    '
