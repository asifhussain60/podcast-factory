show_notes:
  blurb: 'The underside of the sacred conception of justice. Following the sombre opening of the letter to Malik al-Ashtar, this episode reads tyranny as a spiritual disorder before it is a political one. It begins with the soul that incites to evil — the confession the Qur''an gives to Joseph — and the grace that alone redirects it; moves to pride, the vice the Imam fears most, understood as the arrogation of a greatness belonging only to God and therefore a kind of war against Him, with Iblis as its archetype; and ends inside the tyrant himself, where the war against God is revealed as a war against his own conscience and his own deepest nature. The oppressor of others turns out to be, first of all, the oppressor of his own soul — which is why the cure the letter turns to next is pride''s exact opposite: mercy.

    '
