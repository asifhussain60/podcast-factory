      '
    - '"The sermon of abasement (al-Qasi''a) on Iblis as the archetype of pride; the Qur''anic account of the refusal to prostrate before Adam."

      '
    - '"The Qur''anic covenant of ''Am I not your Lord?'' and the verses on the soul inspired with its wickedness and its righteousness."

      '
thesis_relevance: 'This chapter advances the book''s central claim — that the spiritual ethos of Ali (ع), lived out as intellect, remembrance, and justice, is a universal spirituality transcending the divisions of Islam — by showing that injustice is at root a spiritual disorder, the ego usurping the place of God, so that just rule depends on the interior ordering of the soul before it depends on any outward rule.

  '
