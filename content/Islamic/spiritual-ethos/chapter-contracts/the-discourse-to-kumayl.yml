thesis_relevance: >
  This episode advances the book's central claim that Ali's spiritual ethos
  centers on the intellect as a spiritual faculty, by walking his most
  esoteric teaching — that true knowledge must storm past the surface into
  the heart, and that the greatest struggle is the intellect's conquest of
  the soul for God through ikhlas.
