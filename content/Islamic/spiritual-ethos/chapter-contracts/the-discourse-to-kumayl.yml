show_notes:
  blurb: >
    On a night outside Kufa, Ali ibn Abi Talib (peace be upon him) led one
    disciple by the hand to a graveyard, drew a deep breath, and confided a
    counsel that later generations treated as one of the most esoteric in
    the whole tradition. This episode recites that discourse to Kumayl whole
    — the three types of people, knowledge weighed above wealth, the abundant
    knowledge in his own breast, and the rare guardians of the proof through
    whom knowledge penetrates the reality of insight — and then follows the
    commentary into what it teaches. Knowledge, it argues, must storm past
    the surface of words into the heart, past the zahir into the batin; the
    warlike verb hajama makes the passage vivid. That penetration cannot
    happen unless the whole soul is won for the intellect, which is the
    greatest struggle, the battle for the nafs against hawa and the subtle
    idolatry of the ego. Its aim is integration, tawhid, and its ground is
    ikhlas — sincerity made purely for God, sustained by worship, closing on
    the command to worship until certainty comes.
