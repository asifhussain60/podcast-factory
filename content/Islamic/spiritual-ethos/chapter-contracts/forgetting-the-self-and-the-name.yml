thesis_relevance: This chapter advances the book's central claim that Ali (ع) embodies the universal spiritual ethos at the heart of Islam by unfolding his most radical teaching on remembrance — that the self must be forgotten for the Real to be realized — and resolving the deepest mystery of invocation, the identity of the Name with the Named, to show that the effaced friend of God, who reflects the divine Names undimmed, is the living form of that ethos, sealed in Ali (ع)'s own death in the act of invocation.
