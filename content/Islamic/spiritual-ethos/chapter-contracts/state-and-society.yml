show_notes:
  blurb: 'Sacred justice descends into the machinery of the state — and does not break down there but sharpens. This episode reads the letter''s account of the classes of society and their interdependence, bound together not by contract but by a covenant with God who assigns each its due, and turning on the unseen axle of the ruler''s connection to the Real. It follows the letter class by class — the gentle-yet-severe commander, the rare incorruptible judge, the tested administrator, the cultivators whose land must be nurtured before it is taxed, the trustworthy scribe, the peaceable merchant — and watches its manner change at the mention of the poor, whose care is onerous by every worldly measure. Above all it lands the teaching that makes fidelity to justice unbreakable: intention beyond consequence, so that the just person, acting for justice itself and not for any outcome, survives every worldly defeat while striving all the harder.

    '
