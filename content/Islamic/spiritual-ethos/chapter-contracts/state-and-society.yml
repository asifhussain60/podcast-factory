      '
    - '"Plato, *Republic*, on the guardians who must be gentle to their own and dangerous only to their enemies; the Qur''anic ''severe against the disbelievers, compassionate among themselves.''"

      '
    - '"The Qur''anic covenant (''ahd) verses and the warning against the one who amasses wealth imagining it will render him immortal."

      '
thesis_relevance: 'This chapter advances the book''s central claim — that the spiritual ethos of Ali (ع), lived out as intellect, remembrance, and justice, is a universal spirituality transcending the divisions of Islam — by showing that the same sacred justice which orders the soul orders the whole machinery of society, and that the just person''s fidelity, grounded in intention rather than outcome, survives every worldly frustration.

  '
