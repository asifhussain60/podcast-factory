show_notes:
  blurb: Who is the true foundation of a state — the soldiers, the judges, or the barefoot farmer no minister has ever visited? The letter kneels to touch the ground its machinery rests on. We follow the reversal that puts cultivation above the tax, the care of scribes and the watching of merchants, and then the cry — 'O God, O God' — over the destitute, the appointed officer who hunts out their need, the unguarded assembly, the prayer paced by the weakest body in the row. And at the last, the covenants a ruler keeps even with an enemy and the blood he must never spill — closing the book where it began, on a soul that remembers it is returning to God.
