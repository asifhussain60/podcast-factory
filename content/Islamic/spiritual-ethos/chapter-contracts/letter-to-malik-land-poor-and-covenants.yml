thesis_relevance: This chapter advances the book's central claim that Ali (as) embodies the universal spiritual ethos at the heart of Islam by showing that the same interior conviction descends all the way to the soil, the destitute, and the pledge kept with an enemy — a fully just governance is possible only for a soul that acts from the remembrance of its own return to God, which is where the letter, and the book, come to rest.
