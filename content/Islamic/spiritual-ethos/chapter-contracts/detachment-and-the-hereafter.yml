      "Reza Shah-Kazemi, the essays on the spiritual ethos of Ali ibn Abi
      Talib whose closing arc this episode expounds — the epistemology of
      joy, the aesthetic of virtue (ihsan), the doctrine of zuhd, and the
      Hereafter tasted here and now."
    - >
      "The Nahj al-balagha — the source of the sermons and sayings on zuhd,
      taqwa as provision (zad), the contemptibility of the world, and the
      paradisal vision of swaying trees and dunes of musk quoted here."
    - >
      "The Prophet Muhammad (peace and blessings be upon him) — quoted for
      the sayings 'Truly God is beautiful and He loves beauty' and 'Assume
      the character traits of God'."
thesis_relevance: >
  This episode advances the book's central claim that Ali's spiritual
  ethos is a universal spirituality of realization, by showing its fruit:
  an epistemology of joy, an aesthetic of virtue (ihsan), a detachment
  (zuhd) that befriends hardship and death, and a Hereafter tasted here
  and now — deliverance available in this life to the pure of heart.

