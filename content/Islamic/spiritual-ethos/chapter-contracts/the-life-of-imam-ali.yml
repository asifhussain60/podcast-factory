show_notes:
  blurb: 'The opening of Reza Shah-Kazemi''s study of the spiritual ethos of Ali ibn Abi Talib (ع) — a biographical portrait of the man the tradition calls the gate to prophetic wisdom. From his birth inside the Ka''ba and his childhood in the Prophet''s household, through the feast of warning where a boy of ten answered when the elders fell silent, the night he lay in the Prophet''s bed under threat of murder, and the battlefield feats of Uhud and Khaybar, to the marriage into the "confluence of the two lights" and his place at the head of the purified House. The episode gathers the well-attested prophetic sayings — the second self, the inseparability from the Qur''an, the two weighty things, the rank of Aaron to Moses, and the word at Ghadir Khumm — and shows why, before any of his teachings is examined, this one companion is regarded as the passage through which the inner spirit of revelation entered the Islamic sciences. It rests on what Sunni and Shi''i sources hold in common and steps around the later political disputes, setting up the book''s real question: what kind of knowing does this gate transmit?

    '
