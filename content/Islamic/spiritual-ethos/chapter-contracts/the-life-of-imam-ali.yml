      '
    - '"The prophetic sayings on Ali (ع)''s distinctions (fada''il), cited in the source from the Sunni traditionists Ahmad al-Nasa''i (Sunan) and al-Hakim al-Nisaburi (al-Mustadrak), and Ahmad ibn Hanbal''s remark that no companion had such merits ascribed to him."

      '
    - '"The event of Ghadir Khumm after the Farewell Pilgrimage (year 10) and the declaration ''for whomever I am the mawla, Ali is his mawla,'' read by Shi''is as designation of successorship and by Sunnis as a mark of special closeness."

      '
thesis_relevance: 'This chapter advances the book''s central claim — that the spiritual ethos of Ali (ع), the interiorization of the Qur''an and the prophetic nature lived out as intellect, remembrance, and justice, is a universal spirituality transcending the sectarian and political divisions of Islam — by establishing WHO Ali (ع) is and why the tradition treats him as the gate through which the inner substance of revelation passed into its sciences. Every subsequent chapter presupposes this portrait.

  '
