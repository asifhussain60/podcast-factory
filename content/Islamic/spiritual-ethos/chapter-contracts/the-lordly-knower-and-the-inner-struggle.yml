thesis_relevance: This chapter advances the book's central claim that the intellect unearths the buried treasures of consciousness and realizes the oneness (tawhid) of the Real, by showing through the discourse to Kumayl that knowledge must penetrate to the reality of insight and can only be won through the integration and pure sincerity (ikhlas) that make the whole soul one.
