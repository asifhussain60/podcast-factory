show_notes:
  blurb: Why did the wisest man of his age wait until a graveyard lay before him to give his most important counsel? We recite the discourse to Kumayl whole, watch knowledge storm the heart like an army taking a citadel, and follow the greatest struggle, the war to win the whole soul to the side of the intellect.
