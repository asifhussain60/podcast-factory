  section_title: The discourse to Kumayl
key_tensions:
  - Surface knowledge that rests on the zahir versus knowledge that storms the batin, the heart, and is realized in depth
  - 'The three types of people: the lordly knower, the seeker of deliverance, and the common folk who follow every voice'
  - Destroying the lower soul versus winning it over to the side of the intellect (al-aql) against caprice (al-hawa)
tone_constraints:
  - Recite the discourse to Kumayl whole and unhurried before any commentary; never summarize or fragment it
  - Keep the battlefield sense of hajama (to storm the heart of the army) vivid but exact
  - Render the Imam's sayings and Qur'anic verses in English only, with plain-English references
anchor_passages:
  - 'People are three types: a lordly knower, a seeker of deliverance, and the common folk who sway with every current'
  - The earth will never be empty of one who establishes the proof of God
  - Through them knowledge penetrates the reality of insight
  - The intellect leads the forces of the Compassionate; caprice commands the forces of the devil; the soul vacillates between them
