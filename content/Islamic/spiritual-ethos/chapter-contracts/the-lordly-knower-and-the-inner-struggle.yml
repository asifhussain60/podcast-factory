title: The Lordly Knower and the Struggle
audience: Thoughtful adult listeners drawn to the ethics of knowledge and the inner life, who want a faithful walk through the Imam's discourse to Kumayl and Shah-Kazemi's commentary on the greatest struggle.
angle: faithful_exposition
angle_note: Faithful exposition centered on the verbatim discourse to Kumayl, followed by Shah-Kazemi's commentary on realization and the struggle against the soul.
episode_format: deep_dive
format_rationale: One position unfolds — that real knowledge must storm the heart and be won by the greatest struggle against the soul. The episode's spine is the Imam's own sustained monologue to Kumayl plus its commentary; there is no second named voice contesting a proposition, so it is exposition, not debate.
essential: core
essential_rationale: It carries the book's most famous primary text on the ethics of knowledge and defines the inner struggle (al-jihad al-akbar) that the rest of the ethos presupposes.
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: The scholar_companion recites and unpacks the discourse to Kumayl and the storming-the-heart imagery; the curious_mind draws out why winning the soul, not destroying it, is the real aim of the struggle.
