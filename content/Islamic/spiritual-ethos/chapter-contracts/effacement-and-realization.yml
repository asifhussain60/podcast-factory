show_notes:
  blurb: 'Remembrance is followed to its summit — the point where the one who remembers is himself effaced in the Reality he remembers. This final episode unfolds the Imam''s most vertiginous saying, that a person will not truly remember God until he forgets his own soul in his remembrance, and shows why this extinction is a grace and not an achievement — the self cannot efface itself. It traces the mystics'' witness to the state, from Ibn al-''Arabi''s extinction in contemplation to the Imam''s own faintings in awe of God, and closes on the redeeming paradox that the deepest effacement of self is the fullest flowering of a human being: the saints as spotless mirrors of the divine Names, and Ali (ع) himself dying with the Name of God still on his tongue. With this the book''s argument stands complete.

    '
