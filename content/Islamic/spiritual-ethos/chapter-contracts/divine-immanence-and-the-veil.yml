      '
thesis_relevance: 'This chapter advances the book''s central claim — that the spiritual ethos of Ali (ع), lived out as intellect, remembrance, and justice, is a universal spirituality transcending the divisions of Islam — by unfolding the metaphysics of divine oneness the cleared heart perceives, in which the Imam''s terse sayings prove to be the seed of the whole later mystical doctrine of immanence and the veil.

  '
