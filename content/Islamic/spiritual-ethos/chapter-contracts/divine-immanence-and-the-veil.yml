show_notes:
  blurb: 'The cleared heart is carried out into the world it now beholds. This episode shows how, for Ali (ع), the heart purified by remembrance sees the divine in all things — every existent a theophany, its being a divine Name — and yet without the least reduction of God to the things in which He is found. It then unfolds the Imam''s most vertiginous paradox: that creation, which seems to veil God, is in truth the self-disclosure that reveals Him, so that the veils do not veil Him at all — the veil existing only to bar the one fatal error of equating a creature with the Creator. And it holds together transcendence and immanence as a single vision that the reasoning mind can only take for contradiction and the heart receives as truth.

    '
