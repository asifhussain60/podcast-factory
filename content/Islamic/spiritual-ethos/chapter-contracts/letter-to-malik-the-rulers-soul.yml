thesis_relevance: This chapter advances the book's central claim that Ali (as) embodies the universal spiritual ethos at the heart of Islam by showing that his politics is that same ethos worn as a working garment — the government of a province begins in the government of the ruler's own soul, and every instrument of the state is set on a spiritual footing rather than a merely technical one.
