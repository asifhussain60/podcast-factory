show_notes:
  blurb: 'What is the first thing you would hand a man to whom you were about to give a province? Ali (as) hands Malik neither an army nor a treasury but a warning about his own soul. We follow the opening half of his longest letter — the fear of God set over the mandate, the ladder of authority that ends above every appointment, the common folk chosen over the flattering elite, and the great pillars of the state: the gentle commander, the incorruptible judge kept safe by pay and rank, and the officer tested, watched, and disgraced if he betrays.'
