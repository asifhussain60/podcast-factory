thesis_relevance: This chapter advances the book's central claim that Ali (ع) embodies the universal spiritual ethos at the heart of Islam by showing that the concrete ordering of society turns on the ruler's connection to the Real, so that the practical justice owed to each class — and above all to the poor — flows from intention and spiritual conviction rather than political calculation.
