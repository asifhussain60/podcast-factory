title: Classes of Society and the Poor
audience: Thoughtful adult listeners, Muslim and non-Muslim, interested in the practical shape of just governance and the claim of the poor, who want a faithful walk through Shah-Kazemi's reading of the letter's anatomy of society.
angle: faithful_exposition
angle_note: Faithful exposition of the letter's ordering of society — the wheel of classes, each with its due, and the primacy of the poor and of pure intention — developed from the source's own argument and its verses and traditions.
episode_format: deep_dive
format_rationale: One doctrine unfolds layer by layer — that society is a wheel turning on the vertical axle of the Real, each class owed its due, with the poor as the sharpest test of justice. No named opposing voice runs through it, so there is nothing to adjudicate.
essential: core
essential_rationale: It is justice at its sharpest practical edge — the concrete ordering of army, judges, tillers, merchants, and the destitute — the letter's constitution of a just society.
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: The curious_mind asks how a spiritual ideal touches the machinery of taxation and office; the scholar_companion unfolds the wheel image, each class's due, and why the poor and pure intention are the true measure of a ruler.
length_target: extended
word_count: 5775
key_tensions:
  - The governor as the self-sufficient hub of society versus the hub as powerless without the vertical axle joining it to the Real
  - Power grasped as a privilege and distinction versus power accepted as an onerous trial from God, in the spirit of noblesse oblige
  - Justice measured by outward success versus justice already fulfilled in the sincere, ceaseless intention to be just
tone_constraints:
  - Reverent but concrete; let the practical counsel carry its spiritual charge without abstraction
  - Render every Qur'anic verse in English only, with its plain-English reference
  - Keep the honorific after Ali (ع); keep short inline Arabic terms without diacritics and never pair a transliteration run with a translation
anchor_passages:
  - Let your concern with the cultivation of the land outweigh your concern with the collection of the tax
  - Miserliness, cowardice and avarice are diverse inclinations, all united by a bad opinion of God
  - This is onerous for the governors, but God makes it light for those who aspire to the Hereafter
  - We feed you only for the sake of God; we desire from you neither reward nor thanks
