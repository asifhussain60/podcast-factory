show_notes:
  blurb: 'A governor is the hub of society''s wheel — and useless without an axle he cannot see. We walk the letter''s anatomy of a just state, from the army and the judges to the tillers of the soil, hear why greed is spiritual short-sightedness, and arrive at the sharpest test of all: the destitute, whose claim can be honoured only by a soul that acts from gratitude and pure intention rather than calculation.'
