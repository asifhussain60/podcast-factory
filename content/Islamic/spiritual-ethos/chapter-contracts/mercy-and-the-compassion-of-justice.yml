      '
    - '"The Qur''anic command to be staunch in justice even against oneself, one''s parents, or one''s near of kin; and the verses on God''s mercy encompassing all things."

      '
    - '"The exchange with the ascetic Asim ibn Ziyad on the duty of true leaders to proportion themselves to the weakest of the people."

      '
thesis_relevance: 'This chapter advances the book''s central claim — that the spiritual ethos of Ali (ع), lived out as intellect, remembrance, and justice, is a universal spirituality transcending the divisions of Islam — by showing that mercy is an intrinsic dimension of sacred justice, extended without distinction to brother in faith and like in creation alike, and rooted in an accurate perception of the divine nature.

  '
