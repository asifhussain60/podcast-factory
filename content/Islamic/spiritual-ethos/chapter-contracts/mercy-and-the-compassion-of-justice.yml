show_notes:
  blurb: 'The cure for the tyrant''s disorder is its exact opposite — a self-lowering that mirrors the soul''s poverty before God — and its first form is mercy. This episode argues that compassion is not the softening of justice but an intrinsic dimension of it, rooted in a God whose mercy takes precedence over His wrath. It watches that single root produce, at once, the Imam''s universal tenderness — the command to see every person as a brother in faith or a like in creation, the blind Christian beggar maintained from the public purse — and his unbending severity toward corruption, even the red-hot iron near his own brother and the refusal of leniency he would grant to no one. And it closes on the subtle teaching that every vice is finally a bad opinion of God, so that a right perception of the divine nature is the hidden source of every generous act.

    '
