thesis_relevance: This chapter advances the book's central claim that Ali (ع) embodies the universal spiritual ethos at the heart of Islam by showing that his conception of justice is not secular fairness but a conforming of the soul to the divine nature itself, so that ethics is grounded in the sacred rather than in human convention.
