thesis_relevance: This chapter advances the book's central claim that Ali (ع) embodies the universal spiritual ethos at the heart of Islam by showing that he stands at the source of the whole mystical tradition, Sunni and Shi'i alike, and that his teaching on remembrance supplies the founding account of how a human heart is polished until it can see God.
