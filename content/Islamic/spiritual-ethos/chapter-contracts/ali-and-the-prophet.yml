thesis_relevance: This chapter advances the book's central claim that Ali (as) embodies the universal spiritual ethos at the heart of Islam, the inward interiorization of the Qur'an and the prophetic nature, by establishing through his life and the prophetic testimonies that he is the gate to prophetic wisdom and the locus of a walaya that belongs to the whole of Islam, not to one faction.
