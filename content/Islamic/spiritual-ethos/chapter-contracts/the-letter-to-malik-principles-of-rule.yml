show_notes:
  blurb: 'Beside the opening sermon of Nahj al-Balagha, the book sets its second great primary document: the mandate Ali (ع) wrote for Malik al-Ashtar on sending him to govern Egypt — the longest letter he left and the one the tradition honours as the most comprehensive of all. This episode presents its first half, heard whole in refined English. It frames what kind of document the letter is — its occasion in a slipping province, its unmatched reach, and the single method that runs through every line, sealing each practical instruction with a turn to God or the destiny of the soul — then recites the first half entire, from the words of appointment through the forming of the ruler''s own heart to the choosing of his commanders, judges, and administrators. Where earlier episodes drew this letter''s doctrine into the book''s own teaching, here the document itself is set before the listener, so the counsel is heard in the Imam''s voice and in his order: the soul formed before the state is touched, and the ruler leaned, against the instinct of power, toward the weak.

    '
