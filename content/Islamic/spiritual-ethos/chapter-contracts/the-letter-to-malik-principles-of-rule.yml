      '
thesis_relevance: 'This chapter advances the book''s central claim — that the spiritual ethos of Ali (ع) is the quintessential spirituality of Islam, a universal vision transcending the divisions of the tradition — by letting the Imam speak that ethos in his own celebrated words on the just ordering of power, so that the justice, mercy, and humility the book taught in its own voice are heard whole in his, in the second of the two primary documents that seal the argument.

  '
