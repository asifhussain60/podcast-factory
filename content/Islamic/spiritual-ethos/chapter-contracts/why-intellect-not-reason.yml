thesis_relevance: This chapter advances the book's central claim that in Ali (as)'s ethos the intellect (al-aql) is a spiritual faculty awakened by revelation, by drawing the fundamental distinction between contemplative intellect and discursive reason and showing that ta'wil returns all things to the First, the oneness beyond number.
