show_notes:
  blurb: 'The opening movement of Reza Shah-Kazemi''s central essay on justice — the argument that justice is not first a rule about how we treat one another but a name for the nature of God. Read against Alasdair MacIntyre''s critique of modern ethics and Plato''s vision of the Good, the episode shows why a virtue cut off from the divine turns situational and hollow, why the Imam teaches that God has no opposite so that evil is negation rather than a rival power, and how the whole conception rests on ihsan — worshipping God as if you could see Him. It introduces the letter to Malik al-Ashtar, its recipient and his assassination, and the Imam''s refusal to confirm a single corrupt governor even at the cost of civil war, setting up the essay''s guiding definition: justice is putting everything in its right place, beginning with one''s own relationship to God.

    '
