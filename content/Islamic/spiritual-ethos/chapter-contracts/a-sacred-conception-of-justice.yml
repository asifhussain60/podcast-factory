thesis_relevance: 'This chapter advances the book''s central claim — that the spiritual ethos of Ali (ع), lived out as intellect, remembrance, and justice, is a universal spirituality transcending the sectarian and political divisions of Islam — by establishing the sacred conception of justice itself: that justice is rooted in the divine nature and grounded in the vision of ihsan, so that the ethos of the soul becomes an ethos of the world.

  '
