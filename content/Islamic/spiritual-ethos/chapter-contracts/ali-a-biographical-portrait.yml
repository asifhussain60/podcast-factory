show_notes:
  blurb: >
    Episode one of Spiritual Ethos opens on the figure at the heart of
    the whole book: Ali ibn Abi Talib (peace be upon him), the man the
    Prophet Muhammad (peace and blessings be upon him) called the gate
    to the city of his knowledge. Why hand the key to a religion's
    deepest treasure to a boy who first entered history as a warrior —
    and why do the schools that agreed on almost nothing agree, without
    exception, about him? The episode walks the early period of his
    life: a birth said to have taken place inside the Ka'ba, boyhood in
    the Prophet's household as the first male to embrace Islam, the lone
    answer at the feast of the nearest kin, the night he slept in the
    Prophet's bed for the hijra, the battles of Uhud and Khaybar, and
    his marriage to Fatima, the Confluence of the Two Lights. It gathers
    the verses and sayings by which the tradition knew him — the
    purification verse and the cloak, the mubahila, the two weighty
    things, and the mawla declaration at Ghadir Khumm — and shows how
    devotion to him as head of the Ahl al-Bayt runs across Shi'i, Sunni,
    and Sufi Islam alike. It lands not on sectarian possession but on
    universal spirituality, and hands off to the faculty by which the
    revelation was interiorized: the intellect.
