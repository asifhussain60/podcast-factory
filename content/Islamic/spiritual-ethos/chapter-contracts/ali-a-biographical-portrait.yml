  references:
    - >
      "Reza Shah-Kazemi, Justice and Remembrance — the study whose
      opening chapter this episode introduces, a portrait of the
      spiritual ethos of Ali ibn Abi Talib (peace be upon him) as a
      universal spirituality transcending sectarian boundaries."
    - >
      "The Prophet Muhammad (peace and blessings be upon him) — quoted
      throughout for the sayings on Ali's fada'il, drawn in the source
      from two authoritative Sunni traditionists to show they are not
      confined to Shi'i Islam."
    - >
      "Imam al-Shafi'i, founder of one of the four Sunni schools of
      jurisprudence — cited for his verses on the obligation to love the
      household of the Prophet."
thesis_relevance: >
  This episode advances the book's central claim that the spiritual ethos of Ali (peace be upon him) — his full interiorization of the Qur'anic revelation and the Prophetic Sunna — is a universal spirituality transcending sectarian boundaries, by establishing WHO Ali is: the gate to prophetic wisdom, head of the Ahl al-Bayt, and the embodiment of walaya that all schools revere.
