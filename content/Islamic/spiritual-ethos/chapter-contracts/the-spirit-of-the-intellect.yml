thesis_relevance: >
  This episode advances the book's central claim that Ali's spiritual
  ethos is a universal spirituality centered on the intellect ('aql) as
  a spiritual faculty, by showing that for Ali the intellect is not cold
  reason but a contemplative faculty in creative harmony with revelation
  — the very faculty through which the Qur'an and Sunna are interiorized.
