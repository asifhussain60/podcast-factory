show_notes:
  blurb: >
    Episode two of Spiritual Ethos asks what actually flows through the
    gate the opening portrait placed Ali ibn Abi Talib at: intellect.
    But not intellect as a modern person hears the word. Reza
    Shah-Kazemi rebuilds the term from the ground up — why the Latin
    intellectus and the Greek nous name a faculty of direct
    contemplative vision, where reason (ratio, dianoia) can only think
    about a reality the intellect can see. From there the episode follows
    Ali's answer to a bedouin on the edge of the battle of the Camel —
    that "which has no second does not enter into the category of
    numbers" — into the doctrine of ta'wil as a retracing of all things
    to the First, and into the strange affirm-and-negate language of the
    first sermon of the Nahj, where the divine attributes are both real
    and to be divested in the perfection of ikhlas. It closes on the
    Qur'anic image of God breathing His spirit into clay so that it
    stands up a human being endowed with intellect — and on the claim
    the whole book rests on: the intellect is first and foremost a
    spiritual faculty, and to be true to it is to be spiritual. The next
    episode follows Ali out of the city to a graveyard, where the
    doctrine meets its test.
