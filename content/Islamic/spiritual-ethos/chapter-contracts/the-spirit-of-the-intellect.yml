show_notes:
  blurb: 'The theological heart of Shah-Kazemi''s introduction: what kind of knowing the gate to prophetic wisdom actually transmits. The episode unfolds why the study prefers "intellect" — a faculty of direct, contemplative vision — over "reason," the discursive mind that only thinks ABOUT reality; and the three convictions of the Imam''s worldview: revelation at the centre, revelation and intellect in harmony, and reason as one mode of a deeper faculty. It moves through the bedouin who asks about God''s oneness as battle is joined, the teaching that "that which has no second" cannot be counted, ta''wil as the return of all appearances to their source, the buried treasures of the intellects awakened by revelation as a reminder of a primordial covenant, and the apophasis of the first sermon of the Nahj al-Balagha, where God is affirmed and denied in a single breath so that the heart may "see" what the mind cannot grasp. It closes on the breathing of the divine spirit into man and the definition of the true intellectual — the one who puts each thing in its place.

    '
