thesis_relevance: This chapter advances the book's central claim that Ali (as) embodies the universal spiritual ethos at the heart of Islam by showing that the intellect's realization of the Real bears fruit as joy, beauty (ihsan), and a foretaste of the Hereafter, so that goodness already participates in its reward and deliverance is available here and now.
