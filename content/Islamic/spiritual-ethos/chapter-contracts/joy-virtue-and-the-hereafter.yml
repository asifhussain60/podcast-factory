show_notes:
  blurb: In this ethos knowledge is not cold or dry but the single most joyful thing a human being can do, and the Imam calls sleeping with certainty better than praying with doubt. We close the chapter with joy, beauty as the soul made lovely, detachment that frees, and a Hereafter already tasted in every good act, salvation here and now.
