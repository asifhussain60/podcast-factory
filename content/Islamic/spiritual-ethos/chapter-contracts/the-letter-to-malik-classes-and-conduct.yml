thesis_relevance: 'This chapter advances the book''s central claim — that the spiritual ethos of Ali (ع) is the quintessential spirituality of Islam, a universal vision transcending the divisions of the tradition — by completing, in the Imam''s own words, the second of the book''s two great primary documents, so that the care of the weak, the keeping of faith, and the remembrance the book taught in its own voice are heard whole in his, and the letter and the sermon stand together as the plainest evidence for the claim the study set out to make.

  '
