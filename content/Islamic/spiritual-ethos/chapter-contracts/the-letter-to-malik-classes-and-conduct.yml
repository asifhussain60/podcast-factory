show_notes:
  blurb: 'This episode completes the reading of Ali (ع)''s mandate to Malik al-Ashtar, the book''s second great primary document. Where the first half formed the ruler''s soul and named the instruments of his authority, the second half descends to the ground those instruments serve — the cultivators whose land feeds the state, the scribes and the merchants, and, in the passage the Imam most wants heard, the destitute who can never repay a ruler''s care, where his measured prose breaks into a cry of the divine name and the letter reaches the sharpest edge of its justice. It then climbs back through the governor''s own conduct — his time, his prayer led at the weakest man''s pace, his covenants that his very life must shield, his hands kept clear of unlawful blood — and ends by folding the whole art of governing back into the remembrance of the return to God, closing not with a command but with a prayer the Imam offers for both the man who receives the letter and the man who wrote it. Set beside the opening sermon, the letter shows the book''s single claim from its other side: what the God beyond every word asks of a man handed power over others.

    '
