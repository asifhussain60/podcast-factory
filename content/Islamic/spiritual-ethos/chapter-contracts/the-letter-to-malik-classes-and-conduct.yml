title: 'Letter to Malik: The Classes'
audience: 'Thoughtful adult readers who heard the first half of Ali (ع)''s mandate to Malik al-Ashtar in the previous episode and now meet its completion, set down whole. This episode presents the letter''s second half in refined English: its descent to the productive base of society and to the destitute at its very bottom — the cultivators whose land feeds the state, the scribes and the merchants, and, in the passage the Imam most wants heard, the poor who can never repay a ruler''s care — and its climb back through the governor''s own conduct: how he keeps his time and his prayer, how he holds a covenant once given, how he guards his hands against unlawful blood and his heart against the flattery that effaces a good man''s works. The listener should come away having heard the letter reach its sharpest edge at the care of the poor, and end not with an instruction but with a prayer the Imam offers for them both.

  '
angle: faithful_exposition
angle_note: 'A faithful exposition that completes the reading of the primary source — drawing out what is genuinely fresh in this half (the priority of cultivation over revenue, the change of register at the poor, the weight placed on keeping a pledge, the warning against unlawful bloodshed, the closing discipline of the self), reciting the second half entire, and then hearing how the letter ends by folding the whole art of governing back into the remembrance of the return to God. Doctrines the book already taught from this letter (the classes and the covenant, justice at its sharpest edge, intention beyond consequence, remembrance and justice) are recalled by brief callback, never re-taught.

  '
episode_format: deep_dive
format_rationale: 'The chapter is the second half of a single primary document in one voice — the Imam''s mandate to Malik — unfolded from the care of the land through the survey of the classes and the poor to the ruler''s own conduct and the closing prayer. There is no named opposing party and no proposition under contest; the framing exposition serves one recitation. Deep_dive rather than debate or narrative: it is doctrinal counsel in the second person, sealed with a supplication, not a contest of voices or a bare sequence of events.

  '
essential: core
essential_rationale: 'It completes the book''s second great primary source and carries its most urgent passage — the care of the destitute, where the sacred conception of justice reaches its sharpest edge — so it seals the argument rather than decorating it.

  '
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: 'The scholar_companion carries the framing of what is fresh in this half and the reading of how the letter ends; the curious_mind voices the opening knot — where in a book about the soul of a ruler does the beggar who can do nothing for him belong? — and keeps the recitation tethered to the letter''s own movement, down to the poor and back up to the ruler''s soul.

  '
length_target: extended
sermon:
  present: true
  section_title: The classes and the conduct
key_tensions:
  - 'Last in the order, first in the concern. The destitute come last in the letter''s survey of the classes, yet when the Imam reaches them his measured prose breaks into a doubled cry of the divine name. The hosts must let the placement be heard as deliberate — the care of those who can never repay a ruler is possible only for one who aspires beyond this world, and it is where a governor''s justice is finally weighed.

    '
  - 'Cultivation before revenue. Let concern for the cultivation of the land outweigh concern for the collection of the tax, for no tax is gathered where there is no cultivation. The hosts must present this as the letter''s quietly radical inversion of every treasury''s instinct — revenue is a fruit and cultivation the root, and a ruler who devours the root will soon have neither.

    '
  - 'The two betrayals a ruler most easily commits. A pledge broken and innocent blood shed are treated not as policy failures but as ruptures in the trust God has spread over His servants. The hosts must hold the weight the Imam gives them — a promise binds even when hardship makes breaking it convenient, and blood shed to strengthen authority in truth topples it.

    '
tone_constraints:
  - 'Walk the episode in its given order: the framing of what is fresh in this half (cultivation before revenue; the change of register at the poor; the counsel on pledges, bloodshed, peace, and the discipline of the self) -> the verbatim recitation of the letter''s second half, ending on the closing prayer -> the reading of how the letter ends by turning the whole art of governing back into the remembrance of the return to God.

    '
  - 'R-SERMON-VERBATIM: the section titled "The classes and the conduct" is the second half of the letter itself, rendered whole in refined English. Instruct the hosts to recite it aloud, word for word, before discussing it; it is not to be summarized or fragmented.

    '
  - 'The phrase pairing the leadership-title with the personal name of the Father of Imams is FORBIDDEN (P0). Refer to him as "Ali (ع)", "the Imam", "Amir al-Mu''minin", "Commander of the Faithful", or "the Father of Imams"; keep the "(ع)" marker.

    '
  - 'The Prophet Muhammad takes "(peace and blessings be upon him)" on first mention and "the Prophet" or the honorific thereafter. Malik al-Ashtar is named as given.

    '
  - 'Any Quranic quotation is given in English with its reference in plain words — "(chapter 61, verse 3)", "(chapter 2, verse 156)" — never a bare numeric pair, and stays in English translation only, never paired with an Arabic transliteration run. The Prophet''s sayings quoted within the letter stay in English as the letter reports them.

    '
anchor_passages:
  - '"Cultivation before the tax: ''Let your concern with the cultivation of the land outweigh your concern with the collection of the tax, for no tax will be gathered where there is no cultivation.''"

    '
  - '"The cry at the poor: ''Then — O God, O God! — pay particular attention to the lowest class... they are more in need of justice from you than any others among your subjects.''"

    '
  - '"The prayer led by the weakest: ''Lead them according to the prayer performed by the weakest among them, and be merciful to the believers.''"

    '
  - '"The sanctity of a pledge: ''Make your very life a shield for what you have promised... even the idolaters observed it among themselves, so greatly did they fear the consequences of treachery.''"

    '
  - '"The closing prayer: that God ''seal my life and yours with felicity and with martyrdom. Truly unto Him we are returning'' (chapter 2, verse 156)."

    '
