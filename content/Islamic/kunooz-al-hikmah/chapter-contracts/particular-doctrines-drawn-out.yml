angle_note: 'The author pulls the cycle''s most important doctrines back onto the table for a fuller treatment: the verse of mutual invocation as the Quranic establishment that Ali is the very self of the Prophet, with the divorce-authority over Aisha as the structural consequence drawn into a concrete act; the inner heart beneath the House and opposite the heavenly counterpart as the cosmic enactment of the same negation-affirmation the believer enacts on his tongue with the testimony of faith; the structural floor of the ten righteous in the rock and the precise numerical readings preserved by the rank-holders; the small disciplines of the believer''s mouth and the inner reading of the call to prayer; the final summary of the Imam''s soul as a single continuous mechanism running through the inner heart of the House; and the final word on concealment as the discipline that closes the book as severely as it opened it.'
