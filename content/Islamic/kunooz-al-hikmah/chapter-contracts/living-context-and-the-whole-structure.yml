angle_note: The book's closing source-chapter is a deliberate turn of the listener's gaze from the doctrine in itself to the doctrine in its living context — in the believer's body at his ablution and his pre-dawn meal and the three days after his burial; in the lesson-gathering whose true audience extends past the seated listeners; in the era of veiled presence under today's Dai and today's Imam, the thirty-fifth who gathers fourteen Imams within himself; on the chain that is the believer's own straight path; and finally in the author's closing prayer and the teacher's last step back to read the architecture of the whole. Three concept sections, opened developed and landed inside one episode, each one drawing the prior cosmology down onto a piece of the believer's daily life and his orientation toward the line.
