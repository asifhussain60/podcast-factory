show_notes:
  - The riyat doctrine restated as daily practice — at ablution, at the pre-dawn meal, at the breaking of the fast
  - The three days after burial as the window when the family's offerings reach the riyat directly
  - The two atonements of the completeness of ablution — external cold and internal coldness
  - The lesson-gathering's hidden audience — the departed inner forms attend; the questioner asks for more than himself
  - The early teacher's witnessed circumambulation of the souls of the three great early figures; the cry of longing as anticipation
  - Concealment is not absence — the structural condition of veiled presence under the Dai and the veiled Imam
  - Today's Imam, the thirty-fifth, gathers fourteen Imams within himself — the extraordinarily gathered moment
  - The prayer for today's Dai and today's Imam as the structural prayer of the believer of today
  - The straight path of the daily prayer as the believer's unique chain — the rung immediately above as the rung where the chain most matters
  - Two types of progress — striven-for and lap-transferred; the slow rate of three hundred and sixty
  - The author's closing prayer for his Dai — a template for our prayers for our Dai
  - The covenant at the end — the discipline of concealment runs to the last page
  - The teacher's final step back — the sixteen movements of the book read as one architecture
  - The recurring principles — the chain is everything, twenty-eight is the eternal order, death does not interrupt the line, concealment is structural, the believer is the term of the human ascent, the cycle is bounded
thesis_relevance: This chapter advances the book's central claim that the Ismaili-Tayyibi line preserves an inner architecture of cosmology and succession that the outer record only hints at, by closing the book at the point where the inner architecture lands in the believer's own body and his daily prayer, in the room of the lesson, in the present veiled era under today's Dai and today's Imam, and in the architecture of the whole that the teacher's final step back makes visible as one continuous teaching from the first praise of the divine to the absorption at the great round's end.
