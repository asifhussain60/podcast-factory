angle_note: 'The third great teaching of the book opens: the true heart hidden beneath the outer House, the eternal numbers twenty-eight and twenty-nine that fix the Messenger and the Father of Imams in a single sequence, and three of the numbered lectures that unfold the doctrine — the Most Fortunate Corner of the House, Aaron and the Mim, and the doctrine of return.'
