  references:
    - Sayyidna Sarimuddin (Sayyidna Ibrahim ibn Muhammad ibn Fahd) — on the parallel ascent of *suwarat* in the *lahut* and *riyadat* in the *nasut*.
    - Sayyidna Hibatullah bin Sayyidna Ibrahim, *Saqilat al-Quloob min al-Fikr* (also *al-Munawwirah lil-Basair*, *al-Musfiyah lil-Suwar*) — twelfth question, the formation of the Imam's soul.
    - Sayyidna Muhammad bin Tahir, *Anwar al-Latifah* — the case of the *uyafa*.
    - Hadrat Gyani Sahib *muqaddas* — the open question about which of Imam Husayn's veils came forward at Karbala.
    - Al-Walid Abdullah Sahib — the principle of relying on the Dai's answer, not on the questioner's framing.
    - Mawlana Iddan Sahib — the teaching that the World of Origination IS the Intellects themselves.
    - Chapter 36 — 'that is the determination of the Mighty, the Knowing' read for the Ashir.
    - Chapter 55, verse 33 — 'they pass through; you do not pass through except with an authority' — read for the *barzakh* of the Ashir.
    - Chapter 12, verse 24 — 'had he not seen the proof of his Lord' — the Joseph verse read as the Imam's substance.
    - Chapter 97 — *Inna anzalna* recited after ablution to make the next prayer accepted.
thesis_relevance: 'This chapter advances the book''s central claim that the stored wisdom is addressed to the duat who carry the call through concealment by laying down the two cosmological frames every later chapter assumes: the forbidden modality of the Originator''s act and the doctrine of the Imam''s dissolved heart that supplies the ranks with the substance by which the call is carried at all.

  '
