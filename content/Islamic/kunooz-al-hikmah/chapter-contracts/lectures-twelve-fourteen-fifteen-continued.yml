angle_note: 'The closing stretch of the further lectures gathers three teachings: the geography of the Hajj as the geography of the inner core of the Era of Concealment — Arafat to the Messenger, Muzdalifah to Fatimah, Mina to the Father of Imams — with the doctrine of the designation as a structural recapitulation of the testimony of faith and the gathering at the lesson that includes the departed; the three days of the Riser as the compressed work of the final accounting, with the daily prayer of the believer read as the chain of the part-duat in which he stands and the precise rate of spiritual progress — three hundred and sixty souls in the body, one part per great cycle; and the rolling up of the heaven at the end of each great cycle, the giving of the answer that the fourth Imam withheld from Umm al-Nada — one great round has passed, nine remain — and the final absorption into the First Sender.'
