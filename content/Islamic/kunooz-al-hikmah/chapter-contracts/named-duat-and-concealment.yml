  references:
    - Sayyidna Sulayman bin Hasan — gatherer of the secrets of the duat of Yemen.
    - Sayyidna Muhammad bin Ismail — first Dai to emigrate from Yemen to Najran; only Dai permitted to lead prayers in Habasha.
    - Sayyidna Ali bin Sulayman, *Shual al-Anwar* and *Anwar al-Shashaniyyah* — springs of doctrine that had not been framed before.
    - Sayyidna Hibatullah al-Muayyad, titled *Alamuddin* — the Dai of the time at the moment of the book's composition.
    - Surah al-Hajj, chapter 22, verses 58 to 65 — the Keys of the Gardens, fifteen of the Beautiful Names in one cluster.
    - Surah al-Fath, chapter 48, verses 1 to 2 — 'a clear victory, that Allah may forgive you your former and latter sins,' read in the inner register.
    - Sayyidna Sijilmasi's lament of his sins like mountains — read as the lament of unfulfilled good.
thesis_relevance: 'This chapter advances the book''s central claim that the stored wisdom is addressed to the duat who carry the call through concealment by closing the praise on the named duat who have so carried it across generations, opening the body of the book with an invocation that prays for the enclosure within which the call lives, and imposing on the reader the covenant of permission without which the treasures cannot be opened.

  '
