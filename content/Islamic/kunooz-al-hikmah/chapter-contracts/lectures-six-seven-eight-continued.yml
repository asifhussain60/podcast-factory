angle_note: 'The first stretch of the book''s further lectures opens three teachings together: the doctrine of the recurring cycles and the two modes by which the line of the Family of the House appears in them — its actual persons and its representational presences in figures whose outer biographies seem foreign; the cave verse of the Chapter of Repentance read as the line''s first separation, with the missing tranquility on the companion and the unburied body of the Messenger at the shed of the tribe of Saidah; and the precise doctrine of return — same rank, same place, fixed thousand-year cycle, with the explicit refusal to put a soul back into the same body.'
