angle_note: 'The appendix opens with the author''s own posture before the command — first an excuse of insufficiency, then immediate obedience as the goal itself; the conversational lectures then dwell on three closely related disciplines: the measure of sin in the higher ranks, the severity of concealment and the closed door of speculating about origination, and the doctrine of the Imam''s soul dissolving into the heart of the House, the three-day window after burial, and the chain through which the line is carried.'
