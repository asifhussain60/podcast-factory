  references:
    - Sayyidna Ali bin Husayn al-Jamari — the treatise distinguishing *kulli ismah* (Pure Imams) from *juzi ismah* (the duat, esp. the *qaimi duat*).
    - Sayyidna Hibatullah, *Kanz al-Ulum* — the station of Fatimah al-Zahra beyond the gnosis of the Pure Imams; the *Aimmah Fatimiyyin*.
    - Sayyidna Ibrahim bin Muhammad al-Fad, *Kanz al-Ulum* — the line on the *qudar al-Fatimiyyah* developed.
    - Sayyidna Ibrahim bin Husayn al-Hamidi, *Kanz al-Walad* — the parallel treatise for his son Sayyidna Hatim.
    - Sayyidna Abd al-Ali bin Hasan al-Wajih — the treatise establishing that the *nur* of the *Ism al-Azam* exceeds the *nur* of the *Bismillah*.
    - Sayyidna Ali bin Sulayman, *Shual al-Anwar* — declared by the author himself a book of *al-haqaiq wad-daqaiq*; springs of secrets.
    - Mubahalah verse (chapter 3, verse 61) — 'our selves and your selves' grounding the *nafs* identity of the Father of Imams with the Prophet.
    - Ghadir Khumm — 'of whomsoever I am master, this Ali is his master.'
thesis_relevance: 'This chapter advances the book''s central claim that the stored wisdom is addressed to the duat who carry the call through concealment by laying down, in the opening praise itself, who those duat are (masters of *juzi ismah*), why they hold the call (the line of veiling from the Prophet through Fatimah and the Imams to the hidden Imam), and what substance they are to draw from (the bewildered believer as *shay*, the believer''s essence as the garden of the *nasut khas*).

  '
