angle_note: 'The middle stretch of the further lectures gathers three teachings: the calendar discipline of the twenty-first and the cosmology of the enemies at the two cosmic nodes, with the inner mechanism by which slaughter and cooking detach the sensitive soul from the meat; the climb up the hierarchy of beings to the believer at its summit and the means of approach to the Worshipped through the ranks of the call; and the sacrificial discipline at Mina that opens into the daily prayer as the believer''s own offering, the pre-eternal designation of the dai''s office held across fourteen years of imprisonment, and the rare doctrine that the refined remnants of the ranks of the call form into the crown-jewels of kings, the pigeons of the House, and the salt of the table.'
