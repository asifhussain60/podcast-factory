angle_note: 'The appendix carries its disciplines to the daily and the cosmic edges at once: the one sin that is not forgiven and the subtle dilutions that count as it; the believer as the summit of beings and the number twenty-eight as the order of the higher world; the four-phrase litany that works through the four layers of the soul; the two stations of the Dai and the doctrine of visitation; the two Mehdis distinguished and the great cycle carried to its term; and the practical frame — charity, salt, the rule about the meat for an infant, the call to prayer, the straight path as one''s own chain — by which the cosmology is lived.'
