<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="'Lato', system-ui, sans-serif">
  <defs><marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8b4513"/></marker></defs>
  <rect x="0" y="0" width="760" height="360" fill="#ffffff"/>
