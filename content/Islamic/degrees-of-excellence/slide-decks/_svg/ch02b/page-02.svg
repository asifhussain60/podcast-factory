<svg viewBox="0 0 760 600" xmlns="http://www.w3.org/2000/svg" font-family="'Lato', system-ui, sans-serif">
  <text x="40" y="42" font-size="20" font-weight="700" fill="#8b4513">The Architecture of a Domain</text>
  <text x="40" y="72" font-size="14" fill="#7a6a58">
    <tspan x="40" dy="0">A domain is crowned not by the member most acted upon, but by the one that</tspan>
    <tspan x="40" dy="20"> originates and quickens.</tspan>
  </text>

  <!-- ranked levels, top-down, joined by hairlines -->
  <rect x="260" y="130" width="240" height="46" rx="8" fill="#f7f1e6" stroke="#8b4513" stroke-width="2"/>
  <text x="380" y="159" font-size="15" font-weight="700" fill="#2b2117" text-anchor="middle">Originator I</text>

  <line x1="380" y1="176" x2="380" y2="196" stroke="#d9cdbd" stroke-width="1.5"/>
  <rect x="260" y="196" width="240" height="46" rx="8" fill="#f7f1e6" stroke="#d9cdbd" stroke-width="1.5"/>
  <text x="380" y="225" font-size="15" fill="#2b2117" text-anchor="middle">Conductor II</text>

  <line x1="380" y1="242" x2="380" y2="262" stroke="#d9cdbd" stroke-width="1.5"/>
  <rect x="260" y="262" width="240" height="46" rx="8" fill="#f7f1e6" stroke="#d9cdbd" stroke-width="1.5"/>
  <text x="380" y="291" font-size="15" fill="#2b2117" text-anchor="middle">Integrator III</text>

  <line x1="380" y1="308" x2="380" y2="328" stroke="#d9cdbd" stroke-width="1.5"/>
  <rect x="260" y="328" width="240" height="46" rx="8" fill="#f7f1e6" stroke="#d9cdbd" stroke-width="1.5"/>
  <text x="380" y="357" font-size="15" fill="#2b2117" text-anchor="middle">Animator IV</text>

  <line x1="380" y1="374" x2="380" y2="394" stroke="#d9cdbd" stroke-width="1.5"/>
  <rect x="260" y="394" width="240" height="46" rx="8" fill="#f7f1e6" stroke="#d9cdbd" stroke-width="1.5"/>
  <text x="380" y="423" font-size="15" fill="#2b2117" text-anchor="middle">Manifestor V</text>

  <line x1="40" y1="470" x2="720" y2="470" stroke="#d9cdbd" stroke-width="1"/>
  <text x="40" y="500" font-size="13" fill="#2b2117">
    <tspan x="40" dy="0">Among the four physical elements, fire alone is placed at the summit. While cold</tspan>
    <tspan x="40" dy="20"> and dryness receive and take on qualities, fire acts. It illumines, elevates, and</tspan>
    <tspan x="40" dy="20"> stirs the inert into life. The summit is always the giver.</tspan>
  </text>
</svg>
