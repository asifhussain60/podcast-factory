<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="'Lato', system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#8b4513"/>
    </marker>
  </defs>
  <text x="40" y="42" font-size="20" font-weight="700" fill="#8b4513">The Escalation of the Animal Kingdom</text>

  <!-- step 1 -->
  <rect x="80" y="80" width="600" height="90" rx="10" fill="#f7f1e6" stroke="#d9cdbd" stroke-width="1.5"/>
  <text x="100" y="118" font-size="13" fill="#2b2117">
    <tspan x="100" dy="0"><tspan font-weight="700">1. Mastery:</tspan> Horse, Eagle, Lion. Excellence achieved via physical</tspan>
    <tspan x="100" dy="20"> dominance, speed, or mastery of the hunt.</tspan>
  </text>

  <line x1="380" y1="170" x2="380" y2="200" stroke="#8b4513" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 2 -->
  <rect x="80" y="205" width="600" height="90" rx="10" fill="#f7f1e6" stroke="#d9cdbd" stroke-width="1.5"/>
  <text x="100" y="243" font-size="13" fill="#2b2117">
    <tspan x="100" dy="0"><tspan font-weight="700">2. Generosity:</tspan> Gazelle, Bee. Excellence refined via yielding a</tspan>
    <tspan x="100" dy="20"> precious product the world could not otherwise have (musk, honey).</tspan>
  </text>

  <line x1="380" y1="295" x2="380" y2="325" stroke="#8b4513" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 3 -->
  <rect x="80" y="330" width="600" height="110" rx="10" fill="#f7f1e6" stroke="#8b4513" stroke-width="2"/>
  <text x="100" y="368" font-size="13" fill="#2b2117">
    <tspan x="100" dy="0"><tspan font-weight="700">3. Organized Leadership:</tspan> The Ya'sub (Lead Bee). The ultimate</tspan>
    <tspan x="100" dy="20"> natural image: a community ordered entirely around its Chief to</tspan>
    <tspan x="100" dy="20"> produce a cure for mankind.</tspan>
  </text>
</svg>
