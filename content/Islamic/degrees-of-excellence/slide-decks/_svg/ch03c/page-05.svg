<svg viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" font-family="'Lato', system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b4513"/>
    </marker>
  </defs>

  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#8b4513"><tspan x="380" dy="0">Obscurity is Not Withholding, But Wisdom Routed Through </tspan><tspan x="380" dy="24">a Channel the Ground Can Absorb</tspan></text>

  <!-- source -->
  <rect x="200" y="76" width="360" height="52" rx="10" fill="#efe2d0" stroke="#8b4513" stroke-width="1.5"/>
  <text x="380" y="107" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2117">The Immediate Command / Obscurity</text>
  <line x1="380" y1="128" x2="380" y2="156" stroke="#8b4513" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- channel layers -->
  <rect x="260" y="160" width="240" height="40" rx="8" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="380" y="185" text-anchor="middle" font-size="14" fill="#2b2117">Time</text>
  <line x1="380" y1="200" x2="380" y2="226" stroke="#8b4513" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="260" y="230" width="240" height="40" rx="8" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="380" y="255" text-anchor="middle" font-size="14" fill="#2b2117">Resistance</text>
  <line x1="380" y1="270" x2="380" y2="296" stroke="#8b4513" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="260" y="300" width="240" height="40" rx="8" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="380" y="325" text-anchor="middle" font-size="14" fill="#2b2117">Discipline</text>
  <line x1="380" y1="340" x2="380" y2="366" stroke="#8b4513" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- intended wisdom -->
  <rect x="200" y="370" width="360" height="52" rx="10" fill="#efe2d0" stroke="#8b4513" stroke-width="1.5"/>
  <text x="380" y="401" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2117">The Intended Wisdom</text>

  <!-- explanation -->
  <rect x="40" y="446" width="680" height="94" rx="10" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="60" y="474" font-size="14" fill="#2b2117"><tspan x="60" dy="0">When people cannot receive wisdom plainly, the imam embeds it in dense symbols. </tspan><tspan x="60" dy="23">The believer's resistance is a fact about the length of their sight, not the </tspan><tspan x="60" dy="23">emptiness of the command.</tspan></text>
</svg>
