<svg viewBox="0 0 760 712" xmlns="http://www.w3.org/2000/svg" font-family="'Lato', system-ui, sans-serif">
  <text x="380" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#8b4513">Every Added Spirit Grants a New Dominion Over the World Below It</text>

  <line x1="380" y1="144" x2="380" y2="562" stroke="#d9cdbd" stroke-width="1.5"/>

  <!-- Level 5 -->
  <rect x="140" y="62" width="480" height="82" rx="10" fill="#f7f1e6" stroke="#8b4513" stroke-width="1.5"/>
  <text x="380" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#8b4513">Apex Level 5</text>
  <text x="380" y="109" text-anchor="middle" font-size="18" font-weight="700" fill="#2b2117">The Imam</text>
  <text x="380" y="131" text-anchor="middle" font-size="13" fill="#7a6a58">Quintessence &amp; Total Subjecthood of Humanity</text>

  <!-- spirits into level 5 -->
  <rect x="278" y="155" width="204" height="22" rx="11" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="380" y="170" text-anchor="middle" font-size="12" fill="#8b4513">+ Ruh al-quds (Sanctified)</text>
  <rect x="252" y="183" width="256" height="22" rx="11" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="380" y="198" text-anchor="middle" font-size="12" fill="#8b4513">+ Ruh al-wahda (Creative) (Oneness)</text>

  <!-- Level 4 -->
  <rect x="140" y="214" width="480" height="74" rx="10" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="380" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#8b4513">Level 4</text>
  <text x="380" y="257" text-anchor="middle" font-size="18" font-weight="700" fill="#2b2117">Human</text>
  <text x="380" y="279" text-anchor="middle" font-size="13" fill="#7a6a58">Dominion over the Lower World</text>

  <rect x="258" y="298" width="244" height="22" rx="11" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="380" y="313" text-anchor="middle" font-size="12" fill="#8b4513">+ Ruh al-nutq (Articulate Reason)</text>

  <!-- Level 3 -->
  <rect x="140" y="330" width="480" height="74" rx="10" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="380" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#8b4513">Level 3</text>
  <text x="380" y="373" text-anchor="middle" font-size="18" font-weight="700" fill="#2b2117">Animal</text>
  <text x="380" y="395" text-anchor="middle" font-size="13" fill="#7a6a58">Subjugation of Plant</text>

  <rect x="252" y="414" width="256" height="22" rx="11" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="380" y="429" text-anchor="middle" font-size="12" fill="#8b4513">+ Ruh al-hiss (Spirit of Sensation)</text>

  <!-- Level 2 -->
  <rect x="140" y="446" width="480" height="74" rx="10" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="380" y="466" text-anchor="middle" font-size="12" font-weight="700" fill="#8b4513">Level 2</text>
  <text x="380" y="489" text-anchor="middle" font-size="18" font-weight="700" fill="#2b2117">Plant</text>
  <text x="380" y="511" text-anchor="middle" font-size="13" fill="#7a6a58">Subservience of Earth</text>

  <rect x="258" y="530" width="244" height="22" rx="11" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="380" y="545" text-anchor="middle" font-size="12" fill="#8b4513">+ Ruh al-nama' (Spirit of Growth)</text>

  <!-- Level 1 -->
  <rect x="140" y="562" width="480" height="64" rx="10" fill="#efe2d0" stroke="#d9cdbd"/>
  <text x="380" y="583" text-anchor="middle" font-size="12" font-weight="700" fill="#8b4513">Level 1</text>
  <text x="380" y="607" text-anchor="middle" font-size="18" font-weight="700" fill="#2b2117">Earth</text>

  <text x="380" y="664" text-anchor="middle" font-size="13" font-style="italic" fill="#7a6a58"><tspan x="380" dy="0">Rank is not a symbol of authority. Rank is authority; </tspan><tspan x="380" dy="20">the two are the same quantity read twice.</tspan></text>
</svg>
