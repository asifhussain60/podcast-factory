<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="'Lato', system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b4513"/>
    </marker>
  </defs>

  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#8b4513">To Claim an Act is Empty is to Declare the Actor Wisdom-less</text>

  <line x1="380" y1="60" x2="380" y2="358" stroke="#d9cdbd" stroke-width="1"/>

  <!-- Equation 1 -->
  <text x="205" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#8b4513">Equation 1 (The Futile Act)</text>
  <rect x="50" y="92" width="310" height="42" rx="8" fill="#efe2d0" stroke="#8b4513" stroke-width="1.5"/>
  <text x="205" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2117">Action (A) = Inaction (B)</text>
  <text x="205" y="154" text-anchor="middle" font-size="13" fill="#2b2117">Net Result: Zero (Wisdom sitting idle).</text>
  <text x="205" y="173" text-anchor="middle" font-size="12" font-style="italic" fill="#7a6a58">Structurally impossible for the Wise Agent.</text>

  <rect x="60" y="188" width="290" height="38" rx="8" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="205" y="211" text-anchor="middle" font-size="13" fill="#2b2117">This command makes no sense.</text>
  <line x1="205" y1="226" x2="205" y2="250" stroke="#8b4513" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="254" width="290" height="38" rx="8" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="205" y="277" text-anchor="middle" font-size="13" fill="#2b2117">This individual has departed from wisdom.</text>
  <line x1="205" y1="292" x2="205" y2="316" stroke="#8b4513" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="320" width="290" height="38" rx="8" fill="#efe2d0" stroke="#8b4513" stroke-width="1.5"/>
  <text x="205" y="343" text-anchor="middle" font-size="13" font-weight="700" fill="#2b2117">Exit from the domain of the Imamate.</text>

  <!-- Equation 2 -->
  <text x="555" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#8b4513">Equation 2 (The Wise Act)</text>
  <rect x="400" y="92" width="310" height="42" rx="8" fill="#efe2d0" stroke="#8b4513" stroke-width="1.5"/>
  <text x="555" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2117">Action (A) &#8800; Inaction (B)</text>
  <text x="555" y="158" text-anchor="middle" font-size="13" fill="#2b2117"><tspan x="555" dy="0">Net Result: Absolute structural welfare </tspan><tspan x="555" dy="19">(Even if obscured by time delay).</tspan></text>
  <rect x="410" y="196" width="290" height="40" rx="8" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="555" y="221" text-anchor="middle" font-size="13" fill="#2b2117">The necessary state of the Imamic decree.</text>

  <!-- footer -->
  <rect x="40" y="390" width="680" height="66" rx="10" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="380" y="416" text-anchor="middle" font-size="13" font-style="italic" fill="#2b2117"><tspan x="380" dy="0">Taslim is not a surrender of the mind. It is what the mind concludes once it </tspan><tspan x="380" dy="21">has granted that the Wise One is wise.</tspan></text>
</svg>
