<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="'Lato', system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b4513"/>
    </marker>
  </defs>

  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#8b4513">Abstract Authority is the Physical Hinge for the Pillars of Sacred Law</text>

  <text x="380" y="64" text-anchor="middle" font-size="13" font-style="italic" fill="#7a6a58"><tspan x="380" dy="0">The doctrines are not abstract theories to be set aside. They are the living </tspan><tspan x="380" dy="20">hinge on which every single act of worship turns.</tspan></text>

  <!-- pillars -->
  <rect x="30" y="118" width="150" height="46" rx="8" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="105" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2117">The Prayer</text>
  <rect x="213" y="118" width="150" height="46" rx="8" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="288" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2117">The Alms</text>
  <rect x="396" y="118" width="150" height="46" rx="8" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="471" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2117">The Fast</text>
  <rect x="579" y="118" width="150" height="46" rx="8" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="654" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2117">The Pilgrimage</text>

  <!-- hinge fan-out lines -->
  <line x1="380" y1="256" x2="105" y2="166" stroke="#8b4513" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="256" x2="288" y2="166" stroke="#8b4513" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="256" x2="471" y2="166" stroke="#8b4513" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="256" x2="654" y2="166" stroke="#8b4513" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- hinge -->
  <rect x="285" y="258" width="190" height="52" rx="10" fill="#efe2d0" stroke="#8b4513" stroke-width="2"/>
  <text x="380" y="290" text-anchor="middle" font-size="16" font-weight="700" fill="#2b2117">The Living Hinge</text>

  <!-- foundations rise into hinge -->
  <line x1="150" y1="398" x2="360" y2="312" stroke="#8b4513" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="398" x2="380" y2="312" stroke="#8b4513" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="610" y1="398" x2="400" y2="312" stroke="#8b4513" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="45" y="400" width="210" height="52" rx="8" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="150" y="432" text-anchor="middle" font-size="14" fill="#2b2117">Dominion (Ownership)</text>
  <rect x="275" y="400" width="210" height="52" rx="8" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="380" y="432" text-anchor="middle" font-size="14" fill="#2b2117">Wisdom (Trust)</text>
  <rect x="505" y="400" width="210" height="52" rx="8" fill="#f7f1e6" stroke="#d9cdbd"/>
  <text x="610" y="432" text-anchor="middle" font-size="14" fill="#2b2117">Necessity (Inevitability)</text>
</svg>
