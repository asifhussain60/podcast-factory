  references:
    - Ahmad b. Ibrahim al-Naysaburi, Kitab ithbat al-imama — the theory of degrees of excellence (tafadul) developed across its middle sections
    - Abu'l-Fawaris, al-Risala fi'l-imama — the disparity-is-wisdom passage on why human inequality is devised wisdom
    - Aristotle's ten categories (substance and the nine accidents), used as the scaffolding for the argument on degrees of excellence
    - Qur'an, chapter 16, verse 71 and chapter 17, verse 70 — the theme of favor and excellence in creation
thesis_relevance: 'This chapter delivers the book''s central claim directly: that the imamate is a rational necessity, provable from the structure of reality through the theory of degrees of excellence. It shows the argument in full — that every ordered domain of creation has its summit, that humanity is the summit of nature, and that the imam is therefore the summit and quintessence of humanity — which is the very thesis the rest of the treatise turns toward history, law, and the question of succession.

  '
