length_target: extended
essential: core
essential_rationale: 'This is the treatise''s culmination and the destination of every earlier argument; the summit figure and the God-mirroring doctrine are the point the whole book has been building toward, so the episode is indispensable.

  '
key_tensions:
  - 'The summit of summits, and its continuity. Ali b. Abi Talib is named the perfector of every prophet and imam before him, and the reigning imam of each age is said to continue and complete that summit. The hosts should keep the two referents clear — the historical summit and its present continuation — without ever naming the reigning imam.

    '
  - 'Mirroring God as the highest praise. The doctrine that the imam gives to the faithful and faithless alike, conceals the means of benefit, and moves between nearness and distance is deliberately unsettling. The hosts should let the listener feel the scandal and then the logic — that this impartial conduct is precisely what keeps faith from being bought.

    '
  - 'Between reduction and exaggeration. Al-Naysaburi steers between those who judge the imam by the standard of ordinary rulers and the exaggerators who claim divinity for him. The hosts should hold that middle line exactly — the Universal Vicegerent, a shadow that imitates what casts it, neither a mere king nor a god.

    '
tone_constraints:
  - 'Follow al-Naysaburi''s order: the summit of summits and the perfector first, then the imam who mirrors God''s dealings, then the vicegerent and the closing supplication.

    '
  - 'Render the source''s numerology of the reigning imam (the sixth, the seventh, the ninth, the second, the perfector of those who have passed) abstractly, as the imam who completes the cycle of those before him. Never print the name of the reigning imam or of any Fatimid caliph.

    '
  - 'Anchor passages are rendered as accurate English, quoted directly, never as an Arabic transliteration run paired with a translation. The closing supplication is rendered faithfully and in full as the episode''s landing, not summarized.

    '
  - 'Cite a Quran verse inline in plain English as (chapter N, verse M) only where the source names it; where the source gives a verse without a number, quote it without a reference. Invent no citations.

    '
  - 'Keep the reigning imam unnamed; refer to the first imam as the Commander of the Faithful, Ali b. Abi Talib, or the Father of Imams. The phrase "Imam Ali" is forbidden. Do not reconstruct the manuscript-submission provenance beyond a single clause. First-occurrence phonetics only for: mutimm, ahl al-haqq, ahl al-batil, ghulat, Khidr.

    '
anchor_passages:
  - 'The summit of summits: ''That peak and utmost degree is the Commander of the Faithful, Ali b. Abi Talib. He is the summit of all summits, the furthest limit beyond which there is no other limit.'''
  - 'Body, spirit, heart: ''He is like the head, and they are like the body. They are the body, while the Commander of the Faithful is the spirit... the Commander of the Faithful is like the heart, while all those who have passed away are like the limbs.'''
  - 'Mirroring God''s impartial bounty: as God gives worldly benefit to the pious and impious, believer and unbeliever alike so that faith is never for the sake of this world, so the imam gives to the obedient and disobedient alike, following God''s own conduct.'
  - 'The middle path: some look at him with short-sightedness, judging him by the standard of ordinary men, and others with exaggeration, claiming divinity for him; but he is ''the Universal Vicegerent of God among His worshippers.'''
  - 'The closing supplication: the plea for gratitude in word, deed, and intention and for success in obedience to the imam of the age, ending ''Praise be to God, the praise of the thankful, the mindful, and the pious, and prayers upon His Messenger, our master Muhammad, and all his progeny.'''
