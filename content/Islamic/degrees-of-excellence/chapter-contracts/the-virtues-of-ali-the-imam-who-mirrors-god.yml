  thesis_relevance: 'This chapter advances the book''s central claim to its conclusion, showing that the summit the whole proof demanded is realized in the Commander of the Faithful, Ali b. Abi Talib, and continued in the reigning imam whose dealings with creation mirror God''s own — the destination toward which the pole of religion, the ladder of excellence, worship, law, and history all pointed.

    '
