    - al-Naysaburi, Kitab istitar al-imam — on the concealment of the imams and the period of concealment (dawr al-satr)
    - al-Naysaburi, al-Risala al-mujaza al-kafiya fi adab al-du'at — the etiquette and qualities of the ideal summoner
    - The tenth century as the 'Ismaili century' in the history of Islam (Louis Massignon)
    - The maturation of Fatimid Ismaili theology, compared to the flowering of Christian theology in the age of Thomas Aquinas (Heinz Halm)
thesis_relevance: 'This chapter advances the book''s central claim — that the imamate is a rational necessity, provable through reason and nature and not by revelation alone, culminating in the theory of degrees of excellence — by establishing the world, the author, and the method that make the argument possible: why the imamate was the doctrine on which an empire was staked, how al-Naysaburi''s Nishapur formation let him wield philosophy without being ruled by it, and how his seven-section treatise sets out to prove the imam necessary by argument rather than scripture alone.

  '
