  thesis_relevance: 'This chapter advances the book''s central claim that the imamate is the necessary pole of religion by spelling out what that necessity entails — a dominion grounded in the imam''s added spirits and absolute wisdom, and a supreme leadership that reason alone shows must belong to the best of all.

