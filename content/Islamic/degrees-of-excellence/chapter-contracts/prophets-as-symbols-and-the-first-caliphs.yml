length_target: extended
essential: core
essential_rationale: 'This episode carries the treatise''s argument from prophetic history and its case on succession — the historical half of the proof — without which the turn from doctrine to the concrete question of who holds the office would be missing.

  '
key_tensions:
  - 'Designation, not election. The lesson al-Naysaburi draws from Adam and the angels is that even a sinless world was given an appointed vicegerent, so the imamate can never be a matter of choice. The hosts should let this set the terms of the whole succession question.

    '
  - 'The direction of prayer as a sign. Reading each prophet''s qibla — Jerusalem for Moses, the east for Jesus, the Ka''ba for Muhammad — as pointing to the living imam is the episode''s interpretive heart. The hosts should keep the symbolism disciplined, tied to al-Naysaburi''s claim that the imamate returned to the house of Abraham through Ishmael.

    '
  - 'Weighed and found wanting. The refutation of the first caliphs rests on their own words and on the three virtues. The hosts should present it as al-Naysaburi''s measured argument from the record — the flight at Hunayn, the pulpit confessions — rather than as polemic for its own sake.

    '
tone_constraints:
  - 'Follow al-Naysaburi''s order: Adam and Noah first, then the returning qibla through Abraham, Moses, Jesus, and Muhammad, then the three virtues and the refutation of the first caliphs.

    '
  - 'Handle the refutation of the caliphs as faithful exposition of al- Naysaburi''s own case, measured and grounded in the recorded words he cites. Abu Bakr and Umar may be named, as the source names them.

    '
  - 'Anchor passages are rendered as accurate English, quoted directly, never as an Arabic transliteration run paired with a translation.

    '
  - 'Quran references are given inline in plain English as (chapter N, verse M): the vicegerent on earth (chapter 2, verse 30), no change in God''s way (chapter 17, verse 77; chapter 33, verse 62), the Lord who creates and chooses (chapter 28, verse 68), and the virtues of striving, knowledge, and piety (chapter 4, verses 95 to 96; chapter 39, verse 9; chapter 58, verse 11; chapter 49, verse 13). Invent no others.

    '
  - 'Keep the reigning imam unnamed; refer to the first imam as the Commander of the Faithful, Ali b. Abi Talib, or the Father of Imams. The phrase "Imam Ali" is forbidden. Render the son of Noah as Shem. First-occurrence phonetics only for: nass, sunna, nur al-imama, falta.

    '
anchor_passages:
  - 'The lesson of the angels: ''Indeed, I am placing a vicegerent on earth. They said: Are You going to create one that will corrupt and shed blood on it while we glorify Your praises? He said: Surely, I know what you know not'' (chapter 2, verse 30).'
  - 'Noah''s ark: ''The likeness of my family among you is like Noah''s ark: whoever boards it will be saved, and whoever stays behind will be drowned.'''
  - 'The returning direction: the Prophet turned the people from Jerusalem to the Ka''ba that Abraham and Ishmael had built, a sign that ''the imamate had therefore returned to the children of Ismail, who are the children of the Prophet Muhammad, may God bless him.'''
  - 'Abu Bakr on the pulpit: ''You have appointed me, although I am not the best among you'' — and Umar''s word that the oath to Abu Bakr had been a falta, a hasty slip whose evil God averted.'
