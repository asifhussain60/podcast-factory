thesis_relevance: 'This chapter advances the book''s central claim — that the Oneness of Allah is attained through the gnosis of the ranks joined to allegiance and action — by dividing that gnosis into the outer knowing shared by friend and foe and the inner knowing without which there is no Tawhid, and by naming the Mukathir as the nearest rank through which the seeker first enters the hierarchy. It supplies the entry point on which the later ladder of Tawhid is built.

  '
