show_notes:
  blurb: 'The volume now asks the most basic question in the faith — what is Tawhid? — and answers that the reflexive reply, "to consider Allah as one," is not merely incomplete but the very error it imagines it refutes, because to count Him as one subjects Him to number. Real Tawhid is the gnosis of the ranks: to know each rank of the spiritual hierarchy as unique in its place, and to know exactly where it stands. Because the beings are innumerable, this is the highest of all knowledge, and a soul''s eternal station is the precise measure of how much of it he attains and enacts. The full teaching carries three branches — Tawhid, tanzih, and tajrid — and the gnosis of the ranks divides into an outer knowledge, where friend and enemy are equal, and an inner knowledge of a rank''s beginning, level, and return, without which there is no Tawhid at all. The road into the ranks runs through two thresholds, the responder and the believer, to the first rank, the Mukathir — who becomes what he is only by first breaking his own self.

    '
