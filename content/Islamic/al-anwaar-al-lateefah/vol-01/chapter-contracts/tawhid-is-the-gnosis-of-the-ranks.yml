thesis_relevance: 'This episode advances the book''s central claim — that the soul attains the Oneness of Allah only through wilayah and ''amal — by redefining that Oneness itself: Tawhid is the gnosis of the ranks, attained through knowledge and action together, so the path home necessarily runs through the recognition of the hierarchy rather than through a bare numerical affirmation.

  '
