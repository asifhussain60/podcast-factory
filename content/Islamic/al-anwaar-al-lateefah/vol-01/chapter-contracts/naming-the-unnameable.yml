essential: core
essential_rationale: 'The First Intellect''s negation-and-affirmation and the doctrine of naming as a forgiven, compelled sin complete the cosmological foundation of the volume; the later account of the ranks and of origination presupposes that the whole created order names Him only in helpless inadequacy.

  '
key_tensions:
  - 'The Qur''an''s own testimony of Oneness — "Allah testifies that there is no god but He" — is read as the act of the First Intellect, so that the "Allah" who testifies is the first creature pointing beyond itself. The hosts should let this re-reading land without flattening the verse into a mere proof-text.

    '
  - 'A flawless First Intellect that transgressed nothing is nonetheless said to need forgiveness for its highest act. The hosts should hold this open: the "sin" is not moral fault but the unavoidable shortfall of any created speech about the Originator.

    '
  - 'Omnipotence is challenged to do injustice; the reply is that a capacity is not a compulsion, and that not doing wrong is the perfection of power, not a limit on it. The hosts should keep the eat-the-filth counter vivid and not let it slide into abstraction.

    '
  - 'Naming the Unnameable is at once the noblest act in creation and a sin — excused only because it is compelled, exactly as helplessness excused the woman judged before Umar. The hosts should keep both the dignity and the fault of naming in view at once.

    '
tone_constraints:
  - Walk the teaching in its own order — the primal negation and affirmation, then naming from inadequacy, then the gift not withdrawn and the injustice challenge, then the sin coupled with forgiveness, then the ten ascending ranks, then the hidden pairs of prayer. Do not rearrange.
  - Render the verse "Allah testifies that there is no god but He" (chapter 3, verse 18) as faithful English; give the Qur'anic word that "they have not appraised Allah with His true appraisal" without inventing a reference; do not pair an Arabic transliteration run with its translation.
  - Preserve the transliterated names of the ten ranks (Hujjiyyah, Hijabiyyah, Khayaliyyah, Fathiyyah, Jiddiyyah, Anza'iyyah, Qa'imiyyah, Jussiyyah, Ahadiyyah, Samadiyyah, Ilahiyyah, Huwiyyah); plain transliteration without diacritics for other terms (idtirar, istighfar, Mabda wa Maad).
  - Never pair the leadership-title of the Father of Imams with his personal name; the case before Umar names him as "the Father of Imams."
  - End on the hidden pairs and the completion of the opening movement, handing off to the redefinition of Tawhid that the next episode opens. Do not summarize "what we learned."
anchor_passages:
  - 'The opening hook: ''If you cannot know a thing at all, by what right do you give it a name — and what does the naming cost you?'''
  - 'The primal act: the First Intellect negated divinity from itself and its genus and affirmed it for Allah alone, so that the ''Allah'' who testifies in ''Allah testifies that there is no god but He'' is the First Intellect.'
  - 'Knowledge of life, not of the essence: the intellects were given the knowledge of life and its faculties — life, knowledge, power, choice — but never the knowledge by which to know Allah.'
  - 'The injustice challenge: ''You have the power to eat — so eat this filth set before you'' — a capacity is not a compulsion, and not doing wrong is the perfection of justice.'
  - 'The forgiven sin: to remember Him by what is unworthy of Him, under compulsion, ''is a sin coupled with the seeking of forgiveness'' — needed even by the First Intellect.'
  - 'The summit of the ladder: ten ranks ascending from the Imamate of spirituality to Huwiyyah, the rank of the bare ''He'' in which all naming gives out.'
