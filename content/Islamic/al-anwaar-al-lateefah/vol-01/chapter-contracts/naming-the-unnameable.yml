    - "Sayyidna Mu'ayyad (Hibatullah ibn Musa al-Shirazi), author of the Mabda' wa Ma'ad — the prayer naming inadequate remembrance a sin coupled with istighfar"
    - "Imam Ali's judgment freeing the woman compelled by thirst — the rule of idtirar (compulsion excuses)"
thesis_relevance: >
  This episode advances the book's central claim — that the soul attains the
  Oneness of Allah only through wilayah and 'amal, because the Originator's
  essence is unknowable and the approach to Him runs through His chosen ones —
  by showing that even the highest creature can only name Him under compulsion,
  a sin coupled with forgiveness, and by closing on the ladder of ranks and the
  three prayers that route every approach to Him through the Prophet and his
  household.

