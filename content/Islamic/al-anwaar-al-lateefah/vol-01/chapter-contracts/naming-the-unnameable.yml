show_notes:
  blurb: >
    This lesson resolves the paradox left hanging by the doctrine of the
    unknowable God: if no word reaches Him, what are we doing when we name
    Him? It begins with the First Intellect's first act — denying divinity to
    itself and affirming it for Allah alone — and reads the verse "Allah
    testifies that there is no god but He" as the First Intellect's own
    confession on behalf of all creation. We name the Unnameable, the book
    explains, not out of presumption but out of compulsion: our essence is too
    narrow to comprehend Him, so we reach for the last word we have. The
    intellects were given total knowledge of the structure of life, yet none
    of the divine essence. And because the naming is forced, it is a "sin"
    coupled with the seeking of forgiveness — excused exactly as Imam Ali
    excused the woman driven by thirst in the desert. The section closes with
    two codas: the ladder of spiritual ranks rising to the bare "He," and the
    hidden meanings of three prayers, which turn out to name the Prophet with
    Lady Fatima, Imam Ali, and Hasan with Husayn.
