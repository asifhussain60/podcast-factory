title: Naming the Unnameable
audience: 'Thoughtful adult listeners who have accepted the previous episode''s hard conclusion — that the Originator cannot be reached by any name — and now want to know how, in that case, naming Him is permitted at all. They are listening for the resolution of the paradox: how the First Intellect''s first act both witnesses the Oneness and falls short of it, why we name Him only out of compelled inadequacy, and why that naming counts as a sin that comes already joined to its own forgiveness.

  '
angle: faithful_exposition
episode_format: deep_dive
format_rationale: 'The chapter unfolds one doctrine in sequence — the First Intellect''s primal negation and affirmation, the inadequacy that compels naming, the permanence of the gift of existence, the sin-coupled-with-forgiveness, and the ladder of ranks. The Arya Samaji challenge and the case judged before Umar are illustrations the teaching adjudicates, not sustained opposing voices in dialogue, so this is exposition, not debate.

  '
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: 'The curious_mind voices the paradox the listener feels (if He cannot be known, how can naming Him be anything but presumption — and how can a flawless First Intellect "sin") and presses the injustice challenge; the scholar_companion supplies the primal act, the knowledge of life given in place of knowledge of the essence, the perfection of a power that never does wrong, and the doctrine of the sin paired with forgiveness under compulsion.

  '
