    - Sayyidna Hamiduddin in the seventh path of the fourth form of Rahat al-'Aql, on the absence of obstacle in the abode of origination; Surah al-Nisa (chapter 4, verse 82)
thesis_relevance: 'This episode advances the book''s central claim — that the soul attains the Oneness of Allah only through wilayah and ''amal — by laying its cosmological ground: all beings were originated equal from nothing, as pure favor, in a single instant, so that the differences that matter for salvation arise not from creation but from the journey each makes from that equal beginning.

  '
