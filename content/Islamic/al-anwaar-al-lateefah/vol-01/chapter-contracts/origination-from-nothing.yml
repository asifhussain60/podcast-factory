show_notes:
  blurb: 'The volume turns from the gnosis of the ranks to the act that produced them. Origination is not ordinary making: ordinary making reshapes pre-existing matter, but origination brings forth from nothing — not from a prior thing, not with an accompanying thing, not upon any underlying place. The Originator did this not from need or for sport, but from sheer favor and generosity, the only "purpose" being the giving itself. What He brought forth were luminous imaginal forms, of which the human body is the far-fallen copy, not the model. He made those forms perfectly equal in the first perfection — existence, life, strength, and ability — as an act of justice, attested by the verse that only a creation from Allah could be free of discrepancy. And because the abode of origination holds no obstructing matter, the whole order came to be not in time but in a single instant, like air flooded with sunlight; the potential and the actual existed together, with no interval of time between the first perfection and the second.

    '
