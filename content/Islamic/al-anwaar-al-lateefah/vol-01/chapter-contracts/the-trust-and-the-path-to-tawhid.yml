    - The grammarians' nafi al-jins (negation of the genus) applied to the book's pledge of pure reality with no ta'weel and no ramz
thesis_relevance: 'This episode advances the book''s central claim — that the soul attains the Oneness of Allah only through wilayah (loving allegiance to the Friends of Allah and adherence to the Imams'' appointed hudud) and ''amal (action by the law), because the Originator''s essence is unknowable and the return to our origin runs entirely through the Imams — by stating that two-pillar doctrine outright and framing it with the guarded provenance and architecture that the rest of the volume presupposes.

  '
