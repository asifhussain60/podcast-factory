show_notes:
  blurb: 'The opening lesson of Al-Anwaar al-Lateefah begins not with cosmology but with a covenant. The master explains that these are the sciences of realities, transmitted from the prophets and saints, recorded by the permission of the one to whom the knowledge is ascribed and deposited in the treasury of the sacred mission. Because they are a trust, they must never be scattered on the internet, and the Friends of Allah have warned of the punishment of cold iron for those who let them reach the undeserving. The master then lays out the book''s fivefold architecture — five Suradiqs, each of five chapters, each of five sections — and its pledge to deal in pure reality with no interpretation and no symbol. Finally he states the doctrine the whole volume serves: the soul reaches the Oneness of Allah through two pillars only, loving allegiance to the Friends of Allah and action by the law, and by these it returns home to the world of spirits, escaping the circle in which every other creature turns without arriving.

    '
