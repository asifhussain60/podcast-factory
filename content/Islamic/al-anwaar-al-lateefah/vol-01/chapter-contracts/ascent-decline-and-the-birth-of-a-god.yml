thesis_relevance: 'This chapter advances the book''s central claim — that the Oneness of Allah is reached through the gnosis of the ranks joined to allegiance and action — by making vivid what is at stake (ascent toward the source versus decline below the beasts, decided by the inner prayer) and by introducing the bewilderment in which a higher rank becomes a "god," the experience the next episode converts into the climb of true Tawhid.

  '
