  references:
    - Qur'an, chapter 35 (Fatir), verse 28 — only those of knowledge among His servants fear Allah
    - Sayyidna Muhammad Taher — the seven letters of the opening formula as the week of the seven Imams, each with twelve deputies
    - Sayyidna Sadiq — that 'oneness' and sanctity are called a 'circle' as terms of special honor
    - Amir al-Din al-Sadiq — 'Do you not know in whose court you are standing?', cited for fear as the acknowledgment of greatness
thesis_relevance: 'This chapter advances the book''s central claim — that the Oneness of Allah is reached through the gnosis of the ranks joined to loving allegiance and lawful action — by raising the First Intellect to the station of veil, gate, and Greatest Name, the sole means through which Allah may be sought, addressed, and declared One; this is the cosmological root of the wilayah the volume makes the only road to Tawhid, and it closes the first canopy.

  '
