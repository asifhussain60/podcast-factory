essential: core
essential_rationale: 'The veil-and-gate station of the First Intellect is the cosmological root of wilayah — the reason allegiance to the wali is the only door to Tawhid — and the chapter is the structural keystone that closes the volume.

  '
key_tensions:
  - 'A single sentence — the testimony of Oneness — contains everything that was and will be, and ends by design at seven. The hosts should keep the numbered composition (two, three, five, four, seven, twelve, nineteen) from piling up as a list and let it read as the skeleton showing through scripture and creation.

    '
  - 'The complete knowledge was already given with the first perfection, yet unrecognized until the Word, and the Word came only after self-negation. The hosts should keep the sequence: confession of not-being-the-creator precedes the gift.

    '
  - 'Knowledge deepens reverence, so it is the learned who most fear Allah — a fear that is the acknowledgment of greatness, not dread. The hosts should overturn the assumption that knowledge makes a person bolder before God.

    '
  - 'Allah is reached only through the First Intellect — the sole means of seeking, discourse, and declaring Oneness — so allegiance to the wali is not an add-on to Tawhid but its only door. The hosts should connect this back to the volume''s opening pillars of allegiance and action.

    '
  - 'The second emanation''s ruin looks like faith: he confessed the First Intellect''s superiority and was undone only by imagining his own vision its equal. The hosts should treat this as the subtlest and most cautionary failure in the volume.

    '
tone_constraints:
  - Walk the teaching in order — the Word of Allah, the encompassing of all knowledge after self-negation, the numbered composition and the opening formula, the fear of the learned, the veil-gate-Greatest-Name station, then the delusion of equality and the circle of oneness. Do not rearrange.
  - The Qur'anic quotation carries its reference inline in plain English — (chapter 35, verse 28). Quote without a reference where the source fixes none; never invent one.
  - The testimony of Oneness and the opening formula of the Qur'an are discussed for their letters and structure; refer to them in plain transliteration without diacritics, and never as a translit-plus- translation pair. Render all Arabic citations as their English meaning only.
  - Keep the named authorities (Sayyidna Muhammad Taher, Sayyidna Sadiq, Amir al-Din al-Sadiq) as the teaching gives them. Never pair the leadership- title of the Father of Imams with his personal name.
  - Close the first canopy and land the whole arc (from what Tawhid is, up the ladder, and back down through origination to the first Word). Do not summarize "what we learned" as a bare list.
anchor_passages:
  - 'The Word''s station: ''The flowing knowledge and spreading light is the Word of Allah — the testimony there is no god but Allah — and it is said that the Word is above the intellect and below the Originator, and it is also named the command.'''
  - 'Self-negation first: ''Before he could obtain the Word, he had first to negate himself — to affirm that he was not his own creator. Self-negation precedes the gift.'''
  - 'The fear of the learned: ''Indeed, only those of knowledge among His servants fear Allah.'' (chapter 35, verse 28) — and this fear is not dread but the acknowledgment of His greatness.'
  - 'In whose court: ''Amir al-Din al-Sadiq, when the color of someone''s face would change in his presence, would say: Do you not know in whose court you are standing?'''
  - 'Veil and gate: ''Allah took him as a veil for Himself and made him a gate, through whom alone one may seek means, from whose presence alone one may hold intimate discourse, and through whose means alone He is declared One — so he became His Greatest Name.'''
  - 'The delusion of equality: ''The second emanation acknowledged the First Intellect''s superiority, yet imagined his own vision its equal — and by that delusion forfeited the second perfection. In the first perfection all are equal; in the second, none can be.'''
