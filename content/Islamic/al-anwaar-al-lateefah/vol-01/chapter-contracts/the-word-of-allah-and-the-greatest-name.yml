title: The Word and the Greatest Name
audience: 'Thoughtful adult readers who have followed the first form''s seeking of means and want to see what descended in answer and how the volume closes. They are listening for the Word of Allah — the testimony of Oneness, above the intellect and below the Originator — by which the First Intellect comes to encompass all knowledge after first negating himself; for the numbered composition of the Word and of the opening formula of the Qur''an; for why knowledge deepens reverence; for the First Intellect raised to veil, gate, and Greatest Name; and for the cautionary case of the second emanation and the circle of oneness that closes the first canopy.

  '
angle: faithful_exposition
episode_format: deep_dive
format_rationale: 'The chapter gathers the cosmology to its close in continuous exposition, citing Muhammad Taher and Sadiq as authorities. The second emanation is a contrasting case set against the First Intellect, not a named voice in dialogue; there is no contested proposition, so this is exposition.

  '
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: 'The curious_mind asks how a single sentence could contain all that was and will be, and why knowledge would make a being humbler rather than prouder; the scholar_companion supplies the Word as the flowing light, the numbered composition, the fear of the learned, the veil-gate-Greatest-Name station, and the delusion of equality that undid the second emanation.

  '
debate: null
