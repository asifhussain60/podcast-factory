essential: core
essential_rationale: 'This episode narrates the first act of Tawhid in existence and the descent of the Word, the kalimah that links the Originator to the originated; it is the hinge on which the volume''s account of the First Intellect turns.

  '
key_tensions:
  - '"Error" in the first perfection is not the breaking of a law but the failure to complete a journey — falling short of the second perfection, by one''s own delay or by leading others astray. The hosts should keep this unusual sense precise and let the grammar of slipping/making-slip carry it.

    '
  - 'One form reached an unreachable God by taking His own greatness as the means — the obstacle becoming the road. The hosts should let the paradox of tawassul land: one cannot scale the height, but one can lean upon it.

    '
  - 'The Word "there is no god but Allah" stands above the intellect and below the Originator, the channel down which all light and command flow. The hosts should let its middle station be felt — not the Originator, not the intellect, but the link that touches both.

    '
  - 'Self-negation precedes the gift: the First Intellect had first to confess he was not his own creator before the Word and its all-encompassing light were bestowed. The hosts should make the order vivid — empty the false claim, then receive the true affirmation, as "no god" precedes "but Allah."

    '
  - 'The same act that looks like the bleakest confession — I am nothing, I made nothing — is from the inside the doorway into a joy no language can hold. The hosts should let that reversal close the episode without sentimentality.

    '
tone_constraints:
  - 'Walk the doctrine in the source''s order: error in the first perfection, the form that performed Tawhid, tawassul through His greatness, the descent of the Word, and the First Intellect''s all-encompassing knowledge after self-negation. Preserve that arc; do not rearrange.

    '
  - Render the Word and all Arabic formulae as accurate English only ("there is no god but Allah") — never as a transliterated Arabic run paired with its translation.
  - Short technical terms (Tawhid, tanzih, tajrid, tawassul, kamal al-thani, kalimah rendered as "the Word") stay plain transliteration without diacritics.
  - 'Keep the gravity warm: the descent of the Word and the joy beyond all writing are the emotional summit of the volume so far; honor the wonder, then return to the precise claim that knowledge needs the key to its own use.

    '
  - Honorifics spelled out; Sayyidna Mohyuddin keeps his name and the formula of sanctification; do not pair any leadership title with a personal name.
  - End on the open question the next episode answers — why would a being given the knowledge of everything respond with trembling, and what is hidden in the numbered letters of the Word? Hand off; do not summarize.
anchor_passages:
  - In the first perfection the beings are equal, yet not infallible from error — and the error is the failure to attain the second perfection, whether by slipping oneself or by making another slip.
  - One of the luminous forms looked, with his essence, at his essence and at his kind, and knew they had an Originator unlike them; so he negated divinity from them all and affirmed it for the Originator, becoming the first Possessor of Tawhid.
  - He sought means through the Originator's own greatness toward Him — taking the greatness that makes Him unreachable as the very road of approach.
  - There connected with him the flowing knowledge and the spreading light, which is the Word of Allah — 'there is no god but Allah' — above the intellect and below the Originator, also named the command.
  - Before he could obtain the Word, he had first to negate himself and confess he was not his own creator; self-negation precedes the gift.
  - He found within his essence such joy and delight and greatness that no pen could write it and no tongue could translate it.
