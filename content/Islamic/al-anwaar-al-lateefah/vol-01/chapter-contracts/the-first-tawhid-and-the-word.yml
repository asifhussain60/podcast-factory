title: The First Tawhid and the Word
audience: 'Listeners who have watched a world flash into being equal and faultless, and now want the pivotal moment of the cosmology: the instant one form looked at itself, recognized its Maker, and became the first to declare the divine unity. They want to understand what "error" means for faultless beings, how the first form reached an unreachable God through His own greatness, and how the Word "there is no god but Allah" descended and filled the First Intellect with all knowledge — but only after it negated itself.

  '
angle: faithful_exposition
episode_format: deep_dive
format_rationale: 'The episode unfolds one connected doctrine — the meaning of error in the first perfection, the first form''s act of Tawhid, tawassul through the Originator''s greatness, the descent of the Word, and the First Intellect''s all-encompassing knowledge after self-negation. Mohyuddin is cited as the authority summarized; there is no named opponent and no contested proposition. This is treatise exposition, not debate.

  '
host_dynamic: curious_mind + scholar_companion
host_dynamic_rationale: 'The curious_mind presses the puzzles (how can a faultless being err? how do you reach a God you cannot reach? why must one negate oneself to receive?); the scholar_companion supplies the doctrine — error as failure to attain the second perfection, the first form''s looking and recognition, tawassul through the divine greatness, the Word above the intellect and below the Originator, and self-negation as the condition of the gift.

  '
