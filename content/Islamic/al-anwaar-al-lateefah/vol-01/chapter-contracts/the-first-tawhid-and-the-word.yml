thesis_relevance: 'This episode advances the book''s central claim — that the soul attains the Oneness of Allah only through wilayah and ''amal — by showing the first declaration of that Oneness ever made: a creature reaches the unreachable Originator only through His greatness as a means and only after negating itself, establishing the pattern of mediated, self-effacing approach the whole path of wilayah requires.

  '
