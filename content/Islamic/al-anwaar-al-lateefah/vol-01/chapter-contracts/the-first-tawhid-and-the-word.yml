show_notes:
  blurb: 'Having watched a world flash into being equal and faultless, the volume names its strangest term and shows the act it made possible. "Error," in the first perfection, is not the breaking of a law but the failure to complete a journey — falling short of the second perfection, whether by one''s own delay or by leading others astray. Against that possibility stands the first triumph: one luminous form looked at itself and its equals, recognized an Originator unlike them all, and in one act negated divinity from everything originated and affirmed it for the Originator alone, becoming the first Possessor of Tawhid. Unable to reach his Maker directly, he reached Him through His own greatness, and in answer there descended the divine supports and the flowing light that is the Word, "there is no god but Allah" — the link that stands below the Originator and above the intellect, also called the command. Through that Word the First Intellect came to encompass all that was and will be — but only after first negating himself, which is the condition on which the whole gift, and a joy beyond all telling, was poured into him.

    '
