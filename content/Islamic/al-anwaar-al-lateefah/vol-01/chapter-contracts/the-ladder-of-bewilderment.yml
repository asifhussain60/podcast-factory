    - 'Surah al-Fatiha (chapter 1, verses 6 to 7) read as the three classes: the favored repentant, those who incur wrath, and the astray'
thesis_relevance: 'This episode advances the book''s central claim — that the soul attains the Oneness of Allah only through wilayah and ''amal — by enacting that attainment: true Tawhid is performed only by climbing the ranks in bewilderment until divinity is negated from all of them and affirmed for Allah alone, so the Oneness is reached through the hierarchy, never around it.

  '
