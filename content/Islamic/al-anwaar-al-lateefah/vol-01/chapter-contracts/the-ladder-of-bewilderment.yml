show_notes:
  blurb: 'The volume turns Tawhid from a formula into a climb. When a seeker stands bewildered before his teacher, the teacher becomes for him a "god" — not as a maker of beings, but only as the center around which his bewildered circle turns. The climb begins the moment the seeker sees that his teacher is himself bewildered before the rank above him, and that one before the next, rank upon rank, up to the First Intellect, which is bewildered before the Originator. Tracing that ladder, the seeker negates divinity from every rank and affirms it for Allah alone. The linked circles of the hierarchy were born in the spiritual world from a single repeating pattern of forerunner, follower, and summons — the very pattern the three letters of the word for "god" encode. A created god always carries the name of a nourisher above him and a need that calls him upward; the one true God has neither. The soul that completes the climb is the tranquil soul, called home well-pleased and well-pleasing — and the whole teaching, the book shows, is written into the opening chapter of the Qur''an and its three classes of men.

    '
