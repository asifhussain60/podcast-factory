thesis_relevance: 'This episode advances the book''s central claim — that the soul attains the Oneness of Allah only through wilayah and ''amal — by naming its cosmological root: the First Intellect is the veil and gate through whom alone the means is sought and the oneness declared, so wilayah is not an institution added later but the very structure of how the One is approached at all.

  '
