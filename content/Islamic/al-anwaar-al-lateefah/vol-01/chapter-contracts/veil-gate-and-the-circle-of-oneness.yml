show_notes:
  blurb: 'The volume closes by reading the hidden architecture of the Word and following the First Intellect to its summit. The Word "there is no god but Allah" is numbered — negation and affirmation, three letters, five jewels, four words, seven stops, twelve ascending spirits, nineteen in all — and the same nineteen run through the opening formula of the Qur''an, which encodes the seven Imams and their twelve deputies. Having received that Word and the knowledge of all things, the First Intellect grew not proud but more reverent, confirming that fear of Allah belongs properly to the learned, as the recognition of His majesty rather than dread. He was raised to the supreme station — veil, gate, and Greatest Name — the one appointed access through whom alone the means is sought, the discourse held, and the oneness declared. Against him stands the second emanation, who acknowledged his superiority yet imagined himself his equal, and so forfeited the second perfection. And above all stands the circle of oneness, belonging to the Originator alone, which no creature has entered and which the First Intellect, possessor of the veil, alone guards.

    '
