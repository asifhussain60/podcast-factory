length_target: longer
essential: core
essential_rationale: 'This episode delivers the First Intellect''s supreme station as veil, gate, and Greatest Name — the cosmological root of wilayah — and the circle of oneness that closes the second gate; it is the structural keystone of the volume.

  '
key_tensions:
  - 'The Word and the Bismillah are numbered — two, three, five, four, seven, twelve, nineteen — and the same pattern runs through the Imams and the originated world. The hosts should present the arithmetic as one skeleton showing through scripture and creation alike, not as numerology for its own sake.

    '
  - 'The more the First Intellect knew, the more he trembled — fear here being the acknowledgment of greatness, not dread. The hosts should correct the natural misreading: the knower fears most because he sees most.

    '
  - 'The First Intellect alone is the veil and gate through whom the means is sought, the discourse held, and the oneness declared. The hosts should let this land as the cosmological root of wilayah — the road home has never had another door.

    '
  - 'The second emanation acknowledged the First Intellect''s superiority yet imagined himself his equal, and so forfeited the second perfection. The hosts should let this subtler failure register as more dangerous than denial, because it looks like faith.

    '
  - 'The circle of oneness belongs to the Originator alone and is named a "circle" only as a mark of supreme honor — the still point all the ranks revolve around without entering. The hosts should close on its uncrossable dignity.

    '
tone_constraints:
  - 'Walk the doctrine in the source''s order: the numbered Word and Bismillah, the fear of the learned, the veil and gate and Greatest Name, the second emanation''s delusion, and the circle of oneness. Preserve that arc; do not rearrange.

    '
  - Render the Qur'anic verse as accurate English with the reference in plain words — (chapter 35, verse 28) — never as a transliterated Arabic run paired with its translation; the Word and Bismillah are rendered in English.
  - Short technical terms (kalimah as "the Word," hijab as "veil," bab as "gate") stay plain transliteration only where the source uses them; prefer the English where one is established.
  - 'Keep the reverence without solemnity-for-its-own-sake: the trembling of the First Intellect is the truest measure of its knowledge; let that paradox govern the tone of the close.

    '
  - Honorifics spelled out; Sayyidna Muhammad Taher, Sayyidna Sadiq, and Amir al-Din al-Sadiq keep their names and forms; do not pair any leadership title with a personal name.
  - End by closing the whole volume — from Tawhid as the gnosis of the ranks to the veil and gate of the One — rather than handing off to a next episode; this is the final episode of the source chapter.
anchor_passages:
  - The Word is numbered — negation and affirmation, three letters, five jewels, four words, seven stops, twelve ascending spirits — and seven plus twelve make nineteen, the nineteen of the Bismillah.
  - Indeed, only those of knowledge among His servants fear Allah (chapter 35, verse 28) — for fear is the acknowledgment of His greatness, and the knower fears most because he sees most.
  - Allah took him as a veil and made him a gate, through whom alone the means is sought, the discourse held, and the oneness declared; so he became the Greatest Name.
  - The second emanation acknowledged the First Intellect's superiority yet imagined himself his equal — and in that contradiction forfeited the second perfection.
  - The circle of the first Originator is the circle of oneness, which no one has reached and no one can reach, and which the First Intellect, possessor of the veil, alone guards.
  - '''Oneness'' is called a circle only as a term of supreme honor — the still point that gives all the circling ranks their motion.'
