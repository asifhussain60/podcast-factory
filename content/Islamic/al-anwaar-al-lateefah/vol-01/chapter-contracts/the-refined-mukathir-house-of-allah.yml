show_notes:
  blurb: >
    What if the holiest man you ever met looked, to the eye, exactly like
    everyone else — and the whole difference lay in something no inspection
    could detect? The Mukathir and the ordinary man are made of the same
    flesh and blood, gathered within the same bodily bounds, and yet they are
    not the same: the Mukathir's temperament has been refined and his essence
    purified through an ascent that reaches even into his outward composition,
    though no eye can see it. Standing at the summit of the human — which is
    the threshold of the spiritual world — and holding the command of Allah
    and the Prophet before him in every thought, word, and deed, he becomes a
    house from the houses of Allah, a place on which revelation descends; the
    Qur'an's houses, and the men whom no commerce diverts, are these very
    ranks. Their "establishing of prayer" is, in its depth, the establishing
    of the divine summons — and beneath every pillar of the religion there
    lies just such an inner meaning, the whole law one continuous training of
    the soul in knowledge and allegiance.
  related_episodes: []
  references:
    - "Qur'an, chapter 24 (al-Nur), verses 36-37 — the houses Allah permits to be exalted and the men whom commerce does not divert"
    - "Qur'an, chapter 62 (al-Jumu'ah), verses 9-10 — the call to leave off trade for the prayer, and to disperse and seek bounty after"
    - "The inner meanings (ta'weel) of the pillars: allegiance, purity, prayer, alms, fasting, the fifth, pilgrimage, and struggle"
    - "Hazrat Imam Husayn's monthly setting-aside of the fifth of his salary, cited for the inner meaning of khums"
thesis_relevance: >
  This chapter advances the book's central claim — that the Oneness of Allah
  is reached through the gnosis of the ranks joined to loving allegiance and
  lawful action — by showing what the first rank actually is (a refined human
  made a house of Allah) and by reading the whole outward law as one inner
  training of the soul in knowledge and allegiance to the appointed guide,
  which is the wilayah the volume makes the road to Tawhid.

