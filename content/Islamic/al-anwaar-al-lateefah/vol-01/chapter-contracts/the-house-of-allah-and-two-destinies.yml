thesis_relevance: 'This episode advances the book''s central claim — that the soul attains the Oneness of Allah only through wilayah and ''amal — by showing ''amal at work: the establishing of the inner prayer and the keeping of the command refine a man into a house of Allah and lift him toward the origin, while its abandonment casts an identically-made man below the beasts.

  '
