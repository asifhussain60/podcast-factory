show_notes:
  blurb: 'The Mukathir, made by breaking the self, is now shown transformed: though he is of the same flesh and blood as any man, his temperament has been refined and his essence purified by his ascent, until even his outward substance is changed and he becomes a house of Allah, a place where revelation alights — because he held the command present in his every thought, word, and deed. The same inner principle runs through the whole law: every pillar carries a hidden meaning, and outward worship is, inwardly, the establishing of the da''wah. Set against the Mukathir, the man who establishes neither inward nor outward prayer shares his platform and his flesh but takes the opposite road, declining below the cattle to the isthmus of fear. The lawful and forbidden animals prove the same logic out of one created stuff — and among men the gap between the obedient and the disobedient is wider still. Inwardly, too, the Mukathir''s very soul is transmuted, so that where the purity is real, the rank is real, though it may be hidden from all but Allah.

    '
