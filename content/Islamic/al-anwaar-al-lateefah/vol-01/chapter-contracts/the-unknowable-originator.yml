show_notes:
  blurb: >
    Having promised that the soul returns to its Originator, the book now asks
    what that Originator is in Himself — and gives its most uncompromising
    answer. He is so exalted that no indication can point to Him and no thought
    can cross toward Him; Imam Ali, asked whether he had seen God, answered
    that he saw Him not with the eye but with insight. From this transcendence
    follows the chapter's most radical claim: the names and attributes we use
    do not fall upon Allah at all, because a name lands only on its like, and
    our names are created things made by our own tongues. They fall instead
    upon the First Intellect, the first of His creations — and even there they
    do not fully fit. From the summit of the intellectual world down to the
    world of sense, every creature is equal in total inability to know His
    essence. And our very name for Him, "Allah," turns out to be not a
    definition but a cry — the sound of a bewildered circle turning forever
    around a center it cannot reach.
