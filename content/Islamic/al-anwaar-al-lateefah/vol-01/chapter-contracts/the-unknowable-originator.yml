    - "Imam Ali's exchange with Ibn al-Kawwa' on seeing God with insight (basirah) rather than the eye"
    - "Sayyidna Mu'ayyad al-Din al-Shirazi (rank of Bab al-Abwab, time of Mawlana Mustansir Billah) on the originated letters as an unfit indicator of the Originator"
thesis_relevance: >
  This episode advances the book's central claim — that the soul attains the
  Oneness of Allah only through wilayah and 'amal, because the Originator's
  essence is unknowable and the approach to Him runs through His chosen ones —
  by establishing the unknowability itself: no name or attribute falls upon
  Him, they fall upon the First Intellect, and every creature is equal in
  incapacity, which is precisely why the path home cannot be bare seeking.

