# series-config.yaml — the pipeline settings for this book.
#
# Created by the Intake form when settings were saved for a book that had
# none. A book scaffolded by hand never gets one (only intake_launch.py's
# _write_series_config does), and half the form's fields live in this file —
# so without it those saves were silently dropped.
source_language: en
video_style: none
audience_profile: traditional
conversation_style: deep_dive
length_tier: extended
episode_planning_mode: problem_solution

# This is a recorded sermon, not a text being adapted into a podcast. Phase 0d's
# own topic/session boundaries stay (that is real chapter-design work); the
# per-source-chapter AUTHORING call that normally follows it is skipped —
# chapters/*.txt is proofread and Arabic-restored, never rewritten. Set
# 2026-08-30 after the first chapter came back as paraphrased third-person
# narration of a sermon that opens "Hello, welcome to my lecture."
episode_voice: verbatim
