  scaffolded_method: >-
    Manual scaffold ahead of source delivery, at Asif's request. Folder
    skeleton + branch created under content/Islamic/ initially, then
    relocated to content/Sessions/ the same day at Asif's explicit direction
    ("these should be treated as sessions not books") — bucket only, via the
    explicit bucket= override that resolve_bucket/branch_name already
    support. content_profile stays unset here deliberately, defaulting to
    islamic_scholarly, the SAME profile kunooz-al-hikmah (also audio-sourced)
    already uses — so this book keeps the full standard pipeline, including
    phase 0d's own content-aware chapter/episode design, rather than the
    unrelated islamic_session profile, which bypasses that machinery
    entirely and is scoped to the KSESSIONS_DEV corpus-import lane instead.
    narrative_frame is still deliberately NOT set — per the
    narrative-frame-is-a-source-property rule, that gets decided by reading
    the actual transcript once it lands, not guessed at scaffold time.
