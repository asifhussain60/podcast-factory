show_notes:
  blurb: "Loving Rasul Allah (SWS) is the cornerstone of faith, as true love for Allah is demonstrated by following His beloved Prophet. This love is a seed nurtured by knowledge, which grows into a passionate devotion that transforms one's character. By recognizing the universe as signs pointing to the Creator, we find ultimate felicity not in worldly pursuits but in willing submission to Allah, a submission born from this profound love."
