show_notes:
  blurb: "This sermon redefines success and failure through an Islamic lens, contrasting worldly metrics with spiritual purification. It outlines ten key qualities for achieving true success, supported by Quranic principles and the lives of exemplary figures from Islamic history. The sermon also warns against the spiritual danger of heedlessness, urging a conscious return to a life of purpose. It concludes by embracing the 'strangeness' of adhering to faith in a secular world,"
