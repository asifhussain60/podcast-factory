anchor_passages:
  - quote: "Claude Code reads your project files as needed. You don't have to manually add context."
    source: "code.claude.com/docs/en/quickstart (Anthropic official documentation)"
    why: "Single-sentence statement that reframes the day-one session for a Copilot-fluent developer — the contrast with Copilot's open-tabs-only context model is the architectural fact the first-session walkthrough rests on."
  - quote: "If ANTHROPIC_API_KEY is set in your environment — common for developers who use the API directly — it takes precedence over your subscription and causes per-token API charges. Run unset ANTHROPIC_API_KEY to use subscription credentials instead."
    source: "code.claude.com/docs/en/authentication (Anthropic official documentation paraphrased)"
    why: "The most expensive new-user mistake in the entire chapter — a developer can run their first month on what they think is their subscription and get an API invoice for hundreds of dollars; the verbatim guidance to unset the variable is the action that prevents the billing surprise."
  - quote: "Claude automatically snapshots files before each change so a checkpoint can restore them. Checkpoints persist across sessions, so you can close your terminal and still rewind later."
    source: "code.claude.com/docs/en/best-practices (Anthropic official documentation)"
    why: "The recovery safety net for a Copilot-fluent developer feeling cautious about handing agentic tools real edit access — names the persistence guarantee in plain language and makes the rewind affordance trustworthy."
  - quote: "Run /init to generate a starting CLAUDE.md automatically. Claude analyzes your codebase and creates a file with build commands, test instructions, and project conventions it discovers."
    source: "code.claude.com/docs/en/memory (Anthropic official documentation)"
    why: "The single most useful day-one move for a developer who has just installed Claude Code — converts the abstract 'CLAUDE.md is your persistent project memory' framing of episode two into a one-command action that produces a structured starting point to refine."
