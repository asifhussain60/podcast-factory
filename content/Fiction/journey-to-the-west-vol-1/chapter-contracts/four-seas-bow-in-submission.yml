  references:
    - >
      "Wu Cheng'en, *Journey to the West* (Xī Yóu Jì 西遊記), Chapter
      3 — the raid on Aolai, the four-sea audience with Aoguang,
      the As-You-Will Gold-Banded Cudgel (Ruyi Jingu Bang 如意金箍棒)
      and the four-sea armor, the seventy-two-caves muster, the
      sworn brotherhood of the seven kings, the dream-summons to
      the Region of Darkness and the striking-out of the Registers
      of Life and Death, the twin memorials to the Jade Emperor,
      and the Great White Planet's amnesty-and-recruitment doctrine"
    - >
      "The Four Dragon Kings of the Four Seas (Sì Hǎi Lóng Wáng
      四海龍王) — Aoguang of the East (Donghai), Aoqin of the South
      (Nanhai), Aorun of the West (Xihai), Aoshun of the North
      (Beihai); their Crystal Palaces (Shuijing Gong) and
      bureaucratic water-tribe courts of shrimp soldiers, crab
      generals, perch marshals, carp inspectors, eel commandants,
      and cuttlefish strongmen are a Ming-popular-religion staple
      the novel inherits from the *Investiture of the Gods*
      (Fengshen Yanyi) and from local rain-cult and river-cult
      traditions"
    - >
      "The Great Yu (Da Yu 大禹) and his flood-taming rod — the
      legendary sage-king who tamed the nine rivers of China; the
      rod that anchors the Heavenly River (Tian He) is the source's
      own etiology for the cudgel and grounds it in the
      water-engineering mythology of high antiquity"
    - >
      "The Ten Kings of the Underworld (Shi Dian Yan Wang 十殿閻王)
      — King Qinguang, King of First Rivers (Chujiang), King of the
      Song Emperor (Songdi), King of Revolting Officials (Wuguan),
      King Yama (Yanluo), King of Equality (Biancheng / Pingdeng),
      King of Mount Tai (Taishan), King of the Capital City
      (Dushi), King of Biancheng (Bianhcheng), King of the Turning
      Wheel (Zhuanlun); the ten-court underworld bureaucracy is a
      Tang-Song Buddhist-Daoist syncretism in which Indian Yama
      becomes one of ten Chinese magistrates, each presiding over
      one of the *Ten Halls of the King of Hell*"
    - >
      "The Bodhisattva Kshitigarbha (Dizang Pusa 地藏菩薩) — the
      *Earth-Treasury* bodhisattva who vowed not to attain
      buddhahood until all hells were emptied; in Chinese popular
      religion the Lord of the Region of Darkness with the Ten
      Kings as his magistrates and the Azure Cloud Palace as his
      seat"
    - >
      "The Great White Planet of Venus (Tai Bai Jin Xing 太白金星)
      and the *zhao an* 招安 (amnesty and recruitment) doctrine —
      the Han-through-Ming imperial-court practice of co-opting
      rebel forces by offering official rank rather than fighting
      them, the same policy through which the *Water Margin*'s
      Liangshan outlaws are eventually absorbed; the novel
      borrows it for Heaven's first move against Wukong"
    - >
      "The *dream of the Southern Branch* (Nanke meng 南柯夢) — the
      Tang-dynasty short story by Li Gongzuo in which the
      protagonist falls asleep beneath a southern branch and lives
      an entire imperial career in a single nap inside an
      ant-kingdom; the chapter's pivot from Wukong's drunken sleep
      to the Region of Darkness names itself with this allusion,
      so that the listener reads the underworld trip as
      simultaneously real and dream-thin"
