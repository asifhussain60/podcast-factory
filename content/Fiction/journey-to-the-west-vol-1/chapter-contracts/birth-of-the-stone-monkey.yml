  references:
    - >
      "Wu Cheng'en, *Journey to the West* (Xī Yóu Jì 西遊記), Chapter 1
      — the cosmological frame, the magic stone, the birth of the
      stone monkey, the leap into the Water-Curtain Cave, the
      coronation, the banquet-tears, the voyage in search of the Way,
      the woodcutter's song, and the naming by the Patriarch
      Subodhi as Sun Wukong"
    - >
      "The twelve-earthly-branch cosmological scheme (Zi through Hai)
      — a Song-dynasty cosmological tradition associated with Master
      Shao Kangjie (Shao Yong, 1011–1077), whose *Supreme Principles
      Governing the World* (Huangji Jingshi) lays out the great-cycle
      reckoning Wu Cheng'en compresses into the chapter's opening
      pages"
    - >
      "The Daoist-Buddhist four-continents geography (Eastern
      Continent of Spiritual Excellence — Pūrvavideha; Western
      Continent of Cattle-Offering — Aparagodānīya; Southern
      Continent of Jambu — Jambudvīpa; Northern Continent of Kuru —
      Uttarakuru) — the Buddhist cosmological scheme of the four
      continents around Mount Meru, naturalized into the
      Chinese-Buddhist syncretic geography the novel inhabits"
    - >
      "The *Yellow Court* scripture (Huángtíng Jīng 黃庭經) — a
      foundational Daoist meditation text the woodcutter's song
      names; the *Fragrance Fills the Courtyard* (Mǎn Tíng Fāng 滿庭芳)
      ci-poem form the song is set in"
    - >
      "The character philology of *sun* 猻 — the beast-radical
      (犭) removed leaves 孫 (sūn — grandson), composed of 子 (zǐ —
      child) and 系 (xì — small/thread); the Patriarch's move is a
      genuine Chinese radical-decomposition that turns a beast-name
      into a human surname while preserving the listener's sense
      that something philological and lineage-bearing has happened"
