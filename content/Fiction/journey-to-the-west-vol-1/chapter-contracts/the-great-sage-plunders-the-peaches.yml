  references:
    - >
      "Wu Cheng'en, *Journey to the West* (Xī Yóu Jì 西遊記), Chapter
      5 — Xu Jingyang's warning, the Peach Garden appointment with
      three thousand six hundred trees in three cohorts of twelve
      hundred, the seven-robed maidens and the body-fixing spell,
      the gulling of the Barefoot Great Immortal, the plundering
      of the Jade Pool with sleep-insects on the wine-officers,
      the wrong turn into the Tushita Palace and the five gourds
      of Nine-Cycle Golden Elixir, the cascading reports, the
      hundred-thousand-soldier muster under the Four Great
      Heavenly Kings and Pagoda-Bearing Heavenly King Li, the
      eighteen frames of the heaven-and-earth net, the Nine
      Luminaries' battle at the iron-plank bridge, the great melee
      from the hour of the Dragon to sundown, and the thousand-
      and-a-hundred-Great-Sages hair-double finish."
    - >
      "The Queen Mother of the West (Xī Wáng Mǔ 西王母) and the
      Festival of Immortal Peaches (Pán Táo Huì 蟠桃會) — the
      pre-Han Daoist goddess of the western paradise, queen of
      the Jade Pool, whose peach-of-immortality (xiantao) banquet
      is the canonical assembly of the upper realm and whose
      seven-robed maidens are the iconographic embodiment of the
      seven-color spectrum that runs through Daoist cosmology;
      the novel inherits the full Han-Tang machinery of the
      festival and uses it as the architecture Wukong plunders."
    - >
      "Lord Lao Tzu (Tài Shàng Lǎo Jūn 太上老君) and the Nine-Cycle
      Golden Elixir (jiǔ zhuǎn jīn dān 九轉金丹) — the deified
      Laozi as Supreme Patriarch of the Way (Daode Tianzun), one
      of the Three Pure Ones, dwelling in the Tushita Palace
      above the Thirty-Three Heavens; the Nine-Cycle elixir is
      the canonical Daoist external-alchemy product of nine
      cycles of cinnabar-refining, the same vocabulary out of
      which the inner-alchemy (neidan) tradition the novel will
      keep nodding to is reworked. Wukong's eating of the
      external-alchemy elixir while citing the inner-outer
      non-dual doctrine is the source's quiet philosophical
      joke."
    - >
      "The Tushita Palace (Dōushuàigōng 兜率宮) and the Ancient
      Buddha Dipankara (Rán Dēng Gǔ Fó 燃燈古佛) — the Tushita is
      the Buddhist heaven of Maitreya (Dushita), here mapped
      onto the Daoist 33-heavens cosmology as Lord Lao's palace;
      Dipankara is the past-Buddha who prophesied Shakyamuni's
      enlightenment and is brought into the chapter as Lord
      Lao's interlocutor, a characteristic Ming-novel Daoist-
      Buddhist syncretism the listener will see repeated."
    - >
      "The Twenty-Eight Constellations (Èr Shí Bā Xiù 二十八宿) — the
      Chinese lunar mansions in four palaces of seven mansions
      each (Azure Dragon of the East: Horn, Neck, Root, Room,
      Heart, Tail, Basket; Black Tortoise of the North: Dipper,
      Ox, Maid, Void, Roof, House, Wall; White Tiger of the West:
      Stride, Bond, Stomach, Mane, Net, Beak, Three-Stars [the
      source's verse lists them slightly differently]; Vermilion
      Bird of the South: Well, Ghost, Willow, Star, Spread, Wing,
      Axletree) — the novel uses the full roster as a heavenly
      battle-line, and the listener will hear it sustained across
      the havoc-in-Heaven cycle."
    - >
      "The Nine Luminaries (Jiǔ Yào 九曜) with Rahu (Luóhóu 羅睺)
      and Ketu (Jìdū 計都) — the Sun, the Moon, the five visible
      planets, and the two lunar nodes Rahu and Ketu inherited
      from Indian astronomy through Tang-dynasty Buddhist
      translation; their inclusion in the muster signals the
      novel's standard syncretic horizon, in which an Indian-
      Buddhist astronomical roster is part of the Chinese
      heavenly bureaucracy."
    - >
      "The heaven-and-earth net (tiānluó-dìwǎng 天羅地網) — the
      Daoist-Buddhist battlefield-magic of the cosmic enveloping
      net spread above and below to prevent escape by any
      direction; the eighteen-frames specification is the
      novel's escalation of the topos. The same net will be
      spread again at the climax of the havoc-in-Heaven cycle
      and the listener should hear its eighteen frames as a
      recurring marker."
    - >
      "The havoc-in-Heaven cycle (Dà Nào Tiān Gōng 大鬧天宮) —
      the canonical sequence of chapters 5–7 in which Wukong's
      plundering of the peach garden, jade pool, and cinnabar
      elixir produces the muster of the heavenly host, the
      Erlang-Shen capture, the eight-trigrams furnace, and the
      Five-Phases Mountain that closes Volume 1. This chapter is
      the cycle's first installment; the listener should leave
      with the architecture of the next three chapters fully
      visible on the horizon."
