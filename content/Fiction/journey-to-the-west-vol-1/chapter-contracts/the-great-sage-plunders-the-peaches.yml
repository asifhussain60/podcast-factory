episode_number: 5
title: "The Great Sage Plunders the Peaches and Steals the Elixir"
audience: >
  A general adult listener continuing with *Journey to the West* — Wu
  Cheng'en's sixteenth-century Ming-dynasty fantastical novel — having
  watched, in Episode 4, Sun Wukong installed in the Mansion of the
  Great Sage Equal to Heaven beside the Garden of Immortal Peaches,
  with two bureaus of immortal clerks (Peace and Quiet, Tranquil
  Spirit), two bottles of imperial wine, and ten golden flowers, on
  the Great White Planet's elegant "empty title" doctrine — an office
  without affairs and without salary, only a name to settle the
  wayward heart. No prior familiarity with the Queen Mother of the
  Jade Pool, the seven-robed immortal maidens, the Festival of
  Immortal Peaches, the Barefoot Great Immortal, Lord Lao Tzu's
  Tushita Palace and its Nine-Cycle Golden Elixir, the Pagoda-Bearing
  Heavenly King Li and Prince Nezha (re-met from Episode 4), the Nine
  Luminaries, the Twenty-Eight Constellations, or the heaven-and-earth
  net is required. This is the chapter in which the "empty title"
  doctrine collapses on the very arrangement it was supposed to
  prevent. The listener will follow ten movements: the brotherhood-
  swearing idleness with every star and constellation in heaven; Xu
  Jingyang's quiet warning that an unoccupied monkey-spirit will breed
  mischief; the appointment to the Peach Garden with its three
  thousand six hundred trees (twelve hundred each ripening in three,
  six, and nine thousand years); the secret peach-eating; the seven
  maidens sent by the Queen Mother for the Festival of Immortal
  Peaches, who find the cap and robes but not the warden because he
  has shrunk to a two-inch manikin in the leaves; the body-fixing
  spell that freezes them where they stand; the gulling of the
  Barefoot Great Immortal with a counterfeit summons to the Hall of
  Universal Brightness; the impersonation of the Barefoot Immortal
  and the plundering of the Jade Pool — sleep-insects on the
  wine-officers, the hundred-flavored delicacies, the jade-fluid
  and jasper-nectar; the drunken misturn into the Tushita Palace and
  the crunching-down of all five gourds of Lord Lao's refined golden
  elixir like roasted beans; the sobered flight through the Western
  Heaven Gate by invisibility down to the Mountain of Flowers and
  Fruit, and the wine-jars stolen back for the seventy-two cave-kings
  and Four Mighty Generals; the cascading reports — the maidens, the
  wine-officers, Lord Lao, the residence clerks, the Barefoot
  Immortal, the Inspecting Numinous Officer — that name Wukong as
  the thief; the Jade Emperor's muster of a hundred thousand heavenly
  soldiers under the Four Great Heavenly Kings, Heavenly King Li,
  and Prince Nezha, with the eighteen frames of heaven-and-earth
  net; the Nine Luminaries beaten back at the iron-plank bridge; the
  great melee from the hour of the Dragon to sundown in which the
  seventy-two cave-kings and the One-Horned Demon King are captured
  but Wukong's hair-double trick — a thousand and a hundred Great
  Sages each wielding a gold-banded cudgel — routes Prince Nezha and
  the five heavenly kings; and the three-sobs-three-laughs return to
  the cave, the resolve to fight again at daybreak, and the heaven-
  and-earth net ringing the mountain through the night. The listener
  leaves with three things in hand: the canonical havoc-in-Heaven
  triad — peach garden, jade pool, cinnabar elixir — set in the
  source's exact order; the collapse-by-elegance of the "empty title"
  policy that was Episode 4's settlement; and the muster of a hundred
  thousand heavenly soldiers ringing the Mountain of Flowers and
  Fruit, the encirclement that the next chapter will fight to break.
angle: faithful_narrative
episode_format: narrative
format_rationale: >
  The chapter is sustained narrative exposition with embedded comic
  set-pieces (the body-fixing spell, the Barefoot Immortal gulling,
  the sleep-insects, the elixir-eating) and a long battle-sequence,
  not debate. There are no two named voices contesting a proposition
  toward a resolution with one conceding to the other's thesis; the
  exchanges (Wukong with the maidens, Wukong with the Barefoot
  Immortal, Wukong with the Nine Luminaries, Wukong with the Four
  Mighty Generals) are deceptions, taunts, recitals of grievance, and
  consolations — not contested claims advanced by opposing parties.
  The chapter's spine is a single rising trajectory of escalating
  transgression and consequence: idleness → unoccupied warden →
  secret peach-eating → festival-crashing → wine-plundering →
  elixir-stealing → cascading reports → heavenly muster → first
  battle → night-watch — a sustained narrative arc with one
  protagonist plundering and one bureaucracy responding. Narrative
  is the correct shape; deep_dive would impose a single-doctrine
  frame the chapter does not have, and debate would invent a
  sustained named opposition the source does not stage. This matches
  the per-chapter format choice the source asks for — Episode 5
  inherits the narrative shape of Episodes 1–4 because the source's
  rhetorical mode here is the same.
essential: core
essential_rationale: >
  This is the chapter that runs the canonical havoc-in-Heaven triad
  — peach garden, jade pool, cinnabar elixir — and triggers the
  first hundred-thousand-soldier muster that frames the rest of the
  havoc-in-Heaven cycle; without it the listener cannot follow the
  Erlang-Shen battle, the eight-trigrams furnace, or the
  Five-Phases Mountain that close Volume 1.
host_dynamic: storyteller + curious_listener
host_dynamic_rationale: >
  The storyteller voices the source's narration — the rhapsody of
  the Peach Garden, the inventory of three thousand six hundred
  trees, the description of the Jade Pool feast, the verse of the
  Barefoot Immortal's approach, the hundred-thousand-soldier muster
  verse, the great-melee verse, and the closing couplet. The
  curious_listener voices the natural questions the source itself
  prompts: who is Xu Jingyang and why does the Jade Emperor act on
  his warning? what is the difference between trees that ripen in
  three thousand, six thousand, and nine thousand years? who is the
  Queen Mother and why are the seven maidens robed in seven colors?
  what is a body-fixing spell, and why does it last a full day and
  night? who is the Barefoot Great Immortal and why is the Hall of
  Universal Brightness a credible cover? what is the Nine-Cycle
  Golden Elixir, and why is eating five gourds of it a calamity
  bigger than the sky? what are the eighteen frames of the
  heaven-and-earth net, and what is the hour of the Dragon? The
  series-config host_dynamic carries over unchanged from Episodes
  1, 2, 3, and 4.
length_target: extended
key_tensions:
  - >
    The chapter's pivot is the collapse of the "empty title" doctrine
    on the very arrangement it was supposed to prevent. Episode 4
    closed with the Great White Planet's elegant proposal — *give
    him no affairs to manage and no salary to draw. Keep him quietly
    somewhere between Heaven and earth, so as to gather in his
    wayward heart and let no wild presumption arise* — and the
    chapter opens with the Perfected Man Xu Jingyang quietly
    contradicting it: *with nothing to do, he will one day breed
    mischief in his idleness. It would be better to set him over
    some single charge, so that no other trouble may arise.* The
    hosts must let the contradiction land; it is the source's
    diagnosis of Heaven's policy. An empty title given to a wayward
    heart does not settle the heart; it gives the heart a perch from
    which to plunder the orchard it has been set to guard.
  - >
    The Peach Garden inventory is the source's slow-build, and the
    hosts must voice it as such. Three thousand six hundred trees,
    in three equal cohorts of twelve hundred: small-blossom-and-
    little-fruit ripening in three thousand years (Way and immortal
    body); layered-blossom-and-sweet-fruit ripening in six thousand
    years (rosy-mist ascent and the deathless frame); purple-veined-
    and-pale-yellow-stoned ripening in nine thousand years (life
    coeval with sun and moon). The cohorts must be named in order;
    the listener should feel the deliberation of the source's
    catalogue. It is also the chapter's quiet joke: Wukong has been
    set to guard the very fruit the upper assembly cannot do without,
    and he is eating the nine-thousand-year cohort first.
  - >
    The seven-robed maidens scene is the chapter's first comic
    set-piece and must be voiced with the source's sequence intact:
    the seven colors (red, green, white, black, purple, yellow,
    blue) named in order; the cap and robes lying on the pavilion
    with no telling where the warden has gone; the search through
    every quarter; the manikin two inches tall asleep at the very
    top of one tree; the southward bough with a single peach half
    red and half white; the green-robed maiden pulling the branch
    and the red-robed maiden plucking the fruit; the jolt that
    wakes Wukong; the cudgel drawn from within his ear and grown
    thick as a bowl; the body-fixing spell — *Stay! Stay! Stay!*
    — and the seven maidens standing rooted under the peach
    trees, eyes glazed, blank-faced and stiff. The set-piece is
    the source's way of telling the listener that Wukong's
    capacity for transformation has now passed beyond the
    transformation-rival of Nezha and into a register of his
    own; the hosts must let the comedy register without losing
    the scale of the threat.
  - >
    The Barefoot-Immortal gulling is the chapter's second comic
    set-piece and the source's most concentrated piece of
    Wukong-as-trickster. The hosts must voice the moment with
    the source's emphasis: the Immortal's verse-description as
    he sweeps across the starry sky on the rainbow; Wukong's
    feigned deference (*Venerable Sir, where do you go?*); the
    counterfeit decree (*the Jade Emperor has charged me to go
    by all five roads and invite the worthies, that they may
    first perform the rites of ceremony below the Hall of
    Universal Brightness, and afterward go on to the feast*);
    the Barefoot Immortal's open-and-upright character (he
    takes the lie for truth); the Immortal's own quiet
    objection (*In years past, the rites of thanksgiving were
    performed at the Jade Pool itself*) that the source allows
    to stand without resolution; and the Immortal turning his
    cloud about and making straight for the wrong hall. The
    listener should feel both the cleverness of the lie and the
    wrong-end of it — the Immortal's blamelessness is what makes
    Wukong's later report-to-the-Jade-Emperor disaster
    irrecoverable.
  - >
    The five-gourds-of-cinnabar-elixir moment is the chapter's
    central transgression and must be voiced as such. The hosts
    must name the Tushita Palace, the Heaven of Parted Sorrows
    above the Thirty-Three Heavens, the dwelling of Lord Lao
    Tzu, the Vermilion Mound Cinnabar Terrace where Lord Lao
    and the Ancient Buddha Dipankara are expounding the Way,
    and the elixir-chamber with the brazier still glowing and
    the five gourds beside the stove. They must also voice
    Wukong's internal reckoning — *Ever since Old Monkey
    attained the Way, I have grasped the principle that inner
    and outer are one and the same* — which is the source's
    quiet philosophical joke: Wukong's self-justification for
    eating the elixir is the same Daoist non-dual doctrine the
    elixir is meant to bring its eater to. The hosts should
    let the joke register without belaboring it; the source
    runs the moment in the same comic register as the maidens
    and the Barefoot Immortal, and the comedy is the source's
    way of telling the listener that the offense is real and
    that Wukong understands the offense and proceeds anyway.
  - >
    The hundred-thousand-soldier muster is the chapter's escalation
    and must be voiced with the source's full catalogue. The
    listener has met the Pagoda-Bearing Heavenly King Li and Prince
    Nezha in Episode 4; this chapter adds the Four Great Heavenly
    Kings, the Twenty-Eight Constellations (named one by one in the
    verse — Horn, Neck, Root, Room, Stride, Bond, Stomach, Mane,
    Dipper, Ox, Maid, Void, Roof, House, Wall, Heart, Tail, Basket,
    Well, Ghost, Willow, Star, Bow, Wing, Axletree), the Nine
    Luminaries with Rahu and Ketu, the Twelve Branches of Time, the
    Revealers of the Five Quarters, the Four Duty-Gods of the
    Watches, the stars of east and west, the deities of south and
    north, the gods of the Five Sacred Peaks and the Four Great
    Rivers, the Five Plagues and Five Peaks, the Six Ding and Six
    Jia, the dragon-gods of the Four Rivers, and the eighteen
    frames of the heaven-and-earth net. The catalogue is Heaven's
    diagnosis of its own predicament; the empty title doctrine
    that was elegant in Episode 4 has produced a thief who must
    be netted by every named star in the upper realm. The hosts
    should voice the catalogue at the source's pace and let the
    listener feel the disproportion.
  - >
    The thousand-and-a-hundred-Great-Sages finish is the chapter's
    third transformation-set-piece and must be voiced with the
    source's exact sequence: the hairs plucked, thrown into the
    mouth, chewed small, spat out, and the cry *Change!*; the
    thousand and a hundred Great Sages each wielding a gold-banded
    cudgel; Prince Nezha beaten back; the five heavenly kings
    routed. The set-piece is the source's escalation of the
    hair-double sleight the listener met in Episodes 2 and 4:
    Episode 2 was a single double in the cave; Episode 4 was a
    single sparring double against Nezha; this is the same magic at
    the scale of a battlefield. The hosts should voice the
    re-emergence of the technique as escalation, not novelty — the
    listener should feel that Wukong's signature transformation has
    grown to match the scale of the heavenly host arrayed against
    him, and that the chapter's close is a stalemate the Jade
    Emperor's bureaucracy has not yet learned how to break.
tone_constraints:
  - >
    Walk the chapter in the source's narrative order across ten
    movements: (1) the brotherhood-swearing idleness with every
    star and constellation, and Xu Jingyang's warning at morning
    audience; (2) the appointment to the Peach Garden, the earth-
    god, the laborers, and the rhapsody of the three thousand six
    hundred trees as a set-piece block-quotation; (3) the secret
    peach-eating, the manikin two inches tall asleep at the very
    top of the tree; (4) the seven-robed maidens — robed in red,
    green, white, black, purple, yellow, and blue — searching the
    pavilion, plucking the front, middle, and rear trees, finding
    the single half-red-and-half-white peach on the southward
    bough; (5) Wukong's roar and the body-fixing spell — *Stay!
    Stay! Stay!* — followed by the catalogue of the upper-assembly
    guest-list; (6) the Barefoot Great Immortal's verse-description
    and Wukong's counterfeit summons to the Hall of Universal
    Brightness; (7) the Jade Pool — the precious-halls verse, the
    sleep-insects, the hundred-flavored delicacies, the jade-fluid
    and jasper-nectar, the drunken self-reproach; (8) the wrong
    turn into the Tushita Palace, the elixir-chamber, the five
    gourds of refined golden elixir crunched down like roasted
    beans, the second self-reproach and the flight by invisibility
    through the Western Heaven Gate; (9) the homecoming, the
    explanation to the Four Mighty Generals (with the time-
    conversion formula already established in Episode 4), the
    *no taste at all* coconut wine, and the return-trip to steal
    the jars of jade-fluid and jasper-nectar back for the cave;
    (10) the cascading reports — the maidens, the wine-officers,
    Lord Lao, the residence clerks, the Barefoot Immortal, the
    Inspecting Numinous Officer — the hundred-thousand-soldier
    muster as a set-piece block-quotation, the poem-couplet, the
    Nine Luminaries beaten back at the iron-plank bridge, the
    melee from the hour of the Dragon to sundown as a set-piece
    block-quotation, the seventy-two cave-kings and the One-Horned
    Demon King taken captive, the thousand-and-a-hundred-Great-
    Sages finish, the three-sobs-three-laughs return, *victory
    and defeat are the common lot of soldiers*, and the closing
    couplet handing off to Episode 6.
  - >
    Source-rhetoric must survive verbatim. The chapter is studded
    with formulae that carry the novel's voice and these must be
    preserved: Xu Jingyang's warning (*with nothing to do, he will
    one day breed mischief in his idleness*); the appointment
    (*Take charge for the present of the Garden of Immortal
    Peaches*); the three cohorts of trees (*twelve hundred in
    front … twelve hundred in the middle … twelve hundred behind*)
    with their ripening intervals (three thousand, six thousand,
    nine thousand years); the seven-robed maidens' colors in
    order (red, green, white, black, purple, yellow, blue); the
    catalogue of the upper-assembly guest-list (the Five Elders
    of the Five Quarters, the upper / middle / lower Eight Caves,
    the Star Lords of the Five Bushels); the body-fixing spell
    (*Stay! Stay! Stay!*); the counterfeit summons (*perform the
    rites of ceremony below the Hall of Universal Brightness*);
    the sleep-insects spell (*Change!*); the drunken self-
    reproach (*This is bad — this is bad!*); the Tushita-Palace
    location (*above the Thirty-Three Heavens, in the Heaven of
    Parted Sorrows, the dwelling of Lord Lao Tzu, the Supreme
    Patriarch*); Wukong's self-justifying philosophy at the
    elixir-stove (*the principle that inner and outer are one
    and the same*); the elixir-eating (*crunching them down as
    one cracks roasted beans*); the second self-reproach (*This
    is a calamity bigger than the sky itself*); the time-
    conversion formula (*One day in heaven is a year in the
    world below*); the *no taste at all* exchange with Beng and
    Ba and the proverb (*Sweet or not sweet, it's the water of
    home*); the wine-officers' report (*Someone — we know not
    who — has thrown the grand Feast of Peaches into
    confusion*); Lord Lao's report (*Nine-Cycle Golden Elixir
    against the day Your Majesty should hold the Grand Elixir
    Assembly*); the residence clerks' report (*Sun the Great
    Sage has neglected his charge*); the Jade Emperor's verdict
    on the Barefoot Immortal's report (*This wretch has
    counterfeited a decree and gulled our worthy minister!*);
    the Numinous Officer's identification (*He who has thrown
    the heavenly palace into confusion is none other than the
    Great Sage Equal to Heaven*); the Nine Luminaries' bill of
    crimes (*ten unpardonable crimes*); the Great Sage's reply
    (*These several matters — they are true, all true. But what
    of it now?*); the *thousand and a hundred Great Sages, each
    one wielding a gold-banded cudgel*; the three-sobs-three-
    laughs explanation; the proverb (*Slay ten thousand of the
    foe, and lose three thousand of your own*); and the closing
    couplet (*The monkey-monster's rising shook both heaven and
    earth; / they spread their net and kept their watch by day
    and night*). Keep these intact.
  - >
    Set-piece descriptive and ceremonial passages — the rhapsody
    of the Peach Garden (*Luxuriant and glowing, bough on bough,
    tree upon tree*); the Barefoot Immortal's verse-approach
    (*Heaven all bright with auspicious haze*); the Jade Pool
    feast-description (*Rare incense curling, auspicious haze in
    profusion*); the hundred-thousand-soldier muster verse
    (*Yellow wind rolling, rolling, darkens the very sky*); the
    poem-couplet (*The heaven-born Monkey King, of myriad
    transformations*); the great-melee verse (*Cold wind
    whistling, eerie fog hanging dark*); the closing couplet
    (*The monkey-monster's rising shook both heaven and earth*)
    — must be preserved as set-piece block-quotation passages.
    They are the source's chosen mode of slowing down at moments
    of spectacle, and the listener should feel the slow-down.
  - >
    Chinese names and titles are kept in the form Episodes 1
    through 4 established: Sun Wukong, the Handsome Monkey King,
    the Water-Curtain Cave, the Mountain (or Land) of Flowers and
    Fruit, the Somersault Cloud, the As-You-Will Golden-Banded
    Cudgel, the Four Mighty Generals (Beng and Ba named here as
    in the source), the One-Horned Demon King, the seventy-two
    cave-kings, the Jade Emperor, the Numinous Empyrean Treasure-
    Hall, the Southern Gate of Heaven, the Western Heaven Gate,
    the Three Realms, the Pagoda-Bearing Heavenly King Li, the
    third Prince Nezha. New names introduced or used in this
    chapter — kept in the form the source uses them — are the
    Perfected Man Xu Jingyang; the Three Pure Ones; the Four
    Emperors; the Five Elders of the Five Regions / Five
    Quarters (the Buddha of the Western Heaven, Guanyin of the
    South Pole, the Sage Emperor of Exalted Grace, the Mystic
    Numen of the North Pole, the Great Immortal of the Yellow
    Horn); the Twelve Branches of Time; the Twenty-Eight
    Constellations (Horn, Neck, Root, Room, Stride, Bond,
    Stomach, Mane, Dipper, Ox, Maid, Void, Roof, House, Wall,
    Heart, Tail, Basket, Well, Ghost, Willow, Star, Bow, Wing,
    Axletree); the Nine Luminaries with Rahu and Ketu; the
    Revealers of the Five Quarters; the Four Duty-Gods of the
    Watches; the Five Sacred Peaks and the Four Great Rivers;
    the Five Plagues, the Six Ding and the Six Jia; the Queen
    Mother of the Jade Pool; the Jade Pool itself; the Festival
    of Immortal Peaches; the seven-robed maidens (red, green,
    white, black, purple, yellow, blue); the Barefoot Great
    Immortal; the Hall of Universal Brightness; the Tushita
    Palace; the Heaven of Parted Sorrows; Lord Lao Tzu (the
    Supreme Patriarch of the Way); the Ancient Buddha Dipankara;
    the Vermilion Mound Cinnabar Terrace; the Nine-Cycle Golden
    Elixir; the eighteen frames of the heaven-and-earth net;
    the Inspecting Numinous Officer; and the four Grand
    Celestial Masters. No Arabic phonetics apply (this is
    fiction with `content_profile=fiction`); the
    `_phonetics.md` overlay is a stub.
  - >
    Daoist-Buddhist technical vocabulary is translated, not
    glossed into footnotes. The Heaven of Parted Sorrows above the
    Thirty-Three Heavens, the Vermilion Mound Cinnabar Terrace,
    the Nine-Cycle Golden Elixir (jiu zhuan jin dan), the
    jade-fluid and jasper-nectar (qiong jiang yu ye), the
    sleep-insect transformation (the same hair-pluck-and-cry
    technique the listener already knows from Episodes 2 and 4),
    the body-fixing spell (ding shen fa), the as-you-will weapon,
    and the cave-heaven (dong tian) are all named in the source's
    own register, not modernized.
anchor_passages:
  - >
    "Xu Jingyang's warning at morning audience: *This Great Sage
    Equal to Heaven, having nothing to occupy him, idles his days
    away and consorts with all the stars and constellations of
    heaven, calling high and low alike his friend. I fear that,
    with nothing to do, he will one day breed mischief in his
    idleness. It would be better to set him over some single
    charge, so that no other trouble may arise.*"
  - >
    "The three cohorts of the Peach Garden: *There are three
    thousand six hundred. The twelve hundred in front … ripen once
    in three thousand years … the twelve hundred in the middle …
    ripen once in six thousand years … the twelve hundred behind …
    ripen once in nine thousand years, and a man who eats of them
    lives as long as heaven and earth, of one age with the sun and
    moon.*"
  - >
    "The body-fixing spell and the seven robed maidens: *Stay!
    Stay! Stay! — and it left the seven-robed maidens, every one of
    them, standing rooted beneath the peach trees, eyes glazed,
    blank-faced and stiff.*"
  - >
    "The counterfeit summons to the Barefoot Immortal: *Because Old
    Monkey's somersault cloud is so swift, the Jade Emperor has
    charged me to go by all five roads and invite the worthies,
    that they may first perform the rites of ceremony below the
    Hall of Universal Brightness, and afterward go on to the
    feast.*"
  - >
    "The drunken self-reproach in the Jade Pool: *This is bad —
    this is bad! In a little while, when the invited guests arrive,
    will they not lay the blame on me? If I am caught here, how
    shall I fare? Better get home early and sleep it off.*"
  - >
    "Wukong at the elixir-stove: *This stuff is the supreme
    treasure of the immortal folk! Ever since Old Monkey attained
    the Way, I have grasped the principle that inner and outer are
    one and the same … While the old gentleman is away, let me eat
    a few pellets and try them. — So he tipped out all the gourds
    and ate the lot, crunching them down as one cracks roasted
    beans.*"
  - >
    "The second self-reproach after the elixir: *This is bad —
    this is bad! This is a calamity bigger than the sky itself. If
    the Jade Emperor learns of it, my life is forfeit. Go — go —
    go! Better to go down to the world below and be a king
    there.*"
  - >
    "Beng and Ba's proverb on home wine: *The Great Sage has been
    drinking immortal wine and eating immortal fare in the heavenly
    palace, so coconut wine is little to his liking. As the old
    saying has it, 'Sweet or not sweet, it's the water of
    home.'*"
  - >
    "The Jade Emperor on the Barefoot Immortal's report: *This
    wretch has counterfeited a decree and gulled our worthy
    minister! Quick — set the Inspecting Numinous Officer to track
    down the trail of this wretch.*"
  - >
    "The Inspecting Numinous Officer's report: *He who has thrown
    the heavenly palace into confusion is none other than the Great
    Sage Equal to Heaven.*"
  - >
    "The Nine Luminaries' bill of indictment: *You reckless,
    death-defying Protector of the Horses! You have committed the
    ten unpardonable crimes — you stole the peaches, you stole the
    wine, you threw the grand Feast of Peaches into confusion, you
    filched Lord Lao's immortal elixir, and you have stolen the
    imperial wine to make merry here. Crime heaped upon crime — do
    you not know it?*"
  - >
    "The Great Sage's reply to the indictment: *These several
    matters — they are true, all true. But what of it now?*"
  - >
    "The thousand-and-a-hundred-Great-Sages finish: *he plucked out
    a handful of his hairs, threw them into his mouth, chewed them
    small, spat them out, and cried, "Change!" At once they became
    a thousand and a hundred Great Sages, each one wielding a
    gold-banded cudgel, and they beat back Prince Nezha and routed
    the five heavenly kings.*"
  - >
    "The three-sobs-three-laughs explanation and the proverb:
    *Victory and defeat are the common lot of soldiers. The
    ancients say, 'Slay ten thousand of the foe, and lose three
    thousand of your own.'*"
  - >
    "The closing couplet, the chapter's hand-off to Episode 6:
    *The monkey-monster's rising shook both heaven and earth; /
    they spread their net and kept their watch by day and night.*"
