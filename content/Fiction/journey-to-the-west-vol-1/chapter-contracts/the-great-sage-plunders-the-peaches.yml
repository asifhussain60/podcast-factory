thesis_relevance: >
  This chapter advances the book's central claim — that even a
  heaven-born being seasoned by the very essence of sun and moon
  must still cross oceans, walk continents, and submit to a master
  before the awakening it is destined for can be named — by
  collapsing the second of Heaven's two absorption-policies on the
  very arrangement designed to prevent it. Episode 3's amnesty
  brought Wukong up to office; Episode 4's empty title gave him
  rank without duty; this chapter shows that an unoccupied warden
  set among three thousand six hundred trees of immortality will
  not be settled by the architecture of the upper assembly but will
  plunder it. The havoc-in-Heaven triad — peach garden, jade pool,
  cinnabar elixir — that begins here is the source's diagnosis
  that titles, mansions, and immortal clerks cannot transform a
  heart that has not yet undergone the discipline of being a
  pilgrim under a master; the next several chapters will run the
  diagnosis to its conclusion (Erlang-Shen, the eight-trigrams
  furnace, the Five-Phases Mountain), and the listener leaves with
  the hundred-thousand-soldier muster fully arrayed and the canonical
  adversary-roster (Heavenly King Li, Nezha, the Four Heavenly
  Kings, the Twenty-Eight Constellations, the Nine Luminaries)
  installed against him.
show_notes:
  blurb: >
    The chapter in which Heaven's "empty title" doctrine collapses on
    the very arrangement designed to prevent it. Idle in his mansion
    beside the Garden of Immortal Peaches, the Great Sage swears
    brotherhood with every star and constellation of the upper realm
    until the Perfected Man Xu Jingyang warns the Jade Emperor that
    an unoccupied monkey-spirit will breed mischief. Set as warden of
    the Peach Garden — three thousand six hundred trees ripening in
    three, six, and nine thousand years — Wukong eats his fill of the
    choicest fruit, and when the Queen Mother sends her seven robed
    maidens to gather peaches for the Festival of Immortal Peaches,
    they find him shrunk to a two-inch manikin asleep in the leaves.
    He fixes them where they stand with a body-binding spell, gulls
    the Barefoot Great Immortal away from the feast with a
    counterfeit summons to the Hall of Universal Brightness, takes
    the Immortal's likeness, and steals into the empty Jade Pool —
    sleep-insects on the wine-officers, the hundred-flavored
    delicacies and the jade-fluid and jasper-nectar consumed at
    leisure. Staggering homeward he blunders into the Tushita Palace,
    where he crunches down all five gourds of Lord Lao Tzu's refined
    golden elixir like roasted beans, then slips through the Western
    Heaven Gate by invisibility and goes down to Flower-Fruit
    Mountain. The maidens, the wine-officers, Lord Lao, the residence
    clerks, the Barefoot Immortal, and the Inspecting Numinous
    Officer all report; the Jade Emperor musters a hundred thousand
    heavenly soldiers under the Four Great Heavenly Kings,
    Pagoda-Bearing Heavenly King Li, and Prince Nezha, and spreads
    eighteen frames of heaven-and-earth net about the mountain. The
    Nine Luminaries are beaten back at the iron-plank bridge; the
    Four Heavenly Kings and the Twenty-Eight Constellations join
    battle from the hour of the Dragon until sundown and take the
    seventy-two cave-kings and the One-Horned Demon King captive,
    but Wukong, plucking a handful of hairs and crying "Change!",
    scatters a thousand and a hundred Great Sages across the field
    and routes the heavenly princes back to their evening camp. The
    cave holds; the night-watch rings the mountain; tomorrow's
    battle waits for the dawn.
