  references:
    - >
      "Wu Cheng'en, *Journey to the West* (Xī Yóu Jì 西遊記), Chapter
      2 — the doctrinal survey of the four gates, the third-watch
      summons, the oral formula of the Golden Elixir, the Three
      Calamities, the seventy-two Earthly-Fiend transformations, the
      Somersault Cloud, the pine-tree expulsion, the return to the
      Water Curtain Cave, the Monstrous King of Havoc, and the
      *Body-Outside-the-Body* method"
    - >
      "The Daoist inner-alchemy (neidan 內丹) tradition of the Golden
      Elixir (jindan 金丹) — the essence-breath-spirit (jing-qi-shen
      精氣神) triad, the Bubbling Spring (yongquan 湧泉) point at the
      sole, the Niwan Palace (niwan gong 泥丸宮) in the crown, and the
      elixir-field (dantian 丹田); the Tang-Song lineage running
      through Zhang Boduan's *Wuzhen Pian* (Essay on Awakening to
      Reality, c. 1075) and the Quanzhen school's syncretic
      teachings the Ming-dynasty novel inherits"
    - >
      "The Chan-Daoist syncretism of the lecture-platform marvel
      (*A while he spoke of the Way, a while he discoursed on Chan
      — the three traditions joined as one*) — the
      Confucianism-Buddhism-Daoism (sanjiao heyi 三教合一) ideal
      that shapes the Patriarch's character as a master who teaches
      all three at once"
    - >
      "The seventy-two Earthly Fiends (di sha 地煞) and the
      thirty-six Heavenly Ladle stars (tian gang 天罡) — the
      hundred-and-eight star-spirits of Chinese popular religion
      and the *Water Margin*'s outlaw-band tradition, recast here
      as transformation-count totals; the novel chooses the larger
      number for Wukong because *casting a wider net* will turn out
      to matter"
    - >
      "The Somersault Cloud (jindouyun 觔斗雲) and its hundred-and-
      eight-thousand-mile range — the number is the same as the
      distance the *Heart Sutra*'s *bodhisattva of the West* travels,
      and the same as the distance from Chang'an to Vulture Peak in
      the novel's later pilgrim cosmology"
    - >
      "The *Body-Outside-the-Body* (shenwai shen 身外身) method — a
      transformation-doubling technique attested in earlier Chinese
      story-cycles (Sun Wukong's hair-clones in the novel become
      the most famous instance); the eighty-four thousand hairs
      borrow a Buddhist numerological convention (84,000 dharma-
      gates, 84,000 afflictions) the novel naturalizes onto the
      monkey body"
