chapter_ref: ch04-the-heavenly-stable-and-the-great-sage
slug: the-heavenly-stable-and-the-great-sage
source_type: book-chapter
book_slug: journey-to-the-west-vol-1
source_chapter_ref: 4
section_index: 1
episode_number: 4
title: "The Heavenly Stable and the Great Sage Equal to Heaven"
audience: >
  A general adult listener continuing with *Journey to the West* — Wu
  Cheng'en's sixteenth-century Ming-dynasty fantastical novel — having
  watched, in Episode 3, Sun Wukong arm himself with the As-You-Will
  Gold-Banded Cudgel and the four-sea armor, strike the monkey-clan
  out of the Registers of Life and Death, and ride the cloud of the
  Great White Planet of Venus up beyond the Southern Heaven Gate on
  an edict of amnesty and recruitment. No prior familiarity with the
  Heavenly bureaucracy of the Numinous Empyrean Treasure-Hall, the
  Imperial Stable and its thousand celestial horses, the gate-warden
  Virūḍhaka, the Pagoda-Bearing Heavenly King Li Jing, or the
  three-headed six-armed prince Nezha is required. This episode is the
  chapter in which Heaven's amnesty-and-recruitment policy is tested
  and found to be just as combustible as the divine-troops alternative.
  The listener will follow ten movements: the entry through the
  Southern Gate barred by Virūḍhaka and his eight named soldiers; the
  set-piece rhapsody of the Numinous Empyrean Hall (thirty-three
  celestial palaces, seventy-two layered treasure-halls, the
  Terrace of the Star of Longevity, the elixir-refining furnace, the
  Tower of Sage-Audience); Wukong's failure of court rites and the
  Jade Emperor's pardon; the only vacancy — the Imperial Stable —
  and the title BanMaWen, Keeper of the Horses; the inventory of the
  thousand heavenly horses (Hualiu, Qiji, the wing-hung Sushuang,
  Chitu that outraces light, the steeds of Dayuan, the eight chargers
  and the nine fleet ones); the half-month of diligent grooming and
  the stable-officers' banquet where Wukong learns the post is
  "unranked" — the lowest of the low; the overturning of the desk
  and the fight out of the Southern Gate; the homecoming and the
  Two One-Horned Demon Kings whose gift of a russet-yellow robe
  is paired with the suggestion to raise the four-word banner GREAT
  SAGE EQUAL TO HEAVEN; the Heavenly King Li Jing's expedition with
  the Mighty Magic Spirit as vanguard, the Fish-Belly General as
  rearguard, and the Yaksha General to urge the troops, and the
  battle in which the Mighty Magic Spirit's patterned battle-ax is
  broken clean in two; Prince Nezha's three-heads-and-six-arms
  transformation matched move-for-move by Wukong's own, the
  hair-double sleight that ends with Nezha wounded in the left arm,
  and the seven sworn brothers each styling himself a Great Sage;
  and the Great White Planet's second descent, with the elegant
  pivot of bestowing only an "empty title — an office without
  emolument," the Mansion of the Great Sage on the right-hand side
  of the Garden of Immortal Peaches with its Bureau of Peace and
  Quiet and Bureau of Tranquil Spirit, the two bottles of imperial
  wine, and the ten golden flowers. The listener leaves with three
  things in hand: the architecture of the heavenly bureaucracy as
  the novel will use it for the next ten chapters; the canonical
  six-armed Nezha and his six weapons (demon-slaying sword,
  demon-hacking saber, demon-binding rope, demon-subduing pestle,
  embroidered ball, fire-wheel) matched by Wukong's own
  three-heads-and-six-arms; and Heaven's diagnosis — when force
  fails, name without office — that the listener will spend the
  rest of Volume 1 watching collapse.
angle: faithful_narrative
episode_format: narrative
format_rationale: >
  The chapter is sustained narrative exposition with embedded
  exchanges and two combat set-pieces, not debate. The conflicts —
  Wukong's quarrel with his stable-officers about the rank of the
  office, his shouted exchange with the Mighty Magic Spirit, his
  match against Nezha — are skirmishes and grievances, not contested
  propositions advanced by two named parties toward a resolution
  with one conceding to the other's thesis. The chapter's spine is
  a single rising trajectory of escalation: ascent → low office →
  insult → revolt → first heavenly expedition defeated → second
  expedition defeated → titular settlement. The closing council in
  the Numinous Empyrean is a single-voice consultative proposal by
  the Great White Planet, accepted by the Jade Emperor without
  opposition — the same shape as the amnesty proposal in Episode 3.
  Narrative is therefore the correct shape; deep_dive would impose a
  single-doctrine frame the chapter does not have, and debate would
  invent a sustained named opposition that the source does not
  stage.
essential: core
essential_rationale: >
  This is the chapter that names Wukong "Great Sage Equal to Heaven"
  — the title under which the rest of Volume 1's havoc-in-Heaven
  cycle will unfold — and that introduces Heavenly King Li Jing and
  the three-headed six-armed Nezha as the novel's recurring
  adversaries, the BanMaWen as the recurring insult Wukong will
  bristle at for the rest of the volume, and the Mansion of the
  Great Sage as the setting of the peach-garden episode immediately
  following. Without it the listener cannot follow the
  peach-stealing, the cinnabar-elixir-eating, or the great
  havoc-in-Heaven sequence.
host_dynamic: storyteller + curious_listener
host_dynamic_rationale: >
  The storyteller voices the source's narration — the rhapsody of
  the Numinous Empyrean Hall, the inventory of the thousand
  heavenly horses, the description of the armed Monkey King, the
  set-piece of Nezha's six weapons, the combat verse, and the Great
  White Planet's "empty title" pivot. The curious_listener voices
  the natural questions the source itself prompts: who is the
  Heavenly King Virūḍhaka and why does he bar the Southern Gate?
  why is "unranked" the lowest of the low rather than the highest?
  who is Nezha and what are the six weapons of his three-heads-and-
  six-arms transformation? what is an "office without emolument"
  and why does the Jade Emperor accept the elegance of it? The
  series-config host_dynamic carries over unchanged from Episodes 1,
  2, and 3.
length_target: extended
key_tensions:
  - >
    The chapter's pivot is the discovery that BanMaWen is unranked.
    The source builds this deliberately: half a month of diligent
    grooming, the heavenly horses sleek and fat, the banquet to
    welcome and congratulate the new chief — and then the quiet
    question, *what rank of office is it?*, the quiet answer, *it
    has no grade at all*, and Wukong's misreading (*exalted beyond
    all measure*) followed by the colleagues' correction (*the very
    bottom*). The hosts must let the misreading land; it is the
    source's diagnosis of Heaven's policy. Amnesty-and-recruitment
    works only if the office offered is one the absorbed party
    accepts as honorable; offered an office that turns out to be
    the lowest of the low, Wukong's response is not negotiation but
    revolt — overturning the desk, fighting out through the
    Southern Gate, and back to Flower-Fruit Mountain.
  - >
    The four-word banner — GREAT SAGE EQUAL TO HEAVEN — and the
    russet-yellow robe of the Two One-Horned Demon Kings together
    make the title that the rest of Volume 1 turns on. The hosts
    must voice the moment with the source's emphasis: the One-Horned
    Demon Kings flatter Wukong on his return from the upper realm,
    present the robe as if to a returning grandee, and then drop the
    question that solves the BanMaWen insult — *Why not proclaim
    yourself "Great Sage Equal to Heaven"?* The four-word formula
    is repeated five times in the chapter, on the banner, in the
    confrontations with the Mighty Magic Spirit and Nezha, in the
    report back to the throne, and in the eventual investiture; the
    listener should leave hearing the four words rung in like a bell.
  - >
    The Mighty Magic Spirit battle is a comic set-piece and the
    hosts must voice it as such. The chapter spends a full
    descriptive verse on Wukong's armor, names the ax *Patterned-
    Blossom* and the cudgel *As-You-Will*, runs the combat through
    rhymed couplets, and ends with the ax-handle beaten clean in
    two and the Mighty Magic Spirit fleeing with the Monkey King
    laughing *Soft sack! Soft sack!* after him. The hosts should let
    the rhyme register and let the laugh land; the source is doing
    the work of telling the listener that Heaven's first response
    is structurally inadequate to the problem.
  - >
    Nezha is the chapter's other named adversary, and his
    three-heads-and-six-arms transformation is the source's first
    on-stage display of the canonical Nezha. The six weapons must
    be named in order (demon-slaying sword, demon-hacking saber,
    demon-binding rope, demon-subduing pestle, embroidered ball,
    fire-wheel), because the same six will recur across the
    havoc-in-Heaven cycle and beyond. Wukong's match —
    three-heads-and-six-arms, the cudgel multiplied to three, then
    to ten thousand — is the source's signal that the BanMaWen is
    not merely a strong fighter but a transformation-rival to the
    most exotic of Heaven's princes. The hair-double sleight that
    ends the bout (Wukong plucks a single hair, makes it spar in
    his likeness, and slips behind Nezha to strike the left arm) is
    the same body-outside-the-body method the listener met in
    Episode 2; it must be voiced as the *re-emergence* of a
    technique already known, not as a new trick.
  - >
    The seven sworn brothers' titles are the source's running joke
    and the hosts must let it run. Each brother claims a "Great
    Sage" formula: the Bull King pacifies Heaven, the Flood-Dragon
    overturns the sea, the Roc confounds Heaven, the Lion-Camel
    moves mountains, the Macaque carries the wind, the Lemur-Monkey
    drives the spirits. The seven titles are Heaven's amnesty
    policy carried to absurdity — if a name without office can
    settle a wayward heart, then any wayward heart can name itself
    a Great Sage. The listener should hear the joke; it is the
    source's anticipation that the empty title cannot do the work
    it is being asked to do.
  - >
    The Great White Planet's "empty title" doctrine is the source's
    elegant second pivot — the same Planet, with the same gentle
    consultative voice, returning to Heaven a second time with an
    even more elegant proposal. The doctrine must be voiced
    precisely: *give him no affairs to manage and no salary to
    draw. Keep him quietly somewhere between Heaven and earth, so
    as to gather in his wayward heart and let no wild presumption
    arise.* This is the policy on which the next half-dozen
    chapters turn; the peach-stealing and elixir-eating are
    Wukong's wayward heart making the most of an office that gives
    him nothing to do, and the listener should leave the episode
    with the policy fully in mind so the consequences land cleanly
    when they come.
tone_constraints:
  - >
    Walk the chapter in the source's narrative order across ten
    movements: (1) the cloud-ride to the Southern Gate, the
    blocking by Heavenly King Virūḍhaka and his eight named
    soldiers, and the Planet Star's hailing-cry that gets the gate
    open; (2) the rhapsody of the Numinous Empyrean Hall as a
    set-piece block-quotation; (3) the audience — Wukong's failure
    of court rites, "That'd be old Monkey here," and the Jade
    Emperor's pardon; (4) the Star Lord of Wuqu's report of the
    one vacancy and the appointment as BanMaWen; (5) the inventory
    of the thousand heavenly horses as a set-piece block-quotation,
    and the half-month of diligent grooming; (6) the banquet, the
    discovery that the office is unranked, the overturning of the
    desk, and the fight out through the Southern Gate; (7) the
    homecoming, the Two One-Horned Demon Kings, the russet-yellow
    robe, and the raising of the four-word banner GREAT SAGE EQUAL
    TO HEAVEN; (8) the twin reports to the Jade Emperor and the
    dispatch of the Pagoda-Bearing Heavenly King Li Jing and Prince
    Nezha; (9) the battle with the Mighty Magic Spirit (verse-
    description of the armed Monkey, the combat verse, the
    broken-ax-handle close), the battle with Nezha (the
    six-weapons verse, the cudgel-multiplication verse, the
    hair-double sleight, the wounded left arm); (10) the second
    descent of the Great White Planet, the "empty title" doctrine,
    the investiture as Great Sage Equal to Heaven, the Mansion
    beside the Garden of Immortal Peaches with the Bureau of Peace
    and Quiet and Bureau of Tranquil Spirit, the two bottles of
    imperial wine, the ten golden flowers, and the closing couplet.
  - >
    Source-rhetoric must survive verbatim. The chapter is studded
    with formulae that carry the novel's voice and these must be
    preserved: the gate-blocking moment with the named eight
    soldiers (Pang, Liu, Gou, Bi, Deng, Xin, Zhang, Tao); the
    Planet's gate-hailing (*This is an immortal from the lower
    world. I bear the Jade Emperor's sacred decree and have
    summoned him hither*); Wukong's first answer to the throne
    (*That'd be old Monkey here*); the noble immortals' alarm
    (*He deserves to die! He deserves to die!*); the Jade
    Emperor's pardon (*he does not know the rites of court — let
    his offense be pardoned for now*); the vacancy-report from
    the Star Lord of Wuqu (*the Imperial Stable lacks a chief to
    manage its affairs*); the title and the office (*let him be
    made a BanMaWen — a Keeper of the Horses*); the
    rank-misreading exchange (*I suppose that means it is
    exalted beyond all measure* — *Not great, not great. It is
    merely called "unranked"*); the office-description that
    contains the policy-failure (*all you'll earn is a single
    word of praise … you'll be fined, made to pay restitution,
    and charged with the crime*); Wukong's revolt-speech (*Horse-
    tending is the base drudgery of low-born striplings — is
    that any way to treat the likes of me?*); the time-conversion
    formula (*One day in Heaven is a whole year in the world
    below*); the One-Horned Demon Kings' suggestion (*Why not
    proclaim yourself "Great Sage Equal to Heaven"?*); the
    Mighty Magic Spirit's challenge and Wukong's offer-and-threat
    (*if he'll promote me according to that title, I'll lay down
    my weapons and Heaven and earth will of themselves be at
    peace. But if he won't, I'll come straight up and beat upon
    the Numinous Empyrean Treasure-Hall*); the laughing dismissal
    (*Soft sack! Soft sack!*); Nezha's six weapons named in order
    (demon-slaying sword, demon-hacking saber, demon-binding
    rope, demon-subduing pestle, embroidered ball, fire-wheel);
    the seven Great Sage titles in order (Pacifies Heaven,
    Overturns the Sea, Confounds Heaven, Moves Mountains,
    Carries the Wind, Drives the Spirits); the Great White
    Planet's empty-title doctrine (*give him no affairs to
    manage and no salary to draw. Keep him quietly somewhere
    between Heaven and earth, so as to gather in his wayward
    heart and let no wild presumption arise*); and the closing
    couplet (*His immortal name forever set in the scroll of
    long life; / no more to fall through the wheel of rebirth —
    handed down for all the ages*). Keep these intact.
  - >
    Set-piece descriptive and ceremonial passages (the Numinous
    Empyrean rhapsody, the inventory of the thousand heavenly
    horses, the verse-description of the armed Monkey King, the
    Mighty-Magic-Spirit combat verse, the Nezha verse, the
    six-armed combat verse, the closing couplet) must be
    preserved as set-piece block-quotation passages. They are
    the source's chosen mode of slowing down at moments of
    spectacle, and the listener should feel the slow-down.
  - >
    Chinese names and titles are kept in the form Episodes 1
    through 3 established: Sun Wukong, the Handsome Monkey King,
    the Water-Curtain Cave, the Mountain (or Land) of Flowers and
    Fruit, the Somersault Cloud, the As-You-Will Golden-Banded
    Cudgel, the Four Mighty Generals, the Bull Demon King, the
    Flood-Dragon Demon King, the Roc Demon King, the Lion-Camel
    Demon King, the Macaque Demon King, the Lemur-Monkey Demon
    King, the Great White Planet (the Star of Long Geng / Venus),
    the Jade Emperor, the Numinous Empyrean Treasure-Hall, the
    Southern Gate of Heaven, the Three Realms, the Five Elements.
    New names introduced in this chapter — kept in the form the
    source uses them — are the Heavenly King Virūḍhaka (and his
    eight gate-soldiers Pang, Liu, Gou, Bi, Deng, Xin, Zhang,
    Tao); the Star Lord of Wuqu; the Pagoda-Bearing Heavenly
    King Li Jing; the third Prince Nezha (the Great Spirit of
    the Three Altars and the Ocean Assembly); the Mighty Magic
    Spirit; the Fish-Belly General; the Yaksha General; the Two
    One-Horned Demon Kings; the Star Officer of the Wood Virtue;
    the Star Lords of the Five Bushels; Heavenly Master Zhang;
    the master-builders Zhang and Lu; the Bureau of Peace and
    Quiet; the Bureau of Tranquil Spirit; the Garden of
    Immortal Peaches; the thirty-three celestial palaces (the
    Cloud-Dispatching, the Vaiśravaṇa, the Five Brilliances, the
    Palace of the Sun, the Palace of Flower and Joy) and the
    seventy-two layered treasure-halls (the Hall of Court
    Assembly, the Hall of Soaring Void, the Hall of Precious
    Light, the Hall of the Heavenly Kings, the Hall of the
    Numinous Officers); and the named horses (Hualiu, Qiji,
    Lu'er, Xianli, Longmei, Ziyan, Sushuang, Jueti, Yinhua,
    Yaoniao, Feihuang, Taotu, Chitu, Yuhui, Mijing, Shenghuang,
    the Bronze Sparrow, Zilin, the steeds of Dayuan, the eight
    chargers, the nine fleet ones). No Arabic phonetics apply
    (this is fiction with `content_profile=fiction`); the
    `_phonetics.md` overlay is a stub.
  - >
    Daoist-Buddhist technical vocabulary is translated, not
    glossed into footnotes. The Numinous Empyrean (Lingxiao), the
    immortal scroll (xian lu), the office-without-emolument
    (you ming wu lu) doctrine of the Heavenly bureaucracy, the
    Three Altars and the Ocean Assembly title, the cloud-treading
    shoes, the as-you-will weapon, and the wheel of rebirth
    (sansara / lunhui) are all named in the source's own register,
    not modernized.
anchor_passages:
  - >
    "The gate-blocking that opens the chapter, with the eight
    named soldiers and the Planet's hailing-cry: *Heavenly King
    Virūḍhaka, at the head of his mighty heavenly soldiers — Pang,
    Liu, Gou, Bi, Deng, Xin, Zhang, and Tao — with spears, swords,
    sabers, and halberds, blocked the gate of Heaven and would not
    let him pass.*"
  - >
    "Wukong's first answer to the throne and the noble immortals'
    alarm: *That'd be old Monkey here. … This wild ape! Why does
    he not prostrate himself and pay homage, but dares to answer
    so — "That'd be old Monkey here"? He deserves to die! He
    deserves to die!*"
  - >
    "The Star Lord of Wuqu's vacancy-report and the appointment:
    *In all the palaces and halls of the heavenly court, in every
    quarter and every region, there is no shortage of officers —
    save that the Imperial Stable lacks a chief to manage its
    affairs. … Then let him be made a BanMaWen — a Keeper of the
    Horses.*"
  - >
    "The rank-discovery exchange at the stable-officers' banquet:
    *And what grade does this office hold? — It has no grade at
    all. … No grade? I suppose that means it is exalted beyond all
    measure. — Not great, not great. It is merely called
    "unranked." … The very bottom. An office like this is the
    lowest and smallest of all — fit only for looking after
    horses.*"
  - >
    "Wukong's revolt-speech and the overturning of the desk: *So
    this is how they slight old Monkey! On my Flower-Fruit
    Mountain I am hailed as king and patriarch — and they've
    gulled me into coming here to tend their horses for them!
    Horse-tending is the base drudgery of low-born striplings —
    is that any way to treat the likes of me? I'll not do it,
    I'll not do it! I'm off!*"
  - >
    "The time-conversion formula and the homecoming: *I've been
    gone scarcely a half-month. How could it be a dozen years? —
    Great King, up in Heaven one takes no notice of the passing
    hours. One day in Heaven is a whole year in the world below.*"
  - >
    "The Two One-Horned Demon Kings' suggestion and the raising of
    the banner: *With supernatural powers such as yours, Great
    King, why should you tend his horses? Why not proclaim
    yourself "Great Sage Equal to Heaven"? What is there to stop
    you? … Quickly set up a banner for me, and on the banner write
    the four great words "GREAT SAGE EQUAL TO HEAVEN."*"
  - >
    "Wukong's offer-and-threat to the Mighty Magic Spirit: *if
    he'll promote me according to that title, I'll lay down my
    weapons and Heaven and earth will of themselves be at peace.
    But if he won't, I'll come straight up and beat upon the
    Numinous Empyrean Treasure-Hall, and he'll not sit easy upon
    his dragon-throne!*"
  - >
    "Nezha's six weapons and Wukong's matched transformation:
    *his six hands gripping his six weapons: the demon-slaying
    sword, the demon-hacking saber, the demon-binding rope, the
    demon-subduing pestle, the embroidered ball, and the
    fire-wheel … he too gave a great shout — "Change!" — and
    changed into three heads and six arms; with one shake of the
    Golden-Banded Cudgel he made it three cudgels.*"
  - >
    "The hair-double sleight that ends the Nezha bout: *Wukong was
    quick of hand and sharp of eye. In the very thick of the
    confusion he plucked out a single hair, cried "Change!", and
    changed it into his own likeness, holding a cudgel and
    sparring with Nezha; while his true body, with one bound,
    slipped around behind Nezha and struck him a blow on the left
    arm.*"
  - >
    "The seven Great Sage titles in order: *I shall style myself
    the Great Sage Who Pacifies Heaven. … the Great Sage Who
    Overturns the Sea. … the Great Sage Who Confounds Heaven. …
    the Great Sage Who Moves Mountains. … the Great Sage Who
    Carries the Wind. … the Great Sage Who Drives the Spirits.*"
  - >
    "The Great White Planet's empty-title doctrine: *Better that
    Your Majesty extend your great mercy and grace, hand down once
    more a decree of amnesty, and simply let him be the Great Sage
    Equal to Heaven. Bestow on him only an empty title — an office
    without emolument — and there's an end to it. … give him no
    affairs to manage and no salary to draw. Keep him quietly
    somewhere between Heaven and earth, so as to gather in his
    wayward heart and let no wild presumption arise.*"
  - >
    "The investiture and the Mansion of the Great Sage: *raise on
    the right-hand side of the Garden of Immortal Peaches a
    Mansion of the Great Sage Equal to Heaven; and within the
    mansion to establish two bureaus — one named the Bureau of
    Peace and Quiet, the other the Bureau of Tranquil Spirit. …
    bestowed in addition two bottles of imperial wine and ten
    golden flowers, charging him to settle his heart and steady
    his will, and never again to behave wildly.*"
  - >
    "The closing couplet, the chapter's hand-off to Episode 5:
    *His immortal name forever set in the scroll of long life; /
    no more to fall through the wheel of rebirth — handed down for
    all the ages.*"
adaptation_mode: faithful
phonetic_overrides: {}
thesis_relevance: >
  This chapter advances the book's central claim — that even a
  heaven-born being seasoned by the very essence of sun and moon
  must still cross oceans, walk continents, and submit to a master
  before the awakening it is destined for can be named — by giving
  Heaven its second chance at the absorption-policy and showing it
  fail again. The amnesty of Episode 3 brings Wukong up to office;
  this chapter shows that office without honor cannot bind a
  wayward heart, and that the corrective Heaven invents — title
  without office, name without affairs — is the same mistake at a
  higher elevation. The Mansion of the Great Sage beside the Garden
  of Immortal Peaches, with two bureaus and immortal clerks but no
  duties, is the architecture the next several chapters will
  collapse; the listener leaves with the policy fully in mind and
  the canonical adversary-roster (Li Jing, Nezha, the Mighty Magic
  Spirit) installed.
show_notes:
  blurb: >
    The chapter in which Heaven's amnesty-and-recruitment policy is
    tested and answered with a second elegant pivot. Sun Wukong
    rides the cloud through the Southern Gate of Heaven, fails the
    rites of court before the Jade Emperor with "That'd be old
    Monkey here," and is installed in the only vacancy — the
    Imperial Stable — as a BanMaWen, a Keeper of the Horses. He
    tends a thousand heavenly horses sleek and fat for half a
    month before learning at the stable-officers' banquet that the
    post is "unranked": the lowest of the low. He overturns the
    desk, fights his way back through the Southern Gate, returns
    to Flower-Fruit Mountain, and on the advice of two One-Horned
    Demon Kings raises a four-word banner at his cave-mouth —
    GREAT SAGE EQUAL TO HEAVEN. The Pagoda-Bearing Heavenly King
    Li Jing and the third prince Nezha descend with their host;
    the vanguard Mighty Magic Spirit has his patterned battle-ax
    broken clean in two; Nezha transforms into three heads and
    six arms with the demon-slaying sword, demon-hacking saber,
    demon-binding rope, demon-subduing pestle, embroidered ball,
    and fire-wheel — and Wukong, matching the transformation,
    plucks a single hair, makes it spar in his likeness, and slips
    behind Nezha to strike his left arm. Heavenly King Li
    retreats. The Great White Planet of Venus comes forward a
    second time with an even more elegant proposal: let the title
    stand, but make it an empty title — an office without
    emolument, no affairs and no salary, only a name to settle the
    wayward heart. The Jade Emperor agrees, and Wukong is
    installed in a Mansion of the Great Sage Equal to Heaven on
    the right-hand side of the Garden of Immortal Peaches, with
    the Bureau of Peace and Quiet and the Bureau of Tranquil
    Spirit, two bottles of imperial wine, and ten golden flowers,
    on the charge of never again behaving wildly.
