      "The Pagoda-Bearing Heavenly King Li Jing (Tuota Tianwang
      Li Jing 托塔天王李靖) — historically the Tang-dynasty general Li
      Jing of *Investiture of the Gods* and *Fengshen Yanyi*
      provenance, popularly attached to the Buddhist
      Vaiśravaṇa-Bishamonten through his stupa-pagoda; the
      pagoda in his hand is the trap that contains his
      father-quarreling son Nezha and the canonical instrument
      of his authority over rebellious princes"
    - >
      "Prince Nezha (Nezha 哪吒) and the three-heads-and-six-arms
      (sān tóu liù bì 三頭六臂) transformation — the
      Buddhist-Daoist syncretic child-god originating from the
      Indian yakṣa Nalakūbara via Tantric translation, expanded
      in *Fengshen Yanyi*; his six weapons (demon-slaying sword,
      demon-hacking saber, demon-binding rope, demon-subduing
      pestle, embroidered ball, fire-wheel) and his title of
      *Great Spirit of the Three Altars and the Ocean Assembly*
      (Santan Haihui Da Shen 三壇海會大神) are the canonical
      Nezha-trappings the novel inherits and that the listener
      will see again across the havoc-in-Heaven cycle"
    - >
      "The Imperial Stable (Yu Ma Jian 御馬監) and the title BanMaWen
      (弼馬溫) — the Ming-dynasty palace stable bureau provides the
      novel its joke: a real Ming office is given to Wukong as
      the lowest unranked sinecure, and the title pun (*BanMaWen*
      homophones with *pi ma wen*, plague-warding monkey) is a
      Chinese folk belief that a monkey kept in a stable wards
      off horse-pestilence — the post Heaven offers Wukong is
      literally the folk-belief role of a stable-monkey"
    - >
      "The Heavenly King Virūḍhaka (Zengzhang Tianwang 增長天王) —
      the southern of the Four Heavenly Kings (Si Da Tianwang
      四大天王) of Buddhist cosmology, the *Increase-and-Grow* king
      who guards the south; the novel uses him as gatekeeper of
      the Southern Gate of Heaven because the south is his
      directional charge"
    - >
      "The seven Great Sages and the Bull Demon King — the
      sworn-brotherhood of seven 'Great Sage' titled demon-kings
      established in this chapter and dissolved across the next
      sixty: the Bull Demon King (Niu Mowang 牛魔王) returns most
      famously as the Princess Iron-Fan's husband and Wukong's
      antagonist in the Flaming Mountains episode of Volume 3;
      the Macaque and Lemur-Monkey kings return as variant-Wukong
      doubles; the others appear and pass"
    - >
      "The *zhao an* (招安) amnesty-and-recruitment doctrine, second
      iteration — having brought the rebel up to office in
      Episode 3 and watched the office fail, the Great White
      Planet of Venus reformulates the policy as title-without-
      office in this chapter; the same doctrine is run through
      one more iteration in Volume 2 with the *Buddha-Victorious*
      title before Heaven gives up on absorption and falls back on
      force"
